name: Update portable source snapshot

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-source-master
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - name: Generate, verify and publish snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin master
            git checkout --detach origin/master
            source_revision=$(git rev-parse HEAD)
            python3 scripts/npm_offline.py verify portable-source .
            cp scripts/npm_offline.py portable-source/npm_offline.py
            # npm-only changes have their own payload. Preserve the original
            # source parts and source revision instead of repacking them.
            snapshot_revision=$(python3 -c 'import json; print(json.load(open("portable-source/manifest.json"))["sourceRevision"])')
            if git merge-base --is-ancestor "$snapshot_revision" HEAD && \
               ! git diff --name-only "$snapshot_revision" HEAD | grep -Ev '^(portable-source/|scripts/(npm_offline|test_npm_offline)\.py$|\.github/workflows/portable-source\.yml$)' >/dev/null; then
              echo 'npm-only update: preserving ordinary source parts.'
              python3 scripts/portable_source.py verify portable-source .
            else
              python3 scripts/update_portable_source.py
            fi
            git add -- portable-source/manifest.json portable-source/portable_source.py
            git add -- portable-source/npm_offline.py portable-source/npm-manifest.json
            git add -A -- 'portable-source/source-*.txt'
            git add -A -- 'portable-source/npm-source-*.txt'
            if git diff --cached --quiet; then
              echo 'Portable source snapshot is current.'
              exit 0
            fi
            git commit -m "chore: refresh portable sources for $source_revision"
            git fetch --no-tags origin master
            if [ "$(git rev-parse origin/master)" != "$source_revision" ]; then
              echo 'Master advanced; regenerate from the new source revision.'
              continue
            fi
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            git fetch --no-tags origin master
            if [ "$(git rev-parse origin/master)" = "$source_revision" ]; then
              echo 'Push denied without a concurrent source change; check branch permissions.' >&2
              exit 1
            fi
          done
          echo 'Master kept changing during generation; rerun this workflow.' >&2
          exit 1
