---
- name: Проверка владения корнем данных общего проекта с помощью существующей защиты пути
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_user: platform-automation
  tasks:
    - name: Создать защищённый временный родительский каталог QA в /var/lib
      ansible.builtin.tempfile:
        path: /var/lib
        state: directory
        prefix: platform-installer-managed-data-root-qa-
      become: true
      register: _platform_managed_data_root_qa_parent

    - name: Выполнить восстановление общего корня и проверить политику
      block:
        - name: Установить изолированный путь, принадлежащий несвязанной встроенной учетной записи
          ansible.builtin.set_fact:
            _platform_managed_data_root_qa_path: "{{ _platform_managed_data_root_qa_parent.path }}/data"

        - name: Требовать тестовую учетную запись, используемую для случая неуправляемого владельца
          ansible.builtin.command:
            argv: [getent, passwd, nobody]
          changed_when: false

        - name: Создать корень в сломанном состоянии, принадлежащем службе
          ansible.builtin.file:
            path: "{{ _platform_managed_data_root_qa_path }}"
            state: directory
            owner: nobody
            mode: '0700'
          become: true

        - name: Требовать проверки, чтобы отклонить неправильный корневой владелец
          block:
            - ansible.builtin.include_role:
                name: platform.core.managed_data_path_guard
                apply:
                  become: true
              vars:
                platform_managed_data_path: "{{ _platform_managed_data_root_qa_path }}/qa-redis"
                platform_managed_data_owner: redis
                platform_managed_data_root_directory: "{{ _platform_managed_data_root_qa_path }}"
                platform_managed_data_root_owner: "{{ ansible_user }}"
                platform_managed_data_root_verify_only: true
            - ansible.builtin.fail:
                msg: PROJECT_DATA_ROOT_INVALID_OWNER_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'PROJECT_DATA_ROOT_OWNERSHIP_INVALID' in (ansible_failed_result | to_json)"
                  - "'PROJECT_DATA_ROOT_INVALID_OWNER_ADMITTED' not in (ansible_failed_result | to_json)"

        - name: Согласование общего корня с техническим пользователем SSH
          ansible.builtin.include_role:
            name: platform.core.managed_data_path_guard
            apply:
              become: true
          vars:
            platform_managed_data_path: "{{ _platform_managed_data_root_qa_path }}/qa-redis"
            platform_managed_data_owner: redis
            platform_managed_data_root_directory: "{{ _platform_managed_data_root_qa_path }}"
            platform_managed_data_root_owner: "{{ ansible_user }}"

        - name: Проверка согласованного общего корня
          ansible.builtin.stat:
            path: "{{ _platform_managed_data_root_qa_path }}"
            follow: false
          become: true
          register: _platform_managed_data_root_qa_stat

        - name: Требовать владение техническим пользователем и режим 0755
          ansible.builtin.assert:
            that:
              - _platform_managed_data_root_qa_stat.stat.pw_name == ansible_user
              - _platform_managed_data_root_qa_stat.stat.mode == '0755'

        - name: Убедиться, что корень /var/lib по умолчанию никогда не используется
          block:
            - ansible.builtin.stat:
                path: /var/lib
                follow: false
              become: true
              register: _platform_var_lib_before

            - ansible.builtin.include_role:
                name: platform.core.managed_data_path_guard
                apply:
                  become: true
              vars:
                platform_managed_data_path: /var/lib/platform-installer-managed-data-root-qa-default
                platform_managed_data_owner: platform-automation
                platform_managed_data_root_directory: /var/lib
                platform_managed_data_root_owner: "{{ ansible_user }}"

            - ansible.builtin.stat:
                path: /var/lib
                follow: false
              become: true
              register: _platform_var_lib_after

            - ansible.builtin.assert:
                that:
                  - _platform_var_lib_before.stat.pw_name == 'root'
                  - _platform_var_lib_before.stat.mode == '0755'
                  - _platform_var_lib_after.stat.pw_name == _platform_var_lib_before.stat.pw_name
                  - _platform_var_lib_after.stat.mode == _platform_var_lib_before.stat.mode

      always:
        - name: Удалить временный родительский каталог QA
          ansible.builtin.file:
            path: "{{ _platform_managed_data_root_qa_parent.path }}"
            state: absent
          become: true
