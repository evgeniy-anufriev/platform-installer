---
- name: Проверка безопасности пути управляемых данных без изменения цели
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешить предполагаемый каталог данных в var lib
      ansible.builtin.include_role:
        name: platform.core.managed_data_path_guard
      vars:
        platform_managed_data_path: /var/lib/platform-installer-guard-qa-absent
        platform_managed_data_owner: platform-automation

    - name: Разрешить предполагаемый каталог данных в точке монтирования
      ansible.builtin.include_role:
        name: platform.core.managed_data_path_guard
      vars:
        platform_managed_data_path: /mnt/platform-installer-guard-qa-absent
        platform_managed_data_owner: platform-automation

    - name: Отклонить каталог данных в дереве конфигурации системы
      block:
        - ansible.builtin.include_role:
            name: platform.core.managed_data_path_guard
          vars:
            platform_managed_data_path: /etc/platform-installer-guard-qa
            platform_managed_data_owner: platform-automation
        - ansible.builtin.fail:
            msg: UNSAFE_MANAGED_DATA_PATH_ADMITTED
      rescue:
        - ansible.builtin.assert:
            that:
              - "'MANAGED_DATA_PATH_UNSAFE' in (ansible_failed_result | to_json)"
              - "'UNSAFE_MANAGED_DATA_PATH_ADMITTED' not in (ansible_failed_result | to_json)"
