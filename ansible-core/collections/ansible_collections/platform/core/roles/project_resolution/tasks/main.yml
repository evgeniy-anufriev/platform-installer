---
- name: Чтение результата разрешения неизменившегося проекта
  platform.core.project_resolution:
    operation: load
  register: _project_resolution_cache
  no_log: true

- name: Проверка общих настроек проекта
  ansible.builtin.include_role:
    name: platform.core.project_settings
  when: not _project_resolution_cache.hit

- name: Вычисление параметров библиотек приложений
  ansible.builtin.include_role:
    name: platform.core.resolve_application_libraries
  when:
    - not _project_resolution_cache.hit
    - platform_desired_state.applicationLibraryDeployments is defined

- name: Формирование результата разрешения проекта
  platform.core.project_snapshot:
    project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
    service_catalog_path: "{{ platform_service_catalog_path }}"
    installer_owned_paths: "{{ platform_installer_owned_paths | default([]) }}"
    desired_only: true
    resolved_result: "{{ _project_resolution_cache.result if _project_resolution_cache.hit else omit }}"
  register: platform_project_resolution
  no_log: true

- name: Сохранение результата разрешения проекта
  platform.core.project_resolution:
    operation: store
    result: "{{ platform_project_resolution }}"
  when: not _project_resolution_cache.hit
  no_log: true

- name: Дополнение результата актуальными сведениями об образах
  platform.core.project_snapshot:
    resolved_result: "{{ platform_project_resolution }}"
  register: platform_project_resolution
