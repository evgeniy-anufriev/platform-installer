---
- name: Resolve managed PKI inputs using normal role variable precedence
  ansible.builtin.include_tasks: resolve.yml

- name: Validate PKI materialization runtime contract
  ansible.builtin.assert:
    that:
      - platform_pki_project_id | length > 0
      - platform_pki_requests is iterable
      - platform_pki_materialization_plans is iterable
      - platform_pki_secret_files is mapping
      - platform_pki_reissue_request_ids is sequence
      - platform_pki_reissue_request_ids is not string
      - platform_pki_reissue_request_ids | difference(platform_pki_requests | map(attribute='id') | list) | length == 0
    fail_msg: PKI_MATERIALIZATION_RUNTIME_INVALID

- name: Prepare protected PKI execution roots
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_pki_owner }}"
    group: "{{ platform_pki_group }}"
    mode: '0700'
  loop:
    - "{{ platform_pki_state_root }}/{{ platform_pki_project_id }}/authorities"
    - "{{ platform_pki_state_root }}/{{ platform_pki_project_id }}/requests"
    - "{{ platform_pki_runtime_root }}"
  when: platform_pki_requests | length > 0

- name: Materialize resolved PKI certificate requests
  ansible.builtin.include_tasks: request.yml
  loop: "{{ platform_pki_requests | sort(attribute='id') | list }}"
  loop_control:
    loop_var: platform_pki_request
    label: "{{ platform_pki_request.id }}"
  when: platform_pki_requests | length > 0
