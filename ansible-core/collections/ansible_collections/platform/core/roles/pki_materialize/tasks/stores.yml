---
- name: Согласование хранилищ PKI с проверенным материалом PEM
  block:
    - name: Проверить каталог назначения запроса PKI без следующих ссылок
      ansible.builtin.stat:
        path: "{{ _platform_pki_request_dir }}"
        follow: false
      register: _platform_pki_request_directory_stat
      no_log: true

    - name: Требовать защищенный каталог назначения обычного запроса PKI
      ansible.builtin.assert:
        that:
          - _platform_pki_request_directory_stat.stat.isdir | default(false)
          - not (_platform_pki_request_directory_stat.stat.islnk | default(false))
          - _platform_pki_request_directory_stat.stat.pw_name == platform_pki_owner
          - _platform_pki_request_directory_stat.stat.mode == '0700'
        fail_msg: PKI_STORE_PATH_UNSAFE
      no_log: true

    - name: Создать частный промежуточный каталог хранилища PKI с той же файловой системой
      ansible.builtin.tempfile:
        state: directory
        path: "{{ _platform_pki_request_dir }}"
        prefix: .pki-stores-
      register: _platform_pki_store_stage
      changed_when: false
      no_log: true

    - name: Обеспечить принудительное использование частного промежуточного каталога хранилища PKI
      ansible.builtin.file:
        path: "{{ _platform_pki_store_stage.path }}"
        state: directory
        owner: "{{ platform_pki_owner }}"
        group: "{{ platform_pki_group }}"
        mode: '0700'
      changed_when: false
      no_log: true

    - name: Проверка авторитетных файлов PKI PEM без перехода по ссылкам
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ _platform_pki_authority_dir }}/ca.crt"
        - "{{ _platform_pki_request_dir }}/leaf.key"
        - "{{ _platform_pki_request_dir }}/leaf.crt"
      register: _platform_pki_authoritative_pem_stats
      no_log: true

    - name: Требовать защищенные регулярные авторитетные файлы PKI PEM
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg | default(false)
          - item.stat.pw_name == platform_pki_owner
        fail_msg: PKI_AUTHORITATIVE_PEM_INVALID
      loop: "{{ _platform_pki_authoritative_pem_stats.results }}"
      no_log: true

    - name: Принудительное применение защищенных разрешений PEM перед проверкой и созданием хранилища
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ platform_pki_owner }}"
        group: "{{ platform_pki_group }}"
        mode: '0600'
      loop:
        - "{{ _platform_pki_authority_dir }}/ca.crt"
        - "{{ _platform_pki_request_dir }}/leaf.key"
        - "{{ _platform_pki_request_dir }}/leaf.crt"
      no_log: true

    - name: Перепроверить защищенные разрешения PEM
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ _platform_pki_authority_dir }}/ca.crt"
        - "{{ _platform_pki_request_dir }}/leaf.key"
        - "{{ _platform_pki_request_dir }}/leaf.crt"
      register: _platform_pki_protected_pem_stats
      no_log: true

    - name: Требовать разрешения PEM только для владельца
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - item.stat.pw_name == platform_pki_owner
          - item.stat.mode == '0600'
        fail_msg: PKI_AUTHORITATIVE_PEM_INVALID
      loop: "{{ _platform_pki_protected_pem_stats.results }}"
      no_log: true

    - name: Проверка существующей цепочки управляемых конечных сертификатов перед работой с хранилищем
      ansible.builtin.command:
        argv:
          - openssl
          - verify
          - -CAfile
          - "{{ _platform_pki_authority_dir }}/ca.crt"
          - "{{ _platform_pki_request_dir }}/leaf.crt"
      register: _platform_pki_existing_leaf_chain
      changed_when: false
      failed_when: false
      no_log: true

    - name: Потребовать, чтобы существующий конечный сертификат был связан с управляемым CA
      ansible.builtin.assert:
        that:
          - _platform_pki_existing_leaf_chain.rc == 0
        fail_msg: PKI_AUTHORITATIVE_PEM_CHAIN_INVALID
      no_log: true

    - name: Получить открытый ключ из авторитетного листового закрытого ключа
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ _platform_pki_request_dir }}/leaf.key"
          - -pubout
          - -out
          - "{{ _platform_pki_store_stage.path }}/source-key.pub"
      changed_when: false
      no_log: true

    - name: Получение открытого ключа из авторитетного листового сертификата
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ _platform_pki_request_dir }}/leaf.crt"
          - -pubkey
          - -noout
          - -out
          - "{{ _platform_pki_store_stage.path }}/source-cert.pub"
      changed_when: false
      no_log: true

    - name: Запросить соответствие авторитетного листового ключа и сертификата
      ansible.builtin.command:
        argv:
          - cmp
          - -s
          - "{{ _platform_pki_store_stage.path }}/source-key.pub"
          - "{{ _platform_pki_store_stage.path }}/source-cert.pub"
      register: _platform_pki_leaf_key_certificate_match
      changed_when: false
      failed_when: false
      no_log: true

    - name: Отклонить несовпадающий авторитетный листовой ключ и сертификат
      ansible.builtin.assert:
        that:
          - _platform_pki_leaf_key_certificate_match.rc == 0
        fail_msg: PKI_AUTHORITATIVE_PEM_KEY_CERTIFICATE_MISMATCH
      no_log: true

    - name: Экспорт авторитетного листового сертификата как DER для точного сравнения хранилищ
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ _platform_pki_request_dir }}/leaf.crt"
          - -outform
          - DER
          - -out
          - "{{ _platform_pki_store_stage.path }}/expected-leaf.der"
      changed_when: false
      no_log: true

    - name: Экспорт авторитетного сертификата CA как DER для точного сравнения хранилищ
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - "{{ _platform_pki_authority_dir }}/ca.crt"
          - -outform
          - DER
          - -out
          - "{{ _platform_pki_store_stage.path }}/expected-ca.der"
      changed_when: false
      no_log: true

    - name: Проверить существующие производные хранилища PKI без перехода по ссылкам
      ansible.builtin.stat:
        path: "{{ _platform_pki_request_dir }}/{{ item }}"
        follow: false
      loop: [keystore.p12, truststore.p12]
      register: _platform_pki_store_stats
      no_log: true

    - name: Отклонить замененные или незащищенные существующие пути хранения PKI
      ansible.builtin.assert:
        that:
          - not item.stat.exists or (item.stat.isreg | default(false))
          - not item.stat.exists or item.stat.pw_name == platform_pki_owner
          - not item.stat.exists or item.stat.mode == '0600'
        fail_msg: PKI_STORE_PATH_UNSAFE
      loop: "{{ _platform_pki_store_stats.results }}"
      no_log: true

    - name: Проверка существующего пароля хранилища ключей PKCS12 и ожидаемого псевдонима
      ansible.builtin.command:
        argv:
          - keytool
          - -list
          - -v
          - -storetype
          - PKCS12
          - -keystore
          - "{{ _platform_pki_request_dir }}/keystore.p12"
          - -alias
          - "{{ _platform_pki_request_plans[0].keyAlias }}"
          - -storepass:file
          - "{{ _platform_pki_password_file }}"
      register: _platform_pki_existing_keystore_check
      changed_when: false
      failed_when: false
      when: _platform_pki_store_stats.results[0].stat.exists
      no_log: true

    - name: Проверка существующего пароля хранилища доверенных сертификатов PKCS12 и ожидаемого псевдонима
      ansible.builtin.command:
        argv:
          - keytool
          - -list
          - -v
          - -storetype
          - PKCS12
          - -keystore
          - "{{ _platform_pki_request_dir }}/truststore.p12"
          - -alias
          - "{{ _platform_pki_request_plans[0].trustAlias }}"
          - -storepass:file
          - "{{ _platform_pki_password_file }}"
      register: _platform_pki_existing_truststore_check
      changed_when: false
      failed_when: false
      when: _platform_pki_store_stats.results[1].stat.exists
      no_log: true

    - name: Экспорт существующего сертификата хранилища ключей для проверки личности
      ansible.builtin.command:
        argv:
          - keytool
          - -exportcert
          - -storetype
          - PKCS12
          - -keystore
          - "{{ _platform_pki_request_dir }}/keystore.p12"
          - -alias
          - "{{ _platform_pki_request_plans[0].keyAlias }}"
          - -storepass:file
          - "{{ _platform_pki_password_file }}"
          - -file
          - "{{ _platform_pki_store_stage.path }}/existing-keystore.der"
      register: _platform_pki_existing_keystore_export
      changed_when: false
      failed_when: false
      when: (_platform_pki_existing_keystore_check.rc | default(1)) == 0
      no_log: true

    - name: Экспорт существующего сертификата хранилища доверенных сертификатов для проверки личности
      ansible.builtin.command:
        argv:
          - keytool
          - -exportcert
          - -storetype
          - PKCS12
          - -keystore
          - "{{ _platform_pki_request_dir }}/truststore.p12"
          - -alias
          - "{{ _platform_pki_request_plans[0].trustAlias }}"
          - -storepass:file
          - "{{ _platform_pki_password_file }}"
          - -file
          - "{{ _platform_pki_store_stage.path }}/existing-truststore.der"
      register: _platform_pki_existing_truststore_export
      changed_when: false
      failed_when: false
      when: (_platform_pki_existing_truststore_check.rc | default(1)) == 0
      no_log: true

    - name: Извлечение существующего закрытого ключа хранилища ключей для проверки личности
      ansible.builtin.command:
        argv:
          - openssl
          - pkcs12
          - -in
          - "{{ _platform_pki_request_dir }}/keystore.p12"
          - -nocerts
          - -nodes
          - -passin
          - "file:{{ _platform_pki_password_file }}"
          - -out
          - "{{ _platform_pki_store_stage.path }}/existing-keystore.key"
      register: _platform_pki_existing_keystore_key
      changed_when: false
      failed_when: false
      when: (_platform_pki_existing_keystore_check.rc | default(1)) == 0
      no_log: true

    - name: Ограничить извлеченные существующие разрешения закрытого ключа
      ansible.builtin.file:
        path: "{{ _platform_pki_store_stage.path }}/existing-keystore.key"
        owner: "{{ platform_pki_owner }}"
        group: "{{ platform_pki_group }}"
        mode: '0600'
      when: (_platform_pki_existing_keystore_key.rc | default(1)) == 0
      changed_when: false
      no_log: true

    - name: Получить открытый ключ из существующего хранилища ключей PKCS12
      ansible.builtin.command:
        argv:
          - openssl
          - pkey
          - -in
          - "{{ _platform_pki_store_stage.path }}/existing-keystore.key"
          - -pubout
          - -out
          - "{{ _platform_pki_store_stage.path }}/existing-keystore.pub"
      register: _platform_pki_existing_keystore_public
      changed_when: false
      failed_when: false
      when: (_platform_pki_existing_keystore_key.rc | default(1)) == 0
      no_log: true

    - name: Сравнить текущее содержимое хранилища PKCS12 с авторитетным PEM
      ansible.builtin.command:
        argv: [cmp, -s, "{{ item.left }}", "{{ item.right }}"]
      loop:
        - left: "{{ _platform_pki_store_stage.path }}/existing-keystore.der"
          right: "{{ _platform_pki_store_stage.path }}/expected-leaf.der"
          name: keystore_certificate
        - left: "{{ _platform_pki_store_stage.path }}/existing-truststore.der"
          right: "{{ _platform_pki_store_stage.path }}/expected-ca.der"
          name: truststore_certificate
        - left: "{{ _platform_pki_store_stage.path }}/existing-keystore.pub"
          right: "{{ _platform_pki_store_stage.path }}/source-key.pub"
          name: keystore_private_key
      register: _platform_pki_existing_store_comparisons
      changed_when: false
      failed_when: false
      when:
        - (_platform_pki_existing_keystore_export.rc | default(1)) == 0
        - (_platform_pki_existing_truststore_export.rc | default(1)) == 0
        - (_platform_pki_existing_keystore_public.rc | default(1)) == 0
      no_log: true

    - name: Определить, можно ли повторно использовать оба существующих хранилища PKCS12
      ansible.builtin.set_fact:
        _platform_pki_existing_stores_match: >-
          {{ (_platform_pki_existing_keystore_check.rc | default(1)) == 0 and
             (_platform_pki_existing_truststore_check.rc | default(1)) == 0 and
             (_platform_pki_existing_store_comparisons.results | default([]) | length) == 3 and
             (_platform_pki_existing_store_comparisons.results | default([]) | map(attribute='rc') | select('equalto', 0) | list | length) == 3 }}

    - name: Восстановить и опубликовать полную пару PKCS12, если пароль или содержимое отличаются
      when: not (_platform_pki_existing_stores_match | bool)
      block:
        - name: Создать замену хранилища ключей PKCS12 на основе проверенного PEM
          ansible.builtin.command:
            argv:
              - openssl
              - pkcs12
              - -export
              - -name
              - "{{ _platform_pki_request_plans[0].keyAlias }}"
              - -inkey
              - "{{ _platform_pki_request_dir }}/leaf.key"
              - -in
              - "{{ _platform_pki_request_dir }}/leaf.crt"
              - -certfile
              - "{{ _platform_pki_authority_dir }}/ca.crt"
              - -out
              - "{{ _platform_pki_store_stage.path }}/keystore.p12"
              - -passout
              - "file:{{ _platform_pki_password_file }}"
          changed_when: false
          no_log: true

        - name: Создать замену хранилища доверенных сертификатов PKCS12 на основе проверенного CA PEM
          ansible.builtin.command:
            argv:
              - keytool
              - -importcert
              - -noprompt
              - -storetype
              - PKCS12
              - -alias
              - "{{ _platform_pki_request_plans[0].trustAlias }}"
              - -file
              - "{{ _platform_pki_authority_dir }}/ca.crt"
              - -keystore
              - "{{ _platform_pki_store_stage.path }}/truststore.p12"
              - -storepass:file
              - "{{ _platform_pki_password_file }}"
          changed_when: false
          no_log: true

        - name: Ограничить поэтапные разрешения кандидата PKCS12
          ansible.builtin.file:
            path: "{{ _platform_pki_store_stage.path }}/{{ item }}"
            owner: "{{ platform_pki_owner }}"
            group: "{{ platform_pki_group }}"
            mode: '0600'
          loop: [keystore.p12, truststore.p12]
          changed_when: false
          no_log: true

        - name: Проверка псевдонима хранилища ключей-кандидатов и типа записи
          ansible.builtin.command:
            argv:
              - keytool
              - -list
              - -v
              - -storetype
              - PKCS12
              - -keystore
              - "{{ _platform_pki_store_stage.path }}/keystore.p12"
              - -alias
              - "{{ _platform_pki_request_plans[0].keyAlias }}"
              - -storepass:file
              - "{{ _platform_pki_password_file }}"
          register: _platform_pki_candidate_keystore_check
          changed_when: false
          no_log: true

        - name: Проверка псевдонима и типа записи хранилища доверенных сертификатов кандидата
          ansible.builtin.command:
            argv:
              - keytool
              - -list
              - -v
              - -storetype
              - PKCS12
              - -keystore
              - "{{ _platform_pki_store_stage.path }}/truststore.p12"
              - -alias
              - "{{ _platform_pki_request_plans[0].trustAlias }}"
              - -storepass:file
              - "{{ _platform_pki_password_file }}"
          register: _platform_pki_candidate_truststore_check
          changed_when: false
          no_log: true

        - name: Экспорт сертификата хранилища ключей замены
          ansible.builtin.command:
            argv:
              - keytool
              - -exportcert
              - -storetype
              - PKCS12
              - -keystore
              - "{{ _platform_pki_store_stage.path }}/keystore.p12"
              - -alias
              - "{{ _platform_pki_request_plans[0].keyAlias }}"
              - -storepass:file
              - "{{ _platform_pki_password_file }}"
              - -file
              - "{{ _platform_pki_store_stage.path }}/candidate-keystore.der"
          changed_when: false
          no_log: true

        - name: Извлечение замещающего закрытого ключа хранилища ключей
          ansible.builtin.command:
            argv:
              - openssl
              - pkcs12
              - -in
              - "{{ _platform_pki_store_stage.path }}/keystore.p12"
              - -nocerts
              - -nodes
              - -passin
              - "file:{{ _platform_pki_password_file }}"
              - -out
              - "{{ _platform_pki_store_stage.path }}/candidate-keystore.key"
          changed_when: false
          no_log: true

        - name: Ограничить разрешения для поэтапно извлеченного закрытого ключа
          ansible.builtin.file:
            path: "{{ _platform_pki_store_stage.path }}/candidate-keystore.key"
            owner: "{{ platform_pki_owner }}"
            group: "{{ platform_pki_group }}"
            mode: '0600'
          changed_when: false
          no_log: true

        - name: Получение открытого ключа из замещающего хранилища ключей
          ansible.builtin.command:
            argv:
              - openssl
              - pkey
              - -in
              - "{{ _platform_pki_store_stage.path }}/candidate-keystore.key"
              - -pubout
              - -out
              - "{{ _platform_pki_store_stage.path }}/candidate-keystore.pub"
          changed_when: false
          no_log: true

        - name: Экспорт сертификата хранилища доверенных сертификатов замены
          ansible.builtin.command:
            argv:
              - keytool
              - -exportcert
              - -storetype
              - PKCS12
              - -keystore
              - "{{ _platform_pki_store_stage.path }}/truststore.p12"
              - -alias
              - "{{ _platform_pki_request_plans[0].trustAlias }}"
              - -storepass:file
              - "{{ _platform_pki_password_file }}"
              - -file
              - "{{ _platform_pki_store_stage.path }}/candidate-truststore.der"
          changed_when: false
          no_log: true

        - name: Требовать замены хранилищ для соответствия авторитетному идентификатору PEM
          ansible.builtin.command:
            argv: [cmp, -s, "{{ item.left }}", "{{ item.right }}"]
          loop:
            - left: "{{ _platform_pki_store_stage.path }}/candidate-keystore.der"
              right: "{{ _platform_pki_store_stage.path }}/expected-leaf.der"
            - left: "{{ _platform_pki_store_stage.path }}/candidate-truststore.der"
              right: "{{ _platform_pki_store_stage.path }}/expected-ca.der"
            - left: "{{ _platform_pki_store_stage.path }}/candidate-keystore.pub"
              right: "{{ _platform_pki_store_stage.path }}/source-key.pub"
          changed_when: false
          no_log: true

        - name: Требовать замены типов записей PKCS12
          ansible.builtin.assert:
            that:
              - "'PrivateKeyEntry' in _platform_pki_candidate_keystore_check.stdout"
              - "'trustedCertEntry' in _platform_pki_candidate_truststore_check.stdout"
            fail_msg: PKI_STORE_CANDIDATE_INVALID
          no_log: true

        - name: Атомарная публикация проверенного хранилища ключей PKCS12
          ansible.builtin.copy:
            src: "{{ _platform_pki_store_stage.path }}/keystore.p12"
            dest: "{{ _platform_pki_request_dir }}/keystore.p12"
            remote_src: true
            owner: "{{ platform_pki_owner }}"
            group: "{{ platform_pki_group }}"
            mode: '0600'
            unsafe_writes: false
          register: _platform_pki_keystore_publish
          no_log: true

        - name: Атомарная публикация проверенного хранилища доверенных сертификатов PKCS12
          ansible.builtin.copy:
            src: "{{ _platform_pki_store_stage.path }}/truststore.p12"
            dest: "{{ _platform_pki_request_dir }}/truststore.p12"
            remote_src: true
            owner: "{{ platform_pki_owner }}"
            group: "{{ platform_pki_group }}"
            mode: '0600'
            unsafe_writes: false
          register: _platform_pki_truststore_publish
          no_log: true

    - name: Перепроверить опубликованные хранилища PKCS12
      ansible.builtin.command:
        argv:
          - keytool
          - -list
          - -storetype
          - PKCS12
          - -keystore
          - "{{ _platform_pki_request_dir }}/{{ item }}"
          - -storepass:file
          - "{{ _platform_pki_password_file }}"
      loop: [keystore.p12, truststore.p12]
      changed_when: false
      no_log: true
  always:
    - name: Удалить частный промежуточный каталог хранилища PKI
      ansible.builtin.file:
        path: "{{ _platform_pki_store_stage.path }}"
        state: absent
      when: _platform_pki_store_stage.path is defined
      changed_when: false
      no_log: true
