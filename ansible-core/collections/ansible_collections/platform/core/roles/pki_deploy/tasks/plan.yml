---
- name: Reject unsafe PKI target directory
  ansible.builtin.assert:
    that:
      - "platform_pki_plan.targetDirectory is match('^/.+')"
      - "platform_pki_plan.targetDirectory not in ['/', '/etc', '/var', '/var/lib']"
      - "'/..' not in platform_pki_plan.targetDirectory"
      - "'/pki' in platform_pki_plan.targetDirectory"
    fail_msg: PKI_TARGET_DIRECTORY_UNSAFE

- name: Prepare deployment-owned PKI target directory
  ansible.builtin.file:
    path: "{{ platform_pki_plan.targetDirectory }}"
    state: directory
    owner: "{{ platform_pki_owner }}"
    group: "{{ platform_pki_group }}"
    mode: '0700'

- name: Deploy immutable PEM and Java PKI material
  ansible.builtin.copy:
    src: "{{ platform_pki_state_root }}/{{ _platform_pki_effective_project_id }}/{{ item.source }}"
    dest: "{{ platform_pki_plan.targetDirectory }}/{{ item.destination }}"
    owner: "{{ platform_pki_owner }}"
    group: "{{ platform_pki_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {source: "authorities/{{ platform_pki_plan.authorityId }}/ca.crt", destination: ca-chain.pem, mode: '0644'}
    - {source: "requests/{{ platform_pki_plan.requestId }}/leaf.crt", destination: certificate.pem, mode: '0644'}
    - {source: "requests/{{ platform_pki_plan.requestId }}/leaf.key", destination: private-key.pem, mode: '0600'}
    - {source: "requests/{{ platform_pki_plan.requestId }}/keystore.p12", destination: keystore.p12, mode: '0600'}
    - {source: "requests/{{ platform_pki_plan.requestId }}/truststore.p12", destination: truststore.p12, mode: '0600'}
  no_log: true

- name: Record non-secret target materialization fingerprint
  ansible.builtin.copy:
    content: "{{ platform_pki_plan.materializationFingerprint }}\n"
    dest: "{{ platform_pki_plan.targetDirectory }}/materialization-fingerprint"
    owner: "{{ platform_pki_owner }}"
    group: "{{ platform_pki_group }}"
    mode: '0644'
