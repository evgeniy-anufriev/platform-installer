---
- name: Определение идентификатора проекта PKI по проекции узла выполнения
  ansible.builtin.set_fact:
    _platform_pki_effective_project_id: "{{ platform_pki_project_id if platform_pki_project_id | length > 0 else hostvars['localhost'].platform_pki_project_id | default('') }}"

- name: Выбор планов подготовки PKI для целевого узла
  ansible.builtin.set_fact:
    _platform_pki_local_plans: "{{ (platform_pki_materialization_plans | default(hostvars['localhost'].platform_pki_materialization_plans | default([]), true)) | selectattr('hostId', 'equalto', inventory_hostname) | list }}"

- name: Согласование сертификатов проекта CA в системном доверии
  ansible.builtin.include_tasks: trust_anchors.yml
  when: _platform_pki_local_plans | length > 0
  tags: platform_installer_pki_materialization

- name: Атомарное развёртывание PKI-файлов целевого узла
  ansible.builtin.include_tasks: plan.yml
  loop: "{{ _platform_pki_local_plans | sort(attribute='id') | list }}"
  loop_control:
    loop_var: platform_pki_plan
    label: "{{ platform_pki_plan.id }}"
  tags: platform_installer_pki_materialization

- name: Проверка ранее развернутого материала PKI перед активацией службы
  ansible.builtin.include_tasks: integrity.yml
  loop: "{{ _platform_pki_local_plans | sort(attribute='id') | list }}"
  loop_control:
    loop_var: platform_pki_plan
    label: "{{ platform_pki_plan.id }}"
  when: "'platform_installer_pki_materialization' in ansible_skip_tags"
