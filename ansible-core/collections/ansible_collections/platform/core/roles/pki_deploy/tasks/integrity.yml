---
- name: Проверка ранее примененной границы целевого каталога PKI
  ansible.builtin.assert:
    that:
      - "platform_pki_plan.targetDirectory is match('^/.+')"
      - "platform_pki_plan.targetDirectory not in ['/', '/etc', '/var', '/var/lib']"
      - "'/..' not in platform_pki_plan.targetDirectory"
      - "'/pki' in platform_pki_plan.targetDirectory"
    fail_msg: PKI_TARGET_DIRECTORY_UNSAFE

- name: Проверка файлов PKI доверенного источника без раскрытия содержимого
  ansible.builtin.stat:
    path: "{{ platform_pki_state_root }}/{{ _platform_pki_effective_project_id }}/{{ item }}"
    follow: false
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  delegate_to: localhost
  become: false
  loop:
    - "authorities/{{ platform_pki_plan.authorityId }}/ca.crt"
    - "requests/{{ platform_pki_plan.requestId }}/leaf.crt"
    - "requests/{{ platform_pki_plan.requestId }}/leaf.key"
    - "requests/{{ platform_pki_plan.requestId }}/keystore.p12"
    - "requests/{{ platform_pki_plan.requestId }}/truststore.p12"
  register: _platform_pki_integrity_sources
  no_log: true

- name: Требовать читаемый обычный исходный материал PKI
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.checksum is defined
    fail_msg: PKI_SOURCE_MATERIAL_UNAVAILABLE
  loop: "{{ _platform_pki_integrity_sources.results }}"
  no_log: true

- name: Проверить целевой каталог PKI без перехода по ссылкам
  ansible.builtin.stat:
    path: "{{ platform_pki_plan.targetDirectory }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _platform_pki_integrity_directory
  no_log: true

- name: Отклонить замененный целевой каталог PKI
  ansible.builtin.assert:
    that:
      - not (_platform_pki_integrity_directory.stat.exists | default(false)) or (_platform_pki_integrity_directory.stat.isdir | default(false) and not (_platform_pki_integrity_directory.stat.islnk | default(false)))
    fail_msg: PKI_TARGET_DIRECTORY_UNSAFE
  no_log: true

- name: Проверка метаданных развернутого файла PKI за один удаленный обход
  ansible.builtin.find:
    paths: "{{ platform_pki_plan.targetDirectory }}"
    patterns: [ca-chain.pem, certificate.pem, private-key.pem, keystore.p12, truststore.p12, materialization-fingerprint]
    recurse: false
    follow: false
    file_type: any
    get_checksum: false
  register: _platform_pki_integrity_scan
  no_log: true

- name: Хешировать точные обычные файлы PKI, не раскрывая содержимое
  ansible.builtin.command:
    argv:
      - sha256sum
      - '--'
      - "{{ platform_pki_plan.targetDirectory }}/ca-chain.pem"
      - "{{ platform_pki_plan.targetDirectory }}/certificate.pem"
      - "{{ platform_pki_plan.targetDirectory }}/private-key.pem"
      - "{{ platform_pki_plan.targetDirectory }}/keystore.p12"
      - "{{ platform_pki_plan.targetDirectory }}/truststore.p12"
      - "{{ platform_pki_plan.targetDirectory }}/materialization-fingerprint"
  when: (_platform_pki_integrity_scan.files | selectattr('isreg', 'equalto', true) | list | length) == 6
  register: _platform_pki_integrity_hashes
  changed_when: false
  no_log: true

- name: Нормализация проверенных метаданных PKI и контрольных сумм SHA256
  vars:
    _platform_pki_normalized_metadata: >-
      {% set result = [] %}
      {% for entry in [{'name': 'ca-chain.pem', 'mode': '0644', 'source': 0},
                       {'name': 'certificate.pem', 'mode': '0644', 'source': 1},
                       {'name': 'private-key.pem', 'mode': '0600', 'source': 2},
                       {'name': 'keystore.p12', 'mode': '0600', 'source': 3},
                       {'name': 'truststore.p12', 'mode': '0600', 'source': 4},
                       {'name': 'materialization-fingerprint', 'mode': '0644', 'source': 5}] %}
      {% set found = _platform_pki_integrity_scan.files | selectattr('path', 'equalto', platform_pki_plan.targetDirectory ~ '/' ~ entry.name) | list %}
      {% set metadata = (found | first) if found else {'exists': false} %}
      {% set hashes = _platform_pki_integrity_hashes.stdout_lines | default([]) %}
      {% set checksum = (hashes[entry.source].split()[0]) if hashes | length == 6 else '' %}
      {% set ignored = result.append({'item': entry, 'stat': metadata | combine({'checksum': checksum})}) %}
      {% endfor %}
      {{ {'results': result} | to_json }}
  ansible.builtin.set_fact:
    _platform_pki_integrity_targets: '{{ _platform_pki_normalized_metadata | from_json }}'
  no_log: true

- name: Инициализация результата целевой целостности PKI
  ansible.builtin.set_fact:
    _platform_pki_integrity_valid: >-
      {{ (_platform_pki_integrity_directory.stat.isdir | default(false)) and
         (_platform_pki_integrity_directory.stat.mode | default('') == '0700') and
         (_platform_pki_integrity_directory.stat.pw_name | default('') == platform_pki_owner) and
         (_platform_pki_integrity_directory.stat.gr_name | default('') == platform_pki_group) }}
  no_log: true

- name: Сравнить точные байты и разрешения PKI с доверенным источником
  ansible.builtin.set_fact:
    _platform_pki_integrity_valid: >-
      {{ (_platform_pki_integrity_valid | bool) and
         (item.stat.isreg | default(false)) and
         not (item.stat.islnk | default(false)) and
         (item.stat.mode | default('') == item.item.mode) and
         (item.stat.uid | default(-1) == _platform_pki_integrity_directory.stat.uid | default(-2)) and
         (item.stat.gid | default(-1) == _platform_pki_integrity_directory.stat.gid | default(-2)) and
         (item.stat.checksum | default('') == _platform_pki_integrity_sources.results[item.item.source].stat.checksum) }}
  loop: "{{ _platform_pki_integrity_targets.results[:5] }}"
  no_log: true

- name: Сравнить байты отпечатков с примененным планом
  ansible.builtin.set_fact:
    _platform_pki_integrity_fingerprint_matches: "{{ _platform_pki_integrity_targets.results[5].stat.checksum | default('') == ((platform_pki_plan.materializationFingerprint ~ '\n') | hash('sha256')) }}"
  no_log: true

- name: Сравнить точный файл отпечатков материализации
  ansible.builtin.set_fact:
    _platform_pki_integrity_valid: >-
      {{ false not in [
         (_platform_pki_integrity_valid | bool),
         (_platform_pki_integrity_targets.results[5].stat.isreg | default(false)),
         not (_platform_pki_integrity_targets.results[5].stat.islnk | default(false)),
         (_platform_pki_integrity_targets.results[5].stat.mode | default('') == '0644'),
         (_platform_pki_integrity_targets.results[5].stat.uid | default(-1) == _platform_pki_integrity_directory.stat.uid | default(-2)),
         (_platform_pki_integrity_targets.results[5].stat.gid | default(-1) == _platform_pki_integrity_directory.stat.gid | default(-2)),
         (_platform_pki_integrity_fingerprint_matches | bool)
         ] }}
  no_log: true

- name: Исправить материал PKI, не соответствующий прикладному плану
  ansible.builtin.include_tasks: plan.yml
  when: not (_platform_pki_integrity_valid | bool)
