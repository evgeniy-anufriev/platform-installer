---
- name: Использование ранее рассчитанных на контроллере параметров приложений
  ansible.builtin.set_fact:
    platform_application_rows: "{{ hostvars['localhost'].platform_application_rows }}"
  when:
    - hostvars['localhost'].platform_endpoint_sources is not defined
    - hostvars['localhost'].platform_application_rows is defined
  no_log: true

- name: "Вычисление параметров приложений, если источники конечных точек ещё не подготовлены"
  ansible.builtin.include_role:
    name: platform.core.resolve_application_libraries
    apply:
      delegate_to: localhost
  when:
    - hostvars['localhost'].platform_endpoint_sources is not defined
    - platform_application_rows is not defined
    - platform_desired_state.applicationLibraryDeployments | default({}) | length > 0
  run_once: true

- name: Нормализация дополнительных источников через существующую границу конечной точки Core
  platform.core.prepare_application_endpoints:
    service_catalog_path: "{{ platform_service_catalog_path }}"
  register: _platform_endpoint_source_input
  when: hostvars['localhost'].platform_endpoint_sources is not defined
  run_once: true
  delegate_to: localhost
  become: false

- name: "Передача нормализованных источников конечных точек частичному и полному согласованию"
  ansible.builtin.set_fact:
    platform_endpoint_sources: "{{ _platform_endpoint_source_input.sources }}"
  failed_when: _platform_endpoint_source_input.status != 'PASS'
  when: hostvars['localhost'].platform_endpoint_sources is not defined
  run_once: true
  delegate_to: localhost
  delegate_facts: true
