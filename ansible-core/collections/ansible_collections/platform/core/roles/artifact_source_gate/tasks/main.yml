---
- name: Определение утверждённых источников артефактов Core для целевого узла
  ansible.builtin.include_role:
    name: platform.core.artifact_source_resolution
  when: platform_artifact_source_authorities_by_deployment is defined

- name: Проверка разрешённого источника каждого требуемого артефакта сервиса
  ansible.builtin.assert:
    that:
      - platform_resolved_artifact_sources[item.id] is defined
      - platform_resolved_artifact_sources[item.id].kind == 'ResolvedArtifactSource'
      - platform_resolved_artifact_sources[item.id].targetNode == inventory_hostname
      - platform_resolved_artifact_sources[item.id].source in ['REPOSITORY', 'OFFLINE_BUNDLE']
      - platform_resolved_artifact_sources[item.id].reason is string
      - >-
        platform_resolved_artifact_sources[item.id].requirement.name == item.name
  loop: "{{ platform_artifact_requirements }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true
