---
- name: Хэширование объявленного архива на узле выполнения
  ansible.builtin.stat:
    path: "{{ application_archive.path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: application_archive_stat
  no_log: true

- name: Проверка читаемости архива перед целевой записью
  ansible.builtin.command:
    argv: [tar, -tzf, "{{ application_archive.path }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Включение содержимого архива в отпечаток конфигурации
  ansible.builtin.set_fact:
    application_archive_pairs: "{{ application_archive_pairs + [[application_archive.destination, application_archive_stat.stat.checksum]] }}"
    application_archive_checksums: "{{ application_archive_checksums | combine({application_archive.destination: application_archive_stat.stat.checksum}) }}"
  no_log: true
