---
- name: Hash source bytes on the Execution Node
  ansible.builtin.stat:
    path: "{{ application_config.path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: application_source_stat
  no_log: true

- name: Read source bytes for private nonsecret validation
  ansible.builtin.slurp:
    src: "{{ application_config.path }}"
  delegate_to: localhost
  become: false
  register: application_source_bytes
  no_log: true

- name: Retain source path and byte digest for ordinary copy
  ansible.builtin.set_fact:
    application_config_contents: "{{ application_config_contents + [{'destination': application_config.destination, 'path': application_config.path, 'content': application_source_bytes.content, 'encoding': 'base64', 'sha256': application_source_stat.stat.checksum, 'mode': application_config.mode | default('0644')}] }}"
  no_log: true
