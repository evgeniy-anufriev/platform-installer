---
- name: Однократное чтение и хеширование исходного файла на узле выполнения
  platform.core.application_source_file:
    path: "{{ application_config.path }}"
  delegate_to: localhost
  become: false
  register: application_source_bytes
  no_log: true

- name: Сохранение пути исходного файла и контрольной суммы для копирования
  ansible.builtin.set_fact:
    application_config_contents: "{{ application_config_contents + [{'destination': application_config.destination, 'path': application_config.path, 'content': application_source_bytes.content, 'encoding': 'base64', 'sha256': application_source_bytes.sha256, 'mode': application_config.mode | default('0644')}] }}"
  no_log: true
