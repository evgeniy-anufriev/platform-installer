---
- name: Загрузка образа с зафиксированным digest
  block:
    - name: Подготовка сеансовой аутентификации реестра для загрузки образа приложения
      ansible.builtin.include_tasks: registry_auth.yml
    - name: Получение точного манифеста авторизованной платформы
      ansible.builtin.command:
        argv: [docker, pull, "{{ application_runtime_job.authority.repository.reference | platform.core.application_pinned_registry_reference(application_runtime_job.authority.repository.manifestDigest) }}"]
      become_user: "{{ application_runtime_job.account }}"
      environment: "{{ application_registry_environment }}"
      no_log: true
  always:
    - name: Удаление временной аутентификации реестра запроса загрузки образа
      ansible.builtin.file:
        path: "{{ application_registry_auth_stage.path }}"
        state: absent
      when: application_registry_auth_stage.path is defined
      changed_when: false
