---
- name: Привязка всех размещений с общей проекцией узла библиотеки
  ansible.builtin.set_fact:
    application_library_jobs: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list }}"
    application_library_pending_instances: >-
      {{ hostvars['localhost'].application_runtime_inputs.integrations |
         platform.core.application_pending_instances(hostvars['localhost'].platform_application_completed_batches | default([])) }}
  no_log: true

- name: "Проверка одинакового содержимого общей библиотеки у всех потребителей"
  ansible.builtin.assert:
    that:
      - application_library_jobs | map(attribute='libraryPath') | unique | length == 1
      - application_library_jobs | map(attribute='envContent') | unique | length == 1
      - application_library_jobs | map(attribute='baseContent') | unique | length == 1
    fail_msg: APPLICATION_LIBRARY_HOST_PROJECTION_CONFLICT
  no_log: true

- name: Создание каталога библиотеки в проверенном защищённом подкаталоге
  ansible.builtin.file:
    path: "{{ application_library_jobs[0].libraryPath }}"
    state: directory
    owner: "{{ application_library_jobs[0].account }}"
    mode: '0700'

- name: Подготовка библиотеки и выбранных экземпляров
  block:
    - name: Запись владения хостом библиотеки как производного состояния среды выполнения
      ansible.builtin.copy:
        content: "{{ {'project': application_library_jobs[0].projectId, 'library': application_library_id, 'host': inventory_hostname} | to_json(sort_keys=true) }}"
        dest: "{{ application_library_jobs[0].libraryPath }}/.owner.json"
        owner: "{{ application_library_jobs[0].account }}"
        mode: '0600'
    - name: "Однократное создание общих несекретных переменных окружения и базового Compose-файла"
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ application_library_jobs[0].libraryPath }}/{{ item.name }}"
        owner: "{{ application_library_jobs[0].account }}"
        mode: '0600'
      loop:
        - { name: .env, content: "{{ application_library_jobs[0].envContent }}" }
        - { name: "{{ application_library_jobs[0].baseFilename }}", content: "{{ application_library_jobs[0].baseContent }}" }
      no_log: true
    - name: Подготовка и проверка каждого приложения в отдельном проекте Compose
      ansible.builtin.include_tasks: apply_instance.yml
      loop: "{{ application_library_jobs }}"
      when: >-
        (application_runtime_job.libraryId ~ '/' ~ application_runtime_job.instanceId) not in
        application_library_pending_instances
      loop_control:
        loop_var: application_runtime_job

- name: Фиксация успешно подготовленных размещений текущей библиотеки
  ansible.builtin.set_fact:
    application_prepared_instance_ids: >-
      {{ application_library_jobs | map(attribute='instanceId') | list |
         difference(application_library_pending_instances | map('regex_replace', '^' ~ (application_library_id | regex_escape) ~ '/', '') | list) }}
  no_log: true
