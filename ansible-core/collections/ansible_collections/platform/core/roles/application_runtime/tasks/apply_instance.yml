---
- name: Создать точные каталоги конфигурации экземпляра
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ application_runtime_job.account }}"
    mode: '0700'
  loop: "{{ ([application_runtime_job.instancePath ~ '/config'] + (application_runtime_job.configs | map(attribute='destination') | map('dirname') | map('regex_replace', '^', application_runtime_job.instancePath ~ '/config/') | list) + (application_runtime_job.directoryConfigs | map(attribute='destination') | map('dirname') | map('regex_replace', '^', application_runtime_job.instancePath ~ '/config/') | list) + (application_runtime_job.archiveConfigs | map(attribute='destination') | map('dirname') | map('regex_replace', '^', application_runtime_job.instancePath ~ '/config/') | list)) | map('regex_replace', '/+$', '') | unique | list }}"

- name: Применить объявленные режимы каталогов к смонтированным каталогам конфигурации
  ansible.builtin.file:
    path: "{{ application_runtime_job.instancePath }}/config/{{ item.destination }}"
    state: directory
    owner: "{{ application_runtime_job.account }}"
    mode: "{{ item.directory_mode | default('0755') }}"
  loop: "{{ application_runtime_job.directoryConfigs }}"
  no_log: true

- name: Применить объявленные режимы каталогов к вложенным каталогам конфигурации
  ansible.builtin.file:
    path: "{{ application_runtime_job.instancePath }}/config/{{ item.1 }}"
    state: directory
    owner: "{{ application_runtime_job.account }}"
    mode: "{{ item.0.directory_mode | default('0755') }}"
  loop: "{{ application_runtime_job.directoryConfigs | subelements('subdirectories') }}"
  no_log: true

- name: Удалить файлы, которые больше не объявлены в каталогах конфигурации
  ansible.builtin.include_tasks: apply_directory.yml
  loop: "{{ application_runtime_job.directoryConfigs }}"
  loop_control:
    loop_var: application_directory
  no_log: true

- name: Запись владельца экземпляра как производного состояния среды выполнения
  ansible.builtin.copy:
    content: "{{ {'project': application_runtime_job.projectId, 'library': application_runtime_job.libraryId, 'instance': application_runtime_job.instanceId, 'host': inventory_hostname} | to_json(sort_keys=true) }}"
    dest: "{{ application_runtime_job.instancePath }}/.owner.json"
    owner: "{{ application_runtime_job.account }}"
    mode: '0600'

- name: "Записать файлы конфигурации экземпляра"
  ansible.builtin.copy:
    src: "{{ item.path | default(omit) }}"
    content: "{{ item.content if item.path is not defined else omit }}"
    dest: "{{ application_runtime_job.instancePath }}/config/{{ item.destination }}"
    owner: "{{ application_runtime_job.account }}"
    mode: "{{ item.mode }}"
  loop: "{{ application_runtime_job.configContents }}"
  no_log: true

- name: Подготовка и замена объявленных архивов конфигурации
  ansible.builtin.include_tasks: apply_archive.yml
  loop: "{{ application_runtime_job.archiveConfigs }}"
  loop_control:
    loop_var: application_archive
  no_log: true

- name: "Создать Compose-файл экземпляра с меткой контрольной суммы конфигурации"
  ansible.builtin.copy:
    content: "{{ application_runtime_job.composeContent }}"
    dest: "{{ application_runtime_job.instancePath }}/compose.yml"
    owner: "{{ application_runtime_job.account }}"
    mode: '0600'
  no_log: true

- name: "Передать защищённые файлы RoleID и PKI с правами для UID контейнера"
  platform.core.application_identity_files:
    account: "{{ application_runtime_job.account }}"
    user: "{{ application_runtime_job.settings.user | default('0:0') }}"
    instance_path: "{{ application_runtime_job.instancePath }}"
    agent_required: "{{ true if application_runtime_job.agentTemplate else false }}"
    role_id: "{{ hostvars['localhost'].platform_application_vault_identities[application_runtime_job.libraryId ~ '/' ~ application_runtime_job.instanceId].roleId if application_runtime_job.agentTemplate else omit }}"
    ca: "{{ hostvars['localhost'].platform_application_vault_runtime[application_runtime_job.vault.providerId].ca if application_runtime_job.agentTemplate else omit }}"
    agent: "{{ application_runtime_job.agentContent if application_runtime_job.agentTemplate else omit }}"
    pki_plans: "{{ application_runtime_job.pkiPlans | default([]) }}"
  when: application_runtime_job.agentTemplate or (application_runtime_job.pkiPlans | default([]) | length > 0)
  no_log: true

- name: Анализ эффективного Compose без запуска или изменения образа
  ansible.builtin.command:
    argv: "{{ application_runtime_job.composeArgv + ['config', '--format', 'json'] }}"
  become_user: "{{ application_runtime_job.account }}"
  environment: "{{ application_runtime_job.dockerEnvironment }}"
  register: application_compose_config
  changed_when: false
  no_log: true

- name: Проверить только значения Compose, полученные из проекции Core
  ansible.builtin.assert:
    that: "{{ (application_compose_config.stdout | from_json) | platform.core.application_validate_compose(application_runtime_job, application_runtime_job.instancePath, application_runtime_job.configDigest) }}"
    fail_msg: APPLICATION_CORE_COMPOSE_PROJECTION_INVALID
  no_log: true
