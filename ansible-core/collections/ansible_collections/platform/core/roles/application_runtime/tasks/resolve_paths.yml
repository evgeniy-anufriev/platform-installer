---
- name: "Определить каталог библиотеки относительно домашнего каталога пользователя Docker"
  ansible.builtin.set_fact:
    application_root: "{{ application_runtime_job.placement.runtimeDirectory | regex_replace('^~(?=/|$)', application_path_home) }}"
  no_log: true

- name: Требовать ограниченный каталог библиотеки
  ansible.builtin.assert:
    that:
      - application_path_home is match('^/[a-zA-Z0-9_./-]+$')
      - application_root is match('^/[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$')
      - "'..' not in application_root.split('/')"
      - "'.' not in application_root.split('/')"
      - application_root != application_path_home
    fail_msg: APPLICATION_RUNTIME_ROOT_INVALID

- name: Требовать непересекающихся каталогов для разных библиотек перед материализацией
  ansible.builtin.assert:
    that:
      - application_root != item.libraryPath
      - not application_root.startswith(item.libraryPath + '/')
      - not item.libraryPath.startswith(application_root + '/')
    fail_msg: APPLICATION_LIBRARY_PATH_OVERLAP
  loop: "{{ platform_application_preflight_jobs | default([]) }}"
  when: item.libraryId != application_runtime_job.libraryId
  no_log: true

- name: Привязка общих путей размещения для Apply и Verify
  ansible.builtin.set_fact:
    application_library_path: "{{ application_root }}"
    application_instance_path: "{{ application_root }}/{{ application_runtime_job.placement.runtimePath }}"
  no_log: true
