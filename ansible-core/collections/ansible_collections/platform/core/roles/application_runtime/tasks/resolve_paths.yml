---
- name: "Определение каталога библиотеки относительно домашнего каталога пользователя Docker"
  ansible.builtin.set_fact:
    application_root: "{{ application_runtime_job.placement.runtimeDirectory | regex_replace('^~(?=/|$)', application_path_home) }}"
  no_log: true

- name: Проверка допустимости пути каталога библиотеки
  ansible.builtin.assert:
    that:
      - application_path_home is match('^/[a-zA-Z0-9_./-]+$')
      - application_root is match('^/[a-zA-Z0-9_.-]+(/[a-zA-Z0-9_.-]+)*$')
      - "'..' not in application_root.split('/')"
      - "'.' not in application_root.split('/')"
      - application_root != application_path_home
    fail_msg: APPLICATION_RUNTIME_ROOT_INVALID

- name: Проверка отсутствия пересечений каталогов библиотек перед записью файлов
  ansible.builtin.assert:
    that:
      - application_root != item
      - not application_root.startswith(item + '/')
      - not item.startswith(application_root + '/')
    fail_msg: APPLICATION_LIBRARY_PATH_OVERLAP
  loop: "{{ platform_application_preflight_jobs | default([]) | rejectattr('libraryId', 'equalto', application_runtime_job.libraryId) | map(attribute='libraryPath') | unique(case_sensitive=true) | list }}"
  no_log: true

- name: Привязка общих путей размещения для Apply и Verify
  ansible.builtin.set_fact:
    application_library_path: "{{ application_root }}"
    application_instance_path: "{{ application_root }}/{{ application_runtime_job.placement.runtimePath }}"
  no_log: true
