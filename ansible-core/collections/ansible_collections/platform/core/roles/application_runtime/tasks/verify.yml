---
- name: "Определение путей библиотеки для самостоятельного запуска Verify"
  ansible.builtin.include_tasks: resolve_paths.yml
  vars:
    application_path_home: "{{ getent_passwd[application_runtime_job.account][4] }}"
  when: application_runtime_job.instancePath is not defined

- name: Проверка объявленного монтирования дерева конфигурации во время проверки
  ansible.builtin.stat:
    path: "{{ application_runtime_job.instancePath | default(application_instance_path) }}/config/{{ item.destination }}"
    follow: false
    get_checksum: false
  loop: "{{ (application_runtime_job.directoryConfigs | default([])) + (application_runtime_job.archiveConfigs | default([])) }}"
  register: application_verified_config_trees
  no_log: true

- name: Проверка наличия объявленных каталогов конфигурации
  ansible.builtin.assert:
    that:
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: APPLICATION_CONFIG_TREE_MISSING
  loop: "{{ application_verified_config_trees.results }}"
  no_log: true

- name: Проверка состояния контейнера и настроенной готовности
  ansible.builtin.include_tasks: verify_container.yml

- name: Проверка входа через AppRole и чтения выбранного секрета после готовности контейнера
  ansible.builtin.include_role:
    name: platform.vault.application_provider
    tasks_from: verify
  vars:
    application_vault_instance_path: "{{ application_runtime_job.instancePath | default(application_instance_path) }}"
  when:
    - application_runtime_job.agentTemplate | default(false)
    - application_runtime_verify_vault | default(true)
