---
- name: Start with the existing node Docker authentication context
  ansible.builtin.set_fact:
    application_registry_environment: "{{ application_runtime_job.dockerEnvironment | default(application_docker_environment) }}"
    application_registry_auth_stage: {}
  no_log: true

- name: Materialize only explicitly assigned runtime registry inputs
  when: application_runtime_job.registryCredentials | default({}) | length > 0
  block:
    - name: Require protected runtime input files for registry authentication
      ansible.builtin.assert:
        that: >-
          {{ platform_application_secret_files | platform.core.application_protected_secret_files(
            [application_runtime_job.registryCredentials.username.source.ref,
             application_runtime_job.registryCredentials.password.source.ref], platform_application_secret_root) }}
        fail_msg: APPLICATION_REGISTRY_RUNTIME_SECRET_REQUIRED
      no_log: true
    - name: Bind the private registry scope for normal and interrupted-run cleanup
      ansible.builtin.set_fact:
        application_registry_auth_stage:
          path: >-
            {{ application_registry_environment.XDG_RUNTIME_DIR ~ '/.platform-registry-' ~
              (([application_runtime_job.projectId, application_runtime_job.libraryId, application_runtime_job.account] | to_json) | hash('sha256')) }}
      no_log: true
    - name: Recover only this library registry's transient authentication scope
      ansible.builtin.file:
        path: "{{ application_registry_auth_stage.path }}"
        state: absent
      changed_when: false
    - name: Give only the selected Docker account access to its transient config
      ansible.builtin.file:
        path: "{{ application_registry_auth_stage.path }}"
        state: directory
        owner: "{{ application_runtime_job.account }}"
        mode: '0700'
      changed_when: false
    - name: Materialize registry auth without a persistent Docker login
      ansible.builtin.copy:
        content: >-
          {{ {'auths': {(application_runtime_job.authority.repository.reference | platform.core.application_registry_request).registry:
            {'auth': ((lookup('ansible.builtin.file', platform_application_secret_files[application_runtime_job.registryCredentials.username.source.ref], rstrip=false)
              ~ ':' ~ lookup('ansible.builtin.file', platform_application_secret_files[application_runtime_job.registryCredentials.password.source.ref], rstrip=false)) | b64encode)}}} | to_json }}
        dest: "{{ application_registry_auth_stage.path }}/config.json"
        owner: "{{ application_runtime_job.account }}"
        mode: '0600'
      changed_when: false
      no_log: true
    - name: Scope Docker authentication to this probe or pull
      ansible.builtin.set_fact:
        application_registry_environment: "{{ application_registry_environment | combine({'DOCKER_CONFIG': application_registry_auth_stage.path}) }}"
      no_log: true
