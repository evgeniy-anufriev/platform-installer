---
- name: Reject unsafe managed data directory names
  ansible.builtin.assert:
    that:
      - platform_managed_data_path is string
      - platform_managed_data_path | length <= 255
      - platform_managed_data_path is match('^/(?:[A-Za-z0-9][A-Za-z0-9_.-]{0,95}/)*[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$')
      - "'.' not in platform_managed_data_path.split('/')"
      - "'..' not in platform_managed_data_path.split('/')"
      - platform_managed_data_path.split('/')[1] not in ['bin', 'boot', 'dev', 'etc', 'home', 'lib', 'lib64', 'proc', 'root', 'run', 'sbin', 'sys', 'tmp', 'usr']
      - platform_managed_data_path.split('/')[1] != 'var' or platform_managed_data_path.startswith('/var/lib/')
      - platform_managed_data_owner is string
      - platform_managed_data_owner is match('^[a-z_][a-z0-9_-]*$')
      - platform_managed_data_root_verify_only | default(false) is boolean
      - platform_managed_data_root_directory is not defined or platform_managed_data_root_directory is string
      - >-
        platform_managed_data_root_directory is not defined or
        platform_managed_data_root_directory == '/var/lib' or
        not platform_managed_data_path.startswith(platform_managed_data_root_directory ~ '/') or
        (
          platform_managed_data_root_owner is defined and
          platform_managed_data_root_owner is match('^[a-z_][a-z0-9_-]*$')
        )
      - >-
        platform_managed_data_root_directory is not defined or
        platform_managed_data_path != platform_managed_data_root_directory
    fail_msg: MANAGED_DATA_PATH_UNSAFE
    quiet: true

- name: Inspect each managed data directory ancestor without following links
  ansible.builtin.stat:
    path: "{{ '/' ~ (platform_managed_data_path.split('/')[1:item + 1] | join('/')) }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ range(1, platform_managed_data_path.split('/') | length) | list }}"
  register: _platform_managed_data_path_components
  # Let the assertion below classify the failure without exposing raw details.
  ignore_errors: true

- name: Require successful managed data directory ancestor inspection
  ansible.builtin.assert:
    that:
      - not (item.failed | default(false))
    fail_msg: >-
      {{
        'MANAGED_DATA_PATH_STAT_FAILED_' ~
        (
          'PERMISSION_DENIED' if 'permission denied' in (item.msg | default('') | lower) or 'отказано в доступе' in (item.msg | default('') | lower) else
          'OPERATION_NOT_PERMITTED' if 'operation not permitted' in (item.msg | default('') | lower) or 'операция не позволена' in (item.msg | default('') | lower) else
          'SYMLINK_LOOP' if 'too many levels of symbolic links' in (item.msg | default('') | lower) or 'слишком много уровней символических ссылок' in (item.msg | default('') | lower) else
          'READ_ONLY_FILESYSTEM' if 'read-only file system' in (item.msg | default('') | lower) or 'файловая система доступна только для чтения' in (item.msg | default('') | lower) else
          'IO_ERROR' if 'input/output error' in (item.msg | default('') | lower) or 'ошибка ввода-вывода' in (item.msg | default('') | lower) else
          'UNSUPPORTED_STAT_ARGUMENT' if 'unsupported parameters' in (item.msg | default('') | lower) or 'неподдерживаемые параметры' in (item.msg | default('') | lower) else
          'PYTHON_DEPENDENCY_MISSING' if 'failed to import the required python library' in (item.msg | default('') | lower) or 'не удалось импортировать необходимую библиотеку python' in (item.msg | default('') | lower) else
          'UNKNOWN_STAT_ERROR'
        )
      }}
    quiet: true
  loop: "{{ _platform_managed_data_path_components.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Reject linked, foreign or writable managed data directory ancestors
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or not (item.stat.islnk | default(false))
      - >-
        not item.stat.exists or
        item.stat.pw_name in ['root', platform_managed_data_owner] or
        (
          platform_managed_data_root_directory is defined and
          platform_managed_data_root_directory != '/var/lib' and
          platform_managed_data_root_owner is defined and
          item.stat.path == platform_managed_data_root_directory
        )
      - not item.stat.exists or item.stat.mode | default('') | length >= 3
      - not item.stat.exists or item.stat.mode[-1:] not in ['2', '3', '6', '7']
      - not item.stat.exists or item.stat.mode[-2:-1] not in ['2', '3', '6', '7']
    fail_msg: MANAGED_DATA_PATH_ANCESTOR_UNSAFE
    quiet: true
  loop: "{{ _platform_managed_data_path_components.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the custom project data root during Verify
  ansible.builtin.stat:
    path: "{{ platform_managed_data_root_directory }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _platform_managed_data_root_stat
  when:
    - platform_managed_data_root_directory is defined
    - platform_managed_data_root_directory != '/var/lib'
    - platform_managed_data_path.startswith(platform_managed_data_root_directory ~ '/')
    - platform_managed_data_root_verify_only | default(false)

- name: Require the custom project data root to belong to the SSH technical user during Verify
  ansible.builtin.assert:
    that:
      - _platform_managed_data_root_stat.stat.exists
      - _platform_managed_data_root_stat.stat.isdir | default(false)
      - not (_platform_managed_data_root_stat.stat.islnk | default(false))
      - _platform_managed_data_root_stat.stat.pw_name == platform_managed_data_root_owner
      - _platform_managed_data_root_stat.stat.mode == '0755'
    fail_msg: PROJECT_DATA_ROOT_OWNERSHIP_INVALID
    quiet: true
  when:
    - platform_managed_data_root_directory is defined
    - platform_managed_data_root_directory != '/var/lib'
    - platform_managed_data_root_verify_only | default(false)

- name: Set the custom project data root to the SSH technical user with mode 0755
  ansible.builtin.file:
    path: "{{ platform_managed_data_root_directory }}"
    state: directory
    owner: "{{ platform_managed_data_root_owner }}"
    mode: '0755'
  when:
    - platform_managed_data_root_directory is defined
    - platform_managed_data_root_directory != '/var/lib'
    - platform_managed_data_path.startswith(platform_managed_data_root_directory ~ '/')
    - not (platform_managed_data_root_verify_only | default(false))
