---
- name: Проверка развернутых файлов PKI, доступных только для чтения
  ansible.builtin.find:
    paths: "{{ platform_pki_plan.targetDirectory }}"
    patterns: [ca-chain.pem, certificate.pem, private-key.pem, keystore.p12, truststore.p12, materialization-fingerprint]
    recurse: false
    follow: false
    file_type: file
    get_checksum: false
  register: platform_pki_deployed_files

- name: Проверка наличия всех развёрнутых PKI-файлов
  ansible.builtin.assert:
    that: platform_pki_deployed_files.matched == 6
    fail_msg: PKI_TARGET_MATERIAL_INCOMPLETE

- name: Проверка развёрнутой цепочки сертификатов без изменений
  ansible.builtin.command:
    argv: [openssl, verify, -CAfile, "{{ platform_pki_plan.targetDirectory }}/ca-chain.pem", "{{ platform_pki_plan.targetDirectory }}/certificate.pem"]
  changed_when: false

- name: "Чтение отпечатка развёрнутых PKI-файлов"
  ansible.builtin.command:
    argv: [cat, "{{ platform_pki_plan.targetDirectory }}/materialization-fingerprint"]
  changed_when: false
  register: platform_pki_target_fingerprint

- name: "Проверка отпечатка развёрнутых PKI-файлов"
  ansible.builtin.assert:
    that: "(platform_pki_target_fingerprint.stdout | trim) == platform_pki_plan.materializationFingerprint"
    fail_msg: PKI_TARGET_MATERIALIZATION_MISMATCH
