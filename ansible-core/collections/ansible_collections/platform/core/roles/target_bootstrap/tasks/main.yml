---
- name: "Пропустить подготовку SSH-доступа, если целевой узел совпадает с узлом выполнения"
  ansible.builtin.debug:
    msg: Self-target bootstrap skipped; Execution Node local transport is used
  when: platform_bootstrap_skip_self | bool

- name: "Подготовить технического пользователя и SSH-ключ на целевом узле"
  when: not (platform_bootstrap_skip_self | bool)
  block:
    - name: Загрузить открытый ключ выполнения из рабочей области среды выполнения контроллера
      ansible.builtin.set_fact:
        platform_bootstrap_public_key: "{{ lookup('ansible.builtin.file', platform_bootstrap_public_key_file) | trim }}"
      when:
        - platform_bootstrap_public_key | length == 0
        - platform_bootstrap_public_key_file | length > 0

    - name: Требовать открытый ключ, предоставленный во время выполнения
      ansible.builtin.assert:
        that:
          - platform_bootstrap_public_key | length > 0
        fail_msg: Target bootstrap requires a public SSH key from the runtime credential boundary

    - name: Обеспечить существование пользователя технической автоматизации
      ansible.builtin.user:
        name: "{{ platform_bootstrap_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    - name: Создание каталога SSH технического пользователя
      ansible.builtin.file:
        path: "/home/{{ platform_bootstrap_user }}/.ssh"
        state: directory
        owner: "{{ platform_bootstrap_user }}"
        group: "{{ platform_bootstrap_user }}"
        mode: "0700"

    - name: Установить открытый ключ управляемого технического пользователя без удаления существующих ключей
      ansible.builtin.lineinfile:
        line: "{{ platform_bootstrap_public_key | trim }}"
        dest: "/home/{{ platform_bootstrap_user }}/.ssh/authorized_keys"
        search_string: "{{ platform_bootstrap_public_key | trim }}"
        create: true
        owner: "{{ platform_bootstrap_user }}"
        group: "{{ platform_bootstrap_user }}"
        mode: "0600"

    - name: Установить явно предоставленную политику sudo
      ansible.builtin.copy:
        content: "{{ platform_bootstrap_sudoers_content }}"
        dest: "/etc/sudoers.d/platform-automation"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      when: platform_bootstrap_sudoers_content | length > 0

    - name: Проверка возможности sudo технического пользователя
      ansible.builtin.command:
        argv:
          - su
          - -s
          - /bin/bash
          - -c
          - sudo -n -u root true
          - "{{ platform_bootstrap_user }}"
      changed_when: false
