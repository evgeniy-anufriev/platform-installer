---
- name: Проверка наличия рассчитанных Core переменных роли для текущего узла
  ansible.builtin.assert:
    that:
      - platform_execution_role_variables_by_host is mapping
      - inventory_hostname in platform_execution_role_variables_by_host
      - platform_execution_role_variables_by_host[inventory_hostname] is mapping
    fail_msg: EXECUTION_ROLE_VARIABLES_INVALID
  no_log: true

- name: Применение рассчитанных Core переменных роли для текущего целевого узла
  platform.core.apply_runtime_role_variables:
  no_log: true
