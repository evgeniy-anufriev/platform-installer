---
- name: Сбор фактов о среде выполнения
  ansible.builtin.setup:
    gather_subset:
      - min

- name: Проверка поддерживаемой среды выполнения
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_python_version is defined
      - ansible_python_version is version('3.8', '>=')
    fail_msg: Execution Node requires a supported Linux/Python environment

- name: Проверка локального исполняемого файла Ansible
  ansible.builtin.command: ansible-playbook --version
  register: platform_execution_ansible_version
  changed_when: false
  when: platform_execution_require_ansible | bool

- name: Проверка наличия технического пользователя для управляемого SSH-доступа
  ansible.builtin.assert:
    that:
      - platform_execution_technical_user | length > 0
    fail_msg: Managed execution identity requires platform_execution_technical_user
  when: platform_execution_manage_technical_user | bool

- name: Обеспечение существования технического пользователя управляемого выполнения
  ansible.builtin.user:
    name: "{{ platform_execution_technical_user }}"
    shell: /bin/bash
    create_home: true
    state: present
  when: platform_execution_manage_technical_user | bool

- name: Установка явно предоставленной политики выполнения sudo
  ansible.builtin.copy:
    content: "{{ platform_execution_sudoers_content }}"
    dest: "/etc/sudoers.d/platform-execution"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  when: platform_execution_sudoers_content | length > 0

- name: Создание корня общей рабочей области выполнения
  ansible.builtin.file:
    path: "{{ platform_execution_workspace }}"
    state: directory
    owner: root
    group: root
    mode: "0711"

- name: "Создание защищённых каталогов рабочей области выполнения"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ platform_execution_private_workspace }}"
    - "{{ platform_execution_payload_root }}"

- name: Создание постоянного состояния идентификации выполнения
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_execution_technical_user | default(omit, true) }}"
    group: "{{ platform_execution_technical_group | default(omit, true) }}"
    mode: "0700"
  loop:
    - "{{ platform_execution_state_root }}"
    - "{{ platform_execution_state_root }}/identities"
    - "{{ platform_execution_identity_root }}"
  when: platform_execution_technical_user | length > 0

- name: "Проверка постоянного файла known_hosts узла выполнения"
  ansible.builtin.stat:
    path: "{{ platform_execution_known_hosts_path }}"
  register: platform_execution_known_hosts_stat
  when: platform_execution_technical_user | length > 0

- name: "Создание постоянного файла known_hosts, если он отсутствует"
  ansible.builtin.copy:
    content: ""
    dest: "{{ platform_execution_known_hosts_path }}"
    owner: "{{ platform_execution_technical_user | default(omit, true) }}"
    group: "{{ platform_execution_technical_group | default(omit, true) }}"
    mode: "0600"
  when:
    - platform_execution_technical_user | length > 0
    - not platform_execution_known_hosts_stat.stat.exists

- name: Назначение владельца защищённой рабочей области выполнения
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_execution_technical_user }}"
    group: "{{ platform_execution_technical_group }}"
    mode: "0700"
  loop:
    - "{{ platform_execution_private_workspace }}"
  when: platform_execution_technical_user | length > 0

- name: "Создание постоянной SSH-пары ключей технического пользователя, если она отсутствует"
  become_user: "{{ platform_execution_technical_user }}"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -f
      - "{{ platform_execution_ssh_key_path }}"
  args:
    creates: "{{ platform_execution_ssh_key_path }}"
  when: platform_execution_technical_user | length > 0

- name: Проверка каталога обязательного offline-пакета среды исполнения
  ansible.builtin.stat:
    path: "{{ platform_execution_offline_payload_root }}"
  register: platform_execution_payload_stat
  when:
    - platform_execution_require_offline_payload | bool
    - platform_execution_offline_payload_root | length > 0

- name: Отклонение отсутствия обязательного offline-пакета среды исполнения
  ansible.builtin.assert:
    that:
      - platform_execution_payload_stat.stat.exists
      - platform_execution_payload_stat.stat.isdir
    fail_msg: Required offline execution payload is not available on the Execution Node
  when:
    - platform_execution_require_offline_payload | bool
    - platform_execution_offline_payload_root | length > 0

- name: Публикация маркера готовности к выполнению
  ansible.builtin.copy:
    content: "execution-node-ready-v1\\n"
    dest: "{{ platform_execution_workspace }}/.execution-node-ready"
    mode: "0600"
