---
- name: Обнаружение существующей учетной записи Docker, не создавая ее
  ansible.builtin.getent:
    database: passwd
    key: "{{ application_image_input.account }}"
    fail_key: false
  become: true
  when: application_image_input.account | length > 0
  no_log: true

- name: Чтение только файла аутентификации Docker существующей учетной записи
  ansible.builtin.slurp:
    src: "{{ application_image_input.configDirectory | default('', true) or (getent_passwd[application_image_input.account][4] ~ '/.docker') }}/config.json"
  become: true
  register: _image_node_config
  failed_when: false
  when:
    - application_image_input.account | length > 0
    - getent_passwd[application_image_input.account] | default(none) is not none
  no_log: true

- name: Привязка существующих метаданных аутентификации узла, не раскрывая их
  ansible.builtin.set_fact:
    _image_auth_config: "{{ (_image_node_config.content | b64decode | from_json) if _image_node_config.content is defined else {} }}"
  no_log: true

- name: "Выбор сохранённых данных аутентификации для реестра или Docker Hub"
  ansible.builtin.set_fact:
    _image_auth_entry: >-
      {{ (_image_auth_config.auths | default({})).get(application_image_input.request.registry,
         (_image_auth_config.auths | default({})).get('https://' ~ application_image_input.request.registry ~ '/v1/',
         (_image_auth_config.auths | default({})).get('https://index.docker.io/v1/', {}) if application_image_input.request.registry == 'docker.io' else {})) }}
    _image_auth_helper: "{{ (_image_auth_config.credHelpers | default({})).get(application_image_input.request.registry, _image_auth_config.credsStore | default('')) }}"
  no_log: true

- name: Декодирование сохранённых данных аутентификации Docker для выбранного реестра образов
  ansible.builtin.set_fact:
    _image_username: "{{ (_image_auth_entry.auth | b64decode).split(':', 1)[0] }}"
    _image_password: "{{ (_image_auth_entry.auth | b64decode).split(':', 1)[1] }}"
  when: _image_auth_entry.auth is defined
  no_log: true

- name: Чтение существующих учётных данных через помощник Docker на узле
  ansible.builtin.command:
    argv: ["docker-credential-{{ _image_auth_helper }}", get]
    stdin: "{{ 'https://index.docker.io/v1/' if application_image_input.request.registry == 'docker.io' else application_image_input.request.registry }}"
  become: true
  become_user: "{{ application_image_input.account }}"
  register: _image_helper_result
  changed_when: false
  when: _image_auth_helper | length > 0
  no_log: true

- name: Привязка результата поиска учётных данных к операции подготовки образов
  ansible.builtin.set_fact:
    _image_username: "{{ (_image_helper_result.stdout | from_json).Username }}"
    _image_password: "{{ (_image_helper_result.stdout | from_json).Secret }}"
  when: _image_auth_helper | length > 0
  no_log: true
