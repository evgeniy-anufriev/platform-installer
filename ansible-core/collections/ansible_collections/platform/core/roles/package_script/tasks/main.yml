---
- name: Проверка защиты входных данных сценария
  ansible.builtin.assert:
    that: >-
      {{ platform_script_secret_files | platform.core.application_protected_secret_files(
        platform_script_job.secretInputs.values() | list) }}
    fail_msg: APPLICATION_SCRIPT_RUNTIME_SECRET_REQUIRED
  when: platform_script_job.secretInputs | length > 0
  no_log: true

- name: "Создание защищённого каталога сценариев пакета"
  ansible.builtin.file:
    path: "{{ platform_script_directory }}"
    state: directory
    owner: "{{ platform_script_job.account }}"
    mode: '0700'
  no_log: true

- name: Удаление временных входных файлов прерванного сценария пакета перед повторным запуском
  ansible.builtin.file:
    path: "{{ platform_script_secret_directory }}"
    state: absent
  changed_when: false
  no_log: true

- name: Запуск сценария пакета с защищёнными входными файлами и последующей очисткой
  block:
    - name: Создание временного каталога секретов сценария пакета
      ansible.builtin.file:
        path: "{{ platform_script_secret_directory }}"
        state: directory
        owner: "{{ platform_script_job.account }}"
        mode: '0700'
      when: platform_script_job.secretInputs | length > 0 or platform_script_job.invocations | default([]) | length > 0
      changed_when: false
      no_log: true

    - name: Доставка сценария и выбранных входных файлов штатным копированием
      ansible.builtin.copy:
        src: "{{ _platform_script_delivery_file.src | default(omit) }}"
        content: "{{ _platform_script_delivery_file.content | default(omit) }}"
        dest: "{{ _platform_script_delivery_file.dest }}"
        owner: "{{ platform_script_job.account }}"
        mode: "{{ _platform_script_delivery_file.mode }}"
      loop: "{{ _platform_script_delivery_files }}"
      loop_control:
        loop_var: _platform_script_delivery_file
      register: _platform_script_copied_file
      changed_when: not _platform_script_delivery_file.temporary and _platform_script_copied_file.changed
      no_log: true

    - name: Выполнение точного сценария пакета без оболочки или неограниченной среды выполнения
      ansible.builtin.command:
        argv: "{{ ['timeout', '--kill-after=2s', ((300 * ([1, platform_script_job.invocations | default([]) | length] | max)) | string) ~ 's', platform_script_directory ~ '/' ~ platform_script_job.id] + platform_script_job.argv }}"
        chdir: "{{ platform_script_job.workingDirectory }}"
      become_user: "{{ platform_script_job.account }}"
      environment: "{{ platform_script_environment }}"
      register: platform_script_result
      failed_when: false
      changed_when: false
      no_log: true

    - name: "Сохранение безопасной диагностики сбоев для сценария пакета {{ platform_script_job.id }}"
      ansible.builtin.fail:
        msg: "{{ platform_script_result | platform.core.application_script_failure }}"
      when: platform_script_result.rc | default(-1) | int != 0

    - name: Проверка ограниченного машиночитаемого результата без секретов
      ansible.builtin.assert:
        that:
          - platform_script_result.stdout | length <= 2048
          - (platform_script_result.stdout | from_json).status == 'ok'
          - (platform_script_result.stdout | from_json).changed in [true, false]
        fail_msg: APPLICATION_SCRIPT_RESULT_INVALID
      no_log: true

    - name: "Вывод признака изменения состояния сценарием пакета"
      ansible.builtin.debug:
        msg: APPLICATION_SCRIPT_RECONCILED
      changed_when: (platform_script_result.stdout | from_json).changed | bool
  always:
    - name: Удаление временных секретных входных файлов сценария пакета
      ansible.builtin.file:
        path: "{{ platform_script_secret_directory }}"
        state: absent
      changed_when: false
      no_log: true
