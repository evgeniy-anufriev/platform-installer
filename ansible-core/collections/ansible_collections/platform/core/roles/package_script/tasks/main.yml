---
- name: Привязка только общих путей к сценариям пакетов
  ansible.builtin.set_fact:
    platform_script_directory: "{{ platform_script_job.workingDirectory }}/.scripts"
    platform_script_secret_directory: "{{ platform_script_job.workingDirectory }}/.scripts/.secrets/{{ platform_script_job.id }}"
    platform_script_environment: {}
  no_log: true

- name: Требовать защищенные входные данные сценария среды выполнения
  ansible.builtin.assert:
    that: >-
      {{ platform_script_secret_files | platform.core.application_protected_secret_files(
        platform_script_job.secretInputs.values() | list) }}
    fail_msg: APPLICATION_SCRIPT_RUNTIME_SECRET_REQUIRED
  when: platform_script_job.secretInputs | length > 0
  no_log: true

- name: "Создать защищённый каталог сценариев пакета"
  ansible.builtin.file:
    path: "{{ platform_script_directory }}"
    state: directory
    owner: "{{ platform_script_job.account }}"
    mode: '0700'
  no_log: true

- name: Доставить точный сценарий пакета из разрешенного списка
  ansible.builtin.copy:
    src: "{{ platform_script_job.path }}"
    dest: "{{ platform_script_directory }}/{{ platform_script_job.id }}"
    owner: "{{ platform_script_job.account }}"
    mode: '0700'
  no_log: true

- name: Удалить временные входные файлы прерванного сценария пакета перед повторным запуском
  ansible.builtin.file:
    path: "{{ platform_script_secret_directory }}"
    state: absent
  changed_when: false
  no_log: true

- name: Запуск сценария пакета с ограниченными частными входными данными и очисткой
  block:
    - name: Создать временный каталог секретов сценария пакета
      ansible.builtin.file:
        path: "{{ platform_script_secret_directory }}"
        state: directory
        owner: "{{ platform_script_job.account }}"
        mode: '0700'
      when: platform_script_job.secretInputs | length > 0
      no_log: true

    - name: Подготовка входных файлов среды выполнения для выбранной целевой учетной записи
      ansible.builtin.copy:
        src: "{{ platform_script_secret_files[item.value] }}"
        dest: "{{ platform_script_secret_directory }}/{{ item.key }}"
        owner: "{{ platform_script_job.account }}"
        mode: '0600'
      loop: "{{ platform_script_job.secretInputs | dict2items }}"
      no_log: true

    - name: "Передать сценарию только пути защищённых входных файлов"
      ansible.builtin.set_fact:
        platform_script_environment: >-
          {{ platform_script_environment | combine({'PLATFORM_SCRIPT_SECRET_' ~ (item.key | upper) ~ '_FILE': platform_script_secret_directory ~ '/' ~ item.key}) }}
      loop: "{{ platform_script_job.secretInputs | dict2items }}"
      no_log: true

    - name: Выполнить точный сценарий пакета без оболочки или неограниченной среды выполнения
      ansible.builtin.command:
        argv: "{{ ['timeout', '--kill-after=2s', '300s', platform_script_directory ~ '/' ~ platform_script_job.id] + platform_script_job.argv }}"
        chdir: "{{ platform_script_job.workingDirectory }}"
      become_user: "{{ platform_script_job.account }}"
      environment: "{{ platform_script_environment }}"
      register: platform_script_result
      failed_when: false
      changed_when: false
      no_log: true

    - name: "Сохранить безопасную диагностику сбоев для сценария пакета {{ platform_script_job.id }}"
      ansible.builtin.fail:
        msg: "{{ platform_script_result | platform.core.application_script_failure }}"
      when: platform_script_result.rc | default(-1) | int != 0

    - name: Проверить ограниченный машиночитаемый результат без секретов
      ansible.builtin.assert:
        that:
          - platform_script_result.stdout | length <= 2048
          - (platform_script_result.stdout | from_json).status == 'ok'
          - (platform_script_result.stdout | from_json).changed in [true, false]
        fail_msg: APPLICATION_SCRIPT_RESULT_INVALID
      no_log: true

    - name: "Сообщить, внёс ли сценарий пакета изменения"
      ansible.builtin.debug:
        msg: APPLICATION_SCRIPT_RECONCILED
      changed_when: (platform_script_result.stdout | from_json).changed | bool
  always:
    - name: Удалить временные секретные входные файлы сценария пакета
      ansible.builtin.file:
        path: "{{ platform_script_secret_directory }}"
        state: absent
      changed_when: false
      no_log: true
