---
platform_script_directory: "{{ platform_script_job.workingDirectory }}/.scripts"
platform_script_secret_directory: "{{ platform_script_directory }}/.secrets/{{ platform_script_job.id }}"
platform_script_environment: >-
  {{ dict(platform_script_job.secretInputs.keys() | map('upper') | map('regex_replace', '^', 'PLATFORM_SCRIPT_SECRET_') | map('regex_replace', '$', '_FILE') | zip(platform_script_job.secretInputs.keys() | map('regex_replace', '^', platform_script_secret_directory ~ '/'))) |
     combine({'PLATFORM_SCRIPT_BATCH_FILE': platform_script_secret_directory ~ '/.batch.json'} if platform_script_job.invocations | default([]) | length > 0 else {}) }}
_platform_script_delivery_files: >-
  {%- set files = [{'src': platform_script_job.path, 'dest': platform_script_directory ~ '/' ~ platform_script_job.id, 'mode': '0700', 'temporary': false}] -%}
  {%- for name, ref in platform_script_job.secretInputs.items() -%}
  {%- set _ = files.append({'src': platform_script_secret_files[ref], 'dest': platform_script_secret_directory ~ '/' ~ name, 'mode': '0600', 'temporary': true}) -%}
  {%- endfor -%}
  {%- if platform_script_job.invocations | default([]) | length > 0 -%}
  {%- set _ = files.append({'content': platform_script_job.invocations | to_json, 'dest': platform_script_secret_directory ~ '/.batch.json', 'mode': '0600', 'temporary': true}) -%}
  {%- endif -%}
  {{ files }}
