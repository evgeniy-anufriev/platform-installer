---
- name: "Вычисление шаблонов ресурсов в контексте библиотеки"
  platform.core.prepare_application_libraries:
    resource_defaults: true
    library_id: "{{ application_job.libraryId }}"
    host_id: "{{ application_job.hostId }}"
    defaults_path: "{{ application_job.library.defaultsPath }}"
  register: _application_resource_inputs
  no_log: true
  become: false


- name: Объединение выбранных параметров ресурса со значениями библиотеки по умолчанию
  ansible.builtin.set_fact:
    _application_resources: >-
      {{ _application_resources | combine({item.key: item.value | combine({'parameters':
         ((_application_resource_inputs.resource_defaults.kafka.topics[item.key] | default({})) if item.value.kind == 'kafka.topic' else
          (_application_resource_inputs.resource_defaults.postgresql.databases[item.key] | default({})) if item.value.kind == 'postgresql.database' else
          (_application_resource_inputs.resource_defaults.clickhouse.databases[item.key] | default({})) if item.value.kind == 'clickhouse.database' else
          (_application_resource_inputs.resource_defaults.redis['keys'][item.key] | default({})) if item.value.kind == 'redis.key' else {}) |
         combine(item.value.parameters, recursive=true, list_merge='replace')})}) }}
  loop: "{{ application_job.deployment.resources | default({}) | dict2items }}"
  no_log: true
  become: false

- name: Привязка нормализованных ресурсов к шаблонам общих библиотек
  ansible.builtin.set_fact:
    library_resources: "{{ _application_resources }}"
    _application_resource_defaults: "{{ _application_resource_inputs.resource_defaults }}"
  no_log: true
  become: false

- name: "Вычисление общих значений библиотеки по умолчанию после обработки ресурсов"
  platform.core.prepare_application_libraries:
    shared_defaults: true
    library_id: "{{ application_job.libraryId }}"
    host_id: "{{ application_job.hostId }}"
    defaults_path: "{{ application_job.library.defaultsPath }}"
  register: _application_shared_render
  no_log: true
  become: false
- name: Сохранение общих настроек библиотеки в контексте узла
  ansible.builtin.set_fact:
    _application_shared: "{{ _application_shared_render }}"
    _library_resolved_defaults: >-
      {{ _library_resolved_defaults | combine({_library_resolution_key: {
         'resourceDefaults': _application_resource_defaults,
         'resources': _application_resources, 'shared': _application_shared_render}}) }}
  no_log: true
  become: false
