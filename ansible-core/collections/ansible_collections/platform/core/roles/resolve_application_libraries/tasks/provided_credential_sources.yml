---
- name: Сохранение неизменяемых метаданных учётных данных и замена исходного дескриптора
  ansible.builtin.set_fact:
    application_provided_connection_definitions: >-
      {{ application_provided_connection_definitions | combine({application_export_override.key:
         application_provided_connection_definitions[application_export_override.key] | combine({'credentials':
           application_provided_connection_definitions[application_export_override.key].credentials | default({}) |
           combine({item.key:
             application_provided_connection_definitions[application_export_override.key].credentials[item.key] | default({}) |
             combine(item.value, recursive=false)})})}) }}
  loop: "{{ application_export_override.value.credentials | default({}) | dict2items }}"
  no_log: true
  become: false
