---
- name: "Проверка комплектности пакетов библиотек перед загрузкой значений по умолчанию"
  platform.core.prepare_application_libraries:
    project_root: "{{ platform_project_root if platform_project_root is defined else (inventory_dir | dirname) }}"
    contracts_root: "{{ platform_contracts_root | default(role_path ~ '/../../../../../../../contracts') }}"
  register: _application_inputs
  no_log: true
  become: false

- name: Сохранение безопасных результатов предварительной проверки
  ansible.builtin.set_fact:
    platform_application_rows: []
    platform_application_connection_rows: []
    platform_application_findings: "{{ _application_inputs.findings }}"
    _library_resolved_defaults: {}
  no_log: true
  become: false

- name: Однократная загрузка исходных defaults каждой библиотеки и узла
  ansible.builtin.include_vars:
    file: "{{ item.value }}"
    name: "_library_package_{{ item.key }}"
  vars:
    _application_library_namespace_inputs: >-
      {%- set inputs = {} -%}
      {%- for job in _application_inputs.jobs -%}
      {%- set _ = inputs.update({([job.libraryId, job.hostId] | to_json | hash('sha256')): job.library.defaultsPath}) -%}
      {%- endfor -%}
      {{ inputs | dict2items }}
  loop: "{{ _application_library_namespace_inputs }}"
  no_log: true
  become: false

- name: "Определение топологии подключений перед формированием окружения потребителя"
  ansible.builtin.include_tasks: connection_topology.yml
  loop: "{{ _application_inputs.jobs | rejectattr('skipConnectionTopology') | list }}"
  loop_control:
    loop_var: application_job
  no_log: true

- name: Добавление подключений приложений в рассчитанную топологию
  platform.core.prepare_application_connections:
  register: _application_connection_inputs
  no_log: true
  become: false

- name: Предоставление рассчитанных параметров провайдера шаблонам пакетов
  ansible.builtin.set_fact:
    platform_application_provided_connections: "{{ _application_connection_inputs.connections }}"
    platform_application_findings: "{{ platform_application_findings + (_application_connection_inputs.findings | default([])) }}"
  no_log: true
  become: false

- name: Вычисление параметров каждого приложения и узла по переменным Ansible
  ansible.builtin.include_tasks: instance.yml
  vars:
    _library_package: "{{ lookup('vars', '_library_package_' ~ ([application_job.libraryId, application_job.hostId] | to_json | hash('sha256'))) }}"
    _application_package: "{{ lookup('vars', '_application_package_' ~ ((application_job.libraryId ~ application_job.slotId ~ application_job.hostId) | hash('sha256'))) }}"
    _library_resolution_key: "{{ application_job.libraryId ~ '/' ~ application_job.hostId }}"
    _application_library_inputs: "{{ _library_resolved_defaults.get(_library_resolution_key, {}) }}"
    _application_resource_defaults: "{{ _application_library_inputs.resourceDefaults if _application_library_inputs else _application_resource_inputs.resource_defaults | default({}) }}"
    _application_shared: "{{ _application_library_inputs.shared if _application_library_inputs else _application_shared_render }}"
  loop: "{{ _application_inputs.jobs }}"
  loop_control:
    loop_var: application_job
    index_var: _application_row_index
    label: "{{ application_job.libraryId }} / {{ application_job.slotId }} / {{ application_job.hostId }}"
  when: application_job.connections is not none
  no_log: true

- name: Сбор рассчитанных записей приложений в порядке размещений
  ansible.builtin.set_fact:
    platform_application_rows: >-
      {%- set rows = [] -%}
      {%- for job in _application_inputs.jobs -%}
        {%- if job.connections is not none -%}
          {%- set row = lookup('vars', '_application_resolved_row_' ~ loop.index0) -%}
          {%- if row is not false -%}
            {%- set _ = rows.append(row) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ rows }}
  no_log: true
  become: false
