---
- name: Передача выбранных ресурсов провайдерам соединений приложения
  ansible.builtin.set_fact:
    application_topics: "{{ _application_resource_context.topics }}"
    application_databases: "{{ _application_resource_context.databases }}"
  vars:
    _application_resource_context: >-
      {%- set ns = namespace(topics=application_topics, databases=application_databases) -%}
      {%- set bindings = application_job.deployment.bindings -%}
      {%- for connection_key, connection in _application_connections.items()
          if connection.library_binding | default('') in bindings -%}
      {%- for resource_id, resource in _application_resources.items()
          if resource.kind in ['kafka.topic', 'postgresql.database', 'clickhouse.database']
          and resource.binding in bindings
          and bindings[resource.binding].deploymentRef | default('') ==
              bindings.get(connection.library_binding, {}).deploymentRef | default('') -%}
      {%- set entry = {resource_id: {'resourceId': resource_id, 'name': resource.parameters.name}} -%}
      {%- if resource.kind == 'kafka.topic' -%}
      {%- set ns.topics = ns.topics | combine({connection_key: ns.topics.get(connection_key, {}) | combine(entry)}) -%}
      {%- else -%}
      {%- set ns.databases = ns.databases | combine({connection_key: ns.databases.get(connection_key, {}) | combine(entry)}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ {'topics': ns.topics, 'databases': ns.databases} }}
  no_log: true
  become: false
