---
- name: Расчёт настроек с безопасной диагностикой отказа
  block:
    - name: Загрузка проверенных параметров приложения по умолчанию в изолированное пространство имен
      ansible.builtin.include_vars:
        file: "{{ application_job.application.defaultsPath }}"
        name: "_application_package_{{ (application_job.libraryId ~ application_job.slotId ~ application_job.hostId) | hash('sha256') }}"
      no_log: true
      become: false

    - name: Привязка идентификаторов и контекста параметров размещения приложения
      ansible.builtin.set_fact:
        application_name: "{{ application_job.application.name }}"
        application_instance_id: >-
          {{ application_job.application.name if
             (application_job.library.definition.instance_id_strategy | default('qualified')) == 'application-name'
             else application_job.application.name ~ '-' ~ application_job.libraryId }}
        library_instance_id: "{{ application_job.libraryId }}"
        _application_library_endpoint: >-
          {{ {'endpoint_group': application_job.deployment.bindings.endpoint.endpointGroupRef | default(platform_desired_state['x-applicationLibraryEndpointGroups'][application_job.libraryId] | default(''))}
             if (application_job.deployment.bindings.endpoint.endpointGroupRef | default(platform_desired_state['x-applicationLibraryEndpointGroups'][application_job.libraryId] | default(''))) else {} }}
        application_topics: {}
        application_databases: {}
        _application_connections: "{{ application_job.connections }}"
        application_connections: {}
        _application_resources: "{{ _application_library_inputs.resources | default({}) }}"
        library_resources: "{{ _application_library_inputs.resources | default({}) }}"
        _application_resource_inputs: {}
      no_log: true
      become: false

    - name: "Передача значений подключений в шаблоны приложений"
      ansible.builtin.set_fact:
        application_connections: >-
          {{ application_connections | combine({item.key:
            platform_application_provided_connections.get(
              application_job.deployment.bindings[item.value.library_binding].providedConnectionRef.libraryId, {}).get(
              application_job.deployment.bindings[item.value.library_binding].providedConnectionRef.name, {})}) }}
      loop: "{{ _application_connections | dict2items }}"
      when: application_job.deployment.bindings.get(item.value.library_binding, {}).providedConnectionRef is defined
      no_log: true
      become: false

    - name: Расчёт общих настроек библиотеки для размещения
      ansible.builtin.include_tasks: library_defaults.yml
      when: not _application_library_inputs
      no_log: true

    - name: "Сбор привязок топиков старого формата с учётом значений по умолчанию"
      ansible.builtin.set_fact:
        _application_topic_bindings: >-
          {{ (_application_shared.defaults.topicBindings | default({}) if application_job.slot.inherit_defaults | default(true) else {}) |
             combine(application_job.application.definition.defaults.topicBindings | default({}), recursive=true, list_merge='replace') |
             combine(application_job.slot.overrides.topicBindings | default({}), recursive=true, list_merge='replace') |
             combine(_application_shared.overrides.topicBindings | default({}) if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') |
             combine(application_job.instance.overrides.topicBindings | default({}), recursive=true, list_merge='replace') |
             combine(application_job.hostOverride.topicBindings | default({}), recursive=true, list_merge='replace') }}
      no_log: true
      become: false

    - name: Передача выбранных ресурсов провайдерам соединений приложения
      ansible.builtin.set_fact:
        application_topics: "{{ _application_resource_context.topics }}"
        application_databases: "{{ _application_resource_context.databases }}"
      vars:
        _application_resource_context: >-
          {%- set ns = namespace(topics=application_topics, databases=application_databases) -%}
          {%- set bindings = application_job.deployment.bindings -%}
          {%- for connection_key, connection in _application_connections.items()
              if connection.library_binding is defined -%}
          {%- for resource_id, resource in _application_resources.items()
              if resource.kind in ['kafka.topic', 'postgresql.database', 'clickhouse.database']
              and ((resource.kind in ['postgresql.database', 'clickhouse.database'] and
                    resource.binding == connection.library_binding) or
                   (resource.binding in bindings and connection.library_binding in bindings and
                    bindings[resource.binding].deploymentRef | default('') ==
                    bindings[connection.library_binding].deploymentRef | default(''))) -%}
          {%- set entry = {resource_id: {'resourceId': resource_id, 'name': resource.parameters.name}} -%}
          {%- if resource.kind == 'kafka.topic' -%}
          {%- set ns.topics = ns.topics | combine({connection_key: ns.topics.get(connection_key, {}) | combine(entry)}) -%}
          {%- else -%}
          {%- set ns.databases = ns.databases | combine({connection_key: ns.databases.get(connection_key, {}) | combine(entry)}) -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ {'topics': ns.topics, 'databases': ns.databases} }}
      no_log: true
      become: false

    - name: "Обработка привязок ролей топиков старого формата после прямых ключей"
      ansible.builtin.include_tasks: topic_roles.yml
      loop: "{{ _application_topic_bindings | dict2items }}"
      loop_control:
        loop_var: topic_connection
        label: "{{ topic_connection.key }}"
      when: topic_connection.value is mapping

    - name: "Подготовка параметров узла перед вычислением зависимых параметров приложения"
      ansible.builtin.set_fact:
        application_parameters: >-
          {{ (_application_shared.defaults.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}) |
             combine(vars['_application_package_' ~ ((application_job.libraryId ~ application_job.slotId ~ application_job.hostId) | hash('sha256'))].platform_application_definition.defaults.parameters | default({}), recursive=true, list_merge='replace') |
             combine(application_job.slot.overrides.parameters | default({}), recursive=true, list_merge='replace') |
             combine(_application_shared.overrides.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') |
             combine(application_job.instance.overrides.parameters | default({}), recursive=true, list_merge='replace') |
             combine(application_job.hostOverride.parameters | default({}), recursive=true, list_merge='replace') }}
      no_log: true
      become: false

    - name: Определение параметров приложения после привязки идентификатора размещения
      ansible.builtin.set_fact:
        application_parameters: >-
          {{ (_application_shared.defaults.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}) |
             combine(_application_package.platform_application_definition.defaults.parameters | default({}), recursive=true, list_merge='replace') |
             combine(application_job.slot.overrides.parameters | default({}), recursive=true, list_merge='replace') |
             combine(_application_shared.overrides.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') |
             combine(application_job.instance.overrides.parameters | default({}), recursive=true, list_merge='replace') |
             combine(application_job.hostOverride.parameters | default({}), recursive=true, list_merge='replace') }}
      no_log: true
      become: false

    - name: Вычисление значений приложения по умолчанию с сохранением типов
      platform.core.prepare_application_libraries:
        application_defaults: true
        defaults_path: "{{ application_job.application.defaultsPath }}"
      register: _application_defaults
      no_log: true
      become: false

    - name: Определение наследуемых настроек приложения без явных переопределений
      ansible.builtin.set_fact:
        application_inherited: >-
          {{ (_application_shared.defaults if application_job.slot.inherit_defaults | default(true) else {}) |
             combine(_application_defaults.defaults, recursive=true, list_merge='replace') |
             combine(({'endpoint': _application_library_endpoint} if _application_library_endpoint else {}), recursive=true, list_merge='replace') |
             combine(application_job.slot.overrides | default({}), recursive=true, list_merge='replace') |
             combine(_application_shared.overrides if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') }}
      no_log: true
      become: false

    - name: Сбор служебной записи рассчитанных параметров для структурированных операций
      ansible.builtin.set_fact:
        _library_resolved_defaults: >-
          {{ (_library_resolved_defaults | combine({_library_resolution_key: {
             'resourceDefaults': _application_resource_defaults,
             'resources': _application_resources,
             'shared': _application_shared}}))
             if application_job.reuseLibraryDefaults and not _application_library_inputs else omit }}
        "_application_resolved_row_{{ _application_row_index }}": >-
          {{ {
            'libraryId': application_job.libraryId,
            'libraryRef': application_job.deployment.libraryRef,
            'slotId': application_job.slotId,
            'startupPriority': application_job.slot.start_priority | default(100),
            'instanceId': application_instance_id,
            'instanceIdStrategy': application_job.library.definition.instance_id_strategy | default('qualified'),
            'applicationName': application_name,
            'applicationVersion': application_job.application.version,
            'hostId': application_job.hostId,
            'runtimeRef': application_job.deployment.runtimeRef,
            'runtimeDirectory': application_job.deployment.runtime_directory | default(_library_package.platform_library_definition.runtime_directory | default('~/' ~ application_job.libraryId), true),
            'libraryConnections': _library_package.platform_library_definition.connections | default({}),
            'providedConnections': {} if application_job.skipConnectionTopology else
              (platform_application_connection_rows |
               selectattr('libraryId', 'equalto', application_job.libraryId) | first).providedConnections,
            'bindings': application_job.deployment.bindings | default({}),
            'vaultRef': {'binding': 'secrets'} if application_job.deployment.bindings.secrets is defined else (application_job.deployment.vault_ref | default({})),
            'registryCredentials': application_job.deployment.registry_credentials | default({}),
            'resources': _application_resources,
            'resourceDefaults': _application_resource_defaults,
            'sharedSecrets': _library_package.platform_library_definition.shared_secrets | default({}) |
              combine(application_job.deployment.shared_secrets | default({}), recursive=false),
            'connectionDefaults': _library_package.platform_library_definition.connection_defaults | default({}) |
              combine(application_job.deployment.connection_defaults | default({}), recursive=true, list_merge='replace'),
            'connections': _application_connections,
            'identityNames': _application_package.platform_application_definition.identity_environment | default([]),
            'packageIdentity': {'application': application_job.application.digest, 'library': application_job.library.digest},
            'libraryScripts': application_job.library.scripts | default([]),
            'applicationScripts': application_job.application.scripts | default([]),
            'commonDefaults': _application_shared.defaults | combine(_application_shared.overrides, recursive=true, list_merge='replace'),
            'inherited': {'environment': application_inherited.environment | default({}), 'parameters': application_inherited.parameters | default({})},
            'settings': application_inherited |
              combine(application_job.instance.overrides | default({}), recursive=true, list_merge='replace') |
              combine(({'accounts': application_job.instance.accounts} if application_job.instance.accounts is defined else {}), recursive=true, list_merge='replace') |
              combine(application_job.hostOverride, recursive=true, list_merge='replace') |
              platform.core.application_account_policies([
                _application_defaults.defaults,
                application_job.slot.overrides | default({}),
                application_job.instance.overrides | default({}),
                {'accounts': application_job.instance.accounts | default({})},
                application_job.hostOverride])
          } }}
      no_log: true
      become: false
  rescue:
    - name: Публикация конкретной причины отказа расчёта приложения
      platform.core.prepare_application_libraries:
        diagnose_failure: true
        library_id: "{{ application_job.libraryId }}"
        slot_id: "{{ application_job.slotId }}"
        host_id: "{{ application_job.hostId }}"
        stage: application-settings
      register: _application_failed
      no_log: true
      become: false

    - name: Добавление ошибки настроек приложения в замечания проекта
      ansible.builtin.set_fact:
        platform_application_findings: "{{ platform_application_findings + [_application_failed.finding] }}"
        "_application_resolved_row_{{ _application_row_index }}": "{{ false }}"
      no_log: true
      become: false
