---
- name: Load validated library defaults in an isolated namespace
  ansible.builtin.include_vars:
    file: "{{ application_job.library.defaultsPath }}"
    name: "_library_package_{{ (application_job.libraryId ~ application_job.hostId) | hash('sha256') }}"
  no_log: true
  become: false

- name: Load validated application defaults in an isolated namespace
  ansible.builtin.include_vars:
    file: "{{ application_job.application.defaultsPath }}"
    name: "_application_package_{{ (application_job.libraryId ~ application_job.slotId ~ application_job.hostId) | hash('sha256') }}"
  no_log: true
  become: false

- name: Bind identities and parameter context independently for this placement
  ansible.builtin.set_fact:
    application_name: "{{ application_job.application.name }}"
    application_instance_id: "{{ application_job.application.name }}-{{ application_job.libraryId }}"
    library_instance_id: "{{ application_job.libraryId }}"
  no_log: true
  become: false

- name: Resolve parameters after this placement identity is available
  ansible.builtin.set_fact:
    application_parameters: >-
      {{ (application_job.commonDefaults.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}) |
         combine(_application_package.platform_application_definition.defaults.parameters | default({}), recursive=true, list_merge='replace') |
         combine(application_job.slot.overrides.parameters | default({}), recursive=true, list_merge='replace') |
         combine(application_job.commonOverrides.parameters | default({}) if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') |
         combine(application_job.instance.overrides.parameters | default({}), recursive=true, list_merge='replace') |
         combine(application_job.hostOverride.parameters | default({}), recursive=true, list_merge='replace') }}
  no_log: true
  become: false

- name: Resolve inherited settings without this application's explicit overrides
  ansible.builtin.set_fact:
    application_inherited: >-
      {{ (application_job.commonDefaults if application_job.slot.inherit_defaults | default(true) else {}) |
         combine(_application_package.platform_application_definition.defaults, recursive=true, list_merge='replace') |
         combine(application_job.slot.overrides | default({}), recursive=true, list_merge='replace') |
         combine(application_job.commonOverrides if application_job.slot.inherit_defaults | default(true) else {}, recursive=true, list_merge='replace') }}
  no_log: true
  become: false

- name: Collect machine-owned resolved row for existing structured actions
  ansible.builtin.set_fact:
    platform_application_rows: >-
      {{ platform_application_rows + [{
        'libraryId': application_job.libraryId,
        'libraryRef': application_job.deployment.libraryRef,
        'slotId': application_job.slotId,
        'instanceId': application_instance_id,
        'applicationName': application_name,
        'applicationVersion': application_job.application.version,
        'hostId': application_job.hostId,
        'runtimeRef': application_job.deployment.runtimeRef,
        'runtimeDirectory': application_job.deployment.runtime_directory | default(_library_package.platform_library_definition.runtime_directory | default('~/' ~ application_job.libraryId), true),
        'libraryConnections': _library_package.platform_library_definition.connections | default({}),
        'bindings': application_job.deployment.bindings | default({}),
        'vaultRef': application_job.deployment.vault_ref | default({}),
        'resources': application_job.deployment.resources | default({}),
        'resourceDefaults': _library_package.platform_library_definition.resource_defaults | default({}) |
          combine(application_job.deployment.resource_defaults | default({}), recursive=true, list_merge='replace'),
        'sharedSecrets': _library_package.platform_library_definition.shared_secrets | default({}) |
          combine(application_job.deployment.shared_secrets | default({}), recursive=true, list_merge='replace'),
        'connectionDefaults': _library_package.platform_library_definition.connection_defaults | default({}) |
          combine(application_job.deployment.connection_defaults | default({}), recursive=true, list_merge='replace'),
        'connections': _application_package.platform_application_definition.connections | default({}),
        'identityNames': _application_package.platform_application_definition.identity_environment | default([]),
        'packageIdentity': {'application': application_job.application.digest, 'library': application_job.library.digest},
        'commonDefaults': application_job.commonDefaults | combine(application_job.commonOverrides, recursive=true, list_merge='replace'),
        'inherited': {'environment': application_inherited.environment | default({}), 'parameters': application_inherited.parameters | default({})},
        'settings': application_inherited |
          combine(application_job.instance.overrides | default({}), recursive=true, list_merge='replace') |
          combine(({'accounts': application_job.instance.accounts} if application_job.instance.accounts is defined else {}), recursive=true, list_merge='replace') |
          combine(application_job.hostOverride, recursive=true, list_merge='replace') |
          platform.core.application_account_policies([
            _application_package.platform_application_definition.defaults,
            application_job.slot.overrides | default({}),
            application_job.instance.overrides | default({}),
            {'accounts': application_job.instance.accounts | default({})},
            application_job.hostOverride])
      }] }}
  no_log: true
  become: false
