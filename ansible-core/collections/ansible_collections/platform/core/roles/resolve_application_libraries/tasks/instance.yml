---
- name: Расчёт общих и серверных настроек приложений
  platform.core.prepare_application_libraries:
    placements: true
  register: _application_group_result
  no_log: true
  become: false

- name: Сохранение строк размещений и библиотечных контекстов
  ansible.builtin.set_fact:
    platform_application_rows: "{{ _application_group_result.rows }}"
    _library_resolved_defaults: "{{ _application_group_result.library_contexts }}"
    platform_application_findings: "{{ platform_application_findings + _application_group_result.findings }}"
  no_log: true
  become: false
