---
- name: Проверка наличия утверждённых источников артефактов Core для развёртывания сервиса
  ansible.builtin.assert:
    that:
      - platform_execution_service_deployment is string
      - platform_artifact_source_authorities_by_deployment is mapping
      - platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment] is defined
      - platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.id] is defined
  loop: "{{ platform_artifact_requirements }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Пакетная проверка настроенного репозитория целевого узла
  ansible.builtin.command:
    argv: >-
      {{ ['dnf', '-q', 'repoquery', '--queryformat', '%{name}\t%{version}\t%{arch}'] +
         (platform_artifact_requirements | map(attribute='id') |
          map('extract', platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment]) |
          map(attribute='requirement.name') | unique | sort | list) }}
  register: _platform_artifact_repository_batch
  changed_when: false
  failed_when: false
  no_log: true
  when: platform_artifact_requirements | length > 0

- name: Инициализация результатов проверки требований репозитория
  ansible.builtin.set_fact:
    platform_artifact_source_repository_probes: {results: []}
  no_log: true

- name: Привязка успешного общего ответа к каждому требованию Core
  ansible.builtin.set_fact:
    platform_artifact_source_repository_probes: >-
      {{ {'results': platform_artifact_source_repository_probes.results + [{
           'item': item, 'rc': 0, 'stdout': _platform_artifact_repository_batch.stdout
         }]} }}
  loop: "{{ platform_artifact_requirements }}"
  when: _platform_artifact_repository_batch.rc | default(1) == 0
  no_log: true

- name: Раздельная проверка требований при неуспешном общем запросе
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --queryformat
      - "%{name}\t%{version}\t%{arch}"
      - "{{ platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.id].requirement.name }}"
  loop: "{{ platform_artifact_requirements }}"
  loop_control:
    label: "{{ item.id }}"
  register: _platform_artifact_repository_individual
  changed_when: false
  failed_when: false
  no_log: true
  when: _platform_artifact_repository_batch.rc | default(1) != 0

- name: Сохранение раздельных результатов проверки репозитория
  ansible.builtin.set_fact:
    platform_artifact_source_repository_probes: "{{ _platform_artifact_repository_individual }}"
  when: _platform_artifact_repository_batch.rc | default(1) != 0
  no_log: true

- name: Чтение идентификатора целевой операционной системы для проверки совместимости
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - /^ID=/{gsub(/"/, "", $2); print $2; exit}
      - /etc/os-release
  register: platform_artifact_source_target_os
  changed_when: false
  failed_when: false
  no_log: true

- name: "Выбор разрешённого Core источника: репозиторий, затем offline-пакет"
  ansible.builtin.set_fact:
    platform_resolved_artifact_sources: >-
      {{ platform_resolved_artifact_sources | default({}) | combine({
          item.item.id: (platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.item.id]
            | platform.core.platform_resolve_artifact_source(item.item, inventory_hostname,
                platform_artifact_source_target_os.stdout | default(''),
                item.stdout | default(''), item.rc | default(1)))
        }) }}
  loop: "{{ platform_artifact_source_repository_probes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id }}"
  no_log: true
