---
- name: Проверить наличие утверждённых источников артефактов Core для развёртывания сервиса
  ansible.builtin.assert:
    that:
      - platform_execution_service_deployment is string
      - platform_artifact_source_authorities_by_deployment is mapping
      - platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment] is defined
      - platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.id] is defined
  loop: "{{ platform_artifact_requirements }}"
  loop_control:
    label: "{{ item.id }}"
  no_log: true

- name: Проверить существующий целевой репозиторий на наличие требований, авторизованных Core
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --queryformat
      - "%{name}\t%{version}\t%{arch}"
      - "{{ platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.id].requirement.name }}"
  loop: "{{ platform_artifact_requirements }}"
  loop_control:
    label: "{{ item.id }}"
  register: platform_artifact_source_repository_probes
  changed_when: false
  failed_when: false
  no_log: true

- name: Прочитать идентификатор целевой операционной системы для проверки совместимости
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - /^ID=/{gsub(/"/, "", $2); print $2; exit}
      - /etc/os-release
  register: platform_artifact_source_target_os
  changed_when: false
  failed_when: false
  no_log: true

- name: "Выбрать разрешённый Core источник: репозиторий, затем offline-пакет"
  ansible.builtin.set_fact:
    platform_resolved_artifact_sources: >-
      {{ platform_resolved_artifact_sources | default({}) | combine({
          item.item.id: (platform_artifact_source_authorities_by_deployment[platform_execution_service_deployment][item.item.id]
            | platform.core.platform_resolve_artifact_source(item.item, inventory_hostname,
                platform_artifact_source_target_os.stdout | default(''),
                item.stdout | default(''), item.rc | default(1)))
        }) }}
  loop: "{{ platform_artifact_source_repository_probes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id }}"
  no_log: true
