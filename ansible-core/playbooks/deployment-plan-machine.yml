---
- name: Создание машиночитаемого плана развертывания без целевых объектов
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Проверка настроек ресурсов переносимой службы
      ansible.builtin.include_role:
        name: platform.core.project_settings
      run_once: true

    - name: Разрешить дополнительные библиотеки приложений с помощью обычного Ansible
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
      when: platform_desired_state.applicationLibraryDeployments is defined

    - name: Создание авторитетного моментального снимка проекта без целевых объектов
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
        installer_owned_paths: "{{ platform_installer_owned_paths | default([]) }}"
      changed_when: false
      become: false
      register: platform_plan_snapshot

    - name: Загрузка авторитетного каталога сервисов
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: platform_plan_catalog_file
      changed_when: false

    - name: Разработать авторитетный общественный план
      platform.core.build_deployment_plan:
        snapshot: "{{ platform_plan_snapshot.snapshot }}"
        service_catalog: "{{ platform_plan_catalog_file.platform_service_catalog | default(platform_plan_catalog_file, true) }}"
        runtime_release: "{{ platform_execution_runtime_release }}"
        bundle_artifact_sources: "{{ platform_execution_bundle_artifact_sources | default([]) }}"
        pki_materialization: "{{ platform_plan_snapshot.pki_materialization | default({}) }}"
        pki_state_root: "{{ platform_execution_state_root | default('/var/lib/platform-installer/execution') }}"
        execution_configuration: "{{ platform_plan_snapshot.execution_configuration | default({}) }}"
        execution_connections: "{{ platform_plan_snapshot.execution_connections | default({}) }}"
        deployment_order: "{{ platform_execution_deployment_order }}"
        skip_application_libraries: "{{ platform_execution_skip_application_libraries | default(omit) }}"
        application_library_order: "{{ platform_execution_application_library_order | default(omit) }}"
        application_vault_sources: "{{ platform_execution_application_vault_sources | default({}) }}"
        execution_mode: "{{ platform_execution_mode | default(omit) }}"
        skip_infrastructure_verify: "{{ platform_execution_skip_infrastructure_verify | default(false) }}"
        application_image_lock: "{{ platform_plan_snapshot.application_image_lock | default({}) }}"
        application_image_metadata: "{{ platform_application_image_metadata | default(platform_prepared_application_images is defined) }}"
      changed_when: false
      become: false
