---
- name: Создание машиночитаемого плана развёртывания без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешение проекта для авторитетного плана
      ansible.builtin.include_role:
        name: platform.core.project_resolution

    - name: Проверка наличия подготовленных метаданных образов
      ansible.builtin.stat:
        path: "{{ platform_plan_prepared_images_path }}"
        follow: false
      register: platform_plan_prepared_images_file
      when: platform_plan_prepared_images_path is defined

    - name: Описание образов из проекции плана
      when:
        - platform_plan_prepared_images_path is defined
        - not platform_plan_prepared_images_file.stat.exists
      block:
        - platform.core.prepare_application_images:
            project_root: "{{ platform_project_root }}"
            bundle_root: "{{ platform_execution_bundle_root }}"
            snapshot: "{{ platform_project_resolution.snapshot }}"
            connections: "{{ platform_project_resolution.execution_connections }}"
            application_rows: "{{ platform_project_resolution.application_rows }}"
          register: platform_plan_image_inputs
        - ansible.builtin.copy:
            content: "{{ platform_plan_image_inputs.inputs | to_json }}"
            dest: "{{ platform_application_image_inputs_path }}"
            mode: '0600'
        - ansible.builtin.meta: end_play

    - name: Добавление проверенных метаданных образов в проекцию плана
      when: platform_plan_prepared_images_path is defined
      block:
        - ansible.builtin.include_vars:
            file: "{{ platform_plan_prepared_images_path }}"
            name: platform_plan_prepared_images
        - platform.core.project_snapshot:
            resolved_result_variable: platform_project_resolution
            prepared_application_images: "{{ platform_plan_prepared_images }}"
          register: platform_plan_enriched_resolution
          no_log: true
        - ansible.builtin.set_fact:
            platform_project_resolution: "{{ platform_plan_enriched_resolution }}"
          no_log: true

    - name: Сохранение разрешённых входов планировщика
      ansible.builtin.set_fact:
        platform_plan_snapshot: "{{ platform_project_resolution }}"
      no_log: true

    - name: Загрузка каталога сервисов
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: platform_plan_catalog_file
      changed_when: false

    - name: "Формирование плана развёртывания для внешнего интерфейса"
      platform.core.build_deployment_plan:
        snapshot: "{{ platform_plan_snapshot.snapshot }}"
        service_catalog: "{{ platform_plan_catalog_file.platform_service_catalog | default(platform_plan_catalog_file, true) }}"
        runtime_release: "{{ platform_execution_runtime_release }}"
        bundle_artifact_sources: "{{ platform_execution_bundle_artifact_sources | default([]) }}"
        pki_materialization: "{{ platform_plan_snapshot.pki_materialization | default({}) }}"
        application_pki_bindings: "{{ platform_plan_snapshot.application_pki_bindings | default(omit) }}"
        pki_state_root: "{{ platform_execution_state_root | default('/var/lib/platform-installer/execution') }}"
        execution_configuration: "{{ platform_plan_snapshot.execution_configuration | default({}) }}"
        execution_connections: "{{ platform_plan_snapshot.execution_connections | default({}) }}"
        deployment_order: "{{ platform_execution_deployment_order }}"
        skip_service_deployments: "{{ platform_execution_skip_service_deployments | default(omit) }}"
        skip_application_libraries: "{{ platform_execution_skip_application_libraries | default(omit) }}"
        application_library_order: "{{ platform_execution_application_library_order | default(omit) }}"
        application_vault_sources: "{{ platform_execution_application_vault_sources | default({}) }}"
        execution_mode: "{{ platform_execution_mode | default(omit) }}"
        skip_infrastructure_verify: "{{ platform_execution_skip_infrastructure_verify | default(false) }}"
        application_image_lock: "{{ platform_plan_snapshot.application_image_lock | default({}) }}"
        application_image_metadata: "{{ platform_application_image_metadata | default(platform_prepared_application_images is defined or platform_plan_prepared_images_path is defined) }}"
        deferred_application_images: "{{ platform_application_deferred_images | default(platform_plan_prepared_images_path is defined) }}"
      changed_when: false
      become: false
