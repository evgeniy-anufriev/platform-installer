---
- import_playbook: application-libraries-resolve-runtime.yml

- name: Проверка приложений без мутаций
  hosts: platform_targets
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Один раз обнаружить идентификаторы учетной записи Docker для проверки только для чтения
      ansible.builtin.getent:
        database: passwd
      when: hostvars['localhost'].application_runtime_inputs.jobs | selectattr('hostId', 'equalto', inventory_hostname) | list | length > 0
    - name: Проверка точного размещения каждого приложения
      ansible.builtin.include_role:
        name: platform.core.application_runtime
        tasks_from: verify
      vars:
        application_runtime_verify_vault: false
        application_runtime_job: >-
          {{ application_verify_input | combine({'dockerEnvironment': {
            'HOME': getent_passwd[application_verify_input.account][4],
            'XDG_RUNTIME_DIR': '/run/user/' ~ getent_passwd[application_verify_input.account][1],
            'DOCKER_HOST': 'unix:///run/user/' ~ getent_passwd[application_verify_input.account][1] ~ '/docker.sock',
            'DOCKER_CONFIG': platform_application_registry_config_directory if platform_application_registry_config_directory else getent_passwd[application_verify_input.account][4] ~ '/.docker'}}) }}
      loop: "{{ hostvars['localhost'].application_runtime_inputs.jobs | selectattr('hostId', 'equalto', inventory_hostname) | list }}"
      loop_control:
        loop_var: application_verify_input

- import_playbook: application-libraries-endpoint-stage.yml
  vars:
    platform_endpoint_verify_only: true
