---
- name: "Формирование описаний runtime-секретов без обращения к целевым узлам"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешение проекта для описаний секретов
      ansible.builtin.include_role:
        name: platform.core.project_resolution
    - name: Сохранение разрешённых входов описаний секретов
      ansible.builtin.set_fact:
        platform_secret_snapshot: "{{ platform_project_resolution }}"
      no_log: true
    - ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: platform_secret_catalog
      changed_when: false
    - platform.core.build_runtime_secret_descriptors:
        snapshot: "{{ platform_secret_snapshot.snapshot }}"
        application_image_lock: "{{ platform_secret_snapshot.application_image_lock | default({}) }}"
        pki_materialization: "{{ platform_secret_snapshot.pki_materialization | default({}) }}"
        service_catalog: "{{ platform_secret_catalog.platform_service_catalog | default(platform_secret_catalog, true) }}"
      register: platform_secret_descriptors
      changed_when: false
