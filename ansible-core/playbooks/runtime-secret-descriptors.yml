---
- name: Создание безопасных секретных дескрипторов среды выполнения без целевых объектов
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешить дополнительные библиотеки приложений с помощью обычного Ansible
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
      when: platform_desired_state.applicationLibraryDeployments is defined
    - platform.core.project_snapshot:
        project_root: "{{ platform_project_root }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: platform_secret_snapshot
      changed_when: false
    - ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: platform_secret_catalog
      changed_when: false
    - platform.core.build_runtime_secret_descriptors:
        snapshot: "{{ platform_secret_snapshot.snapshot }}"
        application_image_lock: "{{ platform_secret_snapshot.application_image_lock | default({}) }}"
        pki_materialization: "{{ platform_secret_snapshot.pki_materialization | default({}) }}"
        service_catalog: "{{ platform_secret_catalog.platform_service_catalog | default(platform_secret_catalog, true) }}"
      register: platform_secret_descriptors
      changed_when: false
