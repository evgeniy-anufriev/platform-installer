---
- name: Resolve the already preflighted provider placement
  ansible.builtin.set_fact:
    application_script_target_job: >-
      {{ hostvars[application_provider_script_host].platform_application_preflight_jobs |
         selectattr('libraryId', 'equalto', application_provider_batch.providerLibraryId) |
         selectattr('instanceId', 'equalto', application_provider_batch.providerInstanceId) | first }}
  no_log: true

- name: Invoke the generic runner with explicit script inputs on the selected target
  ansible.builtin.include_role:
    name: platform.core.package_script
    apply:
      delegate_to: "{{ 'localhost' if application_provider_script.runOn | default('target') == 'execution_node' else application_provider_script_host }}"
      become: "{{ application_provider_script.runOn | default('target') != 'execution_node' }}"
  vars:
    platform_script_job:
      id: "{{ application_provider_script.id }}"
      path: "{{ application_provider_script.path }}"
      argv: "{{ application_provider_script.argv }}"
      secretInputs: "{{ application_provider_script.secretInputs }}"
      account: "{{ lookup('ansible.builtin.pipe', 'id -un') if application_provider_script.runOn | default('target') == 'execution_node' else application_script_target_job.account }}"
      workingDirectory: "{{ (platform_project_root | default(hostvars['localhost'].inventory_dir | dirname)) if application_provider_script.runOn | default('target') == 'execution_node' else application_script_target_job.instancePath }}"
    platform_script_secret_files: >-
      {{ hostvars['localhost'].platform_application_secret_files |
         combine(hostvars['localhost'].platform_application_credential_files | default({})) |
         combine(application_provider_private_files | default({})) }}
    platform_script_secret_root: "{{ hostvars['localhost'].platform_application_secret_root }}"
