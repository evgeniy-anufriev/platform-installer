---
- name: Определение сохранённых настроек службы на контроллере без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Создание предварительного просмотра настроек сервиса
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
        configuration_only: true
      register: platform_service_configuration_preview
      run_once: true
      become: false
      check_mode: false
