---
- name: Run common endpoint hooks in the original Ansible execution context
  hosts: platform_targets
  strategy: linear
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Publish selected ready logical sources with existing provider tasks
      ansible.builtin.include_tasks: ../../services/integrations/tasks/apply-source.yml
      vars:
        platform_endpoint_source_ids: "{{ hostvars['localhost'].platform_endpoint_sources | default({}) | sort }}"
      when: hostvars['localhost'].platform_endpoint_sources | default({}) | length > 0
