---
- import_playbook: application-libraries-providers-preflight.yml
- name: Подготовка всех ресурсов библиотеки перед учетной записью приложения
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Проверка ресурсов каждой библиотеки
      ansible.builtin.include_role:
        name: platform.postgresql.application_provider
        tasks_from: resources
      loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
      loop_control:
        loop_var: platform_postgresql_application_job
    - name: Проверить каждую область базы данных библиотеки ClickHouse перед учетными записями приложений
      ansible.builtin.include_role:
        name: platform.clickhouse.application_provider
        tasks_from: resources
      loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
      loop_control:
        loop_var: platform_clickhouse_application_job
    - name: Убедиться, что каждая учетная запись экземпляра приложения предоставляет права и доступ с проверкой подлинности
      ansible.builtin.include_role:
        name: platform.postgresql.application_provider
        tasks_from: accounts
      loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
      loop_control:
        loop_var: platform_postgresql_application_job
    - name: Проверка области каждого логического экземпляра Redis и Sentinel
      ansible.builtin.include_role:
        name: platform.redis.application_provider
        tasks_from: accounts
      loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
      loop_control:
        loop_var: platform_redis_application_job
    - name: Проверка каждой учетной записи логического экземпляра ClickHouse и предоставление области предоставления
      ansible.builtin.include_role:
        name: platform.clickhouse.application_provider
        tasks_from: accounts
      loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
      loop_control:
        loop_var: platform_clickhouse_application_job
