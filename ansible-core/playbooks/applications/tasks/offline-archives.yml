---
- name: Инициализировать выбранные записи offline-архивов библиотек приложений
  ansible.builtin.set_fact:
    application_selected_offline_archives: []

- name: Собрать только архивы, выбранные в ходе целевой предварительной проверки
  ansible.builtin.set_fact:
    application_selected_offline_archives: >-
      {{ (application_selected_offline_archives +
          (hostvars[item].platform_application_preflight_jobs | default([])
           | selectattr('source.source', 'equalto', 'OFFLINE_BUNDLE')
           | map(attribute='authority.offlineBundle') | list)) | unique | list }}
  loop: "{{ groups['platform_targets'] | default([]) }}"
  no_log: true

- name: Проверить каждый уникальный выбранный автономный архив перед мутациями
  ansible.builtin.assert:
    that: >-
      (platform_execution_bundle_root | default('')
       | platform.core.application_selected_archive('OFFLINE_BUNDLE', item)) is string
    fail_msg: APPLICATION_IMAGE_ARCHIVE_INVALID
  loop: "{{ application_selected_offline_archives }}"
  loop_control:
    label: "{{ item.ref }}"
  no_log: true
