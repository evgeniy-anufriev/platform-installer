---
- name: Отметить начало установки библиотеки
  ansible.builtin.debug:
    msg:
      id: "applications:library:{{ application_library_id }}"
      state: started
  tags: [platform_application_progress]
  run_once: true
  when: application_library_id in hostvars['localhost'].application_selection.scope.installLibraries

- name: Привязать выбранные логические экземпляры библиотеки приложений
  ansible.builtin.set_fact:
    application_library_instance_ids: >-
      {{ hostvars['localhost'].application_runtime_inputs.jobs | selectattr('libraryId', 'equalto', application_library_id) |
         sort(attribute='instanceId') | sort(attribute='startupPriority') |
         map(attribute='instanceId') | unique | list }}
  no_log: true

- name: Материализовать выбранные размещения библиотеки приложений без запуска контейнеров
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: apply_library
  when: platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list | length > 0

- name: Доставить выбранные образы библиотеки перед выполнением сценариев pre_start
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: image_delivery
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: "Выполнить сценарии pre_start после подготовки файлов библиотеки"
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: run_scripts
  vars:
    application_script_phase: before_start
    application_script_scope: library
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: "Обработать экземпляры приложения с проверкой завершения каждого этапа"
  ansible.builtin.include_tasks: ordered-instance.yml
  loop: "{{ application_library_instance_ids }}"
  loop_control:
    loop_var: application_instance_id

- name: "Выполнить сценарии готовности библиотеки перед публикацией конечной точки"
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: run_scripts
  vars:
    application_script_phase: after_ready
    application_script_scope: library
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: Опубликовать и проверить готовые конечные точки библиотеки приложений
  ansible.builtin.include_tasks: ../../../../services/integrations/tasks/apply-source.yml
  vars:
    platform_endpoint_source_ids: >-
      {{ application_library_instance_ids |
         difference(hostvars['localhost'].application_runtime_inputs.integrations.batches |
           selectattr('providerLibraryId', 'equalto', application_library_id) | map(attribute='providerInstanceId') | list) |
         intersect(hostvars['localhost'].platform_endpoint_sources | default({}) | list) | sort }}
  when: >-
    application_library_instance_ids |
    difference(hostvars['localhost'].application_runtime_inputs.integrations.batches |
      selectattr('providerLibraryId', 'equalto', application_library_id) | map(attribute='providerInstanceId') | list) |
    intersect(hostvars['localhost'].platform_endpoint_sources | default({}) | list) | length > 0

- name: Проверить размещения библиотеки приложений перед обработкой следующей библиотеки
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: verify
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: "Подготовить потребителей провайдера, установка которого явно пропущена"
  ansible.builtin.include_tasks: provider-batch.yml
  loop: "{{ hostvars['localhost'].application_runtime_inputs.integrations.batches | selectattr('providerLibraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_provider_batch
  when: application_library_id in hostvars['localhost'].application_selection.scope.skippedLibraries
  run_once: true

- name: Доставка готовых секретов потребителя после обратных вызовов пропущенного провайдера
  ansible.builtin.include_tasks: deliver-ready.yml
  when: application_library_id in hostvars['localhost'].application_selection.scope.providerLibraries and application_library_id in hostvars['localhost'].application_selection.scope.skippedLibraries
  run_once: true

- name: "Выполнить объявленные обработчики интеграции на выбранных узлах размещения"
  ansible.builtin.include_tasks: provider-script.yml
  vars:
    application_provider_batch:
      providerLibraryId: "{{ application_integration_script.libraryId }}"
      providerInstanceId: "{{ application_integration_script.instanceId }}"
    application_provider_script: "{{ application_integration_script }}"
    application_provider_script_host: "{{ application_integration_script.hostId }}"
  loop: "{{ hostvars['localhost'].application_runtime_inputs.integrationScripts | selectattr('libraryId', 'equalto', application_library_id) | list }}"
  loop_control:
    loop_var: application_integration_script
  run_once: true

- name: Отметить завершение установки и проверки библиотеки
  ansible.builtin.debug:
    msg:
      id: "applications:library:{{ application_library_id }}"
      state: completed
  tags: [platform_application_progress]
  run_once: true
  when: application_library_id in hostvars['localhost'].application_selection.scope.installLibraries
