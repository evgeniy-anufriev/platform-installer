---
- name: Проверить полноту пакетов провайдеров перед запуском потребителя приложения
  ansible.builtin.assert:
    that: >-
      (application_library_id ~ '/' ~ application_instance_id) not in
      (hostvars['localhost'].application_runtime_inputs.integrations |
       platform.core.application_pending_instances(hostvars['localhost'].platform_application_completed_batches))
    fail_msg: APPLICATION_PROVIDER_PREPARATION_INCOMPLETE

- name: Материализовать отложенные входные данные потребительского агента только после полной доставки Vault
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: apply_instance
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | selectattr('instanceId', 'equalto', application_instance_id) | list }}"
  loop_control:
    loop_var: application_runtime_job
  when: (application_library_id ~ '/' ~ application_instance_id) in hostvars['localhost'].application_runtime_inputs.integrations.dependencies

- name: Выполнить сценарии pre_start экземпляра после доставки всех образов
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: run_scripts
  vars:
    application_script_phase: before_start
    application_script_scope: instance
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | selectattr('instanceId', 'equalto', application_instance_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: Активировать и проверить размещения логического экземпляра приложения
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: activate_instance
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | selectattr('instanceId', 'equalto', application_instance_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: Запускать готовые сценарии только после того, как каждое размещение будет работоспособным
  ansible.builtin.include_role:
    name: platform.core.application_runtime
    tasks_from: run_scripts
  vars:
    application_script_phase: after_ready
    application_script_scope: instance
  loop: "{{ platform_application_preflight_jobs | selectattr('libraryId', 'equalto', application_library_id) | selectattr('instanceId', 'equalto', application_instance_id) | list }}"
  loop_control:
    loop_var: application_runtime_job

- name: Привязать выбранные пакеты потребителей готового экземпляра приложения
  ansible.builtin.set_fact:
    application_ready_provider_batches: >-
      {{ hostvars['localhost'].application_runtime_inputs.integrations.batches |
         selectattr('providerLibraryId', 'equalto', application_library_id) |
         selectattr('providerInstanceId', 'equalto', application_instance_id) | list }}
  no_log: true

- name: Опубликовать и проверить конечную точку готового провайдера до запуска потребителей
  ansible.builtin.include_tasks: ../../../../services/integrations/tasks/apply-source.yml
  vars:
    platform_endpoint_source_ids: "{{ [application_instance_id] }}"
  when: application_ready_provider_batches | length > 0

- name: Подготовить выбранных потребителей пакетов готового провайдера приложения
  ansible.builtin.include_tasks: provider-batch.yml
  loop: "{{ application_ready_provider_batches }}"
  loop_control:
    loop_var: application_provider_batch
  run_once: true

- name: Полная стандартная доставка Vault для всех потребителей, чьи провайдери готовы
  ansible.builtin.include_tasks: deliver-ready.yml
  when: application_ready_provider_batches | length > 0
  run_once: true
