---
- name: Выполнение перехватчиков интеграции в объявленном порядке перед пакетом учетных записей
  ansible.builtin.include_tasks: provider-script.yml
  vars:
    application_provider_script: "{{ application_provider_hook }}"
    application_provider_script_host: "{{ application_provider_hook.target.hostId }}"
  loop: "{{ application_provider_batch.hooks }}"
  loop_control:
    loop_var: application_provider_hook

- name: Согласовать пакет учётных записей провайдера через защищённые файлы
  when: application_provider_batch.accounts | length > 0
  block:
    - name: Разрешить обратный вызов учетной записи из конкретного пакета провайдера
      platform.core.prepare_application_account_batch:
        batch: "{{ application_provider_batch }}"
        project_root: "{{ platform_project_root | default(hostvars['localhost'].inventory_dir | dirname) }}"
      delegate_to: localhost
      become: false
      register: application_account_callback
      no_log: true

    - name: Проверить защищённые исходные файлы всех паролей пакета учётных записей провайдера
      ansible.builtin.assert:
        that: >-
          {{ (hostvars['localhost'].platform_application_secret_files |
               combine(hostvars['localhost'].platform_application_credential_files | default({}))) |
             platform.core.application_protected_secret_files(
               application_account_callback.requests | map(attribute='passwordRef') | list,
               hostvars['localhost'].platform_application_secret_root) }}
        fail_msg: APPLICATION_PROVIDER_SECRET_FILE_INVALID
      delegate_to: localhost
      become: false
      no_log: true

    - name: Привязка значений частного пароля вызова без выходных данных общедоступного сценария
      ansible.builtin.set_fact:
        application_batch_passwords: "{{ application_batch_passwords | default({}) | combine({item.id: lookup('ansible.builtin.file', application_batch_source_files[item.passwordRef], rstrip=false)}) }}"
      vars:
        application_batch_source_files: "{{ hostvars['localhost'].platform_application_secret_files | combine(hostvars['localhost'].platform_application_credential_files | default({})) }}"
      loop: "{{ application_account_callback.requests }}"
      no_log: true

    - name: Разместить пакет учётных записей провайдера в защищённом каталоге контроллера
      ansible.builtin.copy:
        content: "{{ {'accounts': application_account_callback.accounts, 'passwords': application_batch_passwords} | to_json }}"
        dest: "{{ hostvars['localhost'].platform_application_secret_root }}/{{ application_provider_batch.id }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

    - name: Выполнить общий обратный вызов для пакета учётных записей провайдера
      ansible.builtin.include_tasks: provider-script.yml
      vars:
        application_provider_script: "{{ application_account_callback.script }}"
        application_provider_script_host: "{{ application_account_callback.targetHostId }}"
        application_provider_private_files: "{{ {application_provider_batch.id: hostvars['localhost'].platform_application_secret_root ~ '/' ~ application_provider_batch.id} }}"
  always:
    - name: Удалить временный файл пакета учётных записей провайдера
      ansible.builtin.file:
        path: "{{ hostvars['localhost'].platform_application_secret_root }}/{{ application_provider_batch.id }}"
        state: absent
      delegate_to: localhost
      become: false
      changed_when: false
      no_log: true
    - name: Отменить пакетные значения паролей перед другим провайдером
      ansible.builtin.set_fact:
        application_batch_passwords: {}
      no_log: true

- name: Запись только успешно завершенных пакетов провайдера в текущем вызове
  ansible.builtin.set_fact:
    platform_application_completed_batches: "{{ hostvars['localhost'].platform_application_completed_batches + [application_provider_batch.id] }}"
  delegate_to: localhost
  delegate_facts: true
  no_log: true
