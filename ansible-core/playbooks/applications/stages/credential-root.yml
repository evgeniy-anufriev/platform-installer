---
- name: "Согласовать основной и устаревший параметры каталога учётных данных"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Отклонить конфликтующие общие и устаревшие корни учетных данных
      ansible.builtin.assert:
        that: >-
          not (platform_application_secret_root | default(''))
          or not (platform_postgresql_application_secret_root | default(''))
          or platform_application_secret_root == platform_postgresql_application_secret_root
        fail_msg: APPLICATION_PROVIDER_SECRET_ROOT_CONFLICT
      no_log: true
    - name: Сохранить устаревшие входные данные PostgreSQL только в качестве псевдонима совместимости
      ansible.builtin.set_fact:
        platform_application_secret_root: "{{ platform_application_secret_root | default(platform_postgresql_application_secret_root | default(''), true) }}"
        platform_application_secret_files: "{{ platform_application_secret_files | default(platform_postgresql_secret_files | default({})) }}"
      no_log: true
