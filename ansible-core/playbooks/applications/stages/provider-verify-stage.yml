---
- name: Проверка провайдеров приложений без изменения сервиса
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Проверка логических областей с хранением учетных данных только для вызова
      when: application_provider_inputs.jobs | length > 0
      block:
        - name: Проверка защищённого runtime-каталога перед чтением учётных данных Vault
          ansible.builtin.assert:
            that: "{} | platform.core.application_protected_secret_files([], platform_application_secret_root)"
            fail_msg: APPLICATION_PROVIDER_SECRET_FILE_INVALID
          when: application_vault_inputs.sourceJobs | default([]) | length > 0
          no_log: true
        - name: Инициализация обнаружения Vault только тогда, когда учетная запись считывает существующий секрет
          ansible.builtin.set_fact:
            platform_application_vault_runtime: {}
          when: application_vault_inputs.sourceJobs | default([]) | length > 0
          no_log: true
        - name: Однократное обнаружение каждого провайдера источника учётных данных Vault
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: discover
          vars:
            platform_vault_application_single_provider: "{{ application_vault_inputs.providers | length == 1 }}"
          loop: "{{ application_vault_inputs.providers | default([]) | selectattr('providerId', 'in', application_vault_inputs.sourceJobs | default([]) | map(attribute='providerId') | unique | list) | list }}"
          loop_control:
            loop_var: platform_vault_application_provider
        - name: Чтение существующих источников учётных данных Vault для проверки провайдеров
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: sources
          loop: "{{ application_vault_inputs.sourceJobs | default([]) }}"
          loop_control:
            loop_var: application_vault_source
        - name: "Проверка топиков библиотеки Kafka без внесения изменений"
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_topics
          vars:
            platform_kafka_application_phase: verify
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'kafka') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Проверка аутентификации экземпляра Kafka и заданных ACL без внесения изменений
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_accounts
          vars:
            platform_kafka_application_phase: verify
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'kafka') | selectattr('accounts') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Сброс результатов обнаружения PostgreSQL перед проверкой провайдера
          ansible.builtin.set_fact:
            platform_application_provider_runtime: {}
        - name: Однократное обнаружение каждого развёртывания PostgreSQL для проверки
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: discover
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Проверка подлинности каждого ресурса библиотеки
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: verify
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Проверка учётных записей Redis и Sentinel без изменения ACL
          ansible.builtin.include_role:
            name: platform.redis.application_provider
            tasks_from: verify
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
          loop_control:
            loop_var: platform_redis_application_job
        - name: Проверка всех областей библиотеки и экземпляра ClickHouse без DDL
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: verify
          loop: "{{ (application_provider_inputs.libraryJobs + application_provider_inputs.instanceJobs) | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Проверка прав доступа каждого экземпляра приложения отдельно
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: verify
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
      always:
        - name: Удаление только файлов учётных данных текущей операции
          ansible.builtin.file:
            path: "{{ platform_application_secret_root }}/{{ item.passwordRef }}"
            state: absent
          loop: "{{ application_vault_inputs.sourceJobs | default([]) | selectattr('passwordRef', 'defined') | list }}"
          changed_when: false
          no_log: true
