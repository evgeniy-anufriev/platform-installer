---
- import_playbook: ../images/execution.yml
  when: platform_application_image_intents is defined
- import_playbook: credential-root.yml
- name: Определение и проверка полного состава автономной операции приложения
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Проверка актуальности расчёта приложений, полученного при подготовке образов
      platform.core.project_resolution:
        operation: reuse_application_rows
      register: _application_resolution_reuse
      no_log: true
    - name: Использование рассчитанных приложений в том же контексте проекта и runtime
      ansible.builtin.set_fact:
        platform_application_rows: "{{ _application_resolution_reuse.application_rows }}"
        platform_application_findings: "{{ _application_resolution_reuse.application_findings }}"
      when: _application_resolution_reuse.hit
      no_log: true
    - name: Определение настроек и размещений приложений по умолчанию
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
      when: not _application_resolution_reuse.hit
    - name: Формирование снимка текущего проекта без внесения изменений
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root if platform_project_root is defined else (inventory_dir | dirname) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_snapshot
      no_log: true
    - name: Проверка корректности снимка перед подготовкой обработчиков выполнения
      ansible.builtin.assert:
        that: application_snapshot.snapshot.validation.status == 'PASS'
        fail_msg: "{{ application_snapshot.snapshot.findings | map(attribute='code') | unique | list }}"
    # Controller actions read the registered snapshot directly to avoid re-templating it as a task argument.
    - name: Привязка выбора вызова без удаления определений провайдера
      platform.core.prepare_application_selection: {}
      register: application_selection
      no_log: true
    - name: Проверка выбранного состава операции до подготовки провайдера
      ansible.builtin.assert:
        that: application_selection.status == 'PASS'
        fail_msg: "{{ application_selection.code | default('APPLICATION_LIBRARY_SELECTION_INVALID') }}"
    - name: Использование выбранного снимка для всех проекций исполнения
      ansible.builtin.set_fact:
        application_snapshot: "{{ application_selection.prepared }}"
      no_log: true
    - name: "Подготовка обработчиков Vault по общему снимку проекта"
      platform.core.prepare_application_vault: {}
      register: application_vault_inputs
      no_log: true
    - name: Определение общих источников конечных точек перед изменением целевых узлов
      platform.core.prepare_application_endpoints:
        snapshot: "{{ application_snapshot.snapshot }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_endpoint_inputs
    - name: Сохранение проверенных источников конечных точек для общего обработчика
      ansible.builtin.set_fact:
        platform_endpoint_sources: "{{ application_endpoint_inputs.sources }}"
      failed_when: application_endpoint_inputs.status != 'PASS'
    - name: Проверка параметров Vault до обращения к целевым узлам
      ansible.builtin.assert:
        that: application_vault_inputs.status == 'PASS'
        fail_msg: "{{ application_vault_inputs.code | default('APPLICATION_VAULT_INPUT_INVALID') }}"
    - name: Подготовка обработчиков инфраструктурных учётных записей и ресурсов по общему снимку
      platform.core.prepare_application_providers:
        service_catalog_path: "{{ platform_service_catalog_path }}"
        project_root: "{{ platform_project_root if platform_project_root is defined else (inventory_dir | dirname) }}"
      register: application_provider_inputs
      when: not platform_application_post_install_only | default(false)
      no_log: true
    - name: "Подготовка параметров выполнения приложений без планировщика развёртывания"
      platform.core.prepare_application_runtime:
        project_root: "{{ platform_project_root if platform_project_root is defined else (inventory_dir | dirname) }}"
        contracts_root: "{{ platform_contracts_root | default(playbook_dir ~ '/../../../../contracts') }}"
        scripts_only: "{{ platform_application_post_install_only | default(false) }}"
      register: application_runtime_inputs
      no_log: true
    - name: "Проверка успешности подготовки параметров приложений и провайдеров"
      ansible.builtin.assert:
        that:
          - application_runtime_inputs.status == 'PASS'
          - platform_application_post_install_only | default(false) or application_provider_inputs.status == 'PASS'
        fail_msg: "{{ application_runtime_inputs.code | default('APPLICATION_RUNTIME_INPUT_INVALID') }}"
