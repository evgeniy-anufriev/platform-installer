---
- name: "Выполнить обработчики провайдеров библиотеки, затем экземпляров приложений"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Выполнение этапов провайдера с ограниченным хранением производных учетных данных
      block:
        - name: Инициализировать только результаты завершения провайдера в области вызова
          ansible.builtin.set_fact:
            platform_application_completed_batches: []
            platform_application_delivered_instances: []
          no_log: true
        - name: Требовать защищенный корень среды выполнения перед доставкой сгенерированных учетных данных
          ansible.builtin.assert:
            that: "{} | platform.core.application_protected_secret_files([], platform_application_secret_root)"
            fail_msg: APPLICATION_PROVIDER_SECRET_FILE_INVALID
          when: platform_application_generated_values | default({}) | length > 0
          no_log: true
        - name: Доставка сгенерированных паролей приложений через существующие файлы среды выполнения
          ansible.builtin.copy:
            content: "{{ item.value }}"
            dest: "{{ platform_application_secret_root }}/{{ item.key }}"
            mode: '0600'
            follow: false
          loop: "{{ platform_application_generated_values | default({}) | dict2items }}"
          changed_when: false
          no_log: true
        - name: "Передать файлы сгенерированных учётных данных обработчикам провайдера"
          ansible.builtin.set_fact:
            platform_application_credential_files: "{{ platform_application_credential_files | default({}) | combine({item.key: platform_application_secret_root ~ '/' ~ item.key}) }}"
          loop: "{{ platform_application_generated_values | default({}) | dict2items }}"
          no_log: true
        - name: Чтение существующих источников учетных данных в рамках ограниченного хранения во время выполнения
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: sources
          loop: "{{ application_vault_inputs.sourceJobs | default([]) }}"
          loop_control:
            loop_var: application_vault_source
          when: application_vault_source.passwordRef | default('') not in (platform_application_credential_files | default({}))
        - name: "Проверить соответствие ранее подготовленному набору ресурсов PostgreSQL"
          ansible.builtin.assert:
            that: application_provider_inputs.status == 'PASS'
            fail_msg: APPLICATION_PROVIDER_INPUT_INVALID
        - name: Инициализировать обнаружение провайдера библиотеки приложений
          ansible.builtin.set_fact:
            platform_application_provider_runtime: {}
        - name: Один раз обнаружить каждое развертывание PostgreSQL
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: discover
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: "Проверить все выбранные ресурсы PostgreSQL до внесения изменений"
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: preflight
          loop: "{{ (application_provider_inputs.libraryJobs + application_provider_inputs.instanceJobs) | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Предварительная проверка областей экземпляров Redis и Sentinel перед любыми мутациями провайдера
          ansible.builtin.include_role:
            name: platform.redis.application_provider
            tasks_from: preflight
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
          loop_control:
            loop_var: platform_redis_application_job
        - name: Предварительная проверка библиотеки ClickHouse и областей экземпляра перед мутациями
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: preflight
          loop: "{{ (application_provider_inputs.libraryJobs + application_provider_inputs.instanceJobs) | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: "Создать топики библиотеки Kafka перед настройкой экземпляров приложения"
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_topics
          vars:
            platform_kafka_application_phase: apply
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'kafka') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Создать все ресурсы библиотеки перед экземплярами
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: resources
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: "Создать базы данных и таблицы библиотеки ClickHouse перед учётными записями"
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: resources
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Опубликовать общие секреты каждой библиотеки один раз
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: library
          loop: "{{ application_vault_inputs.libraryJobs | platform.core.application_ready_shared_jobs(application_runtime_inputs.integrations, []) }}"
          loop_control:
            loop_var: platform_vault_application_job
        - name: Проверка и аутентификация каждого экземпляра учетной записи PostgreSQL
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Проверка и аутентификация каждого логического экземпляра Redis и Sentinel
          ansible.builtin.include_role:
            name: platform.redis.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
          loop_control:
            loop_var: platform_redis_application_job
        - name: "Настроить пользователя и права доступа каждого экземпляра ClickHouse"
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Проверка учетных записей развертывания Kafka перед публикацией Vault
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_accounts
          vars:
            platform_kafka_application_phase: apply
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'kafka') | selectattr('accounts') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Опубликовать учетные данные каждого экземпляра и AppRole один раз
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: instance
          loop: "{{ application_vault_inputs.instanceJobs | platform.core.application_ready_vault_jobs(application_runtime_inputs.integrations, [], []) }}"
          loop_control:
            loop_var: platform_vault_application_job
        - name: "Сохранить результаты доставки учётных данных экземпляров для координатора выполнения"
          ansible.builtin.set_fact:
            platform_application_delivered_instances: >-
              {{ (application_vault_inputs.instanceJobs | platform.core.application_ready_vault_jobs(
                  application_runtime_inputs.integrations, [], [])) |
                 map(attribute='libraryId') | zip((application_vault_inputs.instanceJobs |
                   platform.core.application_ready_vault_jobs(application_runtime_inputs.integrations, [], [])) |
                   map(attribute='instanceId')) | map('join', '/') | list }}
          no_log: true
        - name: Передача производных учетных данных в среду выполнения
          ansible.builtin.set_fact:
            platform_application_runtime_credential_custody: true
          no_log: true
      always:
        - name: "Сбросить временные значения сгенерированных паролей после передачи провайдеру"
          ansible.builtin.set_fact:
            platform_application_generated_values: {}
          no_log: true
        - name: Удалить только файлы учетных данных Vault, полученные из вызова
          ansible.builtin.file:
            path: "{{ platform_application_secret_root }}/{{ item.passwordRef }}"
            state: absent
          loop: "{{ application_vault_inputs.sourceJobs | default([]) | selectattr('passwordRef', 'defined') | list }}"
          changed_when: false
          no_log: true
          when: not (platform_application_runtime_credential_custody | default(false)) or application_runtime_inputs.integrations.batches | length == 0
