---
- name: Расчёт и предварительная проверка провайдеров Vault без внесения изменений
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Подготовка параметров Vault по снимку провайдера без обращения к целевым узлам"
      platform.core.prepare_application_vault:
        snapshot_result: "{{ application_provider_snapshot }}"
      register: application_vault_inputs
      no_log: true
    - name: Проверка поддерживаемого набора ресурсов Vault до записи
      ansible.builtin.assert:
        that: application_vault_inputs.status == 'PASS'
        fail_msg: "{{ application_vault_inputs.code | default('APPLICATION_VAULT_INPUT_INVALID') }}"
    - name: Инициализация защищённых служебных данных провайдера
      ansible.builtin.set_fact:
        platform_application_vault_runtime: {}
        platform_application_vault_identities: {}
        platform_application_vault_values: {}
        platform_application_vault_documents: {}
        platform_application_credential_files: {}
        platform_application_generated_values: {}
      no_log: true
    - name: Однократное обнаружение каждого развёртывания Vault
      ansible.builtin.include_role:
        name: platform.vault.application_provider
        tasks_from: discover
      vars:
        platform_vault_application_single_provider: "{{ application_vault_inputs.providers | length == 1 }}"
      loop: "{{ application_vault_inputs.providers }}"
      loop_control:
        loop_var: platform_vault_application_provider
    - name: "Проверка секретов библиотеки и экземпляров приложения до внесения изменений"
      ansible.builtin.include_role:
        name: platform.vault.application_provider
        tasks_from: preflight
      loop: "{{ application_vault_inputs.libraryJobs + application_vault_inputs.instanceJobs }}"
      loop_control:
        loop_var: platform_vault_application_job
