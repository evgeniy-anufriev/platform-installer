---
- import_playbook: credential-root.yml
- name: Обработка входных данных автономного провайдера приложений без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Вычисление настроек и размещений приложений с учётом значений по умолчанию
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
    - name: "Формирование снимка текущего проекта без внесения изменений"
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_provider_snapshot
      no_log: true
    - name: Подготовка уникальных заданий провайдера PostgreSQL
      platform.core.prepare_application_providers:
        snapshot_result: "{{ application_provider_snapshot }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_provider_inputs
      no_log: true
    - name: Проверка выбранного набора ресурсов провайдера до обращения к узлам
      ansible.builtin.assert:
        that: application_provider_inputs.status == 'PASS'
        fail_msg: APPLICATION_PROVIDER_INPUT_INVALID
