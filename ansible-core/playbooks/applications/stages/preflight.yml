---
- import_playbook: resolve-runtime.yml

- name: Проверка явного порядка библиотеки и области действия провайдера перед любым целевым контактом
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Использование заданного порядка установки, не расширяя список библиотек"
      ansible.builtin.set_fact:
        application_preflight_library_ids: "{{ application_snapshot.snapshot.applicationLibraries.libraries | list | sort }}"
        application_preflight_library_order: >-
          {{ application_selection.scope.libraryOrder }}
    - name: Проверка явно заданного порядка выбранных библиотек
      ansible.builtin.assert:
        that:
          - platform_application_expected_library_ids is defined or platform_application_library_order is defined or application_preflight_library_ids | length <= 1
          - application_preflight_library_order | unique | length == application_preflight_library_order | length
          - application_preflight_library_order | sort == application_preflight_library_ids
        fail_msg: APPLICATION_LIBRARY_ORDER_INVALID
    - name: "Проверка того, что необходимые провайдеры стоят раньше потребителей в порядке установки"
      ansible.builtin.assert:
        that: application_provider_order_findings | length == 0
        fail_msg: "APPLICATION_PROVIDED_CONNECTION_ORDER_REQUIRED {{ application_provider_order_findings }}"
      vars:
        application_provider_order_findings: >-
          {{ application_snapshot.snapshot.applicationLibraries.libraries | dict2items |
             selectattr('key', 'in', application_selection.scope.installLibraries) | items2dict |
             platform.core.application_connection_order_findings(application_preflight_library_order) }}

- name: Предварительная проверка каждой выбранной цели только для чтения перед мутациями приложения
  hosts: platform_targets
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Инициализация защищённых записей предварительной проверки приложений
      ansible.builtin.set_fact:
        platform_application_preflight_jobs: []
        application_runtime_discoveries: {}
      no_log: true
    - name: Проверка и формирование проекции каждого выбранного размещения в памяти
      ansible.builtin.include_role:
        name: platform.core.application_runtime
        tasks_from: preflight
      vars:
        application_runtime_defer_archive_verification: true
      loop: "{{ hostvars['localhost'].application_runtime_inputs.jobs | selectattr('hostId', 'equalto', inventory_hostname) | list }}"
      loop_control:
        loop_var: application_runtime_job

- name: Проверка выбранных автономных архивов один раз перед изменением провайдера
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.import_tasks: ../tasks/offline-archives.yml
