---
- name: "Выполнение общих обработчиков конечных точек в исходном контексте Ansible"
  hosts: platform_targets
  strategy: linear
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Публикация выбранных готовых логических источников с существующими задачами провайдера
      ansible.builtin.include_tasks: ../../../../services/integrations/tasks/apply-source.yml
      vars:
        platform_endpoint_source_ids: >-
          {{ (hostvars['localhost'].application_runtime_inputs.jobs | map(attribute='instanceId') | unique |
              intersect(hostvars['localhost'].platform_endpoint_sources | default({}) | list) | sort)
             if hostvars['localhost'].application_runtime_inputs is defined else
             (hostvars['localhost'].platform_endpoint_sources | default({}) | sort) }}
      when: platform_endpoint_source_ids | length > 0
