---
- name: Привязка выбранных образов к целевым узлам без изменения inventory оператора
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Добавление только вычисленной группы подготовки
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: platform_image_targets
        platform_application_image_inputs: "{{ hostvars['localhost'].platform_application_image_inputs }}"
        platform_application_image_bundle: "{{ hostvars['localhost'].platform_application_image_bundle }}"
      loop: "{{ platform_application_image_inputs.targetConnections | list }}"

- name: Определение платформ целевых узлов
  hosts: platform_image_targets
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Обнаружение целевой ОС и архитектуры без Docker
      ansible.builtin.setup:
        gather_subset: ['!all', 'min']
        filter: ['ansible_system', 'ansible_architecture']

- name: Подготовка уникальных метаданных через утверждённые целевые узлы
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: "Инициализация результатов и закрытого кэша текущей подготовки"
      ansible.builtin.set_fact:
        platform_application_image_preparations: {}
        _image_registry_cache: {}
        _image_node_credentials_cache: {}
    - name: Подготовка каждого выбранного образа штатными задачами Ansible
      ansible.builtin.include_tasks: placement.yml
      vars:
        application_image_platform:
          os: "{{ hostvars[application_image_input.hostId].ansible_facts.system | lower }}"
          architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(hostvars[application_image_input.hostId].ansible_facts.architecture, hostvars[application_image_input.hostId].ansible_facts.architecture) }}"
        application_image_registries: "{{ hostvars[application_image_input.hostId].platform_application_approved_registries | default([]) }}"
      loop: "{{ platform_application_image_inputs.placements }}"
      loop_control:
        loop_var: application_image_input

- name: Фиксация метаданных выбранного образа на узле выполнения
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Сохранение сводных результатов подготовки образов без секретов"
      ansible.builtin.set_fact:
        platform_prepared_application_images: >-
          {{ {'apiVersion': 'platform.installer/container-images/v1alpha2',
              'placements': platform_application_image_inputs.ready |
                combine(({'resolved': {'platform_application_image_preparations': platform_application_image_preparations}} | platform.core.application_prepared_image_lock).placements)} }}
    - name: Сохранение полного результата подготовки образов в формате машинного протокола
      ansible.builtin.copy:
        content: "{{ platform_prepared_application_images | to_json }}"
        dest: "{{ platform_application_image_result_path }}"
        mode: '0600'
      when: platform_application_image_result_path is defined
