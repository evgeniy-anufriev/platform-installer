---
- import_playbook: application-libraries-preflight.yml
- import_playbook: application-libraries-vault-preflight.yml
- import_playbook: application-libraries-provider-stage.yml

- name: Apply each preflighted library and verify it before the next starts
  hosts: platform_targets
  strategy: linear
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Bind the ordered library ids from the immutable plan or manual input
      ansible.builtin.set_fact:
        application_library_order: >-
          {{ platform_application_expected_library_ids | default(platform_application_library_order |
             default(hostvars['localhost'].application_runtime_inputs.jobs | map(attribute='libraryId') | unique | sort | list)) }}
      no_log: true
    - name: Require an explicit order for multiple libraries outside a planned execution
      ansible.builtin.assert:
        that:
          - platform_application_expected_library_ids is defined or platform_application_library_order is defined or
            (hostvars['localhost'].application_runtime_inputs.jobs | map(attribute='libraryId') | unique | list | length) <= 1
        fail_msg: APPLICATION_LIBRARY_ORDER_REQUIRED
    - name: Require the exact selected library set and no duplicate order entries
      ansible.builtin.assert:
        that:
          - application_library_order | length == (application_library_order | unique | length)
          - application_library_order | sort == (hostvars['localhost'].application_runtime_inputs.jobs | map(attribute='libraryId') | unique | sort | list)
        fail_msg: APPLICATION_LIBRARY_ORDER_INVALID
    - name: Complete one library before moving to the next
      ansible.builtin.include_tasks: application-libraries-ordered-library.yml
      loop: "{{ application_library_order }}"
      loop_control:
        loop_var: application_library_id
