---
- import_playbook: application-libraries-preflight.yml
- import_playbook: application-libraries-vault-preflight.yml
- import_playbook: application-libraries-provider-stage.yml

- name: Apply preflighted application libraries on selected Docker hosts
  hosts: platform_targets
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Materialize and validate all selected libraries before any image or container mutation
      ansible.builtin.include_role:
        name: platform.core.application_runtime
        tasks_from: apply_library
      loop: "{{ platform_application_preflight_jobs | default([]) | map(attribute='libraryId') | unique | list }}"
      loop_control:
        loop_var: application_library_id
    - name: Activate only after all selected placements passed Compose validation
      ansible.builtin.include_role:
        name: platform.core.application_runtime
        tasks_from: activate_instance
      loop: "{{ platform_application_preflight_jobs | default([]) }}"
      loop_control:
        loop_var: application_runtime_job

- import_playbook: application-libraries-endpoint-stage.yml
