---
- import_playbook: application-libraries-preflight.yml
- import_playbook: application-libraries-vault-preflight.yml
- import_playbook: application-libraries-provider-stage.yml

- name: Применить каждую предварительно проверенную библиотеку и проверить ее перед следующим запуском
  hosts: platform_targets
  strategy: linear
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Применение упорядоченных библиотек с ограниченным хранением частных источников
      block:
        - name: Привязать упорядоченные идентификаторы библиотек из неизменяемого плана или ввода вручную
          ansible.builtin.set_fact:
            application_library_order: >-
              {{ hostvars['localhost'].application_selection.scope.libraryOrder }}
          no_log: true
        - name: Требовать явного порядка для нескольких библиотек вне запланированного выполнения
          ansible.builtin.assert:
            that:
              - platform_application_expected_library_ids is defined or platform_application_library_order is defined or
                (hostvars['localhost'].application_runtime_inputs.jobs | map(attribute='libraryId') | unique | list | length) <= 1
            fail_msg: APPLICATION_LIBRARY_ORDER_REQUIRED
        - name: Требовать точно выбранный набор библиотек и отсутствие повторяющихся записей заказа
          ansible.builtin.assert:
            that:
              - application_library_order | length == (application_library_order | unique | length)
              - application_library_order | sort == (hostvars['localhost'].application_snapshot.snapshot.applicationLibraries.libraries | list | sort)
            fail_msg: APPLICATION_LIBRARY_ORDER_INVALID
        - name: Завершить одну библиотеку, прежде чем переходить к следующей
          ansible.builtin.include_tasks: application-libraries-ordered-library.yml
          loop: "{{ application_library_order }}"
          loop_control:
            loop_var: application_library_id
      always:
        - name: Удаление только исходных файлов учетной записи, полученной из вызова, после координации во время выполнения
          ansible.builtin.file:
            path: "{{ hostvars['localhost'].platform_application_secret_root }}/{{ item.passwordRef }}"
            state: absent
          loop: "{{ hostvars['localhost'].application_vault_inputs.sourceJobs | default([]) | selectattr('passwordRef', 'defined') | list }}"
          delegate_to: localhost
          become: false
          run_once: true
          changed_when: false
          no_log: true
