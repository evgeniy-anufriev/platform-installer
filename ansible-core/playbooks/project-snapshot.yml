---
- name: Query Platform project snapshot
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Build deterministic read-only snapshot on the controller
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root | default(omit) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
        installer_owned_paths: "{{ platform_installer_owned_paths | default([]) }}"
      register: platform_project_snapshot
      run_once: true
      become: false
      check_mode: false

    - name: Show safe snapshot identity
      ansible.builtin.debug:
        msg:
          status: "{{ platform_project_snapshot.snapshot.status }}"
          projectRevision: "{{ platform_project_snapshot.snapshot.projectRevision }}"
          snapshotFingerprint: "{{ platform_project_snapshot.snapshot.snapshotFingerprint }}"
          serializedBytes: "{{ platform_project_snapshot.snapshot | to_json | length }}"
      run_once: true
