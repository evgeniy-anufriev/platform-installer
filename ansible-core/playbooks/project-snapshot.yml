---
- name: "Получение снимка проекта платформы"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешение сохранённого проекта без повторного вычисления библиотек
      ansible.builtin.include_role:
        name: platform.core.project_resolution

    - name: Сохранение публичного результата снимка
      platform.core.project_snapshot:
        resolved_result_variable: platform_project_resolution
        summary_only: true
      register: platform_project_snapshot
      no_log: true

    - name: "Вывод идентификатора снимка без секретных данных"
      ansible.builtin.debug:
        msg: "{{ platform_project_snapshot.summary }}"
      run_once: true
