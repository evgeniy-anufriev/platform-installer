---
- name: "Получение снимка проекта платформы"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Разрешение сохранённого проекта без повторного вычисления библиотек
      ansible.builtin.include_role:
        name: platform.core.project_resolution

    - name: Сохранение публичного результата снимка
      ansible.builtin.set_fact:
        platform_project_snapshot: "{{ platform_project_resolution }}"
      no_log: true

    - name: "Вывод идентификатора снимка без секретных данных"
      ansible.builtin.debug:
        msg:
          status: "{{ platform_project_snapshot.snapshot.status }}"
          projectRevision: "{{ platform_project_snapshot.snapshot.projectRevision }}"
          snapshotFingerprint: "{{ platform_project_snapshot.snapshot.snapshotFingerprint }}"
          serializedBytes: "{{ platform_project_snapshot.snapshot | to_json | length }}"
      run_once: true
