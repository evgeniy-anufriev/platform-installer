---
- name: Проверка контракта проекта платформы
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Подготовка обычных входов проверки проекта
      ansible.builtin.import_tasks: tasks/prepare-validation.yml

  tasks:
    - name: Вычисление параметров дополнительных библиотек приложений средствами Ansible
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
      when: platform_desired_state.applicationLibraryDeployments is defined

    - name: Проверка проекции приложения через общий путь к снимку
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root if platform_project_root is defined else (inventory_dir | dirname) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: platform_application_validation
      when: platform_desired_state.applicationLibraryDeployments is defined
      become: false
      no_log: true

    - name: Проверка полного проекта существующим валидатором
      ansible.builtin.include_tasks: tasks/validate-project.yml
      vars:
        platform_validation_application_findings: "{{ (platform_application_validation.snapshot.findings | default([])) if platform_desired_state.applicationLibraryDeployments is defined else [] }}"
        platform_validation_default_artifact: "{{ playbook_dir }}/../.runtime/validation-result.json"
