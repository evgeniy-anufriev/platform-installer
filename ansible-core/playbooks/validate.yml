---
- name: Validate Platform project contract
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Inspect optional legacy portable project manifest
      ansible.builtin.stat:
        path: >-
          {{ platform_project_manifest_path |
             default((inventory_dir | default('/project/inventory', true)) ~ '/../project.yml', true) }}
      register: platform_project_manifest_stat
      run_once: true

    - name: Initialize absent project manifest
      ansible.builtin.set_fact:
        platform_project_manifest_document: {}
      run_once: true

    - name: Load optional legacy portable project manifest
      ansible.builtin.include_vars:
        file: >-
          {{ platform_project_manifest_path |
             default((inventory_dir | default('/project/inventory', true)) ~ '/../project.yml', true) }}
        name: platform_project_manifest_document
      when: platform_project_manifest_stat.stat.exists
      run_once: true

    - name: Require a published service catalog artifact
      ansible.builtin.assert:
        that:
          - platform_service_catalog_path is defined
          - platform_service_catalog_path | length > 0
        fail_msg: >-
          platform_service_catalog_path must reference a published service catalog YAML artifact
      run_once: true

    - name: Load the published service catalog artifact
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: platform_catalog_artifact
      run_once: true

    - name: Initialize safe desired host projection
      ansible.builtin.set_fact:
        platform_desired_hosts: {}
      run_once: true

    - name: Collect only platform_host desired variables
      ansible.builtin.set_fact:
        platform_desired_hosts: >-
          {{ platform_desired_hosts |
             combine({item: (hostvars[item].platform_host | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      run_once: true

    - name: Collect canonical inventory-owned service members
      ansible.builtin.set_fact:
        platform_inventory_deployments: >-
          {{ platform_inventory_deployments | default({}) |
             combine({item: (hostvars[item].platform_deployments | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      run_once: true

    - name: Collect safe canonical inventory host addresses
      ansible.builtin.set_fact:
        platform_inventory_host_addresses: >-
          {{ platform_inventory_host_addresses | default({}) |
             combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      run_once: true

  tasks:
    - name: Resolve optional application libraries with ordinary Ansible
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
      when: platform_desired_state.applicationLibraryDeployments is defined

    - name: Validate application projection through the shared snapshot path
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: platform_application_validation
      when: platform_desired_state.applicationLibraryDeployments is defined
      become: false
      no_log: true

    - name: Validate desired project on the Ansible controller
      platform.core.validate_project:
        manifest: "{{ platform_project_manifest_document }}"
        topology: "{{ platform_project | default({}) }}"
        ansible_desired_state: "{{ platform_desired_state | default({}) | dict2items | rejectattr('key', 'equalto', 'applicationLibraryDeployments') | items2dict }}"
        application_findings: "{{ platform_application_validation.snapshot.findings | default([]) }}"
        generated_state: "{{ platform_generated_state | default({}) }}"
        project_id: >-
          {{ platform_project_id |
             default(platform_project_manifest_document.metadata.id |
                     default((inventory_dir | default('/project/inventory', true) | dirname | basename), true), true) }}
        inventory_deployments_by_host: "{{ platform_inventory_deployments | default({}) }}"
        inventory_host_addresses: "{{ platform_inventory_host_addresses | default({}) }}"
        desired_hosts: "{{ platform_desired_hosts }}"
        service_catalog: >-
          {{ platform_catalog_artifact.platform_service_catalog |
             default(platform_catalog_artifact, true) }}
        inventory_hosts: "{{ groups['platform_targets'] | default([]) }}"
        artifact_path: >-
          {{ platform_validation_artifact |
             default(playbook_dir ~ '/../.runtime/validation-result.json', true) }}
        contracts_root: >-
          {{ platform_contracts_root |
             default(playbook_dir ~ '/../../contracts', true) }}
      run_once: true
      become: false
      check_mode: false
      register: platform_validation

    - name: Show validation summary
      ansible.builtin.debug:
        msg:
          status: "{{ platform_validation.validation.status }}"
          artifact: "{{ platform_validation.artifact_path }}"
          findings: "{{ platform_validation.validation.summary }}"
      run_once: true
