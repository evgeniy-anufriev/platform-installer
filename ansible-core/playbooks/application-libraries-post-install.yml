---
- import_playbook: application-libraries-resolve-runtime.yml
  vars:
    platform_application_post_install_only: true

- name: Выполнение сценариев терминала после префикса успешной установки
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Привязать разрешенную очередь терминалов и ее точные ссылки на учетные данные
      ansible.builtin.set_fact:
        application_post_install_scripts: "{{ application_runtime_inputs.postInstallScripts }}"
        application_post_install_references: "{{ application_runtime_inputs.postInstallScripts | map(attribute='secretInputs') | map('dict2items') | flatten | map(attribute='value') | unique | list }}"
        platform_application_vault_runtime: {}
        platform_application_credential_files: {}
      no_log: true
    - name: Привязать только существующие опубликованные поля, используемые скриптами терминала
      ansible.builtin.set_fact:
        application_post_install_sources: "{{ application_vault_inputs.sourceJobs | selectattr('passwordRef', 'in', application_post_install_references) | list }}"
      no_log: true
    - name: Запуск сценариев терминала с хранением учетных данных, ограниченным вызовом
      block:
        - name: Обнаружить только провайдеров Vault, необходимых для входных данных терминала
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: discover
          vars:
            platform_vault_application_single_provider: "{{ application_vault_inputs.providers | length == 1 }}"
          loop: "{{ application_vault_inputs.providers | selectattr('providerId', 'in', application_post_install_sources | map(attribute='providerId') | list) | list }}"
          loop_control:
            loop_var: platform_vault_application_provider
        - name: Чтение опубликованных полей без создания или обновления учетных данных
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: sources
          loop: "{{ application_post_install_sources }}"
          loop_control:
            loop_var: application_vault_source
        - name: Последовательное выполнение детерминированной очереди терминала
          ansible.builtin.include_tasks: tasks/application-post-install-script.yml
          loop: "{{ application_post_install_scripts }}"
          loop_control:
            loop_var: application_post_install_script
            label: "{{ application_post_install_script.libraryId }}/{{ application_post_install_script.id }}"
      always:
        - name: Удалить временные исходные файлы завершающего этапа установки приложений
          ansible.builtin.file:
            path: "{{ platform_application_secret_root }}/{{ item.passwordRef }}"
            state: absent
          loop: "{{ application_post_install_sources }}"
          changed_when: false
          no_log: true
