---
- name: Explicitly reissue selected managed PKI requests on the Execution Node
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Require an explicit non-empty PKI reissue request selection
      ansible.builtin.assert:
        that:
          - platform_pki_reissue_request_ids is defined
          - platform_pki_reissue_request_ids is sequence
          - platform_pki_reissue_request_ids is not string
          - platform_pki_reissue_request_ids | length > 0
        fail_msg: PKI_REISSUE_REQUEST_SELECTION_REQUIRED
  roles:
    - role: platform.core.pki_materialize

- name: Deploy explicitly reissued PKI material to selected targets
  hosts: platform_targets
  become: true
  gather_facts: false
  roles:
    - role: platform.core.pki_deploy
