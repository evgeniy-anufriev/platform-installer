---
- name: Явный повторный выпуск выбранных управляемых запросов PKI на узле выполнения
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Требовать явный непустой выбор запроса на повторный выпуск PKI
      ansible.builtin.assert:
        that:
          - platform_pki_reissue_request_ids is defined
          - platform_pki_reissue_request_ids is sequence
          - platform_pki_reissue_request_ids is not string
          - platform_pki_reissue_request_ids | length > 0
        fail_msg: PKI_REISSUE_REQUEST_SELECTION_REQUIRED
  roles:
    - role: platform.core.pki_materialize

- name: Развернуть явно перевыпущенный материал PKI на выбранных целевых объектах
  hosts: platform_targets
  become: true
  gather_facts: false
  roles:
    - role: platform.core.pki_deploy
