---
- import_playbook: application-libraries-resolve-runtime.yml

- name: Read-only preflight every selected target before application mutations
  hosts: platform_targets
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Initialize this operation's private preflight rows
      ansible.builtin.set_fact:
        platform_application_preflight_jobs: []
        application_runtime_discoveries: {}
      no_log: true
    - name: Validate and render each selected placement in memory
      ansible.builtin.include_role:
        name: platform.core.application_runtime
        tasks_from: preflight
      loop: "{{ hostvars['localhost'].application_runtime_inputs.jobs | selectattr('hostId', 'equalto', inventory_hostname) | list }}"
      loop_control:
        loop_var: application_runtime_job
