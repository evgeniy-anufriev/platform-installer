---
- import_playbook: application-libraries-providers-preflight.yml
- name: Verify application provider state without mutation
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify each library resource identity
      ansible.builtin.include_role:
        name: platform.postgresql.application_provider
        tasks_from: verify
      loop: "{{ application_provider_inputs.libraryJobs }}"
      loop_control:
        loop_var: platform_postgresql_application_job
    - name: Verify each application instance grants separately
      ansible.builtin.include_role:
        name: platform.postgresql.application_provider
        tasks_from: verify
      loop: "{{ application_provider_inputs.instanceJobs }}"
      loop_control:
        loop_var: platform_postgresql_application_job
