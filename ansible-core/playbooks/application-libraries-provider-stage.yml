---
- name: Run preflighted library then instance provider hooks
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Execute provider stages with bounded derived credential custody
      block:
        - name: Initialize only invocation-scoped provider completion results
          ansible.builtin.set_fact:
            platform_application_completed_batches: []
            platform_application_delivered_instances: []
          no_log: true
        - name: Read existing credential sources within bounded runtime custody
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: sources
          loop: "{{ application_vault_inputs.sourceJobs | default([]) }}"
          loop_control:
            loop_var: application_vault_source
        - name: Require the same prepared PostgreSQL scope
          ansible.builtin.assert:
            that: application_provider_inputs.status == 'PASS'
            fail_msg: APPLICATION_PROVIDER_INPUT_INVALID
        - name: Initialize provider discovery for this invocation
          ansible.builtin.set_fact:
            platform_application_provider_runtime: {}
        - name: Discover each PostgreSQL deployment once
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: discover
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Preflight all PostgreSQL scopes before mutations
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: preflight
          loop: "{{ (application_provider_inputs.libraryJobs + application_provider_inputs.instanceJobs) | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Preflight Redis and Sentinel instance scopes before any provider mutations
          ansible.builtin.include_role:
            name: platform.redis.application_provider
            tasks_from: preflight
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
          loop_control:
            loop_var: platform_redis_application_job
        - name: Preflight ClickHouse library and instance scopes before mutations
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: preflight
          loop: "{{ (application_provider_inputs.libraryJobs + application_provider_inputs.instanceJobs) | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Create Kafka library topics before application instances
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_topics
          vars:
            platform_kafka_application_phase: apply
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'kafka') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Create all library resources before instances
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: resources
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Create each ClickHouse library database batch before accounts
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: resources
          loop: "{{ application_provider_inputs.libraryJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Publish each library shared secrets once
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: library
          loop: "{{ application_vault_inputs.libraryJobs | platform.core.application_ready_shared_jobs(application_runtime_inputs.integrations, []) }}"
          loop_control:
            loop_var: platform_vault_application_job
        - name: Ensure and authenticate each PostgreSQL account instance
          ansible.builtin.include_role:
            name: platform.postgresql.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'postgresql') | list }}"
          loop_control:
            loop_var: platform_postgresql_application_job
        - name: Ensure and authenticate each Redis and Sentinel logical instance
          ansible.builtin.include_role:
            name: platform.redis.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'redis') | list }}"
          loop_control:
            loop_var: platform_redis_application_job
        - name: Ensure each ClickHouse instance with one user and grant batch
          ansible.builtin.include_role:
            name: platform.clickhouse.application_provider
            tasks_from: accounts
          loop: "{{ application_provider_inputs.instanceJobs | selectattr('serviceType', 'equalto', 'clickhouse') | list }}"
          loop_control:
            loop_var: platform_clickhouse_application_job
        - name: Ensure Kafka deployment accounts before Vault publication
          ansible.builtin.include_role:
            name: platform.kafka.kafka_kraft
            tasks_from: application_accounts
          vars:
            platform_kafka_application_phase: apply
          loop: "{{ application_provider_inputs.jobs | selectattr('serviceType', 'equalto', 'kafka') | selectattr('accounts') | list }}"
          loop_control:
            loop_var: platform_kafka_application_job
        - name: Publish each instance credentials and AppRole once
          ansible.builtin.include_role:
            name: platform.vault.application_provider
            tasks_from: instance
          loop: "{{ application_vault_inputs.instanceJobs | platform.core.application_ready_vault_jobs(application_runtime_inputs.integrations, [], []) }}"
          loop_control:
            loop_var: platform_vault_application_job
        - name: Retain completed ordinary instance deliveries for the runtime coordinator
          ansible.builtin.set_fact:
            platform_application_delivered_instances: >-
              {{ (application_vault_inputs.instanceJobs | platform.core.application_ready_vault_jobs(
                  application_runtime_inputs.integrations, [], [])) |
                 map(attribute='libraryId') | zip((application_vault_inputs.instanceJobs |
                   platform.core.application_ready_vault_jobs(application_runtime_inputs.integrations, [], [])) |
                   map(attribute='instanceId')) | map('join', '/') | list }}
          no_log: true
        - name: Transfer derived credential custody to the runtime play
          ansible.builtin.set_fact:
            platform_application_runtime_credential_custody: true
          no_log: true
      always:
        - name: Remove only invocation-derived Vault account credential files
          ansible.builtin.file:
            path: "{{ platform_application_secret_root }}/{{ item.passwordRef }}"
            state: absent
          loop: "{{ application_vault_inputs.sourceJobs | default([]) | selectattr('passwordRef', 'defined') | list }}"
          changed_when: false
          no_log: true
          when: not (platform_application_runtime_credential_custody | default(false)) or application_runtime_inputs.integrations.batches | length == 0
