---
- name: Проверка централизованного целевого подключения и повышения прав
  hosts: platform_targets
  become: true
  gather_facts: false
  tasks:
    - name: Чтение эффективного пользователя с повышенными правами
      ansible.builtin.command: id -u
      register: platform_effective_uid
      changed_when: false

    - name: Доступно подтверждение выполнения с повышенными правами
      ansible.builtin.assert:
        that:
          - platform_effective_uid.rc == 0
          - platform_effective_uid.stdout | trim == '0'
        fail_msg: Centralized Ansible target execution lacks working elevation
