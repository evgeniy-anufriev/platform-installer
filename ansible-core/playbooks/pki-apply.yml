---
- name: Разрешение управляемых запросов PKI на узле выполнения
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: platform.core.pki_materialize

- name: Развертывание материала PKI в выбранных целевых объектах
  hosts: platform_targets
  become: true
  gather_facts: false
  roles:
    - role: platform.core.pki_deploy
