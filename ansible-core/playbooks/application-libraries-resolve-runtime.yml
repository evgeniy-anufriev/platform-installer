---
- import_playbook: application-libraries-credential-root.yml
- name: Resolve and validate the complete standalone application scope
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Resolve native application defaults and placements
      ansible.builtin.include_role:
        name: platform.core.resolve_application_libraries
    - name: Build existing read-only project snapshot
      platform.core.project_snapshot:
        project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_snapshot
      no_log: true
    - name: Require a valid snapshot before preparing runtime hooks
      ansible.builtin.assert:
        that: application_snapshot.snapshot.validation.status == 'PASS'
        fail_msg: "{{ application_snapshot.snapshot.findings | map(attribute='code') | unique | list }}"
    - name: Bind the invocation selection without removing provider definitions
      platform.core.prepare_application_selection:
        snapshot_result: "{{ application_snapshot }}"
      register: application_selection
      no_log: true
    - name: Require valid invocation scope before any provider preparation
      ansible.builtin.assert:
        that: application_selection.status == 'PASS'
        fail_msg: "{{ application_selection.code | default('APPLICATION_LIBRARY_SELECTION_INVALID') }}"
    - name: Use the selected snapshot for all execution projections
      ansible.builtin.set_fact:
        application_snapshot: "{{ application_selection.prepared }}"
      no_log: true
    - name: Resolve Vault hooks from the same snapshot
      platform.core.prepare_application_vault:
        snapshot_result: "{{ application_snapshot }}"
      register: application_vault_inputs
      no_log: true
    - name: Resolve common endpoint sources before any target mutation
      platform.core.prepare_application_endpoints:
        snapshot: "{{ application_snapshot.snapshot }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
      register: application_endpoint_inputs
    - name: Require valid endpoint sources and publish shared hook input
      ansible.builtin.set_fact:
        platform_endpoint_sources: "{{ application_endpoint_inputs.sources }}"
      failed_when: application_endpoint_inputs.status != 'PASS'
    - name: Require valid Vault projection before target contacts
      ansible.builtin.assert:
        that: application_vault_inputs.status == 'PASS'
        fail_msg: "{{ application_vault_inputs.code | default('APPLICATION_VAULT_INPUT_INVALID') }}"
    - name: Resolve infrastructure account and resource hooks from the same snapshot
      platform.core.prepare_application_providers:
        snapshot_result: "{{ application_snapshot }}"
        service_catalog_path: "{{ platform_service_catalog_path }}"
        project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
      register: application_provider_inputs
      when: not platform_application_post_install_only | default(false)
      no_log: true
    - name: Bind the same snapshot for runtime provider preflight
      ansible.builtin.set_fact:
        application_provider_snapshot: "{{ application_snapshot }}"
      no_log: true
    - name: Assemble standalone image authority without enabling deployment planner
      platform.core.prepare_application_runtime:
        project_root: "{{ platform_project_root | default(inventory_dir | dirname) }}"
        contracts_root: "{{ platform_contracts_root | default(playbook_dir ~ '/../../contracts') }}"
        snapshot: "{{ application_snapshot.snapshot }}"
        scripts_only: "{{ platform_application_post_install_only | default(false) }}"
      register: application_runtime_inputs
      no_log: true
    - name: Require successful standalone authority preparation
      ansible.builtin.assert:
        that:
          - application_runtime_inputs.status == 'PASS'
          - platform_application_post_install_only | default(false) or application_provider_inputs.status == 'PASS'
        fail_msg: "{{ application_runtime_inputs.code | default('APPLICATION_RUNTIME_INPUT_INVALID') }}"
