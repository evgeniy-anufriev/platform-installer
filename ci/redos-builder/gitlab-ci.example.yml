# Requires a Docker executor and a prebuilt image published to your GitLab registry.
# This file is an example; include/copy it into your GitLab pipeline explicitly.
# npm-deps.tar.gz is a project input/artifact, never part of the toolchain image.
stages: [dependencies, build]
variables:
  BUILDER_IMAGE: "$CI_REGISTRY_IMAGE/builder:redos8"
  GOCACHE: "$CI_PROJECT_DIR/.runtime/go-build"
  GOPATH: "$CI_PROJECT_DIR/.runtime/go-path"
  NPM_ARCHIVE: "$CI_PROJECT_DIR/npm-deps.tar.gz"
  RUNTIME_INPUT: "$CI_PROJECT_DIR/.runtime/runtime-input"
  RUNTIME_BUNDLE_VERSION: "ci-$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA"

# Independent of frontend dependencies and application compilation.
# Supply RUNTIME_INPUT from an approved local input/artifact or runner mount.
build-runtime-bundle:
  stage: build
  image: "$BUILDER_IMAGE"
  needs: []
  script:
    - test -d "$RUNTIME_INPUT" || { echo "Missing RUNTIME_INPUT directory; supply prepared runtime files before building." >&2; exit 1; }
    - python3 -c 'import yaml'
    - >-
      python3 ansible-core/tools/build_execution_runtime_bundle.py
      --runtime-input "$RUNTIME_INPUT"
      --output "$CI_PROJECT_DIR/.runtime/ci-output/execution-bundle"
      --bundle-version "$RUNTIME_BUNDLE_VERSION"
    - CGO_ENABLED=0 go build -mod=vendor -trimpath -o .runtime/ci-output/platform-installer ./cmd/platform-installer
    - .runtime/ci-output/platform-installer -command validate-bundle -bundle .runtime/ci-output/execution-bundle > .runtime/ci-output/bundle-validation.json
    - tar -czf .runtime/ci-output/execution-runtime-bundle.tar.gz -C .runtime/ci-output execution-bundle
    - cd .runtime/ci-output && sha256sum execution-runtime-bundle.tar.gz > execution-runtime-bundle.tar.gz.sha256
  artifacts:
    paths:
      - .runtime/ci-output/execution-runtime-bundle.tar.gz
      - .runtime/ci-output/execution-runtime-bundle.tar.gz.sha256

frontend-dependencies:
  stage: dependencies
  image: "$BUILDER_IMAGE"
  script:
    - mkdir -p .runtime/npm-archives
    - tar -xzf "$NPM_ARCHIVE" -C .runtime/npm-archives
    - NPM_CACHE_DIR=$(mktemp -d)
    - npm cache add --offline --cache "$NPM_CACHE_DIR" --no-audit --no-fund "$CI_PROJECT_DIR"/.runtime/npm-archives/*.tgz
    - cd frontend
    - npm ci --offline --cache "$NPM_CACHE_DIR" --no-audit --no-fund
    - tar -czf "$CI_PROJECT_DIR/frontend-node-modules.tar.gz" node_modules
  artifacts:
    paths:
      - frontend-node-modules.tar.gz

build-windows:
  stage: build
  image: "$BUILDER_IMAGE"
  needs:
    - job: frontend-dependencies
      artifacts: true
  before_script:
    - tar -xzf frontend-node-modules.tar.gz -C frontend
  script:
    - build-installer "$CI_PROJECT_DIR" windows/amd64
  artifacts:
    paths:
      - build/bin/platform-installer-ui.exe
      - config/

build-linux:
  stage: build
  image: "$BUILDER_IMAGE"
  needs:
    - job: frontend-dependencies
      artifacts: true
  before_script:
    - tar -xzf frontend-node-modules.tar.gz -C frontend
  script:
    - build-installer "$CI_PROJECT_DIR" linux/amd64
  artifacts:
    paths:
      - build/bin/platform-installer-ui
      - build/bin/linux-resources/
      - config/
