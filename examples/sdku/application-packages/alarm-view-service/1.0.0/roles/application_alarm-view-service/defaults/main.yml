platform_application_definition:
    connections:
        clickhouse:
            library_binding: analytics
            protocol: https
        kafka:
            library_binding: messaging
            protocol: tcp
        postgres:
            library_binding: database
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        command:
            - java
            - -jar
            - alarm-view-service.jar
        environment:
            DB_CONNECTION_STRING: "$${POSTGRES_JDBC_ENDPOINT}/{{ application_parameters.database_name | default(undef(hint='Configure database_name'), true) }}?$${POSTGRES_SSL_OPTIONS}"
            HISTORY_DATASOURCE_CLICKHOUSE_JDBCURL: "$${CLICKHOUSE_HTTP_ENDPOINT}?$${CLICKHOUSE_SSL_OPTIONS}"
            ALERT_CLASS_TOPIC: '{{ application_parameters.source_variables.REDIS_ALERT_CLASS_TOPIC | default(undef(hint=''Configure SDKU REDIS_ALERT_CLASS_TOPIC''), true) }}'
            ALERT_HANDLER_TOPIC: '{{ application_parameters.source_variables.REDIS_ALERT_HANDLER_TOPIC | default(undef(hint=''Configure SDKU REDIS_ALERT_HANDLER_TOPIC''), true) }}'
            AUTO_ACK_DELAY: "600000"
            AUTO_ACK_TIME: PT2H
            DB_ROOT_CERT: /opt/application/pki/ca-chain.pem
            JAVA_OPTS: -Xmx4096m
            KAFKA_ACK_ALARM_TOPIC: dev-ack-alarm
            KAFKA_ALARM_COMPACT_TOPIC: '{{ application_parameters.source_variables.ALARM_TOPIC | default(undef(hint=''Configure SDKU ALARM_TOPIC''), true) }}-compact'
            KAFKA_ALARM_CONSUMER_ID: alarm-view-service-{{ application_instance_id }}
            KAFKA_ALARM_GROUP: alarm-view-service-{{ application_instance_id }}
            KAFKA_ALARM_GROUP_WS: alarm-view-service-{{ application_instance_id }}
            KAFKA_ALARM_HISTORY_TOPIC: '{{ application_parameters.source_variables.ALARM_TOPIC | default(undef(hint=''Configure SDKU ALARM_TOPIC''), true) }}'
            KAFKA_LISTENER_CONCURRENCY: "1"
            KAFKA_MANAGER_LISTENER_ID: alarm-view-service-{{ application_instance_id }}
            KAFKA_SASL_MECHANISM: PLAIN
            KAFKA_SECURITY_PROTOCOL: PLAINTEXT
            KAFKA_SIGNAL_TOPIC: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            LOGGER_LEVEL: DEBUG
            SERVER_ALLOWED_ORIGINS: '*'
            SIM_DELAY: "1000"
            SLEUTH_TRACE_ENABLED: false
            SPRING_PROFILES_ACTIVE: sdku
            SQL_INIT_MODE: never
            TIME_STAMP_PATTERN: yyyy.MM.dd HH:mm:ss.SSS
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            logging.level.ru.tnt.transneft.alarmservice.processor: WARN
            server.max-http-request-header-size: 100MB
        image: evoscada-docker.artifacts.tn.tngrp.ru/alarm-view-service:0.4.0-96e90ee0-redos
        parameters:
            database_name: tn-scada-alarms
            source_variables:
                ALARM_TOPIC: sdku-alarms
                MAIN_TOPIC: sdku-main
                REDIS_ALERT_CLASS_TOPIC: alert-class
                REDIS_ALERT_HANDLER_TOPIC: alert-hdl
                REDIS_SENTINEL_MASTER: ""
        ports:
            port-1:
                container: 10021
                published: 10021
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        library_secret: postgres_scada_password
                DB_USERNAME:
                    source:
                        library_secret: postgres_scada_user
                HISTORY_DATASOURCE_CLICKHOUSE_PASSWORD:
                    source:
                        library_secret: clickhouse_scada_password
                HISTORY_DATASOURCE_CLICKHOUSE_USERNAME:
                    source:
                        library_secret: clickhouse_scada_username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        library_secret: redis_password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        library_secret: redis_username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: healthcheck
            retries: 30
        restart: always
        user: 1000:1000
    identity_environment:
        - EVO_MANAGER_APP_ID
        - KAFKA_APPLICATION_ID_CONFIG
        - KAFKA_LISTENER_ID_CONFIG
    name: alarm-view-service
    version: 1.0.0
