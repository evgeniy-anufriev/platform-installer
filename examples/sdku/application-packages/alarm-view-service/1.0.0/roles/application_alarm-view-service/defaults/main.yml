platform_application_definition:
    name: alarm-view-service
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/alarm-view-service:0.4.0-96e90ee0-redos
        user: 1000:1000
        restart: always
        accounts:
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: history
                grants:
                    - databaseRef: history
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            postgres:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-postgres-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseAccess:
                    - databaseRef: alarms_db
                      privileges:
                        - SELECT
                        - INSERT
                        - UPDATE
                        - DELETE
                        - CREATE
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
            sentinel:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-sentinel-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - ping
                        - auth
                        - hello
                        - sentinel|get-master-addr-by-name
                        - sentinel|master
                        - sentinel|replicas
                        - sentinel|slaves
                        - sentinel|sentinels
                        - psubscribe
                mode: managed
        command:
            - java
            - -jar
            - alarm-view-service.jar
        endpoint:
            enabled: true
            endpoint_group: qa-shared-endpoint
            listener: port-1
            probe:
                expected_status: 200
                path: /actuator/health
                timeout: 10
            protocol: http
        environment:
            AUTO_ACK_DELAY: "600000"
            AUTO_ACK_TIME: PT2H
            DB_CONNECTION_STRING: $${POSTGRES_JDBC_ENDPOINT}/{{ application_databases.postgres.alarms_db.name }}?$${POSTGRES_SSL_OPTIONS}
            DB_ROOT_CERT: /opt/application/pki/ca-chain.pem
            EVO_MANAGER_APP_ID: '{{ application_instance_id }}'
            HISTORY_DATASOURCE_CLICKHOUSE_JDBCURL: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_databases.clickhouse.history.name }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            JAVA_OPTS: -Xmx4096m
            KAFKA_ACK_ALARM_TOPIC: '{{ application_topics.kafka.ack_alarm.name }}'
            KAFKA_ALARM_COMPACT_TOPIC: '{{ application_topics.kafka.alarms_compact.name }}'
            KAFKA_ALARM_CONSUMER_ID: '{{ application_instance_id }}-$${SERVER_ID}-alarm-consumer'
            KAFKA_ALARM_GROUP: alarm-view-service-{{ application_instance_id }}
            KAFKA_ALARM_GROUP_WS: alarm-view-service-{{ application_instance_id }}
            KAFKA_ALARM_HISTORY_TOPIC: '{{ application_topics.kafka.alarms.name }}'
            KAFKA_ALARM_PRODUCER_ID: '{{ application_instance_id }}-$${SERVER_ID}-alarm-producer'
            KAFKA_APPLICATION_ID_CONFIG: '{{ application_instance_id }}'
            KAFKA_LISTENER_CONCURRENCY: "1"
            KAFKA_LISTENER_ID_CONFIG: '{{ application_instance_id }}'
            KAFKA_MANAGER_LISTENER_ID: alarm-view-service-{{ application_instance_id }}
            KAFKA_SASL_MECHANISM: PLAIN
            KAFKA_SECURITY_PROTOCOL: SSL
            KAFKA_SIGNAL_TOPIC: '{{ application_topics.kafka.main.name }}'
            LOGGER_LEVEL: DEBUG
            SERVER_ALLOWED_ORIGINS: '*'
            SERVER_PORT: '{{ ((application_job.application.definition.defaults.ports | default({})) | combine(application_job.slot.overrides.ports | default({}), recursive=true) | combine(application_job.instance.overrides.ports | default({}), recursive=true) | combine(application_job.hostOverride.ports | default({}), recursive=true))[''port-1''].container }}'
            SIM_DELAY: "1000"
            SLEUTH_TRACE_ENABLED: false
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            SPRING_PROFILES_ACTIVE: sdku
            SQL_INIT_MODE: never
            TIME_STAMP_PATTERN: yyyy.MM.dd HH:mm:ss.SSS
            TNT_DEMO_CLIENT_PORT: '{{ ((application_job.application.definition.defaults.ports | default({})) | combine(application_job.slot.overrides.ports | default({}), recursive=true) | combine(application_job.instance.overrides.ports | default({}), recursive=true) | combine(application_job.hostOverride.ports | default({}), recursive=true))[''port-1''].container }}'
            WEB_SERVER_PORT: '{{ ((application_job.application.definition.defaults.ports | default({})) | combine(application_job.slot.overrides.ports | default({}), recursive=true) | combine(application_job.instance.overrides.ports | default({}), recursive=true) | combine(application_job.hostOverride.ports | default({}), recursive=true))[''port-1''].container }}'
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            logging.level.ru.tnt.transneft.alarmservice.processor: WARN
            server.max-http-request-header-size: 100MB
        ports:
            port-1:
                container: 10021
                published: 10021
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        account: postgres
                        field: password
                DB_USERNAME:
                    source:
                        account: postgres
                        field: username
                HISTORY_DATASOURCE_CLICKHOUSE_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                HISTORY_DATASOURCE_CLICKHOUSE_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_PASSWORD:
                    source:
                        account: redis
                        field: password
                REDIS_SENTINEL_PASSWORD:
                    source:
                        account: sentinel
                        field: password
                REDIS_SENTINEL_USERNAME:
                    source:
                        account: sentinel
                        field: username
                REDIS_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_USERNAME:
                    source:
                        account: redis
                        field: username
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: sentinel
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: sentinel
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: secret
            type: vault-agent
        readiness:
            delay: 2
            mode: healthcheck
            retries: 30
    connections:
        - clickhouse
        - kafka
        - postgres
        - redis
        - vault
        - sentinel
