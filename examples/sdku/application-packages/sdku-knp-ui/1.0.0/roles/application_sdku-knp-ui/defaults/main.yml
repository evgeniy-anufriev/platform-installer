platform_application_definition:
    name: sdku-knp-ui
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/sdku-knp-ui:0.0.1-3fb701a5
        user: 1000:1000
        restart: on-failure
        command:
            - /app/docker-entrypoint.sh
        environment:
            REACT_APP_ALARM_VIEW_URL: ""
            REACT_APP_BASE_NAME: sdku-knp-ui
            REACT_APP_HMI_BACKEND_URL: ""
            REACT_APP_KNP_URL: ""
        ports:
            port-1:
                container: 10291
                published: 10291
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: []
