platform_application_definition:
    name: hmi-frontend-viewer
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/hmi-frontend-viewer:0.0.1-8a014e63
        user: 1000:1000
        restart: always
        command:
            - /app/docker-entrypoint.sh
        environment:
            ALARMS_URL: "{{ application_parameters.szi_proxy_url }}/hmi-frontend-alarms"
            CSPA_HMI_BACK: "{{ application_parameters.szi_proxy_url }}/hmi-backend"
            CSPA_HMI_BACK_WS: "{{ application_parameters.szi_proxy_url | regex_replace('^https://', 'wss://') }}/hmi-backend"
            GRANT_ACCESS: "{{ application_parameters.szi_proxy_url }}/grant-access"
            GRANT_ACCESS_AUDIT: "{{ application_parameters.szi_proxy_url }}/grant-access-audit"
            HMI_BACK: "{{ application_parameters.szi_proxy_url }}/ef-backend"
            NGINX_URL: '{{ application_parameters.szi_proxy_url }}'
            SVG_EDITOR: "{{ application_parameters.szi_proxy_url }}/hmi-frontend-svg-editor"
            TRENDS_URL: "{{ application_parameters.szi_proxy_url }}/hmi-frontend-trends"
            VTOR_URL: "{{ application_parameters.szi_proxy_url }}/sdku-vtor-ui"
        parameters:
            szi_proxy_url: >-
                {%- set ref = application_job.deployment.bindings.sso.providedConnectionRef -%}
                {{ platform_application_provided_connections[ref.libraryId][ref.name].parameters.proxy_url }}
            mount_sources:
                mount-1: ""
                mount-2: ""
        ports:
            port-1:
                container: 10211
                published: 10213
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: []
