platform_application_definition:
    name: sdku-vtor-ui
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/sdku-vtor-ui:0.1.0-e5633c83
        user: 1000:1000
        restart: on-failure
        command:
            - /app/docker-entrypoint.sh
        environment:
            REACT_APP_VTOR_HOST_URL: "{{ application_parameters.szi_proxy_url }}/sdku-vtor"
            REACT_APP_VTOR_HOST_URL_WS: "{{ application_parameters.szi_proxy_url | regex_replace('^https://', 'wss://') }}/sdku-vtor"
        parameters:
            szi_proxy_url: >-
                {%- set ref = application_job.deployment.bindings.sso.providedConnectionRef -%}
                {{ platform_application_provided_connections[ref.libraryId][ref.name].parameters.proxy_url }}
        ports:
            port-1:
                container: 10311
                published: 10311
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: []
