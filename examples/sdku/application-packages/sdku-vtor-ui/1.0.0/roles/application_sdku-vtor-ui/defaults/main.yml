platform_application_definition:
    name: sdku-vtor-ui
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/sdku-vtor-ui:0.1.0-e5633c83
        user: 1000:1000
        restart: on-failure
        command:
            - /app/docker-entrypoint.sh
        environment:
            REACT_APP_VTOR_HOST_URL: https://nginx.{{ application_parameters.URL_ROOT | default(undef(hint='Configure SDKU URL_ROOT'), true) }}/sdku-vtor
            REACT_APP_VTOR_HOST_URL_WS: wss://nginx.{{ application_parameters.URL_ROOT | default(undef(hint='Configure SDKU URL_ROOT'), true) }}/sdku-vtor
        parameters:
            URL_ROOT: ""
        ports:
            port-1:
                container: 10311
                published: 10311
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: []
