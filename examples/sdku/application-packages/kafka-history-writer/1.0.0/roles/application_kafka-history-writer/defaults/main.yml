platform_application_definition:
    name: kafka-history-writer
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/kafka-history-writer:0.0.67-412ebcbf-redos
        user: 1000:1000
        restart: on-failure
        accounts:
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: history
                grants:
                    - databaseRef: history
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
        command:
            - java
            - -jar
            - kafka-history-writer.jar
        environment:
            SERVER_PORT: &web_server_port >-
                {{ ((application_job.application.definition.defaults.ports | default({})) |
                combine(application_job.slot.overrides.ports | default({}), recursive=true) |
                combine(application_job.instance.overrides.ports | default({}), recursive=true) |
                combine(application_job.hostOverride.ports | default({}), recursive=true))['port-1'].container }}
            WEB_SERVER_PORT: *web_server_port
            DB_CONNECTION_STRING: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_databases.clickhouse.history.name }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            KAFKA_CONSUMER_GROUP_ID: kafka-history-writer
            LOGGER_LEVEL: INFO
            SPRING_KAFKA_APPLICATION_ID: kafka-history-writer
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            SPRING_KAFKA_LISTENER_GROUP_ID: kafka-history-writer
            TARGET_TOPICS: '{{ application_topics.kafka.main.name }}'
            TN_SCADA_REDIS_SENTINEL_MASTER: ""
            TZ: Europe/Moscow
            # SDK database-1.0.4 health cannot parse a JDBC URL with multiple hosts.
            tn-scada.clickhouse.health.enabled: "false"
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            server.max-http-request-header-size: 100MB
        ports:
            port-1:
                container: 10241
                published: 10241
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                DB_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: [clickhouse, kafka, redis, vault]
