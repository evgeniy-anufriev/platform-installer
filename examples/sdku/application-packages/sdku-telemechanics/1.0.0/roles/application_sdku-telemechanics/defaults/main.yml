platform_application_definition:
    connections:
        clickhouse:
            library_binding: analytics
            protocol: https
        kafka:
            library_binding: messaging
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        accounts:
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: analytics
                grants:
                    - databaseRef: analytics
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
        config_files:
            - source: assets/config/telemechanics_config.yaml
              destination: config/telemechanics_config.yaml
              mode: '0644'
        command:
            - java
            - -jar
            - sdku-telemechanics.jar
        parameters:
            database_name: ""
            source_variables:
                ALARM_SERVICE_URL: ""
                ALARM_TOPIC_COMPACT: sdku-alarms-compact
                DATA_MANAGER_URL_ROOT: ""
                REDIS_SENTINEL_MASTER: ""
                SDKU_TELEMECHANICS_CONSENSUS_TCP_PORT: &consensus_tcp_port >-
                    {{ ((application_job.application.definition.defaults.ports | default({})) |
                    combine(application_job.slot.overrides.ports | default({}), recursive=true) |
                    combine(application_job.instance.overrides.ports | default({}), recursive=true) |
                    combine(application_job.hostOverride.ports | default({}), recursive=true))['port-2'].container }}
        environment:
            ALARM_SERVICE_API_READ_TIMEOUT: 5000
            ALARM_SERVICE_API_ROOT_URI: '{{ application_parameters.source_variables.ALARM_SERVICE_URL | default(undef(hint=''Configure SDKU ALARM_SERVICE_URL''), true) }}'
            ALARM_SERVICE_API_SERVER_PATH: /generate-alarm
            ALARM_SERVICE_API_TYPE: mock
            ALARM_TOPIC: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_COMPACT''), true) }}'
            DB_CONNECTION_STRING: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_parameters.database_name | default(undef(hint='Configure database_name'), true) }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            DB_TYPE: clickhouse
            EVO_MANAGER_APP_ID: 'stm-{{ ((application_instance_id ~ ''-'' ~ application_job.hostId) | hash(''sha256''))[:20] }}'
            EVO_SERVICES_CONSENSUS_SERVICE_HEALTH_CHECK_INTERVAL: 1000
            EVO_SERVICES_CONSENSUS_SERVICE_HEALTH_CHECK_TIMEOUT: 999
            EVO_SERVICES_CONSENSUS_SERVICE_HEARTBEAT_INTERVAL: 500
            EVO_SERVICES_CONSENSUS_SERVICE_INSTANCE_NAME: '{{ application_job.hostId }}'
            EVO_SERVICES_CONSENSUS_SERVICE_LISTEN_PORT: *consensus_tcp_port
            EVO_SERVICES_CONSENSUS_SERVICE_MOCK: >-
                {{ (_application_inputs.jobs | selectattr('libraryId', 'equalto', library_instance_id) |
                    selectattr('slotId', 'equalto', application_job.slotId) | list | length) < 2 }}
            EVO_SERVICES_CONSENSUS_SERVICE_MODE: DYNAMIC
            EVO_SERVICES_CONSENSUS_SERVICE_OTHER_INSTANCES: >-
                {%- set peers = [] -%}
                {%- set server_ids = groups['all'] | reject('equalto', 'localhost') | sort | list -%}
                {%- for placement in _application_inputs.jobs |
                    selectattr('libraryId', 'equalto', library_instance_id) |
                    selectattr('slotId', 'equalto', application_job.slotId) | sort(attribute='hostId') if placement.hostId != application_job.hostId -%}
                {%- set ports = (placement.application.definition.defaults.ports | default({})) |
                    combine(placement.slot.overrides.ports | default({}), recursive=true) |
                    combine(placement.instance.overrides.ports | default({}), recursive=true) |
                    combine(placement.hostOverride.ports | default({}), recursive=true) -%}
                {%- set _ = peers.append(placement.hostId ~ '=$${SERVER_' ~ (server_ids.index(placement.hostId) + 1) ~ '_IP}:' ~ (ports['port-2'].published | string)) -%}
                {%- endfor -%}
                {{- peers | join(',') -}}
            EVO_SERVICES_CONSENSUS_SERVICE_TERM_LIFESPAN: 2000
            EVO_SERVICES_CONSENSUS_SERVICE_TIMER_INTERVAL: 500
            EVO_SERVICES_CONSENSUS_SERVICE_WORKLOAD: LOW
            LOGGING_LEVEL_PLUGIN: DEBUG
            SERVER_PORT: 10251
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            TELEMECHANICS_CONFIG_PATH: /usr/local/app/config/telemechanics_config.yaml
            TELEMECHANICS_LOGGER_LEVEL: DEBUG
            TN_SCADA_DATA_MANAGER_URL: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_DATASOURCE_URL: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_parameters.database_name | default(undef(hint='Configure database_name'), true) }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            TN_SCADA_METADATA_TARGET_PROJECT: TNSV
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            server.max-http-header-size: 10MB
            server.max-http-request-header-size: 10MB
            tn-scada.metadata.dontShowTargetProjectInNames: true
            tn-scada.metadata.load-projects: TNSV
        image: evoscada-docker.artifacts.tn.tngrp.ru/sdku-telemechanics:1.2.3-6aa0b4a0-redos
        ports:
            port-1:
                container: 10251
                published: 10251
            port-2:
                container: 40251
                published: 40251
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                DB_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: container
            retries: 30
        restart: on-failure
        user: 1000:1000
    identity_environment:
        - KAFKA_APPLICATION_ID_CONFIG
        - KAFKA_LISTENER_ID_CONFIG
    name: sdku-telemechanics
    version: 1.0.0
