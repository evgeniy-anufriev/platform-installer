platform_application_definition:
    name: sdku-status-calculation
    version: 1.0.0
    defaults:
        image: evoscada-docker.artifacts.tn.tngrp.ru/sdku-status-calculation:0.5.0-1508923e-redos
        user: 1000:1000
        restart: always
        accounts:
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: history
                grants:
                    - databaseRef: history
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
        command:
            - java
            - -jar
            - sdku-status-calculation.jar
        parameters:
            DATA_MANAGER_URL_ROOT: ""
        environment:
            SDKU_STATUS_CALCULATION_CONSENSUS_TCP_PORT: &consensus_tcp_port >-
                {{ ((application_job.application.definition.defaults.ports | default({})) | combine(application_job.slot.overrides.ports | default({}), recursive=true) | combine(application_job.instance.overrides.ports | default({}), recursive=true) | combine(application_job.hostOverride.ports | default({}), recursive=true))['port-2'].container }}
            SERVER_PORT: &web_server_port >-
                {{ ((application_job.application.definition.defaults.ports | default({})) |
                combine(application_job.slot.overrides.ports | default({}), recursive=true) |
                combine(application_job.instance.overrides.ports | default({}), recursive=true) |
                combine(application_job.hostOverride.ports | default({}), recursive=true))['port-1'].container }}
            server.port: *web_server_port
            WEB_SERVER_PORT: *web_server_port
            ALARM_SERVICE_API_READ_TIMEOUT: 5000
            ALARM_SERVICE_API_ROOT_URI: ""
            ALARM_SERVICE_API_SERVER_PATH: /generate-alarm
            ALARM_SERVICE_API_TYPE: buffered
            ALARM_TOPIC: '{{ application_topics.kafka.alarms_compact.name }}'
            DB_CONNECTION_STRING: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_databases.clickhouse.history.name }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            DB_TYPE: clickhouse
            DATA_MANAGER_ROOT_URL: '{{ application_parameters.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            EVO_MANAGER_APP_ID: 'cst-{{ ((application_instance_id ~ ''-'' ~ application_job.hostId) | hash(''sha256''))[:20] }}'
            EVO_SERVICES_CONSENSUS_SERVICE_MOCK: >-
                {{ (_application_inputs.jobs | selectattr('libraryId', 'equalto', library_instance_id) |
                    selectattr('slotId', 'equalto', application_job.slotId) | list | length) < 2 }}
            EVO_SERVICES_CONSENSUS_SERVICE_MODE: DYNAMIC
            EVO_SERVICES_CONSENSUS_SERVICE_OTHER_INSTANCES: >-
                {%- set peers = [] -%}
                {%- set server_ids = groups['all'] | reject('equalto', 'localhost') | sort | list -%}
                {%- for placement in _application_inputs.jobs |
                    selectattr('libraryId', 'equalto', library_instance_id) |
                    selectattr('slotId', 'equalto', application_job.slotId) | sort(attribute='hostId') if placement.hostId != application_job.hostId -%}
                {%- set ports = (placement.application.definition.defaults.ports | default({})) |
                    combine(placement.slot.overrides.ports | default({}), recursive=true) |
                    combine(placement.instance.overrides.ports | default({}), recursive=true) |
                    combine(placement.hostOverride.ports | default({}), recursive=true) -%}
                {%- set _ = peers.append(placement.hostId ~ '=$${SERVER_' ~ (server_ids.index(placement.hostId) + 1) ~ '_IP}:' ~ (ports['port-2'].published | string)) -%}
                {%- endfor -%}
                {{- peers | join(',') -}}
            EVO_SERVICES_CONSENSUS_SERVICE_LISTEN_PORT: *consensus_tcp_port
            EVO_SERVICES_CONSENSUS_SERVICE_INSTANCE_NAME: '{{ application_job.hostId }}'
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            TN_SCADA_DATA_MANAGER_URL: '{{ application_parameters.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_DATASOURCE_URL: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_databases.clickhouse.history.name }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            TN_SCADA_METADATA_TARGET_PROJECT: TNSV
            TN_SCADA_REDIS_SENTINEL_MASTER: ""
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            server.max-http-header-size: 10MB
            server.max-http-request-header-size: 10MB
            tn-scada.metadata.dontShowTargetProjectInNames: true
            tn-scada.metadata.load-projects: TNSV
            KAFKA_APPLICATION_ID_CONFIG: '{{ application_instance_id }}'
            KAFKA_LISTENER_ID_CONFIG: '{{ application_instance_id }}'
        ports:
            port-1:
                container: 10361
                published: 10361
            port-2:
                container: 40361
                published: 40361
            port-3:
                container: 15016
                published: 15016
            port-4:
                container: 40362
                published: 40362
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                DB_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: container
            retries: 30
    connections: [clickhouse, kafka, redis, vault]
