platform_application_definition:
    connections:
        clickhouse:
            library_binding: analytics
            protocol: https
        kafka:
            library_binding: messaging
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        command:
            - java
            - -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:15005
            - -Xmx5500M
            - -jar
            - opc-ua-server.war
            - --spring.config.additional-location=/usr/local/config/opcua.yml
            - -Djavax.net.ssl.trustStore=/usr/local/certs/TN-SCADA OPC UA Server [61511528719CFF008A751C1D9F8165129F07C977].der
        environment:
            DB_TYPE: clickhouse
            KAFKA_ENABLE_SSL: "true"
            KAFKA_KEYSTORE_LOCATION: /opt/application/pki/keystore.p12
            KAFKA_TRUSTSTORE_LOCATION: /opt/application/pki/truststore.p12
            LOGGER_ROOT_LEVEL: WARN
            OPCUA_APP_TYPE: server
            OPCUA_CONFIG: /usr/local/config/opcua.yml
            OPCUA_VIEW: EVO_VIEW
            OPCUA_VIEW_SOURCE: csv
            REDIS_ENABLE_SSL: "true"
            REDIS_KEYSTORE_LOCATION: /opt/application/pki/keystore.p12
            REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            REDIS_TRUSTSTORE_LOCATION: /opt/application/pki/truststore.p12
            REDU_DISABLE: "true"
            REDU_GROUP_ID: opcua-server
            REDU_MANAGER_ID: 1
            SERVER_VIEW_CONFIG: /usr/local/config/view.csv
            TN_SCADA_DATA_MANAGER_URL_ROOT: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            TNSCADA_LOGGER_LEVEL: WARN
            TZ: Europe/Moscow
            logging.level.org.eclipse.milo: TRACE
            logging.level.tnt.tnscada.drivers.opcua: INFO
            opc-ua.server.limits.minSamplingInterval: 0
            opc-ua.server.security-dir: /usr/local/PKI
            server.max-http-request-header-size: 100MB
            spring.config.additional-location: /usr/local/config/opcua.yml
        image: evoscada-docker.artifacts.tn.tngrp.ru/opc-ua-server:1.1.2-67bad727-redos
        parameters:
            mount_sources:
                mount-1: ""
                mount-2: ""
                mount-7: ""
            source_variables:
                DATA_MANAGER_URL_ROOT: ""
                REDIS_SENTINEL_MASTER: ""
        ports:
            port-1:
                container: 10391
                published: 10391
            port-2:
                container: 15005
                published: 15005
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        library_secret: opc_ua_server_db_password
                DB_USERNAME:
                    source:
                        library_secret: opc_ua_server_db_username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_PASSWORD:
                    source:
                        library_secret: redis_password
                REDIS_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                REDIS_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                REDIS_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_USERNAME:
                    source:
                        library_secret: redis_username
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        library_secret: redis_password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        library_secret: redis_username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: container
            retries: 30
        restart: always
        user: 1000:1000
    identity_environment:
        - KAFKA_LISTENER_ID_CONFIG
    name: opc-ua-server
    version: 1.0.0
