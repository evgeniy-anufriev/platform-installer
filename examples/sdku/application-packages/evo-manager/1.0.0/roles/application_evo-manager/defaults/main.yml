platform_application_definition:
    connections:
        kafka:
            library_binding: messaging
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        command:
            - java
            - -XX:MaxRAMPercentage=70.0
            - -jar
            - evo-manager.jar
        environment:
            ALARM_SERVICE_API_TYPE: mock
            DATA_MANAGER_ROOT_URL: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            EVO_MANAGER_HISTORY_SERVICE_MOCK: true
            EVO_MANAGER_JAR_PATH: /usr/local/app/imitator/lib
            EVO_MANAGER_MAIN_CLASS: tnt.tnscada.Imitator
            EVO_MANAGER_SOURCE_PATH: /usr/local/app/imitator/src/main/java
            EVO_SERVICES_CONSENSUS_SERVICE_MOCK: true
            KAFKA_ENABLE_SSL: "false"
            KAFKA_KEYSTORE_LOCATION: /opt/application/pki/keystore.p12
            KAFKA_TRUSTSTORE_LOCATION: /opt/application/pki/truststore.p12
            LOGGER_OUTPUT_PATTERN_CONFIG: '''%d{ISO8601} [%X{requestId}] [%-15.15t] %highlight(%-5level) %yellow(%30.30C{1}) %msg%n%throwable'''
            LOGGER_ROOT_LEVEL: INFO
            PRESSURES_CSV: /usr/local/app/imitator/data/pressures.csv
            REDIS_ENABLE_SSL: "false"
            REDIS_KEYSTORE_LOCATION: /opt/application/pki/keystore.p12
            REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            REDIS_TRUSTSTORE_LOCATION: /opt/application/pki/truststore.p12
            SPRING_KAFKA_APPLICATION_ID: evo-manager-{{ application_instance_id }}
            SPRING_KAFKA_LISTENER_GROUP_ID: evo-manager-{{ application_instance_id }}
            SPRING_MAIN_WEB_APPLICATION_TYPE: NONE
            TN_SCADA_DATA_MANAGER_URL_ROOT: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_DATASOURCE_URL: '{{ application_parameters.source_variables.CLICKHOUSE_SSL_URL | default(undef(hint=''Configure SDKU CLICKHOUSE_SSL_URL''), true) }}:8443?ssl=true&sslmode=strict'
            TN_SCADA_METADATA_LOAD_PROJECTS: TNSVHYDRO
            TN_SCADA_METADATA_TARGET_PROJECT: TNSVHYDRO
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            server.max-http-request-header-size: 100MB
        image: evoscada-docker.artifacts.tn.tngrp.ru/evo-manager:3.10.21-eedea228-redos
        parameters:
            mount_sources:
                mount-1: ""
                mount-2: ""
            source_variables:
                CLICKHOUSE_SSL_URL: ""
                DATA_MANAGER_URL_ROOT: ""
                REDIS_SENTINEL_MASTER: ""
        ports: {}
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_PASSWORD:
                    source:
                        library_secret: redis_password
                REDIS_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                REDIS_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                REDIS_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                REDIS_USERNAME:
                    source:
                        library_secret: redis_username
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        library_secret: redis_password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        library_secret: redis_username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: container
            retries: 30
        restart: unless-stopped
    identity_environment: []
    name: evo-manager
    version: 1.0.0
