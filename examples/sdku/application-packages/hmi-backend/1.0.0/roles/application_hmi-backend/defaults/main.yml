platform_application_definition:
    connections:
        clickhouse:
            library_binding: analytics
            protocol: https
        kafka:
            library_binding: messaging
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        command:
            - java
            - -XX:MaxRAMPercentage=70.0
            - -javaagent:/usr/local/app/opentelemetry-javaagent.jar
            - -jar
            - hmi-backend.jar
        environment:
            ALARM_TOPIC: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_COMPACT''), true) }}'
            ALARMSERVICE_URL_ROOT: '{{ application_parameters.source_variables.ALARM_SERVICE_URL | default(undef(hint=''Configure SDKU ALARM_SERVICE_URL''), true) }}'
            CSPA_TOPIC_ROUTE_ROOT: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            CSPA_TOPICS: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            DATAMANAGER_ROOT_URL: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            DB_TYPE: clickhouse
            EVO_MANAGER_HOT_TOPICS: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            GAAUDIT_URL_ROOT: '{{ application_parameters.source_variables.GRANT_ACCESS_AUDIT_URL | default(undef(hint=''Configure SDKU GRANT_ACCESS_AUDIT_URL''), true) }}'
            JAVA_OPTS: -Xmx4048m
            SERVER_ALLOWED_ORIGINS: '*'
            SPRING_KAFKA_SCHEMA_REGISTRY_URL: '{{ application_parameters.source_variables.KAFKA_SCHEMA_REGISTRY_URL | default(undef(hint=''Configure SDKU KAFKA_SCHEMA_REGISTRY_URL''), true) }}'
            TN_SCADA_DATA_MANAGER_URL_ROOT: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_METADATA_TARGET_PROJECT: TNSV
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            USER_ACTION_TAGNAME: _MaskCauseList.Description
            evo-manager.alarm-subscription.topic: '{{ application_parameters.source_variables.ALARM_TOPIC_CAMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_CAMPACT''), true) }}'
            logging.charset.console: UTF-8
            management.endpoint.health.show-details: always
            server.max-http-request-header-size: 1MB
            tn-scada.alarm.topic: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_COMPACT''), true) }}'
            tn-scada.cspa.topic-route.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            tn-scada.cspa.topic-route.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC | default(undef(hint=''Configure SDKU MAIN_TOPIC''), true) }}'
            tn-scada.data-manager.url: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            tn-scada.metadata.dontShowTargetProjectInNames: false
            tn-scada.metadata.load-projects: TNSV,TNSVHYDRO
        image: evoscada-docker.artifacts.tn.tngrp.ru/hmi-backend:1.2.11-45c5e804-redos
        parameters:
            source_variables:
                ALARM_SERVICE_URL: ""
                ALARM_TOPIC_CAMPACT: ""
                ALARM_TOPIC_COMPACT: sdku-alarms-compact
                DATA_MANAGER_URL_ROOT: ""
                GRANT_ACCESS_AUDIT_URL: ""
                KAFKA_SCHEMA_REGISTRY_URL: ""
                MAIN_TOPIC: sdku-main
                REDIS_SENTINEL_MASTER: ""
        ports:
            port-1:
                container: 10101
                published: 10101
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        library_secret: clickhouse_scada_password
                DB_USERNAME:
                    source:
                        library_secret: clickhouse_scada_username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        library_secret: redis_password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        library_secret: redis_sentinel_password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        library_secret: redis_sentinel_username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        library_secret: redis_username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: healthcheck
            retries: 30
        restart: always
        user: 1000:1000
    identity_environment:
        - EVO_MANAGER_APP_ID
        - KAFKA_APPLICATION_ID_CONFIG
        - KAFKA_LISTENER_ID_CONFIG
    name: hmi-backend
    version: 1.0.0
