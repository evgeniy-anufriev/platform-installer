platform_application_definition:
    name: hmi-backend
    version: 1.0.0
    defaults:
        connections:
            sso: {enabled: false}
        image: evoscada-docker.artifacts.tn.tngrp.ru/hmi-backend:1.2.11-45c5e804-redos
        user: 1000:1000
        restart: always
        accounts:
            sentinel:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-sentinel-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - ping
                        - auth
                        - hello
                        - sentinel|get-master-addr-by-name
                        - sentinel|master
                        - sentinel|replicas
                        - sentinel|slaves
                        - sentinel|sentinels
                        - psubscribe
                mode: managed
            kafka:
                mode: managed
                credentials:
                    username:
                        source: {kind: literal, value: '{{ application_instance_id | replace(''-'', ''_'') }}'}
                    password:
                        source: {kind: runtime_secret_ref, ref: '{{ application_instance_id }}-kafka-password'}
                grants:
                    - {topicRef: alarms_compact, operations: [Read, Write, Describe]}
                    - {topicRef: main, operations: [Read, Write, Describe]}
                    - {topicRef: main_compact, operations: [Read, Write, Describe]}
                    - {resourceType: group, name: '{{ application_instance_id }}', patternType: prefixed, operations: [Read, Describe]}
                    - {resourceType: cluster, name: kafka-cluster, operations: [Describe, IdempotentWrite]}
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: history
                grants:
                    - databaseRef: history
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
        command:
            - java
            - -XX:MaxRAMPercentage=70.0
            - -javaagent:/usr/local/app/opentelemetry-javaagent.jar
            - -jar
            - hmi-backend.jar
        endpoint:
            enabled: false
            listener: port-1
            probe:
                expected_status: 200
                path: /actuator/health
                timeout: 10
            protocol: http
        environment:
            kafka.producer.ssl.truststore.password: '$${KAFKA_TRUSTSTORE_PASSWORD}'
            kafka.producer.ssl.truststore.type: PKCS12
            kafka.producer.ssl.truststore.location: /opt/application/pki/truststore.p12
            kafka.consumer.ssl.truststore.password: '$${KAFKA_TRUSTSTORE_PASSWORD}'
            kafka.consumer.ssl.truststore.type: PKCS12
            kafka.consumer.ssl.truststore.location: /opt/application/pki/truststore.p12
            KAFKA_ENABLE_SSL: "true"
            SPRING_KAFKA_SSL_ENABLE_SSL: "true"
            KAFKA_SECURITY_PROTOCOL: SASL_SSL
            KAFKA_SASL_MECHANISM: SCRAM-SHA-512
            kafka.consumer.security.protocol: SASL_SSL
            kafka.producer.security.protocol: SASL_SSL
            kafka.consumer.sasl.mechanism: SCRAM-SHA-512
            kafka.producer.sasl.mechanism: SCRAM-SHA-512
            kafka.consumer.sasl.jaas.config: '$${KAFKA_CONSUMER_SASL_JAAS_CONFIG}'
            kafka.producer.sasl.jaas.config: '$${KAFKA_PRODUCER_SASL_JAAS_CONFIG}'
            logging.level.tnt.tnscada.core.kafkamanager.kafka.config.KafkaManagerConfig: INFO
            SERVER_PORT: &web_server_port >-
                {{ ((application_job.application.definition.defaults.ports | default({})) |
                combine(application_job.slot.overrides.ports | default({}), recursive=true) |
                combine(application_job.instance.overrides.ports | default({}), recursive=true) |
                combine(application_job.hostOverride.ports | default({}), recursive=true))['port-1'].container }}
            server.port: *web_server_port
            WEB_SERVER_PORT: *web_server_port
            ALARM_TOPIC: '{{ application_topics.kafka.alarms_compact.name }}'
            ALARMSERVICE_URL_ROOT: ""
            CSPA_TOPIC_ROUTE_ROOT: '{{ application_topics.kafka.main.name }}'
            CSPA_TOPICS: '{{ application_topics.kafka.main.name }}'
            DATAMANAGER_ROOT_URL: '{{ (''https://data-manager-'' ~ library_instance_id ~ ''.'' ~ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications[''data-manager''].overrides.endpoint.endpoint_group].address.domain) if ''data-manager'' in platform_desired_state.applicationLibraryDeployments[library_instance_id].applications else '''' }}'
            DB_CONNECTION_STRING: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_databases.clickhouse.history.name }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            DB_TYPE: clickhouse
            EVO_MANAGER_HOT_TOPICS: '{{ application_topics.kafka.main.name }}'
            GAAUDIT_URL_ROOT: '{{ (application_connections.sso.parameters.proxy_url ~ ''/grant-access-audit'') if ''sso'' in application_connections else '''' }}'
            JAVA_OPTS: -Xmx4048m
            MAIN_TOPIC: '{{ application_topics.kafka.main_compact.name }}'
            SERVER_ALLOWED_ORIGINS: '*'
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            TN_SCADA_DATA_MANAGER_URL_ROOT: '{{ (''https://data-manager-'' ~ library_instance_id ~ ''.'' ~ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications[''data-manager''].overrides.endpoint.endpoint_group].address.domain) if ''data-manager'' in platform_desired_state.applicationLibraryDeployments[library_instance_id].applications else '''' }}'
            TN_SCADA_METADATA_TARGET_PROJECT: TNSV
            USER_ACTION_TAGNAME: _MaskCauseList.Description
            evo-manager.alarm-subscription.topic: '{{ application_topics.kafka.alarms_compact.name }}'
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            logging.charset.console: UTF-8
            management.endpoint.health.show-details: always
            server.max-http-request-header-size: 1MB
            tn-scada.alarm.topic: '{{ application_topics.kafka.alarms_compact.name }}'
            tn-scada.cspa.topic-route.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.topic: '{{ application_topics.kafka.main.name }}'
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.topic: '{{ application_topics.kafka.main.name }}'
            tn-scada.cspa.topic-route.root.topic: '{{ application_topics.kafka.main.name }}'
            tn-scada.data-manager.url: '{{ (''https://data-manager-'' ~ library_instance_id ~ ''.'' ~ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications[''data-manager''].overrides.endpoint.endpoint_group].address.domain) if ''data-manager'' in platform_desired_state.applicationLibraryDeployments[library_instance_id].applications else '''' }}'
            tn-scada.metadata.dontShowTargetProjectInNames: false
            tn-scada.metadata.load-projects: TNSV,TNSVHYDRO
            EVO_MANAGER_APP_ID: '{{ application_instance_id }}'
            KAFKA_APPLICATION_ID_CONFIG: '{{ application_instance_id }}'
            KAFKA_LISTENER_ID_CONFIG: '{{ application_instance_id }}'
        parameters:
            IDENTITY_CLIENT: "{{ (lookup('ansible.builtin.template', (application_job.application.defaultsPath | dirname) ~ '/../../../assets/keycloak-client.json.j2', convert_data=false) | from_json) if 'sso' in application_connections else {} }}"
        ports:
            port-1:
                container: 10101
                published: 10101
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                REDIS_SENTINEL_USERNAME:
                    source:
                        account: sentinel
                        field: username
                REDIS_SENTINEL_PASSWORD:
                    source:
                        account: sentinel
                        field: password
                KAFKA_TRUSTSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                KAFKA_PRODUCER_SASL_JAAS_CONFIG:
                    source: {account: kafka, field: password}
                    format: kafka_scram_jaas
                KAFKA_CONSUMER_SASL_JAAS_CONFIG:
                    source: {account: kafka, field: password}
                    format: kafka_scram_jaas
                DB_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                DB_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: sentinel
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: sentinel
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: secret
            type: vault-agent
        readiness:
            delay: 2
            mode: healthcheck
            retries: 30
    connections: [sso, clickhouse, kafka, redis, vault, sentinel]
