platform_application_definition:
    connections:
        clickhouse:
            library_binding: analytics
            protocol: https
        kafka:
            library_binding: messaging
            protocol: tcp
        redis:
            library_binding: cache
            protocol: tcp
        vault:
            library_binding: secrets
            protocol: https
    defaults:
        accounts:
            clickhouse:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-clickhouse-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                databaseRef: analytics
                grants:
                    - databaseRef: analytics
                      privileges:
                        - SELECT
                        - INSERT
                      tables:
                        - '*'
                mode: managed
            redis:
                credentials:
                    password:
                        source:
                            kind: runtime_secret_ref
                            ref: '{{ application_instance_id }}-redis-password'
                    username:
                        source:
                            kind: literal
                            value: '{{ application_instance_id | replace(''-'', ''_'') }}'
                grants:
                    channels:
                        - '*'
                    commands:
                        - +@all
                        - -@admin
                    keys:
                        - '*'
                mode: managed
        command:
            - java
            - -XX:MaxRAMPercentage=70.0
            - -javaagent:/usr/local/app/opentelemetry-javaagent.jar
            - -jar
            - hmi-backend.jar
        environment:
            ALARM_TOPIC: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_COMPACT''), true) }}'
            ALARMSERVICE_URL_ROOT: '{{ application_parameters.source_variables.ALARM_SERVICE_URL | default("", true) }}'
            CSPA_TOPIC_ROUTE_ROOT: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            CSPA_TOPICS: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            DATAMANAGER_ROOT_URL: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            DB_CONNECTION_STRING: $${CLICKHOUSE_JDBC_ENDPOINT}/{{ application_parameters.database_name | default(undef(hint='Configure database_name'), true) }}?$${CLICKHOUSE_SSL_OPTIONS}&compress=0
            DB_TYPE: clickhouse
            EVO_MANAGER_HOT_TOPICS: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            GAAUDIT_URL_ROOT: '{{ application_parameters.source_variables.GRANT_ACCESS_AUDIT_URL | default("", true) }}'
            JAVA_OPTS: -Xmx4048m
            MAIN_TOPIC: '{{ application_parameters.source_variables.MAIN_TOPIC }}'
            SERVER_ALLOWED_ORIGINS: '*'
            SERVER_PORT: 10101
            SPRING_KAFKA_CLIENT_ID: '{{ application_instance_id }}-$${SERVER_ID}'
            TN_SCADA_DATA_MANAGER_URL_ROOT: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            TN_SCADA_METADATA_TARGET_PROJECT: TNSV
            TN_SCADA_REDIS_SENTINEL_MASTER: '{{ application_parameters.source_variables.REDIS_SENTINEL_MASTER | default(undef(hint=''Configure SDKU REDIS_SENTINEL_MASTER''), true) }}'
            USER_ACTION_TAGNAME: _MaskCauseList.Description
            evo-manager.alarm-subscription.topic: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT }}'
            kafka.consumer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-consumer'
            kafka.producer.client.id: '{{ application_instance_id }}-$${SERVER_ID}-producer'
            logging.charset.console: UTF-8
            management.endpoint.health.show-details: always
            server.max-http-request-header-size: 1MB
            tn-scada.alarm.topic: '{{ application_parameters.source_variables.ALARM_TOPIC_COMPACT | default(undef(hint=''Configure SDKU ALARM_TOPIC_COMPACT''), true) }}'
            tn-scada.cspa.topic-route.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSV.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.descentRule: rcv
            tn-scada.cspa.topic-route.root.project.TNSVHYDRO.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            tn-scada.cspa.topic-route.root.topic: '{{ application_parameters.source_variables.MAIN_TOPIC_BASE | default(undef(hint=''Configure SDKU MAIN_TOPIC_BASE''), true) }}'
            tn-scada.data-manager.url: '{{ application_parameters.source_variables.DATA_MANAGER_URL_ROOT | default(undef(hint=''Configure SDKU DATA_MANAGER_URL_ROOT''), true) }}'
            tn-scada.metadata.dontShowTargetProjectInNames: false
            tn-scada.metadata.load-projects: TNSV,TNSVHYDRO
        image: evoscada-docker.artifacts.tn.tngrp.ru/hmi-backend:1.2.11-45c5e804-redos
        parameters:
            source_variables:
                ALARM_SERVICE_URL: ""
                ALARM_TOPIC_COMPACT: alarms-main-compact
                DATA_MANAGER_URL_ROOT: '{{ (''https://data-manager-'' ~ library_instance_id ~ ''.'' ~ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications[''data-manager''].overrides.endpoint.endpoint_group].address.domain) if ''data-manager'' in platform_desired_state.applicationLibraryDeployments[library_instance_id].applications else '''' }}'
                GRANT_ACCESS_AUDIT_URL: ""
                MAIN_TOPIC: sdku-main-compact
                MAIN_TOPIC_BASE: sdku-main
                REDIS_SENTINEL_MASTER: ""
        ports:
            port-1:
                container: 10101
                published: 10101
        provisioner:
            approle:
                bind_secret_id: false
            auth:
                method: approle
            mode: process-supervisor
            secret_bindings:
                DB_PASSWORD:
                    source:
                        account: clickhouse
                        field: password
                DB_USERNAME:
                    source:
                        account: clickhouse
                        field: username
                JAVA_KEYSTORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                SPRING_KAFKA_SSL_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_ACL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_PASSWORD:
                    source:
                        account: redis
                        field: password
                TN_SCADA_REDIS_ACL_SENTINEL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_ACL_USERNAME:
                    source:
                        account: redis
                        field: username
                TN_SCADA_REDIS_SSL_PROPERTIES_KEY_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
                TN_SCADA_REDIS_SSL_PROPERTIES_TRUST_STORE_PASSWORD:
                    source:
                        library_secret: java_keystore_password
            secrets:
                mount: applications
            type: vault-agent
        readiness:
            delay: 2
            mode: healthcheck
            retries: 30
        restart: always
        topicBindings:
            kafka:
                - sdku-main
                - sdku-main-compact
                - alarms-main
                - alarms-main-compact
        user: 1000:1000
    identity_environment:
        - EVO_MANAGER_APP_ID
        - KAFKA_APPLICATION_ID_CONFIG
        - KAFKA_LISTENER_ID_CONFIG
    name: hmi-backend
    version: 1.0.0
