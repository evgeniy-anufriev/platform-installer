platform_application_definition:
  name: nginx
  version: 1.0.0
  defaults:
    image: evoscada-docker.artifacts.tn.tngrp.ru/lawellet/nginx-lua-resty:1.0.3-redos3-certs
    user: "1000:1000"
    restart: always
    command:
      - /usr/local/openresty/nginx/sbin/nginx
      - -c
      - /etc/nginx/nginx.conf
      - -g
      - daemon off;
    config_files:
      - template: assets/routes.requested.json.j2
        destination: routes.requested.json
        mode: "0644"
      - source: assets/script.lua
        destination: script.lua
        mode: "0644"
      - template: assets/data.env
        destination: data.env
        mode: "0644"
      - template: assets/scada-lawellet.conf
        destination: scada-lawellet.conf
        mode: "0644"
    environment:
      NGINX_HOST: "nginx.{{ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications.nginx.overrides.endpoint.endpoint_group].address.domain }}"
      REALM: '{{ application_parameters.SZI_REALM }}'
      GA_HOST: "https://grant-access.{{ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[library_instance_id].applications['grant-access'].overrides.endpoint.endpoint_group].address.domain }}"
    ports:
      port-1:
        container: 18443
        published: 10543
    endpoint:
      enabled: false
      listener: port-1
      protocol: https
      probe:
        path: /server-status
        expected_status: 200
        timeout: 10
    readiness:
      mode: container
      delay: 2
      retries: 30
  connections: []
