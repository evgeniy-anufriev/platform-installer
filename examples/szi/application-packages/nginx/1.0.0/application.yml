{
  "apiVersion": "platform.installer/application-package/v1alpha2",
  "kind": "ApplicationPackage",
  "name": "nginx",
  "version": "1.0.0",
  "files": [
    "assets/data.env",
    "assets/scada-lawellet.conf",
    "assets/script.lua",
    "roles/application_nginx/defaults/main.yml",
    "roles/application_nginx/templates/compose.yml.j2",
    "assets/routes.requested.json.j2",
    "assets/prepare-routes.sh"
  ],
  "render": {
    "compose_template": "roles/application_nginx/templates/compose.yml.j2"
  },
  "scripts": [
    {
      "id": "prepare-routes",
      "source": "assets/prepare-routes.sh",
      "phase": "before_start",
      "execution": "each_target",
      "argv": [
        {
          "valueFrom": "projectId"
        },
        {
          "valueFrom": "libraryId"
        },
        {
          "valueFrom": "applicationId"
        },
        {
          "valueFrom": "targetHostId"
        }
      ]
    },
    {
      "id": "integrate-routes",
      "source": "assets/prepare-routes.sh",
      "phase": "integration_apply",
      "execution": "each_target",
      "argv": [
        {
          "valueFrom": "projectId"
        },
        {
          "valueFrom": "libraryId"
        },
        {
          "valueFrom": "applicationId"
        },
        {
          "valueFrom": "targetHostId"
        },
        {
          "valueFrom": "integration_consumers"
        }
      ]
    }
  ]
}
