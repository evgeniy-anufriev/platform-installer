pcre_jit on;
error_log /dev/stdout warn;
pid /tmp/nginx.pid;

# load dynamic nginx modules
include /etc/nginx/modules-enabled.d/*.conf;

events {
    worker_connections 4000;
}

http {
    log_format custom_debug '$remote_addr - $remote_user [$time_local] ' '"$request" $status $body_bytes_sent ' '"$http_referer" "$http_user_agent" ' 'rt=$request_time ' 'ua="$upstream_addr" us="$upstream_status" ' 'ut="$upstream_response_time" ' '' 'scheme=$scheme ' 'host=$host ' 'xff="$http_x_forwarded_for" ' 'req_id="$request_id"';

    include /usr/local/openresty/nginx/conf/mime.types;

    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    include /etc/nginx/conf.d/*.conf;
    lua_package_path '/etc/nginx/lib/lua/?.lua;/etc/nginx/lib/lua/?/init.lua;;';
    lua_package_cpath '/etc/nginx/lib/clib/?.so;;';
    resolver 127.0.0.11;
    lua_shared_dict discovery 10m;
    lua_shared_dict jwks 10m;
    lua_ssl_trusted_certificate /etc/nginx/ssl/ca-chain.pem;
    lua_ssl_verify_depth 10; #указывается глубина вложености цепочки сертефикатов

    client_body_temp_path /var/tmp/nginx-client-body;
    proxy_temp_path       /var/tmp/nginx-proxy;
    fastcgi_temp_path     /var/tmp/nginx-fastcgi;
    uwsgi_temp_path       /var/tmp/nginx-uwsgi;
    scgi_temp_path        /var/tmp/nginx-scgi;
    server {
        listen {{ application_runtime_job.settings.ports['port-1'].container }} ssl default_server;
        ssl_certificate /etc/nginx/ssl/host.pem;
        ssl_certificate_key /etc/nginx/ssl/host.key;
        server_name {{ application_instance_id }}.{{ platform_desired_state.endpointGroups[platform_desired_state.applicationLibraryDeployments[application_runtime_job.libraryId].applications[application_runtime_job.slotId].overrides.endpoint.endpoint_group].address.domain }};

        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
        client_body_buffer_size 32k;
        client_header_buffer_size 32k;
        large_client_header_buffers 32 160k;

        error_log /dev/stdout warn;
#        access_log /dev/stdout custom_debug;

        expires           0;
        add_header        Cache-Control private;

        location /server-status {
            stub_status on;
        }

        location ^~ / {
        #   Чек Листы
        #   otel_trace on;
        #   otel_trace_context propagate;

            charset UTF-8;
            access_by_lua_file /etc/nginx/conf.d/script.lua;

            set $session_cookie_lifetime 45000;
            set $session_cookie_renew 45000;
            set $user_fullname  ngx.var.user_fullname;
            set $user_groups  ngx.var.user_groups;
            set $user_id  ngx.var.user_id;
            set $user_login  ngx.var.user_login;
            set $user_ip  ngx.var.user_ip;
            set $new_request  ngx.var.new_request;
            set $new_url  ngx.var.new_url;
            set $allow_patterns  ngx.var.allow_patterns;
            set $forbidden_patterns  ngx.var.forbidden_patterns;
            set $x_timeout_session     ngx.var.x_timeout_session;
            set $cp_uri     ngx.var.cp_uri;
            set $previous_auth ngx.var.previous_auth;
            set $password_exp ngx.var.password_exp;
            set $security_signature ngx.var.security_signature;
            set $nginx_url ngx.var.nginx_url;
            set $system_is_recovery  ngx.var.system_is_recovery;
            set $visibility_zone  ngx.var.visibility_zone;
            set $canary  ngx.var.canary;

            proxy_pass $new_url$new_request;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_method $request_method;
            proxy_pass_request_body on;
            proxy_set_header  X-Real-IP $remote_addr;
            proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Content-Type      $content_type;
            proxy_set_header  X-USER-FULLNAME   $user_fullname;
            proxy_set_header  X-USER-GROUPS     $user_groups;
            proxy_set_header  X-USER-ID         $user_id;
            proxy_set_header  X-USER-LOGIN      $user_login;
            proxy_set_header  X-USER-IP         $user_ip;
            proxy_set_header  X-USER-ALLOW-PATTERNS     $allow_patterns;
            proxy_set_header  X-USER-FORBIDDEN-PATTERNS $forbidden_patterns;
            proxy_set_header  X-TIMEOUT-SESSION $x_timeout_session;
            proxy_set_header  X-CP-URI $cp_uri;
            proxy_set_header  X-USER-PREVIOUS_AUTH $previous_auth;
            proxy_set_header  X-USER-PASSWORD_EXP $password_exp;
            proxy_set_header  X-SECURITY-SIGNATURE $security_signature;
            proxy_set_header  X-NGINX-URI $nginx_url;
            proxy_set_header  SYSTEM_IS_RECOVERY $system_is_recovery;
            proxy_set_header  X-Visibility-Zone $visibility_zone;
            proxy_set_header  X-SECURITY-CANARY $canary;

            add_header Set-Cookie Max-Age=60;
            add_header X-USER-PREVIOUS_AUTH $previous_auth;
            add_header X-USER-PASSWORD_EXP $password_exp;
            add_header X-TIMEOUT-SESSION   $x_timeout_session;
            add_header X-CP-URI   $cp_uri;
            add_header X-USER-FULLNAME   $user_fullname;
            add_header X-USER-GROUPS  $user_groups;
            add_header X-USER-ID  $user_id;
            add_header X-USER-LOGIN  $user_login;
            add_header X-USER-IP  $user_ip;
            add_header X-USER-ALLOW-PATTERNS  $allow_patterns;
            add_header X-USER-FORBIDDEN-PATTERNS $forbidden_patterns;
            add_header X-NGINX-URI $nginx_url;
            add_header SYSTEM_IS_RECOVERY   $system_is_recovery;
            add_header X-SECURITY-SIGNATURE $security_signature;
            add_header X-Visibility-Zone $visibility_zone;
            add_header X-SECURITY-CANARY $canary;
        }

        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
    }
}

