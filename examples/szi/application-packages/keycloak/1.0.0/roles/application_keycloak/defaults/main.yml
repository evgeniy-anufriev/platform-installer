platform_application_definition:
  name: keycloak
  version: 1.0.0
  defaults:
    image: evoscada-docker.artifacts.tn.tngrp.ru/alt/c10f/keycloak:26.4.0-05082026-1220-92d3b787-vault
    user: "1000:1000"
    restart: always
    accounts:
      postgres:
        credentials:
          password:
            source:
              kind: runtime_secret_ref
              ref: '{{ application_instance_id }}-postgres-password'
          username:
            source:
              kind: literal
              value: szi_keycloak
        databaseAccess:
          - databaseRef: keycloak-db
            privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE]
        mode: managed
    command:
      - /usr/lib/keycloak/bin/kc.sh
      - start
    config_files:
      - source: assets/conf/cache-ispn.xml
        destination: conf/cache-ispn.xml
        mode: "0644"
    config_directories:
      - source: assets/providers
        destination: providers
        file_mode: "0644"
        directory_mode: "0755"
    config_archives:
      - source: assets/themes.tar.gz
        format: tar.gz
        destination: themes
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx1g"
      KC_SPI_EVENTS_LISTENER_PASSWORD_EXPIRE_REMINDER_EXPIRE_THRESHOLD: "14"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY: edge
      KC_DB: postgres
      KC_DB_URL_DATABASE: "{{ application_databases.postgres['keycloak-db'].name }}"
      KC_DB_URL: "jdbc:postgresql://$${POSTGRES_ADDRESS}/{{ application_databases.postgres['keycloak-db'].name }}?targetServerType=primary&hostRecheckSeconds=2&sslmode=verify-ca&sslrootcert=/opt/application/pki/ca-chain.pem"
      KC_HOSTNAME_STRICT: "false"
      JGROUPS_DISCOVERY_PROTOCOL: TCPPING
      JGROUPS_DISCOVERY_EXTERNAL_IP: '{{ application_parameters.KEYCLOAK_DISCOVERY_IP | default(undef(hint=''Configure Keycloak discovery address''), true) }}'
      KC_HTTPS_KEY_STORE_FILE: /opt/application/pki/keystore.p12
      KC_HTTPS_KEY_STORE_TYPE: PKCS12
      KC_HTTPS_PORT: "8051"
      KC_LOG_LEVEL: INFO
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 1s
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_PROVISION_HOST: '{{ application_parameters.DMZ_PROVISION_URL | default(undef(hint=''Configure DMZ provisioning endpoint''), true) }}'
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_REALM_PARTIAL_IMPORT_RESOURCE: /realm-partial-import
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_REALM_RESOURCE: /realms
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_CLIENT_RESOURCE: /clients
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_CLIENT_SCOPE_RESOURCE: /scopes
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_GROUP_RESOURCE: /groups
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_ROLE_RESOURCE: /roles
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_USER_RESOURCE: /users
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_PROTECTED_USER_NAMES: '{{ application_parameters.PROTECTED_USER_NAMES | default(undef(hint=''Configure protected Keycloak users''), true) }}'
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_EXPORT_INTERVAL_MILLIS: "359900"
      KC_SPI_EVENTS_LISTENER_DMZ_PROVISION_USERS_EXPORT_INTERVAL_MILLIS: "1500000"
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: DEBUG
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_ERROR_LEVEL: DEBUG
      KC_PROXY_HEADERS: xforwarded
      KC_SPI_STICKY_SESSION_ENCODER_INFINISPAN_NODE_NAME: '{{ application_parameters.KEYCLOAK_NODE_NAME | default(undef(hint=''Configure Keycloak cluster node name''), true) }}'
      KC_TRUSTSTORE_PATHS: /opt/application/pki/ca-chain.pem
      KC_CACHE_CONFIG_MUTATE: "true"
      KC_CACHE: ispn
      KC_CACHE_STACK: jdbc-ping
      KC_EXTERNAL_ADDR: '{{ application_parameters.KEYCLOAK_DISCOVERY_IP | default(undef(hint=''Configure Keycloak discovery address''), true) }}'
      KC_BIND_ADDR: '{{ application_parameters.KEYCLOAK_BIND_IP | default(undef(hint=''Configure Keycloak bind address''), true) }}'
      KC_BIND_PORT: "7800"
      KC_INITIAL_HOSTS: '{{ application_parameters.KEYCLOAK_INITIAL_HOSTS | default(undef(hint=''Configure Keycloak cluster members''), true) }}'
      JDK_JAVA_OPTIONS: '-Djgroups.bind.address=global -Djgroups.external_addr={{ application_parameters.KEYCLOAK_DISCOVERY_IP | default(undef(hint=''Configure Keycloak discovery address''), true) }} -Djgroups.bind.port=7800 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:InitiatingHeapOccupancyPercent=45 -XX:+ExitOnOutOfMemoryError'
    parameters:
      KEYCLOAK_MEMORY_LIMIT: 2G
      KEYCLOAK_DISCOVERY_IP: ""
      KEYCLOAK_BIND_IP: ""
      KEYCLOAK_INITIAL_HOSTS: ""
      KEYCLOAK_NODE_NAME: ""
      DMZ_PROVISION_URL: ""
      PROTECTED_USER_NAMES: ""
    ports:
      port-1:
        container: 8051
        published: 10411
      port-2:
        container: 7800
        published: 7800
      port-3:
        container: 8080
        published: 8090
      port-4:
        container: 57800
        published: 57800
      port-5:
        container: 9000
        published: 9000
    endpoint:
      enabled: false
      listener: port-1
      protocol: https
      probe:
        path: /realms/master/.well-known/openid-configuration
        expected_status: 200
        timeout: 10
    readiness:
      mode: healthcheck
      delay: 5
      retries: 60
    provisioner:
      type: vault-agent
      mode: process-supervisor
      auth:
        method: approle
      approle:
        bind_secret_id: false
      secrets:
        mount: secret
      secret_bindings:
        KC_HTTPS_KEY_STORE_PASSWORD:
          source: {library_secret: java_keystore_password}
        KC_DB_USERNAME:
          source: {account: postgres, field: username}
        KC_DB_PASSWORD:
          source: {account: postgres, field: password}
  connections: [postgres, vault]
