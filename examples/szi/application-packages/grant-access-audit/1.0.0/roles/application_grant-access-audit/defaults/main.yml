platform_application_definition:
  name: grant-access-audit
  version: 1.0.0
  defaults:
    connections:
      sso: {enabled: true}
    image: evoscada-docker.artifacts.tn.tngrp.ru/grant-access-audit:2.0.5-6-20260908-1640-da1ca55a-redos
    user: "1000:1000"
    restart: always
    accounts:
      sso:
        mode: managed
        parameters:
          groups: [ТУЗ]
          roles_file: "{{ lookup('ansible.builtin.file', (application_job.application.defaultsPath | dirname) ~ '/../../../assets/account-roles/admin-grant-access-audit.json') | from_json }}"
        credentials:
          username:
            source: {kind: literal, value: admin-grant-access-audit}
          password:
            source: {kind: runtime_secret_ref, ref: grant-access-audit-user-password}
      postgres:
        mode: managed
        credentials:
          username:
            source: {kind: literal, value: szi_audit}
          password:
            source: {kind: runtime_secret_ref, ref: grant-access-audit-postgres-password}
        databaseAccess:
          - databaseRef: audit-db
            privileges: [SELECT, INSERT, UPDATE, DELETE, CREATE]
    command:
      - java
      - -XX:+ExitOnOutOfMemoryError
      - -Dhazelcast.rest.enabled=true
      - -Xmx6096M
      - -jar
      - grant-access-audit.jar
    environment:
      TZ: Europe/Moscow
      WEB_SERVER_PORT: >-
        {{ ((application_job.application.definition.defaults.ports | default({})) |
            combine(application_job.slot.overrides.ports | default({}), recursive=true) |
            combine(application_job.instance.overrides.ports | default({}), recursive=true) |
            combine(application_job.hostOverride.ports | default({}), recursive=true))['port-1'].container }}
      proxyUrl: '{{ application_connections.sso.parameters.proxy_url }}'
      audit.keycloak.clientId: admin-cli
      audit.keycloak.host: '{{ application_connections.sso.url }}'
      audit.keycloak.realm: '{{ application_connections.sso.parameters.realm }}'
      DB_CONNECTION_STRING: "jdbc:postgresql://$${POSTGRES_ADDRESS}/{{ application_databases.postgres['audit-db'].name }}?targetServerType=primary&hostRecheckSeconds=2&sslmode=verify-ca&sslrootcert=/usr/local/app/ca.pem"
      SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: "48000"
    parameters:
      IDENTITY_CLIENT: "{{ lookup('ansible.builtin.template', (application_job.application.defaultsPath | dirname) ~ '/../../../assets/keycloak-client.json.j2', convert_data=false) | from_json }}"
    ports:
      port-1:
        container: 8031
        published: 8031
    readiness:
      mode: healthcheck
      delay: 2
      retries: 30
    provisioner:
      type: vault-agent
      mode: process-supervisor
      auth:
        method: approle
      approle:
        bind_secret_id: false
      secrets: {mount: secret}
      secret_bindings:
        audit.keycloak.userName:
          source: {account: sso, field: username}
        audit.keycloak.userPass:
          source: {account: sso, field: password}
        DB_USERNAME:
          source: {account: postgres, field: username}
        DB_PASSWORD:
          source: {account: postgres, field: password}
  connections: [postgres, vault, sso]
