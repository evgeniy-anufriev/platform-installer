all:
  hosts:
    localhost: {ansible_connection: local}
    node1:
      ansible_host: 192.168.56.101
      ansible_connection: local
      platform_deployments:
        bind-main: {roles: [primary]}
        keepalived-a: {priority: 150}
        haproxy-a: {hostEndpoint: true}
        postgres-ha: {members: {monitor-1: {roles: [monitor]}}}
    node2:
      ansible_host: 192.168.56.102
      platform_deployments:
        bind-main: {roles: [secondary]}
        keepalived-a: {priority: 120}
        haproxy-a: {hostEndpoint: true}
        postgres-ha: {members: {data-1: {roles: [database]}}}
    node3:
      ansible_host: 192.168.56.103
      platform_deployments:
        bind-main: {roles: [secondary]}
        keepalived-a: {priority: 100}
        haproxy-a: {hostEndpoint: true}
        postgres-ha: {members: {data-2: {roles: [database]}}}
  children:
    platform_targets:
      hosts: {node1: {}, node2: {}, node3: {}}
