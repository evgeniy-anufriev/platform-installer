all:
  hosts:
    localhost: {ansible_connection: local}
    redos-node1:
      ansible_host: 192.0.2.11
      platform_deployments:
        kafka-main:
          members:
            kafka-1: {roles: [broker, controller], configuration: {nodeId: 1}}
            kafka-2: {roles: [broker, controller], configuration: {nodeId: 2, clientPort: 9192, controllerPort: 9193}}
            kafka-3: {roles: [broker, controller], configuration: {nodeId: 3, clientPort: 9292, controllerPort: 9293}}
  children:
    platform_targets:
      hosts:
        redos-node1: {}
