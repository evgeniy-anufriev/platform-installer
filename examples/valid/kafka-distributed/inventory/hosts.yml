            kafka-3: {roles: [broker, controller], configuration: {nodeId: 3, listeners: {PLAINTEXT: {purpose: client, securityProtocol: PLAINTEXT, port: 9292}, SSL: {purpose: interBroker, securityProtocol: SSL, port: 9294}, CONTROLLER: {purpose: controller, securityProtocol: SSL, port: 9293}}}}
