platform_service_catalog_path: "{{ inventory_dir }}/../../../catalog/service-catalog.yml"
platform_kafka_artifact_path: "{{ inventory_dir }}/../../../../.runtime/artifacts/kafka/kafka_2.13-4.3.1.tgz"
platform_kafka_artifact_checksum: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
# The shared defaults use 9092-9094. This isolated QA fixture overrides only
# its listener ports so it cannot collide with an existing Kafka acceptance.
platform_kafka_listeners:
  PLAINTEXT:
    purpose: client
    securityProtocol: PLAINTEXT
    port: 19092
  SSL:
    purpose: interBroker
    securityProtocol: SSL
    port: 19094
  CONTROLLER:
    purpose: controller
    securityProtocol: SSL
    port: 19093
platform_desired_state:
  certificateAuthorities:
    platform-ca:
      mode: MANAGED
      commonName: Platform SSL test CA
  certificateProfiles:
    infrastructure:
      authorityRef: platform-ca
      sanPolicy: {}
  tlsProfiles:
    infrastructure-tls:
      certificateProfileRef: infrastructure
      storePasswordSecretRef: runtime:pki-store-password
  serviceDeployments:
    kafka-main:
      serviceType: kafka
      definitionVersion: 1.0.0-alpha.1
      mode: kraft-standalone
      configuration:
        quorumMode: dynamic
        dataDirectory: /var/lib/kafka/kafka-ssl-single
        logDirectory: /var/log/kafka/kafka-ssl-single
        configDirectory: /etc/kafka/kafka-ssl-single
        tlsProfile: infrastructure-tls
