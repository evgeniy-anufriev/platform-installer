# Managed by Platform Installer.
# This is standard Ansible YAML; formatting may be normalized.
platform_desired_state:
  endpointGroups:
    asutp-a:
      address: {domain: asutp.scada.local, wildcard: true}
  certificateAuthorities:
    platform-ca: {mode: MANAGED, commonName: Platform test CA}
  certificateProfiles:
    infrastructure:
      authorityRef: platform-ca
      sanPolicy: {includeEndpointWildcard: true}
  tlsProfiles:
    platform-tls: {certificateProfileRef: infrastructure, scope: HOST, storePasswordSecretRef: runtime:pki-store-password}
  serviceDeployments:
    bind-main:
      serviceType: bind
      mode: authoritative-primary-secondary
      configuration: {zone: scada.local, defaultTtl: 300}
    dns-client-main:
      serviceType: dns-client
      mode: host-resolver
      configuration: {dnsServerRef: bind-main}
    keepalived-a:
      serviceType: keepalived
      mode: vrrp-unicast
      endpointGroupRef: asutp-a
      virtualRouterId: 61
      virtualAddresses:
        - {address: 192.168.56.111, interface: enp0s8}
        - {address: 192.168.56.112, interface: enp0s8}
      configuration: {haproxyHealthTracking: {serviceDeploymentRef: haproxy-a}}
    haproxy-a:
      serviceType: haproxy
      mode: https-host-routing
      endpointGroup: asutp-a
      configuration: {tlsProfile: platform-tls}
    kafka-main:
      serviceType: kafka
      definitionVersion: 1.0.0-alpha.1
      mode: kraft-distributed
      configuration: {quorumMode: dynamic, runtimePathNamespace: kafka-main, tlsProfile: platform-tls}
    postgres-ha:
      serviceType: postgresql
      mode: pg_auto_failover
      endpointGroup: asutp-a
      configuration: {tlsProfile: platform-tls}
      haproxy:
        deploymentRef: haproxy-a
        backend: {balance: leastconn, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
