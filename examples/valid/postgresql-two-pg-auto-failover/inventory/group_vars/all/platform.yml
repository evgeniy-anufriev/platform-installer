platform_project_manifest_path: "{{ inventory_dir }}/../project.yml"
platform_service_catalog_path: "{{ inventory_dir }}/../../../catalog/service-catalog.yml"
platform_project:
  serviceDeployments:
    accounting-db:
      serviceType: postgresql
      definitionVersion: fixture-v1
      mode: pg_auto_failover
      configuration: {}
      members:
        monitor: {host: monitor-node, roles: [monitor]}
        database-1: {host: db-node1, roles: [database]}
        database-2: {host: db-node2, roles: [database]}
    telemetry-db:
      serviceType: postgresql
      definitionVersion: fixture-v1
      mode: pg_auto_failover
      configuration: {}
      members:
        monitor: {host: monitor-node, roles: [monitor]}
        database-1: {host: db-node3, roles: [database]}
        database-2: {host: db-node4, roles: [database]}
  endpointGroups: {}
  endpointBindings: {}
  certificateProfiles: {}
  certificateScopes: {}
  secretRequirements: {}
