{
  "platform_desired_state_contract": "platform.installer/project-desired-state/v3alpha1",
  "platform_desired_state": {
    "certificateAuthorities": {
      "apps-ca": {
        "mode": "MANAGED",
        "commonName": "Application QA CA"
      }
    },
    "certificateProfiles": {
      "apps-cert": {
        "authorityRef": "apps-ca",
        "usages": [
          "serverAuth",
          "clientAuth"
        ],
        "sanPolicy": {
          "includeEndpointWildcard": false
        }
      }
    },
    "tlsProfiles": {
      "apps-tls": {
        "certificateProfileRef": "apps-cert",
        "scope": "HOST",
        "storePasswordSecretRef": "runtime:pki-store-password"
      }
    },
    "serviceDeployments": {
      "docker": {
        "serviceType": "docker",
        "mode": "existing-user",
        "configuration": {
          "accountName": "platform-docker",
          "tlsProfile": "apps-tls"
        }
      },
      "postgres-sdku": {
        "serviceType": "postgresql",
        "mode": "standalone",
        "configuration": {
          "tlsProfile": "apps-tls",
          "adminSuperuser": {
            "username": "postgres",
            "passwordSecretRef": "runtime:pg-sdku-admin"
          }
        }
      },
      "postgres-cspa": {
        "serviceType": "postgresql",
        "mode": "standalone",
        "configuration": {
          "port": 5433,
          "tlsProfile": "apps-tls"
        }
      },
      "redis-main": {
        "serviceType": "redis",
        "mode": "standalone",
        "configuration": {
          "tlsProfile": "apps-tls",
          "redisCredential": {
            "passwordSecretRef": "runtime:redis-admin"
          }
        }
      },
      "clickhouse-main": {
        "serviceType": "clickhouse",
        "mode": "standalone",
        "configuration": {
          "tlsProfile": "apps-tls",
          "defaultCredential": {
            "passwordSecretRef": "runtime:ch-admin"
          }
        }
      },
      "vault-main": {
        "serviceType": "vault",
        "mode": "standalone",
        "configuration": {
          "tlsProfile": "apps-tls"
        }
      },
      "kafka-main": {
        "serviceType": "kafka",
        "mode": "kraft-standalone",
        "configuration": {
          "tlsProfile": "apps-tls",
          "listeners": {
            "PLAINTEXT": {
              "purpose": "client",
              "securityProtocol": "PLAINTEXT",
              "port": 9092
            },
            "SSL": {
              "purpose": "interBroker",
              "securityProtocol": "SSL",
              "port": 9094
            },
            "CONTROLLER": {
              "purpose": "controller",
              "securityProtocol": "SSL",
              "port": 9093
            },
            "CLIENT_SSL": {
              "purpose": "client",
              "securityProtocol": "SSL",
              "port": 9095
            }
          }
        }
      }
    },
    "applicationLibraryDeployments": {
      "sdku": {
        "libraryRef": "sdku@1.0.0",
        "runtimeRef": "docker",
        "bindings": {
          "database": {
            "deploymentRef": "postgres-sdku"
          },
          "secrets": {
            "deploymentRef": "vault-main"
          }
        },
        "resources": {
          "api-schema": {
            "binding": "database",
            "parameters": {
              "name": "api"
            },
            "databaseRef": "application-database",
            "mode": "managed",
            "kind": "postgresql.schema"
          },
          "application-database": {
            "binding": "database",
            "parameters": {
              "name": "sdku"
            },
            "mode": "managed",
            "kind": "postgresql.database"
          }
        },
        "applications": {
          "gateway": {
            "overrides": {
              "ports": {
                "http": {
                  "published": 18080,
                  "container": 10101
                }
              },
              "parameters": {
                "postgres": {
                  "password_ref": "sdku-apigateway-pg-password",
                  "user": "apigateway-sdku"
                }
              }
            }
          },
          "manager": {
            "overrides": {
              "ports": {
                "http": {
                  "published": 18081,
                  "container": 10101
                }
              },
              "parameters": {
                "postgres": {
                  "password_ref": "sdku-datamanager-pg-password",
                  "user": "datamanager-sdku"
                }
              }
            }
          }
        }
      }
    }
  }
}
