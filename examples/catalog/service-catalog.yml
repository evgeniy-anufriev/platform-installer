apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:a9be5f70160678411d89be76c48c4e014edab1803f44a7d7276723a5825e9cd3
definitions:
  clickhouse:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: clickhouse
      version: 1.0.0-alpha.1
      displayName: ClickHouse
      description: TLS-only ClickHouse standalone or one-shard Raft HA with paired Keeper members
      category: database
    modes:
      standalone:
        displayName: Standalone
        description: One ClickHouse server without Keeper
        memberRoles:
        - server
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            server:
              minimum: 1
              maximum: 1
        x-requiredRuntimeSecretSettings:
        - defaultCredential
      raft-ha:
        displayName: Raft HA
        description: One shard with three replicas, each paired with a Keeper voter
        memberRoles:
        - server
        - keeper
        placement:
          explicit: true
          minMembers: 3
          maxMembers: 3
          distinctHosts: false
          roleCardinality:
            server:
              minimum: 3
              maximum: 3
            keeper:
              minimum: 3
              maximum: 3
        x-requiredRuntimeSecretSettings:
        - defaultCredential
    listeners:
      client:
        protocol: https
        defaultPort: 8443
        tlsCapable: true
        scope: member
      native:
        protocol: tcp
        defaultPort: 9440
        tlsCapable: true
        scope: member
      interserver:
        protocol: https
        defaultPort: 9010
        tlsCapable: true
        scope: member
      keeper-client:
        protocol: tcp
        defaultPort: 9281
        tlsCapable: true
        scope: member
      keeper-raft:
        protocol: tcp
        defaultPort: 9444
        tlsCapable: true
        scope: member
    endpoint: {}
    x-backendClientListener:
      listener: client
      allocation:
        kind: HOST_LOCAL_ORDINAL
        stride: 1
    capabilities:
    - service.clickhouse.https
    - service.clickhouse.keeper
    dependencies: []
    configurationSchema:
      $ref: ../../services/clickhouse/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_clickhouse_tls_profile
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: TLS profile
            section: TLS
            order: 10
            x-referenceKind: TLS_PROFILE
        port:
          kind: MANAGED
          roleVariable: platform_clickhouse_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: HTTPS port
            section: Network
            order: 20
        nativePort:
          kind: MANAGED
          roleVariable: platform_clickhouse_native_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Secure native TCP base port
            section: Network
            order: 21
        interserverPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_interserver_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Interserver HTTPS base port
            section: Network
            order: 22
        keeperClientPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_keeper_client_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Keeper secure client base port
            section: Network
            order: 23
        keeperRaftPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_keeper_raft_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Keeper Raft base port
            section: Network
            order: 24
        defaultCredential:
          kind: MANAGED
          roleVariable: platform_clickhouse_default_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Default user password
            section: Credentials
            order: 40
            x-runtimeSecretRequirement:
              requirementRef: clickhouse-default-password
              purpose: SERVICE_PASSWORD
    roleEntrypoints:
      apply:
        fqcn: platform.clickhouse.clickhouse_tls
        variablesPrefix: platform_clickhouse_
        x-memberListVariable: platform_clickhouse_instances
      verify:
        fqcn: platform.clickhouse.clickhouse_tls
        variablesPrefix: platform_clickhouse_
        x-memberListVariable: platform_clickhouse_instances
    artifacts:
    - id: clickhouse-common-static
      name: clickhouse-common-static
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:b98cfaa7e82a563c0a21276c3dd0a637bf8976f1b65bd7a71f1d625f231954e9
      requiredOffline: true
    - id: clickhouse-server
      name: clickhouse-server
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:3d72d3e909f4dcca5378faeb7d3dd9fbf0741038f7309ff87965fe0efb70e4ee
      requiredOffline: true
    - id: clickhouse-client
      name: clickhouse-client
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:796874f358d73b96ff8bf04c5aabbf474ea020303eb7d113f1009961739e41c7
      requiredOffline: true
    compatibilityRef: ../../services/clickhouse/compatibility.yml
    x-definitionDigest: sha256:6c5ac232bfd2d4553e72ddce0438f9d3a5a3931112489131834dab47b3a42f1b
    x-sourceManifest: services/clickhouse/service.yml
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.1
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: implemented-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        quorumMode:
          kind: MANAGED
          roleVariable: platform_kafka_quorum_mode
          type: string
          scopes:
          - deployment
          validation:
            enum:
            - dynamic
            - static
          ui:
            label: KRaft quorum mode
            order: 5
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_kafka_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka TLS profile
            order: 22
            x-referenceKind: TLS_PROFILE
        listeners:
          kind: MANAGED
          roleVariable: platform_kafka_listeners
          type: object
          scopes:
          - deployment
          - member
          validation:
            minProperties: 1
          schema:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - purpose
              - securityProtocol
              - port
              properties:
                purpose:
                  type: string
                  enum:
                  - client
                  - interBroker
                  - controller
                securityProtocol:
                  type: string
                  enum:
                  - PLAINTEXT
                  - SSL
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                bindAddress:
                  type: string
                  minLength: 1
                advertisedAddress:
                  type: string
                  minLength: 1
          ui:
            label: Named Kafka listeners
            order: 15
        nodeId:
          kind: MANAGED
          roleVariable: platform_kafka_node_id
          type: integer
          scopes:
          - member
          validation:
            minimum: 0
            maximum: 2147483647
          ui:
            label: Node ID
            order: 25
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            order: 30
        runtimePathNamespace:
          kind: MANAGED
          roleVariable: platform_kafka_runtime_path_namespace
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: Runtime path namespace
            order: 31
        logDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_log_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka log directory
            order: 32
        configDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka config directory
            order: 33
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    x-reservedAdvancedProperties:
    - node.id
    - process.roles
    - listeners
    - advertised.listeners
    - controller.listener.names
    - controller.quorum.voters
    - controller.quorum.bootstrap.servers
    - log.dirs
    - listener.security.protocol.map
    - inter.broker.listener.name
    - listener.name.*.ssl.keystore.location
    - listener.name.*.ssl.truststore.location
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: kafka-binary
      name: kafka
      version: 4.3.1
      os: redos
      architecture: x86_64
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    runtimeRequirements:
    - id: kafka-java
      name: java-21-openjdk-headless
      version: ''
      os: redos
      architecture: x86_64
      requiredOffline: false
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: implemented-service-02a
    x-definitionDigest: sha256:570fdeed0430a2b2ec1aefcdea7c5b88e39dd17b6b68ad3a7d713d3e8e7b2158
    x-sourceManifest: services/kafka/service.yml
