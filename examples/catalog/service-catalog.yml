apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:3aee454c6a3a2ce196636d55f1b336c0744e73b6f70596bc5a979b0566af2d99
definitions:
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.1
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: planned-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: true
      settings:
        clientPort:
          kind: MANAGED
          roleVariable: platform_kafka_client_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Client port
            order: 10
        controllerPort:
          kind: MANAGED
          roleVariable: platform_kafka_controller_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Controller port
            order: 20
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            order: 30
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: kafka-binary
      version: 4.3.1
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: deferred
    x-definitionDigest: sha256:fe128ff91c1dea0762be0d90c4097464a6c83cdee03f7d319d896493947c4606
    x-sourceManifest: services/kafka/service.yml
  postgresql:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: postgresql
      version: fixture-v1
      displayName: PostgreSQL
      description: Contract-conformance definition; no production role is included
      category: database
    modes:
      standalone:
        displayName: Standalone
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
      patroni:
        displayName: Patroni
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
      pg_auto_failover:
        displayName: pg_auto_failover
        memberRoles:
        - database
        - monitor
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
    listeners:
      client:
        protocol: tcp
        defaultPort: 5432
        tlsCapable: true
        scope: deployment
    capabilities:
    - service.postgresql.client
    dependencies: []
    configurationSchema:
      $ref: fixtures/postgresql.configuration.schema.json
    roleEntrypoints:
      apply:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
      verify:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
    artifacts: []
    x-conformanceOnly: true
    x-definitionDigest: sha256:2efe3a392cec66ca627fa86a1f2cba1c9013838d9f75d3939fcd646b3ea3a849
    x-sourceManifest: examples/catalog/manifests/postgresql.yml
  etcd:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: etcd
      version: fixture-v1
      displayName: etcd
      description: Contract-conformance DCS dependency definition
      category: coordination
    modes:
      cluster:
        displayName: Cluster
        memberRoles:
        - member
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
    listeners:
      client:
        protocol: tcp
        defaultPort: 2379
        tlsCapable: true
        scope: deployment
    capabilities:
    - dcs
    dependencies: []
    configurationSchema:
      $ref: fixtures/etcd.configuration.schema.json
    roleEntrypoints:
      apply:
        fqcn: platform.etcd.etcd
        variablesPrefix: platform_etcd_
      verify:
        fqcn: platform.etcd.etcd
        variablesPrefix: platform_etcd_
    artifacts: []
    x-conformanceOnly: true
    x-definitionDigest: sha256:3cb015e5af12cb6b27b6264a61dd903c4327dc9b3aec5ec22cc2c6bb960a90d0
    x-sourceManifest: examples/catalog/manifests/etcd.yml
