apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:2fd24dda374aa885bb54072515003351bf610d6a36ba670ac0869a9580cb455b
definitions:
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.1
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: implemented-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        quorumMode:
          kind: MANAGED
          roleVariable: platform_kafka_quorum_mode
          type: string
          scopes:
          - deployment
          validation:
            enum:
            - dynamic
            - static
          ui:
            label: KRaft quorum mode
            order: 5
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_kafka_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka TLS profile
            order: 22
        listeners:
          kind: MANAGED
          roleVariable: platform_kafka_listeners
          type: object
          scopes:
          - deployment
          - member
          validation:
            minProperties: 1
          schema:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - purpose
              - securityProtocol
              - port
              properties:
                purpose:
                  type: string
                  enum:
                  - client
                  - interBroker
                  - controller
                securityProtocol:
                  type: string
                  enum:
                  - PLAINTEXT
                  - SSL
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                bindAddress:
                  type: string
                  minLength: 1
                advertisedAddress:
                  type: string
                  minLength: 1
          ui:
            label: Named Kafka listeners
            order: 15
        nodeId:
          kind: MANAGED
          roleVariable: platform_kafka_node_id
          type: integer
          scopes:
          - member
          validation:
            minimum: 0
            maximum: 2147483647
          ui:
            label: Node ID
            order: 25
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            order: 30
        runtimePathNamespace:
          kind: MANAGED
          roleVariable: platform_kafka_runtime_path_namespace
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: Runtime path namespace
            order: 31
        logDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_log_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka log directory
            order: 32
        configDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka config directory
            order: 33
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    x-reservedAdvancedProperties:
    - node.id
    - process.roles
    - listeners
    - advertised.listeners
    - controller.listener.names
    - controller.quorum.voters
    - controller.quorum.bootstrap.servers
    - log.dirs
    - listener.security.protocol.map
    - inter.broker.listener.name
    - listener.name.*.ssl.keystore.location
    - listener.name.*.ssl.truststore.location
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: kafka-binary
      version: 4.3.1
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: implemented-service-02a
    x-definitionDigest: sha256:dc6d284a8e7814d42ead3055e75f778abb1dff94e389375e5221cf823f9a12cc
    x-sourceManifest: services/kafka/service.yml
  postgresql:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: postgresql
      version: fixture-v1
      displayName: PostgreSQL
      description: Contract-conformance definition; no production role is included
      category: database
    modes:
      standalone:
        displayName: Standalone
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
      patroni:
        displayName: Patroni
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
      pg_auto_failover:
        displayName: pg_auto_failover
        memberRoles:
        - database
        - monitor
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
    listeners:
      client:
        protocol: tcp
        defaultPort: 5432
        tlsCapable: true
        scope: deployment
    capabilities:
    - service.postgresql.client
    dependencies: []
    configurationSchema:
      $ref: fixtures/postgresql.configuration.schema.json
    roleEntrypoints:
      apply:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
      verify:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
    artifacts: []
    x-conformanceOnly: true
    x-definitionDigest: sha256:2efe3a392cec66ca627fa86a1f2cba1c9013838d9f75d3939fcd646b3ea3a849
    x-sourceManifest: examples/catalog/manifests/postgresql.yml
  etcd:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: etcd
      version: fixture-v1
      displayName: etcd
      description: Contract-conformance DCS dependency definition
      category: coordination
    modes:
      cluster:
        displayName: Cluster
        memberRoles:
        - member
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
    listeners:
      client:
        protocol: tcp
        defaultPort: 2379
        tlsCapable: true
        scope: deployment
    capabilities:
    - dcs
    dependencies: []
    configurationSchema:
      $ref: fixtures/etcd.configuration.schema.json
    roleEntrypoints:
      apply:
        fqcn: platform.etcd.etcd
        variablesPrefix: platform_etcd_
      verify:
        fqcn: platform.etcd.etcd
        variablesPrefix: platform_etcd_
    artifacts: []
    x-conformanceOnly: true
    x-definitionDigest: sha256:3cb015e5af12cb6b27b6264a61dd903c4327dc9b3aec5ec22cc2c6bb960a90d0
    x-sourceManifest: examples/catalog/manifests/etcd.yml
