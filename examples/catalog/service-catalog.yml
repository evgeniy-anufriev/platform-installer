apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:08c0db299313f33292a0f69b9ab5a180e1853ccbbd1821aca167140a98cb7b75
definitions:
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.1
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: implemented-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        quorumMode:
          kind: MANAGED
          roleVariable: platform_kafka_quorum_mode
          type: string
          scopes:
          - deployment
          validation:
            enum:
            - dynamic
            - static
          ui:
            label: KRaft quorum mode
            order: 5
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_kafka_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka TLS profile
            order: 22
            x-referenceKind: TLS_PROFILE
        listeners:
          kind: MANAGED
          roleVariable: platform_kafka_listeners
          type: object
          scopes:
          - deployment
          - member
          validation:
            minProperties: 1
          schema:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - purpose
              - securityProtocol
              - port
              properties:
                purpose:
                  type: string
                  enum:
                  - client
                  - interBroker
                  - controller
                securityProtocol:
                  type: string
                  enum:
                  - PLAINTEXT
                  - SSL
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                bindAddress:
                  type: string
                  minLength: 1
                advertisedAddress:
                  type: string
                  minLength: 1
          ui:
            label: Named Kafka listeners
            order: 15
        nodeId:
          kind: MANAGED
          roleVariable: platform_kafka_node_id
          type: integer
          scopes:
          - member
          validation:
            minimum: 0
            maximum: 2147483647
          ui:
            label: Node ID
            order: 25
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            order: 30
        runtimePathNamespace:
          kind: MANAGED
          roleVariable: platform_kafka_runtime_path_namespace
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: Runtime path namespace
            order: 31
        logDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_log_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka log directory
            order: 32
        configDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka config directory
            order: 33
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    x-reservedAdvancedProperties:
    - node.id
    - process.roles
    - listeners
    - advertised.listeners
    - controller.listener.names
    - controller.quorum.voters
    - controller.quorum.bootstrap.servers
    - log.dirs
    - listener.security.protocol.map
    - inter.broker.listener.name
    - listener.name.*.ssl.keystore.location
    - listener.name.*.ssl.truststore.location
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: kafka-binary
      name: kafka
      version: 4.3.1
      os: redos
      architecture: x86_64
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    runtimeRequirements:
    - id: kafka-java
      name: java-21-openjdk-headless
      version: ''
      os: redos
      architecture: x86_64
      requiredOffline: false
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: implemented-service-02a
    x-definitionDigest: sha256:570fdeed0430a2b2ec1aefcdea7c5b88e39dd17b6b68ad3a7d713d3e8e7b2158
    x-sourceManifest: services/kafka/service.yml
  postgresql:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: postgresql
      version: 1.0.0-alpha.1
      displayName: PostgreSQL
      description: PostgreSQL 16 with standalone and pg_auto_failover modes
      category: database
    modes:
      standalone:
        displayName: Standalone
        description: One PostgreSQL data member
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
        x-maturity: implemented-postgres-01a
      pg_auto_failover:
        displayName: pg_auto_failover
        description: One monitor and two PostgreSQL data members
        memberRoles:
        - monitor
        - database
        placement:
          explicit: true
          minMembers: 3
          maxMembers: 3
          distinctHosts: true
          roleCardinality:
            monitor:
              minimum: 1
              maximum: 1
            database:
              minimum: 2
              maximum: 2
        x-maturity: implemented-postgres-01b
      patroni:
        displayName: Patroni
        description: Deferred compatibility fixture; not implemented by POSTGRES-01
