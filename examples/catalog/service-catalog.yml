apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:417be4b10a4dfc81352af03149cd562201a63f46a9a582e9c5adfc17051f3223
definitions:
  clickhouse:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: clickhouse
      version: 1.0.0-alpha.1
      displayName: ClickHouse
      description: TLS-only ClickHouse standalone or one-shard Raft HA with paired Keeper members
      category: database
    modes:
      standalone:
        displayName: Standalone
        description: One ClickHouse server without Keeper
        memberRoles:
        - server
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            server:
              minimum: 1
              maximum: 1
        x-requiredRuntimeSecretSettings:
        - defaultCredential
      raft-ha:
        displayName: Raft HA
        description: One shard with three replicas, each paired with a Keeper voter
        memberRoles:
        - server
        - keeper
        placement:
          explicit: true
          minMembers: 3
          maxMembers: 3
          distinctHosts: false
          roleCardinality:
            server:
              minimum: 3
              maximum: 3
            keeper:
              minimum: 3
              maximum: 3
        x-requiredRuntimeSecretSettings:
        - defaultCredential
    listeners:
      client:
        protocol: https
        defaultPort: 8443
        tlsCapable: true
        scope: member
      native:
        protocol: tcp
        defaultPort: 9440
        tlsCapable: true
        scope: member
      interserver:
        protocol: https
        defaultPort: 9010
        tlsCapable: true
        scope: member
      keeper-client:
        protocol: tcp
        defaultPort: 9281
        tlsCapable: true
        scope: member
      keeper-raft:
        protocol: tcp
        defaultPort: 9444
        tlsCapable: true
        scope: member
    endpoint: {}
    x-haproxyBackendDefaults:
      balance: roundrobin
      check: true
      fall: 3
      rise: 2
      ssl: true
      sslVerify: required
    x-backendClientListener:
      listener: client
      allocation:
        kind: HOST_LOCAL_ORDINAL
        stride: 1
    capabilities:
    - service.clickhouse.https
    - service.clickhouse.keeper
    - service.clickhouse.database
    - service.clickhouse.account
    dependencies: []
    configurationSchema:
      $ref: ../../services/clickhouse/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_clickhouse_tls_profile
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: TLS profile
            section: TLS
            order: 10
            x-referenceKind: TLS_PROFILE
        port:
          kind: MANAGED
          roleVariable: platform_clickhouse_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: HTTPS port
            section: Network
            order: 20
        nativePort:
          kind: MANAGED
          roleVariable: platform_clickhouse_native_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Secure native TCP base port
            section: Network
            order: 21
        interserverPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_interserver_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Interserver HTTPS base port
            section: Network
            order: 22
        keeperClientPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_keeper_client_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Keeper secure client base port
            section: Network
            order: 23
        keeperRaftPort:
          kind: MANAGED
          roleVariable: platform_clickhouse_keeper_raft_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Keeper Raft base port
            section: Network
            order: 24
        dataRoot:
          kind: MANAGED
          roleVariable: platform_clickhouse_data_root
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
            maxLength: 255
          ui:
            label: Каталог данных
            section: Хранение
            order: 0
            description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких
              участников на одном сервере создаются отдельные подкаталоги. Существующие данные автоматически
              не переносятся.
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_clickhouse_member_data_directory
          type: string
          scopes:
          - member
          validation:
            minLength: 1
            maxLength: 255
          ui:
            label: Каталог данных участника
            section: Хранение
            order: 0
            description: Абсолютный путь на сервере; переопределяет каталог данных только этого участника.
        defaultCredential:
          kind: MANAGED
          roleVariable: platform_clickhouse_default_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Default user password
            section: Credentials
            order: 40
            x-runtimeSecretRequirement:
              requirementRef: clickhouse-default-password
              purpose: SERVICE_PASSWORD
    x-memberDataDirectorySetting: dataDirectory
    x-dataDirectoryProjection:
      deploymentSetting: dataRoot
      memberSetting: dataDirectory
      rootVariable: platform_data_root_directory
      appendMemberIdWhenCoLocated: true
    roleEntrypoints:
      apply:
        fqcn: platform.clickhouse.clickhouse_tls
        variablesPrefix: platform_clickhouse_
        x-memberListVariable: platform_clickhouse_instances
      verify:
        fqcn: platform.clickhouse.clickhouse_tls
        variablesPrefix: platform_clickhouse_
        x-memberListVariable: platform_clickhouse_instances
    artifacts:
    - id: clickhouse-common-static
      name: clickhouse-common-static
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:b98cfaa7e82a563c0a21276c3dd0a637bf8976f1b65bd7a71f1d625f231954e9
      requiredOffline: true
    - id: clickhouse-server
      name: clickhouse-server
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:3d72d3e909f4dcca5378faeb7d3dd9fbf0741038f7309ff87965fe0efb70e4ee
      requiredOffline: true
    - id: clickhouse-client
      name: clickhouse-client
      version: 26.8.14.3
      os: redos
      architecture: x86_64
      digest: sha256:796874f358d73b96ff8bf04c5aabbf474ea020303eb7d113f1009961739e41c7
      requiredOffline: true
    compatibilityRef: ../../services/clickhouse/compatibility.yml
    x-definitionDigest: sha256:dc489f76b01196af3bbdeaad8de649148d4c9c148cfaea198578dd404a42a5f8
    x-sourceManifest: services/clickhouse/service.yml
  docker:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: docker
      version: 1.0.0-alpha.1
      displayName: Docker rootless
      description: Rootless Docker Engine and Compose with LXC networking and TLS TCP API
      category: runtime
    modes:
      create-user:
        displayName: Create Docker user
        description: Create a dedicated account using a runtime-only password
        memberRoles: []
        placement:
          explicit: true
          hostScoped: true
          minMembers: 1
          distinctHosts: true
        x-requiredRuntimeSecretSettings:
        - accountCredential
      existing-user:
        displayName: Existing Docker user
        description: Use an existing eligible account without changing its password
        memberRoles: []
        placement:
          explicit: true
          hostScoped: true
          minMembers: 1
          distinctHosts: true
    listeners:
      api:
        protocol: tcp
        defaultPort: 2376
        tlsCapable: true
        scope: deployment
    capabilities:
    - service.docker.rootless
    - service.docker.compose
    dependencies: []
    configurationSchema:
      $ref: ../../services/docker/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        accountName:
          kind: MANAGED
          roleVariable: platform_docker_account_name
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
            maxLength: 32
          ui:
            label: Docker account
            section: Account
            order: 10
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_docker_tls_profile
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: TLS profile
            section: TLS
            order: 20
            x-referenceKind: TLS_PROFILE
        apiPort:
          kind: MANAGED
          roleVariable: platform_docker_api_port
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: Docker TLS API port
            section: Network
            order: 30
        apiBindAddress:
          kind: MANAGED
          roleVariable: platform_docker_api_bind_address
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
            maxLength: 64
          ui:
            label: External API bind address
            section: Network
            order: 31
        accountCredential:
          kind: MANAGED
          roleVariable: platform_docker_account_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: New account password
            section: Credentials
            order: 40
            x-runtimeSecretRequirement:
              requirementRef: docker-account-password
              purpose: SERVICE_PASSWORD
    roleEntrypoints:
      apply:
        fqcn: platform.docker.docker_rootless
        variablesPrefix: platform_docker_
      verify:
        fqcn: platform.docker.docker_rootless
        variablesPrefix: platform_docker_
    artifacts: []
    runtimeRequirements:
    - id: docker-engine
      name: docker-ce
      version: 29.7.2
      os: redos
      architecture: x86_64
      requiredOffline: false
    - id: docker-cli
      name: docker-ce-cli
      version: 29.7.2
      os: redos
      architecture: x86_64
      requiredOffline: false
    - id: docker-rootless
      name: docker-ce-rootless-extras
      version: 29.7.2
      os: redos
      architecture: noarch
      requiredOffline: false
    - id: docker-compose
      name: docker-compose
      version: 5.3.1
      os: redos
      architecture: x86_64
      requiredOffline: false
    - id: docker-lxc
      name: lxc
      version: 7.0.0
      os: redos
      architecture: x86_64
      requiredOffline: false
    - id: docker-fuse-overlayfs
      name: fuse-overlayfs
      version: 1.7.1
      os: redos
      architecture: x86_64
      requiredOffline: false
    compatibilityRef: ../../services/docker/compatibility.yml
    x-definitionDigest: sha256:d24bf668ff656f2b8a9d9333f2ad8354b00b7664f862464e0b77b4caa48f5de5
    x-sourceManifest: services/docker/service.yml
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.3
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: implemented-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    - service.kafka.topic
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        schemaRegistryEnabled:
          kind: MANAGED
          roleVariable: platform_kafka_schema_registry_enabled
          type: boolean
          scopes:
          - deployment
          validation: {}
          ui:
            label: Установить Schema Registry
            section: Schema Registry
            order: 50
            description: Один экземпляр рядом с каждым broker. Controller-only участники исключены.
        schemaRegistryKafkaListener:
          kind: MANAGED
          roleVariable: platform_kafka_schema_registry_kafka_listener
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
            maxLength: 128
          ui:
            label: Kafka listener для Schema Registry
            section: Schema Registry
            order: 51
            description: Имя listener на brokers; по умолчанию SSL. Controller listener запрещён.
        schemaRegistryHttpPort:
          kind: MANAGED
          roleVariable: platform_kafka_schema_registry_http_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          x-memberInputOnly: true
          ui:
            label: HTTP-порт Schema Registry
            section: Schema Registry
            order: 52
        schemaRegistryHttpsPort:
          kind: MANAGED
          roleVariable: platform_kafka_schema_registry_https_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          x-memberInputOnly: true
          ui:
            label: HTTPS-порт Schema Registry
            section: Schema Registry
            order: 53
        quorumMode:
          kind: MANAGED
          roleVariable: platform_kafka_quorum_mode
          type: string
          scopes:
          - deployment
          validation:
            enum:
            - dynamic
            - static
          ui:
            label: KRaft quorum mode
            order: 5
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_kafka_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka TLS profile
            order: 22
            x-referenceKind: TLS_PROFILE
        listeners:
          kind: MANAGED
          roleVariable: platform_kafka_listeners
          type: object
          scopes:
          - deployment
          - member
          validation:
            minProperties: 1
          schema:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - purpose
              - securityProtocol
              - port
              properties:
                purpose:
                  type: string
                  enum:
                  - client
                  - interBroker
                  - controller
                securityProtocol:
                  type: string
                  enum:
                  - PLAINTEXT
                  - SSL
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                bindAddress:
                  type: string
                  minLength: 1
                advertisedAddress:
                  type: string
                  minLength: 1
          ui:
            label: Named Kafka listeners
            order: 15
        nodeId:
          kind: MANAGED
          roleVariable: platform_kafka_node_id
          type: integer
          scopes:
          - member
          validation:
            minimum: 0
            maximum: 2147483647
          ui:
            label: Node ID
            order: 25
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
            maxLength: 255
          ui:
            label: Каталог данных
            section: Хранение
            order: 0
            description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких
              участников используются отдельные подкаталоги. Существующие данные автоматически не переносятся.
        runtimePathNamespace:
          kind: MANAGED
          roleVariable: platform_kafka_runtime_path_namespace
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: Runtime path namespace
            order: 31
        logDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_log_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka log directory
            order: 32
        configDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka config directory
            order: 33
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    x-reservedAdvancedProperties:
    - node.id
    - process.roles
    - listeners
    - advertised.listeners
    - controller.listener.names
    - controller.quorum.voters
    - controller.quorum.bootstrap.servers
    - log.dirs
    - listener.security.protocol.map
    - inter.broker.listener.name
    - listener.name.*.ssl.keystore.location
    - listener.name.*.ssl.truststore.location
    x-dataDirectoryProjection:
      deploymentSetting: dataDirectory
      memberSetting: dataDirectory
      rootVariable: platform_data_root_directory
      appendMemberIdWhenCoLocated: true
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: schema-registry-binary
      name: confluent-schema-registry
      version: 8.3.2
      os: redos
      architecture: noarch
      digest: sha256:dc4d6234e0f7e1a91b369f9cf1d27d7c9885edb9f6440170c3a6f00ba68fcc81
      requiredOffline: true
      x-enabledBy: schemaRegistryEnabled
      x-memberRole: broker
    - id: kafka-binary
      name: kafka
      version: 4.3.1
      os: redos
      architecture: x86_64
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    runtimeRequirements:
    - id: kafka-java
      name: java-21-openjdk-headless
      version: ''
      os: redos
      architecture: x86_64
      requiredOffline: false
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: implemented-service-02a
    x-definitionDigest: sha256:cb351fe279390a1dfb3b20d105972c89b67b588ffd85c11b1ba0d176a2402a9c
    x-sourceManifest: services/kafka/service.yml
  postgresql:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: postgresql
      version: 1.0.0-alpha.1
      displayName: PostgreSQL
      description: PostgreSQL 16 with standalone and pg_auto_failover modes
      category: database
    modes:
      standalone:
        displayName: Standalone
        description: One PostgreSQL data member
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
        x-maturity: implemented-postgres-01a
        x-requiredRuntimeSecretSettings:
        - adminSuperuser
      pg_auto_failover:
        displayName: pg_auto_failover
        description: One monitor and two PostgreSQL data members
        memberRoles:
        - monitor
        - database
        placement:
          explicit: true
          minMembers: 3
          maxMembers: 3
          distinctHosts: true
          roleCardinality:
            monitor:
              minimum: 1
              maximum: 1
            database:
              minimum: 2
              maximum: 2
        x-maturity: implemented-postgres-01b
        x-requiredRuntimeSecretSettings:
        - adminSuperuser
        - monitorCredential
        - replicationCredential
      patroni:
        displayName: Patroni
        description: Deferred compatibility fixture; not implemented by POSTGRES-01
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
        x-maturity: deferred
    listeners:
      client:
        protocol: tcp
        defaultPort: 5432
        tlsCapable: true
        scope: deployment
    endpoint: {}
    x-haproxyBackendDefaults:
      balance: roundrobin
      check: true
      fall: 3
      rise: 2
      ssl: true
      sslVerify: required
    capabilities:
    - service.postgresql.client
    - service.postgresql.database
    - service.postgresql.schema
    - service.postgresql.account
    - service.postgresql.database-access
    dependencies: []
    configurationSchema:
      $ref: ../../services/postgresql/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        port:
          kind: MANAGED
          roleVariable: platform_postgresql_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: PostgreSQL port
            section: Network
            order: 10
        clientCidrs:
          kind: MANAGED
          roleVariable: platform_postgresql_client_cidrs
          type: array
          scopes:
          - deployment
          - member
          validation:
            maxItems: 32
            items:
              type: string
              pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(?:[0-9]|[12][0-9]|3[0-2])$
          ui:
            label: Дополнительные клиентские IPv4 CIDR
            section: Network
            order: 11
            description: Дополняют автоматически определённую подсеть. Доступ только через TLS и SCRAM.
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_postgresql_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
            maxLength: 255
          ui:
            label: Каталог данных
            section: Хранение
            order: 0
            description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>/postgres.
              Существующие данные автоматически не переносятся.
        configDirectory:
          kind: MANAGED
          roleVariable: platform_postgresql_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Config directory
            section: Storage
            order: 21
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_postgresql_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: TLS profile
            section: TLS
            order: 30
            x-referenceKind: TLS_PROFILE
        adminSuperuser:
          kind: MANAGED
          roleVariable: platform_postgresql_admin_superuser
          type: object
          scopes:
          - deployment
          validation:
            required:
            - username
            - passwordSecretRef
          schema:
            type: object
