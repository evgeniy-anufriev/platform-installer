apiVersion: platform.installer/catalog/v1alpha1
kind: ServiceCatalog
digest: sha256:e5425a0ced1d2c6a76412bca74da8bfd40ec43f06fa9a501118f1184c2b655eb
definitions:
  kafka:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: kafka
      version: 1.0.0-alpha.1
      displayName: Apache Kafka
      description: Apache Kafka using KRaft metadata management
      category: messaging
    modes:
      kraft-standalone:
        displayName: Single-node KRaft
        description: One combined broker and controller member
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
              maximum: 1
            controller:
              minimum: 1
              maximum: 1
        x-maturity: implemented-service-01a
      kraft-distributed:
        displayName: Distributed KRaft
        description: Explicit controller and broker placements
        memberRoles:
        - broker
        - controller
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: false
          roleCardinality:
            broker:
              minimum: 1
            controller:
              minimum: 3
        x-maturity: implemented-service-01b
    listeners:
      client:
        protocol: tcp
        defaultPort: 9092
        tlsCapable: true
        scope: deployment
      controller:
        protocol: tcp
        defaultPort: 9093
        tlsCapable: true
        scope: member
    capabilities:
    - service.kafka.client
    - service.kafka.kraft
    dependencies: []
    configurationSchema:
      $ref: ../../services/kafka/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        quorumMode:
          kind: MANAGED
          roleVariable: platform_kafka_quorum_mode
          type: string
          scopes:
          - deployment
          validation:
            enum:
            - dynamic
            - static
          ui:
            label: KRaft quorum mode
            order: 5
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_kafka_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka TLS profile
            order: 22
        listeners:
          kind: MANAGED
          roleVariable: platform_kafka_listeners
          type: object
          scopes:
          - deployment
          - member
          validation:
            minProperties: 1
          schema:
            type: object
            minProperties: 1
            additionalProperties:
              type: object
              additionalProperties: false
              required:
              - purpose
              - securityProtocol
              - port
              properties:
                purpose:
                  type: string
                  enum:
                  - client
                  - interBroker
                  - controller
                securityProtocol:
                  type: string
                  enum:
                  - PLAINTEXT
                  - SSL
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                bindAddress:
                  type: string
                  minLength: 1
                advertisedAddress:
                  type: string
                  minLength: 1
          ui:
            label: Named Kafka listeners
            order: 15
        nodeId:
          kind: MANAGED
          roleVariable: platform_kafka_node_id
          type: integer
          scopes:
          - member
          validation:
            minimum: 0
            maximum: 2147483647
          ui:
            label: Node ID
            order: 25
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            order: 30
        runtimePathNamespace:
          kind: MANAGED
          roleVariable: platform_kafka_runtime_path_namespace
          type: string
          scopes:
          - deployment
          validation:
            minLength: 1
          ui:
            label: Runtime path namespace
            order: 31
        logDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_log_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka log directory
            order: 32
        configDirectory:
          kind: MANAGED
          roleVariable: platform_kafka_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Kafka config directory
            order: 33
        logRetentionHours:
          kind: MANAGED
          roleVariable: platform_kafka_log_retention_hours
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
          ui:
            label: Log retention hours
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_kafka_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced Kafka properties
            order: 90
    x-reservedAdvancedProperties:
    - node.id
    - process.roles
    - listeners
    - advertised.listeners
    - controller.listener.names
    - controller.quorum.voters
    - controller.quorum.bootstrap.servers
    - log.dirs
    - listener.security.protocol.map
    - inter.broker.listener.name
    - listener.name.*.ssl.keystore.location
    - listener.name.*.ssl.truststore.location
    roleEntrypoints:
      apply:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
      verify:
        fqcn: platform.kafka.kafka_kraft
        variablesPrefix: platform_kafka_
    artifacts:
    - id: kafka-binary
      version: 4.3.1
      digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
      requiredOffline: true
    compatibilityRef: ../../services/kafka/compatibility.yml
    x-initialSecurityScope:
      sasl: unsupported
      mtls: deferred
      customListeners: implemented-service-02a
    x-definitionDigest: sha256:dc6d284a8e7814d42ead3055e75f778abb1dff94e389375e5221cf823f9a12cc
    x-sourceManifest: services/kafka/service.yml
  postgresql:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: postgresql
      version: 1.0.0-alpha.1
      displayName: PostgreSQL
      description: PostgreSQL 16 with standalone and pg_auto_failover modes
      category: database
    modes:
      standalone:
        displayName: Standalone
        description: One PostgreSQL data member
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 1
          maxMembers: 1
          distinctHosts: false
        x-maturity: implemented-postgres-01a
      pg_auto_failover:
        displayName: pg_auto_failover
        description: One monitor and two PostgreSQL data members
        memberRoles:
        - monitor
        - database
        placement:
          explicit: true
          minMembers: 3
          maxMembers: 3
          distinctHosts: true
          roleCardinality:
            monitor:
              minimum: 1
              maximum: 1
            database:
              minimum: 2
              maximum: 2
        x-maturity: implemented-postgres-01b
      patroni:
        displayName: Patroni
        description: Deferred compatibility fixture; not implemented by POSTGRES-01
        memberRoles:
        - database
        placement:
          explicit: true
          minMembers: 3
          distinctHosts: true
        x-maturity: deferred
    listeners:
      client:
        protocol: tcp
        defaultPort: 5432
        tlsCapable: true
        scope: deployment
    endpoint: {}
    capabilities:
    - service.postgresql.client
    dependencies: []
    configurationSchema:
      $ref: ../../services/postgresql/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        port:
          kind: MANAGED
          roleVariable: platform_postgresql_port
          type: integer
          scopes:
          - deployment
          - member
          validation:
            minimum: 1
            maximum: 65535
          ui:
            label: PostgreSQL port
            section: Network
            order: 10
        dataDirectory:
          kind: MANAGED
          roleVariable: platform_postgresql_data_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Data directory
            section: Storage
            order: 20
        configDirectory:
          kind: MANAGED
          roleVariable: platform_postgresql_config_directory
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: Config directory
            section: Storage
            order: 21
        tlsProfile:
          kind: MANAGED
          roleVariable: platform_postgresql_tls_profile
          type: string
          scopes:
          - deployment
          - member
          validation:
            minLength: 1
          ui:
            label: TLS profile
            section: TLS
            order: 30
        adminSuperuser:
          kind: MANAGED
          roleVariable: platform_postgresql_admin_superuser
          type: object
          scopes:
          - deployment
          validation:
            required:
            - username
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - username
            - passwordSecretRef
            properties:
              username:
                type: string
                pattern: ^[A-Za-z_][A-Za-z0-9_]{0,62}$
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Administrator
            section: Administrator
            order: 40
        monitorCredential:
          kind: MANAGED
          roleVariable: platform_postgresql_monitor_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Monitor credential
            section: High Availability
            order: 50
        replicationCredential:
          kind: MANAGED
          roleVariable: platform_postgresql_replication_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Replication credential
            section: High Availability
            order: 51
        healthcheckCredential:
          kind: MANAGED
          roleVariable: platform_postgresql_healthcheck_credential
          type: object
          scopes:
          - deployment
          validation:
            required:
            - passwordSecretRef
          schema:
            type: object
            additionalProperties: false
            required:
            - passwordSecretRef
            properties:
              passwordSecretRef:
                type: string
                minLength: 1
          ui:
            label: Monitor healthcheck credential
            section: High Availability
            order: 52
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_postgresql_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: true
          ui:
            label: Advanced PostgreSQL settings
            section: Advanced
            order: 90
    x-reservedAdvancedProperties:
    - data_directory
    - port
    - ssl
    - ssl_cert_file
    - ssl_key_file
    - ssl_ca_file
    - primary_conninfo
    - primary_slot_name
    - shared_preload_libraries
    - pg_hba_file
    roleEntrypoints:
      apply:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
      verify:
        fqcn: platform.postgresql.postgresql
        variablesPrefix: platform_postgresql_
    artifacts: []
    compatibilityRef: ../../services/postgresql/compatibility.yml
    x-definitionDigest: sha256:72e320e5c4710fef4d7d77082d5c5282ecd900fd01a7f449153280705b090eda
    x-sourceManifest: services/postgresql/service.yml
  keepalived:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: keepalived
      version: 1.0.0-alpha.1
      displayName: Keepalived
      description: IPv4 unicast VRRP ownership for one deployment-owned virtual address set
      category: network
    modes:
      vrrp-unicast:
        displayName: Unicast VRRP
        description: Two or more inventory hosts participate in one deployment-owned VRRP election domain
        memberRoles: []
        placement:
          explicit: true
          hostScoped: true
          minMembers: 2
          distinctHosts: true
        x-maturity: implemented-net-02
    capabilities:
    - service.keepalived.vip
    endpointProvider: {}
    dependencies: []
    configurationSchema:
      $ref: ../../services/keepalived/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        advertInterval:
          kind: MANAGED
          roleVariable: platform_keepalived_advert_interval
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 60
          ui:
            label: Advert interval
            section: VRRP
            order: 30
        haproxyHealthCheck:
          kind: MANAGED
          roleVariable: platform_keepalived_haproxy_health_check
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: false
          schema:
            type: object
            additionalProperties: false
            properties:
              interval:
                type: integer
                minimum: 1
                maximum: 60
              timeout:
                type: integer
                minimum: 1
                maximum: 60
              fall:
                type: integer
                minimum: 1
                maximum: 20
              rise:
                type: integer
                minimum: 1
                maximum: 20
          ui:
            label: Future HAProxy health check
            section: Integration
            order: 40
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_keepalived_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: false
          schema:
            type: object
            additionalProperties: false
            properties:
              instance:
                type: object
                additionalProperties: false
                properties:
                  garp_master_delay:
                    type: integer
                    minimum: 0
                    maximum: 60
                  garp_master_repeat:
                    type: integer
                    minimum: 1
                    maximum: 20
          ui:
            label: Advanced Keepalived settings
            section: Advanced
            order: 90
    x-reservedAdvancedProperties:
    - state
    - nopreempt
    - virtual_router_id
    - virtual_ipaddress
    - interface
    - priority
    - unicast_src_ip
    - unicast_peer
    - track_script
    roleEntrypoints:
      apply:
        fqcn: platform.keepalived.keepalived
        variablesPrefix: platform_keepalived_
      verify:
        fqcn: platform.keepalived.keepalived
        variablesPrefix: platform_keepalived_
    artifacts: []
    compatibilityRef: ../../services/keepalived/compatibility.yml
    x-definitionDigest: sha256:2bebe08e88124e5082b6a4d30743c9f17ccbd31ba48341c4e5c9e1ebdb084254
    x-sourceManifest: services/keepalived/service.yml
  bind:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: bind
      version: 1.0.0-alpha.1
      displayName: BIND
      description: Authoritative primary-secondary DNS for one Platform-managed forward zone
      category: network
    modes:
      authoritative-primary-secondary:
        displayName: Authoritative primary-secondary
        description: One primary and one or more secondary BIND participants placed directly on inventory
          hosts
        memberRoles:
        - primary
        - secondary
        placement:
          explicit: true
          hostScoped: true
          minMembers: 2
          distinctHosts: true
        x-maturity: implemented-net-03
    capabilities:
    - service.bind.authoritative-dns
    dependencies: []
    configurationSchema:
      $ref: ../../services/bind/configuration.schema.json
    configuration:
      additionalProperties: false
      settings:
        zone:
          kind: MANAGED
          roleVariable: platform_bind_zone
          type: string
          scopes:
          - deployment
          validation:
            minLength: 3
          ui:
            label: Zone
            section: Authoritative zone
            order: 10
        defaultTtl:
          kind: MANAGED
          roleVariable: platform_bind_default_ttl
          type: integer
          scopes:
          - deployment
          validation:
            minimum: 1
            maximum: 2147483647
          ui:
            label: Default TTL
            section: Authoritative zone
            order: 20
        advancedConfig:
          kind: ADVANCED
          roleVariable: platform_bind_advanced_config
          type: object
          scopes:
          - deployment
          validation:
            additionalProperties: false
          schema:
            type: object
            additionalProperties: false
            properties:
              options:
                type: object
                additionalProperties: false
                properties:
                  minimal-responses:
                    type: boolean
          ui:
            label: Advanced BIND settings
            section: Advanced
            order: 90
    x-reservedAdvancedProperties:
    - recursion
    - allow-recursion
    - allow-query-cache
    - allow-update
    - allow-transfer
    - notify
    - also-notify
    - type
    - file
    - primaries
    - masters
    - zone
    roleEntrypoints:
      apply:
        fqcn: platform.bind.bind
        variablesPrefix: platform_bind_
      verify:
        fqcn: platform.bind.bind
        variablesPrefix: platform_bind_
    artifacts: []
    compatibilityRef: ../../services/bind/compatibility.yml
    x-definitionDigest: sha256:215a3c9a4c073db277a8bfba4dde135ee641612d39f3edf94623a19591642611
    x-sourceManifest: services/bind/service.yml
  etcd:
    apiVersion: platform.installer/service-manifest/v1alpha1
    kind: ServiceManifest
    metadata:
      id: etcd
      version: fixture-v1
      displayName: etcd
      description: Contract-conformance DCS dependency definition
      category: coordination
    modes:
      cluster:
        displayName: Cluster
        memberRoles:
