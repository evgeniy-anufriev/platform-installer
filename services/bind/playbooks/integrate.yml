---
# Exact source-owned DNS updates. The caller passes Core-resolved records;
# this entrypoint never rebuilds or deletes the complete zone model.
- name: Publish selected source DNS records on their BIND primaries
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_role:
        name: platform.bind.bind
        tasks_from: publish_source
