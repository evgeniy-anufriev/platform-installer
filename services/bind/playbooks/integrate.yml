---
# Exact source-owned DNS updates. The caller passes Core-resolved records;
# this entrypoint never rebuilds or deletes the complete zone model.
- name: Publish selected source DNS records on their BIND primaries
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate resolved source DNS record list
      ansible.builtin.assert:
        that:
          - platform_bind_source_dns_records is sequence
          - platform_bind_source_dns_records is not string
        fail_msg: BIND_DNS_A_RECORD_UPDATE_INPUT_INVALID

    - name: Apply only source records on matching primary participants
      ansible.builtin.include_role:
        name: platform.bind.bind
        tasks_from: update_a_record.yml
      vars:
        platform_bind_a_record: "{{ item }}"
      loop: "{{ platform_bind_source_dns_records }}"
      loop_control:
        label: "{{ item.owner | default('invalid source DNS owner') }}"
      when:
        - item is mapping
        - item.bindDeploymentId is defined
        - item.bindDeploymentId in (platform_deployments | default({}))
        - platform_deployments[item.bindDeploymentId].roles | default([]) == ['primary']
