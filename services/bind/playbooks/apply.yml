---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- name: Materialize BIND serial lifecycle state
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve controller-safe BIND generated-state path
      ansible.builtin.set_fact:
        _platform_bind_generated_state_path: >-
          {{ platform_generated_state_path |
             default((platform_project_root |
                      default((inventory_dir | default('/project/inventory', true)) | dirname, true)) ~
                     '/inventory/group_vars/all/platform-state.yml', true) }}

    - name: Resolve BIND generated-state project identity
      ansible.builtin.set_fact:
        _platform_bind_project_id: >-
          {{ platform_project_id
             if platform_project_id is defined and (platform_project_id | string | length > 0)
             else (platform_project_root | basename
                   if platform_project_root is defined
                   else ((inventory_dir | dirname | basename)
                         if inventory_dir is defined else 'project')) }}

    - name: Initialize absent BIND generated state safely
      ansible.builtin.set_fact:
        _platform_bind_persisted_state_file: {}

    - name: Inspect persistent BIND generated state before reconciliation
      ansible.builtin.stat:
        path: "{{ _platform_bind_generated_state_path }}"
      register: _platform_bind_persisted_state_stat

    - name: Load existing persistent BIND generated state for reconciliation
      ansible.builtin.include_vars:
        file: "{{ _platform_bind_generated_state_path }}"
        name: _platform_bind_persisted_state_file
      when: _platform_bind_persisted_state_stat.stat.exists | bool

    - name: Select persistent generated state for BIND lifecycle reconciliation
      ansible.builtin.set_fact:
        _platform_bind_persisted_generated_state: >-
          {{ _platform_bind_persisted_state_file.platform_generated_state | default(platform_generated_state | default({}), true) }}

    - name: Bind persistent BIND generated state to this project identity
      ansible.builtin.assert:
        that:
          - _platform_bind_persisted_generated_state.metadata | default({}) is mapping
          - _platform_bind_persisted_generated_state.metadata.projectId | default('') == _platform_bind_project_id
        fail_msg: BIND_GENERATED_STATE_PROJECT_MISMATCH
      when: _platform_bind_persisted_generated_state | length > 0

    - name: Validate loaded BIND generated state before reconciliation
      platform.core.validate_project:
        manifest: "{{ platform_project_manifest_document }}"
        topology: "{{ platform_project | default({}) }}"
        ansible_desired_state: "{{ platform_desired_state | default({}) }}"
        generated_state: "{{ _platform_bind_persisted_generated_state }}"
        project_id: "{{ _platform_bind_project_id }}"
        desired_hosts: "{{ platform_desired_hosts }}"
        service_catalog: >-
          {{ platform_catalog_artifact.platform_service_catalog |
             default(platform_catalog_artifact, true) }}
        inventory_hosts: "{{ groups['platform_targets'] | default([]) }}"
        inventory_deployments_by_host: "{{ platform_inventory_deployments | default({}) }}"
        inventory_host_addresses: "{{ platform_inventory_host_addresses | default({}) }}"
        artifact_path: >-
          {{ (platform_validation_artifact |
              default(playbook_dir ~ '/../../../ansible-core/.runtime/validation-result.json', true)) ~
             '.bind-persisted-state' }}
        contracts_root: >-
          {{ platform_contracts_root |
             default(playbook_dir ~ '/../../../contracts', true) }}
      changed_when: false
      become: false
      when: _platform_bind_persisted_generated_state | length > 0

    - name: Load published service catalog for BIND serial resolution
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: _platform_bind_catalog_file

    - name: Collect safe project host and deployment projections
      ansible.builtin.set_fact:
        _platform_bind_inventory_hosts: >-
          {{ _platform_bind_inventory_hosts | default({}) |
             combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}
        _platform_bind_inventory_deployments: >-
          {{ _platform_bind_inventory_deployments | default({}) |
             combine({item: (hostvars[item].platform_deployments | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      no_log: true

    - name: Resolve DNS logical content before serial materialization
      platform.core.resolve_dns_zones:
        desired_state: "{{ platform_desired_state }}"
        service_catalog: "{{ _platform_bind_catalog_file.platform_service_catalog | default(_platform_bind_catalog_file, true) }}"
        inventory_hosts: "{{ _platform_bind_inventory_hosts }}"
        inventory_deployments: "{{ _platform_bind_inventory_deployments }}"
      register: platform_bind_resolution

    - name: Recover audited BIND DNS lifecycle metadata into the persistent project root
      platform.core.recover_dns_lifecycle:
        generated_state: "{{ _platform_bind_persisted_generated_state }}"
        zones: "{{ platform_bind_resolution.resolved_dns_zones.zones }}"
        recovery: "{{ platform_bind_lifecycle_recovery }}"
      register: _platform_bind_lifecycle_recovery
      when: platform_bind_lifecycle_recovery | default({}) | length > 0

    - name: Initialize generated state envelope for BIND serial lifecycle
      ansible.builtin.set_fact:
        _platform_bind_next_state: >-
          {{ {
               'apiVersion': 'platform.installer/generated-state/v1alpha1',
               'kind': 'PlatformGeneratedState',
               'metadata': {'projectId': _platform_bind_project_id},
               'serviceDeployments': {}
             } | combine(
                   (_platform_bind_lifecycle_recovery.recovered_dns_lifecycle.generatedState
                    if (_platform_bind_lifecycle_recovery is defined and not (_platform_bind_lifecycle_recovery.skipped | default(false)))
                    else _platform_bind_persisted_generated_state),
                   recursive=True) }}
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Require existing DNS lifecycle state for read-only retry projection
      ansible.builtin.assert:
        that:
          - platform_generated_state.serviceDeployments | default({}) is mapping
          - item.key in (platform_generated_state.serviceDeployments | default({}))
          - platform_generated_state.serviceDeployments[item.key].dns.contentFingerprint == item.value.contentFingerprint
          - platform_generated_state.serviceDeployments[item.key].dns.currentSerial | int >= 1
        fail_msg: BIND_GENERATED_STATE_REUSE_INVALID
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: platform_bind_reuse_existing_generated_state | default(false) | bool

    - name: Materialize deterministic BIND serial entries
      ansible.builtin.set_fact:
        _platform_bind_next_state: >-
          {{ _platform_bind_next_state |
             combine({'serviceDeployments': {
               item.key: {'dns': {
                 'contentFingerprint': item.value.contentFingerprint,
                 'currentSerial': (
                   (_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('currentSerial', 0) | int
                   if (_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('contentFingerprint', '') == item.value.contentFingerprint
                   else ((_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('currentSerial', 0) | int + 1)
                 )
               }}}
             }, recursive=True) }}
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Validate BIND generated state against the published project contract
      platform.core.validate_project:
        manifest: "{{ platform_project_manifest_document }}"
        topology: "{{ platform_project | default({}) }}"
        ansible_desired_state: "{{ platform_desired_state | default({}) }}"
        generated_state: >-
          {{ platform_generated_state if (platform_bind_reuse_existing_generated_state | default(false) | bool)
             else _platform_bind_next_state }}
        project_id: "{{ _platform_bind_project_id }}"
        desired_hosts: "{{ platform_desired_hosts }}"
        service_catalog: >-
          {{ platform_catalog_artifact.platform_service_catalog |
             default(platform_catalog_artifact, true) }}
        inventory_hosts: "{{ groups['platform_targets'] | default([]) }}"
        inventory_deployments_by_host: "{{ platform_inventory_deployments | default({}) }}"
        inventory_host_addresses: "{{ platform_inventory_host_addresses | default({}) }}"
        artifact_path: >-
          {{ (platform_validation_artifact |
              default(playbook_dir ~ '/../../../ansible-core/.runtime/validation-result.json', true)) ~
             '.bind-generated-state' }}
        contracts_root: >-
          {{ platform_contracts_root |
             default(playbook_dir ~ '/../../../contracts', true) }}
      changed_when: false
      become: false

    - name: Publish BIND runtime projection for this apply
      ansible.builtin.set_fact:
        platform_bind_runtime_projection:
          zones: "{{ platform_bind_resolution.resolved_dns_zones.zones }}"
          generatedState: >-
            {{ platform_generated_state if (platform_bind_reuse_existing_generated_state | default(false) | bool)
               else _platform_bind_next_state }}

    - name: Create persistent generated-state directory for BIND serial lifecycle
      ansible.builtin.file:
        path: "{{ _platform_bind_generated_state_path | dirname }}"
        state: directory
        mode: '0700'
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Persist BIND generated serial state atomically
      ansible.builtin.copy:
        content: "{{ {'platform_generated_state': _platform_bind_next_state} | to_nice_yaml(indent=2) }}"
        dest: "{{ _platform_bind_generated_state_path }}"
        mode: '0600'
      register: platform_bind_generated_state_write
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Refresh inventory after BIND serial materialization
      ansible.builtin.meta: refresh_inventory
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

- name: Prepare and validate authoritative BIND DNS candidates on all participants
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: prepare

- name: Activate authoritative BIND DNS only after cluster-wide candidate validation
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: activate

- name: Start authoritative BIND DNS only after cluster-wide active validation
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: start
