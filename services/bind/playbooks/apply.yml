---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- name: Материализовать состояние последовательного жизненного цикла BIND
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Включить нормализованные источники в явное полное согласование DNS
      ansible.builtin.include_role:
        name: platform.core.resolve_endpoint_sources
      when: platform_bind_full_reconcile | default(false) | bool
    - name: Определение безопасного для контроллера пути сгенерированного состояния BIND
      ansible.builtin.set_fact:
        _platform_bind_generated_state_path: >-
          {{ platform_generated_state_path |
             default((platform_project_root |
                      default((inventory_dir | default('/project/inventory', true)) | dirname, true)) ~
                     '/inventory/group_vars/all/platform-state.yml', true) }}

    - name: Разрешить идентификацию проекта сгенерированного состояния BIND
      ansible.builtin.set_fact:
        _platform_bind_project_id: >-
          {{ platform_project_id
             if platform_project_id is defined and (platform_project_id | string | length > 0)
             else (platform_project_root | basename
                   if platform_project_root is defined
                   else ((inventory_dir | dirname | basename)
                         if inventory_dir is defined else 'project')) }}

    - name: Безопасная инициализация отсутствующего состояния, сгенерированного BIND
      ansible.builtin.set_fact:
        _platform_bind_persisted_state_file: {}

    - name: Проверка постоянного состояния, сгенерированного BIND, перед согласованием
      ansible.builtin.stat:
        path: "{{ _platform_bind_generated_state_path }}"
      register: _platform_bind_persisted_state_stat

    - name: Загрузить существующее постоянное сгенерированное состояние BIND для сверки
      ansible.builtin.include_vars:
        file: "{{ _platform_bind_generated_state_path }}"
        name: _platform_bind_persisted_state_file
      when: _platform_bind_persisted_state_stat.stat.exists | bool

    - name: Выбрать постоянное сгенерированное состояние для сверки жизненного цикла BIND
      ansible.builtin.set_fact:
        _platform_bind_persisted_generated_state: >-
          {{ _platform_bind_persisted_state_file.platform_generated_state | default(platform_generated_state | default({}), true) }}

    - name: Привязать постоянное созданное состояние BIND к идентификатору этого проекта
      ansible.builtin.assert:
        that:
          - _platform_bind_persisted_generated_state.metadata | default({}) is mapping
          - _platform_bind_persisted_generated_state.metadata.projectId | default('') == _platform_bind_project_id
        fail_msg: BIND_GENERATED_STATE_PROJECT_MISMATCH
      when: _platform_bind_persisted_generated_state | length > 0

    - name: Проверка загруженного сгенерированного состояния BIND перед согласованием
      platform.core.validate_project:
        manifest: "{{ platform_project_manifest_document }}"
        topology: "{{ platform_project | default({}) }}"
        ansible_desired_state: "{{ platform_desired_state | default({}) | dict2items | rejectattr('key', 'equalto', 'applicationLibraryDeployments') | items2dict }}"
        application_findings: "{{ platform_application_validation.snapshot.findings | default([]) }}"
        generated_state: "{{ _platform_bind_persisted_generated_state }}"
        project_id: "{{ _platform_bind_project_id }}"
        desired_hosts: "{{ platform_desired_hosts }}"
        service_catalog: >-
          {{ platform_catalog_artifact.platform_service_catalog |
             default(platform_catalog_artifact, true) }}
        inventory_hosts: "{{ groups['platform_targets'] | default([]) }}"
        inventory_deployments_by_host: "{{ platform_inventory_deployments | default({}) }}"
        inventory_host_addresses: "{{ platform_inventory_host_addresses | default({}) }}"
        artifact_path: >-
          {{ (platform_validation_artifact |
              default(playbook_dir ~ '/../../../ansible-core/.runtime/validation-result.json', true)) ~
             '.bind-persisted-state' }}
        contracts_root: >-
          {{ platform_contracts_root |
             default(playbook_dir ~ '/../../../contracts', true) }}
      changed_when: false
      become: false
      when: _platform_bind_persisted_generated_state | length > 0

    - name: Загрузить опубликованный каталог сервисов для последовательного разрешения BIND
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: _platform_bind_catalog_file

    - name: Собрать безопасный хост проекта и прогнозы развертывания
      ansible.builtin.set_fact:
        _platform_bind_inventory_hosts: >-
          {{ _platform_bind_inventory_hosts | default({}) |
             combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}
        _platform_bind_inventory_deployments: >-
          {{ _platform_bind_inventory_deployments | default({}) |
             combine({item: (hostvars[item].platform_deployments | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      no_log: true

    - name: Разрешить логическое содержимое DNS перед последовательной материализацией
      platform.core.resolve_dns_zones:
        desired_state: "{{ platform_desired_state }}"
        service_catalog: "{{ _platform_bind_catalog_file.platform_service_catalog | default(_platform_bind_catalog_file, true) }}"
        inventory_hosts: "{{ _platform_bind_inventory_hosts }}"
        inventory_deployments: "{{ _platform_bind_inventory_deployments }}"
        include_service_endpoints: true
        include_group_wildcards: true
        endpoint_sources: "{{ hostvars['localhost'].platform_endpoint_sources | default({}) }}"
      register: platform_bind_resolution

    - name: Разрешить только базовый контент DNS для обычного BIND. Применить
      platform.core.resolve_dns_zones:
        desired_state: "{{ platform_desired_state }}"
        service_catalog: "{{ _platform_bind_catalog_file.platform_service_catalog | default(_platform_bind_catalog_file, true) }}"
        inventory_hosts: "{{ _platform_bind_inventory_hosts }}"
        inventory_deployments: "{{ _platform_bind_inventory_deployments }}"
        include_service_endpoints: false
        include_group_wildcards: true
      register: _platform_bind_base_resolution
      when: not (platform_bind_full_reconcile | default(false) | bool)

    - name: Инициализировать наблюдаемую в реальном времени последовательную проекцию DNS для явного полного согласования
      ansible.builtin.set_fact:
        _platform_bind_observed_live_serials: {}
      when: platform_bind_full_reconcile | default(false) | bool

    - name: Синхронизировать основной журнал BIND перед полной заменой модели
      ansible.builtin.command:
        argv: [rndc, sync, "{{ item.value.zone }}"]
      delegate_to: "{{ item.value.primary.hostId }}"
      become: true
      changed_when: false
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _platform_bind_sync_live_zone
      when: platform_bind_full_reconcile | default(false) | bool

    - name: Прочитать авторитетный основной серийный номер SOA перед полной заменой модели
      ansible.builtin.command:
        argv: [dig, "@127.0.0.1", "{{ item.value.zone }}", SOA, +short]
      delegate_to: "{{ item.value.primary.hostId }}"
      become: true
      changed_when: false
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: _platform_bind_live_zone_serial_query
      when: platform_bind_full_reconcile | default(false) | bool

    - name: Требовать действительные действующие серийные номера SOA перед заменой полных зон
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout.split() | length >= 3
          - item.stdout.split()[2] is match('^[0-9]{1,10}$')
          - item.stdout.split()[2] | int >= 1
          - item.stdout.split()[2] | int < 4294967295
        fail_msg: BIND_FULL_RECONCILE_LIVE_SERIAL_INVALID
      loop: "{{ _platform_bind_live_zone_serial_query.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: platform_bind_full_reconcile | default(false) | bool

    - name: Запись наблюдаемых в реальном времени первичных сериалов SOA
      ansible.builtin.set_fact:
        _platform_bind_observed_live_serials: >-
          {{ _platform_bind_observed_live_serials |
             combine({item.item.key: (item.stdout.split()[2] | int)}) }}
      loop: "{{ _platform_bind_live_zone_serial_query.results | default([]) }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: platform_bind_full_reconcile | default(false) | bool

    - name: Восстановить проверенные метаданные жизненного цикла BIND DNS в постоянный корень проекта
      platform.core.recover_dns_lifecycle:
        generated_state: "{{ _platform_bind_persisted_generated_state }}"
        zones: "{{ platform_bind_resolution.resolved_dns_zones.zones }}"
        recovery: "{{ platform_bind_lifecycle_recovery }}"
      register: _platform_bind_lifecycle_recovery
      when: platform_bind_lifecycle_recovery | default({}) | length > 0

    - name: Инициализировать созданный конверт состояния для последовательного жизненного цикла BIND
      ansible.builtin.set_fact:
        _platform_bind_next_state: >-
          {{ {
               'apiVersion': 'platform.installer/generated-state/v1alpha1',
               'kind': 'PlatformGeneratedState',
               'metadata': {'projectId': _platform_bind_project_id},
               'serviceDeployments': {}
             } | combine(
                   (_platform_bind_lifecycle_recovery.recovered_dns_lifecycle.generatedState
                    if (_platform_bind_lifecycle_recovery is defined and not (_platform_bind_lifecycle_recovery.skipped | default(false)))
                    else _platform_bind_persisted_generated_state),
                   recursive=True) }}
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Требовать существующее состояние жизненного цикла DNS для прогнозирования повторных попыток только для чтения
      ansible.builtin.assert:
        that:
          - platform_generated_state.serviceDeployments | default({}) is mapping
          - item.key in (platform_generated_state.serviceDeployments | default({}))
          - platform_generated_state.serviceDeployments[item.key].dns.contentFingerprint == item.value.contentFingerprint
          - platform_generated_state.serviceDeployments[item.key].dns.currentSerial | int >= 1
        fail_msg: BIND_GENERATED_STATE_REUSE_INVALID
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: platform_bind_reuse_existing_generated_state | default(false) | bool

    - name: Материализация детерминированных серийных записей BIND
      ansible.builtin.set_fact:
        _platform_bind_next_state: >-
          {{ _platform_bind_next_state |
             combine({'serviceDeployments': {
               item.key: {'dns': {
                 'contentFingerprint': item.value.contentFingerprint,
                 'currentSerial': (
                   ((_platform_bind_observed_live_serials[item.key] | int) + 1)
                   if platform_bind_full_reconcile | default(false) | bool
                   else (
                     (_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('currentSerial', 0) | int
                     if (_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('contentFingerprint', '') == item.value.contentFingerprint
                     else ((_platform_bind_next_state.serviceDeployments | default({})).get(item.key, {}).get('dns', {}).get('currentSerial', 0) | int + 1)
                   )
                 )
               }}}
             }, recursive=True) }}
      loop: "{{ platform_bind_resolution.resolved_dns_zones.zones | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Проверка сгенерированного состояния BIND на соответствие опубликованному контракту проекта
      platform.core.validate_project:
        manifest: "{{ platform_project_manifest_document }}"
        topology: "{{ platform_project | default({}) }}"
        ansible_desired_state: "{{ platform_desired_state | default({}) | dict2items | rejectattr('key', 'equalto', 'applicationLibraryDeployments') | items2dict }}"
        application_findings: "{{ platform_application_validation.snapshot.findings | default([]) }}"
        generated_state: >-
          {{ platform_generated_state if (platform_bind_reuse_existing_generated_state | default(false) | bool)
             else _platform_bind_next_state }}
        project_id: "{{ _platform_bind_project_id }}"
        desired_hosts: "{{ platform_desired_hosts }}"
        service_catalog: >-
          {{ platform_catalog_artifact.platform_service_catalog |
             default(platform_catalog_artifact, true) }}
        inventory_hosts: "{{ groups['platform_targets'] | default([]) }}"
        inventory_deployments_by_host: "{{ platform_inventory_deployments | default({}) }}"
        inventory_host_addresses: "{{ platform_inventory_host_addresses | default({}) }}"
        artifact_path: >-
          {{ (platform_validation_artifact |
              default(playbook_dir ~ '/../../../ansible-core/.runtime/validation-result.json', true)) ~
             '.bind-generated-state' }}
        contracts_root: >-
          {{ platform_contracts_root |
             default(playbook_dir ~ '/../../../contracts', true) }}
      changed_when: false
      become: false

    - name: Опубликовать проекцию времени выполнения BIND для этого приложения
      ansible.builtin.set_fact:
        platform_bind_runtime_projection:
          zones: >-
            {{ platform_bind_resolution.resolved_dns_zones.zones
               if (platform_bind_full_reconcile | default(false) | bool)
               else _platform_bind_base_resolution.resolved_dns_zones.zones }}
          generatedState: >-
            {{ platform_generated_state if (platform_bind_reuse_existing_generated_state | default(false) | bool)
               else _platform_bind_next_state }}

    - name: Создать постоянный каталог сгенерированного состояния для последовательного жизненного цикла BIND
      ansible.builtin.file:
        path: "{{ _platform_bind_generated_state_path | dirname }}"
        state: directory
        mode: '0700'
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Persist BIND атомарно генерирует последовательное состояние
      ansible.builtin.copy:
        content: "{{ {'platform_generated_state': _platform_bind_next_state} | to_nice_yaml(indent=2) }}"
        dest: "{{ _platform_bind_generated_state_path }}"
        mode: '0600'
      register: platform_bind_generated_state_write
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

    - name: Обновление запасов после серийной материализации BIND
      ansible.builtin.meta: refresh_inventory
      when: not (platform_bind_reuse_existing_generated_state | default(false) | bool)

- name: Подготовить и проверить авторитетных кандидатов BIND DNS для всех участников
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: prepare

- name: Активировать авторитетный DNS BIND после проверки подготовленных конфигураций на всём кластере
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: activate

- name: Запуск авторитетного BIND DNS только после активной проверки на уровне всего кластера
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.bind.bind
      platform_bind_phase: start
