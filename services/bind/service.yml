apiVersion: platform.installer/service-manifest/v1alpha2
kind: ServiceManifest
metadata:
  id: bind
  version: "1.0.0-alpha.2"
  displayName: BIND
  description: Authoritative BIND primary with optional secondary DNS participants for one Platform-managed forward zone
  category: network
modes:
  authoritative-primary-secondary:
    displayName: Authoritative primary-secondary
    description: One primary and zero or more secondary BIND participants placed directly on inventory hosts
    memberRoles: [primary, secondary]
    placement: {explicit: true, hostScoped: true, minMembers: 1, distinctHosts: true}
    x-maturity: implemented-net-03
capabilities: [service.bind.authoritative-dns]
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    zone: {kind: MANAGED, roleVariable: platform_bind_zone, type: string, scopes: [deployment], validation: {minLength: 4, maxLength: 253, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*\.[a-z]{2,63}$'}, ui: {label: Zone, section: Authoritative zone, order: 10}}
    defaultTtl: {kind: MANAGED, roleVariable: platform_bind_default_ttl, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 2147483647}, ui: {label: Default TTL, section: Authoritative zone, order: 20}}
    advancedConfig:
      kind: ADVANCED
      roleVariable: platform_bind_advanced_config
      type: object
      scopes: [deployment]
      validation: {additionalProperties: false}
      schema:
        type: object
        additionalProperties: false
        properties:
          options:
            type: object
            additionalProperties: false
            properties:
              minimal-responses: {type: boolean}
      ui: {label: Advanced BIND settings, section: Advanced, order: 90}
x-reservedAdvancedProperties: [recursion, allow-recursion, allow-query-cache, allow-update, allow-transfer, notify, also-notify, type, file, primaries, masters, zone]
roleEntrypoints:
  apply: {fqcn: platform.bind.bind, variablesPrefix: platform_bind_}
  verify: {fqcn: platform.bind.bind, variablesPrefix: platform_bind_}
artifacts: []
compatibilityRef: compatibility.yml
