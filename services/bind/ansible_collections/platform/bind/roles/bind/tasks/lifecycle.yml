---
- name: Подготовка и проверка кандидатов BIND без активации
  ansible.builtin.include_tasks: prepare.yml
  when: platform_bind_phase == 'prepare'

- name: Активировать ранее проверенные конфигурации BIND
  ansible.builtin.include_tasks: activate.yml
  when: platform_bind_phase == 'activate'

- name: Проверить работу BIND без изменений
  ansible.builtin.include_tasks: verify.yml
  when: platform_bind_phase == 'verify'

- name: Запустить BIND после активного барьера проверки
  ansible.builtin.include_tasks: start.yml
  when: platform_bind_phase == 'start'
