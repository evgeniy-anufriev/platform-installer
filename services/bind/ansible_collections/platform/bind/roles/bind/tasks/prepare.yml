---
- name: Установить одобренные пакеты BIND из настроенных системных репозиториев
  ansible.builtin.package:
    name: "{{ _platform_bind_repository_packages }}"
    state: present
  vars:
    _platform_bind_repository_packages: >-
      {{ ([platform_bind_package] if platform_resolved_artifact_sources is not defined
          or platform_resolved_artifact_sources.bind.source == 'REPOSITORY' else [])
         + ([platform_bind_utils_package] if platform_resolved_artifact_sources is not defined
          or platform_resolved_artifact_sources['bind-utils'].source == 'REPOSITORY' else []) }}
  when: _platform_bind_repository_packages | length > 0

- name: Создать каталоги платформы BIND для файлов-кандидатов и файлов среды выполнения
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: named
    group: named
    mode: '0750'
  loop:
    - "{{ platform_bind_primary_zone_directory }}"
    - "{{ platform_bind_secondary_zone_directory }}"

- name: Выбрать локальное развертывание BIND для рендеринга на уровне параметров
  ansible.builtin.set_fact:
    platform_bind_options_deployment: >-
      {{ platform_desired_state.serviceDeployments | dict2items |
         selectattr('value.serviceType', 'equalto', 'bind') |
         selectattr('key', 'in', platform_deployments) | first }}

- name: Инициализация существующей карты владения основной зоной
  ansible.builtin.set_fact:
    _platform_bind_existing_primary_zone_by_deployment: {}

- name: Восстановить прерванную полную замену зоны перед любыми новыми изменениями BIND
  ansible.builtin.include_tasks: recover_primary_zone.yml
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    platform_bind_inspected_deployment: "{{ item }}"
  when: platform_deployments[item.key].roles | first == 'primary'

- name: Проверка существующего состояния основной зоны перед рендерингом кандидата
  ansible.builtin.include_tasks: inspect_primary_zone.yml
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    platform_bind_inspected_deployment: "{{ item }}"
  when: platform_deployments[item.key].roles | first == 'primary'

- name: "Сформировать файл-кандидат параметров BIND"
  ansible.builtin.template:
    src: platform-installer-options.conf.j2
    dest: "{{ platform_bind_options_include_file }}.candidate"
    owner: root
    group: named
    mode: '0640'
  register: _platform_bind_options_candidate

- name: Отрисовка кандидатов зон BIND для каждого локального развертывания
  ansible.builtin.template:
    src: platform-installer.conf.j2
    dest: "{{ platform_bind_include_file }}.candidate"
    owner: root
    group: named
    mode: '0640'
  vars:
    platform_bind_deployment: "{{ item }}"
    platform_bind_zone_projection: "{{ platform_bind_resolved_zones[item.key] }}"
    platform_bind_zone_file: >-
      {{ platform_bind_primary_zone_directory ~ '/' ~ platform_bind_resolved_zones[item.key].zone ~ '.zone'
         if platform_deployments[item.key].roles | first == 'primary'
         else platform_bind_secondary_zone_directory ~ '/' ~ platform_bind_resolved_zones[item.key].zone ~ '.zone' }}
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  register: _platform_bind_zones_candidate

- name: "Сформировать файл-кандидат основной зоны BIND"
  ansible.builtin.template:
    src: zone.j2
    dest: "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[item.key].zone }}.zone.candidate"
    owner: named
    group: named
    mode: '0640'
  vars:
    platform_bind_deployment: "{{ item }}"
    platform_bind_zone_projection: "{{ platform_bind_resolved_zones[item.key] }}"
    platform_bind_zone_serial: "{{ platform_bind_runtime_projection.generatedState.serviceDeployments[item.key].dns.currentSerial }}"
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  when:
    - platform_deployments[item.key].roles | first == 'primary'
    - >-
      not (_platform_bind_existing_primary_zone_by_deployment[item.key] | default(false) | bool) or
      (platform_bind_full_reconcile | default(false) | bool)
  register: _platform_bind_primary_zone_candidate

- name: Проверка основных конфигураций активного и предыдущего кандидата BIND
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - "{{ platform_bind_distribution_config }}"
    - "{{ platform_bind_candidate_main_config }}"
  register: _platform_bind_main_config_stats

- name: Определить, требуется ли сборка-кандидат BIND
  ansible.builtin.set_fact:
    platform_bind_candidate_rebuild_required: >-
      {{ _platform_bind_options_candidate.changed or
         _platform_bind_zones_candidate.changed or
         (_platform_bind_primary_zone_candidate.results | default([]) | selectattr('changed') | list | length > 0) or
         not _platform_bind_main_config_stats.results[1].stat.exists or
         _platform_bind_main_config_stats.results[0].stat.checksum != _platform_bind_main_config_stats.results[1].stat.checksum }}

- name: "Скопировать штатную конфигурацию BIND в проверяемый набор файлов"
  ansible.builtin.copy:
    src: "{{ platform_bind_distribution_config }}"
    dest: "{{ platform_bind_candidate_main_config }}"
    remote_src: true
    owner: root
    group: named
    mode: '0640'
  when: platform_bind_candidate_rebuild_required

- name: Удалить устаревшие недопустимые параметры верхнего уровня платформы из кандидата
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?ms)^// BEGIN Platform Installer NET-03 authoritative-only options.*?^// END Platform Installer NET-03 authoritative-only options\n?'
    replace: ''
  when: platform_bind_candidate_rebuild_required

- name: Удалить директивы платформы и кандидата на распространение, замененные фрагментом параметров
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?m)^[ \t]*(listen-on port 53|allow-query|recursion)[^\n]*\n'
    replace: ''
  when: platform_bind_candidate_rebuild_required

- name: Удалить предыдущие параметры платформы, включаемые из кандидата
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?m)^[ \t]*include "{{ platform_bind_options_include_file | regex_escape }}(?:[.]candidate)?";[ \t]*\r?\n?'
    replace: ''
  when: platform_bind_candidate_rebuild_required

- name: Удалить предыдущие зоны платформы из кандидата
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?m)^[ \t]*include "{{ platform_bind_include_file | regex_escape }}(?:[.]candidate)?";[ \t]*\r?\n?'
    replace: ''
  when: platform_bind_candidate_rebuild_required

- name: Проверка привязки параметров BIND в конфигурации-кандидате
  ansible.builtin.slurp:
    src: "{{ platform_bind_candidate_main_config }}"
  register: _platform_bind_candidate_main
  when: platform_bind_candidate_rebuild_required

- name: Перед вставкой кандидата требуется ровно одна привязка параметров BIND
  ansible.builtin.assert:
    that:
      - (_platform_bind_candidate_main.content | b64decode | regex_findall('(?m)^\\s*options\\s*\\{\\s*$') | length) == 1
    fail_msg: BIND_OPTIONS_ANCHOR_INVALID
  when: platform_bind_candidate_rebuild_required

- name: "Подключить подготовленный файл параметров в блок options BIND"
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?m)^([ \t]*options[ \t]*\{[ \t]*)$'
    replace: '\g<1>\n    include "{{ platform_bind_options_include_file }}.candidate";'
  when: platform_bind_candidate_rebuild_required

- name: Проверка конфигурации кандидата после включения опций
  ansible.builtin.slurp:
    src: "{{ platform_bind_candidate_main_config }}"
  register: _platform_bind_candidate_with_options

- name: "Проверить подключение файла параметров непосредственно в блоке options"
  ansible.builtin.assert:
    that:
      - (_platform_bind_candidate_with_options.content | b64decode | regex_findall('(?m)^[ \t]*include "' ~ (platform_bind_options_include_file | regex_escape) ~ '[.]candidate";[ \t]*$') | length) == 1
      - >-
        (_platform_bind_candidate_with_options.content | b64decode |
        regex_findall('(?ms)^[ \t]*options[ \t]*\{[ \t]*\n[ \t]*include "' ~
         (platform_bind_options_include_file | regex_escape) ~ '[.]candidate";')) | length == 1
    fail_msg: BIND_OPTIONS_INCLUDE_CONTEXT_INVALID

- name: "Подключить подготовленные зоны на верхнем уровне конфигурации BIND"
  ansible.builtin.replace:
    path: "{{ platform_bind_candidate_main_config }}"
    regexp: '(?s)\Z'
    replace: '\ninclude "{{ platform_bind_include_file }}.candidate";\n'
  when: platform_bind_candidate_rebuild_required

- name: Проверка полной структуры конфигурации-кандидата
  ansible.builtin.slurp:
    src: "{{ platform_bind_candidate_main_config }}"
  register: _platform_bind_candidate_complete

- name: Утвердить полную структуру включения кандидата
  ansible.builtin.assert:
    that:
      - (_platform_bind_candidate_complete.content | b64decode | regex_findall('(?m)^[ \t]*include "' ~ (platform_bind_include_file | regex_escape) ~ '[.]candidate";[ \t]*$') | length) == 1
      - (_platform_bind_candidate_complete.content | b64decode | regex_findall('(?m)^[ \t]*include "' ~ (platform_bind_options_include_file | regex_escape) ~ '[.]candidate";[ \t]*$') | length) == 1
      - _platform_bind_candidate_complete.content | b64decode is not regex('(?m)^[ \t]*include "' ~ (platform_bind_options_include_file | regex_escape) ~ '[.]candidate";[ \t]*$\\n?\\Z')
    fail_msg: BIND_CANDIDATE_INCLUDE_STRUCTURE_INVALID

- name: Проверка полного графа конфигурации-кандидата BIND
  ansible.builtin.command:
    argv: ["{{ platform_bind_checkconf_binary }}", "{{ platform_bind_candidate_main_config }}"]
  changed_when: false

- name: Проверка основной зоны-кандидата BIND с помощью встроенных инструментов
  ansible.builtin.command:
    argv: ["{{ platform_bind_checkzone_binary }}", "{{ platform_bind_resolved_zones[item.key].zone }}", "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[item.key].zone }}.zone.candidate"]
  changed_when: false
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  when:
    - platform_deployments[item.key].roles | first == 'primary'
    - >-
      not (_platform_bind_existing_primary_zone_by_deployment[item.key] | default(false) | bool) or
      (platform_bind_full_reconcile | default(false) | bool)
