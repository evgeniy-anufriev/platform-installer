---
- name: Determine whether BIND is already active
  ansible.builtin.command:
    argv: ["systemctl", "is-active", "--quiet", "{{ platform_bind_service_name }}"]
  changed_when: false
  failed_when: false
  register: _platform_bind_service_active

- name: Reload active BIND after changed active artifacts
  ansible.builtin.systemd_service:
    name: "{{ platform_bind_service_name }}"
    state: reloaded
  when:
    - _platform_bind_service_active.rc == 0
    - platform_bind_active_artifacts_changed | default(false) | bool

- name: Enable and start inactive BIND after cluster-wide active validation
  ansible.builtin.systemd_service:
    name: "{{ platform_bind_service_name }}"
    enabled: true
    state: started
  when: _platform_bind_service_active.rc != 0

- name: Add or update only the base-owned authoritative A records
  ansible.builtin.include_tasks: update_base_zone_records.yml
  loop: "{{ platform_bind_resolved_zones | dict2items | selectattr('key', 'in', platform_deployments) | list }}"
  loop_control:
    loop_var: platform_bind_base_zone
    label: "{{ platform_bind_base_zone.key }}"
  when: platform_deployments[platform_bind_base_zone.key].roles | first == 'primary'
