---
- name: Применить каждую нужную базовую запись A, не удаляя других владельцев
  ansible.builtin.include_tasks: update_a_record.yml
  vars:
    platform_bind_a_record:
      zone: "{{ platform_bind_base_zone.value.zone }}"
      owner: "{{ item.owner }}"
      addresses: "{{ item['values'] }}"
      ttl: "{{ platform_bind_base_zone.value.defaultTtl | int }}"
  loop: "{{ platform_bind_base_zone.value.records | selectattr('type', 'equalto', 'A') | list }}"
  loop_control:
    label: "{{ item.owner }}"
