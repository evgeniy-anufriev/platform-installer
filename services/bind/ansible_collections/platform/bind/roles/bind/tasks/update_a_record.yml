---
- name: Validate resolved DNS A-record update input
  ansible.builtin.assert:
    that:
      - platform_bind_a_record is mapping
      - platform_bind_a_record.zone is string
      - platform_bind_a_record.zone is match('^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
      - platform_bind_a_record.owner is string
      - platform_bind_a_record.owner is match('^(?=.{1,254}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}\.$')
      - platform_bind_a_record.owner.endswith('.' ~ platform_bind_a_record.zone ~ '.')
      - platform_bind_a_record.addresses is sequence
      - platform_bind_a_record.addresses is not string
      - platform_bind_a_record.addresses | length > 0
      - platform_bind_a_record.addresses | unique | length == platform_bind_a_record.addresses | length
      - >-
        platform_bind_a_record.ttl is integer or
        (platform_bind_a_record.ttl is string and platform_bind_a_record.ttl is match('^[0-9]+$'))
      - platform_bind_a_record.ttl | int >= 1
      - platform_bind_a_record.ttl | int <= 2147483647
    fail_msg: BIND_DNS_A_RECORD_UPDATE_INPUT_INVALID

- name: Validate each resolved DNS A-record IPv4 address
  ansible.builtin.assert:
    that:
      - platform_bind_a_record_address is string
      - platform_bind_a_record_address is match('^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$')
    fail_msg: BIND_DNS_A_RECORD_UPDATE_ADDRESS_INVALID
  loop: "{{ platform_bind_a_record.addresses | default([]) }}"
  loop_control:
    loop_var: platform_bind_a_record_address
    label: Validate DNS A-record IPv4 address

- name: Read current authoritative A record from local primary
  ansible.builtin.command:
    argv:
      - dig
      - "@127.0.0.1"
      - "{{ platform_bind_a_record.owner }}"
      - A
      - +norecurse
      - +noall
      - +answer
      - +comments
  register: _platform_bind_a_record_current
  changed_when: false
  failed_when: >-
    _platform_bind_a_record_current.rc != 0 or
    'flags: qr aa' not in _platform_bind_a_record_current.stdout or
    not ('status: NOERROR' in _platform_bind_a_record_current.stdout or
         'status: NXDOMAIN' in _platform_bind_a_record_current.stdout)

- name: Collect existing authoritative answer records for the exact owner
  ansible.builtin.set_fact:
    _platform_bind_a_record_current_answer_lines: >-
      {{ _platform_bind_a_record_current.stdout_lines |
         select('search', 'IN') | list }}

- name: Reject CNAME or foreign-owner answer before changing the A record
  ansible.builtin.assert:
    that:
      - platform_bind_a_record_answer.split() | length == 5
      - platform_bind_a_record_answer.split()[0] | lower == platform_bind_a_record.owner | lower
      - platform_bind_a_record_answer.split()[2] | upper == 'IN'
      - platform_bind_a_record_answer.split()[3] | upper == 'A'
    fail_msg: BIND_DNS_A_RECORD_EXISTING_RECORD_CONFLICT
  loop: "{{ _platform_bind_a_record_current_answer_lines }}"
  loop_control:
    loop_var: platform_bind_a_record_answer
    label: Validate existing authoritative A-record answer

- name: Normalize current and desired A record sets
  ansible.builtin.set_fact:
    _platform_bind_a_record_current_addresses: []
    _platform_bind_a_record_desired_addresses: []

- name: Add current DNS answer fields to the exact comparison set
  ansible.builtin.set_fact:
    _platform_bind_a_record_current_addresses: >-
      {{ _platform_bind_a_record_current_addresses +
         [(platform_bind_a_record_answer.split()[1] | string) ~ ' IN A ' ~
          platform_bind_a_record_answer.split()[4]] }}
  loop: "{{ _platform_bind_a_record_current_answer_lines }}"
  loop_control:
    loop_var: platform_bind_a_record_answer
    label: Normalize current DNS A-record answer

- name: Build exact desired A record set including TTL
  ansible.builtin.set_fact:
    _platform_bind_a_record_desired_addresses: >-
      {{ _platform_bind_a_record_desired_addresses +
         [(platform_bind_a_record.ttl | string) ~ ' IN A ' ~ platform_bind_a_record_address] }}
  loop: "{{ platform_bind_a_record.addresses | sort }}"
  loop_control:
    loop_var: platform_bind_a_record_address
    label: Add desired A-record IPv4 to comparison set

- name: Apply exact A record through BIND local dynamic update
  ansible.builtin.command:
    argv: [nsupdate, -l]
    stdin: |-
      zone {{ platform_bind_a_record.zone }}.
      update delete {{ platform_bind_a_record.owner }} A
      {% for address in platform_bind_a_record.addresses | sort %}
      update add {{ platform_bind_a_record.owner }} {{ platform_bind_a_record.ttl }} A {{ address }}
      {% endfor %}
      send
  register: _platform_bind_a_record_update
  changed_when: true
  when: >-
    (_platform_bind_a_record_current_addresses != _platform_bind_a_record_desired_addresses) or
    (platform_bind_force_dynamic_update_probe | default(false) | bool)

- name: Re-read A record after update
  ansible.builtin.command:
    argv:
      - dig
      - "@127.0.0.1"
      - "{{ platform_bind_a_record.owner }}"
      - A
      - +norecurse
      - +noall
      - +answer
      - +comments
  register: _platform_bind_a_record_after
  changed_when: false
  when: _platform_bind_a_record_update is not skipped

- name: Normalize A record set after dynamic update
  ansible.builtin.set_fact:
    _platform_bind_a_record_after_answer_lines: >-
      {{ _platform_bind_a_record_after.stdout_lines |
         select('search', 'IN') | list }}
    _platform_bind_a_record_after_addresses: []
  when: _platform_bind_a_record_update is not skipped

- name: Normalize each DNS A-record answer after dynamic update
  ansible.builtin.set_fact:
    _platform_bind_a_record_after_addresses: >-
      {{ _platform_bind_a_record_after_addresses +
         [(platform_bind_a_record_answer.split()[1] | string) ~ ' IN A ' ~
          platform_bind_a_record_answer.split()[4]] }}
  loop: "{{ _platform_bind_a_record_after_answer_lines | default([]) }}"
  loop_control:
    loop_var: platform_bind_a_record_answer
    label: Normalize updated DNS A-record answer
  when: _platform_bind_a_record_update is not skipped

- name: Verify exact authoritative A record set after update
  ansible.builtin.assert:
    that:
      - _platform_bind_a_record_after.rc == 0
      - "'flags: qr aa' in _platform_bind_a_record_after.stdout"
      - "'status: NOERROR' in _platform_bind_a_record_after.stdout"
      - _platform_bind_a_record_after_addresses == _platform_bind_a_record_desired_addresses
    fail_msg: BIND_DNS_A_RECORD_UPDATE_VERIFY_FAILED
  when: _platform_bind_a_record_update is not skipped
