---
- name: Проверка разрешенного исходного списка записей DNS
  ansible.builtin.assert:
    that:
      - platform_bind_source_dns_records is sequence
      - platform_bind_source_dns_records is not string
    fail_msg: BIND_DNS_A_RECORD_UPDATE_INPUT_INVALID

- name: Применить каждую точную область первичной и зоны один раз
  ansible.builtin.include_tasks: update_a_records.yml
  vars:
    platform_bind_a_records: "{{ item.1 }}"
  loop: "{{ platform_bind_source_dns_records | groupby('bindDeploymentId') | map('last') | map('groupby', 'zone') | list | flatten(levels=1) }}"
  when:
    - item.1[0].bindDeploymentId in (platform_deployments | default({}))
    - platform_deployments[item.1[0].bindDeploymentId].roles | default([]) == ['primary']
