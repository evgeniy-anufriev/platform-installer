---
- name: Замена существующих основных зон только во время явного полного согласования
  ansible.builtin.include_tasks: reconcile_primary_zone.yml
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    platform_bind_inspected_deployment: "{{ item }}"
  when:
    - platform_bind_full_reconcile | default(false) | bool
    - platform_deployments[item.key].roles | first == 'primary'
    - _platform_bind_existing_primary_zone_by_deployment[item.key] | default(false) | bool

- name: Атомарная установка проверенного фрагмента параметров платформы BIND
  ansible.builtin.copy:
    src: "{{ platform_bind_options_include_file }}.candidate"
    dest: "{{ platform_bind_options_include_file }}"
    remote_src: true
    owner: root
    group: named
    mode: '0640'
  register: _platform_bind_options_install

- name: Атомарная установка проверенного фрагмента зон платформы BIND
  ansible.builtin.copy:
    src: "{{ platform_bind_include_file }}.candidate"
    dest: "{{ platform_bind_include_file }}"
    remote_src: true
    owner: root
    group: named
    mode: '0640'
  register: _platform_bind_zones_install

- name: Атомарная установка проверенной основной зоны BIND
  ansible.builtin.copy:
    src: "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[item.key].zone }}.zone.candidate"
    dest: "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[item.key].zone }}.zone"
    remote_src: true
    owner: named
    group: named
    mode: '0640'
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  register: _platform_bind_zone_install
  when:
    - platform_deployments[item.key].roles | first == 'primary'
    - not (_platform_bind_existing_primary_zone_by_deployment[item.key] | default(false) | bool)

- name: Установка точного проверенного кандидата в качестве активной основной конфигурации BIND
  ansible.builtin.copy:
    src: "{{ platform_bind_candidate_main_config }}"
    dest: "{{ platform_bind_distribution_config }}"
    remote_src: true
    owner: root
    group: named
    mode: '0640'
  register: _platform_bind_main_config_install

- name: Проверка активной конфигурации BIND перед запуском или перечитыванием
  ansible.builtin.command:
    argv: ["{{ platform_bind_checkconf_binary }}", "{{ platform_bind_distribution_config }}"]
  changed_when: false

- name: Сравнение активной основной конфигурации BIND с проверенным кандидатом
  ansible.builtin.shell: >-
    sha256sum "{{ platform_bind_candidate_main_config }}" "{{ platform_bind_distribution_config }}" |
    awk '{print $1}' | uniq | wc -l | grep -qx 1
  args:
    executable: /bin/bash
  changed_when: false
  register: _platform_bind_active_checksum
  failed_when: _platform_bind_active_checksum.rc != 0

- name: Проверка активной основной зоны BIND перед запуском или перечитыванием
  ansible.builtin.command:
    argv: ["{{ platform_bind_checkzone_binary }}", "{{ platform_bind_resolved_zones[item.key].zone }}", "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[item.key].zone }}.zone"]
  changed_when: false
  loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'bind') | selectattr('key', 'in', platform_deployments) | list }}"
  when: platform_deployments[item.key].roles | first == 'primary'

- name: Фиксация изменения активных файлов BIND
  ansible.builtin.set_fact:
    platform_bind_active_artifacts_changed: >-
      {{ _platform_bind_options_install.changed or
         _platform_bind_zones_install.changed or
         _platform_bind_main_config_install.changed or
         (_platform_bind_zone_install.results | default([]) | selectattr('changed') | list | length > 0) }}
