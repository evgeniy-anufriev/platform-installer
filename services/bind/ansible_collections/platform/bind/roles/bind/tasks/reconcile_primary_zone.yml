---
- name: Определение служебного runtime-маркера основной зоны BIND
  ansible.builtin.set_fact:
    _platform_bind_zone_recovery_marker: >-
      {{ platform_bind_recovery_directory }}/{{ platform_bind_runtime_projection.generatedState.metadata.projectId | hash('sha256') }}/{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone | hash('sha256') }}.yml

- name: "Заморозка и замена основной зоны с возможностью восстановления после сбоя"
  block:
    - name: "Создание защищённого каталога восстановления зоны BIND"
      ansible.builtin.file:
        path: "{{ _platform_bind_zone_recovery_marker | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Сохранение маркера восстановления основной зоны перед фиксацией
      ansible.builtin.copy:
        content: >-
          {{ {'projectId': platform_bind_runtime_projection.generatedState.metadata.projectId,
              'deploymentId': platform_bind_inspected_deployment.key,
              'zone': platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone,
              'phase': 'freeze-requested'} | to_nice_yaml(indent=2) }}
        dest: "{{ _platform_bind_zone_recovery_marker }}"
        owner: root
        group: root
        mode: '0600'

    - name: Заморозка основной зоны после проверки кандидата
      ansible.builtin.command:
        argv: ["{{ platform_bind_rndc_binary }}", freeze, "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}"]
      changed_when: true

    - name: "Повторное чтение серийного номера SOA после блокировки динамических обновлений зоны"
      ansible.builtin.command:
        argv: [dig, "@127.0.0.1", "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}", SOA, +short]
      changed_when: false
      register: _platform_bind_frozen_live_soa

    - name: Проверка увеличения серийного номера новой зоны относительно замороженной активной зоны
      ansible.builtin.assert:
        that:
          - _platform_bind_frozen_live_soa.rc == 0
          - _platform_bind_frozen_live_soa.stdout.split() | length >= 3
          - >-
            platform_bind_runtime_projection.generatedState.serviceDeployments[platform_bind_inspected_deployment.key].dns.currentSerial | int >
            (_platform_bind_frozen_live_soa.stdout.split()[2] | int)
        fail_msg: BIND_FULL_RECONCILE_SERIAL_RACE

    - name: Установка полного канонического кандидата зоны полного согласования
      ansible.builtin.copy:
        src: "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}.zone.candidate"
        dest: "{{ platform_bind_primary_zone_directory }}/{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}.zone"
        remote_src: true
        owner: named
        group: named
        mode: '0640'

  always:
    - name: Проверка того, остался ли маркер восстановления основной зоны
      ansible.builtin.stat:
        path: "{{ _platform_bind_zone_recovery_marker }}"
        get_mime: false
        get_attributes: false
        get_checksum: false
      register: _platform_bind_zone_recovery_after_attempt

    - name: Попытка разморозки отмеченной основной зоны при любом исходе
      ansible.builtin.command:
        argv: ["{{ platform_bind_rndc_binary }}", thaw, "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}"]
      changed_when: false
      failed_when: false
      register: _platform_bind_zone_always_thaw
      when: _platform_bind_zone_recovery_after_attempt.stat.exists

- name: Проверка авторитетного SOA-ответа основной зоны после замены
  ansible.builtin.command:
    argv: [dig, "@127.0.0.1", "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}", SOA, +norecurse, +noall, +answer, +comments]
  changed_when: false
  register: _platform_bind_zone_reconcile_authority
  failed_when: >-
    _platform_bind_zone_reconcile_authority.rc != 0 or
    'status: NOERROR' not in _platform_bind_zone_reconcile_authority.stdout or
    'flags: qr aa' not in _platform_bind_zone_reconcile_authority.stdout

- name: Проверка того, что замененная основная зона принимает локальные динамические обновления
  ansible.builtin.include_tasks: update_a_record.yml
  vars:
    platform_bind_force_dynamic_update_probe: true
    platform_bind_a_record:
      zone: "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].zone }}"
      owner: "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].primary.fqdn }}."
      addresses: ["{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].primary.address }}"]
      ttl: "{{ platform_bind_resolved_zones[platform_bind_inspected_deployment.key].defaultTtl | int }}"

- name: Удаление маркера восстановления после проверки зоны и динамических обновлений
  ansible.builtin.file:
    path: "{{ _platform_bind_zone_recovery_marker }}"
    state: absent
