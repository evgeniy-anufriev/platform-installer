---
- name: Разрешить пакеты PostgreSQL из репозитория RED OS 7.3 без их установки
  hosts: all
  gather_facts: true
  vars:
    platform_postgresql_mode: pg_auto_failover
  tasks:
    - name: Требуется цель RED OS 7.3
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution_version is version('7.3', '>=')
          - ansible_facts.distribution_version is version('8.0', '<')

    - name: Разрешение масок пакетов с помощью роли PostgreSQL
      ansible.builtin.include_role:
        name: platform.postgresql.postgresql
        tasks_from: resolve_packages

    - name: Требуются пакеты репозитория PostgreSQL 16 и pg_auto_failover 16
      ansible.builtin.assert:
        that:
          - _platform_postgresql_repository_packages | select('match', '^postgresql16-16[.]14-') | list | length == 1
          - _platform_postgresql_repository_packages | select('match', '^postgresql16-server-16[.]14-') | list | length == 1
          - _platform_postgresql_repository_packages | select('match', '^postgresql16-contrib-16[.]14-') | list | length == 1
          - _platform_postgresql_failover_repository_package | select('match', '^pg_auto_failover-16-2[.]2-') | list | length == 1
