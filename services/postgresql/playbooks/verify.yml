---
- import_playbook: ../../../ansible-core/playbooks/pki-verify.yml

- name: Проверить PostgreSQL без изменений
  hosts: platform_targets
  become: true
  gather_facts: false
  pre_tasks:
    - name: Применить конфигурацию доверенной среды выполнения PostgreSQL
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.postgresql.postgresql
      platform_postgresql_verify_only: true
