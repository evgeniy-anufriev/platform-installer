---
- import_playbook: ../../../ansible-core/playbooks/validate-infrastructure.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Определение порядка подготовки экземпляров PostgreSQL
  hosts: platform_targets
  gather_facts: false
  tasks:
    - name: Применение конфигурации доверенной среды выполнения PostgreSQL
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
    - name: Группировка монитора перед экземплярами данных PostgreSQL
      ansible.builtin.group_by:
        key: >-
          {{ 'platform_postgresql_monitor_targets'
             if (platform_postgresql_instances | default([])
                 | selectattr('host', 'equalto', inventory_hostname)
                 | selectattr('roles', 'contains', 'monitor') | list | length > 0)
             else 'platform_postgresql_data_targets' }}
      changed_when: false

- name: Подготовка монитора PostgreSQL до регистрации экземпляров данных
  hosts: platform_postgresql_monitor_targets
  serial: 1
  any_errors_fatal: true
  become: true
  gather_facts: true
  roles:
    - role: platform.postgresql.postgresql
      platform_postgresql_verify_only: false

- name: Применение экземпляров данных и standalone PostgreSQL
  hosts: platform_postgresql_data_targets
  serial: 1
  become: true
  gather_facts: true
  roles:
    - role: platform.postgresql.postgresql
      platform_postgresql_verify_only: false
