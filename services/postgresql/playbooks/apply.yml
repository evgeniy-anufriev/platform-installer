---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Apply PostgreSQL
  hosts: platform_targets
  serial: 1
  become: true
  gather_facts: true
  pre_tasks:
    - name: Apply trusted runtime PostgreSQL configuration
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
  roles:
    - role: platform.postgresql.postgresql
      platform_postgresql_verify_only: false

- import_playbook: ../../integrations/playbooks/reconcile.yml
  vars:
    platform_integration_source_service_types: [postgresql]
