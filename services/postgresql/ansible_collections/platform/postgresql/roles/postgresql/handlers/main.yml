---
- name: Перечитывание конфигурации PostgreSQL для применения TLS-файлов
  ansible.builtin.command:
    argv: ["{{ platform_postgresql_binary_directory }}/pg_ctl", reload, -D, "{{ platform_postgresql_data_directory }}"]
  become_user: "{{ platform_postgresql_user }}"
  changed_when: true

- name: Перезапуск PostgreSQL
  ansible.builtin.systemd:
    name: "{{ _platform_postgresql_unit_name }}"
    state: restarted
