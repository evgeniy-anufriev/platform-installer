---
- name: Выбор действующего плана PKI-01 для PostgreSQL
  ansible.builtin.include_role:
    name: platform.core.pki_materialize
    tasks_from: select_consumer_plan.yml
  vars:
    platform_pki_consumer_tls_profile_id: "{{ platform_postgresql_tls_profile }}"

- name: Определение каталога TLS-файлов PostgreSQL
  ansible.builtin.set_fact:
    _platform_postgresql_tls_directory: "{{ platform_postgresql_config_directory }}/pki"

- name: Проверка подготовленных PEM-файлов PostgreSQL
  ansible.builtin.stat:
    path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  register: platform_postgresql_tls_files
  when: not (platform_postgresql_verify_only | bool)

- name: Проверка наличия всех подготовленных PEM-файлов PostgreSQL
  ansible.builtin.assert:
    that: platform_postgresql_tls_files.results | map(attribute='stat.exists') | list | min
    fail_msg: POSTGRES_PKI_MATERIALIZATION_REQUIRED
  when: not (platform_postgresql_verify_only | bool)
