- name: Проверка имён пакетов PostgreSQL старого формата по маскам версии
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --available
      - --latest-limit=1
      - --queryformat
      - "%{name}-%{version}-%{release}.%{arch}"
      - "postgresql-{{ platform_postgresql_version }}-*.x86_64"
      - "postgresql-server-{{ platform_postgresql_version }}-*.x86_64"
      - "postgresql-contrib-{{ platform_postgresql_version }}-*.x86_64"
  register: _platform_postgresql_legacy_package_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['postgresql-runtime'].source == 'REPOSITORY'

- name: "Проверка имён пакетов PostgreSQL с указанием основной версии"
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --available
      - --latest-limit=1
      - --queryformat
      - "%{name}-%{version}-%{release}.%{arch}"
      - "postgresql{{ platform_postgresql_version.split('.')[0] }}-{{ platform_postgresql_version }}-*.x86_64"
      - "postgresql{{ platform_postgresql_version.split('.')[0] }}-server-{{ platform_postgresql_version }}-*.x86_64"
      - "postgresql{{ platform_postgresql_version.split('.')[0] }}-contrib-{{ platform_postgresql_version }}-*.x86_64"
  register: _platform_postgresql_major_package_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['postgresql-runtime'].source == 'REPOSITORY'

- name: Выбор доступного семейства пакетов PostgreSQL, не меняя запрошенную версию
  ansible.builtin.set_fact:
    _platform_postgresql_repository_packages: >-
      {{ (_platform_postgresql_legacy_package_probe.stdout_lines | default([])
          if (_platform_postgresql_legacy_package_probe.stdout_lines | default([]) | length == 3)
          else _platform_postgresql_major_package_probe.stdout_lines | default([])) }}
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['postgresql-runtime'].source == 'REPOSITORY'

- name: Проверка наличия всех пакетов PostgreSQL из одного семейства имён
  ansible.builtin.assert:
    that: _platform_postgresql_repository_packages | length == 3
    fail_msg: POSTGRES_PACKAGE_FAMILY_UNAVAILABLE
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['postgresql-runtime'].source == 'REPOSITORY'

- name: "Проверка имени пакета pg_auto_failover с указанием основной версии PostgreSQL"
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --available
      - --latest-limit=1
      - --queryformat
      - "%{name}-%{version}-%{release}.%{arch}"
      - "pg_auto_failover-{{ platform_postgresql_version.split('.')[0] }}-{{ platform_postgresql_pg_auto_failover_version }}-*.x86_64"
  register: _platform_postgresql_major_failover_package_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_postgresql_mode == 'pg_auto_failover'
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['pg-auto-failover'].source == 'REPOSITORY'

- name: Проверка имени устаревшего пакета pg_auto_failover по маске версии
  ansible.builtin.command:
    argv:
      - dnf
      - -q
      - repoquery
      - --available
      - --latest-limit=1
      - --queryformat
      - "%{name}-%{version}-%{release}.%{arch}"
      - "pg_auto_failover-{{ platform_postgresql_pg_auto_failover_version }}-*.x86_64"
  register: _platform_postgresql_legacy_failover_package_probe
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_postgresql_mode == 'pg_auto_failover'
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['pg-auto-failover'].source == 'REPOSITORY'

- name: Выбор доступного пакета pg_auto_failover по основной версии PostgreSQL
  ansible.builtin.set_fact:
    _platform_postgresql_failover_repository_package: >-
      {{ (_platform_postgresql_major_failover_package_probe.stdout_lines | default([])
          if (_platform_postgresql_major_failover_package_probe.stdout_lines | default([]) | length == 1)
          else _platform_postgresql_legacy_failover_package_probe.stdout_lines | default([])) }}
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_postgresql_mode == 'pg_auto_failover'
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['pg-auto-failover'].source == 'REPOSITORY'

- name: "Проверка наличия требуемого pg_auto_failover в настроенном репозитории"
  ansible.builtin.assert:
    that: _platform_postgresql_failover_repository_package | length == 1
    fail_msg: POSTGRES_FAILOVER_PACKAGE_UNAVAILABLE
  when:
    - ansible_facts.pkg_mgr | default('') == 'dnf'
    - not (platform_postgresql_verify_only | bool)
    - platform_postgresql_mode == 'pg_auto_failover'
    - platform_resolved_artifact_sources is not defined or
      platform_resolved_artifact_sources['pg-auto-failover'].source == 'REPOSITORY'
