---
- name: Validate bounded resolved inputs including manual inventory
  ansible.builtin.assert:
    that: platform_postgresql_application_job | platform.postgresql.application_validate_provider_job
    fail_msg: APPLICATION_PROVIDER_INPUT_INVALID

- name: Validate protected controller credentials before provider calls
  ansible.builtin.assert:
    that:
      - platform_postgresql_application_job.mode in ['standalone', 'pg_auto_failover']
      - platform_postgresql_application_credential_files | platform.postgresql.application_protected_secret_files(platform_postgresql_application_job.accounts | map(attribute='passwordRef') | list, platform_postgresql_application_secret_root)
    fail_msg: APPLICATION_PROVIDER_SECRET_FILE_INVALID
  when: platform_postgresql_application_job.accounts | length > 0
  no_log: true

- name: Discover the provider once when called directly from manual inventory
  ansible.builtin.include_tasks: discover.yml
  when: platform_postgresql_application_job.providerId not in platform_application_provider_runtime

- name: Preflight resource and account ownership in one maintenance session
  ansible.builtin.command:
    argv: [psql, -X, -h, "{{ platform_postgresql_application_socket }}", -p, "{{ application_provider_target.port }}", -U, "{{ application_provider_os_user }}", -d, postgres, -Atq, -v, ON_ERROR_STOP=1, -f, -]
    stdin: "{{ lookup('ansible.builtin.template', 'preflight.sql.j2') }}"
  vars:
    application_provider_check_objects: true
    application_provider_target: "{{ platform_application_provider_runtime[platform_postgresql_application_job.providerId].candidate }}"
    application_provider_os_user: "{{ hostvars[application_provider_target.hostId].platform_postgresql_user | default(platform_postgresql_user) }}"
  delegate_to: "{{ application_provider_target.hostId }}"
  become: true
  become_user: "{{ application_provider_os_user }}"
  register: application_provider_catalog
  changed_when: false
  no_log: true

- name: Retain safe existing database and account identities
  ansible.builtin.set_fact:
    platform_application_provider_runtime: >-
      {{ platform_application_provider_runtime | combine({platform_postgresql_application_job.providerId:
        platform_application_provider_runtime[platform_postgresql_application_job.providerId] | combine({'catalog': {
          'databases': ((platform_application_provider_runtime[platform_postgresql_application_job.providerId].get('catalog', {}).get('databases', []) + (application_provider_catalog.stdout | from_json).databases) | unique | list),
          'roles': ((platform_application_provider_runtime[platform_postgresql_application_job.providerId].get('catalog', {}).get('roles', []) + (application_provider_catalog.stdout | from_json).roles) | unique | list)}})}) }}
  no_log: true

- name: Require existing TLS material and verified server identity before mutations
  ansible.builtin.command:
    argv: "{{ ['timeout', '--kill-after=2s', '10s', 'openssl', 's_client', '-starttls', 'postgres', '-connect', application_provider_target.address ~ ':' ~ application_provider_target.port, '-CAfile', application_provider_target.pkiPlans[0].targetDirectory ~ '/ca-chain.pem', '-verify_return_error', ('-verify_ip' if application_provider_target.address is match('^[0-9.]+$') else '-verify_hostname'), application_provider_target.address] }}"
    stdin: ''
  vars:
    application_provider_check_objects: true
    application_provider_target: "{{ platform_application_provider_runtime[platform_postgresql_application_job.providerId].candidate }}"
  delegate_to: "{{ application_provider_target.hostId }}"
  become: true
  become_user: "{{ platform_pki_owner | default(platform_execution_technical_user | default('root', true)) }}"
  changed_when: false
  when: platform_postgresql_application_job.accounts | length > 0
  no_log: true

- name: Require schema-only grants when a database is not yet created
  ansible.builtin.assert:
    that: application_provider_database.accounts | map(attribute='grants') | flatten | rejectattr('kind', 'equalto', 'schema') | list | length == 0
    fail_msg: APPLICATION_PROVIDER_MIGRATION_REQUIRED
  loop: "{{ platform_postgresql_application_job.databases }}"
  loop_control:
    loop_var: application_provider_database
  when: application_provider_database.name not in platform_application_provider_runtime[platform_postgresql_application_job.providerId].catalog.databases
  no_log: true

- name: Probe existing account credentials without resetting passwords
  ansible.builtin.include_tasks: login.yml
  vars:
    application_provider_check_objects: true
    application_provider_probe_scope: existing
