apiVersion: platform.installer/service-manifest/v1alpha1
kind: ServiceManifest
metadata:
  id: postgresql
  version: "1.0.0-alpha.1"
  displayName: PostgreSQL
  description: PostgreSQL 16 with standalone and pg_auto_failover modes
  category: database
modes:
  standalone:
    displayName: Standalone
    description: One PostgreSQL data member
    memberRoles: [database]
    placement: {explicit: true, minMembers: 1, maxMembers: 1, distinctHosts: false}
    x-maturity: implemented-postgres-01a
    x-requiredRuntimeSecretSettings: [adminSuperuser]
  pg_auto_failover:
    displayName: pg_auto_failover
    description: One monitor and two PostgreSQL data members
    memberRoles: [monitor, database]
    placement:
      explicit: true
      minMembers: 3
      maxMembers: 3
      distinctHosts: true
      roleCardinality:
        monitor: {minimum: 1, maximum: 1}
        database: {minimum: 2, maximum: 2}
    x-maturity: implemented-postgres-01b
    x-requiredRuntimeSecretSettings: [adminSuperuser, monitorCredential, replicationCredential]
  patroni:
    displayName: Patroni
    description: Deferred compatibility fixture; not implemented by POSTGRES-01
    memberRoles: [database]
    placement: {explicit: true, minMembers: 3, distinctHosts: true}
    x-maturity: deferred
listeners:
  client: {protocol: tcp, defaultPort: 5432, tlsCapable: true, scope: deployment}
endpoint: {}
x-haproxyBackendDefaults: {balance: roundrobin, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
capabilities: [service.postgresql.client, service.postgresql.database, service.postgresql.schema, service.postgresql.account, service.postgresql.database-access]
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    port: {kind: MANAGED, roleVariable: platform_postgresql_port, type: integer, scopes: [deployment, member], validation: {minimum: 1, maximum: 65535}, ui: {label: PostgreSQL port, section: Network, order: 10}}
    clientCidrs:
      kind: MANAGED
      roleVariable: platform_postgresql_client_cidrs
      type: array
      scopes: [deployment, member]
      validation:
        maxItems: 32
        items: {type: string, pattern: '^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(?:[0-9]|[12][0-9]|3[0-2])$'}
      ui: {label: Дополнительные клиентские IPv4 CIDR, section: Network, order: 11, description: Дополняют автоматически определённую подсеть. Доступ только через TLS и SCRAM.}
    dataDirectory: {kind: MANAGED, roleVariable: platform_postgresql_data_directory, type: string, scopes: [deployment, member], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных, section: Хранение, order: 0, description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>/postgres. Существующие данные автоматически не переносятся.}}
    configDirectory: {kind: MANAGED, roleVariable: platform_postgresql_config_directory, type: string, scopes: [deployment, member], validation: {minLength: 1}, ui: {label: Config directory, section: Storage, order: 21}}
    tlsProfile: {kind: MANAGED, roleVariable: platform_postgresql_tls_profile, type: string, scopes: [deployment, member], validation: {minLength: 1}, ui: {label: TLS profile, section: TLS, order: 30, x-referenceKind: TLS_PROFILE}}
    adminSuperuser:
      kind: MANAGED
      roleVariable: platform_postgresql_admin_superuser
      type: object
      scopes: [deployment]
      validation: {required: [username, passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [username, passwordSecretRef]
        properties:
          username: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'}
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Administrator password, section: Administrator, order: 40, x-runtimeSecretRequirement: {requirementRef: postgresql-admin-password, purpose: SERVICE_PASSWORD}}
    monitorCredential:
      kind: MANAGED
      roleVariable: platform_postgresql_monitor_credential
      type: object
      scopes: [deployment]
      validation: {required: [passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [passwordSecretRef]
        properties:
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Monitor credential password, section: High Availability, order: 50, x-runtimeSecretRequirement: {requirementRef: postgresql-monitor-password, purpose: SERVICE_PASSWORD}}
    replicationCredential:
      kind: MANAGED
      roleVariable: platform_postgresql_replication_credential
      type: object
      scopes: [deployment]
      validation: {required: [passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [passwordSecretRef]
        properties:
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Replication credential password, section: High Availability, order: 51, x-runtimeSecretRequirement: {requirementRef: postgresql-replication-password, purpose: SERVICE_PASSWORD}}
    advancedConfig: {kind: ADVANCED, roleVariable: platform_postgresql_advanced_config, type: object, scopes: [deployment], validation: {additionalProperties: true}, ui: {label: Advanced PostgreSQL settings, section: Advanced, order: 90}}
x-reservedAdvancedProperties: [data_directory, port, ssl, ssl_cert_file, ssl_key_file, ssl_ca_file, primary_conninfo, primary_slot_name, shared_preload_libraries, pg_hba_file]
x-dataDirectoryProjection: {deploymentSetting: dataDirectory, rootVariable: platform_data_root_directory, deploymentPathSuffix: postgres, appendMemberIdWhenCoLocated: false}
roleEntrypoints:
  apply: {fqcn: platform.postgresql.postgresql, variablesPrefix: platform_postgresql_, x-memberListVariable: platform_postgresql_instances}
  verify: {fqcn: platform.postgresql.postgresql, variablesPrefix: platform_postgresql_, x-memberListVariable: platform_postgresql_instances}
artifacts: []
compatibilityRef: compatibility.yml
