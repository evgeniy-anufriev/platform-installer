---
platform_kafka_version: "4.3.1"
platform_kafka_application_timeout_ms: 30000
platform_kafka_phase: full
platform_kafka_schema_registry_enabled: true
platform_kafka_schema_registry_kafka_listener: SSL
platform_kafka_schema_registry_http_port: 8081
platform_kafka_schema_registry_https_port: 8082
platform_kafka_schema_registry_version: "8.3.2"
platform_kafka_schema_registry_archive_directory: "confluent-{{ platform_kafka_schema_registry_version }}"
platform_kafka_schema_registry_install_directory: "/opt/confluent-{{ platform_kafka_schema_registry_version }}"
platform_kafka_schema_registry_user: schema-registry
platform_kafka_schema_registry_group: schema-registry
platform_kafka_schema_registry_config_directory: /etc/schema-registry
platform_kafka_schema_registry_log_directory: /var/log/schema-registry
platform_kafka_schema_registry_name: "{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}schema-registry"
platform_kafka_schema_registry_readiness_retries: 60
platform_kafka_schema_registry_readiness_delay: 2
platform_kafka_archive_directory: kafka_2.13-4.3.1
platform_kafka_install_directory: /opt/kafka
platform_kafka_config_directory: /etc/kafka
platform_kafka_config_file: /etc/kafka/server.properties
platform_kafka_data_directory: "{{ platform_data_root_directory | default('/var/lib') }}/{{ platform_kafka_deployment_id }}"
platform_kafka_user: kafka
platform_kafka_group: kafka
platform_kafka_java_package: java-21-openjdk-headless
platform_kafka_tls_profile: infrastructure-tls
# Named listeners are the Kafka service baseline. Deployment and member
# configuration may override this mapping only for non-default listener ports
# or topology.
platform_kafka_listeners:
  PLAINTEXT:
    purpose: client
    securityProtocol: PLAINTEXT
    port: 9092
  SSL:
    purpose: interBroker
    securityProtocol: SSL
    port: 9094
  SASL_SSL:
    purpose: client
    securityProtocol: SASL_SSL
    port: 9096
  CONTROLLER:
    purpose: controller
    securityProtocol: SSL
    port: 9093
platform_kafka_log_retention_hours: 168
platform_kafka_advanced_config: {}
platform_kafka_service_name: kafka
platform_kafka_name: "{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}kafka"
platform_kafka_deployment_id: "{{ platform_execution_service_deployment | default(platform_kafka_service_name, true) }}"
platform_kafka_advertised_host: "{{ ansible_host | default(inventory_hostname) }}"
platform_kafka_verify_only: false
platform_kafka_admin_credential:
  passwordSecretRef: ''
platform_kafka_secret_files: {}
platform_kafka_startup_readiness_retries: 30
platform_kafka_startup_readiness_delay: 2
platform_kafka_instances: []
platform_kafka_log_directory: /var/log/kafka
platform_kafka_quorum_mode: dynamic
platform_kafka_clean_install: false
platform_kafka_confirm_destructive_reset: ''
platform_pki_materialization_plans: []
# Runtime-only mapping SecretRef -> password-file path used by PKI-01.
# Kafka consumer material is copied to platform_kafka_pki_directory instead.
platform_pki_secret_files: {}
platform_kafka_pki_directory: ''
platform_kafka_store_type: PEM
platform_kafka_clear_stop_retries: 15
platform_kafka_clear_stop_delay: 2
