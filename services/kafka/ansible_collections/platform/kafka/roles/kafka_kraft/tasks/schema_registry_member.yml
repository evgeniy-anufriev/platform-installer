---
- name: Определение точного экземпляра службы Kafka PKI для сервера и клиента реестра
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: >-
      {{ (_platform_kafka_instances | selectattr('id', 'equalto', registry_instance.id)
          | selectattr('deployment_id', 'equalto', registry_instance.deployment_id) | first)
         | combine({'config_directory': registry_instance.config_directory, 'tls_profile': registry_instance.tls_profile}) }}

- name: Повторная проверка владения корнем реестра перед подготовкой экземпляра службы
  ansible.builtin.include_tasks: schema_registry_ownership.yml
  vars:
    _platform_kafka_registry_local: "{{ [registry_instance] }}"

- name: Подготовка каталогов экземпляров служб, принадлежащих реестру
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_kafka_schema_registry_user }}"
    group: "{{ platform_kafka_schema_registry_group }}"
    mode: '0700'
  loop: "{{ registry_instance.managed_paths }}"
  when: not platform_kafka_verify_only

- name: Маркировка каждого нового корня экземпляра службы реестра независимо
  ansible.builtin.copy:
    content: "{{ registry_instance.ownership_marker }}\n"
    dest: "{{ item }}/ownership-marker"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ registry_instance.ownership_paths }}"
  when: not platform_kafka_verify_only

- name: Копирование хранилищ PKI в принадлежащие им каталоги времени выполнения реестра
  ansible.builtin.copy:
    src: "{{ _platform_kafka_tls_runtime.targetDirectory }}/{{ item }}"
    dest: "{{ registry_instance.config_directory }}/pki/{{ item }}"
    remote_src: true
    owner: "{{ platform_kafka_schema_registry_user }}"
    group: "{{ platform_kafka_schema_registry_group }}"
    mode: '0600'
  loop: "{{ ['ca-chain.pem', 'materialization-fingerprint'] + (['keystore.p12', 'truststore.p12'] if _platform_kafka_tls_runtime.storeType == 'PKCS12' else []) }}"
  register: _platform_kafka_registry_pki_copy
  no_log: true
  when: not platform_kafka_verify_only

- name: Подготовка или проверка PEM-файлов Schema Registry
  ansible.builtin.include_tasks: pem_identity.yml
  vars:
    kafka_pem_source_directory: "{{ _platform_kafka_tls_runtime.targetDirectory }}"
    kafka_pem_identity_path: "{{ registry_instance.config_directory }}/pki/identity.pem"
    kafka_pem_ca_path: "{{ registry_instance.config_directory }}/pki/ca-chain.pem"
    kafka_pem_owner: "{{ platform_kafka_schema_registry_user }}"
    kafka_pem_group: "{{ platform_kafka_schema_registry_group }}"
    kafka_pem_verify_only: "{{ platform_kafka_verify_only }}"
  when: _platform_kafka_tls_runtime.storeType == 'PEM'

- name: Сохранение сигнала изменения реестра PEM
  ansible.builtin.set_fact:
    _platform_kafka_registry_pem_changed: "{{ _platform_kafka_tls_runtime.storeType == 'PEM' and (_platform_kafka_pem_identity_write.changed | default(false) | bool) }}"
  changed_when: false

- name: Загрузка пароля хранилища только во время выполнения без регистрации
  ansible.builtin.set_fact:
    _platform_kafka_registry_password: >-
      {{ lookup('ansible.builtin.file',
          (platform_pki_secret_files | default(hostvars['localhost'].platform_pki_secret_files | default({}), true))[_platform_kafka_tls_runtime.storePasswordSecretRef]) | trim }}
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12'

- name: "Проверка непустого пароля хранилища Schema Registry"
  ansible.builtin.assert:
    that:
      - _platform_kafka_registry_password | length > 0
    fail_msg: SCHEMA_REGISTRY_STORE_PASSWORD_FORMAT_UNSUPPORTED
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12'

- name: Формирование защищённых файлов настроек Schema Registry и Kafka CLI
  ansible.builtin.template:
    src: "{{ item.source }}"
    dest: "{{ registry_instance.config_directory }}/{{ item.destination }}"
    owner: "{{ platform_kafka_schema_registry_user }}"
    group: "{{ platform_kafka_schema_registry_group }}"
    mode: '0600'
  loop:
    - {source: schema-registry.properties.j2, destination: schema-registry.properties}
    - {source: schema-registry-client.properties.j2, destination: kafka-client.properties}
  register: _platform_kafka_registry_properties
  no_log: true
  diff: false
  when: not platform_kafka_verify_only

- name: Проверка защищенного дайджеста конфигурации реестра без чтения выходных данных
  ansible.builtin.stat:
    path: "{{ registry_instance.config_directory }}/schema-registry.properties"
    checksum_algorithm: sha256
    follow: false
  register: _platform_kafka_registry_properties_state
  no_log: true

- name: Проверка контрольной суммы, владельца и прав конфигурации Schema Registry
  ansible.builtin.assert:
    that:
      - _platform_kafka_registry_properties_state.stat.isreg | default(false)
      - not (_platform_kafka_registry_properties_state.stat.islnk | default(false))
      - _platform_kafka_registry_properties_state.stat.pw_name == platform_kafka_schema_registry_user
      - _platform_kafka_registry_properties_state.stat.mode == '0600'
      - _platform_kafka_registry_properties_state.stat.checksum == (lookup('ansible.builtin.template', 'schema-registry.properties.j2') | hash('sha256'))
    fail_msg: SCHEMA_REGISTRY_CONFIG_DRIFT
  no_log: true

- name: "Проверка или создание служебного топика схем Schema Registry"
  ansible.builtin.include_tasks: schema_registry_topic.yml

- name: Формирование файла службы systemd для Schema Registry
  ansible.builtin.template:
    src: schema-registry.service.j2
    dest: "{{ registry_instance.unit_path }}"
    owner: root
    group: root
    mode: '0644'
  register: _platform_kafka_registry_unit
  when: not platform_kafka_verify_only

- name: Запуск Schema Registry или перезапуск при изменении конфигурации или PKI
  ansible.builtin.systemd:
    name: "{{ registry_instance.unit_name }}"
    daemon_reload: "{{ _platform_kafka_registry_unit.changed }}"
    enabled: true
    state: "{{ 'restarted' if (_platform_kafka_registry_unit.changed or _platform_kafka_registry_properties.changed or _platform_kafka_registry_pki_copy.changed or _platform_kafka_registry_pem_changed) else 'started' }}"
  when: not platform_kafka_verify_only

- name: Проверка файла службы Schema Registry без перехода по символическим ссылкам
  ansible.builtin.stat:
    path: "{{ registry_instance.unit_path }}"
    follow: false
    checksum_algorithm: sha256
  register: _platform_kafka_registry_unit_state

- name: Проверка соответствия unit-файла заданной конфигурации Schema Registry
  ansible.builtin.assert:
    that:
      - _platform_kafka_registry_unit_state.stat.isreg | default(false)
      - not (_platform_kafka_registry_unit_state.stat.islnk | default(false))
      - _platform_kafka_registry_unit_state.stat.checksum == (lookup('ansible.builtin.template', 'schema-registry.service.j2') | hash('sha256'))
    fail_msg: SCHEMA_REGISTRY_UNIT_DRIFT

- name: Проверка того, работает ли служба реестра systemd
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ registry_instance.unit_name }}"]
  changed_when: false
  register: _platform_kafka_registry_active
  retries: "{{ platform_kafka_schema_registry_readiness_retries }}"
  delay: "{{ platform_kafka_schema_registry_readiness_delay }}"
  until: _platform_kafka_registry_active.rc == 0 and _platform_kafka_registry_active.stdout | trim == 'active'

- name: Проверка готовности реестра HTTP и HTTPS без записи схемы
  ansible.builtin.uri:
    url: "{{ item }}/subjects"
    method: GET
    status_code: 200
    validate_certs: true
    ca_path: "{{ registry_instance.config_directory }}/pki/ca-chain.pem"
    return_content: false
    use_proxy: false
  loop: ["{{ registry_instance.http_url }}", "{{ registry_instance.https_url }}"]
  register: _platform_kafka_registry_http_ready
  retries: "{{ platform_kafka_schema_registry_readiness_retries }}"
  delay: "{{ platform_kafka_schema_registry_readiness_delay }}"
  until: _platform_kafka_registry_http_ready.status | default(0) == 200

- name: "Сброс временной переменной пароля"
  ansible.builtin.set_fact:
    _platform_kafka_registry_password: ''
  no_log: true
