---
- name: Require the plan-declared admin runtime credential
  ansible.builtin.assert:
    that:
      - platform_kafka_admin_credential.passwordSecretRef | default('') is match('^runtime:[a-z][a-z0-9-]{0,127}$')
      - platform_kafka_admin_credential.passwordSecretRef in platform_kafka_secret_files
    fail_msg: KAFKA_ADMIN_RUNTIME_SECRET_REQUIRED

- name: Inspect the existing protected admin secret file without following symlinks
  ansible.builtin.stat:
    path: "{{ platform_kafka_secret_files[platform_kafka_admin_credential.passwordSecretRef] }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  delegate_to: localhost
  become: false
  register: kafka_admin_secret_stat
  no_log: true

- name: Reject missing, unsafe or oversized admin secret input
  ansible.builtin.assert:
    that:
      - kafka_admin_secret_stat.stat.exists
      - kafka_admin_secret_stat.stat.isreg
      - not kafka_admin_secret_stat.stat.islnk
      - kafka_admin_secret_stat.stat.size >= 1
      - kafka_admin_secret_stat.stat.size <= 4096
      - kafka_admin_secret_stat.stat.mode in ['0600', '0400']
    fail_msg: KAFKA_ADMIN_RUNTIME_SECRET_INVALID
  no_log: true

- name: Begin local runtime finalization observation
  ansible.builtin.set_fact:
    kafka_authorization_local_final: true
  changed_when: false

- name: Observe whether each local member actually loaded the final configuration
  ansible.builtin.include_tasks: authorization_observe.yml
  loop: "{{ _platform_kafka_local_instances }}"
  loop_control:
    loop_var: kafka_authorization_member

- name: Mark local finalization evidence without persisting another state file
  ansible.builtin.set_fact:
    kafka_authorization_local_final: "{{ kafka_authorization_local_final | bool }}"
  changed_when: false

- name: Decide the deployment-wide bootstrap phase before configuration changes
  ansible.builtin.set_fact:
    _platform_kafka_authorization_bootstrap: >-
      {% set state = namespace(bootstrap=false) %}
      {% for host in _platform_kafka_instances | map(attribute='host') | unique %}
      {% if not (hostvars[host].kafka_authorization_local_final | default(false) | bool) %}
      {% set state.bootstrap = true %}
      {% endif %}
      {% endfor %}
      {{ state.bootstrap }}
  changed_when: false

- name: Normalize the observed bootstrap decision to a boolean
  ansible.builtin.set_fact:
    _platform_kafka_authorization_bootstrap: "{{ _platform_kafka_authorization_bootstrap | trim | bool }}"
  changed_when: false

- name: Verify requires finalized admin-only superuser configuration
  ansible.builtin.assert:
    that: not (_platform_kafka_authorization_bootstrap | bool)
    fail_msg: KAFKA_AUTHORIZATION_FINALIZATION_REQUIRED
  when: platform_kafka_verify_only | bool
