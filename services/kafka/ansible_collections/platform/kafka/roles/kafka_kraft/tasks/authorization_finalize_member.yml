---
- name: Проверить готовность администратора Kafka перед отзывом bootstrap-доступа
  ansible.builtin.assert:
    that: kafka_authorization_admin_ready | default(false) | bool
    fail_msg: KAFKA_ADMIN_NOT_READY_FOR_FINALIZATION

- name: Завершить настройку экземпляра Kafka с администратором в роли единственного суперпользователя
  ansible.builtin.lineinfile:
    path: "{{ kafka_authorization_member.config_directory }}/server.properties"
    regexp: '^super\.users='
    line: super.users=User:admin
  no_log: true

- name: Перекрестная запись окончательной конфигурации за секунду до перезапуска отзыва
  ansible.builtin.wait_for:
    timeout: 1
  changed_when: false

- name: Перезапустить bootstrap-экземпляр Kafka с учётом прерванного завершения настройки
  ansible.builtin.systemd:
    name: "{{ kafka_authorization_member.systemd_unit_name }}"
    state: restarted

- name: Дождаться готовности listener-ов экземпляра Kafka после завершения настройки
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    timeout: 120
  loop: "{{ kafka_authorization_member.listener_ports }}"

- name: Проверить загрузку экземпляром Kafka конфигурации с администратором в роли единственного суперпользователя
  ansible.builtin.include_tasks: authorization_confirm.yml

- name: Аутентификация администратора и проверка кворума перед отзывом следующего экземпляра службы
  ansible.builtin.include_tasks:
    file: verify_quorum.yml
    apply:
      delegate_to: "{{ (_platform_kafka_broker_instances | first).host }}"
      become: true
  vars:
    kafka_quorum_diagnostic_member: "{{ _platform_kafka_broker_instances | first }}"
