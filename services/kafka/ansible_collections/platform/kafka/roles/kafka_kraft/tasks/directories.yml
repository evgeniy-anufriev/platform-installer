---
- name: Create Kafka service user
  ansible.builtin.user:
    name: "{{ platform_kafka_user }}"
    system: true
    create_home: false

- name: Create Kafka directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0750'
  loop:
    - "{{ platform_kafka_config_directory }}"
    - "{{ platform_kafka_data_directory }}"
    - "{{ platform_kafka_install_directory }}/logs"
