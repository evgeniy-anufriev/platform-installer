---
- name: Require caller-supplied offline Kafka artifact
  ansible.builtin.assert:
    that:
      - platform_kafka_artifact_path is defined
      - platform_kafka_artifact_checksum is defined
      - platform_kafka_artifact_checksum is match('^sha256:[0-9a-fA-F]{64}$')
    fail_msg: Kafka artifact path and sha256 checksum are required; Internet download is not supported

- name: Check Kafka artifact on the controller
  ansible.builtin.stat:
    path: "{{ platform_kafka_artifact_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: platform_kafka_artifact_stat

- name: Reject missing or mismatched Kafka artifact before target mutation
  ansible.builtin.assert:
    that:
      - platform_kafka_artifact_stat.stat.exists
      - platform_kafka_artifact_stat.stat.checksum is defined
      - ('sha256:' ~ platform_kafka_artifact_stat.stat.checksum) == platform_kafka_artifact_checksum
    fail_msg: Kafka artifact is missing or its SHA-256 does not match the approved offline contract

- name: Require Kafka 4.3.1 artifact layout
  ansible.builtin.assert:
    that:
      - platform_kafka_version == '4.3.1'
      - platform_kafka_archive_directory == 'kafka_2.13-4.3.1'
    fail_msg: SERVICE-01A supports only the approved Kafka 4.3.1 artifact

- name: Inspect existing KRaft metadata before any target mutation
  ansible.builtin.stat:
    path: "{{ platform_kafka_data_directory }}/meta.properties"
  register: platform_kafka_existing_metadata

- name: Read existing KRaft metadata before any target mutation
  ansible.builtin.slurp:
    src: "{{ platform_kafka_data_directory }}/meta.properties"
  register: platform_kafka_existing_metadata_content
  when: platform_kafka_existing_metadata.stat.exists

- name: Reject an existing KRaft identity mismatch before mutation
  ansible.builtin.assert:
    that:
      - (platform_kafka_existing_metadata_content.content | b64decode) is search('(?m)^cluster.id=' ~ platform_kafka_cluster_id ~ '$')
      - (platform_kafka_existing_metadata_content.content | b64decode) is search('(?m)^node.id=' ~ (platform_kafka_node_id | string) ~ '$')
    fail_msg: Existing Kafka storage identity does not match explicit node_id/cluster_id; refusing mutation
  when: platform_kafka_existing_metadata.stat.exists
