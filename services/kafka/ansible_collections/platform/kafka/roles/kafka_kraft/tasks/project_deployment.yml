---
- name: Экземпляры службы Project Kafka, принадлежащие каждому целевому узлу
  ansible.builtin.include_tasks: project_deployment_host.yml
  loop: "{{ groups['platform_targets'] | default([]) | sort }}"
  loop_control:
    loop_var: _platform_kafka_project_member_host
    label: "{{ _platform_kafka_project_member_host }}"
