---
- name: Выбор проверенных метаданных топика из общего ответа
  ansible.builtin.set_fact:
    _application_topic_checked: >-
      {{ application_topic_batch_validation.results[application_topic.name]
         if application_topic_batch_validation is defined else
         (application_topic | platform.kafka.application_topic_validation(application_topic_batch_description, application_topic_batch_properties, platform_kafka_application_phase, platform_kafka_application_job.providerId)) }}
  no_log: true

- name: Проверка результата выбранного топика
  ansible.builtin.assert:
    that: _application_topic_checked.findings | length == 0
    fail_msg: "{{ _application_topic_checked.findings | to_json }}"

- name: Привязка метаданных для штатного создания отсутствующего топика
  ansible.builtin.set_fact:
    application_topic_description: "{{ _application_topic_checked.description }}"
  no_log: true
