---
- name: Установка необходимого компонента Java для всего хоста
  ansible.builtin.package:
    name: "{{ platform_kafka_java_package }}"
    state: present
  when: >-
    platform_resolved_artifact_sources is not defined or
    platform_resolved_artifact_sources['kafka-java'].source == 'REPOSITORY'

- name: Проверка основной версии Java
  ansible.builtin.command: java -version
  changed_when: false
  register: platform_kafka_java_version
  failed_when: >-
    platform_kafka_java_version.rc != 0 or
    ('version "21.' not in (platform_kafka_java_version.stderr ~ platform_kafka_java_version.stdout))

- name: Однократная распаковка разрешённого дистрибутива Kafka
  ansible.builtin.unarchive:
    src: "{{ platform_kafka_artifact_path }}"
    dest: /opt
    remote_src: false
    creates: "/opt/{{ platform_kafka_archive_directory }}/bin/kafka-storage{{ platform_kafka_script_extension }}"
  register: _platform_kafka_distribution_unpack

- name: Маркировка распакованного общего дистрибутива Kafka
  ansible.builtin.copy:
    content: "{{ platform_kafka_artifact_checksum }}"
    dest: "/opt/{{ platform_kafka_archive_directory }}/.platform-kafka-approved-sha256"
    owner: root
    group: root
    mode: '0644'
  when:
    - platform_kafka_schema_registry_use_kafka_distribution
    - _platform_kafka_distribution_unpack is changed


- name: Указание стабильного пути установки Kafka в утвержденной версии
  ansible.builtin.file:
    src: "/opt/{{ platform_kafka_archive_directory }}"
    dest: "{{ platform_kafka_install_directory }}"
    state: link
    force: true

- name: Создание общей группы Kafka
  ansible.builtin.group:
    name: "{{ platform_kafka_group }}"
    system: true

- name: Создание общего пользователя Kafka
  ansible.builtin.user:
    name: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    system: true
    create_home: false

- name: "Подготовка каталога журналов дистрибутива Kafka с доступом для записи"
  ansible.builtin.file:
    path: "/opt/{{ platform_kafka_archive_directory }}/logs"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0750'
