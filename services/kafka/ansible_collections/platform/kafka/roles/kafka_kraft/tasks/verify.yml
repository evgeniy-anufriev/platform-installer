---
- name: Проверка каждого экземпляра службы Kafka в детерминированном порядке
  ansible.builtin.include_tasks: verify_member.yml
  loop: "{{ range(_platform_kafka_local_instances | length) | list }}"
  vars:
    kafka_member: "{{ (_platform_kafka_local_instances | sort(attribute='node_id'))[kafka_verify_member_index] }}"
  # Ansible groups includes by both loop item and label; keep them host-independent.
  loop_control:
    loop_var: kafka_verify_member_index
    label: "Локальный экземпляр {{ kafka_verify_member_index + 1 }}"

- name: Проверка кластера Kafka через общее административное соединение
  ansible.builtin.include_tasks: verify_cluster_scram.yml
  when:
    - _platform_kafka_scram_enabled | default(false) | bool
    - inventory_hostname == (_platform_kafka_broker_instances | first).host

- name: Проверка кластера Kafka через раздельные соединения контроллера и брокера
  ansible.builtin.include_tasks: verify_cluster.yml
  when: not (_platform_kafka_scram_enabled | default(false) | bool)
