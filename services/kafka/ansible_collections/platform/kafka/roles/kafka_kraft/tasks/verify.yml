---
- name: Verify each Kafka member in deterministic order
  ansible.builtin.include_tasks: verify_member.yml
  loop: "{{ _platform_kafka_local_instances | sort(attribute='node_id') }}"
  loop_control:
    loop_var: kafka_member
    label: "{{ kafka_member.id }}"

- name: Query Kafka quorum status read-only
  ansible.builtin.command:
    argv:
      - "{{ platform_kafka_install_directory }}/bin/kafka-metadata-quorum.sh"
      - --bootstrap-controller
      - >-
        {{ ((_platform_kafka_local_controller_instances | first)
             if _platform_kafka_local_controller_instances | length > 0
             else (_platform_kafka_controller_instances | first)).advertised_host }}:{{ ((_platform_kafka_local_controller_instances | first)
             if _platform_kafka_local_controller_instances | length > 0
             else (_platform_kafka_controller_instances | first)).controller_port }}
      - describe
      - --status
  changed_when: false
  register: platform_kafka_quorum_status
  failed_when: platform_kafka_quorum_status.rc != 0
