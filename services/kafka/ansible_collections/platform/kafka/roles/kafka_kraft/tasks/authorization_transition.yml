---
- name: Сбросить барьер готовности администратора Kafka перед переходом авторизации
  ansible.builtin.set_fact:
    kafka_authorization_admin_ready: false
  changed_when: false

- name: "Прервать выполнение на всех узлах при сбое настройки администратора или завершения настройки экземпляра"
  any_errors_fatal: true
  block:
    - name: Предоставление или проверка прав администратора и явных прав совместимости один раз для каждого развертывания
      ansible.builtin.include_tasks:
        file: authorization_setup.yml
        apply:
          delegate_to: "{{ (_platform_kafka_broker_instances | first).host }}"
          become: true
      run_once: true

    - name: "Разрешить отзыв bootstrap-доступа после успешной проверки администратора и ACL"
      ansible.builtin.set_fact:
        kafka_authorization_admin_ready: true
      changed_when: false

    - name: Проверить участие всех узлов развёртывания в play перед делегированным отзывом
      ansible.builtin.assert:
        that: >-
          (_platform_kafka_instances | map(attribute='host') | unique | list
           | difference(ansible_play_hosts_all)) | length == 0
        fail_msg: KAFKA_FINALIZATION_REQUIRES_ALL_DEPLOYMENT_HOSTS
      when:
        - not (platform_kafka_verify_only | bool)
        - _platform_kafka_authorization_bootstrap | bool

    - name: Последовательная финализация экземпляров службы с проверкой кворума между отзывами
      ansible.builtin.include_tasks:
        file: authorization_finalize_member.yml
        apply:
          delegate_to: "{{ kafka_authorization_member.host }}"
          become: true
      loop: "{{ _platform_kafka_instances | sort(attribute='node_id') }}"
      loop_control:
        loop_var: kafka_authorization_member
        label: "{{ kafka_authorization_member.id }}"
      run_once: true
      when:
        - not (platform_kafka_verify_only | bool)
        - _platform_kafka_authorization_bootstrap | bool
