---
- name: Выбрать прослушиватель Kafka CLI по семантическому назначению
  ansible.builtin.set_fact:
    _platform_kafka_cli_listener_matches: >-
      {{ (kafka_cli_member.listener_endpoints
          | selectattr('security_protocol', 'equalto', 'SASL_SSL') | list)
         if kafka_cli_purpose == 'admin' else
         (kafka_cli_member.listener_endpoints
          | selectattr('purpose', 'equalto', kafka_cli_purpose)
          | rejectattr('security_protocol', 'equalto', 'SASL_SSL') | list) }}
  changed_when: false

- name: Требуется один прослушиватель Kafka CLI для запрошенной цели
  ansible.builtin.assert:
    that:
      - _platform_kafka_cli_listener_matches | length == 1
    fail_msg: >-
      BLOCKED: Kafka member {{ kafka_cli_member.id }} has no unique CLI listener
      for purpose {{ kafka_cli_purpose }}

- name: Построить проекцию соединения Kafka CLI без секретных значений
  ansible.builtin.set_fact:
    _platform_kafka_cli_connection: >-
      {{ {
           'deploymentId': kafka_cli_member.deployment_id | default(''),
           'memberId': kafka_cli_member.id,
           'listenerName': _platform_kafka_cli_listener_matches[0].name,
           'purpose': _platform_kafka_cli_listener_matches[0].purpose,
           'bootstrapHost': _platform_kafka_cli_listener_matches[0].bootstrap_host,
           'bootstrapPort': _platform_kafka_cli_listener_matches[0].bootstrap_port,
           'securityProtocol': _platform_kafka_cli_listener_matches[0].security_protocol
         } }}
  changed_when: false

- name: Разрешение проекции времени выполнения Kafka TLS для соединения SSL CLI
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_cli_member }}"
  when: _platform_kafka_cli_connection.securityProtocol in ['SSL', 'SASL_SSL']

- name: Добавить проекцию TLS к соединению Kafka CLI без секретных значений
  ansible.builtin.set_fact:
    _platform_kafka_cli_connection: >-
      {{ _platform_kafka_cli_connection | combine({
           'tls': {
             'keystorePath': _platform_kafka_tls_runtime.keystorePath,
             'truststorePath': _platform_kafka_tls_runtime.truststorePath,
             'truststoreType': _platform_kafka_tls_runtime.storeType,
             'storePasswordSecretRef': _platform_kafka_tls_runtime.storePasswordSecretRef
           }
         }) }}
  changed_when: false
  when: _platform_kafka_cli_connection.securityProtocol in ['SSL', 'SASL_SSL']

- name: Привязать запланированную SecretRef среды выполнения администратора, не копируя ее значение
  ansible.builtin.set_fact:
    _platform_kafka_cli_connection: "{{ _platform_kafka_cli_connection | combine({'adminPasswordRef': platform_kafka_admin_credential.passwordSecretRef}) }}"
  changed_when: false
  when: kafka_cli_purpose == 'admin'
