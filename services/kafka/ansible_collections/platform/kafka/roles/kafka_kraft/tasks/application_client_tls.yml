---
- name: Проверка исходных PEM-файлов клиента Kafka
  ansible.builtin.assert:
    that:
      - application_topic_candidate.pkiPlans | length == 1
      - "'PEM' in application_topic_candidate.pkiPlans[0].formats"
    fail_msg: APPLICATION_PROVIDER_PKI_PLAN_REQUIRED

- name: Подготовка защищённого набора PEM-файлов для Kafka CLI
  ansible.builtin.include_tasks: pem_identity.yml
  vars:
    kafka_pem_source_directory: "{{ application_topic_candidate.pkiPlans[0].targetDirectory }}"
    kafka_pem_identity_path: "{{ application_kafka_private.path }}/identity.pem"
    kafka_pem_owner: root
    kafka_pem_group: root
    kafka_pem_verify_only: false
    kafka_pem_ephemeral: true
