---
- name: Формирование CLI-селектора выбранного ресурса Kafka ACL
  ansible.builtin.set_fact:
    application_kafka_acl_args: "{{ ['--' ~ application_kafka_grant.resourceType] + ([] if application_kafka_grant.resourceType == 'cluster' else [application_kafka_grant.name]) + ['--resource-pattern-type', application_kafka_grant.patternType] }}"
    application_kafka_acl_operations: []
  changed_when: false

- name: Выбор заданного ресурса из полного списка Kafka ACL
  ansible.builtin.set_fact:
    application_kafka_acl_actual:
      stdout: "{{ application_kafka_acl_inventory.stdout | regex_findall(application_kafka_acl_block_pattern) | join('\n') }}"
  vars:
    application_kafka_acl_resource: "{{ 'ResourcePattern(resourceType=' ~ (application_kafka_grant.resourceType | replace('-', '_') | upper) ~ ', name=' ~ application_kafka_grant.name ~ ', patternType=' ~ (application_kafka_grant.patternType | upper) ~ ')' }}"
    application_kafka_acl_block_pattern: '(?ms)^Current ACLs for resource \x60{{ application_kafka_acl_resource | regex_escape }}\x60:[ \t]*\r?\n(.*?)(?=^Current ACLs for resource |\Z)'
  changed_when: false
  no_log: true

- name: Выбор недостающих точных операций ALLOW с хостом с подстановочными знаками
  ansible.builtin.set_fact:
    application_kafka_acl_operations: "{{ application_kafka_acl_operations + ['--operation', item] }}"
  loop: "{{ application_kafka_grant.operations }}"
  when: >-
    ('principal=User:' ~ application_kafka_account.name ~ ', host=*, operation=' ~
    (item | regex_replace('([a-z])([A-Z])', '\\1_\\2') | upper) ~
    ', permissionType=ALLOW') not in application_kafka_acl_actual.stdout
  changed_when: false

- name: Проверка наличия требуемых ACL у существующих учётных записей и в режиме Verify
  ansible.builtin.assert:
    that: application_kafka_acl_operations | length == 0
    fail_msg: APPLICATION_KAFKA_ACL_MISSING
  when: platform_kafka_application_phase == 'verify' or application_kafka_account.mode == 'existing'

- name: Сбор совместимой дельты ACL текущей учётной записи
  ansible.builtin.set_fact:
    application_kafka_acl_groups: >-
      {{ application_kafka_acl_groups | combine({application_kafka_acl_group_key: {
        'names': (application_kafka_acl_group_previous.names | default([]) + [application_kafka_grant.name]) | unique(case_sensitive=true) | list,
        'selectors': (application_kafka_acl_group_previous.selectors | default([])) +
          ([] if application_kafka_grant.name in (application_kafka_acl_group_previous.names | default([])) else application_kafka_acl_args[:-2]),
        'operations': application_kafka_acl_operations,
        'patternType': application_kafka_grant.patternType
      }}) }}
  vars:
    application_kafka_acl_group_key: "{{ [application_kafka_grant.resourceType, application_kafka_grant.patternType, application_kafka_acl_operations | reject('equalto', '--operation') | unique | sort] | to_json }}"
    application_kafka_acl_group_previous: "{{ application_kafka_acl_groups.get(application_kafka_acl_group_key, {}) }}"
  changed_when: false
  no_log: true
  when:
    - application_kafka_acl_defer_write | default(false) | bool
    - platform_kafka_application_phase == 'apply'
    - application_kafka_account.mode == 'managed'
    - application_kafka_acl_operations | length > 0

- name: Немедленное применение дельты ACL прямого вызова
  ansible.builtin.include_tasks: application_acl_write.yml
  when:
    - not (application_kafka_acl_defer_write | default(false) | bool)
    - platform_kafka_application_phase == 'apply'
    - application_kafka_account.mode == 'managed'
    - application_kafka_acl_operations | length > 0
