---
- name: Разрешить соединение кворума контроллера Kafka CLI из проекции времени выполнения
  ansible.builtin.include_tasks: resolve_cli_connection.yml
  vars:
    kafka_cli_member: "{{ kafka_quorum_diagnostic_member }}"
    kafka_cli_purpose: "{{ 'admin' if _platform_kafka_scram_enabled | default(false) | bool else 'controller' }}"

- name: Запрос состояния кворума контроллера Kafka через проецируемое соединение CLI
  ansible.builtin.include_tasks: run_cli_command.yml
  vars:
    kafka_cli_connection: "{{ _platform_kafka_cli_connection }}"
    kafka_cli_command_prefix:
      - "{{ platform_kafka_install_directory }}/bin/kafka-metadata-quorum.sh"
      - "{{ '--bootstrap-server' if _platform_kafka_scram_enabled | default(false) | bool else '--bootstrap-controller' }}"
      - "{{ _platform_kafka_cli_connection.bootstrapHost }}:{{ _platform_kafka_cli_connection.bootstrapPort }}"
    kafka_cli_command_suffix: [describe, --status]
    kafka_cli_expected_controller_ids: >-
      {{ _platform_kafka_controller_instances | map(attribute='node_id') | list }}

- name: "Проверить успешность команды диагностики кворума Kafka"
  ansible.builtin.assert:
    that: platform_kafka_cli_command_result.rc == 0
    fail_msg: Kafka controller quorum diagnostic command failed

- name: Подтверждение лидера кворума и членства контроллера Kafka
  ansible.builtin.assert:
    that:
      - >-
        platform_kafka_cli_command_result.stdout is search(
        'LeaderId:\s*(' ~
        (_platform_kafka_controller_instances | map(attribute='node_id') | map('string') | join('|')) ~
        ')(?:\s|$)')
      - >-
        platform_kafka_cli_command_result.stdout is search(
        '"id":\s*' ~ (item.node_id | string) ~ ',')
    fail_msg: Kafka controller quorum does not represent exactly the expected controller members
  loop: "{{ _platform_kafka_controller_instances }}"
  loop_control:
    label: "{{ item.id }}"
