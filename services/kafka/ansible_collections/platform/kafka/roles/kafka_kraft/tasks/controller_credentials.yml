---
- name: Сброс признака изменения зашифрованных credentials Kafka
  ansible.builtin.set_fact:
    platform_kafka_member_credentials_changed: false
  changed_when: false

- name: Чтение существующего зашифрованного JAAS только в память операции
  ansible.builtin.command:
    argv: [systemd-creds, decrypt, --name=kafka-jaas, "{{ kafka_member.config_directory }}/controller-jaas.cred", '-']
    strip_empty_ends: false
  register: kafka_member_current_jaas
  failed_when: false
  changed_when: false
  no_log: true

- name: Обновление зашифрованного JAAS при изменении runtime credentials
  no_log: true
  when: kafka_member_current_jaas.rc != 0 or kafka_member_current_jaas.stdout != lookup('ansible.builtin.template', 'controller-jaas.conf.j2')
  block:
    - name: Шифрование JAAS ключом узла без открытого файла и пароля в argv
      ansible.builtin.command:
        argv: [systemd-creds, encrypt, --with-key=host, --name=kafka-jaas, '-', '-']
        stdin: "{{ lookup('ansible.builtin.template', 'controller-jaas.conf.j2') }}"
        stdin_add_newline: false
      register: kafka_member_encrypted_jaas
      changed_when: false
      no_log: true

    - name: Атомарная доставка зашифрованного JAAS экземпляра Kafka
      ansible.builtin.copy:
        content: "{{ kafka_member_encrypted_jaas.stdout }}\n"
        dest: "{{ kafka_member.config_directory }}/controller-jaas.cred"
        owner: root
        group: root
        mode: '0400'
      register: kafka_member_jaas_delivery
      no_log: true
      diff: false

    - name: Сохранение признака изменения credentials для перезапуска экземпляра
      ansible.builtin.set_fact:
        platform_kafka_member_credentials_changed: "{{ kafka_member_jaas_delivery.changed }}"
      changed_when: false

- name: Удаление открытого JAAS из временных переменных операции
  ansible.builtin.set_fact:
    kafka_member_current_jaas: {}
    kafka_member_encrypted_jaas: {}
    kafka_member_jaas_delivery: {}
  no_log: true
  changed_when: false
