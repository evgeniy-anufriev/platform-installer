---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: "Получить экземпляры Kafka из проекта, если список не задан явно"
  ansible.builtin.include_tasks: project_runtime.yml
  when:
    - platform_kafka_instances | length == 0
    - platform_desired_state is defined or platform_project is defined or platform_project_manifest_path is defined

- name: Проверка входных данных развертывания Kafka
  ansible.builtin.assert:
    that:
      - platform_kafka_cluster_id is defined
      - platform_kafka_cluster_id | length > 0
      - platform_kafka_advanced_config is mapping
      - platform_kafka_instances is iterable
      - platform_kafka_quorum_mode in ['dynamic', 'static']
      - platform_kafka_clean_install is boolean
    fail_msg: Kafka requires an explicit cluster_id, quorum mode and a valid member list

- name: Выбрать явный ввод экземпляра службы Kafka
  ansible.builtin.set_fact:
    _platform_kafka_input_instances: "{{ platform_kafka_instances }}"
  when: platform_kafka_instances | length > 0

- name: Преобразовать устаревшие переменные одного экземпляра сервиса
  ansible.builtin.set_fact:
    _platform_kafka_input_instances:
      - id: "{{ platform_kafka_service_name }}-{{ platform_kafka_node_id }}"
        node_id: "{{ platform_kafka_node_id }}"
        roles: [broker, controller]
        listeners: "{{ platform_kafka_listeners | default(omit) }}"
        tls_profile: "{{ platform_kafka_tls_profile }}"
        data_directory: "{{ platform_kafka_data_directory }}"
        log_directory: "{{ platform_kafka_log_directory }}/{{ platform_kafka_service_name }}"
        config_directory: "{{ platform_kafka_config_directory }}"
        host: "{{ inventory_hostname }}"
        advertised_host: "{{ platform_kafka_advertised_host }}"
        _compatibility_unit:
          name: "{{ platform_kafka_service_name }}"
          destination: "/etc/systemd/system/{{ platform_kafka_service_name }}.service"
          environment_pattern: "{{ platform_kafka_config_directory }}/{{ platform_kafka_service_name }}/systemd.env"
          runtime_directory: "{{ platform_kafka_config_directory }}/{{ platform_kafka_service_name }}"
          description: "Apache Kafka {{ platform_kafka_version }} KRaft member"
  when: platform_kafka_instances | length == 0

- name: Проверка общих входных данных экземпляра службы Kafka
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id is defined
      - item.id | string is match('^[A-Za-z0-9_.-]+$')
      - item.id | string is match('^.+-[1-9][0-9]*$')
      - (item.deployment_id | default(platform_kafka_deployment_id)) is match('^[a-z0-9][a-z0-9-]*$')
      - item.roles is defined
      - item.roles is iterable
      - item.roles is not string
      - item.roles | length > 0
      - item.roles | difference(['broker', 'controller']) | length == 0
      - >-
        (((platform_kafka_name if ('broker' in item.roles and 'controller' in item.roles)
           else (platform_kafka_name ~ '-broker' if 'broker' in item.roles else platform_kafka_name ~ '-controller'))
          ~ '@' ~ (item.deployment_id | default(platform_kafka_deployment_id)) ~ '-'
          ~ ((item.id | string) | regex_replace('^.*-', '')) ~ '.service') | length) <= 255
      - item.node_id is defined
      - item.node_id | string is match('^[0-9]+$')
      - item.host is defined
      - item.host | string | length > 0
      - item.advertised_host is defined
      - item.advertised_host | string | length > 0
      - item.data_directory is defined
      - item.data_directory | string | length > 0
      - item.log_directory is defined
      - item.log_directory | string | length > 0
    fail_msg: Every Kafka member requires identity, roles, placement, address and isolated directories
  loop: "{{ _platform_kafka_input_instances }}"
  loop_control:
    label: "{{ item.id | default('unknown') }}"

- name: Инициализация нормализованного списка экземпляров службы Kafka
  ansible.builtin.set_fact:
    _platform_kafka_instances: []

- name: Нормализовать экземпляры службы Kafka в общую внутреннюю модель
  ansible.builtin.include_tasks: normalize_member.yml
  loop: "{{ _platform_kafka_input_instances }}"
  loop_control:
    loop_var: kafka_input_member
    label: "{{ kafka_input_member.id }}"

- name: Детерминированный порядок нормализованных экземпляров службы Kafka
  ansible.builtin.set_fact:
    _platform_kafka_instances: "{{ _platform_kafka_instances | sort(attribute='node_id') }}"

- name: Получение наборов экземпляров службы Kafka
  ansible.builtin.set_fact:
    _platform_kafka_controller_instances: "{{ _platform_kafka_instances | selectattr('roles', 'contains', 'controller') | list }}"
    _platform_kafka_broker_instances: "{{ _platform_kafka_instances | selectattr('roles', 'contains', 'broker') | list }}"
    _platform_kafka_local_instances: "{{ _platform_kafka_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"

- name: Получение локальных наборов экземпляров службы ролей Kafka
  ansible.builtin.set_fact:
    _platform_kafka_local_controller_instances: "{{ _platform_kafka_local_instances | selectattr('roles', 'contains', 'controller') | list }}"
    _platform_kafka_local_broker_instances: "{{ _platform_kafka_local_instances | selectattr('roles', 'contains', 'broker') | list }}"

- name: Отклонить общие каталоги данных для экземпляров службы Kafka на одном хосте
  ansible.builtin.assert:
    that: >-
      _platform_kafka_local_instances | map(attribute='data_directory') | unique | list | length ==
      _platform_kafka_local_instances | length
    fail_msg: KAFKA_DATA_DIRECTORY_COLLISION

- name: Проверка ресурсов Schema Registry перед модификацией Kafka
  ansible.builtin.include_tasks: schema_registry_validate.yml

- name: Защита локальных путей к данным Kafka перед изменением
  ansible.builtin.include_role:
    name: platform.core.managed_data_path_guard
  vars:
    platform_managed_data_path: "{{ platform_managed_data_path_instance.data_directory }}"
    platform_managed_data_owner: "{{ platform_kafka_user }}"
    platform_managed_data_root_directory: "{{ platform_data_root_directory | default('/var/lib') }}"
    platform_managed_data_root_owner: "{{ ansible_user | default('') }}"
    platform_managed_data_root_verify_only: "{{ platform_kafka_verify_only | bool }}"
  loop: "{{ _platform_kafka_local_instances }}"
  loop_control:
    loop_var: platform_managed_data_path_instance
    label: "{{ platform_managed_data_path_instance.id }}"

- name: Проверка устаревших шаблонов служб systemd Kafka перед изменением
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
  loop: >-
    {{ [platform_kafka_service_name ~ '@.service',
        platform_kafka_service_name ~ '.service',
        platform_kafka_service_name ~ '-standalone.service'] }}
  register: _platform_kafka_legacy_unit_files
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - _platform_kafka_local_instances | length > 0

- name: Отказаться от автоматического принятия устаревших имен служб systemd Kafka
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: KAFKA_LEGACY_UNIT_REQUIRES_S11_CLEANUP
  loop: "{{ _platform_kafka_legacy_unit_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - _platform_kafka_local_instances | length > 0

- name: Убедиться, что службы systemd предыдущего экземпляра службы Kafka еще не активны
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item.legacy_systemd_unit_name }}"]
  loop: "{{ _platform_kafka_local_instances }}"
  register: _platform_kafka_legacy_unit_states
  changed_when: false
  failed_when: false
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Отказаться от активных сервисов предыдущего экземпляра службы Kafka
  ansible.builtin.assert:
    that: item.stdout | trim != 'active'
    fail_msg: KAFKA_LEGACY_UNIT_REQUIRES_S11_CLEANUP
  loop: "{{ _platform_kafka_legacy_unit_states.results | default([]) }}"
  loop_control:
    label: "{{ item.item.legacy_systemd_unit_name }}"
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Проверка точных путей к службе systemd экземпляра службы Kafka перед рендерингом
  ansible.builtin.stat:
    path: "{{ item.systemd_unit_destination }}"
    follow: false
    get_mime: false
    get_attributes: false
  register: _platform_kafka_unit_path_stats
  loop: "{{ _platform_kafka_local_instances }}"
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Отклонить небезопасные существующие пути службы systemd экземпляра службы Kafka
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or
      (item.stat.isreg | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: KAFKA_UNIT_PATH_UNSAFE
  loop: "{{ _platform_kafka_unit_path_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Прочитать заголовки владения из существующих системных служб экземпляра службы Kafka
  ansible.builtin.slurp:
    src: "{{ item.item.systemd_unit_destination }}"
  register: _platform_kafka_existing_unit_headers
  loop: "{{ _platform_kafka_unit_path_stats.results | default([]) }}"
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - item.stat.exists
  loop_control:
    label: "{{ item.item.id }}"

- name: Отказаться от замены неуправляемых сервисов экземпляра службы Kafka systemd
  ansible.builtin.assert:
    that: (item.content | b64decode | split('\n') | first) == item.item.item.systemd_unit_ownership_marker
    fail_msg: KAFKA_UNIT_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_kafka_existing_unit_headers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.id }}"
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - not (item.skipped | default(false))

- name: Проверка входных данных экземпляра службы Kafka с учетом ролей
  ansible.builtin.assert:
    that:
      - "'broker' not in item.roles or (item.listeners | default({}) | dict2items | selectattr('value.purpose', 'in', ['client', 'interBroker']) | list | length > 0)"
      - "'controller' not in item.roles or (item.listeners | default({}) | dict2items | selectattr('value.purpose', 'equalto', 'controller') | list | length > 0)"
      - platform_kafka_quorum_mode != 'dynamic' or _platform_kafka_controller_instances | length == 1 or 'controller' not in item.roles or item.directory_id is defined
      - platform_kafka_quorum_mode != 'dynamic' or 'controller' not in item.roles or item.directory_id is not defined or (item.directory_id | string) is match('^[A-Za-z0-9_-]{22}$')
    fail_msg: Kafka listener and dynamic controller identity inputs must match member roles
  loop: "{{ _platform_kafka_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Требуется хотя бы один контроллер и брокер Kafka
  ansible.builtin.assert:
    that:
      - _platform_kafka_controller_instances | length > 0
      - _platform_kafka_broker_instances | length > 0
    fail_msg: Kafka deployment requires at least one controller and one broker member

- name: Отклонить повторяющиеся идентификаторы узла Kafka
  ansible.builtin.assert:
    that: >-
      (_platform_kafka_instances | map(attribute='node_id') | map('string') | list | unique | length)
      == (_platform_kafka_instances | length)
    fail_msg: Duplicate Kafka node_id is not safe to apply

- name: Отклонить повторяющиеся идентификаторы экземпляра службы Kafka
  ansible.builtin.assert:
    that: >-
      (_platform_kafka_instances | map(attribute='id') | list | unique | length)
      == (_platform_kafka_instances | length)
    fail_msg: Duplicate Kafka member id is not safe to apply

- name: Отклонить конфликты имен служб systemd Kafka на одном и том же хосте
  ansible.builtin.assert:
    that: >-
      (_platform_kafka_instances | selectattr('host', 'equalto', item)
       | map(attribute='systemd_unit_name') | list | unique | length)
      == (_platform_kafka_instances | selectattr('host', 'equalto', item) | list | length)
    fail_msg: KAFKA_UNIT_NAME_COLLISION
  loop: "{{ _platform_kafka_instances | map(attribute='host') | unique | list }}"

- name: Отклонить повторяющиеся идентификаторы каталогов Kafka
  ansible.builtin.assert:
    that: >-
      (_platform_kafka_instances | map(attribute='directory_id') | select('defined') | list | unique | length)
      == (_platform_kafka_instances | map(attribute='directory_id') | select('defined') | list | length)
    fail_msg: Duplicate Kafka directory_id is not safe to apply

- name: Проверка изоляции локального ресурса Kafka хоста
  ansible.builtin.include_tasks: validate_host_resources.yml
  loop: "{{ _platform_kafka_instances | groupby('host') }}"
  loop_control:
    loop_var: kafka_host_members
    label: "{{ kafka_host_members.0 }}"

- name: Определение зарезервированных настроек Kafka
  ansible.builtin.set_fact:
    _platform_kafka_reserved_config_keys:
      - node.id
      - process.roles
      - listeners
      - advertised.listeners
      - controller.listener.names
      - controller.quorum.voters
      - controller.quorum.bootstrap.servers
      - log.dirs
      - listener.security.protocol.map
      - inter.broker.listener.name
      - authorizer.class.name
      - super.users
      - allow.everyone.if.no.acl.found

- name: Отклонить зарезервированные расширенные настройки Kafka
  ansible.builtin.assert:
    that: >-
      (platform_kafka_advanced_config.keys() | list |
       intersect(_platform_kafka_reserved_config_keys) | length) == 0
      and (platform_kafka_advanced_config.keys() | select('match', '^listener\\.name\\..*\\.(ssl|sasl|scram-sha-512)\\.') | list | length) == 0
    fail_msg: 'ADVANCED_SETTING_RESERVED: BLOCKED; reserved Kafka keys are controlled by the role'

- name: Проверка разрешенных источников артефактов Kafka перед изменением
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: kafka-java, name: java-21-openjdk-headless}
      - {id: kafka-binary, name: kafka}
  when:
    - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Доставка выбранных автономных артефактов Kafka
  ansible.builtin.include_role:
    name: platform.core.artifact_delivery
  vars:
    platform_artifact_delivery_requirements:
      - {id: kafka-java, name: java-21-openjdk-headless}
      - {id: kafka-binary, name: kafka}
  when:
    - platform_resolved_artifact_sources is defined
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Выбрать доставленный архив Kafka для автономной установки
  ansible.builtin.set_fact:
    platform_kafka_artifact_path: "{{ platform_offline_artifact_paths['kafka-binary'][0] }}"
    platform_kafka_artifact_checksum: "{{ platform_resolved_artifact_sources['kafka-binary'].artifacts[0].sha256 }}"
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - platform_resolved_artifact_sources is defined
    - platform_resolved_artifact_sources['kafka-binary'].source == 'OFFLINE_BUNDLE'

- name: Требовать утвержденный автономный артефакт Kafka
  ansible.builtin.assert:
    that:
      - platform_kafka_artifact_path is defined or
        (platform_resolved_artifact_sources is defined and platform_resolved_artifact_sources['kafka-binary'].source == 'REPOSITORY')
      - platform_kafka_artifact_checksum is defined or
        (platform_resolved_artifact_sources is defined and platform_resolved_artifact_sources['kafka-binary'].source == 'REPOSITORY')
      - platform_kafka_artifact_checksum is not defined or platform_kafka_artifact_checksum is match('^sha256:[0-9a-fA-F]{64}$')
      - platform_kafka_version is string
      - platform_kafka_version | length > 0
      - platform_kafka_archive_directory is string
      - platform_kafka_archive_directory is match('^[A-Za-z0-9_.+-]+$')
    fail_msg: Kafka offline artifact path, version, and checksum are required
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Проверка утвержденного артефакта Kafka на контроллере
  ansible.builtin.stat:
    path: "{{ platform_kafka_artifact_path }}"
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  delegate_to: localhost
  become: false
  register: platform_kafka_artifact_stat
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Отклонить отсутствующий или несоответствующий артефакт Kafka
  ansible.builtin.assert:
    that:
      - platform_kafka_artifact_stat.stat.exists
      - ('sha256:' ~ platform_kafka_artifact_stat.stat.checksum) == platform_kafka_artifact_checksum
    fail_msg: Kafka artifact is missing or its SHA-256 does not match the approved offline contract
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Построить детерминированные проекции кворума только для контроллеров Kafka
  ansible.builtin.set_fact:
    _platform_kafka_controller_bootstrap_servers: >-
      {% for member in _platform_kafka_controller_instances %}{{ member.controller_endpoint.bootstrap_host }}:{{ member.controller_endpoint.bootstrap_port }}{% if not loop.last %},{% endif %}{% endfor %}
    _platform_kafka_initial_controllers: >-
      {% for member in _platform_kafka_controller_instances %}{{ member.node_id }}@{{ member.controller_endpoint.bootstrap_host }}:{{ member.controller_endpoint.bootstrap_port }}:{{ member.directory_id | default('') }}{% if not loop.last %},{% endif %}{% endfor %}
    _platform_kafka_static_quorum_voters: >-
      {% for member in _platform_kafka_controller_instances %}{{ member.node_id }}@{{ member.controller_endpoint.bootstrap_host }}:{{ member.controller_endpoint.bootstrap_port }}{% if not loop.last %},{% endif %}{% endfor %}

- name: Очистить выбранное развертывание Kafka явно по запросу
  ansible.builtin.include_tasks: clear.yml
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - platform_kafka_clean_install | bool
    - _platform_kafka_local_instances | length > 0

- name: Обнаружение требования авторизации SCRAM для всего развертывания
  ansible.builtin.set_fact:
    _platform_kafka_scram_enabled: "{{ _platform_kafka_instances | map(attribute='listeners') | map('dict2items') | flatten | selectattr('value.securityProtocol', 'equalto', 'SASL_SSL') | list | length > 0 }}"
    _platform_kafka_admin_principals: []

- name: Проверка административного контроля и определение начальной загрузки перед мутациями хоста
  ansible.builtin.include_tasks: authorization_inputs.yml
  when: _platform_kafka_scram_enabled

- name: Один раз подготовить предварительные требования хоста Kafka
  ansible.builtin.include_tasks: prepare_host.yml
  when:
    - not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'
    - _platform_kafka_local_instances | length > 0

- name: Определение удостоверений сертификата экземпляра доверенной службы перед активацией авторизатора
  ansible.builtin.include_tasks: authorization_identity.yml
  loop: "{{ _platform_kafka_instances }}"
  loop_control:
    loop_var: kafka_authorization_member
  when: _platform_kafka_scram_enabled

- name: Применить локальные экземпляры службы Kafka в детерминированном порядке узлов
  ansible.builtin.include_tasks: member.yml
  loop: "{{ _platform_kafka_local_instances }}"
  loop_control:
    loop_var: kafka_member
    label: "{{ kafka_member.id }}"
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: Дождаться всех локальных портов Kafka listeners после запуска экземпляра
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item.1 }}"
    state: started
    timeout: "{{ (platform_kafka_startup_readiness_retries | int) * (platform_kafka_startup_readiness_delay | int) }}"
  loop: "{{ _platform_kafka_local_instances | subelements('listener_ports', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.id }}:{{ item.1 }}"
  when: not (platform_kafka_verify_only | bool) and platform_kafka_phase != 'schema_registry'

- name: "Настроить администратора перед последовательным отзывом bootstrap-доступа"
  ansible.builtin.include_tasks: authorization_transition.yml
  when:
    - _platform_kafka_scram_enabled
    - platform_kafka_phase != 'schema_registry'

- name: "Подтвердить загрузку итоговой конфигурации Kafka перед следующим этапом"
  ansible.builtin.include_tasks: authorization_confirm.yml
  loop: "{{ _platform_kafka_local_instances }}"
  loop_control:
    loop_var: kafka_authorization_member
  when: _platform_kafka_scram_enabled

- name: Проверка локальных экземпляров службы Kafka и кластера
  ansible.builtin.include_tasks: verify.yml
  when: platform_kafka_verify_only | bool

- name: Применить или проверить дополнительный компонент Schema Registry
  ansible.builtin.include_tasks: schema_registry.yml
  when:
    - platform_kafka_schema_registry_enabled
    - _platform_kafka_registry_local | length > 0
    - platform_kafka_phase in ['full', 'schema_registry'] or platform_kafka_verify_only
