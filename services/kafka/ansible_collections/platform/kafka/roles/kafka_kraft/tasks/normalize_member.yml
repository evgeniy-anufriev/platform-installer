---
- name: Derive normalized Kafka member primitives
  ansible.builtin.set_fact:
    _platform_kafka_normalized_roles: "{{ kafka_input_member.roles | unique | sort }}"
    _platform_kafka_normalized_config_directory: "{{ kafka_input_member.config_directory | default(platform_kafka_config_directory ~ '/' ~ platform_kafka_service_name ~ '/' ~ kafka_input_member.id) }}"
    _platform_kafka_normalized_compatibility_unit: "{{ kafka_input_member._compatibility_unit | default({}) }}"
    _platform_kafka_normalized_deployment_id: "{{ kafka_input_member.deployment_id | default(platform_kafka_deployment_id) }}"
    _platform_kafka_normalized_unit_service: >-
      {{ 'platform-kafka' if ('broker' in kafka_input_member.roles and 'controller' in kafka_input_member.roles)
         else ('platform-kafka-broker' if 'broker' in kafka_input_member.roles else 'platform-kafka-controller') }}
    _platform_kafka_normalized_member_number: "{{ kafka_input_member.id | regex_replace('^.*-', '') }}"

- name: Derive normalized Kafka member runtime directory
  ansible.builtin.set_fact:
    _platform_kafka_normalized_runtime_directory: "{{ _platform_kafka_normalized_compatibility_unit.runtime_directory | default(platform_kafka_config_directory ~ '/' ~ platform_kafka_service_name ~ '-' ~ kafka_input_member.id) }}"

- name: Derive normalized Kafka member runtime resources
  ansible.builtin.set_fact:
    _platform_kafka_normalized_legacy_unit_name: "{{ _platform_kafka_normalized_compatibility_unit.name | default(platform_kafka_service_name ~ '@' ~ platform_kafka_service_name ~ '-' ~ kafka_input_member.id) }}"
    _platform_kafka_normalized_unit_name: "{{ _platform_kafka_normalized_unit_service }}@{{ _platform_kafka_normalized_deployment_id }}-{{ _platform_kafka_normalized_member_number }}.service"
    _platform_kafka_normalized_unit_destination: "/etc/systemd/system/{{ _platform_kafka_normalized_unit_service }}@{{ _platform_kafka_normalized_deployment_id }}-{{ _platform_kafka_normalized_member_number }}.service"
    _platform_kafka_normalized_environment_pattern: "{{ _platform_kafka_normalized_compatibility_unit.environment_pattern | default(_platform_kafka_normalized_runtime_directory ~ '/systemd.env') }}"
    _platform_kafka_normalized_description: "{{ _platform_kafka_normalized_compatibility_unit.description | default('Apache Kafka 4.3.1 KRaft member %i') }}"
    _platform_kafka_normalized_listeners: "{{ kafka_input_member.listeners | default({}) }}"
    _platform_kafka_normalized_client_listener_port: "{{ kafka_input_member.listeners | default({}) | dict2items | selectattr('value.purpose', 'equalto', 'client') | map(attribute='value.port') | list | first | default(0, true) }}"
    _platform_kafka_normalized_controller_listener_port: "{{ kafka_input_member.listeners | default({}) | dict2items | selectattr('value.purpose', 'equalto', 'controller') | map(attribute='value.port') | list | first | default(0, true) }}"
    _platform_kafka_normalized_listener_ports: >-
      {{ ((kafka_input_member.listeners | default({}) | dict2items
            | selectattr('value.purpose', 'in', (['client', 'interBroker'] if 'broker' in _platform_kafka_normalized_roles else ['__none__']))
            | map(attribute='value.port') | map('int') | list)
          + (kafka_input_member.listeners | default({}) | dict2items
            | selectattr('value.purpose', 'equalto', 'controller')
            | selectattr('value.purpose', 'equalto', ('controller' if 'controller' in _platform_kafka_normalized_roles else '__none__'))
            | map(attribute='value.port') | map('int') | list)
          if (kafka_input_member.listeners | default({}) | length > 0)
          else []) | unique | sort }}

- name: Build normalized Kafka listener endpoint projection
  ansible.builtin.set_fact:
    _platform_kafka_normalized_listener_endpoints: >-
      {% set endpoints = [] %}
      {% for pair in (kafka_input_member.listeners | default({}) | dict2items | sort(attribute='key')) %}
      {% set listener = pair.value | combine({'name': pair.key}) %}
      {% if (listener.purpose == 'controller' and 'controller' in _platform_kafka_normalized_roles) or (listener.purpose in ['client', 'interBroker'] and 'broker' in _platform_kafka_normalized_roles) %}
      {% set _ = endpoints.append({
        'name': listener.name,
        'purpose': listener.purpose,
        'security_protocol': listener.securityProtocol,
        'bootstrap_host': listener.advertisedAddress | default(kafka_input_member.advertised_host),
        'bootstrap_port': listener.port | int
      }) %}
      {% endif %}
      {% endfor %}
      {{ endpoints | to_json }}

- name: Convert normalized Kafka listener endpoint projection to a native list
  ansible.builtin.set_fact:
    _platform_kafka_normalized_listener_endpoints: "{{ _platform_kafka_normalized_listener_endpoints | from_json }}"

- name: Select normalized Kafka controller and client endpoints
  ansible.builtin.set_fact:
    _platform_kafka_normalized_controller_endpoint: >-
      {{ _platform_kafka_normalized_listener_endpoints
         | selectattr('purpose', 'equalto', 'controller') | list | first | default({}, true) }}
    _platform_kafka_normalized_client_endpoint: >-
      {{ _platform_kafka_normalized_listener_endpoints
         | selectattr('purpose', 'equalto', 'client') | list | first | default({}, true) }}

- name: Assemble normalized Kafka member
  ansible.builtin.set_fact:
    _platform_kafka_normalized_member: >-
      {{ (kafka_input_member | combine({
           'id': kafka_input_member.id | string,
           'deployment_id': _platform_kafka_normalized_deployment_id,
           'legacy_systemd_unit_name': _platform_kafka_normalized_legacy_unit_name ~ '.service',
           'node_id': kafka_input_member.node_id | int,
           'roles': _platform_kafka_normalized_roles,
           'listeners': _platform_kafka_normalized_listeners,
           'listener_endpoints': _platform_kafka_normalized_listener_endpoints,
           'controller_endpoint': _platform_kafka_normalized_controller_endpoint,
           'client_endpoint': _platform_kafka_normalized_client_endpoint,
           'client_listener_port': _platform_kafka_normalized_client_listener_port,
           'controller_listener_port': _platform_kafka_normalized_controller_listener_port,
           'tls_profile': (kafka_input_member.tls_profile | default(platform_kafka_tls_profile)),
           'config_directory': _platform_kafka_normalized_config_directory,
           'runtime_directory': _platform_kafka_normalized_runtime_directory,
           'systemd_unit_name': _platform_kafka_normalized_unit_name,
           'systemd_unit_ownership_marker': '# platform-kafka-managed: ' ~ _platform_kafka_normalized_unit_name,
           'systemd_unit_destination': _platform_kafka_normalized_unit_destination,
           'systemd_environment_pattern': _platform_kafka_normalized_environment_pattern,
           'systemd_description': _platform_kafka_normalized_description,
           'listener_ports': _platform_kafka_normalized_listener_ports,
           'clear_paths': [
             _platform_kafka_normalized_config_directory,
             kafka_input_member.data_directory,
             kafka_input_member.log_directory
           ],
           'managed_paths': [
             _platform_kafka_normalized_config_directory,
             _platform_kafka_normalized_runtime_directory,
             kafka_input_member.data_directory,
             kafka_input_member.log_directory
           ]
         })) | dict2items | rejectattr('key', 'equalto', '_compatibility_unit') | items2dict }}

- name: Append normalized Kafka member
  ansible.builtin.set_fact:
    _platform_kafka_instances: "{{ _platform_kafka_instances + [_platform_kafka_normalized_member] }}"
