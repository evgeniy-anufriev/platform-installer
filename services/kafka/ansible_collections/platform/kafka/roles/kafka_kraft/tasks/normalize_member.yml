---
- name: Нормализация отдельного экземпляра через общий пакетный шаблон
  ansible.builtin.set_fact:
    _platform_kafka_normalized_member: "{{ (lookup('ansible.builtin.template', 'normalized-members.json.j2') | from_json)[0] }}"
  vars:
    kafka_normalization_members: "{{ [kafka_input_member] }}"

- name: Добавление нормализованного экземпляра службы Kafka
  ansible.builtin.set_fact:
    _platform_kafka_instances: "{{ _platform_kafka_instances + [_platform_kafka_normalized_member] }}"
