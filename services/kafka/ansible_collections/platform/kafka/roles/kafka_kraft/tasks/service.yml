---
- name: Install Kafka systemd unit
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "/etc/systemd/system/{{ platform_kafka_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Kafka

- name: Enable and start Kafka
  ansible.builtin.systemd:
    name: "{{ platform_kafka_service_name }}"
    enabled: true
    state: started
