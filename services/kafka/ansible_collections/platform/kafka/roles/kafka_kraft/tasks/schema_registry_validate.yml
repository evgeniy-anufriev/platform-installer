---
- name: Validate Registry component and execution phase
  ansible.builtin.assert:
    that:
      - platform_kafka_phase in ['full', 'kafka', 'schema_registry']
      - platform_kafka_schema_registry_enabled is boolean
      - platform_kafka_schema_registry_version is string
      - platform_kafka_schema_registry_version | length > 0
      - platform_kafka_schema_registry_archive_directory is string
      - platform_kafka_schema_registry_archive_directory | length > 0
      - platform_kafka_schema_registry_install_directory is string
      - platform_kafka_schema_registry_install_directory is match('^/opt/[A-Za-z0-9_.-]+$')
      - platform_kafka_schema_registry_name is match('^[A-Za-z0-9_-]+$')
    fail_msg: SCHEMA_REGISTRY_INPUT_INVALID

- name: Project Registry resources through the shared Core filter
  ansible.builtin.set_fact:
    _platform_kafka_registry_projection: >-
      {{ _platform_kafka_instances | platform.core.platform_kafka_schema_registry_projection(
           platform_kafka_schema_registry_enabled,
           platform_kafka_schema_registry_kafka_listener,
           platform_kafka_schema_registry_http_port,
           platform_kafka_schema_registry_https_port,
           platform_kafka_schema_registry_name,
           platform_kafka_schema_registry_config_directory,
           platform_kafka_schema_registry_log_directory) }}

- name: Reject invalid Registry topology and ports before mutation
  ansible.builtin.assert:
    that: _platform_kafka_registry_projection.findings | length == 0
    fail_msg: "{{ _platform_kafka_registry_projection.findings }}"

- name: Select local Registry instances
  ansible.builtin.assert:
    that:
      - "'offsets.topic.replication.factor' not in platform_kafka_advanced_config or platform_kafka_advanced_config['offsets.topic.replication.factor'] is integer"
      - "'offsets.topic.replication.factor' not in platform_kafka_advanced_config or platform_kafka_advanced_config['offsets.topic.replication.factor'] is not boolean"
      - (_platform_kafka_advanced_config_rf | int) >= 1
      - (_platform_kafka_advanced_config_rf | int) <= (_platform_kafka_broker_instances | length)
    fail_msg: SCHEMA_REGISTRY_OFFSETS_TOPIC_REPLICATION_UNSATISFIABLE
  vars:
    _platform_kafka_advanced_config_rf: "{{ platform_kafka_advanced_config.get('offsets.topic.replication.factor', ([3, _platform_kafka_broker_instances | length] | min)) }}"
  when: platform_kafka_schema_registry_enabled

- name: Select Registry instances on this host
  ansible.builtin.set_fact:
    _platform_kafka_registry_local: >-
      {{ _platform_kafka_registry_projection.instances
         | selectattr('host', 'equalto', inventory_hostname) | list }}

- name: Preflight the selected Registry source before Kafka mutation
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: schema-registry-binary, name: confluent-schema-registry}
  when:
    - platform_kafka_schema_registry_enabled
    - _platform_kafka_registry_local | length > 0
    - platform_artifact_source_authority_active | default(false) or platform_resolved_artifact_sources is defined

- name: Inspect Registry unit ownership before mutation
  ansible.builtin.stat:
    path: "{{ registry_instance.unit_path }}"
    follow: false
    get_checksum: false
  loop: "{{ _platform_kafka_registry_local }}"
  loop_control:
    loop_var: registry_instance
    label: "{{ registry_instance.id }}"
  register: _platform_kafka_registry_unit_stats

- name: Reject unsafe Registry unit paths
  ansible.builtin.assert:
    that: not item.stat.exists or (item.stat.isreg | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: SCHEMA_REGISTRY_UNIT_PATH_UNSAFE
  loop: "{{ _platform_kafka_registry_unit_stats.results }}"
  loop_control:
    label: "{{ item.registry_instance.id }}"

- name: Read only existing Registry unit ownership headers
  ansible.builtin.command:
    argv: [head, -n, '1', "{{ item.registry_instance.unit_path }}"]
  changed_when: false
  loop: "{{ _platform_kafka_registry_unit_stats.results }}"
  loop_control:
    label: "{{ item.registry_instance.id }}"
  when: item.stat.exists
  register: _platform_kafka_registry_unit_headers

- name: Refuse foreign Registry units and implicit component removal
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.registry_instance.ownership_marker
      - platform_kafka_schema_registry_enabled or platform_kafka_clean_install
    fail_msg: SCHEMA_REGISTRY_UNIT_FOREIGN_OR_EXPLICIT_REMOVAL_REQUIRED
  loop: "{{ _platform_kafka_registry_unit_headers.results }}"
  loop_control:
    label: "{{ item.item.registry_instance.id }}"
  when: not (item.skipped | default(false))

- name: Prove independent ownership of Registry member roots
  ansible.builtin.include_tasks: schema_registry_ownership.yml
