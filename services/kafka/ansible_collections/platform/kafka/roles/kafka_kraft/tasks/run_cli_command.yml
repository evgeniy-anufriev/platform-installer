---
- block:
    - name: Подготовка отдельной конфигурации Kafka CLI
      ansible.builtin.include_tasks: prepare_cli_config.yml
      when: kafka_cli_prepared_config is not defined

    - name: Выполнение вычисленной команды Kafka CLI без изменений
      ansible.builtin.command:
        argv: "{{ kafka_cli_command_prefix + ['--command-config', (kafka_cli_prepared_config | default(_platform_kafka_cli_command_config)).path] + kafka_cli_command_suffix }}"
      changed_when: false
      register: platform_kafka_cli_command_result
      failed_when: false
      until:
        - platform_kafka_cli_command_result.rc == 0
        - >-
          kafka_cli_expected_controller_ids is not defined or
          (platform_kafka_cli_command_result.stdout
           | regex_findall('"id":\\s*([0-9]+),') | map('int') | unique | sort)
          == (kafka_cli_expected_controller_ids | map('int') | unique | sort)
        - >-
          kafka_cli_expected_unfenced_broker_count is not defined or
          (platform_kafka_cli_command_result.stdout_lines
           | select('search', 'isFenced:\\s*false\\)\\s*->\\s*\\(')
           | list | length) == (kafka_cli_expected_unfenced_broker_count | int)
      retries: "{{ platform_kafka_startup_readiness_retries }}"
      delay: "{{ platform_kafka_startup_readiness_delay }}"
  always:
    - name: Удаление временной конфигурации Kafka CLI
      ansible.builtin.file:
        path: "{{ _platform_kafka_cli_command_config.path }}"
        state: absent
      changed_when: false
      when:
        - kafka_cli_prepared_config is not defined
        - _platform_kafka_cli_command_config.path is defined
