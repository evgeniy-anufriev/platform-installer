---
- name: Чтение всех ACL развёртывания одним вызовом Kafka CLI
  ansible.builtin.command:
    argv: ["{{ application_topic_cli_directory }}/bin/kafka-acls{{ platform_kafka_script_extension }}", --bootstrap-server, "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}", --command-config, "{{ application_kafka_private.path }}/admin.properties", --list, --resource-pattern-type, any]
  register: application_kafka_acl_inventory
  changed_when: false
  failed_when: false
  no_log: true

- name: Проверка успешности чтения ACL развёртывания
  ansible.builtin.assert:
    that: application_kafka_acl_inventory.rc == 0
    fail_msg: APPLICATION_KAFKA_ACL_READ_FAILED
  no_log: true
