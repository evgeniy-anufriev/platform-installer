---
- name: Однократно прочитать Kafka ACL выбранного principal
  ansible.builtin.command:
    argv: "{{ [application_topic_cli_directory ~ '/bin/kafka-acls.sh', '--bootstrap-server', application_topic_candidate.address ~ ':' ~ application_topic_candidate.port, '--command-config', application_kafka_private.path ~ '/admin.properties', '--list', '--principal', 'User:' ~ application_kafka_account.name, '--resource-pattern-type', 'any'] }}"
  register: application_kafka_acl_inventory
  changed_when: false
  failed_when: false
  no_log: true

- name: Требовать читаемый основной инвентарь ACL
  ansible.builtin.assert:
    that: application_kafka_acl_inventory.rc == 0
    fail_msg: APPLICATION_KAFKA_ACL_READ_FAILED
