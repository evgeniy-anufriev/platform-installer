---
- name: Resolve Registry source before installation
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: schema-registry-binary, name: confluent-schema-registry}
  when:
    - not platform_kafka_verify_only
    - platform_artifact_source_authority_active | default(false) or platform_resolved_artifact_sources is defined

- name: Deliver Registry offline artifact using the existing source authority
  ansible.builtin.include_role:
    name: platform.core.artifact_delivery
  vars:
    platform_artifact_delivery_requirements:
      - {id: schema-registry-binary, name: confluent-schema-registry}
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is defined

- name: Install the approved Registry package when repository wins
  ansible.builtin.package:
    name: "confluent-schema-registry-{{ platform_kafka_schema_registry_version }}"
    state: present
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is defined
    - platform_resolved_artifact_sources['schema-registry-binary'].source == 'REPOSITORY'

- name: Select Registry archive and source location
  ansible.builtin.set_fact:
    _platform_kafka_registry_archive: >-
      {{ platform_offline_artifact_paths['schema-registry-binary'][0]
         if platform_resolved_artifact_sources is defined
         else platform_kafka_schema_registry_artifact_path | default('') }}
    _platform_kafka_registry_remote_archive: "{{ platform_resolved_artifact_sources is defined }}"
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Check Registry offline archive before extraction
  ansible.builtin.stat:
    path: "{{ _platform_kafka_registry_archive }}"
    checksum_algorithm: sha256
  delegate_to: "{{ inventory_hostname if _platform_kafka_registry_remote_archive else 'localhost' }}"
  become: "{{ _platform_kafka_registry_remote_archive }}"
  register: _platform_kafka_registry_archive_stat
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Require the pinned Registry artifact bytes
  ansible.builtin.assert:
    that:
      - _platform_kafka_registry_archive_stat.stat.isreg | default(false)
      - _platform_kafka_registry_archive_stat.stat.checksum | default('') == 'dc4d6234e0f7e1a91b369f9cf1d27d7c9885edb9f6440170c3a6f00ba68fcc81'
    fail_msg: SCHEMA_REGISTRY_ARTIFACT_MISSING_OR_CHECKSUM_MISMATCH
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Inspect immutable Registry installation root
  ansible.builtin.stat:
    path: "{{ platform_kafka_schema_registry_install_directory }}"
    follow: false
    get_checksum: false
  register: _platform_kafka_registry_install_stat

- name: Reject unsafe Registry installation root
  ansible.builtin.assert:
    that: not _platform_kafka_registry_install_stat.stat.exists or (_platform_kafka_registry_install_stat.stat.isdir | default(false) and not (_platform_kafka_registry_install_stat.stat.islnk | default(false)))
    fail_msg: SCHEMA_REGISTRY_INSTALL_PATH_UNSAFE

- name: Extract verified Confluent distribution once
  ansible.builtin.command:
    argv: [cat, "{{ platform_kafka_schema_registry_install_directory }}/.platform-approved-sha256"]
  changed_when: false
  failed_when: false
  register: _platform_kafka_registry_install_marker
  when:
    - _platform_kafka_registry_install_stat.stat.exists
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Reject unowned or incompatible existing Confluent distribution
  ansible.builtin.assert:
    that:
      - _platform_kafka_registry_install_marker.rc == 0
      - _platform_kafka_registry_install_marker.stdout == 'dc4d6234e0f7e1a91b369f9cf1d27d7c9885edb9f6440170c3a6f00ba68fcc81'
    fail_msg: SCHEMA_REGISTRY_INSTALL_OWNERSHIP_UNKNOWN
  when:
    - _platform_kafka_registry_install_stat.stat.exists
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Extract the approved Confluent distribution once
  ansible.builtin.unarchive:
    src: "{{ _platform_kafka_registry_archive }}"
    dest: /opt
    remote_src: "{{ _platform_kafka_registry_remote_archive }}"
    creates: "{{ platform_kafka_schema_registry_install_directory }}/share/java/schema-registry/kafka-schema-registry-8.3.2.jar"
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Record approved immutable distribution identity
  ansible.builtin.copy:
    content: 'dc4d6234e0f7e1a91b369f9cf1d27d7c9885edb9f6440170c3a6f00ba68fcc81'
    dest: "{{ platform_kafka_schema_registry_install_directory }}/.platform-approved-sha256"
    owner: root
    group: root
    mode: '0644'
  when:
    - not platform_kafka_verify_only
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Check the pinned Registry JAR exists for offline installations
  ansible.builtin.stat:
    path: "{{ platform_kafka_schema_registry_install_directory }}/share/java/schema-registry/kafka-schema-registry-8.3.2.jar"
    follow: false
  register: _platform_kafka_registry_jar
  when: platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Require the pinned Registry distribution
  ansible.builtin.assert:
    that: _platform_kafka_registry_jar.stat.isreg | default(false) and not (_platform_kafka_registry_jar.stat.islnk | default(false))
    fail_msg: SCHEMA_REGISTRY_VERSION_UNAVAILABLE
  when: platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['schema-registry-binary'].source == 'OFFLINE_BUNDLE'

- name: Resolve the selected Registry launcher
  ansible.builtin.set_fact:
    _platform_kafka_registry_launcher: >-
      {{ '/usr/bin/schema-registry-start'
         if (platform_resolved_artifact_sources is defined and platform_resolved_artifact_sources['schema-registry-binary'].source == 'REPOSITORY')
         else platform_kafka_schema_registry_install_directory ~ '/bin/schema-registry-start' }}

- name: Create Registry service group
  ansible.builtin.group:
    name: "{{ platform_kafka_schema_registry_group }}"
    system: true
  when: not platform_kafka_verify_only

- name: Create Registry service account
  ansible.builtin.user:
    name: "{{ platform_kafka_schema_registry_user }}"
    group: "{{ platform_kafka_schema_registry_group }}"
    system: true
    create_home: false
  when: not platform_kafka_verify_only

- name: Apply or verify each Registry alongside its broker
  ansible.builtin.include_tasks: schema_registry_member.yml
  loop: "{{ _platform_kafka_registry_local }}"
  loop_control:
    loop_var: registry_instance
    label: "{{ registry_instance.id }}"

- name: Verify reachable trusted HTTPS peers
  ansible.builtin.uri:
    url: "{{ item.https_url }}/subjects"
    method: GET
    status_code: 200
    validate_certs: true
    ca_path: "{{ (_platform_kafka_registry_local | first).config_directory }}/pki/ca-chain.pem"
    use_proxy: false
  loop: "{{ _platform_kafka_registry_projection.instances }}"
  loop_control:
    label: "{{ item.id }}"
  register: _platform_kafka_registry_peer_ready
  retries: "{{ platform_kafka_schema_registry_readiness_retries }}"
  delay: "{{ platform_kafka_schema_registry_readiness_delay }}"
  until: _platform_kafka_registry_peer_ready.status | default(0) == 200
