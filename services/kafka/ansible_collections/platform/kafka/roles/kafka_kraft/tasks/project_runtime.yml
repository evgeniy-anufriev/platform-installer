---
- name: Initialize optional legacy project manifest
  ansible.builtin.set_fact:
    _platform_kafka_project_manifest: {}
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Load legacy project desired state when Ansible-native state is absent
  ansible.builtin.include_vars:
    file: "{{ platform_project_manifest_path | default(inventory_dir ~ '/../project.yml', true) }}"
    name: _platform_kafka_project_manifest
  delegate_to: localhost
  delegate_facts: true
  run_once: true
  become: false
  when: platform_desired_state | default({}) | length == 0

- name: Select Ansible-native desired state with legacy compatibility
  ansible.builtin.set_fact:
    _platform_kafka_project_state: >-
      {{ platform_desired_state
         if (platform_desired_state | default({}) | length > 0)
         else (hostvars['localhost']._platform_kafka_project_manifest.desiredState
         if (hostvars['localhost']._platform_kafka_project_manifest.desiredState is defined)
         else (platform_project | default({}))) }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Initialize projected Kafka member list
  ansible.builtin.set_fact:
    platform_kafka_instances: []

- name: Select managed Kafka deployment
  ansible.builtin.set_fact:
    _platform_kafka_managed_deployment: >-
      {{ (hostvars['localhost']._platform_kafka_project_state.serviceDeployments | dict2items
          | selectattr('value.serviceType', 'equalto', 'kafka') | list | first) }}

- name: Select the exact approved Kafka deployment when executing a plan
  ansible.builtin.set_fact:
    _platform_kafka_managed_deployment:
      key: "{{ platform_execution_service_deployment }}"
      value: "{{ hostvars['localhost']._platform_kafka_project_state.serviceDeployments[platform_execution_service_deployment] }}"
  when: platform_execution_service_deployment is defined

- name: Select machine-owned Kafka deployment state
  ansible.builtin.set_fact:
    _platform_kafka_generated_deployment_state: >-
      {{ (platform_generated_state | default({})).get('serviceDeployments', {}).get(
           _platform_kafka_managed_deployment.key, {}) }}

- name: Project deployment-scoped Kafka identity
  ansible.builtin.set_fact:
    platform_kafka_cluster_id: >-
          {{ _platform_kafka_generated_deployment_state.get('identity', {}).get('clusterId', '')
          | default(_platform_kafka_managed_deployment.value.get('identity', {}).get('clusterId', ''), true)
          | default('', true) }}

- name: Project explicit deployment-scoped Kafka settings
  ansible.builtin.set_fact:
    platform_kafka_quorum_mode: "{{ _platform_kafka_managed_deployment.value.configuration.quorumMode }}"
  when: "'quorumMode' in (_platform_kafka_managed_deployment.value.configuration | default({}))"

- name: Project each Kafka deployment
  ansible.builtin.set_fact:
    platform_kafka_schema_registry_enabled: "{{ _platform_kafka_managed_deployment.value.configuration.schemaRegistryEnabled | default(platform_kafka_schema_registry_enabled) }}"
    platform_kafka_schema_registry_kafka_listener: "{{ _platform_kafka_managed_deployment.value.configuration.schemaRegistryKafkaListener | default(platform_kafka_schema_registry_kafka_listener) }}"

# project_deployment_host.yml resolves member/deployment REST ports directly.
# Do not copy integer defaults through scalar set_fact: classic Jinja turns them
# into strings before the shared Registry projection validates their types.

- name: Project each Kafka deployment with Registry settings
  ansible.builtin.include_tasks: project_deployment.yml
  loop: "{{ (hostvars['localhost']._platform_kafka_project_state.serviceDeployments | default({}) | dict2items) }}"
  loop_control:
    loop_var: _platform_kafka_project_deployment
    label: "{{ _platform_kafka_project_deployment.key }}"
  when:
    - _platform_kafka_project_deployment.value.serviceType | default('') == 'kafka'
    - platform_execution_service_deployment is not defined or _platform_kafka_project_deployment.key == platform_execution_service_deployment
