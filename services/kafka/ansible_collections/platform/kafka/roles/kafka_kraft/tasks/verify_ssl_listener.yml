---
- name: Resolve Kafka TLS runtime projection for SSL verification
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_member }}"

- name: Perform real TLS handshake for Kafka listener
  ansible.builtin.shell: |
    set -eu
    verification_host={{ kafka_ssl_listener.advertisedAddress | default(kafka_member.advertised_host) | quote }}
    verification_option=-verify_hostname
    case "$verification_host" in
      *:*) verification_option=-verify_ip ;;
      *[!0-9.]*) ;;
      *) verification_option=-verify_ip ;;
    esac
    timeout 15 openssl s_client \
      -connect 127.0.0.1:{{ kafka_ssl_listener.port }} \
      -CAfile {{ _platform_kafka_tls_runtime.targetDirectory }}/ca-chain.pem \
      -cert {{ _platform_kafka_tls_runtime.targetDirectory }}/certificate.pem \
      -key {{ _platform_kafka_tls_runtime.targetDirectory }}/private-key.pem \
      "$verification_option" "$verification_host" \
      -verify_return_error -brief </dev/null
  args:
    executable: /bin/bash
  changed_when: false
  register: platform_kafka_ssl_handshake
  retries: "{{ platform_kafka_startup_readiness_retries }}"
  delay: "{{ platform_kafka_startup_readiness_delay }}"
  until: platform_kafka_ssl_handshake.rc == 0

- name: Assert Kafka SSL handshake succeeded
  ansible.builtin.assert:
    that:
      - platform_kafka_ssl_handshake.rc == 0
    fail_msg: Kafka SSL listener did not complete certificate validation
