---
- name: Разрешение проекции времени выполнения Kafka TLS для проверки SSL
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_member }}"

- name: Проверка существующего потребителя Kafka PEM без его изменения
  ansible.builtin.include_tasks: pem_identity.yml
  vars:
    kafka_pem_source_directory: "{{ _platform_kafka_tls_runtime.targetDirectory }}"
    kafka_pem_identity_path: "{{ _platform_kafka_tls_runtime.keystorePath }}"
    kafka_pem_ca_path: "{{ _platform_kafka_tls_runtime.truststorePath }}"
    kafka_pem_owner: "{{ platform_kafka_user }}"
    kafka_pem_group: "{{ platform_kafka_group }}"
    kafka_pem_verify_only: true
  when: _platform_kafka_tls_runtime.storeType == 'PEM'

- name: Прочитать конфигурацию установленного экземпляра службы, не раскрывая ее
  ansible.builtin.slurp:
    src: "{{ kafka_member.config_directory }}/server.properties"
  register: _platform_kafka_pem_member_config
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PEM'

- name: Проверить использование выбранных PEM-файлов установленной конфигурацией Kafka listener
  ansible.builtin.assert:
    that:
      - "('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.type=PEM') in (_platform_kafka_pem_member_config.content | b64decode).splitlines()"
      - "('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.type=PEM') in (_platform_kafka_pem_member_config.content | b64decode).splitlines()"
      - "('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.location=' ~ _platform_kafka_tls_runtime.keystorePath) in (_platform_kafka_pem_member_config.content | b64decode).splitlines()"
      - "('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.location=' ~ _platform_kafka_tls_runtime.truststorePath) in (_platform_kafka_pem_member_config.content | b64decode).splitlines()"
      - >-
        (_platform_kafka_pem_member_config.content | b64decode).splitlines()
        | select('match', '^listener\\.name\\.' ~ (kafka_ssl_listener.name | lower) ~ '\\.ssl\\.(key|keystore|truststore)\\.password=') | list | length == 0
    fail_msg: KAFKA_PEM_CONFIG_DRIFT
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PEM'

- name: Выполнить реальное TLS-соединение с listener Kafka
  ansible.builtin.shell: |
    set -eu
    verification_host={{ kafka_ssl_listener.advertisedAddress | default(kafka_member.advertised_host) | quote }}
    verification_option=-verify_hostname
    case "$verification_host" in
      *:*) verification_option=-verify_ip ;;
      *[!0-9.]*) ;;
      *) verification_option=-verify_ip ;;
    esac
    timeout 15 openssl s_client \
      -connect 127.0.0.1:{{ kafka_ssl_listener.port }} \
      -CAfile {{ _platform_kafka_tls_runtime.targetDirectory }}/ca-chain.pem \
      -cert {{ _platform_kafka_tls_runtime.targetDirectory }}/certificate.pem \
      -key {{ _platform_kafka_tls_runtime.targetDirectory }}/private-key.pem \
      "$verification_option" "$verification_host" \
      -verify_return_error -brief </dev/null
  args:
    executable: /bin/bash
  changed_when: false
  register: platform_kafka_ssl_handshake
  retries: "{{ platform_kafka_startup_readiness_retries }}"
  delay: "{{ platform_kafka_startup_readiness_delay }}"
  until: platform_kafka_ssl_handshake.rc == 0

- name: Подтвердить успешное рукопожатие Kafka SSL
  ansible.builtin.assert:
    that:
      - platform_kafka_ssl_handshake.rc == 0
    fail_msg: Kafka SSL listener did not complete certificate validation
