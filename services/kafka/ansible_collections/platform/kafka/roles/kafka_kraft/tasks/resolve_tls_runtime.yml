---
- name: "Выбор действующих запросов и наборов планов PKI-01"
  ansible.builtin.set_fact:
    _platform_kafka_tls_runtime_all_requests: >-
      {{ platform_pki_requests
         | default(hostvars['localhost'].platform_pki_requests | default([]), true) }}
    _platform_kafka_tls_runtime_candidate_plans: >-
      {{ (platform_pki_materialization_plans
          | default(hostvars['localhost'].platform_pki_materialization_plans | default([]), true)
          | selectattr('hostId', 'equalto', kafka_tls_member.host)
          | selectattr('tlsProfileId', 'equalto', kafka_tls_member.tls_profile)
          | list) }}
    _platform_kafka_tls_runtime_request_ids: >-
      {{ ([] if kafka_tls_member.deployment_id is defined
          else (platform_pki_materialization_plans
                | default(hostvars['localhost'].platform_pki_materialization_plans | default([]), true)
                | selectattr('hostId', 'equalto', kafka_tls_member.host)
                | selectattr('tlsProfileId', 'equalto', kafka_tls_member.tls_profile)
                | map(attribute='requestId') | unique | list)) }}
  changed_when: false

- name: Привязка управляемого Kafka TLS к точному потребительскому запросу PKI
  ansible.builtin.set_fact:
    _platform_kafka_tls_runtime_request_ids: >-
      {{ _platform_kafka_tls_runtime_request_ids + [item.id] }}
  loop: "{{ _platform_kafka_tls_runtime_all_requests }}"
  loop_control:
    label: "{{ item.id | default('unknown') }}"
  when:
    - kafka_tls_member.deployment_id is defined
    - >-
      item.consumers | default([])
      | selectattr('deploymentId', 'equalto', kafka_tls_member.deployment_id)
      | selectattr('memberId', 'equalto', kafka_tls_member.id)
      | selectattr('hostId', 'equalto', kafka_tls_member.host)
      | selectattr('tlsProfileRef', 'equalto', kafka_tls_member.tls_profile)
      | list | length == 1
  changed_when: false

- name: Выбор плана PKI-01 для runtime-проекции Kafka TLS
  ansible.builtin.set_fact:
    _platform_kafka_tls_runtime_plans: >-
      {{ _platform_kafka_tls_runtime_candidate_plans
         | selectattr('requestId', 'in', _platform_kafka_tls_runtime_request_ids)
         | list }}
    _platform_kafka_tls_runtime_requests: >-
      {{ _platform_kafka_tls_runtime_all_requests
         | selectattr('id', 'in', _platform_kafka_tls_runtime_request_ids)
         | list }}
  changed_when: false

- name: Проверка рассчитанных параметров TLS-подключения Kafka
  ansible.builtin.assert:
    that:
      - _platform_kafka_tls_runtime_plans | length == 1
      - _platform_kafka_tls_runtime_requests | length == 1
      - "'serverAuth' in _platform_kafka_tls_runtime_requests[0].usages"
      - "'clientAuth' in _platform_kafka_tls_runtime_requests[0].usages"
      - platform_kafka_store_type in ['PEM', 'PKCS12']
      - "'PEM' in _platform_kafka_tls_runtime_plans[0].formats"
    fail_msg: 'BLOCKED: Kafka TLS requires exact PKI-01 serverAuth/clientAuth material and PEM or PKCS12 store type'

- name: Проверка наличия PKCS12-хранилищ в плане и runtime-пароля по SecretRef
  ansible.builtin.assert:
    that:
      - "['PKCS12_KEYSTORE', 'PKCS12_TRUSTSTORE'] | difference(_platform_kafka_tls_runtime_plans[0].formats) | length == 0"
      - _platform_kafka_tls_runtime_plans[0].storePasswordSecretRef is defined
      - _platform_kafka_tls_runtime_plans[0].storePasswordSecretRef in (platform_pki_secret_files | default(hostvars['localhost'].platform_pki_secret_files | default({}), true))
      - (platform_pki_secret_files | default(hostvars['localhost'].platform_pki_secret_files | default({}), true))[_platform_kafka_tls_runtime_plans[0].storePasswordSecretRef] | length > 0
    fail_msg: 'BLOCKED: explicit PKCS12 requires PKI stores and a runtime store SecretRef'
  when: platform_kafka_store_type == 'PKCS12'

- name: Построение проекции времени выполнения Kafka TLS без секретных значений
  ansible.builtin.set_fact:
    _platform_kafka_tls_runtime: >-
      {{ {
           'targetDirectory': _platform_kafka_tls_runtime_plans[0].targetDirectory,
           'consumerDirectory': (platform_kafka_pki_directory
             if (platform_kafka_pki_directory | default('', true) | length > 0)
             else (kafka_tls_member.config_directory ~ '/pki')),
           'keystorePath': ((platform_kafka_pki_directory
             if (platform_kafka_pki_directory | default('', true) | length > 0)
             else (kafka_tls_member.config_directory ~ '/pki')) ~ ('/identity.pem' if platform_kafka_store_type == 'PEM' else '/keystore.p12')),
           'truststorePath': ((platform_kafka_pki_directory
             if (platform_kafka_pki_directory | default('', true) | length > 0)
             else (kafka_tls_member.config_directory ~ '/pki')) ~ ('/ca-chain.pem' if platform_kafka_store_type == 'PEM' else '/truststore.p12')),
           'storeType': platform_kafka_store_type,
           'storePasswordSecretRef': (_platform_kafka_tls_runtime_plans[0].storePasswordSecretRef if platform_kafka_store_type == 'PKCS12' else none)
         } }}
  changed_when: false
