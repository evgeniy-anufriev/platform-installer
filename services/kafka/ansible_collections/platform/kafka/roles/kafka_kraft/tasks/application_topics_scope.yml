---
- name: Create private temporary Kafka client configuration
  ansible.builtin.tempfile:
    state: directory
    prefix: platform-topics-
  register: application_kafka_private
  changed_when: false

- name: Select this invocation's client configuration path
  ansible.builtin.set_fact:
    application_topic_client: "{{ {'path': application_kafka_private.path ~ '/client.properties'} }}"
  changed_when: false

- name: Use existing Kafka security projection for this topic batch
  block:
    - name: Prepare the invocation-private PEM client identity
      ansible.builtin.include_tasks: application_client_tls.yml
      when:
        - application_topic_candidate.tls
        - platform_kafka_store_type == 'PEM'
    - name: Render the projected Kafka client configuration
      ansible.builtin.template:
        src: application-topics-client.properties.j2
        dest: "{{ application_topic_client.path }}"
        mode: '0600'
      changed_when: false
      no_log: true
    - name: Check or create each declared topic
      ansible.builtin.include_tasks: application_topic.yml
      loop: "{{ platform_kafka_application_job.topics }}"
      loop_control:
        loop_var: application_topic
        label: "{{ application_topic.name }}"
  always:
    - name: Remove only this invocation's client configuration
      ansible.builtin.file:
        path: "{{ application_kafka_private.path }}"
        state: absent
      changed_when: false
