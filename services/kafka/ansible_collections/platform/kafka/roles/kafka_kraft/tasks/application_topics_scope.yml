---
- name: Создание частной временной конфигурации клиента Kafka
  ansible.builtin.tempfile:
    state: directory
    prefix: platform-topics-
  register: application_kafka_private
  changed_when: false

- name: Выбрать путь конфигурации клиента для этого вызова
  ansible.builtin.set_fact:
    application_topic_client: "{{ {'path': application_kafka_private.path ~ '/client.properties'} }}"
  changed_when: false

- name: Использовать существующую проекцию безопасности Kafka для этого пакета тем
  block:
    - name: Подготовка частного удостоверения клиента PEM для вызова
      ansible.builtin.include_tasks: application_client_tls.yml
      when:
        - application_topic_candidate.tls
        - platform_kafka_store_type == 'PEM'
    - name: Визуализация прогнозируемой конфигурации клиента Kafka
      ansible.builtin.template:
        src: application-topics-client.properties.j2
        dest: "{{ application_topic_client.path }}"
        mode: '0600'
      changed_when: false
      no_log: true
    - name: Прочитать метаданные темы и эффективные конфигурации один раз для пакета библиотеки
      ansible.builtin.include_tasks: application_topics_read.yml
      when: platform_kafka_application_job.topics | length > 0
    - name: Проверить или создать каждую заявленную тему
      ansible.builtin.include_tasks: application_topic.yml
      loop: "{{ platform_kafka_application_job.topics }}"
      loop_control:
        loop_var: application_topic
        label: "{{ application_topic.name }}"
  always:
    - name: Удалить только конфигурацию клиента этого вызова
      ansible.builtin.file:
        path: "{{ application_kafka_private.path }}"
        state: absent
      changed_when: false
