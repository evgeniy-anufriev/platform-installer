---
- name: Создание защищённой временной конфигурации клиента Kafka
  ansible.builtin.tempfile:
    state: directory
    prefix: platform-topics-
  register: application_kafka_private
  changed_when: false

- name: Выбор пути временной конфигурации клиента Kafka
  ansible.builtin.set_fact:
    application_topic_client: "{{ {'path': application_kafka_private.path ~ '/client.properties'} }}"
  changed_when: false

- name: Применение проекции безопасности Kafka к запрошенным топикам
  block:
    - name: Подготовка защищённых PEM-файлов клиента для текущей операции
      ansible.builtin.include_tasks: application_client_tls.yml
      when:
        - application_topic_candidate.tls
        - platform_kafka_store_type == 'PEM'
    - name: Формирование конфигурации клиента Kafka по runtime-проекции
      ansible.builtin.template:
        src: application-topics-client.properties.j2
        dest: "{{ application_topic_client.path }}"
        mode: '0600'
      changed_when: false
      no_log: true
    - name: Однократное чтение метаданных и действующих конфигураций топиков библиотеки
      ansible.builtin.include_tasks: application_topics_read.yml
      when: platform_kafka_application_job.topics | length > 0
    - name: Проверка или создание каждого объявленного топика
      ansible.builtin.include_tasks: application_topic.yml
      loop: "{{ platform_kafka_application_job.topics }}"
      loop_control:
        loop_var: application_topic
        label: "{{ application_topic.name }}"
  always:
    - name: Удаление временной конфигурации клиента Kafka для набора топиков
      ansible.builtin.file:
        path: "{{ application_kafka_private.path }}"
        state: absent
      changed_when: false
