---
- name: Привязка объявленного списка топиков Kafka
  ansible.builtin.set_fact:
    application_topic_batch_pattern: "{{ '^(' ~ (platform_kafka_application_job.topics | map(attribute='name') | map('regex_escape') | join('|')) ~ ')$' }}"
    application_topic_required_names: "{{ (platform_kafka_application_job.topics if platform_kafka_application_phase == 'verify' else platform_kafka_application_job.topics | selectattr('mode', 'equalto', 'existing') | list) | map(attribute='name') | list }}"
  changed_when: false

- name: Однократное получение описаний объявленного набора топиков
  ansible.builtin.command:
    argv: ["{{ application_topic_cli_directory }}/bin/kafka-topics{{ platform_kafka_script_extension }}", --bootstrap-server, "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}", --command-config, "{{ application_topic_client.path }}", --describe, --if-exists, --topic, "{{ application_topic_batch_pattern }}"]
  register: application_topic_batch_description
  changed_when: false
  failed_when: false
  ignore_errors: true
  no_log: true
  until: >-
    application_topic_batch_description.rc != 0 or
    application_topic_required_names | difference(application_topic_batch_description.stdout | regex_findall('(?m)^[ \t]*Topic:[ \t]*([^ \t\r\n]+)[^\r\n]*PartitionCount:')) | length == 0
  retries: "{{ platform_kafka_startup_readiness_retries }}"
  delay: "{{ platform_kafka_startup_readiness_delay }}"

- name: "Проверка успешности чтения метаданных выбранных топиков"
  ansible.builtin.assert:
    that: application_topic_batch_description.rc == 0
    fail_msg: APPLICATION_TOPIC_DESCRIBE_FAILED

- name: Однократное чтение действующих конфигураций запрошенных топиков Kafka
  ansible.builtin.command:
    argv: ["{{ application_topic_cli_directory }}/bin/kafka-configs{{ platform_kafka_script_extension }}", --bootstrap-server, "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}", --command-config, "{{ application_topic_client.path }}", --describe, --all, --entity-type, topics]
  register: application_topic_batch_properties
  changed_when: false
  failed_when: false
  no_log: true

- name: Проверка успешности чтения действующих конфигураций топиков
  ansible.builtin.assert:
    that: application_topic_batch_properties.rc == 0
    fail_msg: APPLICATION_TOPIC_CONFIG_READ_FAILED
