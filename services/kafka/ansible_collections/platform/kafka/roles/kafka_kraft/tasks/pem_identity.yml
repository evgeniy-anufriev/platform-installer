---
- name: Проверка исходных PEM-файлов без перехода по символическим ссылкам
  ansible.builtin.stat:
    path: "{{ kafka_pem_source_directory }}/{{ item }}"
    follow: false
    get_checksum: false
  loop: [private-key.pem, certificate.pem, ca-chain.pem]
  register: _platform_kafka_pem_input_stats

- name: Проверка полного комплекта исходных PEM-файлов без символических ссылок
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: KAFKA_PEM_INPUT_INVALID
  loop: "{{ _platform_kafka_pem_input_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Чтение идентификатора PKCS8 и цепочки сертификатов без ведения журнала
  ansible.builtin.slurp:
    src: "{{ kafka_pem_source_directory }}/{{ item }}"
  loop: [private-key.pem, certificate.pem, ca-chain.pem]
  register: _platform_kafka_pem_inputs
  no_log: true

- name: Проверка незашифрованного закрытого ключа в формате PKCS8
  ansible.builtin.assert:
    that:
      - "(_platform_kafka_pem_inputs.results[0].content | b64decode) is search('-----BEGIN PRIVATE KEY-----')"
      - "(_platform_kafka_pem_inputs.results[1].content | b64decode) is search('-----BEGIN CERTIFICATE-----')"
      - "(_platform_kafka_pem_inputs.results[2].content | b64decode) is search('-----BEGIN CERTIFICATE-----')"
    fail_msg: KAFKA_PEM_PKCS8_REQUIRED
  no_log: true

- name: Чтение открытого ключа сертификата
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ kafka_pem_source_directory }}/certificate.pem", -pubkey, -noout]
  register: _platform_kafka_pem_certificate_key
  changed_when: false

- name: Чтение открытого ключа из файла закрытого ключа
  ansible.builtin.command:
    argv: [openssl, pkey, -in, "{{ kafka_pem_source_directory }}/private-key.pem", -pubout]
  register: _platform_kafka_pem_private_key
  changed_when: false
  no_log: true

- name: Проверка соответствия сертификата и закрытого ключа
  ansible.builtin.assert:
    that: _platform_kafka_pem_certificate_key.stdout == _platform_kafka_pem_private_key.stdout
    fail_msg: KAFKA_PEM_KEY_CERT_MISMATCH
  no_log: true

- name: Подготовка защищённых PEM-файлов только для Apply или временного вызова CLI
  ansible.builtin.copy:
    content: "{{ (_platform_kafka_pem_inputs.results | map(attribute='content') | map('b64decode') | map('trim') | join('\n')) ~ '\n' }}"
    dest: "{{ kafka_pem_identity_path }}"
    owner: "{{ kafka_pem_owner }}"
    group: "{{ kafka_pem_group }}"
    mode: '0600'
  register: _platform_kafka_pem_identity_write
  changed_when: _platform_kafka_pem_identity_write.changed and not (kafka_pem_ephemeral | default(false) | bool)
  no_log: true
  diff: false
  when: not (kafka_pem_verify_only | default(false) | bool)

- name: Проверка соответствия и доверия существующих PEM-файлов без восстановления
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
  loop: ["{{ kafka_pem_identity_path }}", "{{ kafka_pem_ca_path | default(kafka_pem_source_directory ~ '/ca-chain.pem') }}"]
  register: _platform_kafka_pem_consumer_stats
  no_log: true
  when: kafka_pem_verify_only | default(false) | bool

- name: Проверка соответствия PEM-файлов потребителя и защиты каталога хранилищ
  ansible.builtin.assert:
    that:
      - _platform_kafka_pem_consumer_stats.results[0].stat.isreg | default(false)
      - not (_platform_kafka_pem_consumer_stats.results[0].stat.islnk | default(false))
      - _platform_kafka_pem_consumer_stats.results[0].stat.mode == '0600'
      - _platform_kafka_pem_consumer_stats.results[0].stat.pw_name == kafka_pem_owner
      - _platform_kafka_pem_consumer_stats.results[0].stat.gr_name == kafka_pem_group
      - _platform_kafka_pem_consumer_stats.results[0].stat.checksum == (((_platform_kafka_pem_inputs.results | map(attribute='content') | map('b64decode') | map('trim') | join('\n')) ~ '\n') | hash('sha256'))
      - _platform_kafka_pem_consumer_stats.results[1].stat.isreg | default(false)
      - not (_platform_kafka_pem_consumer_stats.results[1].stat.islnk | default(false))
      - _platform_kafka_pem_consumer_stats.results[1].stat.checksum == ((_platform_kafka_pem_inputs.results[2].content | b64decode) | hash('sha256'))
    fail_msg: KAFKA_PEM_CONSUMER_DRIFT
  no_log: true
  when: kafka_pem_verify_only | default(false) | bool

- name: Удаление локальных буферов PEM
  ansible.builtin.set_fact:
    _platform_kafka_pem_inputs: {}
  no_log: true
  changed_when: false
