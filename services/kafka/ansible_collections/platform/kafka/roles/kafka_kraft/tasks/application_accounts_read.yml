---
- name: Получение описания метаданных SCRAM один раз для всех пользователей развертывания
  ansible.builtin.command:
    argv: ["{{ application_topic_cli_directory }}/bin/kafka-configs{{ platform_kafka_script_extension }}", --bootstrap-server, "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}", --command-config, "{{ application_kafka_private.path }}/admin.properties", --describe, --entity-type, users]
  register: application_kafka_user_inventory
  changed_when: false
  failed_when: false
  no_log: true

- name: Проверка полноты и доступности метаданных SCRAM перед изменением учётной записи
  ansible.builtin.assert:
    that:
      - application_kafka_user_inventory.rc == 0
      - application_kafka_user_inventory.stdout_lines | select('search', '^Error retrieving SCRAM credential configs') | list | length == 0
    fail_msg: APPLICATION_KAFKA_ACCOUNT_UNAVAILABLE_OR_CONFLICT
  no_log: true

- name: Сброс результатов чтения Kafka ACL развёртывания
  ansible.builtin.set_fact:
    application_kafka_acl_inventory: {rc: 0, stdout: ''}
  no_log: true

- name: Однократное чтение всех ACL развёртывания перед проверкой участников
  when: platform_kafka_application_job.accounts | map(attribute='grants') | flatten | length > 0
  block:
    - name: "Чтение всех ACL развёртывания без фильтра по principal"
      ansible.builtin.command:
        argv: ["{{ application_topic_cli_directory }}/bin/kafka-acls{{ platform_kafka_script_extension }}", --bootstrap-server, "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}", --command-config, "{{ application_kafka_private.path }}/admin.properties", --list, --resource-pattern-type, any]
      register: application_kafka_acl_inventory
      changed_when: false
      failed_when: false
      no_log: true
    - name: Проверка успешности чтения ACL развёртывания
      ansible.builtin.assert:
        that: application_kafka_acl_inventory.rc == 0
        fail_msg: APPLICATION_KAFKA_ACL_READ_FAILED
      no_log: true
