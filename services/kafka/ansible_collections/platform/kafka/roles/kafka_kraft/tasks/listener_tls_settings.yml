---
- name: Добавление путей TLS для listener и выбранного типа хранилища
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.client.auth'): ('requested' if (_platform_kafka_scram_enabled | default(false)) and kafka_ssl_listener.securityProtocol == 'SSL' else 'none'),
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.location'): _platform_kafka_tls_runtime.keystorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.type'): _platform_kafka_tls_runtime.storeType,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.location'): _platform_kafka_tls_runtime.truststorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.type'): _platform_kafka_tls_runtime.storeType
      }) }}
  no_log: true

- name: Добавление паролей только для явной совместимости с PKCS12
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim),
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim)
      }) }}
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12'
