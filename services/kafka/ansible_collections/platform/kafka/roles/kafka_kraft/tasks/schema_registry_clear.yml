---
- name: Повторная проверка владения каталогом реестра непосредственно перед очисткой
  ansible.builtin.include_tasks: schema_registry_ownership.yml

- name: Остановка служб Schema Registry выбранного развёртывания перед очисткой Kafka
  ansible.builtin.systemd:
    name: "{{ item.registry_instance.unit_name }}"
    state: stopped
    enabled: false
  loop: "{{ _platform_kafka_registry_unit_stats.results }}"
  loop_control:
    label: "{{ item.registry_instance.id }}"
  when: item.stat.exists

- name: Удаление служебных файлов реестра systemd с подтвержденным владельцем
  ansible.builtin.file:
    path: "{{ item.registry_instance.unit_path }}"
    state: absent
  loop: "{{ _platform_kafka_registry_unit_stats.results }}"
  loop_control:
    label: "{{ item.registry_instance.id }}"
  when: item.stat.exists
  register: _platform_kafka_registry_clear_units

- name: Удаление изолированной конфигурации и журналов реестра
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: absent
  loop: "{{ _platform_kafka_registry_local | subelements('managed_paths') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Перечитывание unit-файлов systemd после удаления служб Schema Registry
  ansible.builtin.systemd:
    daemon_reload: true
  when: _platform_kafka_registry_clear_units.changed
