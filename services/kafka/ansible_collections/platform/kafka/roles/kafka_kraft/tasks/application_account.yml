---
- name: Исключение идентификаторов инфраструктуры из сверки паролей приложений
  ansible.builtin.assert:
    that: application_kafka_account.name not in ['admin', 'default']
    fail_msg: APPLICATION_PROVIDER_IDENTIFIER_INVALID
  when: platform_kafka_application_phase == 'apply' and application_kafka_account.mode == 'managed'

- name: Выбор заданного Kafka principal из метаданных развёртывания SCRAM
  ansible.builtin.set_fact:
    application_kafka_description:
      rc: "{{ application_kafka_user_inventory.rc }}"
      stdout: "{{ application_kafka_user_lines | join('\n') }}"
      stdout_lines: "{{ application_kafka_user_lines }}"
  vars:
    application_kafka_user_prefix: "SCRAM credential configs for user-principal '{{ application_kafka_account.name }}' are "
    application_kafka_user_lines: "{{ application_kafka_user_inventory.stdout_lines | select('match', '^' ~ (application_kafka_user_prefix | regex_escape)) | list }}"
  changed_when: false
  no_log: true

- name: Отклонение недоступных метаданных и существующих учётных записей с несовместимым механизмом
  ansible.builtin.assert:
    that:
      - application_kafka_description.rc | int == 0
      - >-
        application_kafka_description.stdout_lines
        | select('search', '^Error retrieving SCRAM credential configs')
        | reject('search', 'ResourceNotFoundException') | list | length == 0
      - "'SCRAM-SHA-' not in application_kafka_description.stdout or 'SCRAM-SHA-512' in application_kafka_description.stdout"
      - "platform_kafka_application_phase != 'verify' and application_kafka_account.mode == 'managed' or 'SCRAM-SHA-512' in application_kafka_description.stdout"
    fail_msg: APPLICATION_KAFKA_ACCOUNT_UNAVAILABLE_OR_CONFLICT

- name: Подготовка фактического SASL-соединения приложения без регистрации секретов
  ansible.builtin.template:
    src: application-account-client.properties.j2
    dest: "{{ application_kafka_private.path }}/account.properties"
    mode: '0600'
  no_log: true
  changed_when: false

- name: Проверка пароля существующего приложения без изменения учетных данных
  ansible.builtin.command:
    argv:
      - "{{ application_topic_cli_directory }}/bin/kafka-broker-api-versions.sh"
      - --bootstrap-server
      - "{{ application_kafka_account.candidates[0].address }}:{{ application_kafka_account.candidates[0].port }}"
      - --command-config
      - "{{ application_kafka_private.path }}/account.properties"
  register: application_kafka_password_probe
  when: "'SCRAM-SHA-512' in application_kafka_description.stdout"
  changed_when: false
  failed_when: false
  no_log: true

- name: Выявление только явных несоответствий учетных данных SASL для управляемого приложения
  ansible.builtin.set_fact:
    application_kafka_password_mismatch: >-
      {{ platform_kafka_application_phase == 'apply' and application_kafka_account.mode == 'managed'
         and application_kafka_password_probe.rc | default(0) != 0
         and 'SaslAuthenticationException' in (application_kafka_password_probe.stderr | default(''))
         and 'invalid credentials' in (application_kafka_password_probe.stderr | default('') | lower) }}
  no_log: true

- name: Отклонение ошибок подключения и несовпадения учётных данных существующих приложений
  ansible.builtin.assert:
    that: application_kafka_password_probe.rc | default(0) == 0 or application_kafka_password_mismatch
    fail_msg: APPLICATION_KAFKA_ACCOUNT_AUTHENTICATION_FAILED
  no_log: true

- name: Согласование отсутствующих или несовпадающих учетных данных управляемого приложения во время применения
  when:
    - platform_kafka_application_phase == 'apply'
    - application_kafka_account.mode == 'managed'
    - "'SCRAM-SHA-512' not in application_kafka_description.stdout or application_kafka_password_mismatch"
  block:
    - name: "Подготовка параметров изменения SCRAM без передачи паролей в аргументах команды"
      ansible.builtin.copy:
        content: "SCRAM-SHA-512=iterations=8192,password={{ lookup('ansible.builtin.file', application_kafka_credentials[application_kafka_account.passwordRef], rstrip=false) | platform.core.platform_java_properties_value }}\n"
        dest: "{{ application_kafka_private.path }}/scram.properties"
        mode: '0600'
      changed_when: false
      no_log: true
    - name: Установка пароля выбранного приложения SCRAM с помощью файлового интерфейса Kafka
      ansible.builtin.command:
        argv:
          - "{{ application_topic_cli_directory }}/bin/kafka-configs.sh"
          - --bootstrap-server
          - "{{ application_topic_candidate.address }}:{{ application_topic_candidate.port }}"
          - --command-config
          - "{{ application_kafka_private.path }}/admin.properties"
          - --alter
          - --entity-type
          - users
          - --entity-name
          - "{{ application_kafka_account.name }}"
          - --add-config-file
          - "{{ application_kafka_private.path }}/scram.properties"
      register: application_kafka_creation
      failed_when: false
      changed_when: application_kafka_creation.rc == 0
      no_log: true
    - name: Проверка успешности создания учётных данных
      ansible.builtin.assert:
        that: application_kafka_creation.rc == 0
        fail_msg: APPLICATION_KAFKA_ACCOUNT_CREATE_FAILED

- name: Подтверждение вновь установленных учетных данных приложения перед предоставлением доступа
  when: "platform_kafka_application_phase == 'apply' and application_kafka_account.mode == 'managed' and ('SCRAM-SHA-512' not in application_kafka_description.stdout or application_kafka_password_mismatch)"
  block:
    - name: Выполнение аутентификации приложения через SCRAM listener Kafka
      ansible.builtin.command:
        argv:
          - "{{ application_topic_cli_directory }}/bin/kafka-broker-api-versions.sh"
          - --bootstrap-server
          - "{{ application_kafka_account.candidates[0].address }}:{{ application_kafka_account.candidates[0].port }}"
          - --command-config
          - "{{ application_kafka_private.path }}/account.properties"
      register: application_kafka_login
      changed_when: false
      failed_when: false
      no_log: true
    - name: "Проверка входа приложения с выбранным паролем после настройки учётной записи"
      ansible.builtin.assert:
        that: application_kafka_login.rc == 0
        fail_msg: APPLICATION_KAFKA_ACCOUNT_AUTHENTICATION_FAILED

- name: Проверка или обеспечение заявленных ресурсов ACL
  ansible.builtin.include_tasks: application_acl.yml
  loop: "{{ application_kafka_account.grants }}"
  loop_control:
    loop_var: application_kafka_grant
  when: "'SCRAM-SHA-512' in application_kafka_description.stdout or platform_kafka_application_phase == 'apply'"
