---
- name: Resolve Kafka TLS runtime projection for SSL listener
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_member }}"

- name: Check PKI-01 stores before Kafka mutation
  ansible.builtin.stat:
    path: "{{ _platform_kafka_tls_runtime.targetDirectory }}/{{ item }}"
  loop: [keystore.p12, truststore.p12, materialization-fingerprint]
  register: platform_kafka_ssl_store_state

- name: Require complete PKI-01 stores before Kafka mutation
  ansible.builtin.assert:
    that: "platform_kafka_ssl_store_state.results | map(attribute='stat.exists') | list | min"
    fail_msg: 'BLOCKED: PKI-01 target stores are incomplete for SSL Kafka listener'

- name: Create Kafka-owned PKI consumer directory
  ansible.builtin.file:
    path: "{{ _platform_kafka_tls_runtime.consumerDirectory }}"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0700'

- name: Resolve runtime-only PKI store password file
  ansible.builtin.set_fact:
    _platform_kafka_ssl_password_file: >-
      {{ (platform_pki_secret_files
          | default(hostvars['localhost'].platform_pki_secret_files | default({}, true), true))[_platform_kafka_tls_runtime.storePasswordSecretRef] }}

- name: Copy PKI material into Kafka-owned consumer directory
  ansible.builtin.copy:
    src: "{{ _platform_kafka_tls_runtime.targetDirectory }}/{{ item.name }}"
    dest: "{{ _platform_kafka_tls_runtime.consumerDirectory }}/{{ item.name }}"
    remote_src: true
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: ca-chain.pem, mode: '0600'}
    - {name: certificate.pem, mode: '0600'}
    - {name: private-key.pem, mode: '0600'}
    - {name: keystore.p12, mode: '0600'}
    - {name: truststore.p12, mode: '0600'}
    - {name: materialization-fingerprint, mode: '0600'}
  register: _platform_kafka_copied_pki_material
  no_log: true

- name: Aggregate Kafka member PKI change signal
  ansible.builtin.set_fact:
    platform_kafka_member_pki_changed: >-
      {{ (platform_kafka_member_pki_changed | default(false) | bool) or
         (_platform_kafka_copied_pki_material.changed | default(false) | bool) }}

- name: Add listener-scoped PKCS12 properties without exposing secret values
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.location'): _platform_kafka_tls_runtime.keystorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.type'): _platform_kafka_tls_runtime.storeType,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim),
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.location'): _platform_kafka_tls_runtime.truststorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.type'): _platform_kafka_tls_runtime.storeType,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim)
      }) }}
  no_log: true
