---
- name: Разрешить runtime-проекцию Kafka TLS для SSL listener
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_member }}"

- name: Проверка хранилищ PKI-01 перед модификацией Kafka
  ansible.builtin.stat:
    path: "{{ _platform_kafka_tls_runtime.targetDirectory }}/{{ item }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ ['private-key.pem', 'certificate.pem', 'ca-chain.pem', 'materialization-fingerprint'] + (['keystore.p12', 'truststore.p12'] if _platform_kafka_tls_runtime.storeType == 'PKCS12' else []) }}"
  register: platform_kafka_ssl_store_state

- name: Требовать полные хранилища PKI-01 перед модификацией Kafka
  ansible.builtin.assert:
    that: "platform_kafka_ssl_store_state.results | map(attribute='stat.exists') | list | min"
    fail_msg: 'BLOCKED: PKI-01 target stores are incomplete for SSL Kafka listener'

- name: Создать потребительский каталог PKI, принадлежащий Kafka
  ansible.builtin.file:
    path: "{{ _platform_kafka_tls_runtime.consumerDirectory }}"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0700'

- name: Разрешение файла паролей хранилища PKI только во время выполнения
  ansible.builtin.set_fact:
    _platform_kafka_ssl_password_file: >-
      {{ (platform_pki_secret_files
          | default(hostvars['localhost'].platform_pki_secret_files | default({}, true), true))[_platform_kafka_tls_runtime.storePasswordSecretRef] }}
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12'

- name: Скопировать материал PKI в потребительский каталог, принадлежащий Kafka
  ansible.builtin.copy:
    src: "{{ _platform_kafka_tls_runtime.targetDirectory }}/{{ item.name }}"
    dest: "{{ _platform_kafka_tls_runtime.consumerDirectory }}/{{ item.name }}"
    remote_src: true
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: ca-chain.pem, mode: '0600'}
    - {name: certificate.pem, mode: '0600'}
    - {name: private-key.pem, mode: '0600'}
    - {name: keystore.p12, mode: '0600'}
    - {name: truststore.p12, mode: '0600'}
    - {name: materialization-fingerprint, mode: '0600'}
  register: _platform_kafka_copied_pki_material
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12' or item.name not in ['keystore.p12', 'truststore.p12']

- name: Материализовать принадлежащий Kafka идентификатор PEM из точного плана PKI
  ansible.builtin.include_tasks: pem_identity.yml
  vars:
    kafka_pem_source_directory: "{{ _platform_kafka_tls_runtime.targetDirectory }}"
    kafka_pem_identity_path: "{{ _platform_kafka_tls_runtime.keystorePath }}"
    kafka_pem_owner: "{{ platform_kafka_user }}"
    kafka_pem_group: "{{ platform_kafka_group }}"
    kafka_pem_verify_only: false
  when: _platform_kafka_tls_runtime.storeType == 'PEM'

- name: Агрегировать сигнал изменения экземпляра службы Kafka PKI
  ansible.builtin.set_fact:
    platform_kafka_member_pki_changed: >-
      {{ (platform_kafka_member_pki_changed | default(false) | bool) or
         (_platform_kafka_copied_pki_material.changed | default(false) | bool) or
         (_platform_kafka_tls_runtime.storeType == 'PEM' and (_platform_kafka_pem_identity_write.changed | default(false) | bool)) }}

- name: Добавить пути TLS для listener и выбранный тип хранилища
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.client.auth'): ('requested' if (_platform_kafka_scram_enabled | default(false)) and kafka_ssl_listener.securityProtocol == 'SSL' else 'none'),
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.location'): _platform_kafka_tls_runtime.keystorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.type'): _platform_kafka_tls_runtime.storeType,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.location'): _platform_kafka_tls_runtime.truststorePath,
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.type'): _platform_kafka_tls_runtime.storeType
      }) }}
  no_log: true

- name: Добавлять пароли только для явной совместимости с PKCS12
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.keystore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim),
        ('listener.name.' ~ (kafka_ssl_listener.name | lower) ~ '.ssl.truststore.password'): (lookup('ansible.builtin.file', _platform_kafka_ssl_password_file) | trim)
      }) }}
  no_log: true
  when: _platform_kafka_tls_runtime.storeType == 'PKCS12'
