---
- name: Create isolated member directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0750'
  loop:
    - "{{ kafka_member.config_directory }}"
    - "{{ kafka_member.runtime_directory }}"
    - "{{ kafka_member.data_directory }}"
    - "{{ kafka_member.log_directory }}"
  when: not (platform_kafka_verify_only | bool)

- name: Initialize Kafka member PKI change signal
  ansible.builtin.set_fact:
    platform_kafka_member_pki_changed: false
  when: not (platform_kafka_verify_only | bool)

- name: Build role-aware member listener projection
  ansible.builtin.set_fact:
    _platform_kafka_member_advanced_config: "{{ platform_kafka_advanced_config | combine(kafka_member.advanced_config | default({})) }}"
    _platform_kafka_member_named_listeners: >-
      {% set selected = [] %}
      {% for pair in (kafka_member.listeners | default({}) | dict2items | sort(attribute='key')) %}
      {% set listener = pair.value | combine({'name': pair.key}) %}
      {% if listener.purpose == 'controller' or (listener.purpose in ['client', 'interBroker'] and 'broker' in kafka_member.roles) %}
      {% set _ = selected.append(listener) %}
      {% endif %}
      {% endfor %}
      {{ selected | to_json }}

- name: Convert named listener projection to a native list
  ansible.builtin.set_fact:
    _platform_kafka_member_named_listeners: "{{ _platform_kafka_member_named_listeners | from_json }}"
  when:
    - kafka_member.listeners | default({}) | length > 0
    - _platform_kafka_member_named_listeners is string

- name: Select listeners bound by this Kafka member
  ansible.builtin.set_fact:
    _platform_kafka_member_bound_listeners: >-
      {{ _platform_kafka_member_named_listeners
         | rejectattr('purpose', 'equalto', 'controller')
         | list if 'controller' not in kafka_member.roles
         else _platform_kafka_member_named_listeners }}

- name: Validate named listener role requirements and member-local ports
  ansible.builtin.assert:
    that:
      - "'controller' not in kafka_member.roles or (_platform_kafka_member_named_listeners | selectattr('purpose', 'equalto', 'controller') | list | length > 0)"
      - "'broker' not in kafka_member.roles or (_platform_kafka_member_named_listeners | selectattr('purpose', 'equalto', 'interBroker') | list | length > 0)"
      - "(_platform_kafka_member_named_listeners | selectattr('securityProtocol', 'equalto', 'SSL') | list | length) == 0 or (kafka_member.tls_profile | default('') | length > 0)"
      - "(_platform_kafka_member_named_listeners | map(attribute='port') | list | unique | length) == (_platform_kafka_member_named_listeners | length)"
    fail_msg: 'BLOCKED: named Kafka listeners are invalid for this member role or collide on ports'
  when: kafka_member.listeners | default({}) | length > 0

- name: Build effective named listener strings
  ansible.builtin.set_fact:
    _platform_kafka_member_listeners: >-
      {% for listener in _platform_kafka_member_bound_listeners %}{{ listener.name }}://{{ listener.bindAddress | default('0.0.0.0') }}:{{ listener.port }}{% if not loop.last %},{% endif %}{% endfor %}
    _platform_kafka_member_security_map: >-
      {% if kafka_member.listeners | default({}) | length > 0 %}{% for listener in _platform_kafka_member_named_listeners %}{{ listener.name }}:{{ listener.securityProtocol }}{% if not loop.last %},{% endif %}{% endfor %}{% else %}CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT{% endif %}
    _platform_kafka_member_advertised_listeners: >-
      {% for listener in _platform_kafka_member_bound_listeners %}{{ listener.name }}://{{ listener.advertisedAddress | default(kafka_member.advertised_host) }}:{{ listener.port }}{% if not loop.last %},{% endif %}{% endfor %}

- name: Build common member effective configuration
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ (platform_kafka_advanced_config | combine(kafka_member.advanced_config | default({})))
         | combine({
             'process.roles': kafka_member.roles | join(','),
             'node.id': kafka_member.node_id | int,
             'listeners': _platform_kafka_member_listeners,
             'advertised.listeners': _platform_kafka_member_advertised_listeners,
             'listener.security.protocol.map': _platform_kafka_member_security_map,
             'controller.listener.names': (_platform_kafka_member_named_listeners | selectattr('purpose', 'equalto', 'controller') | map(attribute='name') | join(',') if kafka_member.listeners | default({}) | length > 0 else 'CONTROLLER'),
             'log.dirs': kafka_member.data_directory
           }) }}
  when: not (platform_kafka_verify_only | bool)

- name: Validate PKI-01 readiness for SSL listeners
  ansible.builtin.include_tasks: validate_ssl_listener.yml
  loop: "{{ _platform_kafka_member_named_listeners | selectattr('securityProtocol', 'equalto', 'SSL') | list }}"
  loop_control:
    loop_var: kafka_ssl_listener
    label: "{{ kafka_member.id }}:{{ kafka_ssl_listener.name }}"
  when:
    - not (platform_kafka_verify_only | bool)
    - kafka_member.listeners | default({}) | length > 0

- name: Add broker effective configuration
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
           'inter.broker.listener.name': ((_platform_kafka_member_named_listeners | selectattr('purpose', 'equalto', 'interBroker') | map(attribute='name') | list | first) if kafka_member.listeners | default({}) | length > 0 else 'PLAINTEXT'),
           'log.retention.hours': kafka_member.log_retention_hours | default(platform_kafka_log_retention_hours)
         }) }}
  when:
    - not (platform_kafka_verify_only | bool)
    - "'broker' in kafka_member.roles"

- name: Add dynamic quorum projection when explicitly selected
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
           'controller.quorum.bootstrap.servers': _platform_kafka_controller_bootstrap_servers | trim
         }) }}
  when:
    - not (platform_kafka_verify_only | bool)
    - platform_kafka_quorum_mode == 'dynamic'

- name: Add static quorum projection when explicitly selected
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config
         | combine({'controller.quorum.voters': _platform_kafka_static_quorum_voters | trim})
         | dict2items
         | rejectattr('key', 'equalto', 'controller.quorum.bootstrap.servers')
         | items2dict }}
  when:
    - not (platform_kafka_verify_only | bool)
    - platform_kafka_quorum_mode == 'static'

- name: Reject reserved member advanced Kafka settings
  ansible.builtin.assert:
    that: >-
      ((_platform_kafka_member_advanced_config.keys() | list |
       intersect(_platform_kafka_reserved_config_keys)) | length) == 0
      and (_platform_kafka_member_advanced_config.keys() | select('match', '^listener\\.name\\..*\\.ssl\\.') | list | length) == 0
    fail_msg: 'ADVANCED_SETTING_RESERVED: BLOCKED; member advanced configuration contains reserved Kafka keys'
  when: not (platform_kafka_verify_only | bool)

- name: Validate role-specific effective Kafka configuration
  ansible.builtin.assert:
    that:
      - "'broker' in kafka_member.roles or 'inter.broker.listener.name' not in kafka_effective_config"
      - "'broker' in kafka_member.roles or 'log.retention.hours' not in kafka_effective_config"
      - "'broker' in kafka_member.roles or 'PLAINTEXT://' not in kafka_effective_config['listeners']"
      - "'broker' in kafka_member.roles or 'PLAINTEXT://' not in kafka_effective_config['advertised.listeners']"
      - "'controller' in kafka_member.roles or (kafka_member.node_id | string) not in (_platform_kafka_controller_instances | map(attribute='node_id') | map('string') | list)"
    fail_msg: Kafka effective configuration contains behavior from an unassigned member role
  when: not (platform_kafka_verify_only | bool)

- name: Validate effective member configuration values
  ansible.builtin.assert:
    that: item.value is boolean or item.value is number or item.value is string
    fail_msg: Kafka effective configuration contains an unsupported value type
  loop: "{{ kafka_effective_config | dict2items | sort(attribute='key') }}"
  when: not (platform_kafka_verify_only | bool)
  no_log: true

- name: Render deterministic member server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ kafka_member.config_directory }}/server.properties"
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0640'
  register: platform_kafka_member_config
  when: not (platform_kafka_verify_only | bool)
  diff: false
  no_log: true

- name: Inspect member KRaft metadata
  ansible.builtin.stat:
    path: "{{ kafka_member.data_directory }}/meta.properties"
  register: platform_kafka_member_metadata

- name: Read existing member KRaft metadata
  ansible.builtin.slurp:
    src: "{{ kafka_member.data_directory }}/meta.properties"
  register: platform_kafka_member_metadata_content
  when: platform_kafka_member_metadata.stat.exists

- name: Reject member identity mismatch
  ansible.builtin.assert:
    that:
      - (platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^cluster.id=' ~ platform_kafka_cluster_id ~ '$')
      - (platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^node.id=' ~ (kafka_member.node_id | string) ~ '$')
      - platform_kafka_quorum_mode != 'dynamic' or 'controller' not in kafka_member.roles or kafka_member.directory_id is not defined or ((platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^directory.id=' ~ (kafka_member.directory_id | string) ~ '$'))
    fail_msg: Existing Kafka member storage identity mismatch; refusing destructive repair
  when: platform_kafka_member_metadata.stat.exists

- name: Derive Kafka storage format strategy
  ansible.builtin.set_fact:
    _platform_kafka_storage_format_strategy: >-
      {{ 'INITIAL_CONTROLLERS'
         if (platform_kafka_quorum_mode == 'dynamic'
             and 'controller' in kafka_member.roles
             and kafka_member.directory_id is defined)
         else ('STANDALONE_COMPATIBILITY'
               if (platform_kafka_quorum_mode == 'dynamic'
                   and 'controller' in kafka_member.roles
                   and _platform_kafka_controller_instances | length == 1
                   and kafka_member.directory_id is not defined)
               else 'NO_INITIAL_CONTROLLERS') }}
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists

- name: Format uninitialized Kafka storage exactly once
  become_user: "{{ platform_kafka_user }}"
  ansible.builtin.command:
    argv: >-
      {{ [platform_kafka_install_directory ~ '/bin/kafka-storage.sh',
          'format',
          '--cluster-id', platform_kafka_cluster_id,
          '--config', kafka_member.config_directory ~ '/server.properties']
         + (['--initial-controllers', _platform_kafka_initial_controllers | trim]
            if _platform_kafka_storage_format_strategy == 'INITIAL_CONTROLLERS'
            else (['--standalone']
                  if _platform_kafka_storage_format_strategy == 'STANDALONE_COMPATIBILITY'
                  else ['--no-initial-controllers'])) }}
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists
  changed_when: true

- name: Write systemd instance environment
  ansible.builtin.copy:
    content: "KAFKA_CONFIG_FILE={{ kafka_member.config_directory }}/server.properties\n"
    dest: "{{ kafka_member.runtime_directory }}/systemd.env"
    owner: root
    group: root
    mode: '0644'
  register: platform_kafka_member_environment
  when: not (platform_kafka_verify_only | bool)

- name: Install reusable Kafka systemd template
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "{{ kafka_member.systemd_unit_destination }}"
    owner: root
    group: root
    mode: '0644'
  register: platform_kafka_systemd_template
  when: not (platform_kafka_verify_only | bool)

- name: Reload systemd before starting member instances
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (platform_kafka_verify_only | bool)

- name: Restart changed Kafka member only
  ansible.builtin.systemd:
    name: "{{ kafka_member.systemd_unit_name }}"
    state: restarted
  when:
    - not (platform_kafka_verify_only | bool)
    - >-
      platform_kafka_member_config.changed or
      platform_kafka_member_environment.changed or
      (platform_kafka_member_pki_changed | default(false) | bool) or
      (platform_pki_material_changed | default(false) | bool)

- name: Enable and start Kafka member
  ansible.builtin.systemd:
    name: "{{ kafka_member.systemd_unit_name }}"
    enabled: true
    state: started
  when: not (platform_kafka_verify_only | bool)

- name: Wait for Kafka member systemd startup readiness
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ kafka_member.systemd_unit_name }}"
  register: platform_kafka_member_startup_state
  changed_when: false
  retries: "{{ platform_kafka_startup_readiness_retries }}"
  delay: "{{ platform_kafka_startup_readiness_delay }}"
  until:
    - platform_kafka_member_startup_state.rc == 0
    - platform_kafka_member_startup_state.stdout | trim == 'active'
  when: not (platform_kafka_verify_only | bool)
