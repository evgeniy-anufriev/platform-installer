---
- name: Set member-derived Kafka paths
  ansible.builtin.set_fact:
    _platform_kafka_member_config_dir: "{{ kafka_member.config_directory }}"
    _platform_kafka_member_config_file: "{{ kafka_member.config_directory }}/server.properties"
    _platform_kafka_member_runtime_dir: "{{ kafka_member.runtime_directory }}"

- name: Create isolated member directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0750'
  loop:
    - "{{ _platform_kafka_member_config_dir }}"
    - "{{ _platform_kafka_member_runtime_dir }}"
    - "{{ kafka_member.data_directory }}"
    - "{{ kafka_member.log_directory }}"
  when: not (platform_kafka_verify_only | bool)

- name: Build role-aware member listener projection
  ansible.builtin.set_fact:
    _platform_kafka_member_advanced_config: "{{ platform_kafka_advanced_config | combine(kafka_member.advanced_config | default({})) }}"
    _platform_kafka_member_listeners: >-
      {{ ((['PLAINTEXT://0.0.0.0:' ~ (kafka_member.client_port | string)] if 'broker' in kafka_member.roles else [])
          + (['CONTROLLER://0.0.0.0:' ~ (kafka_member.controller_port | string)] if 'controller' in kafka_member.roles else [])) | join(',') }}
    _platform_kafka_member_advertised_listeners: >-
      {{ ((['PLAINTEXT://' ~ kafka_member.advertised_host ~ ':' ~ (kafka_member.client_port | string)] if 'broker' in kafka_member.roles else [])
          + (['CONTROLLER://' ~ kafka_member.advertised_host ~ ':' ~ (kafka_member.controller_port | string)] if 'controller' in kafka_member.roles else [])) | join(',') }}

- name: Build common member effective configuration
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ (platform_kafka_advanced_config | combine(kafka_member.advanced_config | default({})))
         | combine({
             'process.roles': kafka_member.roles | join(','),
             'node.id': kafka_member.node_id | int,
             'listeners': _platform_kafka_member_listeners,
             'advertised.listeners': _platform_kafka_member_advertised_listeners,
             'listener.security.protocol.map': 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT',
             'controller.listener.names': 'CONTROLLER',
             'log.dirs': kafka_member.data_directory
           }) }}
  when: not (platform_kafka_verify_only | bool)

- name: Add broker effective configuration
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
           'inter.broker.listener.name': 'PLAINTEXT',
           'log.retention.hours': kafka_member.log_retention_hours | default(platform_kafka_log_retention_hours)
         }) }}
  when:
    - not (platform_kafka_verify_only | bool)
    - "'broker' in kafka_member.roles"

- name: Add dynamic quorum projection when explicitly selected
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config | combine({
           'controller.quorum.bootstrap.servers': _platform_kafka_controller_bootstrap_servers | trim
         }) }}
  when:
    - not (platform_kafka_verify_only | bool)
    - platform_kafka_quorum_mode == 'dynamic'

- name: Add static quorum projection when explicitly selected
  ansible.builtin.set_fact:
    kafka_effective_config: >-
      {{ kafka_effective_config
         | combine({'controller.quorum.voters': _platform_kafka_static_quorum_voters | trim})
         | dict2items
         | rejectattr('key', 'equalto', 'controller.quorum.bootstrap.servers')
         | items2dict }}
  when:
    - not (platform_kafka_verify_only | bool)
    - platform_kafka_quorum_mode == 'static'

- name: Reject reserved member advanced Kafka settings
  ansible.builtin.assert:
    that: >-
      ((_platform_kafka_member_advanced_config.keys() | list |
       intersect(_platform_kafka_reserved_config_keys)) | length) == 0
    fail_msg: 'ADVANCED_SETTING_RESERVED: BLOCKED; member advanced configuration contains reserved Kafka keys'
  when: not (platform_kafka_verify_only | bool)

- name: Validate effective member configuration values
  ansible.builtin.assert:
    that: item.value is boolean or item.value is number or item.value is string
    fail_msg: Kafka effective configuration contains an unsupported value type
  loop: "{{ kafka_effective_config | dict2items | sort(attribute='key') }}"
  when: not (platform_kafka_verify_only | bool)

- name: Render deterministic member server.properties
  ansible.builtin.template:
    src: server.properties.j2
    dest: "{{ _platform_kafka_member_config_file }}"
    owner: "{{ platform_kafka_user }}"
    group: "{{ platform_kafka_group }}"
    mode: '0640'
  register: platform_kafka_member_config
  when: not (platform_kafka_verify_only | bool)

- name: Inspect member KRaft metadata
  ansible.builtin.stat:
    path: "{{ kafka_member.data_directory }}/meta.properties"
  register: platform_kafka_member_metadata

- name: Read existing member KRaft metadata
  ansible.builtin.slurp:
    src: "{{ kafka_member.data_directory }}/meta.properties"
  register: platform_kafka_member_metadata_content
  when: platform_kafka_member_metadata.stat.exists

- name: Reject member identity mismatch
  ansible.builtin.assert:
    that:
      - (platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^cluster.id=' ~ platform_kafka_cluster_id ~ '$')
      - (platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^node.id=' ~ (kafka_member.node_id | string) ~ '$')
      - platform_kafka_quorum_mode != 'dynamic' or _platform_kafka_controller_instances | length == 1 or 'controller' not in kafka_member.roles or ((platform_kafka_member_metadata_content.content | b64decode) is search('(?m)^directory.id=' ~ (kafka_member.directory_id | string) ~ '$'))
    fail_msg: Existing Kafka member storage identity mismatch; refusing destructive repair
  when: platform_kafka_member_metadata.stat.exists

- name: Format uninitialized dynamic initial-controller storage exactly once
  become_user: "{{ platform_kafka_user }}"
  ansible.builtin.command:
    argv:
      - "{{ platform_kafka_install_directory }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ platform_kafka_cluster_id }}"
      - --config
      - "{{ _platform_kafka_member_config_file }}"
      - --initial-controllers
      - "{{ _platform_kafka_initial_controllers | trim }}"
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists
    - platform_kafka_quorum_mode == 'dynamic'
    - _platform_kafka_controller_instances | length > 1
    - "'controller' in kafka_member.roles"
  changed_when: true

- name: Format uninitialized static quorum storage exactly once
  become_user: "{{ platform_kafka_user }}"
  ansible.builtin.command:
    argv:
      - "{{ platform_kafka_install_directory }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ platform_kafka_cluster_id }}"
      - --config
      - "{{ _platform_kafka_member_config_file }}"
      - --no-initial-controllers
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists
    - platform_kafka_quorum_mode == 'static'
  changed_when: true

- name: Format uninitialized dynamic non-controller storage exactly once
  become_user: "{{ platform_kafka_user }}"
  ansible.builtin.command:
    argv:
      - "{{ platform_kafka_install_directory }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ platform_kafka_cluster_id }}"
      - --config
      - "{{ _platform_kafka_member_config_file }}"
      - --no-initial-controllers
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists
    - platform_kafka_quorum_mode == 'dynamic'
    - "'controller' not in kafka_member.roles"
  changed_when: true

- name: Format uninitialized single-controller dynamic storage exactly once
  become_user: "{{ platform_kafka_user }}"
  ansible.builtin.command:
    argv:
      - "{{ platform_kafka_install_directory }}/bin/kafka-storage.sh"
      - format
      - --cluster-id
      - "{{ platform_kafka_cluster_id }}"
      - --config
      - "{{ _platform_kafka_member_config_file }}"
      - --standalone
  when:
    - not (platform_kafka_verify_only | bool)
    - not platform_kafka_member_metadata.stat.exists
    - platform_kafka_quorum_mode == 'dynamic'
    - _platform_kafka_controller_instances | length == 1
    - "'controller' in kafka_member.roles"
  changed_when: true

- name: Write systemd instance environment
  ansible.builtin.copy:
    content: "KAFKA_CONFIG_FILE={{ _platform_kafka_member_config_file }}\n"
    dest: "{{ _platform_kafka_member_runtime_dir }}/systemd.env"
    owner: root
    group: root
    mode: '0644'
  register: platform_kafka_member_environment
  when: not (platform_kafka_verify_only | bool)

- name: Install reusable Kafka systemd template
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "{{ kafka_member.systemd_unit_destination }}"
    owner: root
    group: root
    mode: '0644'
  register: platform_kafka_systemd_template
  notify: Reload systemd
  when: not (platform_kafka_verify_only | bool)

- name: Reload systemd before starting member instances
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (platform_kafka_verify_only | bool)

- name: Restart changed Kafka member only
  ansible.builtin.systemd:
    name: "{{ kafka_member.systemd_unit_name }}"
    state: restarted
  when:
    - not (platform_kafka_verify_only | bool)
    - platform_kafka_member_config.changed or platform_kafka_member_environment.changed

- name: Enable and start Kafka member
  ansible.builtin.systemd:
    name: "{{ kafka_member.systemd_unit_name }}"
    enabled: true
    state: started
  when: not (platform_kafka_verify_only | bool)
