---
- name: Проверка точной отметки времени конфигурации экземпляра службы
  ansible.builtin.stat:
    path: "{{ kafka_authorization_member.config_directory }}/server.properties"
    follow: false
    get_checksum: false
  register: kafka_authorization_config_stat

- name: Проверка последней строки суперпользователя
  ansible.builtin.command:
    argv: [grep, -E, '^[[:space:]]*super[.]users([[:space:]:=]|$)', "{{ kafka_authorization_member.config_directory }}/server.properties"]
  register: kafka_authorization_config_line
  failed_when: false
  changed_when: false

- name: Наблюдение за текущим процессом экземпляра службы через systemd
  ansible.builtin.command:
    argv: [systemctl, show, "{{ kafka_authorization_member.systemd_unit_name }}", --property=MainPID, --property=ExecMainStartTimestamp, --property=ActiveState]
  environment:
    LC_ALL: C
  register: kafka_authorization_process
  failed_when: false
  changed_when: false

- name: Извлечение идентификатора наблюдаемого процесса
  ansible.builtin.set_fact:
    kafka_authorization_pid: "{{ (kafka_authorization_process.stdout | regex_findall('(?m)^MainPID=([1-9][0-9]*)$') | first) | default('0') }}"
    kafka_authorization_started: "{{ (kafka_authorization_process.stdout | regex_findall('(?m)^ExecMainStartTimestamp=(.+)$') | first) | default('') }}"
  changed_when: false

- name: Чтение командной строки запущенного процесса
  ansible.builtin.slurp:
    src: "/proc/{{ kafka_authorization_pid }}/cmdline"
  register: kafka_authorization_command
  failed_when: false
  when: kafka_authorization_pid != '0'

- name: Преобразование наблюдаемой метки времени запуска systemd с помощью встроенной утилиты даты
  ansible.builtin.command:
    argv: [date, "--date={{ kafka_authorization_started }}", '+%s.%N']
  environment:
    LC_ALL: C
  register: kafka_authorization_start_epoch
  failed_when: false
  changed_when: false
  when: kafka_authorization_started | length > 0

- name: Повторная проверка PID процесса после чтения команды и времени запуска
  ansible.builtin.command:
    argv: [systemctl, show, "{{ kafka_authorization_member.systemd_unit_name }}", --property=MainPID, --property=ExecMainStartTimestamp, --property=ActiveState]
  environment:
    LC_ALL: C
  register: kafka_authorization_process_after
  failed_when: false
  changed_when: false

- name: Запись факта загрузки итоговой конфигурации запущенным экземпляром Kafka
  ansible.builtin.set_fact:
    kafka_authorization_running_final: >-
      {{ kafka_authorization_config_line.rc == 0
         and kafka_authorization_config_line.stdout == 'super.users=User:admin'
         and kafka_authorization_config_stat.stat.isreg | default(false)
         and not (kafka_authorization_config_stat.stat.islnk | default(true))
         and kafka_authorization_process.rc == 0
         and kafka_authorization_process_after.rc == 0
         and kafka_authorization_process.stdout == kafka_authorization_process_after.stdout
         and 'ActiveState=active' in kafka_authorization_process.stdout_lines
         and kafka_authorization_pid != '0'
         and kafka_authorization_start_epoch.rc | default(1) == 0
         and kafka_authorization_start_epoch.stdout | default('0') | float > kafka_authorization_config_stat.stat.mtime | default(0) | float
         and (kafka_authorization_command.content | default('') | b64decode).endswith(
             'kafka.Kafka' ~ ('AA==' | b64decode) ~ kafka_authorization_member.config_directory
             ~ '/server.properties' ~ ('AA==' | b64decode)) }}
  changed_when: false
