---
- name: Проверка состояния экземпляра службы Kafka systemd и основного процесса
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --property=MainPID, "{{ kafka_member.systemd_unit_name }}"]
  changed_when: false
  register: platform_kafka_member_service_state

- name: Проверка активности службы экземпляра Kafka
  ansible.builtin.assert:
    that: "'ActiveState=active' in platform_kafka_member_service_state.stdout_lines"
    fail_msg: Kafka member systemd instance is not active

- name: Проверка процесса экземпляра службы Kafka
  ansible.builtin.assert:
    that: >-
      (platform_kafka_member_service_state.stdout | regex_findall('(?m)^MainPID=([0-9]+)$')
       | first | default('0') | int) > 0
    fail_msg: Kafka member systemd instance has no running main process

- name: Проверка listeners экземпляра Kafka
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    timeout: 5
  loop: "{{ kafka_member.listener_ports }}"

- name: Расчёт TLS-проекции экземпляра Kafka для всех проверок соединения
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_member }}"
  when: kafka_member.listener_endpoints | selectattr('security_protocol', 'in', ['SSL', 'SASL_SSL']) | list | length > 0

- name: Сохранение TLS-проекции экземпляра только для текущего Verify
  ansible.builtin.set_fact:
    _platform_kafka_verify_tls_by_member: "{{ _platform_kafka_verify_tls_by_member | default({}) | combine({kafka_member.id: _platform_kafka_tls_runtime}) }}"
  when: kafka_member.listener_endpoints | selectattr('security_protocol', 'in', ['SSL', 'SASL_SSL']) | list | length > 0

- name: Проверка SSL listeners Kafka через реальное TLS-соединение
  ansible.builtin.include_tasks: verify_ssl_listener.yml
  vars:
    kafka_ssl_listener: "{{ kafka_ssl_listener_entry.value | combine({'name': kafka_ssl_listener_entry.key}) }}"
    kafka_ssl_runtime_prepared: true
  loop: "{{ kafka_member.listeners | default({}) | dict2items | selectattr('value.securityProtocol', 'in', ['SSL', 'SASL_SSL']) | rejectattr('value.purpose', 'equalto', 'controller') | list if 'controller' not in kafka_member.roles else kafka_member.listeners | default({}) | dict2items | selectattr('value.securityProtocol', 'in', ['SSL', 'SASL_SSL']) | list }}"
  loop_control:
    loop_var: kafka_ssl_listener_entry
    label: "{{ kafka_member.id }}:{{ kafka_ssl_listener_entry.key }}"
  when: kafka_member.listeners | default({}) | length > 0
