---
- name: Verify Kafka member systemd state and main process
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --property=MainPID, "{{ kafka_member.systemd_unit_name }}"]
  changed_when: false
  register: platform_kafka_member_service_state

- name: Assert Kafka member service is active
  ansible.builtin.assert:
    that: "'ActiveState=active' in platform_kafka_member_service_state.stdout_lines"
    fail_msg: Kafka member systemd instance is not active

- name: Verify Kafka member process
  ansible.builtin.assert:
    that: >-
      (platform_kafka_member_service_state.stdout | regex_findall('(?m)^MainPID=([0-9]+)$')
       | first | default('0') | int) > 0
    fail_msg: Kafka member systemd instance has no running main process

- name: Verify Kafka member configuration path
  ansible.builtin.stat:
    path: "{{ kafka_member.config_directory }}/server.properties"
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: platform_kafka_verify_config

- name: Assert Kafka member configuration exists
  ansible.builtin.assert:
    that: platform_kafka_verify_config.stat.exists
    fail_msg: Kafka member configuration is missing from its isolated directory

- name: Read Kafka member metadata
  ansible.builtin.slurp:
    src: "{{ kafka_member.data_directory }}/meta.properties"
  register: platform_kafka_verify_member_metadata

- name: Assert Kafka member identity
  ansible.builtin.assert:
    that:
      - (platform_kafka_verify_member_metadata.content | b64decode) is search('(?m)^cluster.id=' ~ platform_kafka_cluster_id ~ '$')
      - (platform_kafka_verify_member_metadata.content | b64decode) is search('(?m)^node.id=' ~ (kafka_member.node_id | string) ~ '$')
    fail_msg: Kafka member metadata does not match expected cluster/node identity

- name: Verify Kafka member listeners
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    timeout: 5
  loop: "{{ kafka_member.listener_ports }}"

- name: Verify SSL listeners with a real TLS handshake
  ansible.builtin.include_tasks: verify_ssl_listener.yml
  loop: "{{ kafka_member.listeners | default({}) | dict2items | map(attribute='value') | selectattr('securityProtocol', 'in', ['SSL', 'SASL_SSL']) | rejectattr('purpose', 'equalto', 'controller') | list if 'controller' not in kafka_member.roles else kafka_member.listeners | default({}) | dict2items | map(attribute='value') | selectattr('securityProtocol', 'in', ['SSL', 'SASL_SSL']) | list }}"
  loop_control:
    loop_var: kafka_ssl_listener
    label: "{{ kafka_member.id }}:{{ kafka_ssl_listener.name | default('SSL') }}"
  when: kafka_member.listeners | default({}) | length > 0
