---
- name: Проектируйте экземпляры службы Kafka из экземпляров службы развертывания, принадлежащих инвентарю
  ansible.builtin.set_fact:
    platform_kafka_instances: "{{ platform_kafka_instances + [ {
      'id': item.key,
      'deployment_id': _platform_kafka_project_deployment.key,
      'host': _platform_kafka_project_member_host,
      'advertised_host': (hostvars[_platform_kafka_project_member_host].ansible_host | default(_platform_kafka_project_member_host)),
      'node_id': (item.value.configuration.nodeId),
      'directory_id': (((platform_generated_state | default({})).get('serviceDeployments', {})).get(_platform_kafka_project_deployment.key, {}).get('members', {}).get(item.key, {}).get('identity', {}).get('directoryId', item.value.identity.directoryId | default(omit))),
      'roles': (item.value.roles | sort),
      'schema_registry': {
        'http_port': (item.value.configuration.schemaRegistryHttpPort | default(_platform_kafka_project_deployment.value.configuration.schemaRegistryHttpPort | default(platform_kafka_schema_registry_http_port))),
        'https_port': (item.value.configuration.schemaRegistryHttpsPort | default(_platform_kafka_project_deployment.value.configuration.schemaRegistryHttpsPort | default(platform_kafka_schema_registry_https_port)))
      },
      'listeners': (item.value.configuration.listeners | default(_platform_kafka_project_deployment.value.configuration.listeners | default(platform_kafka_listeners))),
      'tls_profile': (item.value.configuration.tlsProfile | default(_platform_kafka_project_deployment.value.configuration.tlsProfile | default(platform_kafka_tls_profile))),
      'data_directory': (item.value.configuration.dataDirectory | default((_platform_kafka_project_deployment.value.configuration.dataDirectory | default(platform_kafka_data_directory)) ~ ('/' ~ item.key if ((hostvars[_platform_kafka_project_member_host].platform_deployments | default({})).get(_platform_kafka_project_deployment.key, {}).get('members', {}) | length > 1) else ''))),
      'log_directory': (item.value.configuration.logDirectory | default(_platform_kafka_project_deployment.value.configuration.logDirectory | default(platform_kafka_log_directory ~ '/' ~ (_platform_kafka_project_deployment.value.configuration.runtimePathNamespace | default(_platform_kafka_project_deployment.key)) ~ '/' ~ item.key))),
      'config_directory': (item.value.configuration.configDirectory | default(_platform_kafka_project_deployment.value.configuration.configDirectory | default(platform_kafka_config_directory ~ '/' ~ (_platform_kafka_project_deployment.value.configuration.configPathNamespace | default('kafka')) ~ '/' ~ item.key))),
      '_compatibility_unit': ({
        'name': 'kafka-standalone',
        'destination': '/etc/systemd/system/kafka-standalone.service',
        'environment_pattern': '/etc/kafka/kafka-standalone/systemd.env',
        'runtime_directory': '/etc/kafka/kafka-standalone',
        'description': 'Apache Kafka ' ~ platform_kafka_version ~ ' KRaft member'
      } if _platform_kafka_project_deployment.value.mode | default('') == 'kraft-standalone' else {})
    } ] }}"
  loop: "{{ (hostvars[_platform_kafka_project_member_host].platform_deployments | default({})).get(_platform_kafka_project_deployment.key, {}).get('members', {}) | dict2items }}"
  loop_control:
    label: "{{ _platform_kafka_project_member_host }}:{{ item.key }}"
