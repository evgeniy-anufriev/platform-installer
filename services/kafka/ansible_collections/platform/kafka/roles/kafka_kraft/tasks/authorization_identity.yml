---
- name: Привязка точного материала запланированного экземпляра службы TLS
  ansible.builtin.include_tasks: resolve_tls_runtime.yml
  vars:
    kafka_tls_member: "{{ kafka_authorization_member }}"

- name: Прочитать тему RFC2253 выбранного сертификата экземпляра службы
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ _platform_kafka_tls_runtime.targetDirectory }}/certificate.pem", -noout, -subject, -nameopt, RFC2253]
  delegate_to: "{{ kafka_authorization_member.host }}"
  become: true
  register: kafka_authorization_subject
  changed_when: false

- name: Требовать однозначный неанонимный субъект сертификата
  ansible.builtin.assert:
    that:
      - kafka_authorization_subject.stdout is match('^subject=')
      - "';' not in kafka_authorization_subject.stdout"
      - "'\n' not in kafka_authorization_subject.stdout"
    fail_msg: KAFKA_ADMIN_CERTIFICATE_PRINCIPAL_INVALID

- name: Собрать выбранные идентификаторы экземпляров службы для привилегированной начальной загрузки и внутреннего трафика
  ansible.builtin.set_fact:
    _platform_kafka_admin_principals: "{{ (_platform_kafka_admin_principals + ['User:' ~ (kafka_authorization_subject.stdout | regex_replace('^subject=\\s*', ''))]) | unique | sort }}"
  changed_when: false
