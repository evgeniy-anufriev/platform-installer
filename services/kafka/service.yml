apiVersion: platform.installer/service-manifest/v1alpha1
kind: ServiceManifest
metadata:
  id: kafka
  version: "1.0.0-alpha.1"
  displayName: Apache Kafka
  description: Apache Kafka using KRaft metadata management
  category: messaging
modes:
  kraft-standalone:
    displayName: Single-node KRaft
    description: One combined broker and controller member
    memberRoles: [broker, controller]
    placement:
      explicit: true
      minMembers: 1
      maxMembers: 1
      distinctHosts: false
      roleCardinality:
        broker: {minimum: 1, maximum: 1}
        controller: {minimum: 1, maximum: 1}
    x-maturity: implemented-service-01a
  kraft-distributed:
    displayName: Distributed KRaft
    description: Explicit controller and broker placements
    memberRoles: [broker, controller]
    placement:
      explicit: true
      minMembers: 3
      distinctHosts: false
      roleCardinality:
        broker: {minimum: 1}
        controller: {minimum: 3}
    x-maturity: implemented-service-01b
listeners:
  client: {protocol: tcp, defaultPort: 9092, tlsCapable: true, scope: deployment}
  controller: {protocol: tcp, defaultPort: 9093, tlsCapable: true, scope: member}
capabilities:
  - service.kafka.client
  - service.kafka.kraft
dependencies: []
configurationSchema:
  $ref: configuration.schema.json
configuration:
  additionalProperties: false
  settings:
    quorumMode:
      kind: MANAGED
      roleVariable: platform_kafka_quorum_mode
      type: string
      scopes: [deployment]
      validation: {enum: [dynamic, static]}
      ui: {label: KRaft quorum mode, order: 5}
    tlsProfile:
      kind: MANAGED
      roleVariable: platform_kafka_tls_profile
      type: string
      scopes: [deployment, member]
      validation: {minLength: 1}
      ui: {label: Kafka TLS profile, order: 22, x-referenceKind: TLS_PROFILE}
    listeners:
      kind: MANAGED
      roleVariable: platform_kafka_listeners
      type: object
      scopes: [deployment, member]
      validation: {minProperties: 1}
      schema:
        type: object
        minProperties: 1
        additionalProperties:
          type: object
          additionalProperties: false
          required: [purpose, securityProtocol, port]
          properties:
            purpose: {type: string, enum: [client, interBroker, controller]}
            securityProtocol: {type: string, enum: [PLAINTEXT, SSL]}
            port: {type: integer, minimum: 1, maximum: 65535}
            bindAddress: {type: string, minLength: 1}
            advertisedAddress: {type: string, minLength: 1}
      ui: {label: Named Kafka listeners, order: 15}
    nodeId:
      kind: MANAGED
      roleVariable: platform_kafka_node_id
      type: integer
      scopes: [member]
      validation: {minimum: 0, maximum: 2147483647}
      ui: {label: Node ID, order: 25}
    dataDirectory:
      kind: MANAGED
      roleVariable: platform_kafka_data_directory
      type: string
      scopes: [deployment, member]
      validation: {minLength: 1, maxLength: 255}
      ui: {label: Каталог данных, section: Хранение, order: 0, description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких участников используются отдельные подкаталоги. Существующие данные автоматически не переносятся.}
    runtimePathNamespace:
      kind: MANAGED
      roleVariable: platform_kafka_runtime_path_namespace
      type: string
      scopes: [deployment]
      validation: {minLength: 1}
      ui: {label: Runtime path namespace, order: 31}
    logDirectory:
      kind: MANAGED
      roleVariable: platform_kafka_log_directory
      type: string
      scopes: [deployment, member]
      validation: {minLength: 1}
      ui: {label: Kafka log directory, order: 32}
    configDirectory:
      kind: MANAGED
      roleVariable: platform_kafka_config_directory
      type: string
      scopes: [deployment, member]
      validation: {minLength: 1}
      ui: {label: Kafka config directory, order: 33}
    logRetentionHours:
      kind: MANAGED
      roleVariable: platform_kafka_log_retention_hours
      type: integer
      scopes: [deployment]
      validation: {minimum: 1}
      ui: {label: Log retention hours, order: 40}
    advancedConfig:
      kind: ADVANCED
      roleVariable: platform_kafka_advanced_config
      type: object
      scopes: [deployment]
      validation: {additionalProperties: true}
      ui: {label: Advanced Kafka properties, order: 90}
x-reservedAdvancedProperties:
  - node.id
  - process.roles
  - listeners
  - advertised.listeners
  - controller.listener.names
  - controller.quorum.voters
  - controller.quorum.bootstrap.servers
  - log.dirs
  - listener.security.protocol.map
  - inter.broker.listener.name
  - listener.name.*.ssl.keystore.location
  - listener.name.*.ssl.truststore.location
roleEntrypoints:
  apply:
    fqcn: platform.kafka.kafka_kraft
    variablesPrefix: platform_kafka_
  verify:
    fqcn: platform.kafka.kafka_kraft
    variablesPrefix: platform_kafka_
artifacts:
  - id: kafka-binary
    name: kafka
    version: "4.3.1"
    os: redos
    architecture: x86_64
    digest: sha256:f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21
    requiredOffline: true
runtimeRequirements:
  - id: kafka-java
    name: java-21-openjdk-headless
    version: ""
    os: redos
    architecture: x86_64
    requiredOffline: false
compatibilityRef: compatibility.yml
x-initialSecurityScope:
  sasl: unsupported
  mtls: deferred
  customListeners: implemented-service-02a
