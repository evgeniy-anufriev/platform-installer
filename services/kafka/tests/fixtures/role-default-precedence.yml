---
- name: Проверка того, что проекция проекта Kafka сохраняет приоритет Ansible
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Загрузка желаемого состояния с типом QA
      ansible.builtin.include_vars:
        file: "{{ qa_project_file }}"
  tasks:
    - name: Подготовка входных данных Kafka из проекта
      ansible.builtin.include_role:
        name: platform.kafka.kafka_kraft
        tasks_from: project_runtime.yml
        public: true

    - name: Проверка итоговых значений переменных роли Kafka
      ansible.builtin.assert:
        fail_msg: "retention={{ platform_kafka_log_retention_hours }} type={{ platform_kafka_log_retention_hours | type_debug }}"
        that:
          - platform_kafka_quorum_mode == qa_expected_quorum_mode
          - platform_kafka_log_retention_hours is integer
          - platform_kafka_log_retention_hours == qa_expected_retention
          - platform_kafka_advanced_config == qa_expected_advanced
