platform_kafka_quorum_mode: static
platform_kafka_instances:
  - id: controller-1
    node_id: 1
    roles: [controller]
    host: node1
    advertised_host: 192.0.2.11
    controller_port: 9093
    data_directory: /var/lib/kafka/split/controller-1
    log_directory: /var/log/kafka/split/controller-1
  - id: controller-2
    node_id: 2
    roles: [controller]
    host: node2
    advertised_host: 192.0.2.12
    controller_port: 9093
    data_directory: /var/lib/kafka/split/controller-2
    log_directory: /var/log/kafka/split/controller-2
  - id: controller-3
    node_id: 3
    roles: [controller]
    host: node3
    advertised_host: 192.0.2.13
    controller_port: 9093
    data_directory: /var/lib/kafka/split/controller-3
    log_directory: /var/log/kafka/split/controller-3
  - id: broker-1
    node_id: 4
    roles: [broker]
    host: node1
    advertised_host: 192.0.2.11
    client_port: 9092
    data_directory: /var/lib/kafka/split/broker-1
    log_directory: /var/log/kafka/split/broker-1
