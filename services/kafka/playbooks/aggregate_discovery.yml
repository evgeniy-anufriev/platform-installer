---
# One controller-side snapshot: never use a delegated localhost fact as a
# mutable accumulator across target-host loop contexts.
# Use the play's limited host set, not the full inventory group: other services'
# hosts have no Kafka discovery facts.
- name: Создание полного нормализованного снимка обнаружения идентификации Kafka
  ansible.builtin.set_fact:
    platform_kafka_discovery_by_host: "{{ dict((ansible_play_hosts_all | sort) | zip((ansible_play_hosts_all | sort) | map('extract', hostvars, 'platform_kafka_identity_discovery'))) }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true
