---
- name: Деструктивный сброс среды выполнения Kafka с явно выбранных хостов QA
  hosts: platform_targets
  become: true
  gather_facts: false
  vars:
    platform_kafka_host_reset_confirmation: ''
    platform_kafka_host_reset_expected_confirmation: RESET_ALL_KAFKA_RUNTIME_ON_TARGET_HOSTS
    platform_kafka_host_reset_paths:
      - /etc/kafka
      - /var/lib/kafka
      - /var/log/kafka
      - /opt/kafka
      - /opt/kafka_2.13-4.3.1
  tasks:
    - name: Требовать точное разрушительное подтверждение сброса хоста Kafka
      ansible.builtin.assert:
        that:
          - platform_kafka_host_reset_confirmation == platform_kafka_host_reset_expected_confirmation
        fail_msg: 'BLOCKED: reset_kafka_host requires exact destructive acknowledgement'

    - name: Обнаружить все сервисы Kafka systemd systemd
      ansible.builtin.shell: |
        set -o pipefail
        {
          systemctl list-units --all --type=service --no-legend --plain
          systemctl list-unit-files --type=service --no-legend --plain
        } | awk '$1 ~ /^kafka(@.*)?\.service$/ || $1 ~ /^kafka-.*\.service$/ {print $1}' | sort -u
      args:
        executable: /bin/bash
      register: platform_kafka_host_reset_units
      changed_when: false

    - name: Остановить и отключить обнаруженные службы systemd Kafka
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ platform_kafka_host_reset_units.stdout_lines }}"
      failed_when: false

    - name: Подождать определенное время для завершения работы JVM Kafka
      ansible.builtin.command:
        argv: [pgrep, -f, kafka.Kafka]
      register: platform_kafka_host_reset_processes
      changed_when: false
      failed_when: false
      retries: 15
      delay: 2
      until: platform_kafka_host_reset_processes.rc != 0

    - name: Завершить работу оставшихся JVM Kafka после ограниченного завершения работы
      ansible.builtin.shell: |
        set -o pipefail
        for pid in $(pgrep -f 'kafka.Kafka .*server\.properties' || true); do
          cmdline="$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null || true)"
          case "${cmdline}" in
            *kafka.Kafka*server.properties*) kill -TERM "${pid}" ;;
          esac
        done
      args:
        executable: /bin/bash
      when: platform_kafka_host_reset_processes.rc == 0
      changed_when: true

    - name: Дождаться завершения Kafka JVM
      ansible.builtin.pause:
        seconds: 2
      when: platform_kafka_host_reset_processes.rc == 0

    - name: Принудительно остановить оставшиеся JVM Kafka
      ansible.builtin.shell: |
        set -o pipefail
        for pid in $(pgrep -f 'kafka.Kafka .*server\.properties' || true); do
          cmdline="$(tr '\0' ' ' < "/proc/${pid}/cmdline" 2>/dev/null || true)"
          case "${cmdline}" in
            *kafka.Kafka*server.properties*) kill -KILL "${pid}" ;;
          esac
        done
      args:
        executable: /bin/bash
      when: platform_kafka_host_reset_processes.rc == 0
      changed_when: true

    - name: Убедиться, что JVM Kafka отсутствуют перед удалением файлов среды выполнения
      ansible.builtin.command:
        argv: [pgrep, -f, kafka.Kafka]
      register: platform_kafka_host_reset_final_processes
      changed_when: false
      failed_when: platform_kafka_host_reset_final_processes.rc == 0

    - name: Удаление среды выполнения Kafka и установленных путей распространения
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ platform_kafka_host_reset_paths }}"

    - name: Найти служебные файлы systemd Kafka systemd
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns:
          - 'kafka*.service'
        file_type: file
        recurse: false
      register: platform_kafka_host_reset_unit_files

    - name: Удалить служебные файлы systemd Kafka systemd
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ platform_kafka_host_reset_unit_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Перезагрузить systemd после сброса хоста Kafka
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Очистить устаревшее состояние обнаруженных системных служб Kafka
      ansible.builtin.command:
        argv: [systemctl, reset-failed, "{{ item }}"]
      loop: "{{ platform_kafka_host_reset_units.stdout_lines }}"
      changed_when: false
      failed_when: false

    - name: Убедиться, что пути выполнения Kafka отсутствуют
      ansible.builtin.stat:
        path: "{{ item }}"
      register: platform_kafka_host_reset_path_state
      loop: "{{ platform_kafka_host_reset_paths }}"

    - name: При подтверждении сброса хоста Kafka удалены все выбранные пути выполнения
      ansible.builtin.assert:
        that: not item.stat.exists
        fail_msg: "Kafka host reset did not remove {{ item.item }}"
      loop: "{{ platform_kafka_host_reset_path_state.results }}"
      loop_control:
        label: "{{ item.item }}"
