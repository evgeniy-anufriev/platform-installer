---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- import_playbook: discover.yml

- name: "Объединить результаты обнаружения идентификаторов Kafka"
  hosts: platform_targets
  gather_facts: false
  tasks:
    - name: Объединить нормализованные результаты обнаружения без изменений
      ansible.builtin.include_tasks: aggregate_discovery.yml

- name: Материализовать идентификаторы кластера и узлов Kafka
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Выбрать эффективное желаемое состояние Kafka для материализации на стороне контроллера
      ansible.builtin.set_fact:
        _platform_kafka_materialization_desired_state: >-
          {{ platform_desired_state |
             default(hostvars[(groups['platform_targets'] | default([]) | sort | first)].platform_desired_state |
                     default({}, true), true) }}

    - name: Материализация управляемых удостоверений Kafka перед изменением
      platform.core.materialize_kafka_identities:
        project_path: "{{ platform_kafka_project_path | default(platform_project_manifest_path | default((inventory_dir | default('/project/inventory', true)) ~ '/../project.yml', true), true) if (_platform_kafka_materialization_desired_state | length == 0) else omit }}"
        inventory_path: "{{ platform_kafka_inventory_path | default((platform_project_root | default((inventory_dir | default('/project/inventory', true)) | dirname, true)) ~ '/inventory/hosts.yml', true) }}"
        state_path: "{{ platform_generated_state_path | default((platform_project_root | default((inventory_dir | default('/project/inventory', true)) | dirname, true)) ~ '/inventory/group_vars/all/platform-state.yml', true) if (_platform_kafka_materialization_desired_state | length > 0) else omit }}"
        desired_state: "{{ _platform_kafka_materialization_desired_state }}"
        project_id: >-
          {{ platform_project_id |
             default(platform_project_manifest_document.metadata.id |
                     default((inventory_dir | default('/project/inventory', true) | dirname | basename), true), true) }}
        discovery: "{{ hostvars['localhost'].platform_kafka_discovery_by_host | default({}) }}"
      register: platform_kafka_materialization
      # This only creates run-local derived state for the following play. It
      # neither mutates canonical desired state nor a target host, so it must
      # not make a repeat service apply appear changed.
      changed_when: false

- name: "Сохранить рассчитанные идентификаторы Kafka"
  hosts: platform_targets
  gather_facts: false
  tasks:
    - name: Передать служебное состояние идентификаторов Kafka на целевые узлы
      ansible.builtin.set_fact:
        platform_generated_state: >-
          {{ hostvars['localhost'].platform_kafka_materialization.materialization.stateDocument.platform_generated_state |
             default({}, true) }}

- import_playbook: ../../../ansible-core/playbooks/validate.yml

- name: Применить экземпляры службы Kafka KRaft
  hosts: platform_targets
  any_errors_fatal: true
  become: true
  gather_facts: true
  pre_tasks:
    - name: Применить конфигурацию доверенной среды выполнения Kafka
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.kafka.kafka_kraft
      platform_kafka_verify_only: false
      platform_kafka_phase: kafka

- name: Применить Schema Registry после запуска всех экземпляров службы Kafka
  hosts: platform_targets
  become: true
  gather_facts: false
  roles:
    - role: platform.kafka.kafka_kraft
      platform_kafka_verify_only: false
      platform_kafka_phase: schema_registry
