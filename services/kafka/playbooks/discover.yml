---
- name: Обнаружение личности Kafka
  hosts: platform_targets
  become: true
  gather_facts: false
  tasks:
    - name: Инициализация необязательного устаревшего состояния проекта Kafka
      ansible.builtin.set_fact:
        _kafka_discovery_project: {}
      when: platform_desired_state | default({}) | length == 0

    - name: Загрузка устаревшего проекта для проецирования пути
      ansible.builtin.include_vars:
        file: "{{ platform_kafka_project_path | default(platform_project_manifest_path | default((inventory_dir | default('/project/inventory', true)) ~ '/../project.yml', true), true) }}"
        name: _kafka_discovery_project
      when: platform_desired_state | default({}) | length == 0

    - name: Выбрать эффективное желаемое состояние обнаружения Kafka
      ansible.builtin.set_fact:
        _kafka_discovery_desired_state: >-
          {{ platform_desired_state
             if (platform_desired_state | default({}) | length > 0)
             else (_kafka_discovery_project.desiredState | default(platform_project | default({}))) }}

    - name: Создание локальных записей путей к метаданным Kafka
      ansible.builtin.include_tasks: discover_deployment.yml
      loop: "{{ (_kafka_discovery_desired_state.serviceDeployments | default({}) | dict2items) }}"
      loop_control:
        loop_var: _kafka_discovery_deployment
      when: _kafka_discovery_deployment.value.serviceType | default('') == 'kafka'
    - name: Обнаружение метаданных Kafka, доступных только для чтения
      platform.core.discover_kafka_metadata:
        records: "{{ _kafka_discovery_records | default([]) }}"
      register: _kafka_discovery_result
    - name: Публикация нормализованных записей обнаружения
      ansible.builtin.set_fact:
        platform_kafka_identity_discovery: "{{ _kafka_discovery_result.discovery }}"
    - name: Показать очищенное обнаружение личности Kafka
      ansible.builtin.debug:
        var: platform_kafka_identity_discovery
