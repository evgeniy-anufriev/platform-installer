---
- name: Загрузка служебного состояния Kafka для проверки без внесения изменений
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Проверка созданного состояния Kafka, принадлежащего контроллеру
      ansible.builtin.stat:
        path: "{{ platform_generated_state_path }}"
      register: _platform_kafka_generated_state_stat
      when: platform_generated_state_path is defined

    - name: Проверка наличия сохранённого служебного состояния Kafka для Verify
      ansible.builtin.assert:
        that:
          - _platform_kafka_generated_state_stat.stat.exists
          - _platform_kafka_generated_state_stat.stat.isreg
        fail_msg: KAFKA_GENERATED_STATE_REQUIRED
      when: platform_generated_state_path is defined

    - name: Чтение созданного состояния Kafka, принадлежащего контроллеру
      ansible.builtin.include_vars:
        file: "{{ platform_generated_state_path }}"
        name: _platform_kafka_generated_state_document
      when: platform_generated_state_path is defined

    - name: Публикация созданного состояния Kafka, принадлежащего контроллеру
      ansible.builtin.set_fact:
        platform_generated_state: >-
          {{ _platform_kafka_generated_state_document.platform_generated_state | default({}) }}
      when: platform_generated_state_path is defined
