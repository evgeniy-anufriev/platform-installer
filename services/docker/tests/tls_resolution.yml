---
- name: Проверка точного материала Docker TLS без подготовки
  hosts: platform_targets
  gather_facts: false
  tasks:
    - name: Разрешить материал Docker TLS с помощью задачи производственной роли
      ansible.builtin.include_role:
        name: platform.docker.docker_rootless
        tasks_from: resolve_tls.yml
