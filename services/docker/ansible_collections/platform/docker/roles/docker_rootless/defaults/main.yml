---
platform_docker_mode: create-user
platform_docker_name: "{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}docker"
platform_docker_account_name: "{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}docker"
platform_docker_data_root: "/home/{{ platform_docker_account_name }}/.local/share/docker"
platform_docker_account_credential:
  passwordSecretRef: ''
platform_docker_secret_files: {}
platform_docker_tls_profile: infrastructure-tls
platform_docker_tls_directory: ''
platform_docker_api_bind_address: 0.0.0.0
platform_docker_api_port: 2376
platform_docker_internal_api_port: 12376
platform_docker_verify_only: false
platform_docker_lxc_bridge: lxcbr0
platform_docker_lxc_veth_limit: 10
platform_docker_lxc_dns_server: ''
platform_docker_packages:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
  - docker-compose
  - lxc
  - dnsmasq
  - fuse-overlayfs
