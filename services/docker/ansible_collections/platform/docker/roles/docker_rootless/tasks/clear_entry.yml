---
- name: Проверка допустимости выбранной учётной записи Docker для очистки
  ansible.builtin.assert:
    that: platform_docker_account_name is match('^[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: DOCKER_ACCOUNT_INVALID

- name: Определение выбранной учетной записи Docker для очистки
  ansible.builtin.getent:
    database: passwd
    key: "{{ platform_docker_account_name }}"
    fail_key: true

- name: Привязка выбранной учетной записи для очистки
  ansible.builtin.set_fact:
    _platform_docker_clear_uid: "{{ getent_passwd[platform_docker_account_name][1] | int }}"
    _platform_docker_clear_home: "{{ getent_passwd[platform_docker_account_name][4] }}"
  changed_when: false

- name: "Отклонение неподходящей учётной записи или небезопасного домашнего каталога"
  ansible.builtin.assert:
    that:
      - _platform_docker_clear_uid | int >= 1000
      - _platform_docker_clear_home is match('^/home/[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: DOCKER_ACCOUNT_INELIGIBLE

- name: Проверка точных путей управляемых системных служб Docker без перехода по ссылкам
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop:
    - "/etc/systemd/system/{{ platform_docker_name }}-rootless-{{ platform_docker_account_name }}.service"
    - "{{ _platform_docker_clear_home }}/.config/systemd/user/docker.service"
  register: _platform_docker_clear_units

- name: Проверка обычного типа unit-файлов systemd перед чтением
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: DOCKER_CLEAR_UNIT_NOT_OWNED
    quiet: true
  loop: "{{ _platform_docker_clear_units.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Чтение выбранных системных служб Docker для подтверждения права собственности
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  loop: "{{ _platform_docker_clear_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: _platform_docker_clear_unit_contents

- name: Запрет остановки чужих системных и пользовательских служб
  ansible.builtin.assert:
    that:
      - _platform_docker_clear_units.results[0].stat.pw_name == 'root'
      - _platform_docker_clear_units.results[1].stat.pw_name == platform_docker_account_name
      - (_platform_docker_clear_unit_contents.results[0].content | b64decode).startswith('# Platform Installer V2 managed rootless Docker system/user bridge')
      - (_platform_docker_clear_unit_contents.results[1].content | b64decode).startswith('# Platform Installer V2 managed rootless Docker user unit')
    fail_msg: DOCKER_CLEAR_UNIT_NOT_OWNED

- name: Остановка и отключение только системной службы Docker выбранной учётной записи
  ansible.builtin.systemd:
    name: "{{ platform_docker_name }}-rootless-{{ platform_docker_account_name }}.service"
    state: stopped
    enabled: false

- name: Остановка выбранной пользовательской службы Docker без прав root, если она запущена отдельно
  ansible.builtin.command:
    argv: [systemctl, --user, stop, docker.service]
  become: true
  become_user: "{{ platform_docker_account_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _platform_docker_clear_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ _platform_docker_clear_uid }}/bus"
  changed_when: false

- name: Подтверждение остановки выбранного Docker без прав root
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, docker.service]
  become: true
  become_user: "{{ platform_docker_account_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _platform_docker_clear_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ _platform_docker_clear_uid }}/bus"
  register: _platform_docker_clear_state
  changed_when: false
  failed_when: false

- name: Проверка остановки пользовательской службы Docker после очистки
  ansible.builtin.assert:
    that: _platform_docker_clear_state.stdout != 'active'
    fail_msg: DOCKER_CLEAR_DAEMON_STILL_ACTIVE
