---
- name: Select Core PKI consumer plan when available
  ansible.builtin.include_role:
    name: platform.core.pki_materialize
    tasks_from: select_consumer_plan.yml
  vars:
    platform_pki_consumer_tls_profile_id: "{{ platform_docker_tls_profile }}"
  when: >-
    platform_pki_materialization_plans | default(hostvars['localhost'].platform_pki_materialization_plans | default([]), true) | length > 0

- name: Resolve approved Docker TLS directory
  ansible.builtin.set_fact:
    _platform_docker_tls_source: >-
      {{ platform_pki_selected_consumer_plan.targetDirectory
         if platform_pki_selected_consumer_plan is defined
         else platform_docker_tls_directory }}
  changed_when: false

- name: Reject missing or unsafe PKI directory
  ansible.builtin.assert:
    that:
      - _platform_docker_tls_source is match('^/[A-Za-z0-9_./-]{1,240}$')
      - "'..' not in _platform_docker_tls_source.split('/')"
    fail_msg: DOCKER_PKI_MATERIALIZATION_REQUIRED

- name: Inspect exact Docker TLS files
  ansible.builtin.stat:
    path: "{{ _platform_docker_tls_source }}/{{ item }}"
    follow: false
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  register: _platform_docker_tls_files
  no_log: true

- name: Require regular, non-symlink TLS material
  ansible.builtin.assert:
    that:
      - _platform_docker_tls_files.results | rejectattr('stat.isreg', 'equalto', true) | list | length == 0
      - _platform_docker_tls_files.results | selectattr('stat.islnk', 'equalto', true) | list | length == 0
    fail_msg: DOCKER_PKI_MATERIALIZATION_REQUIRED
  no_log: true

- name: Require the selected Core PKI request to declare both Docker usages
  ansible.builtin.assert:
    that:
      - _platform_docker_selected_requests | length == 1
      - "'serverAuth' in (_platform_docker_selected_requests[0].usages | default([]))"
      - "'clientAuth' in (_platform_docker_selected_requests[0].usages | default([]))"
    fail_msg: DOCKER_PKI_USAGES_INVALID
  vars:
    _platform_docker_selected_requests: >-
      {{ _platform_pki_consumer_requests
         | selectattr('id', 'equalto', platform_pki_selected_consumer_plan.requestId)
         | list }}
  when: platform_pki_selected_consumer_plan is defined

- name: Read explicit certificate extended key usage
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ _platform_docker_tls_source }}/certificate.pem", -noout, -ext, extendedKeyUsage]
  register: _platform_docker_certificate_eku
  changed_when: false
  failed_when: false
  no_log: true

- name: Reject absent or incomplete explicit Docker certificate EKU
  ansible.builtin.assert:
    that:
      - _platform_docker_certificate_eku.rc == 0
      - _platform_docker_certificate_eku.stdout is search('X509v3 Extended Key Usage:')
      - _platform_docker_certificate_eku.stdout is search('(?m)(?:^|[,\n])\s*TLS Web Server Authentication\s*(?:,|$)')
      - _platform_docker_certificate_eku.stdout is search('(?m)(?:^|[,\n])\s*TLS Web Client Authentication\s*(?:,|$)')
    fail_msg: DOCKER_PKI_USAGES_INVALID

- name: Inspect Docker API certificate SAN
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ _platform_docker_tls_source }}/certificate.pem", -noout, -ext, subjectAltName]
  register: _platform_docker_certificate_san
  changed_when: false
  no_log: true

- name: Require certificate identity for the target API address
  ansible.builtin.assert:
    that:
      - >-
        _platform_docker_certificate_san.stdout is search(
          '(^|[,\\s])IP Address:' ~ ((ansible_host | default(inventory_hostname)) | regex_escape) ~ '([,\\s]|$)')
        or _platform_docker_certificate_san.stdout is search(
          '(^|[,\\s])DNS:' ~ ((ansible_host | default(inventory_hostname)) | regex_escape) ~ '([,\\s]|$)')
    fail_msg: DOCKER_PKI_API_IDENTITY_MISSING
