---
- name: Установка настроенных пакетов Docker без прав root для RED OS
  ansible.builtin.dnf:
    name: "{{ platform_docker_packages }}"
    state: present
    update_cache: false

- name: "Проверка того, что установка пакетов не запустила Docker с правами root"
  ansible.builtin.command:
    argv: [systemctl, is-active, docker.service, docker.socket]
  register: _platform_docker_rootful_postinstall
  changed_when: false
  failed_when: false

- name: Отклонение конфликта с демоном или сокетом Docker с правами root после установки
  ansible.builtin.assert:
    that: "'active' not in _platform_docker_rootful_postinstall.stdout_lines"
    fail_msg: DOCKER_ROOTFUL_CONFLICT

- name: Проверка владения установленным помощником RootlessKit LXC
  ansible.builtin.stat:
    path: /usr/libexec/lxc/lxc-user-nic
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_docker_lxc_helper

- name: Проверка доверенного исполняемого файла помощника LXC
  ansible.builtin.assert:
    that:
      - _platform_docker_lxc_helper.stat.isreg
      - not _platform_docker_lxc_helper.stat.islnk
      - _platform_docker_lxc_helper.stat.pw_name == 'root'
      - _platform_docker_lxc_helper.stat.mode in ['4755', '4750']
    fail_msg: DOCKER_LXC_HELPER_UNSAFE

- name: Проверка необходимых исполняемых файлов Docker без прав root
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: [/usr/bin/dockerd-rootless.sh, /usr/bin/rootlesskit, /usr/bin/newuidmap, /usr/bin/newgidmap, /usr/libexec/docker/cli-plugins/docker-compose]
  register: _platform_docker_binaries

- name: Проверка наличия всех исполняемых файлов Docker без прав root и Compose
  ansible.builtin.assert:
    that: _platform_docker_binaries.results | rejectattr('stat.isreg', 'equalto', true) | list | length == 0
    fail_msg: DOCKER_RUNTIME_PACKAGE_INCOMPLETE

- name: Проверить, существует ли уже выделенная учетная запись Docker
  ansible.builtin.command:
    argv: [getent, passwd, "{{ platform_docker_account_name }}"]
  register: _platform_docker_existing_account
  changed_when: false
  failed_when: _platform_docker_existing_account.rc not in [0, 2]
  when: platform_docker_mode == 'create-user'

- name: Создать выделенную учетную запись Docker в заблокированном состоянии, только если она отсутствует
  ansible.builtin.user:
    name: "{{ platform_docker_account_name }}"
    create_home: true
    system: false
    shell: /bin/bash
    state: present
  when:
    - platform_docker_mode == 'create-user'
    - _platform_docker_existing_account.rc == 2

- name: Проверка состояния пароля при создании пользователя без чтения сохраненного хеша
  ansible.builtin.command:
    argv: [passwd, -S, "{{ platform_docker_account_name }}"]
  register: _platform_docker_password_state
  changed_when: false
  when: platform_docker_mode == 'create-user'
  no_log: true

- name: Требовать состояние пароля поддерживаемой учетной записи
  ansible.builtin.assert:
    that: _platform_docker_password_state.stdout.split()[1] in ['LK', 'NP', 'PS']
    fail_msg: DOCKER_ACCOUNT_PASSWORD_STATE_INVALID
  when: platform_docker_mode == 'create-user'

- name: Получение хэша пароля учетной записи без зависимости от библиотеки passlib Python
  ansible.builtin.command:
    argv: [openssl, passwd, -6, -stdin]
    stdin: >-
      {{ lookup('ansible.builtin.file',
          platform_docker_secret_files[platform_docker_account_credential.passwordSecretRef],
          lstrip=False, rstrip=False) }}
    stdin_add_newline: false
  delegate_to: localhost
  become: false
  register: _platform_docker_account_password_hash
  changed_when: false
  when:
    - platform_docker_mode == 'create-user'
    - _platform_docker_password_state.stdout.split()[1] in ['LK', 'NP']
  no_log: true

- name: "Проверить полный формат хеша пароля SHA-512 crypt"
  ansible.builtin.assert:
    that:
      - _platform_docker_account_password_hash.stdout.startswith('$6$')
      - _platform_docker_account_password_hash.stdout.split('$') | map('length') | list == [0, 1, 16, 86]
      - _platform_docker_account_password_hash.stdout is match('^[./A-Za-z0-9$]+$')
    fail_msg: DOCKER_ACCOUNT_HASH_INVALID
  when:
    - platform_docker_mode == 'create-user'
    - _platform_docker_password_state.stdout.split()[1] in ['LK', 'NP']
  no_log: true

- name: Устанавливать пароль для создания пользователя только в том случае, если учетная запись заблокирована или отключена
  ansible.builtin.command:
    argv: [chpasswd, -e]
    stdin: "{{ platform_docker_account_name }}:{{ _platform_docker_account_password_hash.stdout }}"
  when:
    - platform_docker_mode == 'create-user'
    - _platform_docker_password_state.stdout.split()[1] in ['LK', 'NP']
  no_log: true

- name: Разрешить выбранную учетную запись через NSS
  ansible.builtin.getent:
    database: passwd
    key: "{{ platform_docker_account_name }}"
    fail_key: true

- name: "Сохранить UID и домашний каталог выбранной учётной записи из NSS"
  ansible.builtin.set_fact:
    _platform_docker_uid: "{{ getent_passwd[platform_docker_account_name][1] | int }}"
    _platform_docker_gid: "{{ getent_passwd[platform_docker_account_name][2] | int }}"
    _platform_docker_home: "{{ getent_passwd[platform_docker_account_name][4] }}"
  changed_when: false

- name: "Проверить непривилегированную учётную запись Docker и допустимый домашний каталог"
  ansible.builtin.assert:
    that:
      - _platform_docker_uid | int >= 1000
      - _platform_docker_home is match('^/home/[a-z_][a-z0-9_-]{0,31}$')
    fail_msg: DOCKER_ACCOUNT_INELIGIBLE

- name: Чтение выделенных пользователю диапазонов subordinate UID и GID
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: [/etc/subuid, /etc/subgid]
  register: _platform_docker_subid_files

- name: Проверка диапазонов subordinate UID и GID, выделенных пользователю
  ansible.builtin.assert:
    that:
      - >-
        (_platform_docker_subid_files.results[0].content | b64decode)
        is search('(?m)^' ~ platform_docker_account_name ~ ':[0-9]+:[0-9]+$')
      - >-
        (_platform_docker_subid_files.results[1].content | b64decode)
        is search('(?m)^' ~ platform_docker_account_name ~ ':[0-9]+:[0-9]+$')
      - >-
        (((_platform_docker_subid_files.results[0].content | b64decode).splitlines()
          | select('match', '^' ~ platform_docker_account_name ~ ':') | first).split(':')[2] | int) >= 65536
      - >-
        (((_platform_docker_subid_files.results[1].content | b64decode).splitlines()
          | select('match', '^' ~ platform_docker_account_name ~ ':') | first).split(':')[2] | int) >= 65536
    fail_msg: DOCKER_SUBID_ALLOCATION_REQUIRED

- name: Проверка общего адресата пользовательской сети LXC перед изменением
  ansible.builtin.include_tasks: guard_root_destination.yml
  vars:
    platform_docker_guard_path: /etc/lxc/lxc-usernet
    platform_docker_guard_marker: ''

- name: Проверка существующей записи пользовательской сети LXC без замены неуправляемых настроек
  ansible.builtin.command:
    argv: [grep, -E, "^{{ platform_docker_account_name }}[[:space:]]", /etc/lxc/lxc-usernet]
  register: _platform_docker_existing_usernet
  changed_when: false
  failed_when: _platform_docker_existing_usernet.rc not in [0, 1, 2]
  when: _platform_docker_guard_file.stat.exists

- name: Отклонение конфликтующей записи сети пользователя LXC
  ansible.builtin.assert:
    that:
      - >-
        not _platform_docker_guard_file.stat.exists or
        _platform_docker_existing_usernet.rc != 0 or
        _platform_docker_existing_usernet.stdout_lines ==
        [platform_docker_account_name ~ ' veth ' ~ platform_docker_lxc_bridge ~ ' ' ~ (platform_docker_lxc_veth_limit | string)]
    fail_msg: DOCKER_LXC_USERNET_CONFLICT

- name: Добавление распределения пользовательской сети LXC только для выбранной учетной записи
  ansible.builtin.lineinfile:
    path: /etc/lxc/lxc-usernet
    create: true
    owner: root
    group: root
    mode: '0644'
    regexp: "^{{ platform_docker_account_name }}[[:space:]]"
    line: "{{ platform_docker_account_name }} veth {{ platform_docker_lxc_bridge }} {{ platform_docker_lxc_veth_limit }}"

- name: Проверка переопределения LXC dnsmasq на предмет неуправляемого владения
  ansible.builtin.stat:
    path: "/etc/lxc/{{ platform_docker_name }}-dnsmasq.conf"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_docker_lxc_dnsmasq_file

- name: Отклонение существующего небезопасного переопределения LXC dnsmasq перед его чтением
  ansible.builtin.assert:
    that:
      - not (_platform_docker_lxc_dnsmasq_file.stat.islnk | default(false))
      - not _platform_docker_lxc_dnsmasq_file.stat.exists or (_platform_docker_lxc_dnsmasq_file.stat.isreg | default(false))
      - not _platform_docker_lxc_dnsmasq_file.stat.exists or _platform_docker_lxc_dnsmasq_file.stat.pw_name == 'root'
    fail_msg: DOCKER_LXC_DNSMASQ_CONFIG_NOT_OWNED

- name: Чтение управляемых настроек LXC для Docker
  ansible.builtin.slurp:
    src: "/etc/lxc/{{ platform_docker_name }}-dnsmasq.conf"
  register: _platform_docker_lxc_dnsmasq_content
  when: _platform_docker_lxc_dnsmasq_file.stat.exists

- name: Запрет замены неуправляемых дополнительных настроек LXC dnsmasq
  ansible.builtin.assert:
    that:
      - not (_platform_docker_lxc_dnsmasq_file.stat.islnk | default(false))
      - >-
        not _platform_docker_lxc_dnsmasq_file.stat.exists or
        (_platform_docker_lxc_dnsmasq_content.content | b64decode).startswith('# Platform Installer V2 managed Docker LXC DHCP-only configuration')
    fail_msg: DOCKER_LXC_DNSMASQ_CONFIG_NOT_OWNED

- name: Проверка общей конфигурации сети LXC перед изменением
  ansible.builtin.include_tasks: guard_root_destination.yml
  vars:
    platform_docker_guard_path: /etc/sysconfig/lxc-net
    platform_docker_guard_marker: ''
    platform_docker_guard_required: true

- name: Проверка активной справки по конфигурации LXC dnsmasq
  ansible.builtin.command:
    argv: [grep, -E, '^LXC_DHCP_CONFILE=', /etc/sysconfig/lxc-net]
  register: _platform_docker_lxc_dhcp_config
  changed_when: false
  failed_when: _platform_docker_lxc_dhcp_config.rc not in [0, 1]

- name: Запрет замены неуправляемой конфигурации LXC dnsmasq
  ansible.builtin.assert:
    that:
      - >-
        _platform_docker_lxc_dhcp_config.rc == 1 or
        _platform_docker_lxc_dhcp_config.stdout_lines ==
        ['LXC_DHCP_CONFILE=/etc/lxc/' ~ platform_docker_name ~ '-dnsmasq.conf']
    fail_msg: DOCKER_LXC_DHCP_CONFIG_CONFLICT

- name: "Проверка файла upstream DNS-серверов systemd-resolved"
  ansible.builtin.stat:
    path: /run/systemd/resolve/resolv.conf
    follow: true
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_docker_upstream_resolver_file

- name: "Чтение адресов DNS-серверов узла для DHCP сети LXC"
  ansible.builtin.slurp:
    src: "{{ '/run/systemd/resolve/resolv.conf' if _platform_docker_upstream_resolver_file.stat.isreg | default(false) else '/etc/resolv.conf' }}"
  register: _platform_docker_upstream_resolvers

- name: Выбор явного или целевого адреса Docker LXC DNS
  ansible.builtin.set_fact:
    _platform_docker_lxc_dns_server: >-
      {{ platform_docker_lxc_dns_server if platform_docker_lxc_dns_server | length > 0 else
         ((_platform_docker_upstream_resolvers.content | b64decode |
           regex_findall('(?m)^nameserver +([0-9.]+)') |
           reject('match', '^(127[.]|0[.]0[.]0[.]0$)') | list | first) | default('')) }}
  changed_when: false

- name: "Проверка IPv4-адреса DNS-сервера вне loopback-диапазона для DHCP сети LXC"
  ansible.builtin.assert:
    that:
      - _platform_docker_lxc_dns_server is match('^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})[.]){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$')
      - not _platform_docker_lxc_dns_server.startswith('127.')
      - _platform_docker_lxc_dns_server != '0.0.0.0'
    fail_msg: DOCKER_LXC_DNS_SERVER_UNAVAILABLE

- name: Сохранение LXC DHCP, разрешив существующему хосту DNS владеть портом 53
  ansible.builtin.copy:
    dest: "/etc/lxc/{{ platform_docker_name }}-dnsmasq.conf"
    owner: root
    group: root
    mode: '0644'
    content: |
      # Platform Installer V2 managed Docker LXC DHCP-only configuration
      port=0
      dhcp-option=option:dns-server,{{ _platform_docker_lxc_dns_server }}
  register: _platform_docker_lxc_dnsmasq_config_change

- name: Выбор конфигурации LXC dnsmasq только для DHCP без замены других настроек
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/lxc-net
    regexp: '^LXC_DHCP_CONFILE='
    line: "LXC_DHCP_CONFILE=/etc/lxc/{{ platform_docker_name }}-dnsmasq.conf"
  register: _platform_docker_lxc_dnsmasq_reference_change

- name: Перезапуск сети LXC только при изменении её конфигурации DHCP
  ansible.builtin.systemd:
    name: lxc-net.service
    state: restarted
  when: >-
    _platform_docker_lxc_dnsmasq_config_change is changed or
    _platform_docker_lxc_dnsmasq_reference_change is changed

- name: Проверка того, что сеть LXC включена и активна до Docker
  ansible.builtin.systemd:
    name: lxc-net.service
    enabled: true
    state: started

- name: Проверка того, что настроенный мост LXC активен
  ansible.builtin.command:
    argv: [ip, link, show, "{{ platform_docker_lxc_bridge }}"]
  changed_when: false

- name: Включение диспетчера пользователей учетной записи без сеанса входа в систему
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ platform_docker_account_name }}"]
    creates: "/var/lib/systemd/linger/{{ platform_docker_account_name }}"

- name: Проверка компонентов home и systemd пути службы выбранной учетной записи
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop:
    - "{{ _platform_docker_home }}"
    - "{{ _platform_docker_home }}/.config"
    - "{{ _platform_docker_home }}/.config/systemd"
    - "{{ _platform_docker_home }}/.config/systemd/user"
    - "{{ _platform_docker_home }}/.config/docker"
    - "{{ _platform_docker_home }}/.config/docker/pki"
  register: _platform_docker_home_components

- name: Отклонение путей учётной записи Docker при символических ссылках или другом владельце
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or item.stat.pw_name == platform_docker_account_name
    fail_msg: DOCKER_ACCOUNT_PATH_UNSAFE
    quiet: true
  loop: "{{ _platform_docker_home_components.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Создание каталогов служб user-systemd без изменения существующих разрешений
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_docker_account_name }}"
    group: "{{ _platform_docker_gid }}"
  loop:
    - "{{ _platform_docker_home }}/.config"
    - "{{ _platform_docker_home }}/.config/systemd"
    - "{{ _platform_docker_home }}/.config/systemd/user"

- name: Создание защищённых каталогов конфигурации Docker и PKI
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_docker_account_name }}"
    group: "{{ _platform_docker_gid }}"
    mode: '0700'
  loop:
    - "{{ _platform_docker_home }}/.config/docker"
    - "{{ _platform_docker_home }}/.config/docker/pki"

- name: Привязка защищённого каталога Docker TLS
  ansible.builtin.set_fact:
    _platform_docker_private_tls_dir: "{{ _platform_docker_home }}/.config/docker/pki"
  changed_when: false

- name: Настройка корня данных Docker
  ansible.builtin.include_tasks: data_root.yml

- name: Настройка постоянного окружения оболочки для Docker без прав root
  ansible.builtin.include_tasks: shell_environment.yml

- name: Копирование PKI-файлов в защищённый runtime-каталог учётной записи
  ansible.builtin.copy:
    src: "{{ _platform_docker_tls_source }}/{{ item }}"
    dest: "{{ _platform_docker_private_tls_dir }}/{{ item }}"
    remote_src: true
    owner: "{{ platform_docker_account_name }}"
    group: "{{ _platform_docker_gid }}"
    mode: '0600'
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  no_log: true
  notify: Перезапуск системной службы пользовательского Docker

- name: Проверка существующей пользовательской службы systemd Docker на наличие неуправляемого владения
  ansible.builtin.stat:
    path: "{{ _platform_docker_home }}/.config/systemd/user/docker.service"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_docker_existing_user_unit

- name: Чтение существующей пользовательской службы systemd Docker перед заменой
  ansible.builtin.slurp:
    src: "{{ _platform_docker_home }}/.config/systemd/user/docker.service"
  register: _platform_docker_existing_user_unit_content
  when: _platform_docker_existing_user_unit.stat.exists

- name: Отклонение чужой пользовательской службы systemd Docker
  ansible.builtin.assert:
    that:
      - not (_platform_docker_existing_user_unit.stat.islnk | default(false))
      - >-
        not _platform_docker_existing_user_unit.stat.exists or
        (_platform_docker_existing_user_unit_content.content | b64decode).startswith('# Platform Installer V2 managed rootless Docker user unit')
    fail_msg: DOCKER_USER_UNIT_NOT_OWNED

- name: Установка управляемой пользовательской службы Docker без прав root
  ansible.builtin.template:
    src: docker.service.j2
    dest: "{{ _platform_docker_home }}/.config/systemd/user/docker.service"
    owner: "{{ platform_docker_account_name }}"
    group: "{{ _platform_docker_gid }}"
    mode: '0644'
  notify: Перезапуск системной службы пользовательского Docker

- name: Проверка существующих системных назначений службы systemd Docker
  ansible.builtin.include_tasks: guard_root_destination.yml
  loop:
    - { path: "/etc/systemd/system/{{ platform_docker_name }}-lxc-ready.target", marker: '# Platform Installer V2 managed LXC readiness target' }
    - { path: "/etc/systemd/system/{{ platform_docker_name }}-rootless-{{ platform_docker_account_name }}.service", marker: '# Platform Installer V2 managed rootless Docker system/user bridge' }
  vars:
    platform_docker_guard_path: "{{ item.path }}"
    platform_docker_guard_marker: "{{ item.marker }}"
  loop_control:
    label: "{{ item.path }}"

- name: Установка цели systemd для готовности LXC
  ansible.builtin.template:
    src: platform-docker-lxc-ready.target.j2
    dest: "/etc/systemd/system/{{ platform_docker_name }}-lxc-ready.target"
    owner: root
    group: root
    mode: '0644'
  notify: Перезапуск системной службы пользовательского Docker

- name: "Установка системной службы запуска пользовательского Docker"
  ansible.builtin.template:
    src: platform-docker-rootless-bridge.service.j2
    dest: "/etc/systemd/system/{{ platform_docker_name }}-rootless-{{ platform_docker_account_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Перезапуск системной службы пользовательского Docker

- name: "Перечитывание unit-файлов systemd"
  ansible.builtin.systemd:
    daemon_reload: true

- name: Проверка того, что менеджер пользователей выбранной учетной записи активен
  ansible.builtin.systemd:
    name: "user@{{ _platform_docker_uid }}.service"
    state: started

- name: Перечитывание пользовательских unit-файлов systemd выбранной учётной записи
  ansible.builtin.command:
    argv: [systemctl, --user, daemon-reload]
  become: true
  become_user: "{{ platform_docker_account_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _platform_docker_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ _platform_docker_uid }}/bus"
  changed_when: false

- name: Отключение прямого автозапуска Docker в диспетчере пользователей
  ansible.builtin.command:
    argv: [systemctl, --user, disable, docker.service]
  become: true
  become_user: "{{ platform_docker_account_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _platform_docker_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ _platform_docker_uid }}/bus"
  register: _platform_docker_user_disable
  changed_when: "'Removed' in _platform_docker_user_disable.stdout or 'Removed' in _platform_docker_user_disable.stderr"

- name: Включение и активация цели при каждом запуске сети LXC
  ansible.builtin.systemd:
    name: "{{ platform_docker_name }}-lxc-ready.target"
    enabled: true
    state: started

- name: Включение автозапуска и запуск системной службы пользовательского Docker после готовности LXC
  ansible.builtin.systemd:
    name: "{{ platform_docker_name }}-rootless-{{ platform_docker_account_name }}.service"
    enabled: true
    state: started

- name: Выполнение отложенного перезапуска Docker после подготовки зависимых служб
  ansible.builtin.meta: flush_handlers
