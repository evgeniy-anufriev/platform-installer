---
- name: Проверка точного общего или системного назначения перед записью
  ansible.builtin.stat:
    path: "{{ platform_docker_guard_path }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_docker_guard_file

- name: Отклонить путь назначения при символической ссылке, неправильном типе файла или другом владельце
  ansible.builtin.assert:
    that:
      - not (_platform_docker_guard_file.stat.islnk | default(false))
      - not _platform_docker_guard_file.stat.exists or (_platform_docker_guard_file.stat.isreg | default(false))
      - not _platform_docker_guard_file.stat.exists or _platform_docker_guard_file.stat.pw_name == 'root'
      - not (platform_docker_guard_required | default(false)) or _platform_docker_guard_file.stat.exists
    fail_msg: DOCKER_SHARED_DESTINATION_UNSAFE

- name: Прочитать существующий управляемый маркер назначения
  ansible.builtin.slurp:
    src: "{{ platform_docker_guard_path }}"
  register: _platform_docker_guard_content
  when:
    - _platform_docker_guard_file.stat.exists
    - platform_docker_guard_marker | default('') | length > 0

- name: "Отклонить существующий файл назначения без признаков управления инсталлятором"
  ansible.builtin.assert:
    that:
      - >-
        not _platform_docker_guard_file.stat.exists or
        (platform_docker_guard_marker | default('') | length == 0) or
        (_platform_docker_guard_content.content | b64decode).startswith(platform_docker_guard_marker)
    fail_msg: DOCKER_SHARED_DESTINATION_NOT_OWNED
