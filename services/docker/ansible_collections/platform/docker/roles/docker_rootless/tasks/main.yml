---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Проверить входные настройки Docker без прав root и совместимость целевого узла
  ansible.builtin.include_tasks: validate.yml

- name: Проверка утвержденных источников пакета Docker
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: docker-engine, name: docker-ce}
      - {id: docker-cli, name: docker-ce-cli}
      - {id: docker-rootless, name: docker-ce-rootless-extras}
      - {id: docker-compose, name: docker-compose}
      - {id: docker-lxc, name: lxc}
      - {id: docker-fuse-overlayfs, name: fuse-overlayfs}
  when:
    - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
    - not (platform_docker_verify_only | bool)

- name: Выбрать точный материал Docker PKI
  ansible.builtin.include_tasks: resolve_tls.yml

- name: Подготовить Docker без прав root без изменения других развёртываний
  ansible.builtin.include_tasks: provision.yml
  when: not (platform_docker_verify_only | bool)

- name: Проверить работу Docker без прав root и Compose без изменений
  ansible.builtin.include_tasks: verify.yml
