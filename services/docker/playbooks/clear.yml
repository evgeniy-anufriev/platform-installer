---
- name: Остановка только выбранной управляемой службы Docker без прав root
  hosts: platform_targets
  become: true
  gather_facts: false
  tasks:
    - name: Очистка выбранной управляемой учетной записи Docker, не удаляя ее данные
      ansible.builtin.include_role:
        name: platform.docker.docker_rootless
        tasks_from: clear_entry
