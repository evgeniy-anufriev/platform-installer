---
- import_playbook: ../../../ansible-core/playbooks/validate-infrastructure.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Настройка Docker без прав root и Compose
  hosts: platform_targets
  become: true
  gather_facts: false
  pre_tasks:
    - name: Применение настроек доверенной среды выполнения Docker
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.docker.docker_rootless
      platform_docker_verify_only: false
