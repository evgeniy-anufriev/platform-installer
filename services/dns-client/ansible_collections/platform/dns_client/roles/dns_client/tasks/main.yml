---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Проверка наличия желаемой конфигурации и runtime-проекций DNS-клиента
  ansible.builtin.assert:
    that:
      - platform_desired_state is mapping
      - platform_deployments | default({}) is mapping
      - platform_dns_client_phase in ['apply', 'verify']
      - hostvars['localhost'].platform_dns_client_runtime_projection.clients | default({}) is mapping
    fail_msg: DNS_CLIENT_RUNTIME_PROJECTION_INVALID

- name: Использование входных данных клиента DNS, проецируемых контроллером
  ansible.builtin.set_fact:
    _platform_dns_client_clients: "{{ hostvars['localhost'].platform_dns_client_runtime_projection.clients | default({}) }}"

- name: Выбор локального развертывания клиента DNS
  ansible.builtin.set_fact:
    _platform_dns_client_local_items: >-
      {{ _platform_dns_client_clients | dict2items | selectattr('key', 'in', platform_deployments | default({})) | list }}

- name: Отклонение неоднозначного владения развертыванием клиента DNS
  ansible.builtin.assert:
    that: _platform_dns_client_local_items | length <= 1
    fail_msg: DNS_CLIENT_LOCAL_DEPLOYMENT_AMBIGUOUS

- name: Завершение роли клиента DNS на неучаствующем хосте
  ansible.builtin.meta: end_host
  when: _platform_dns_client_local_items | length == 0

- name: Публикация локальной проекции клиента DNS
  ansible.builtin.set_fact:
    platform_dns_client_local: "{{ _platform_dns_client_local_items | first | default({}) }}"

- name: Публикация локального размещения клиента DNS
  ansible.builtin.set_fact:
    _platform_dns_client_local_placement: "{{ platform_deployments[platform_dns_client_local.key] }}"

- name: Замена локальной клиентской проекции DNS производными значениями
  ansible.builtin.set_fact:
    platform_dns_client_local: "{{ _platform_dns_client_clients[platform_dns_client_local.key] }}"

- name: Безопасное обнаружение адаптера среды выполнения клиента DNS
  ansible.builtin.include_tasks: discover.yml

- name: Применение настроек раздельного DNS через systemd-resolved
  ansible.builtin.include_tasks: resolved.yml
  when:
    - platform_dns_client_phase == 'apply'
    - platform_dns_client_backend == 'systemd-resolved'

- name: Применение настроек раздельного DNS через NetworkManager
  ansible.builtin.include_tasks: networkmanager.yml
  when:
    - platform_dns_client_phase == 'apply'
    - platform_dns_client_backend == 'NetworkManager'

- name: Проверка работы DNS-клиента без изменений
  ansible.builtin.include_tasks: verify.yml
  when: platform_dns_client_phase == 'verify'
