---
- name: Убедиться, что systemd-resolved активен
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, systemd-resolved.service]
  changed_when: false
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Проверка эффективного состояния systemd-resolved, доступного только для чтения
  ansible.builtin.command:
    argv: [resolvectl, status]
  register: _platform_dns_client_resolvectl_status
  changed_when: false
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Чтение модуля Platform systemd-resolved без изменений
  ansible.builtin.slurp:
    src: "/etc/systemd/resolved.conf.d/{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}installer.conf"
  register: _platform_dns_client_resolved_dropin
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Проверить соответствие вставки «Платформа systemd-resolved» полученной проекции
  ansible.builtin.assert:
    that:
      - "('DNS=' ~ (platform_dns_client_local.servers | join(' '))) in (_platform_dns_client_resolved_dropin.content | b64decode)"
      - "('Domains=~' ~ platform_dns_client_local.managedZone) in (_platform_dns_client_resolved_dropin.content | b64decode)"
      - "'FallbackDNS=' not in (_platform_dns_client_resolved_dropin.content | b64decode)"
    fail_msg: DNS_CLIENT_RESOLVED_DROPIN_INVALID
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Проверка эффективного разделения серверов DNS и домена маршрутизации
  ansible.builtin.assert:
    that:
      - item in _platform_dns_client_resolvectl_status.stdout
      - "('~' ~ platform_dns_client_local.managedZone) in _platform_dns_client_resolvectl_status.stdout"
    fail_msg: DNS_CLIENT_RESOLVED_EFFECTIVE_STATE_INVALID
  loop: "{{ platform_dns_client_local.servers }}"
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Проверка NetworkManager разделенного профиля DNS, доступного только для чтения
  ansible.builtin.command:
    argv: [nmcli, -g, ipv4.dns,ipv4.dns-search,ipv4.ignore-auto-dns, connection, show, "{{ platform_dns_client_nm_connection | default('') }}"]
  register: _platform_dns_client_nm_verify
  changed_when: false
  when: platform_dns_client_backend == 'NetworkManager'

- name: Проверить эффективность разделенного профиля NetworkManager DNS
  ansible.builtin.assert:
    that:
      - item in _platform_dns_client_nm_verify.stdout
      - "('~' ~ platform_dns_client_local.managedZone) in _platform_dns_client_nm_verify.stdout"
      - "'no' in _platform_dns_client_nm_verify.stdout"
    fail_msg: DNS_CLIENT_NM_EFFECTIVE_STATE_INVALID
  loop: "{{ platform_dns_client_local.servers }}"
  when: platform_dns_client_backend == 'NetworkManager'

- name: "Проверить разрешение имени узла проекта системным DNS-резолвером"
  ansible.builtin.command:
    argv: [getent, hosts, "{{ platform_dns_client_local.hostRecord }}"]
  changed_when: false
