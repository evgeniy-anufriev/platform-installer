---
- name: Проверка того, что systemd-resolved активен
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, systemd-resolved.service]
  changed_when: false
  when: platform_dns_client_backend == 'systemd-resolved'

- name: "Проверка разрешения имени узла проекта системным DNS-резолвером"
  ansible.builtin.command:
    argv: [getent, hosts, "{{ platform_dns_client_local.hostRecord }}"]
  changed_when: false
