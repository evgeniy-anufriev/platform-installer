---
- name: Проверка состояния загрузки службы systemd systemd-resolved
  ansible.builtin.command:
    argv: [systemctl, show, systemd-resolved.service, --property=LoadState, --value]
  register: _platform_dns_client_resolved_unit
  changed_when: false
  failed_when: false

- name: Проверка состояния загрузки службы systemd NetworkManager
  ansible.builtin.command:
    argv: [systemctl, show, NetworkManager.service, --property=LoadState, --value]
  register: _platform_dns_client_nm_unit
  changed_when: false
  failed_when: false

- name: Проверка того, запущен ли systemd-resolved
  ansible.builtin.command:
    argv: [systemctl, is-active, systemd-resolved.service]
  register: _platform_dns_client_resolved_active
  changed_when: false
  failed_when: false

- name: Проверка того, запущен ли NetworkManager
  ansible.builtin.command:
    argv: [systemctl, is-active, NetworkManager.service]
  register: _platform_dns_client_nm_active
  changed_when: false
  failed_when: false

- name: "Проверка того, какой сервис управляет конфигурацией DNS-резолвера"
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false
  register: _platform_dns_client_resolv_conf

- name: "Чтение символической ссылки конфигурации DNS-резолвера без изменений"
  ansible.builtin.command:
    argv: [readlink, /etc/resolv.conf]
  register: _platform_dns_client_resolv_link
  changed_when: false
  failed_when: false
  when: _platform_dns_client_resolv_conf.stat.islnk | default(false)

- name: Выбор детерминированного клиентского сервера DNS
  ansible.builtin.set_fact:
    platform_dns_client_backend: >-
      {{ 'systemd-resolved'
         if _platform_dns_client_resolved_unit.stdout | trim == 'loaded'
         and _platform_dns_client_resolved_active.stdout | trim == 'active'
         else ('NetworkManager'
               if _platform_dns_client_nm_unit.stdout | trim == 'loaded'
               and _platform_dns_client_nm_active.stdout | trim == 'active'
               else '') }}

- name: Проверка поддержки выбранного механизма настройки DNS-клиента
  ansible.builtin.assert:
    that: platform_dns_client_backend | length > 0
    fail_msg: DNS_CLIENT_BACKEND_UNSUPPORTED

- name: Проверка сервиса, управляющего resolv.conf, и допустимости изменения файла
  ansible.builtin.assert:
    that:
      - _platform_dns_client_resolv_conf.stat.islnk | default(false)
      - _platform_dns_client_resolv_link.stdout | trim in ['../run/systemd/resolve/stub-resolv.conf', '../run/systemd/resolve/resolv.conf', '/run/systemd/resolve/stub-resolv.conf', '/run/systemd/resolve/resolv.conf']
    fail_msg: DNS_CLIENT_RESOLV_CONF_CONFLICT
  when: platform_dns_client_backend == 'systemd-resolved'

- name: Проверка разделенной конфигурации NetworkManager DNS
  ansible.builtin.slurp:
    src: /etc/NetworkManager/NetworkManager.conf
  register: _platform_dns_client_nm_config
  failed_when: false
  when: platform_dns_client_backend == 'NetworkManager'

- name: Определение поддержки раздельного DNS в NetworkManager
  ansible.builtin.set_fact:
    platform_dns_client_nm_split_supported: >-
      {{ _platform_dns_client_nm_config.content | default('') | b64decode is search('(?m)^\\s*dns\\s*=\\s*dnsmasq\\s*$') }}
  when: platform_dns_client_backend == 'NetworkManager'
