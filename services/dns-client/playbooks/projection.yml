---
- import_playbook: ../../../ansible-core/playbooks/validate-infrastructure.yml

- name: Расчёт runtime-проекции DNS-клиента без сохранённого служебного состояния
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Загрузка опубликованного каталога сервисов для проекции клиента DNS
      ansible.builtin.include_vars:
        file: "{{ platform_service_catalog_path }}"
        name: _platform_dns_client_catalog_file

    - name: Сбор канонических проекций inventory DNS-клиента
      ansible.builtin.set_fact:
        _platform_dns_client_inventory_hosts: >-
          {{ _platform_dns_client_inventory_hosts | default({}) | combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}
        _platform_dns_client_inventory_deployments: >-
          {{ _platform_dns_client_inventory_deployments | default({}) | combine({item: (hostvars[item].platform_deployments | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      no_log: true

    - name: Расчёт общей проекции DNS
      platform.core.resolve_dns_zones:
        desired_state: "{{ platform_desired_state }}"
        service_catalog: "{{ _platform_dns_client_catalog_file.platform_service_catalog | default(_platform_dns_client_catalog_file, true) }}"
        inventory_hosts: "{{ _platform_dns_client_inventory_hosts }}"
        inventory_deployments: "{{ _platform_dns_client_inventory_deployments }}"
      register: _platform_dns_client_dns

    - name: Инициализация проекции времени выполнения клиента DNS
      ansible.builtin.set_fact:
        platform_dns_client_runtime_projection: {clients: {}}

    - name: Публикация детерминированной проекции времени выполнения клиента DNS
      ansible.builtin.set_fact:
        platform_dns_client_runtime_projection: >-
          {{ platform_dns_client_runtime_projection | combine({'clients': {
               item.key: {
                 'dnsServerRef': _platform_dns_client_dns.dns_client_server_refs[item.key],
                 'managedZone': _platform_dns_client_dns.resolved_dns_zones.zones[_platform_dns_client_dns.dns_client_server_refs[item.key]].zone,
                 'servers': (([_platform_dns_client_dns.resolved_dns_zones.zones[_platform_dns_client_dns.dns_client_server_refs[item.key]].primary] + _platform_dns_client_dns.resolved_dns_zones.zones[_platform_dns_client_dns.dns_client_server_refs[item.key]].secondaries) | map(attribute='address') | list),
                 'hostRecord': _platform_dns_client_dns.resolved_dns_zones.zones[_platform_dns_client_dns.dns_client_server_refs[item.key]].primary.fqdn
               }
             }}, recursive=True) }}
      loop: "{{ platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'dns-client') | list }}"
      loop_control:
        label: "{{ item.key }}"
