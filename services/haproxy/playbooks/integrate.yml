---
- name: Подготовка и проверка кандидата HAProxy для одного источника конечной точки
  hosts: "{{ hostvars['localhost'].platform_service_integration_projection.haproxyHosts | default([]) if hostvars is defined else [] }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: prepare
      platform_haproxy_partial_deployment_id: "{{ hostvars['localhost']._platform_integration_source_id }}"

- name: Активация backend источника после проверки конфигураций на всём кластере
  hosts: "{{ hostvars['localhost'].platform_service_integration_projection.haproxyHosts | default([]) if hostvars is defined else [] }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: activate
      platform_haproxy_partial_deployment_id: "{{ hostvars['localhost']._platform_integration_source_id }}"

- name: Перечитывание конфигурации HAProxy после активации backend-сервиса источника
  hosts: "{{ hostvars['localhost'].platform_service_integration_projection.haproxyHosts | default([]) if hostvars is defined else [] }}"
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: start
      platform_haproxy_partial_deployment_id: "{{ hostvars['localhost']._platform_integration_source_id }}"
