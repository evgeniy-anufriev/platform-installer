---
- import_playbook: ../../../ansible-core/playbooks/validate-infrastructure.yml
- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml
- name: Подготовка и проверка кандидатов HAProxy
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: prepare
- name: Активация HAProxy после проверки подготовленных конфигураций на всём кластере
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: activate
- name: Запуск HAProxy только после активной проверки конфигурации
  hosts: platform_targets
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: platform.haproxy.haproxy
      platform_haproxy_phase: start
