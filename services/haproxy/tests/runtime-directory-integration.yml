---
- name: Выполнение запуска роли HAProxy с отсутствующим каталогом сокетов среды выполнения
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    platform_haproxy_active_artifacts_changed: false
    platform_haproxy_tls_material_changed: false
  tasks:
    - name: "Остановка HAProxy перед проверкой восстановления временного runtime-каталога"
      ansible.builtin.systemd:
        name: haproxy
        state: stopped

    - name: "Удаление временного каталога сокетов HAProxy для регрессионной проверки"
      ansible.builtin.file:
        path: /run/haproxy
        state: absent

    - name: Запуск производственных задач запуска HAProxy
      ansible.builtin.include_role:
        name: platform.haproxy.haproxy
        tasks_from: start.yml

    - name: Проверка каталога сокетов времени выполнения HAProxy
      ansible.builtin.stat:
        path: /run/haproxy
      register: _haproxy_runtime_directory

    - name: Проверка восстановления runtime-каталога HAProxy при запуске
      ansible.builtin.assert:
        that:
          - _haproxy_runtime_directory.stat.isdir
          - _haproxy_runtime_directory.stat.mode == '0755'

    - name: Проверка активности HAProxy после восстановления runtime-каталога
      ansible.builtin.command:
        argv: [systemctl, is-active, --quiet, haproxy]
      changed_when: false

    - name: Проверка настроенного управляющего сокета HAProxy
      ansible.builtin.stat:
        path: /run/haproxy/admin.sock
      register: _haproxy_runtime_socket

    - name: Проверка наличия управляющего сокета HAProxy
      ansible.builtin.assert:
        that: _haproxy_runtime_socket.stat.issock

    - name: Запуск производственных задач проверки HAProxy, доступных только для чтения
      ansible.builtin.include_role:
        name: platform.haproxy.haproxy
        tasks_from: verify.yml
