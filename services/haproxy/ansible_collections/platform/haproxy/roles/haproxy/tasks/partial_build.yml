---
- name: Сброс только временного графа-кандидата HAProxy
  ansible.builtin.file:
    path: "{{ platform_haproxy_candidate_directory }}"
    state: absent
  changed_when: false

- name: Создание временного рабочего каталога конфигурации-кандидата HAProxy
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0750'
  loop: ["{{ platform_haproxy_candidate_directory }}", "{{ platform_haproxy_candidate_directory }}/conf.d"]
  changed_when: false

- name: Подготовка неизменённой конфигурации провайдера для проверки выбранных backend
  ansible.builtin.include_tasks: partial_copy.yml
  when: (platform_haproxy_partial_deployment_id is defined or platform_haproxy_partial_deployment_ids is defined)

- name: Пакетная запись выбранных фрагментов в кандидат HAProxy
  platform.haproxy.fragment_batch:
    directory: "{{ platform_haproxy_candidate_directory }}/conf.d"
    files: "{{ _platform_haproxy_rendered.files }}"
    operation: write
  changed_when: false
  no_log: true

- name: Проверка структурированных глобальных параметров журнала HAProxy
  ansible.builtin.assert:
    that:
      - platform_haproxy_global.log is sequence
      - platform_haproxy_global.log | length > 0
      - item.address is defined and item.address is string and item.address | length > 0
      - item.facility is defined and item.facility in ['kern', 'user', 'mail', 'daemon', 'auth', 'syslog', 'lpr', 'news', 'uucp', 'cron', 'auth2', 'ftp', 'ntp', 'audit', 'alert', 'cron2', 'local0', 'local1', 'local2', 'local3', 'local4', 'local5', 'local6', 'local7']
      - item.level is not defined or item.level in ['emerg', 'alert', 'crit', 'err', 'warning', 'notice', 'info', 'debug']
    fail_msg: HAPROXY_GLOBAL_LOG_INVALID
  loop: "{{ platform_haproxy_global.log }}"

- name: Вычисление детерминированного дайджеста графа-кандидата
  ansible.builtin.shell: >-
    { sha256sum haproxy.cfg; cd conf.d; find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum; } |
    sed 's#  \./#  conf.d/#' | sort |
    sha256sum | awk '{print $1}'
  args:
    chdir: "{{ platform_haproxy_candidate_directory }}"
    executable: /bin/bash
  changed_when: false
  register: _platform_haproxy_candidate_graph_digest

- name: Проверка полного графа-кандидата HAProxy перед активацией кластера
  ansible.builtin.command:
    argv: ["{{ platform_haproxy_binary }}", '-c', '-f', "{{ platform_haproxy_candidate_directory }}/haproxy.cfg", '-f', "{{ platform_haproxy_candidate_directory }}/conf.d"]
  changed_when: false
