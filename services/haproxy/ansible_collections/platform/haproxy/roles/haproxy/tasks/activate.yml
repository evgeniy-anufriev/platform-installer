---
- name: Активация изменённого графа HAProxy
  when: >-
    not ((platform_haproxy_partial_deployment_id is defined or platform_haproxy_partial_deployment_ids is defined)
         and (_platform_haproxy_batch_prepared | default(false) | bool) and (_platform_haproxy_partial_unchanged | default(false) | bool))
  ansible.builtin.include_tasks: activate_changed.yml

- name: Подтверждение неизменённого графа на границе активации кластера
  ansible.builtin.include_tasks: partial_verify_unchanged.yml
  when:
    - platform_haproxy_partial_deployment_id is defined or platform_haproxy_partial_deployment_ids is defined
    - _platform_haproxy_batch_prepared | default(false) | bool
    - _platform_haproxy_partial_unchanged | default(false) | bool
