---
- name: Load published service catalog for HAProxy projection
  ansible.builtin.include_vars:
    file: "{{ platform_service_catalog_path }}"
    name: _platform_haproxy_catalog_file
  run_once: true
  when: platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined

- name: Select the one local HAProxy deployment from canonical desired state
  ansible.builtin.set_fact:
    _platform_haproxy_local_deployments: >-
      {{ platform_desired_state.serviceDeployments | dict2items |
         selectattr('value.serviceType', 'equalto', 'haproxy') |
         selectattr('key', 'in', platform_deployments | default({})) | list }}

- name: Require one local HAProxy deployment for role-variable projection
  ansible.builtin.assert:
    that: _platform_haproxy_local_deployments | length == 1
    fail_msg: HAPROXY_LOCAL_DEPLOYMENT_AMBIGUOUS

- name: Project the configured HAProxy TLS profile for this deployment
  ansible.builtin.set_fact:
    platform_haproxy_tls_profile: >-
      {{ _platform_haproxy_local_deployments[0].value.configuration.tlsProfile |
         default(platform_haproxy_tls_profile, true) }}

- name: Collect safe inventory projection for HAProxy
  ansible.builtin.set_fact:
    _platform_haproxy_hosts: "{{ _platform_haproxy_hosts | default({}) | combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}"
    _platform_haproxy_placements: "{{ _platform_haproxy_placements | default({}) | combine({item: (hostvars[item].platform_deployments | default({}))}) }}"
  loop: "{{ groups['platform_targets'] | default([]) | sort }}"
  run_once: true
  no_log: true
  when: platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined

- name: Resolve generic endpoint projection for HAProxy
  platform.core.resolve_service_endpoints:
    desired_state: "{{ platform_desired_state }}"
    service_catalog: "{{ _platform_haproxy_catalog_file.platform_service_catalog | default(_platform_haproxy_catalog_file, true) }}"
    inventory_deployments: "{{ _platform_haproxy_placements }}"
    deployment_ids: "{{ [platform_haproxy_partial_deployment_id] if platform_haproxy_partial_deployment_id is defined else omit }}"
  register: _platform_haproxy_endpoints
  run_once: true
  when: platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined

- name: Resolve deterministic HAProxy external backends
  platform.core.resolve_haproxy_backends:
    desired_state: "{{ platform_desired_state }}"
    service_catalog: "{{ _platform_haproxy_catalog_file.platform_service_catalog | default(_platform_haproxy_catalog_file, true) }}"
    inventory_hosts: "{{ _platform_haproxy_hosts }}"
    inventory_deployments: "{{ _platform_haproxy_placements }}"
    resolved_service_endpoints: "{{ _platform_haproxy_endpoints.resolved_service_endpoints }}"
    backend_defaults: {}
    target_deployment_ids: "{{ [platform_haproxy_partial_deployment_id] if platform_haproxy_partial_deployment_id is defined else omit }}"
  register: _platform_haproxy_backends
  run_once: true
  when: platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined

- name: Publish HAProxy runtime projection
  ansible.builtin.set_fact:
    platform_haproxy_runtime_projection:
      endpoints: >-
        {{ hostvars[ansible_play_hosts_all | first]._platform_haproxy_endpoints.resolved_service_endpoints
           if (platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined)
           else {'endpoints': {}, 'hostEndpoints': {}, 'findings': [], 'status': 'PASS'} }}
      backends: >-
        {{ hostvars[ansible_play_hosts_all | first]._platform_haproxy_backends.resolved_haproxy_backends
           if (platform_haproxy_full_reconcile | bool or platform_haproxy_partial_deployment_id is defined)
           else {'backends': {}, 'findings': [], 'status': 'PASS'} }}
