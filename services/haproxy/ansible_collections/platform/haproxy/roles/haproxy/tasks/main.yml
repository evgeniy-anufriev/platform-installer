---
- name: Validate portable service resource settings
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Require valid HAProxy phase and canonical desired state
  ansible.builtin.assert:
    that:
      - platform_haproxy_phase in ['prepare', 'activate', 'start', 'verify']
      - platform_desired_state is mapping
      - platform_deployments | default({}) is mapping
      - platform_haproxy_partial_deployment_id is not defined or platform_haproxy_partial_deployment_id is match('^[a-z0-9][a-z0-9-]{0,126}[a-z0-9]$')
    fail_msg: HAPROXY_DESIRED_STATE_INVALID

- name: Run HAProxy lifecycle only on participating hosts
  ansible.builtin.include_tasks: lifecycle.yml
  when: (platform_desired_state.serviceDeployments | dict2items | selectattr('value.serviceType', 'equalto', 'haproxy') | selectattr('key', 'in', platform_deployments | default({})) | list | length) > 0
