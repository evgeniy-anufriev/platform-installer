---
- name: Выбор полного списка сохраняемых фрагментов для частичного кандидата
  ansible.builtin.set_fact:
    _platform_haproxy_partial_copy_names: >-
      {{ (['10-public.cfg', '20-local-stats.cfg', '90-stats-backends.cfg']
          + (_platform_haproxy_prior_backend_capture.previousInventory | default([])
             | map(attribute='name') | reject('in', _platform_haproxy_partial_source_files | default([])) | list)
          + (_platform_haproxy_third_party_fragments.files | default([])
             | map(attribute='path') | map('basename') | list)) | unique | sort }}

- name: Пакетное копирование сохраняемых фрагментов в кандидат HAProxy
  ansible.builtin.copy:
    src: "{{ platform_haproxy_conf_directory }}/"
    dest: "{{ platform_haproxy_candidate_directory }}/conf.d/"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  changed_when: false

- name: Получение состава скопированного каталога кандидата HAProxy
  ansible.builtin.find:
    paths: "{{ platform_haproxy_candidate_directory }}/conf.d"
    file_type: any
    hidden: true
    recurse: false
  register: _platform_haproxy_partial_copied

- name: Исключение файлов вне сохраняемого состава кандидата HAProxy
  ansible.builtin.file:
    path: "{{ platform_haproxy_candidate_directory }}/conf.d/{{ item }}"
    state: absent
  loop: >-
    {{ _platform_haproxy_partial_copied.files | map(attribute='path') | map('basename')
       | difference(_platform_haproxy_partial_copy_names) | sort }}
  changed_when: false

- name: Копирование основной конфигурации в частичный кандидат HAProxy
  ansible.builtin.copy:
    src: "{{ platform_haproxy_main_config }}"
    dest: "{{ platform_haproxy_candidate_directory }}/haproxy.cfg"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  changed_when: false
