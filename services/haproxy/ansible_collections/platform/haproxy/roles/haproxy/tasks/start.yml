---
- name: Создание каталога HAProxy systemd
  ansible.builtin.file:
    path: "{{ platform_haproxy_systemd_dropin_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: (platform_haproxy_partial_deployment_id is not defined and platform_haproxy_partial_deployment_ids is not defined)

- name: Проверка того, что systemd создает каталог сокетов времени выполнения HAProxy
  ansible.builtin.template:
    src: haproxy-runtime-directory.conf.j2
    dest: "{{ platform_haproxy_systemd_dropin_directory }}/{{ platform_haproxy_systemd_dropin_filename }}"
    owner: root
    group: root
    mode: '0644'
  register: _platform_haproxy_runtime_dropin
  when: (platform_haproxy_partial_deployment_id is not defined and platform_haproxy_partial_deployment_ids is not defined)

- name: Запуск HAProxy или перезапуск при изменении конфигурации, TLS или настроек systemd
  ansible.builtin.systemd:
    name: "{{ platform_haproxy_service_name }}"
    daemon_reload: true
    state: >-
      {{ 'restarted' if ((platform_haproxy_active_artifacts_changed | default(false) | bool) or
                         (platform_haproxy_tls_material_changed | default(false) | bool) or
                         (_platform_haproxy_runtime_dropin.changed | default(false) | bool)) else 'started' }}
    enabled: true
  when: (platform_haproxy_partial_deployment_id is not defined and platform_haproxy_partial_deployment_ids is not defined)

- name: Перечитывание конфигурации HAProxy после изменения выбранных backend-сервисов
  ansible.builtin.systemd:
    name: "{{ platform_haproxy_service_name }}"
    state: reloaded
  when:
    - (platform_haproxy_partial_deployment_id is defined or platform_haproxy_partial_deployment_ids is defined)
    - platform_haproxy_active_artifacts_changed | default(false) | bool
