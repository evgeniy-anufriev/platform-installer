---
- name: Create HAProxy systemd drop-in directory
  ansible.builtin.file:
    path: "{{ platform_haproxy_systemd_dropin_directory }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: platform_haproxy_partial_deployment_id is not defined

- name: Ensure systemd creates the HAProxy runtime socket directory
  ansible.builtin.template:
    src: haproxy-runtime-directory.conf.j2
    dest: "{{ platform_haproxy_systemd_dropin_directory }}/{{ platform_haproxy_systemd_dropin_filename }}"
    owner: root
    group: root
    mode: '0644'
  register: _platform_haproxy_runtime_dropin
  when: platform_haproxy_partial_deployment_id is not defined

- name: Start or reload validated HAProxy service
  ansible.builtin.systemd_service:
    name: "{{ platform_haproxy_service_name }}"
    daemon_reload: true
    state: >-
      {{ 'restarted' if ((platform_haproxy_active_artifacts_changed | default(false) | bool) or
                         (platform_haproxy_tls_material_changed | default(false) | bool) or
                         (_platform_haproxy_runtime_dropin.changed | default(false) | bool)) else 'started' }}
    enabled: true
  when: platform_haproxy_partial_deployment_id is not defined

- name: Reload existing HAProxy only after a changed partial backend graph
  ansible.builtin.systemd_service:
    name: "{{ platform_haproxy_service_name }}"
    state: reloaded
  when:
    - platform_haproxy_partial_deployment_id is defined
    - platform_haproxy_active_artifacts_changed | default(false) | bool
