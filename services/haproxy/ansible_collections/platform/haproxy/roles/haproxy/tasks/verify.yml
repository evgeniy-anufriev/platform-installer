---
- name: "Проверка активности службы HAProxy без внесения изменений"
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ platform_haproxy_service_name }}"]
  changed_when: false

- name: Проверка прослушивания публичного порта и порта статистики HAProxy
  ansible.builtin.command:
    argv: [ss, -H, -ltn, "sport = :{{ item }}"]
  loop: "{{ [platform_haproxy_public_port, platform_haproxy_internal_stats_port] | unique | list }}"
  changed_when: false
  register: _platform_haproxy_listener
  failed_when: _platform_haproxy_listener.rc != 0 or not (_platform_haproxy_listener.stdout | trim)
