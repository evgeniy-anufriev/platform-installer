---
- name: Проверка пакета HAProxy и активной конфигурации, доступной только для чтения
  ansible.builtin.command:
    argv: ["{{ platform_haproxy_binary }}", '-c', '-f', "{{ platform_haproxy_main_config }}", '-f', "{{ platform_haproxy_conf_directory }}"]
  changed_when: false

- name: "Проверить активность службы HAProxy без внесения изменений"
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ platform_haproxy_service_name }}"]
  changed_when: false

- name: Проверить публичный и локальный порты статистики HAProxy без изменений
  ansible.builtin.command:
    argv: [ss, -ltn]
  changed_when: false
  register: _platform_haproxy_listeners

- name: Проверить наличие публичного и локального портов статистики HAProxy
  ansible.builtin.assert:
    that:
      - "':' ~ (platform_haproxy_public_port | string) in _platform_haproxy_listeners.stdout"
      - "':' ~ (platform_haproxy_internal_stats_port | string) in _platform_haproxy_listeners.stdout"
    fail_msg: HAPROXY_LISTENER_VERIFICATION_FAILED
