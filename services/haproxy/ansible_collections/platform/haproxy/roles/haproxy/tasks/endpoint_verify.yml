---
- name: Resolve the same backend model for read-only endpoint verification
  ansible.builtin.include_tasks: resolve.yml

- name: Select this source's backends on this provider host
  ansible.builtin.set_fact:
    platform_haproxy_application_backends: >-
      {{ platform_haproxy_runtime_projection.backends.backends | dict2items |
         selectattr('key', 'in', platform_deployments) | map(attribute='value') |
         flatten | selectattr('targetDeploymentId', 'in', _platform_haproxy_partial_ids) |
         selectattr('providerHostIds', 'contains', inventory_hostname) | list }}

- name: Check selected backend targets read-only
  ansible.builtin.include_tasks: check_targets.yml

- name: Verify the existing HAProxy service and configuration
  ansible.builtin.include_tasks: verify.yml
