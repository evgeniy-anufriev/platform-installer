---
- name: "Расчёт той же модели backend-сервисов для проверки конечной точки без изменений"
  ansible.builtin.include_tasks: resolve.yml

- name: Выбор backend-сервисов источника интеграции на узле провайдера
  ansible.builtin.set_fact:
    platform_haproxy_application_backends: >-
      {{ platform_haproxy_runtime_projection.backends.backends | dict2items |
         selectattr('key', 'in', platform_deployments) | map(attribute='value') |
         flatten | selectattr('targetDeploymentId', 'in', _platform_haproxy_partial_ids) |
         selectattr('providerHostIds', 'contains', inventory_hostname) | list }}

- name: Проверка выбранных серверных целей только для чтения
  ansible.builtin.include_tasks: check_targets.yml

- name: Проверка синтаксиса активной конфигурации HAProxy
  ansible.builtin.command:
    argv: ["{{ platform_haproxy_binary }}", '-c', '-f', "{{ platform_haproxy_main_config }}", '-f', "{{ platform_haproxy_conf_directory }}"]
  changed_when: false

- name: Проверка существующей службы и портов HAProxy
  ansible.builtin.include_tasks: verify.yml

- name: Проверка TCP-маршрутов активного HAProxy
  ansible.builtin.include_tasks: check_tcp_listeners.yml
  when: platform_haproxy_application_backends | selectattr('tcp', 'defined') | list | length > 0
