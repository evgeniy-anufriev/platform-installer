---
- name: Request HTTP backend without exposing response or request metadata
  ansible.builtin.uri:
    url: "http://{{ _platform_http_target.1.address }}:{{ _platform_http_target.1.port }}{{ _platform_http_target.0.probe.path }}"
    headers:
      Host: "{{ _platform_http_target.0.endpoint.fqdn }}"
    status_code: "{{ _platform_http_target.0.probe.expected_status }}"
    timeout: "{{ _platform_http_target.0.probe.timeout }}"
    validate_certs: true
    follow_redirects: none
    return_content: false
  register: _platform_http_response
  changed_when: false
  failed_when: false
  no_log: true

- name: Require the expected HTTP backend response
  ansible.builtin.assert:
    that:
      - _platform_http_response.status | default(-1) | int == _platform_http_target.0.probe.expected_status | int
    success_msg: "{{ _platform_http_diagnostic }}"
    fail_msg: "{{ _platform_http_diagnostic }}"
  vars:
    # Only host/port, numbers and a closed reason vocabulary are public.
    _platform_http_address: "{{ _platform_http_target.1.address if _platform_http_target.1.address is match('^[A-Za-z0-9.:\\[\\]-]{1,253}$') else '<invalid>' }}"
    _platform_http_reason: >-
      {{ 'OK' if _platform_http_response.status | default(-1) | int == _platform_http_target.0.probe.expected_status | int
         else 'HTTP_STATUS_MISMATCH' if _platform_http_response.status | default(-1) | int >= 100
         else 'TIMEOUT' if _platform_http_response.msg | default('') is search('(?i)timed out|timeout')
         else 'CONNECTION_REFUSED' if _platform_http_response.msg | default('') is search('(?i)connection refused')
         else 'DNS_FAILURE' if _platform_http_response.msg | default('') is search('(?i)name or service not known|temporary failure in name resolution|nodename nor servname')
         else 'NETWORK_FAILURE' if _platform_http_response.msg | default('') is search('(?i)no route to host|network is unreachable|connection reset|connection closed')
         else 'REQUEST_FAILED' }}
    _platform_http_diagnostic: >-
      HTTP backend {{ _platform_http_address }}:{{ _platform_http_target.1.port | int }}; expected={{ _platform_http_target.0.probe.expected_status | int }}; actual={{ _platform_http_response.status | default(-1) | int }}; timeout={{ _platform_http_target.0.probe.timeout | int }}s; reason={{ _platform_http_reason }}
  tags: [platform_http_backend_diagnostic]
