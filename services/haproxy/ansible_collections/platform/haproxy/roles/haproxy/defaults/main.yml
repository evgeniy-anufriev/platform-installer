platform_haproxy_package: haproxy
platform_haproxy_service_name: haproxy
platform_haproxy_binary: /usr/sbin/haproxy
platform_haproxy_config_directory: /etc/haproxy
platform_haproxy_main_config: /etc/haproxy/haproxy.cfg
platform_haproxy_candidate_directory: /etc/haproxy/.platform-candidate
platform_haproxy_conf_directory: /etc/haproxy/conf.d
platform_haproxy_pki_directory: /etc/haproxy/pki
platform_haproxy_tls_profile: platform-tls
platform_haproxy_public_port: 443
platform_haproxy_internal_stats_port: 8404
platform_haproxy_runtime_socket_path: /run/haproxy/admin.sock
platform_haproxy_global:
  log:
    - {address: 127.0.0.1, facility: local2}
  maxconn: 4096
platform_haproxy_defaults: {mode: http, timeout_connect: 5s, timeout_client: 30s, timeout_server: 30s}
platform_haproxy_stats_backend_defaults: {balance: roundrobin, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
platform_haproxy_phase: prepare
