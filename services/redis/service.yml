apiVersion: platform.installer/service-manifest/v1alpha1
kind: ServiceManifest
metadata:
  id: redis
  version: "1.0.0-alpha.1"
  displayName: Redis
  description: Redis with TLS-only standalone and Sentinel high-availability modes
  category: database
modes:
  standalone:
    displayName: Standalone
    description: One TLS-only Redis member
    memberRoles: [redis]
    placement:
      explicit: true
      minMembers: 1
      maxMembers: 1
      distinctHosts: false
      roleCardinality:
        redis: {minimum: 1, maximum: 1}
    x-requiredRuntimeSecretSettings: [redisCredential]
  sentinel-ha:
    displayName: Redis Sentinel HA
    description: Three paired Redis and Sentinel members; members may share a host
    memberRoles: [redis, sentinel]
    placement:
      explicit: true
      minMembers: 3
      maxMembers: 3
      distinctHosts: false
      roleCardinality:
        redis: {minimum: 3, maximum: 3}
        sentinel: {minimum: 3, maximum: 3}
    x-requiredRuntimeSecretSettings: [redisCredential, sentinelCredential]
listeners:
  client: {protocol: tcp, defaultPort: 6379, tlsCapable: true, scope: member}
  sentinel: {protocol: tcp, defaultPort: 26379, tlsCapable: true, scope: member}
endpoint: {}
x-haproxyBackendDefaults: {balance: roundrobin, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
capabilities: [service.redis.client, service.redis.sentinel, service.redis.account, service.redis.sentinel.account]
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    tlsProfile: {kind: MANAGED, roleVariable: platform_redis_tls_profile, type: string, scopes: [deployment], validation: {minLength: 1}, ui: {label: Redis TLS profile, section: TLS, order: 10, x-referenceKind: TLS_PROFILE}}
    redisPort: {kind: MANAGED, roleVariable: platform_redis_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Redis TLS base port, section: Network, order: 20}}
    sentinelPort: {kind: MANAGED, roleVariable: platform_redis_sentinel_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Sentinel TLS base port, section: Network, order: 21}}
    dataRoot: {kind: MANAGED, roleVariable: platform_redis_data_root, type: string, scopes: [deployment], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных, section: Хранение, order: 0, description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких участников на одном сервере создаются отдельные подкаталоги. Существующие данные автоматически не переносятся.}}
    dataDirectory: {kind: MANAGED, roleVariable: platform_redis_member_data_directory, type: string, scopes: [member], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных участника, section: Хранение, order: 0, description: Абсолютный путь на сервере; переопределяет каталог данных только этого участника.}}
    redisCredential:
      kind: MANAGED
      roleVariable: platform_redis_credential
      type: object
      scopes: [deployment]
      validation: {required: [passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [passwordSecretRef]
        properties:
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Redis password, section: Credentials, order: 40, x-runtimeSecretRequirement: {requirementRef: redis-password, purpose: SERVICE_PASSWORD}}
    sentinelCredential:
      kind: MANAGED
      roleVariable: platform_redis_sentinel_credential
      type: object
      scopes: [deployment]
      validation: {required: [passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [passwordSecretRef]
        properties:
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Sentinel password, section: Credentials, order: 41, x-runtimeSecretRequirement: {requirementRef: redis-sentinel-password, purpose: SERVICE_PASSWORD}}
    advancedConfig: {kind: ADVANCED, roleVariable: platform_redis_advanced_config, type: object, scopes: [deployment], validation: {additionalProperties: true}, ui: {label: Advanced Redis settings, section: Advanced, order: 90}}
x-reservedAdvancedProperties: [port, tls-port, tls-cert-file, tls-key-file, tls-ca-cert-file, requirepass, masterauth, sentinel, dir, pidfile, logfile]
x-memberDataDirectorySetting: dataDirectory
x-dataDirectoryProjection: {deploymentSetting: dataRoot, memberSetting: dataDirectory, rootVariable: platform_data_root_directory, appendMemberIdWhenCoLocated: true}
roleEntrypoints:
  apply: {fqcn: platform.redis.redis_tls, variablesPrefix: platform_redis_, x-memberListVariable: platform_redis_instances}
  verify: {fqcn: platform.redis.redis_tls, variablesPrefix: platform_redis_, x-memberListVariable: platform_redis_instances}
artifacts: []
runtimeRequirements:
  - id: redis-runtime
    name: redis
    version: "8.6.4"
    os: redos
    architecture: x86_64
    requiredOffline: false
compatibilityRef: compatibility.yml
