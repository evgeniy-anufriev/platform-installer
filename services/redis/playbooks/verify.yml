---
- import_playbook: ../../../ansible-core/playbooks/pki-resolve.yml

- name: Проверка экземпляров Redis с TLS без изменений
  hosts: platform_targets
  become: true
  gather_facts: false
  pre_tasks:
    - name: Применение конфигурации доверенной среды выполнения Redis
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.redis.redis_tls
      platform_redis_verify_only: true
