---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Apply Redis TLS members
  hosts: platform_targets
  become: true
  gather_facts: true
  pre_tasks:
    - name: Apply trusted runtime Redis configuration
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
  roles:
    - role: platform.redis.redis_tls
      platform_redis_verify_only: false
