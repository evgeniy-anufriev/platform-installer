---
- import_playbook: ../../../ansible-core/playbooks/validate-infrastructure.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Применение экземпляров службы Redis TLS
  hosts: platform_targets
  become: true
  gather_facts: true
  pre_tasks:
    - name: Применение конфигурации доверенной среды выполнения Redis
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.redis.redis_tls
      platform_redis_verify_only: false

- import_playbook: ../../integrations/playbooks/apply-endpoint.yml
