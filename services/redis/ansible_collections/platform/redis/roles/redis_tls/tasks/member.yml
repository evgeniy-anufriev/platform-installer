---
- name: Создание путей к экземпляру службы Redis
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ platform_redis_user }}"
    group: "{{ platform_redis_group }}"
    mode: '0700'
  loop:
    - "{{ redis_member.data_directory }}"
    - "{{ redis_member.data_directory }}/sentinel"
    - "{{ redis_member.config_directory }}"
    - "{{ redis_member.log_directory }}"

- name: Создание каталога экземпляра службы Redis TLS
  ansible.builtin.file:
    path: "{{ redis_member.config_directory }}/pki"
    state: directory
    owner: "{{ platform_redis_user }}"
    group: "{{ platform_redis_group }}"
    mode: '0700'

- name: Подготовка файлов экземпляра Redis TLS
  ansible.builtin.copy:
    src: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item.name }}"
    dest: "{{ redis_member.config_directory }}/pki/{{ item.name }}"
    remote_src: true
    owner: "{{ platform_redis_user }}"
    group: "{{ platform_redis_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: ca-chain.pem, mode: '0644'}
    - {name: certificate.pem, mode: '0644'}
    - {name: private-key.pem, mode: '0600'}
  no_log: true
  register: _platform_redis_tls_copy

- name: Формирование конфигурации Redis с поддержкой только TLS
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_member.config_directory }}/redis.conf"
    owner: "{{ platform_redis_user }}"
    group: "{{ platform_redis_group }}"
    mode: '0600'
  no_log: true
  register: _platform_redis_config
  when: not _platform_redis_has_persistent_state

- name: Подготовка файлов ACL пользователя по умолчанию без замены существующих пользователей
  ansible.builtin.include_tasks: acl_files.yml

- name: Подключение файла Redis ACL без перезаписи сохраненного состояния репликации
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/redis.conf"
    regexp: '^\s*aclfile\s+'
    line: "aclfile {{ redis_member.config_directory }}/redis.users.acl"
  register: _platform_redis_acl_config
  no_log: true

- name: Удаление устаревшего requirepass Redis после прикрепления хешированного ACL
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/redis.conf"
    regexp: '^\s*requirepass\s+'
    state: absent
  register: _platform_redis_acl_legacy_password
  no_log: true

- name: "Формирование службы systemd для экземпляра Redis"
  ansible.builtin.template:
    src: redis.service.j2
    dest: "/etc/systemd/system/{{ platform_redis_name }}@{{ redis_member.instance_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: _platform_redis_unit

- name: "Создание начальной конфигурации нового Sentinel с поддержкой только TLS"
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: "{{ redis_member.config_directory }}/sentinel.conf"
    owner: "{{ platform_redis_user }}"
    group: "{{ platform_redis_group }}"
    mode: '0600'
  no_log: true
  register: _platform_sentinel_config
  when:
    - "'sentinel' in redis_member.roles"
    - not _platform_redis_has_persistent_state

- name: "Формирование службы systemd для экземпляра Sentinel"
  ansible.builtin.template:
    src: sentinel.service.j2
    dest: "/etc/systemd/system/{{ platform_redis_name }}-sentinel@{{ redis_member.instance_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: _platform_sentinel_unit
  when: "'sentinel' in redis_member.roles"

- name: "Подключение ACL-файла Sentinel, сохранив сведения о выбранном мастере"
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/sentinel.conf"
    regexp: '^\s*aclfile\s+'
    line: "aclfile {{ redis_member.config_directory }}/sentinel.users.acl"
  register: _platform_sentinel_acl_config
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: "Удаление устаревшей директивы requirepass Sentinel после подключения ACL с хешами паролей"
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/sentinel.conf"
    regexp: '^\s*requirepass\s+'
    state: absent
  register: _platform_sentinel_acl_legacy_password
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: Настройка одноранговой аутентификации Sentinel для пользователя ACL по умолчанию
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/sentinel.conf"
    regexp: '^sentinel sentinel-user\s+'
    line: 'sentinel sentinel-user default'
  register: _platform_sentinel_peer_user
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: Настройка пароля узла Sentinel из секрета времени выполнения
  ansible.builtin.lineinfile:
    path: "{{ redis_member.config_directory }}/sentinel.conf"
    regexp: '^sentinel sentinel-pass\s+'
    line: "sentinel sentinel-pass {{ lookup('ansible.builtin.file', platform_redis_secret_files[platform_redis_sentinel_credential.passwordSecretRef]) | to_json }}"
  register: _platform_sentinel_peer_password
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: "Перечитывание unit-файлов systemd после обновления служб Redis"
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    _platform_redis_unit.changed or
    (_platform_sentinel_unit.changed | default(false))

- name: Включение и запуск экземпляра службы Redis
  ansible.builtin.systemd:
    name: "{{ platform_redis_name }}@{{ redis_member.instance_name }}.service"
    enabled: true
    state: restarted
  when: _platform_redis_config.changed or _platform_redis_acl_config.changed or _platform_redis_acl_file.changed or _platform_redis_acl_legacy_password.changed or _platform_redis_tls_copy.changed or _platform_redis_unit.changed

- name: Запуск неизмененного экземпляра службы Redis
  ansible.builtin.systemd:
    name: "{{ platform_redis_name }}@{{ redis_member.instance_name }}.service"
    enabled: true
    state: started
  when: not (_platform_redis_config.changed or _platform_redis_acl_config.changed or _platform_redis_acl_legacy_password.changed or _platform_redis_tls_copy.changed or _platform_redis_unit.changed)

- name: Включение и запуск экземпляра службы Sentinel
  ansible.builtin.systemd:
    name: "{{ platform_redis_name }}-sentinel@{{ redis_member.instance_name }}.service"
    enabled: true
    state: restarted
  when:
    - "'sentinel' in redis_member.roles"
    - _platform_sentinel_config.changed or _platform_sentinel_acl_config.changed or _platform_redis_acl_file.changed or _platform_sentinel_acl_legacy_password.changed or _platform_sentinel_peer_user.changed or _platform_sentinel_peer_password.changed or _platform_redis_tls_copy.changed or (_platform_sentinel_unit.changed | default(false))

- name: Запуск неизмененного экземпляра службы Sentinel
  ansible.builtin.systemd:
    name: "{{ platform_redis_name }}-sentinel@{{ redis_member.instance_name }}.service"
    enabled: true
    state: started
  when:
    - "'sentinel' in redis_member.roles"
    - not (_platform_sentinel_config.changed or _platform_sentinel_acl_config.changed or _platform_redis_acl_file.changed or _platform_sentinel_acl_legacy_password.changed or _platform_sentinel_peer_user.changed or _platform_sentinel_peer_password.changed or _platform_redis_tls_copy.changed or (_platform_sentinel_unit.changed | default(false)))
