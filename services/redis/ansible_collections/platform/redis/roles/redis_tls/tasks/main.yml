---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Проверка разрешенного источника артефакта Redis перед изменением
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: redis-runtime, name: redis}
  when:
    - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
    - not (platform_redis_verify_only | bool)

- name: Проверка входных данных Redis и топологии экземпляра
  ansible.builtin.include_tasks: validate.yml

- name: Нормализация экземпляров службы Redis в стабильные слоты развертывания
  ansible.builtin.include_tasks: normalize.yml

- name: Проверка владения предоставляемыми пакетом системными службами systemd Redis
  ansible.builtin.include_tasks: package_preflight.yml
  when: not (platform_redis_verify_only | bool)

- name: "Формирование списка локальных экземпляров Redis"
  ansible.builtin.set_fact:
    _platform_redis_local_instances: >-
      {{ _platform_redis_instances | selectattr('host', 'equalto', inventory_hostname) | list }}

- name: Отклонение перекрывающихся локальных путей данных Redis
  ansible.builtin.include_tasks: validate_data_paths.yml

- name: Защита локальных путей к данным Redis перед изменением
  ansible.builtin.include_role:
    name: platform.core.managed_data_path_guard
  vars:
    platform_managed_data_path: "{{ platform_managed_data_path_instance.data_directory }}"
    platform_managed_data_owner: "{{ platform_redis_user }}"
    platform_managed_data_root_directory: "{{ platform_data_root_directory | default('/var/lib') }}"
    platform_managed_data_root_owner: "{{ ansible_user | default('') }}"
    platform_managed_data_root_verify_only: "{{ platform_redis_verify_only | bool }}"
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    loop_var: platform_managed_data_path_instance
    label: "{{ platform_managed_data_path_instance.id }}"

- name: Проверка принадлежности локального порта Redis перед изменением
  ansible.builtin.include_tasks: preflight.yml
  when: not (platform_redis_verify_only | bool)

- name: Выбор TLS-файлов Redis
  ansible.builtin.include_tasks: resolve_tls.yml

- name: Установка утвержденного пакета Redis из настроенного репозитория
  ansible.builtin.package:
    name: "redis-{{ platform_redis_version }}"
    state: present
  when:
    - not (platform_redis_verify_only | bool)
    - platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['redis-runtime'].source == 'REPOSITORY'

- name: Отключение штатных служб Redis при первой установке пакета
  ansible.builtin.include_tasks: package_units.yml
  when:
    - not (platform_redis_verify_only | bool)
    - _platform_redis_package_absent_before_apply

- name: Настройка локальных экземпляров службы Redis
  ansible.builtin.include_tasks: member.yml
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    loop_var: redis_member
    label: "{{ redis_member.id }}"
  when: not (platform_redis_verify_only | bool)

- name: Инициализация локальных проверочных наблюдений Redis
  ansible.builtin.set_fact:
    _platform_redis_observed_members: []
    _platform_redis_observed_sentinel_masters: []
  when: _platform_redis_local_instances | length > 0

- name: Проверка локальных Redis и Sentinel перед фиксацией состояния начальной загрузки
  ansible.builtin.include_tasks: verify.yml
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    loop_var: redis_member
    label: "{{ redis_member.id }}"
  when: not (platform_redis_verify_only | bool)

- name: "Проверка репликации Redis и согласованности данных Sentinel во всём развёртывании"
  ansible.builtin.include_tasks: verify_deployment.yml
  when:
    - not (platform_redis_verify_only | bool)
    - _platform_redis_local_instances | length > 0

- name: Завершение нового состояния начальной загрузки развертывания Redis
  ansible.builtin.include_tasks: finalize_bootstrap.yml
  when:
    - not (platform_redis_verify_only | bool)
    - not _platform_redis_has_persistent_state

- name: Проверка локальных Redis и Sentinel без изменений
  ansible.builtin.include_tasks: verify.yml
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    loop_var: redis_member
    label: "{{ redis_member.id }}"
  when: platform_redis_verify_only | bool

- name: Проверка репликации Redis и согласованности Sentinel без внесения изменений
  ansible.builtin.include_tasks: verify_deployment.yml
  when:
    - platform_redis_verify_only | bool
    - _platform_redis_local_instances | length > 0
