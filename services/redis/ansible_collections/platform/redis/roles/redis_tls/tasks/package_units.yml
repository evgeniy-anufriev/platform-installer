---
- name: Отключить службу по умолчанию Redis, предоставляемую пакетом
  ansible.builtin.systemd:
    name: redis.service
    enabled: false
    state: stopped
    daemon_reload: true

- name: Отключить службу по умолчанию Sentinel, предоставляемую пакетом
  ansible.builtin.systemd:
    name: redis-sentinel.service
    enabled: false
    state: stopped
    daemon_reload: true
