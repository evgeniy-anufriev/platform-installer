---
- name: Отключение штатной службы Redis из пакета
  ansible.builtin.systemd:
    name: redis.service
    enabled: false
    state: stopped
    daemon_reload: true

- name: Отключение штатной службы Sentinel из пакета
  ansible.builtin.systemd:
    name: redis-sentinel.service
    enabled: false
    state: stopped
    daemon_reload: true
