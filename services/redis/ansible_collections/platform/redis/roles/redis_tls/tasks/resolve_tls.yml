---
- name: Выбор действующего плана PKI для Redis TLS
  ansible.builtin.include_role:
    name: platform.core.pki_materialize
    tasks_from: select_consumer_plan.yml
  vars:
    platform_pki_consumer_tls_profile_id: "{{ platform_redis_tls_profile }}"

- name: Проверка подготовленных TLS-файлов Redis
  ansible.builtin.stat:
    path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  register: _platform_redis_tls_inputs
  when: not (platform_redis_verify_only | bool)

- name: Проверка наличия всех подготовленных TLS-файлов Redis
  ansible.builtin.assert:
    that: _platform_redis_tls_inputs.results | map(attribute='stat.exists') | list | min
    fail_msg: REDIS_PKI_MATERIALIZATION_REQUIRED
  when: not (platform_redis_verify_only | bool)
