---
# A listener may be reused only by the exact already-active instance that this
# role owns. This makes repeat apply idempotent while refusing an unrelated
# daemon or stale former member before any config/unit is changed.
- name: Проверка точных путей к службе systemd экземпляра службы Redis перед рендерингом
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ platform_redis_name }}@{{ item.instance_name }}.service"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_redis_unit_path_stats
  loop: "{{ _platform_redis_local_instances }}"

- name: Отклонить небезопасные существующие пути службы systemd экземпляра службы Redis
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or
      (item.stat.isreg | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: REDIS_UNIT_PATH_UNSAFE
  loop: "{{ _platform_redis_unit_path_stats.results }}"
  loop_control:
    label: "{{ item.item.id }}"

- name: Прочитать заголовки владения из существующих системных служб экземпляра службы Redis
  ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ platform_redis_name }}@{{ item.item.instance_name }}.service"
  register: _platform_redis_existing_unit_headers
  loop: "{{ _platform_redis_unit_path_stats.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item.id }}"

- name: Отказаться от замены неуправляемых сервисов экземпляра службы Redis systemd
  ansible.builtin.assert:
    that: >-
      (item.content | b64decode | split('\n') | first)
      == ('# ' ~ platform_redis_name ~ '-managed: ' ~ platform_redis_deployment_id ~ '/' ~ item.item.item.id ~ '/redis')
    fail_msg: REDIS_UNIT_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_redis_existing_unit_headers.results | default([]) }}"
  when: not (item.skipped | default(false))
  loop_control:
    label: "{{ item.item.item.id }}"

- name: Проверка точных путей к сервису systemd Sentinel перед рендерингом
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ platform_redis_name }}-sentinel@{{ item.instance_name }}.service"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_sentinel_unit_path_stats
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"

- name: Отклонить небезопасные существующие пути службы systemd Sentinel
  ansible.builtin.assert:
    that: >-
      not item.stat.exists or
      (item.stat.isreg | default(false) and not (item.stat.islnk | default(false)))
    fail_msg: REDIS_UNIT_PATH_UNSAFE
  loop: "{{ _platform_sentinel_unit_path_stats.results }}"
  loop_control:
    label: "{{ item.item.id }}"

- name: Прочитать заголовки владения из существующих системных служб Sentinel
  ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ platform_redis_name }}-sentinel@{{ item.item.instance_name }}.service"
  register: _platform_sentinel_existing_unit_headers
  loop: "{{ _platform_sentinel_unit_path_stats.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item.id }}"

- name: Отказаться от замены неуправляемых системных служб Sentinel
  ansible.builtin.assert:
    that: >-
      (item.content | b64decode | split('\n') | first)
      == ('# ' ~ platform_redis_name ~ '-managed: ' ~ platform_redis_deployment_id ~ '/' ~ item.item.item.id ~ '/sentinel')
    fail_msg: REDIS_UNIT_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_sentinel_existing_unit_headers.results | default([]) }}"
  when: not (item.skipped | default(false))
  loop_control:
    label: "{{ item.item.item.id }}"

- name: Проверка служебных файлов systemd Redis и Sentinel на уровне экземпляра предыдущей службы
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: >-
    {{ (_platform_redis_local_instances
        | map(attribute='legacy_instance_name')
        | map('regex_replace', '^', platform_redis_name ~ '@')
        | map('regex_replace', '$', '.service') | list)
       + (_platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel')
          | map(attribute='legacy_instance_name')
          | map('regex_replace', '^', platform_redis_name ~ '-sentinel@')
          | map('regex_replace', '$', '.service') | list) }}
  register: _platform_redis_legacy_unit_files

- name: Отказаться от автоматического принятия предыдущих имен системных служб Redis
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: REDIS_LEGACY_UNIT_REQUIRES_S11_CLEANUP
  loop: "{{ _platform_redis_legacy_unit_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Проверка существующего маркера состояния экземпляра службы Redis
  ansible.builtin.stat:
    path: "{{ item.data_directory }}/.{{ platform_redis_name }}-mode"
    get_mime: false
    get_attributes: false
    get_checksum: false
  changed_when: false
  register: _platform_redis_mode_marker
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    label: "redis:{{ item.instance_name }}"

- name: Проверка существующих каталогов данных Redis
  ansible.builtin.stat:
    path: "{{ item.data_directory }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  changed_when: false
  register: _platform_redis_data_directory
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    label: "redis:{{ item.instance_name }}"

- name: Обнаружение непустых каталогов данных Redis без маркера состояния
  ansible.builtin.command:
    argv:
      - find
      - "{{ item.data_directory }}"
      - -mindepth
      - '1'
      - -maxdepth
      - '1'
      - -print
      - -quit
  changed_when: false
  register: _platform_redis_data_first_entry
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_data_index
    label: "redis:{{ item.instance_name }}"
  when: _platform_redis_data_directory.results[redis_data_index].stat.exists

- name: Отклонить бесхозное существующее постоянное состояние Redis
  ansible.builtin.assert:
    that: >-
      (not _platform_redis_data_directory.results[redis_data_index].stat.exists)
      or _platform_redis_mode_marker.results[redis_data_index].stat.exists
      or (_platform_redis_data_first_entry.results[redis_data_index].stdout | trim | length == 0)
    fail_msg: REDIS_EXISTING_STATE_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_data_index
    label: "redis:{{ item.instance_name }}"

- name: Проверка существующих файлов конфигурации Redis
  ansible.builtin.stat:
    path: "{{ item.config_directory }}/redis.conf"
    get_mime: false
    get_attributes: false
    get_checksum: false
  changed_when: false
  register: _platform_redis_config_file
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    label: "redis:{{ item.instance_name }}"

- name: Отклонить частичную конфигурацию Redis без постоянного маркера владения
  ansible.builtin.assert:
    that: >-
      _platform_redis_mode_marker.results[redis_config_index].stat.exists
      == _platform_redis_config_file.results[redis_config_index].stat.exists
    fail_msg: REDIS_PARTIAL_CONFIGURATION_REQUIRES_OPERATOR_RECOVERY
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_config_index
    label: "redis:{{ item.instance_name }}"

- name: Безопасное чтение существующей статической конфигурации Redis
  ansible.builtin.slurp:
    src: "{{ item.config_directory }}/redis.conf"
  changed_when: false
  register: _platform_redis_existing_config
  no_log: true
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_config_index
    label: "redis:{{ item.instance_name }}"
  when: _platform_redis_config_file.results[redis_config_index].stat.exists

- name: Отклонить небезопасное изменение статической конфигурации Redis
  ansible.builtin.assert:
    that:
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^port 0$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-port ' ~ item.redis_port ~ '$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-cert-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/certificate\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/certificate\\.pem)$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-key-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/private-key\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/private-key\\.pem)$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-ca-cert-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/ca-chain\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/ca-chain\\.pem)$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-auth-clients yes$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^tls-replication yes$'))
      - >-
        not _platform_redis_config_file.results[redis_config_index].stat.exists
        or (_platform_redis_existing_config.results[redis_config_index].content | b64decode is search('(?m)^dir (?:"' ~ (item.data_directory | regex_escape) ~ '"|' ~ (item.data_directory | regex_escape) ~ ')$'))
    fail_msg: REDIS_STATIC_CONFIGURATION_MIGRATION_REQUIRED
  no_log: true
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_config_index
    label: "redis:{{ item.instance_name }}"

- name: Прочитать локальное постоянное состояние владения Redis
  ansible.builtin.set_fact:
    _platform_redis_has_persistent_state: >-
      {{ _platform_redis_mode_marker.results | selectattr('stat.exists') | list | length > 0 }}
    _platform_redis_all_have_persistent_state: >-
      {{ _platform_redis_mode_marker.results | selectattr('stat.exists') | list | length == (_platform_redis_local_instances | length) }}

- name: Разрешить перезапись ACL только для полностью помеченного развертывания с точно принадлежащими ему службами systemd
  ansible.builtin.set_fact:
    _platform_redis_acl_overwrite_allowed: >-
      {{ _platform_redis_all_have_persistent_state | bool
         and (_platform_redis_existing_unit_headers.results
              | rejectattr('skipped', 'defined') | list | length
              == (_platform_redis_local_instances | length))
         and ((_platform_sentinel_existing_unit_headers.results | default([])
               | rejectattr('skipped', 'defined') | list | length)
              == (_platform_redis_local_instances
                  | selectattr('roles', 'contains', 'sentinel') | list | length)) }}

- name: Отклонить частично инициализированное развертывание Redis на целевых хостах
  ansible.builtin.assert:
    that:
      - >-
        (platform_redis_instances | map(attribute='host') | unique | map('extract', hostvars)
        | selectattr('_platform_redis_all_have_persistent_state', 'defined')
        | map(attribute='_platform_redis_all_have_persistent_state') | list | unique | length) == 1
      - >-
        (platform_redis_instances | map(attribute='host') | unique | map('extract', hostvars)
        | selectattr('_platform_redis_all_have_persistent_state', 'defined')
        | map(attribute='_platform_redis_all_have_persistent_state') | list | unique | first)
        ==
        (platform_redis_instances | map(attribute='host') | unique | map('extract', hostvars)
        | selectattr('_platform_redis_has_persistent_state', 'defined')
        | map(attribute='_platform_redis_has_persistent_state') | list | unique | first)
    fail_msg: REDIS_DEPLOYMENT_PARTIAL_STATE_REQUIRES_OPERATOR_RECOVERY
  run_once: true

- name: Прочитать существующий маркер состояния экземпляра службы Redis
  ansible.builtin.command:
    argv:
      - grep
      - -Fx
      - "mode={{ platform_redis_mode }}"
      - "{{ item.data_directory }}/.{{ platform_redis_name }}-mode"
  changed_when: false
  failed_when: false
  register: _platform_redis_mode_marker_value
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_marker_index
    label: "redis:{{ item.instance_name }}"
  when: _platform_redis_mode_marker.results[redis_marker_index].stat.exists

- name: Отклонить состояние данных Redis с отсутствующим или несовместимым маркером владения
  ansible.builtin.assert:
    that: >-
      (not _platform_redis_mode_marker.results[redis_marker_index].stat.exists)
      or (_platform_redis_mode_marker_value.results[redis_marker_index].rc | default(1) == 0)
    fail_msg: REDIS_STATE_MODE_MIGRATION_REQUIRED
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_marker_index
    label: "redis:{{ item.instance_name }}"

- name: Проверка существующих конфигураций, принадлежащих Sentinel
  ansible.builtin.stat:
    path: "{{ item.config_directory }}/sentinel.conf"
    get_mime: false
    get_attributes: false
    get_checksum: false
  changed_when: false
  register: _platform_sentinel_config_stat
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    index_var: sentinel_config_index
    label: "sentinel:{{ item.instance_name }}"

- name: Отклонить частичную конфигурацию Sentinel без постоянного маркера владения
  ansible.builtin.assert:
    that: >-
      _platform_redis_mode_marker.results[sentinel_marker_index].stat.exists
      == _platform_sentinel_config_stat.results[sentinel_marker_index].stat.exists
    fail_msg: REDIS_PARTIAL_SENTINEL_STATE_REQUIRES_OPERATOR_RECOVERY
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    index_var: sentinel_marker_index
    label: "sentinel:{{ item.instance_name }}"

- name: Проверка существующего статического Sentinel TLS и настроек прослушивателя
  ansible.builtin.slurp:
    src: "{{ item.config_directory }}/sentinel.conf"
  changed_when: false
  register: _platform_sentinel_existing_config
  no_log: true
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    index_var: sentinel_config_index
    label: "sentinel:{{ item.instance_name }}"
  when: _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists

- name: Отклонить небезопасное изменение статической конфигурации Sentinel
  ansible.builtin.assert:
    that:
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^port 0$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^tls-port ' ~ item.sentinel_port ~ '$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^tls-cert-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/certificate\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/certificate\\.pem)$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^tls-key-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/private-key\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/private-key\\.pem)$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^tls-ca-cert-file (?:"' ~ (item.config_directory | regex_escape) ~ '/pki/ca-chain\\.pem"|' ~ (item.config_directory | regex_escape) ~ '/pki/ca-chain\\.pem)$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^requirepass .+$'))
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^aclfile (?:"' ~ (item.config_directory | regex_escape) ~ '/sentinel\\.users\\.acl"|' ~ (item.config_directory | regex_escape) ~ '/sentinel\\.users\\.acl)$'))
      - >-
        not _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists
        or (_platform_sentinel_existing_config.results[sentinel_config_index].content | b64decode is search('(?m)^sentinel auth-pass ' ~ (_platform_redis_instances | first).id ~ ' .+$'))
    fail_msg: REDIS_SENTINEL_STATIC_CONFIGURATION_MIGRATION_REQUIRED
  no_log: true
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    index_var: sentinel_config_index
    label: "sentinel:{{ item.instance_name }}"
  when: _platform_sentinel_config_stat.results[sentinel_config_index].stat.exists

- name: Чтение занятости локального прослушивателя Redis
  ansible.builtin.command:
    argv: [ss, -H, -ltn, "sport = :{{ item.redis_port }}"]
  changed_when: false
  failed_when: false
  register: _platform_redis_port_probe
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    label: "redis:{{ item.instance_name }}"

- name: Прочитать состояние локальной службы systemd, принадлежащей Redis
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ platform_redis_name }}@{{ item.instance_name }}.service"]
  changed_when: false
  failed_when: false
  register: _platform_redis_owned_unit
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    label: "redis:{{ item.instance_name }}"

- name: Отклонить неуправляемый прослушиватель Redis TLS перед изменением
  ansible.builtin.assert:
    that: >-
      (_platform_redis_port_probe.results[redis_index].stdout | trim | length == 0)
      or (_platform_redis_owned_unit.results[redis_index].stdout | trim == 'active')
    fail_msg: REDIS_LISTENER_PORT_CONFLICT
  loop: "{{ _platform_redis_local_instances }}"
  loop_control:
    index_var: redis_index
    label: "redis:{{ item.instance_name }}"

- name: Чтение занятости локального прослушивателя Sentinel
  ansible.builtin.command:
    argv: [ss, -H, -ltn, "sport = :{{ item.sentinel_port }}"]
  changed_when: false
  failed_when: false
  register: _platform_redis_sentinel_port_probe
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    label: "sentinel:{{ item.instance_name }}"

- name: Прочитать состояние локальной службы systemd, принадлежащей Sentinel
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ platform_redis_name }}-sentinel@{{ item.instance_name }}.service"]
  changed_when: false
  failed_when: false
  register: _platform_redis_sentinel_owned_unit
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    label: "sentinel:{{ item.instance_name }}"

- name: Отклонить неуправляемый прослушиватель Sentinel TLS перед изменением
  ansible.builtin.assert:
    that: >-
      (_platform_redis_sentinel_port_probe.results[sentinel_index].stdout | trim | length == 0)
      or (_platform_redis_sentinel_owned_unit.results[sentinel_index].stdout | trim == 'active')
    fail_msg: REDIS_SENTINEL_LISTENER_PORT_CONFLICT
  loop: "{{ _platform_redis_local_instances | selectattr('roles', 'contains', 'sentinel') | list }}"
  loop_control:
    index_var: sentinel_index
    label: "sentinel:{{ item.instance_name }}"
