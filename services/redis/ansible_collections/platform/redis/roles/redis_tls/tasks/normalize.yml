---
- name: Project stable Redis slots, listener ports and owned paths once
  ansible.builtin.set_fact:
    _platform_redis_instances: >-
      {{ platform_redis_instances | platform.redis.platform_redis_members(platform_redis_deployment_id,
         {'port': platform_redis_port, 'sentinel_port': platform_redis_sentinel_port,
          'data_root': platform_redis_data_root, 'config_root': platform_redis_config_root,
          'log_root': platform_redis_log_root}) }}
- name: Reject Redis and Sentinel unit-name collisions on each target host
  ansible.builtin.assert:
    that:
      - >-
        ((_platform_redis_instances | selectattr('host', 'equalto', item)
          | map(attribute='instance_name') | map('regex_replace', '^', 'platform-redis@')
          | map('regex_replace', '$', '.service') | list)
         + (_platform_redis_instances | selectattr('host', 'equalto', item)
            | selectattr('roles', 'contains', 'sentinel')
            | map(attribute='instance_name') | map('regex_replace', '^', 'platform-redis-sentinel@')
            | map('regex_replace', '$', '.service') | list))
        | unique | length ==
        ((_platform_redis_instances | selectattr('host', 'equalto', item) | list | length)
         + (_platform_redis_instances | selectattr('host', 'equalto', item)
            | selectattr('roles', 'contains', 'sentinel') | list | length))
    fail_msg: REDIS_UNIT_NAME_COLLISION
  loop: "{{ _platform_redis_instances | map(attribute='host') | unique | list }}"

- name: Reject Redis and Sentinel TLS port collisions on each host
  ansible.builtin.assert:
    that:
      - >-
        (_platform_redis_instances | selectattr('host', 'equalto', item)
        | map(attribute='redis_port') | list
        + _platform_redis_instances | selectattr('host', 'equalto', item)
        | selectattr('roles', 'contains', 'sentinel') | map(attribute='sentinel_port') | list)
        | unique | length
        ==
        (_platform_redis_instances | selectattr('host', 'equalto', item) | list | length)
        + (_platform_redis_instances | selectattr('host', 'equalto', item) | selectattr('roles', 'contains', 'sentinel') | list | length)
    fail_msg: REDIS_LISTENER_PORT_COLLISION
  loop: "{{ _platform_redis_instances | map(attribute='host') | unique | list }}"
