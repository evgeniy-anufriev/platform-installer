---
- name: Чтение конфигурации Sentinel ACL без раскрытия учетных данных репликации
  ansible.builtin.slurp:
    src: "{{ redis_member.config_directory }}/sentinel.conf"
  register: _platform_sentinel_acl_configuration
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: Проверка конфигурации файла ACL Sentinel
  ansible.builtin.assert:
    that:
      - (_platform_sentinel_acl_configuration.content | b64decode | regex_findall('(?m)^aclfile\s+(.+)$')) in [[redis_member.config_directory ~ '/sentinel.users.acl'], ['"' ~ redis_member.config_directory ~ '/sentinel.users.acl"']]
    fail_msg: REDIS_SENTINEL_ACL_CONFIGURATION_INVALID
  when: "'sentinel' in redis_member.roles"
  no_log: true

- name: Проверка и сохранение всех пользователей ACL под общей блокировкой экземпляра
  platform.redis.acl_file:
    directory: "{{ redis_member.config_directory }}"
    listener: "{{ item }}"
    phase: "{{ 'verify' if platform_redis_verify_only | bool else 'save' }}"
    address: "{{ redis_member.address }}"
    port: "{{ redis_member.redis_port if item == 'redis' else redis_member.sentinel_port }}"
    password: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[(platform_redis_credential if item == 'redis' else platform_redis_sentinel_credential).passwordSecretRef], rstrip=false) }}"
  become: true
  become_user: "{{ platform_redis_user }}"
  loop: "{{ ['redis'] + (['sentinel'] if 'sentinel' in redis_member.roles else []) }}"
  no_log: true
