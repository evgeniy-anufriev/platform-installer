---
- name: Read retained member configurations before attaching ACL files
  ansible.builtin.slurp:
    src: "{{ redis_member.config_directory }}/{{ item }}.conf"
  loop: "{{ ['redis'] + (['sentinel'] if 'sentinel' in redis_member.roles else []) }}"
  when: _platform_redis_has_persistent_state
  register: _platform_redis_acl_configs
  no_log: true

- name: Refuse foreign inline users or ACL paths in retained configurations
  ansible.builtin.assert:
    that:
      - >-
        (item.content | b64decode | regex_findall('(?m)^[ \t]*user[ \t]+([^ \t\r\n]+)') | unique | list)
        in [[], ['default']]
      - >-
        (item.content | b64decode | regex_findall('(?m)^[ \t]*aclfile[ \t]+(.+)$'))
        in [[], [redis_member.config_directory ~ '/' ~ item.item ~ '.users.acl'],
        ['"' ~ redis_member.config_directory ~ '/' ~ item.item ~ '.users.acl"']]
      - >-
        not (item.content | b64decode is search('(?m)^[ \t]*user[ \t]+default[ \t]+'))
        or (_platform_redis_acl_overwrite_allowed | default(false) | bool)
    fail_msg: REDIS_ACL_CONFIGURATION_MIGRATION_REQUIRED
  loop: "{{ _platform_redis_acl_configs.results }}"
  when: not (item.skipped | default(false))
  no_log: true

- name: Remove retained inline default-user definitions for this owned deployment
  ansible.builtin.replace:
    path: "{{ redis_member.config_directory }}/{{ item.item }}.conf"
    regexp: '(?m)^[ \t]*user[ \t]+default[ \t]+[^\r\n]*(?:\r?\n|$)'
    replace: ''
  loop: "{{ _platform_redis_acl_configs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not (item.skipped | default(false))
    - _platform_redis_acl_overwrite_allowed | default(false) | bool
    - item.content | b64decode is search('(?m)^[ \t]*user[ \t]+default[ \t]+')
  no_log: true

- name: Preserve named users and prepare the default ACL under the member lock
  platform.redis.acl_file:
    directory: "{{ redis_member.config_directory }}"
    listener: "{{ item }}"
    phase: prepare
    password: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[(platform_redis_credential if item == 'redis' else platform_redis_sentinel_credential).passwordSecretRef], rstrip=false) }}"
    overwrite_default: "{{ _platform_redis_acl_overwrite_allowed | default(false) | bool }}"
  become: true
  become_user: "{{ platform_redis_user }}"
  loop: "{{ ['redis'] + (['sentinel'] if 'sentinel' in redis_member.roles else []) }}"
  register: _platform_redis_acl_file
  no_log: true
