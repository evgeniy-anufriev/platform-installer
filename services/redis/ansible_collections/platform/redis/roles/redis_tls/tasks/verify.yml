---
- name: Проверка состояния экземпляра службы Redis systemd
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ platform_redis_name }}@{{ redis_member.instance_name }}.service"]
  changed_when: false
  register: _platform_redis_unit_state

- name: Требовать активный экземпляр службы Redis
  ansible.builtin.assert:
    that: _platform_redis_unit_state.stdout | trim == 'active'
    fail_msg: REDIS_MEMBER_NOT_ACTIVE

- name: Проверка конечной точки Redis TLS и учетных данных
  ansible.builtin.command:
    argv:
      - redis-cli
      - --tls
      - --cacert
      - "{{ redis_member.config_directory }}/pki/ca-chain.pem"
      - --cert
      - "{{ redis_member.config_directory }}/pki/certificate.pem"
      - --key
      - "{{ redis_member.config_directory }}/pki/private-key.pem"
      - -h
      - "{{ redis_member.address }}"
      - -p
      - "{{ redis_member.redis_port | string }}"
      - --user
      - default
      - PING
  environment:
    REDISCLI_AUTH: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[platform_redis_credential.passwordSecretRef]) }}"
  changed_when: false
  register: _platform_redis_ping
  retries: 24
  delay: 5
  until: _platform_redis_ping.rc == 0 and _platform_redis_ping.stdout | trim == 'PONG'
  no_log: true
  ignore_errors: true

- name: Требовать успешную аутентификацию конечной точки Redis TLS
  ansible.builtin.assert:
    that:
      - _platform_redis_ping.rc == 0
      - _platform_redis_ping.stdout | trim == 'PONG'
    fail_msg: >-
      {{ 'REDIS_TLS_AUTH_REJECTED'
         if ((_platform_redis_ping.stdout | default('')) is search('(?i)WRONGPASS'))
         else 'REDIS_TLS_AUTH_REQUIRED'
         if ((_platform_redis_ping.stdout | default('')) is search('(?i)NOAUTH'))
         else 'REDIS_TLS_CONNECTION_FAILED'
         if (((_platform_redis_ping.stderr | default('')) ~ (_platform_redis_ping.stdout | default(''))) is search('(?i)connect|timeout|refused|handshake|certificate|tls|ssl'))
         else 'REDIS_TLS_PING_FAILED' }}
  when: _platform_redis_ping is failed

- name: Чтение роли репликации Redis через аутентифицированную конечную точку TLS
  ansible.builtin.command:
    argv:
      - redis-cli
      - --raw
      - --tls
      - --cacert
      - "{{ redis_member.config_directory }}/pki/ca-chain.pem"
      - --cert
      - "{{ redis_member.config_directory }}/pki/certificate.pem"
      - --key
      - "{{ redis_member.config_directory }}/pki/private-key.pem"
      - -h
      - "{{ redis_member.address }}"
      - -p
      - "{{ redis_member.redis_port | string }}"
      - --user
      - default
      - INFO
      - replication
  environment:
    REDISCLI_AUTH: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[platform_redis_credential.passwordSecretRef]) }}"
  changed_when: false
  register: _platform_redis_replication_info
  retries: 24
  delay: 5
  until: >-
    _platform_redis_replication_info.rc == 0
    and (_platform_redis_replication_info.stdout is search('(?m)^role:(master|slave|replica)\\r?$'))
    and (
      _platform_redis_replication_info.stdout is search('(?m)^role:master\\r?$')
      or _platform_redis_replication_info.stdout is search('(?m)^master_link_status:up\\r?$')
    )
  no_log: true

- name: Запись безопасного наблюдения за ролью Redis для проверки в масштабе всего развертывания
  ansible.builtin.set_fact:
    _platform_redis_observed_members: >-
      {{ _platform_redis_observed_members + [{
        'id': redis_member.id,
        'address': redis_member.address,
        'port': redis_member.redis_port | int,
        'role': (
          _platform_redis_replication_info.stdout
          | regex_search('(?m)^role:(master|slave|replica)')
          | default('role:unknown', true)
          | regex_replace('^role:', '')
        ),
        'replicaReady': (
          (_platform_redis_replication_info.stdout | regex_search('(?m)^role:(slave|replica)')) is not none
          and (_platform_redis_replication_info.stdout | regex_search('(?m)^master_link_status:up')) is not none
        )
      }] }}
  no_log: true

- name: Проверка состояния экземпляра службы Sentinel systemd
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ platform_redis_name }}-sentinel@{{ redis_member.instance_name }}.service"]
  changed_when: false
  register: _platform_sentinel_unit_state
  when: "'sentinel' in redis_member.roles"

- name: Требовать активный экземпляр службы Sentinel
  ansible.builtin.assert:
    that: _platform_sentinel_unit_state.stdout | trim == 'active'
    fail_msg: REDIS_SENTINEL_MEMBER_NOT_ACTIVE
  when: "'sentinel' in redis_member.roles"

- name: Проверить кворум Sentinel TLS и обнаружить его текущий мастер
  ansible.builtin.command:
    argv:
      - redis-cli
      - --raw
      - --tls
      - --cacert
      - "{{ redis_member.config_directory }}/pki/ca-chain.pem"
      - --cert
      - "{{ redis_member.config_directory }}/pki/certificate.pem"
      - --key
      - "{{ redis_member.config_directory }}/pki/private-key.pem"
      - -h
      - "{{ redis_member.address }}"
      - -p
      - "{{ redis_member.sentinel_port | string }}"
      - --user
      - default
      - SENTINEL
      - CKQUORUM
      - "{{ (_platform_redis_instances | first).id }}"
  environment:
    REDISCLI_AUTH: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[platform_redis_sentinel_credential.passwordSecretRef]) }}"
  changed_when: false
  register: _platform_sentinel_quorum
  retries: 24
  delay: 5
  until: _platform_sentinel_quorum.rc == 0 and _platform_sentinel_quorum.stdout | trim is match('^OK(?:\\s|$)')
  no_log: true
  when: "'sentinel' in redis_member.roles"

- name: Прочитать текущий главный адрес из Sentinel
  ansible.builtin.command:
    argv:
      - redis-cli
      - --raw
      - --tls
      - --cacert
      - "{{ redis_member.config_directory }}/pki/ca-chain.pem"
      - --cert
      - "{{ redis_member.config_directory }}/pki/certificate.pem"
      - --key
      - "{{ redis_member.config_directory }}/pki/private-key.pem"
      - -h
      - "{{ redis_member.address }}"
      - -p
      - "{{ redis_member.sentinel_port | string }}"
      - --user
      - default
      - SENTINEL
      - GET-MASTER-ADDR-BY-NAME
      - "{{ (_platform_redis_instances | first).id }}"
  environment:
    REDISCLI_AUTH: "{{ lookup('ansible.builtin.file', platform_redis_secret_files[platform_redis_sentinel_credential.passwordSecretRef]) }}"
  changed_when: false
  register: _platform_sentinel_master_address
  retries: 24
  delay: 5
  until: >-
    _platform_sentinel_master_address.rc == 0
    and _platform_sentinel_master_address.stdout_lines | length == 2
  no_log: true
  when: "'sentinel' in redis_member.roles"

- name: "Сохранить обнаруженного Sentinel мастера Redis для общей проверки"
  ansible.builtin.set_fact:
    _platform_redis_observed_sentinel_masters: >-
      {{ _platform_redis_observed_sentinel_masters + [
        _platform_sentinel_master_address.stdout_lines[0] ~ ':' ~ _platform_sentinel_master_address.stdout_lines[1]
      ] }}
  no_log: true
  when: "'sentinel' in redis_member.roles"

- name: Проверка и сохранение пользователя по умолчанию ACL после проверки работоспособности экземпляра службы
  ansible.builtin.include_tasks: acl_runtime.yml
