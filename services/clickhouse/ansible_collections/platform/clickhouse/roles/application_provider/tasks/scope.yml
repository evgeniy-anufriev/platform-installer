---
- name: Проверка защиты учётных данных выбранных ресурсов ClickHouse
  ansible.builtin.assert:
    that:
      - platform_clickhouse_application_phase in ['preflight', 'resources', 'accounts', 'verify']
      - >-
        platform_clickhouse_application_credential_files | platform.core.application_protected_secret_files(
        (platform_clickhouse_application_job.accounts | map(attribute='passwordRef') | list)
        + [platform_clickhouse_application_job.adminPasswordRef], platform_application_secret_root)
    fail_msg: APPLICATION_PROVIDER_SECRET_FILE_INVALID
  no_log: true

- name: "Формирование описаний таблиц по шаблонам Ansible"
  platform.clickhouse.prepare_application_tables:
    job: "{{ platform_clickhouse_application_job }}"
    phase: "{{ platform_clickhouse_application_phase }}"
    template_path: "{{ role_path }}/templates/application-table.sql.j2"
  register: clickhouse_application_prepared_tables
  no_log: true

- name: Обработка ресурсов библиотеки или экземпляра ClickHouse через TLS
  platform.clickhouse.application_scope:
    job: "{{ platform_clickhouse_application_job }}"
    tables: "{{ clickhouse_application_prepared_tables.tables }}"
    directory: "{{ hostvars[clickhouse_application_target.hostId].platform_clickhouse_config_root | default(platform_clickhouse_config_root) }}/{{ platform_clickhouse_application_job.providerId }}/{{ clickhouse_application_target.memberId }}"
    admin_password: "{{ lookup('ansible.builtin.file', platform_clickhouse_application_credential_files[platform_clickhouse_application_job.adminPasswordRef], rstrip=false) }}"
    passwords: "{{ dict(clickhouse_application_password_refs | zip(query('ansible.builtin.file', *clickhouse_application_password_paths, rstrip=false))) }}"
    phase: "{{ platform_clickhouse_application_phase }}"
    lock_timeout: "{{ platform_clickhouse_application_lock_timeout }}"
    query_timeout: "{{ platform_clickhouse_application_query_timeout }}"
  vars:
    clickhouse_application_target: "{{ platform_clickhouse_application_job.candidates | sort(attribute='memberId') | sort(attribute='hostId') | first }}"
    clickhouse_application_password_refs: "{{ platform_clickhouse_application_job.accounts | map(attribute='passwordRef') | list }}"
    clickhouse_application_password_paths: "{{ clickhouse_application_password_refs | map('extract', platform_clickhouse_application_credential_files) | list }}"
  delegate_to: "{{ clickhouse_application_target.hostId }}"
  become: true
  become_user: "{{ hostvars[clickhouse_application_target.hostId].platform_clickhouse_user | default(platform_clickhouse_user) }}"
  no_log: true
  register: clickhouse_application_result
  failed_when: false

- name: Вывод безопасного сообщения об ошибке ресурса или учётной записи ClickHouse
  ansible.builtin.assert:
    that: clickhouse_application_result.msg is not defined
    fail_msg: "{{ clickhouse_application_diagnostic | to_json }}"
  vars:
    clickhouse_application_diagnostic:
      code: "{{ clickhouse_application_result.msg | default('') | regex_search('^CLICKHOUSE_APPLICATION_[A-Z0-9_]+$') | default('CLICKHOUSE_APPLICATION_SCOPE_FAILED', true) }}"
      provider: "{{ platform_clickhouse_application_job.providerId }}"
      operation: "{{ platform_clickhouse_application_phase }}"
      database: "{{ clickhouse_application_result.database | default('') }}"
      table: "{{ clickhouse_application_result.table | default('') }}"
