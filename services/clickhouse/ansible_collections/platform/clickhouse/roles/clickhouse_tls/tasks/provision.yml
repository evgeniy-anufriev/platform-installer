---
- name: Создать частную сервисную группу ClickHouse
  ansible.builtin.group:
    name: "{{ platform_clickhouse_group }}"
    system: true

- name: Создать учетную запись службы ClickHouse без входа в систему
  ansible.builtin.user:
    name: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    system: true
    create_home: false
    shell: /sbin/nologin

- name: Создать корневой каталог и каталог развертывания, принадлежащий пользователю root ClickHouse
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ platform_clickhouse_config_root }}"
    - "{{ platform_clickhouse_log_root }}"
    - "{{ platform_clickhouse_config_root }}/{{ platform_clickhouse_deployment_id }}"
    - "{{ platform_clickhouse_log_root }}/{{ platform_clickhouse_deployment_id }}"

- name: Создать общий родительский каталог данных для совмещённых экземпляров ClickHouse
  ansible.builtin.file:
    path: "{{ platform_clickhouse_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: _platform_clickhouse_local_instances | length > 1

- name: Создание частных каталогов экземпляров службы ClickHouse
  ansible.builtin.file:
    path: "{{ item.0[item.1] }}"
    state: directory
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0700'
  loop: "{{ _platform_clickhouse_local_instances | product(['config_directory', 'data_directory', 'log_directory']) | list }}"
  no_log: true

- name: Создание частных постоянных каталогов управления доступом SQL
  ansible.builtin.file:
    path: "{{ item.data_directory }}/access"
    state: directory
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0700'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Привязать пути к данным экземпляра службы к одному неизменяемому управляемому удостоверению
  ansible.builtin.copy:
    content: "{{ {'apiVersion': 'platform.installer/clickhouse-member-marker/v1alpha1', 'deploymentId': platform_clickhouse_deployment_id, 'memberId': item.id, 'unitId': item.unit_id} | to_nice_json }}\n"
    dest: "{{ item.data_directory }}/.{{ platform_clickhouse_name }}-member.json"
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0600'
    force: false
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Создание частных каталогов TLS для экземпляра службы
  ansible.builtin.file:
    path: "{{ item.config_directory }}/pki"
    state: directory
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0700'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Скопировать точный материал PKI в частные пути экземпляра службы
  ansible.builtin.copy:
    src: "{{ _platform_clickhouse_tls_directory }}/{{ item.1 }}"
    dest: "{{ item.0.config_directory }}/pki/{{ item.1 }}"
    remote_src: true
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0600'
  loop: "{{ _platform_clickhouse_local_instances | product(['ca-chain.pem', 'certificate.pem', 'private-key.pem']) | list }}"
  register: _platform_clickhouse_tls_copies
  no_log: true

- name: Отобразить средство проверки пароля и политику пользователя по умолчанию без открытого текста
  ansible.builtin.template:
    src: users.xml.j2
    dest: "{{ item.config_directory }}/users.xml"
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0600'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  register: _platform_clickhouse_users_configs
  no_log: true

- name: Отрисовка конфигурации частного сервера ClickHouse
  ansible.builtin.template:
    src: server.xml.j2
    dest: "{{ clickhouse_member.config_directory }}/server.xml"
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0600'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    label: "{{ clickhouse_member.id }}"
  register: _platform_clickhouse_server_configs
  no_log: true

- name: Отрисовка частной конфигурации Keeper Raft только для высокой доступности
  ansible.builtin.template:
    src: keeper.xml.j2
    dest: "{{ clickhouse_member.config_directory }}/keeper.xml"
    owner: "{{ platform_clickhouse_user }}"
    group: "{{ platform_clickhouse_group }}"
    mode: '0600'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    label: "{{ clickhouse_member.id }}"
  register: _platform_clickhouse_keeper_configs
  when: platform_clickhouse_mode == 'raft-ha'
  no_log: true

- name: Установка точных системных служб сервера ClickHouse, принадлежащих экземпляру службы
  ansible.builtin.template:
    src: server.service.j2
    dest: "/etc/systemd/system/{{ clickhouse_member.server_unit_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    label: "{{ clickhouse_member.id }}"
  register: _platform_clickhouse_server_units

- name: Установить точные системные службы Keeper, принадлежащие экземпляру службы, только для высокой доступности
  ansible.builtin.template:
    src: keeper.service.j2
    dest: "/etc/systemd/system/{{ clickhouse_member.keeper_unit_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    label: "{{ clickhouse_member.id }}"
  register: _platform_clickhouse_keeper_units
  when: platform_clickhouse_mode == 'raft-ha'

- name: Перезагрузить systemd только после изменения службы экземпляра службы systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: >-
    (_platform_clickhouse_server_units.results | selectattr('changed', 'equalto', true) | list | length > 0)
    or
    (_platform_clickhouse_keeper_units.results | default([]) | selectattr('changed', 'equalto', true) | list | length > 0)

- name: Определить экземпляры службы с измененной политикой TLS или пользователя
  ansible.builtin.set_fact:
    _platform_clickhouse_restart_all: >-
      {{ (_platform_clickhouse_tls_copies.results | selectattr('changed', 'equalto', true) | list | length > 0)
         or (_platform_clickhouse_users_configs.results | selectattr('changed', 'equalto', true) | list | length > 0) }}

- name: Запуск или перезапуск изолированных избирателей Keeper перед серверами ClickHouse
  ansible.builtin.systemd:
    name: "{{ clickhouse_member.keeper_unit_name }}"
    enabled: true
    state: >-
      {{ 'restarted' if _platform_clickhouse_restart_all or
         _platform_clickhouse_keeper_configs.results[clickhouse_index].changed or
         _platform_clickhouse_keeper_units.results[clickhouse_index].changed else 'started' }}
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    index_var: clickhouse_index
    label: "{{ clickhouse_member.id }}"
  when: platform_clickhouse_mode == 'raft-ha'

- name: Запуск или перезапуск изолированных серверов ClickHouse
  ansible.builtin.systemd:
    name: "{{ clickhouse_member.server_unit_name }}"
    enabled: true
    state: >-
      {{ 'restarted' if _platform_clickhouse_restart_all or
         _platform_clickhouse_server_configs.results[clickhouse_index].changed or
         _platform_clickhouse_server_units.results[clickhouse_index].changed else 'started' }}
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    index_var: clickhouse_index
    label: "{{ clickhouse_member.id }}"
