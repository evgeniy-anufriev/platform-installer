---
- name: Доказать происхождение управляемого пути ClickHouse перед привилегированной модификацией
  ansible.builtin.include_tasks: path_safety.yml

- name: Проверка существующих идентификаторов пакетов ClickHouse без изменений
  ansible.builtin.command:
    argv: [rpm, -q, --qf, '%{NAME}\t%{VERSION}-%{RELEASE}.%{ARCH}\n', clickhouse-common-static, clickhouse-server, clickhouse-client, clickhouse-keeper]
  register: _platform_clickhouse_installed_packages
  changed_when: false
  failed_when: false

- name: Отказаться от создания несовместимого неуправляемого пакета ClickHouse
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_package_lines | length <= 1
      - >-
        (item == 'clickhouse-keeper' and _platform_clickhouse_package_lines | length == 0) or
        (item != 'clickhouse-keeper' and
         (_platform_clickhouse_package_lines | length == 0 or
          _platform_clickhouse_package_lines == [item ~ '\t' ~ platform_clickhouse_package_version ~ '-1.x86_64']))
    fail_msg: CLICKHOUSE_PACKAGE_VERSION_CONFLICT
  vars:
    _platform_clickhouse_package_lines: "{{ _platform_clickhouse_installed_packages.stdout_lines | select('match', '^' ~ item ~ '\\t') | list }}"
  loop: [clickhouse-common-static, clickhouse-server, clickhouse-client, clickhouse-keeper]
  loop_control:
    label: "{{ item }}"

- name: Проверить активность стандартного сервера ClickHouse и службы Keeper systemd, не меняя ее
  ansible.builtin.command:
    argv: [systemctl, is-active, clickhouse-server.service, clickhouse-keeper.service]
  register: _platform_clickhouse_stock_units
  changed_when: false
  failed_when: false

- name: Отказаться от смены хоста с активными стандартными службами systemd ClickHouse
  ansible.builtin.assert:
    that: "'active' not in _platform_clickhouse_stock_units.stdout_lines"
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_ACTIVE

- name: Проверка точных путей к службам экземпляра systemd перед рендерингом
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.0.server_unit_name if item.1 == 'server' else item.0.keeper_unit_name }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: >-
    {{ _platform_clickhouse_local_instances |
       product(['server', 'keeper'] if platform_clickhouse_mode == 'raft-ha' else ['server']) | list }}
  register: _platform_clickhouse_unit_path_stats
  no_log: true

- name: Проверка устаревших путей к службам systemd с хеш-именами ClickHouse
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: >-
    {{ (_platform_clickhouse_local_instances | map(attribute='legacy_server_unit_name') | list)
       + ((_platform_clickhouse_local_instances | map(attribute='legacy_keeper_unit_name') | list)
          if platform_clickhouse_mode == 'raft-ha' else []) }}
  register: _platform_clickhouse_legacy_unit_path_stats

- name: Отказаться от автоматического принятия устаревших имен системных служб ClickHouse
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: CLICKHOUSE_LEGACY_UNIT_REQUIRES_S11_CLEANUP
  loop: "{{ _platform_clickhouse_legacy_unit_path_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Отклонить пути к символическим ссылкам службы экземпляра systemd
  ansible.builtin.assert:
    that: >-
      _platform_clickhouse_unit_path_stats.results |
      selectattr('stat.exists', 'equalto', true) |
      selectattr('stat.islnk', 'equalto', true) | list | length == 0
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_PATH

- name: Прочитать существующие заголовки владения службами экземпляра systemd
  ansible.builtin.slurp:
    path: "/etc/systemd/system/{{ item.item.0.server_unit_name if item.item.1 == 'server' else item.item.0.keeper_unit_name }}"
  loop: "{{ _platform_clickhouse_unit_path_stats.results }}"
  when: item.stat.isreg | default(false)
  register: _platform_clickhouse_existing_unit_headers
  no_log: true

- name: Отказаться от замены неуправляемого экземпляра службы systemd
  ansible.builtin.assert:
    that: >-
      (item.content | b64decode).startswith('# ' ~ platform_clickhouse_name ~ '-managed: ' ~
       platform_clickhouse_deployment_id ~ '/' ~ item.item.item.0.id ~ '/' ~ item.item.item.1 ~ '\n')
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_PATH
  loop: "{{ _platform_clickhouse_existing_unit_headers.results }}"
  when: item.content is defined
  no_log: true

- name: Проверка точных путей, принадлежащих экземпляру службы, и маркеров идентификации
  ansible.builtin.stat:
    path: "{{ item.0[item.1] }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_clickhouse_local_instances | product(['config_directory', 'data_directory', 'log_directory']) | list }}"
  register: _platform_clickhouse_owned_path_stats

- name: Проверка точных маркеров идентификации экземпляра службы
  ansible.builtin.stat:
    path: "{{ item.data_directory }}/.{{ platform_clickhouse_name }}-member.json"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_clickhouse_local_instances }}"
  register: _platform_clickhouse_marker_stats

- name: Отказ от неуправляемых путей или замены символических ссылок
  ansible.builtin.assert:
    that:
      - >-
        _platform_clickhouse_owned_path_stats.results |
        selectattr('stat.exists', 'equalto', true) |
        selectattr('stat.islnk', 'equalto', true) | list | length == 0
      - >-
        _platform_clickhouse_marker_stats.results |
        selectattr('stat.exists', 'equalto', true) |
        selectattr('stat.islnk', 'equalto', true) | list | length == 0
      - >-
        not (_platform_clickhouse_owned_path_stats.results |
        selectattr('item.0.id', 'equalto', item.id) |
        selectattr('stat.exists', 'equalto', true) | list | length > 0)
        or (_platform_clickhouse_marker_stats.results |
        selectattr('item.id', 'equalto', item.id) |
        selectattr('stat.exists', 'equalto', true) |
        selectattr('stat.isreg', 'equalto', true) | list | length == 1)
    fail_msg: CLICKHOUSE_FOREIGN_MEMBER_PATH
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Прочитать существующие маркеры экземпляра службы ClickHouse
  ansible.builtin.slurp:
    path: "{{ item.item.data_directory }}/.{{ platform_clickhouse_name }}-member.json"
  loop: "{{ _platform_clickhouse_marker_stats.results }}"
  when: item.stat.isreg | default(false)
  register: _platform_clickhouse_existing_markers
  no_log: true

- name: Доказать, что существующие пути к экземпляру службы принадлежат одному и тому же удостоверению
  ansible.builtin.assert:
    that:
      - (item.content | b64decode | from_json).apiVersion == 'platform.installer/clickhouse-member-marker/v1alpha1'
      - (item.content | b64decode | from_json).deploymentId == platform_clickhouse_deployment_id
      - (item.content | b64decode | from_json).memberId == item.item.item.id
      - (item.content | b64decode | from_json).unitId == item.item.item.unit_id
    fail_msg: CLICKHOUSE_MEMBER_IDENTITY_MISMATCH
  loop: "{{ _platform_clickhouse_existing_markers.results }}"
  when: item.content is defined
  no_log: true

- name: Подсчитать экземпляры службы, требующие первого выделения ресурсов
  ansible.builtin.set_fact:
    _platform_clickhouse_new_member_count: >-
      {{ _platform_clickhouse_marker_stats.results |
         rejectattr('stat.exists', 'equalto', true) | list | length }}

- name: Проверка доступной целевой памяти на наличие новых экземпляров службы ClickHouse
  ansible.builtin.command:
    argv: [free, -b]
  register: _platform_clickhouse_memory
  changed_when: false
  when: _platform_clickhouse_new_member_count | int > 0

- name: Проверка доступного целевого диска на наличие новых экземпляров службы ClickHouse
  ansible.builtin.command:
    argv: [df, -B1, --output=avail, /var/lib]
  register: _platform_clickhouse_disk
  changed_when: false
  when: _platform_clickhouse_new_member_count | int > 0

- name: Требовать консервативного запаса только для экземпляров службы, запускаемых впервые
  ansible.builtin.assert:
    that:
      - (_platform_clickhouse_memory.stdout_lines[1].split()[-1] | int) >= 1073741824 * (_platform_clickhouse_new_member_count | int)
      - (_platform_clickhouse_disk.stdout_lines[-1] | trim | int) >= 1610612736
    fail_msg: CLICKHOUSE_RESOURCE_PREFLIGHT_BLOCKED
  when: _platform_clickhouse_new_member_count | int > 0

- name: Начать предварительную проверку прослушивателя для новых экземпляров службы ClickHouse
  ansible.builtin.set_fact:
    _platform_clickhouse_new_member_ports: []

- name: Собрать только порты, принадлежащие экземплярам службы, без существующего маркера
  ansible.builtin.set_fact:
    _platform_clickhouse_new_member_ports: >-
      {{ _platform_clickhouse_new_member_ports +
         [item.https_port, item.native_port, item.interserver_port] +
         ([item.keeper_client_port, item.keeper_raft_port]
          if platform_clickhouse_mode == 'raft-ha' else []) }}
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    index_var: clickhouse_member_index
    label: "{{ item.id }}"
  when: not _platform_clickhouse_marker_stats.results[clickhouse_member_index].stat.exists

- name: Наблюдать за всеми прослушивателями TCP перед изменением пакета или службы systemd
  ansible.builtin.command:
    argv: [ss, -H, -ltn]
  register: _platform_clickhouse_existing_listeners
  changed_when: false
  when: _platform_clickhouse_new_member_ports | length > 0

- name: Отклонить новый прослушиватель ClickHouse, принадлежащий другому процессу
  ansible.builtin.assert:
    that: _platform_clickhouse_existing_listeners.stdout is not search(':' ~ (item | string) ~ '\\s')
    fail_msg: CLICKHOUSE_LISTENER_IN_USE
  loop: "{{ _platform_clickhouse_new_member_ports }}"
  when: _platform_clickhouse_new_member_ports | length > 0
