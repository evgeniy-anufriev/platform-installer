---
- name: Выбрать потребительский план Core PKI, если он доступен
  ansible.builtin.include_role:
    name: platform.core.pki_materialize
    tasks_from: select_consumer_plan.yml
  vars:
    platform_pki_consumer_tls_profile_id: "{{ platform_clickhouse_tls_profile }}"
  when: >-
    platform_pki_materialization_plans | default(hostvars['localhost'].platform_pki_materialization_plans | default([]), true) | length > 0

- name: Разрешить один утвержденный каталог TLS
  ansible.builtin.set_fact:
    _platform_clickhouse_tls_directory: >-
      {{ platform_pki_selected_consumer_plan.targetDirectory
         if platform_pki_selected_consumer_plan is defined
         else platform_clickhouse_tls_directory }}

- name: Отклонить отсутствующий или небезопасный каталог TLS
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_tls_directory is match('^/[A-Za-z0-9_./-]{1,240}$')
      - "'..' not in _platform_clickhouse_tls_directory.split('/')"
    fail_msg: CLICKHOUSE_PKI_MATERIALIZATION_REQUIRED

- name: Проверка точных файлов ClickHouse TLS
  ansible.builtin.stat:
    path: "{{ _platform_clickhouse_tls_directory }}/{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  register: _platform_clickhouse_tls_files
  no_log: true

- name: Требовать обычные файлы ClickHouse TLS без символических ссылок
  ansible.builtin.assert:
    that: >-
      _platform_clickhouse_tls_files.results |
      rejectattr('stat.isreg', 'equalto', true) | list | length == 0 and
      _platform_clickhouse_tls_files.results |
      selectattr('stat.islnk', 'equalto', true) | list | length == 0
    fail_msg: CLICKHOUSE_PKI_MATERIALIZATION_REQUIRED
  no_log: true
