---
- name: Найти установленную стандартную системную службу сервера ClickHouse
  ansible.builtin.command:
    argv: [systemctl, show, clickhouse-server.service, --property=FragmentPath, --value]
  register: _platform_clickhouse_stock_fragment
  changed_when: false

- name: Потребовать реальный стандартный фрагмент службы systemd перед изменением его включения
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_stock_fragment.stdout is match('^/.+/clickhouse-server[.]service$')
    fail_msg: CLICKHOUSE_STOCK_UNIT_OWNERSHIP_UNCONFIRMED

- name: Определить RPM, владеющий стандартной системной службой сервера ClickHouse
  ansible.builtin.command:
    argv: [rpm, -qf, --qf, '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}', "{{ _platform_clickhouse_stock_fragment.stdout }}"]
  register: _platform_clickhouse_stock_unit_owner
  changed_when: false
  failed_when: false

- name: Отклонить изменение стандартной службы systemd вне зафиксированного RPM-пакета сервера ClickHouse
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_stock_unit_owner.rc == 0
      - _platform_clickhouse_stock_unit_owner.stdout == 'clickhouse-server-' ~ platform_clickhouse_package_version ~ '-1.x86_64'
    fail_msg: CLICKHOUSE_STOCK_UNIT_OWNERSHIP_UNCONFIRMED

- name: Проверка стандартной активности сервера ClickHouse после установки RPM
  ansible.builtin.command:
    argv: [systemctl, is-active, clickhouse-server.service]
  register: _platform_clickhouse_stock_after_install
  changed_when: false
  failed_when: false

- name: Сохранить активный стандартный сервер ClickHouse для явного разрешения конфликтов
  ansible.builtin.assert:
    that: _platform_clickhouse_stock_after_install.stdout != 'active'
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_ACTIVE

- name: Отключить неактивную стандартную системную службу сервера ClickHouse, предоставляемую RPM
  ansible.builtin.systemd:
    name: clickhouse-server.service
    enabled: false

- name: Убедиться, что стандартная системная служба RPM осталась неактивной
  ansible.builtin.command:
    argv: [systemctl, is-active, clickhouse-server.service]
  register: _platform_clickhouse_stock_after_disable
  changed_when: false
  failed_when: false

- name: Отказаться от одновременной активации стандартной службы systemd RPM
  ansible.builtin.assert:
    that: _platform_clickhouse_stock_after_disable.stdout != 'active'
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_ACTIVE
