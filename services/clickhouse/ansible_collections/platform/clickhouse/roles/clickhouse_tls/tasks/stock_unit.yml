---
- name: Поиск установленной стандартной системной службы сервера ClickHouse
  ansible.builtin.command:
    argv: [systemctl, show, clickhouse-server.service, --property=FragmentPath, --value]
  register: _platform_clickhouse_stock_fragment
  changed_when: false

- name: Проверка штатного unit-файла перед изменением автозапуска ClickHouse
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_stock_fragment.stdout is match('^/.+/clickhouse-server[.]service$')
    fail_msg: CLICKHOUSE_STOCK_UNIT_OWNERSHIP_UNCONFIRMED

- name: Определение RPM-пакета штатной службы сервера ClickHouse
  ansible.builtin.command:
    argv: [rpm, -qf, --qf, '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}', "{{ _platform_clickhouse_stock_fragment.stdout }}"]
  register: _platform_clickhouse_stock_unit_owner
  changed_when: false
  failed_when: false

- name: Отклонение изменения стандартной службы systemd вне зафиксированного RPM-пакета сервера ClickHouse
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_stock_unit_owner.rc == 0
      - _platform_clickhouse_stock_unit_owner.stdout == 'clickhouse-server-' ~ platform_clickhouse_package_version ~ '-' ~ (platform_clickhouse_package_releases | default({})).get('clickhouse-server', '1') ~ '.' ~ (platform_clickhouse_package_architecture | default('x86_64'))
    fail_msg: CLICKHOUSE_STOCK_UNIT_OWNERSHIP_UNCONFIRMED

- name: Проверка стандартной активности сервера ClickHouse после установки RPM
  ansible.builtin.command:
    argv: [systemctl, is-active, clickhouse-server.service]
  register: _platform_clickhouse_stock_after_install
  changed_when: false
  failed_when: false

- name: Сохранение активного стандартного сервера ClickHouse для явного разрешения конфликтов
  ansible.builtin.assert:
    that: _platform_clickhouse_stock_after_install.stdout != 'active'
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_ACTIVE

- name: Отключение неактивной штатной службы сервера ClickHouse из RPM-пакета
  ansible.builtin.systemd:
    name: clickhouse-server.service
    enabled: false

- name: Проверка того, что стандартная системная служба RPM осталась неактивной
  ansible.builtin.command:
    argv: [systemctl, is-active, clickhouse-server.service]
  register: _platform_clickhouse_stock_after_disable
  changed_when: false
  failed_when: false

- name: Запрет одновременного запуска штатной службы ClickHouse из RPM-пакета
  ansible.builtin.assert:
    that: _platform_clickhouse_stock_after_disable.stdout != 'active'
    fail_msg: CLICKHOUSE_FOREIGN_UNIT_ACTIVE
