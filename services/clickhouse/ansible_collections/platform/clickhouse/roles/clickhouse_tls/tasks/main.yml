---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Проверка желаемых входных данных ClickHouse
  ansible.builtin.include_tasks: validate.yml

- name: Нормализация размещения экземпляра службы ClickHouse
  ansible.builtin.include_tasks: normalize.yml

- name: Отклонение перекрывающихся локальных путей данных ClickHouse
  ansible.builtin.include_tasks: validate_data_paths.yml
  when: not (platform_clickhouse_verify_only | bool)

- name: Проверка разрешённых источников пакетов ClickHouse
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: clickhouse-common-static, name: clickhouse-common-static}
      - {id: clickhouse-server, name: clickhouse-server}
      - {id: clickhouse-client, name: clickhouse-client}
  when:
    - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
    - not (platform_clickhouse_verify_only | bool)

- name: "Выбор TLS-файлов ClickHouse по плану PKI"
  ansible.builtin.include_tasks: resolve_tls.yml

- name: Проверка владения пакетом ClickHouse и экземпляром службы перед применением
  ansible.builtin.include_tasks: preflight.yml
  when:
    - not (platform_clickhouse_verify_only | bool)
    - _platform_clickhouse_local_instances | length > 0

- name: Установка утвержденных пакетов ClickHouse
  ansible.builtin.include_tasks: packages.yml
  when:
    - not (platform_clickhouse_verify_only | bool)
    - _platform_clickhouse_local_instances | length > 0

- name: Настройка изолированных экземпляров службы ClickHouse
  ansible.builtin.include_tasks: provision.yml
  when:
    - not (platform_clickhouse_verify_only | bool)
    - _platform_clickhouse_local_instances | length > 0

- name: Проверка локальных экземпляров службы ClickHouse
  ansible.builtin.include_tasks: verify.yml
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    loop_var: clickhouse_member
    label: "{{ clickhouse_member.id }}"
