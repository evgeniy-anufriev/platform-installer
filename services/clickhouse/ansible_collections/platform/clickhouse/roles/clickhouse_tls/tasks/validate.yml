---
- name: Проверка закрытых входных данных развертывания ClickHouse
  ansible.builtin.assert:
    that:
      - platform_clickhouse_mode in ['standalone', 'raft-ha']
      - platform_clickhouse_deployment_id is match('^[a-z0-9][a-z0-9-]*$')
      - platform_clickhouse_deployment_id | length <= 128
      - platform_clickhouse_instances is sequence
      - platform_clickhouse_instances is not string
      - platform_clickhouse_instances | length == (1 if platform_clickhouse_mode == 'standalone' else 3)
      - platform_clickhouse_tls_profile is string
      - platform_clickhouse_tls_profile | length > 0 or platform_clickhouse_tls_directory | default('') | length > 0
      - platform_clickhouse_default_credential is mapping
      - platform_clickhouse_default_credential.passwordSecretRef | default('') is match('^runtime:[a-z][a-z0-9-]{0,127}$')
      - platform_clickhouse_secret_files is mapping
      - platform_clickhouse_default_credential.passwordSecretRef in platform_clickhouse_secret_files
    fail_msg: CLICKHOUSE_INPUT_INVALID
  no_log: true

- name: Проверка каждого размещения ClickHouse перед изменением файловой системы
  ansible.builtin.assert:
    that:
      - item is mapping
      - item.id | default('') is match('^[a-z][a-z0-9]*(?:[-_.][a-z0-9]+)*$')
      - item.id | length <= 128
      - item.id is match('^.+-[1-9][0-9]*$')
      - (platform_clickhouse_name ~ '-server@' ~ platform_clickhouse_deployment_id ~ '-' ~ (item.id | regex_replace('^.*-', '')) ~ '.service') | length <= 255
      - platform_clickhouse_mode != 'raft-ha' or (platform_clickhouse_name ~ '-keeper@' ~ platform_clickhouse_deployment_id ~ '-' ~ (item.id | regex_replace('^.*-', '')) ~ '.service') | length <= 255
      - item.host | default('') is string
      - item.host | length > 0
      - item.address | default('') is string
      - item.address | length > 0
      - item.roles | default([]) | sort == (['server'] if platform_clickhouse_mode == 'standalone' else ['keeper', 'server'])
    fail_msg: CLICKHOUSE_PLACEMENT_INVALID
  loop: "{{ platform_clickhouse_instances }}"
  loop_control:
    label: "{{ item.id | default('invalid') }}"

- name: Отклонить повторяющиеся идентификаторы экземпляра службы ClickHouse
  ansible.builtin.assert:
    that: platform_clickhouse_instances | map(attribute='id') | unique | list | length == platform_clickhouse_instances | length
    fail_msg: CLICKHOUSE_MEMBER_ID_DUPLICATE

- name: Требовать файл паролей по умолчанию только во время выполнения
  ansible.builtin.stat:
    path: "{{ platform_clickhouse_secret_files[platform_clickhouse_default_credential.passwordSecretRef] }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  delegate_to: localhost
  become: false
  register: _platform_clickhouse_password_file
  no_log: true

- name: Отклонить отсутствующий или замененный файл паролей по умолчанию
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_password_file.stat.exists
      - _platform_clickhouse_password_file.stat.isreg
      - not _platform_clickhouse_password_file.stat.islnk
      - _platform_clickhouse_password_file.stat.size >= 1
      - _platform_clickhouse_password_file.stat.size <= 4096
    fail_msg: CLICKHOUSE_PASSWORD_INPUT_INVALID
  no_log: true

- name: Прочитать точные байты пароля во время выполнения без обрезки
  ansible.builtin.set_fact:
    _platform_clickhouse_default_password: "{{ lookup('ansible.builtin.file', platform_clickhouse_secret_files[platform_clickhouse_default_credential.passwordSecretRef], lstrip=False, rstrip=False) }}"
  no_log: true

- name: Запрос непустого пароля UTF-8 с точной привязкой к байтам
  ansible.builtin.assert:
    that:
      - _platform_clickhouse_default_password | string | length > 0
      - _platform_clickhouse_default_password | string | length <= 4096
      - _platform_clickhouse_default_password | string | hash('sha256') is match('^[0-9a-f]{64}$')
    fail_msg: CLICKHOUSE_PASSWORD_INPUT_INVALID
  no_log: true
