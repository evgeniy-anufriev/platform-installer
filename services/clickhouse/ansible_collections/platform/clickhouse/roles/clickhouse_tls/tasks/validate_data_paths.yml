---
- name: Хранить общий корень данных ClickHouse отдельно от совместно расположенных экземпляров службы
  ansible.builtin.assert:
    that: item.data_directory != platform_clickhouse_data_root
    fail_msg: "CLICKHOUSE_DATA_DIRECTORY_COLLISION: {{ item.id }}: {{ item.data_directory }} is the shared root"
  loop: "{{ _platform_clickhouse_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  when: _platform_clickhouse_local_instances | length > 1

- name: Отказаться от перекрытия каталогов экземпляров службы ClickHouse на одном хосте
  ansible.builtin.assert:
    that:
      - not item.0.data_directory.startswith(item.1.data_directory ~ '/')
      - not item.1.data_directory.startswith(item.0.data_directory ~ '/')
      - item.0.data_directory != item.1.data_directory
    fail_msg: >-
      CLICKHOUSE_DATA_DIRECTORY_COLLISION: {{ item.0.id }}={{ item.0.data_directory }},
      {{ item.1.id }}={{ item.1.data_directory }}
  loop: "{{ _platform_clickhouse_local_instances | product(_platform_clickhouse_local_instances) | list }}"
  loop_control:
    label: "{{ item.0.id }} / {{ item.1.id }}"
  when: item.0.id < item.1.id
