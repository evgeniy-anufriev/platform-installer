---
- name: Restrict managed ClickHouse roots to one owned component under trusted system parents
  ansible.builtin.assert:
    that:
      - platform_clickhouse_config_root is match('^/etc/[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$')
      - platform_clickhouse_data_root is string
      - platform_clickhouse_log_root is match('^/var/log/[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$')
    fail_msg: CLICKHOUSE_MANAGED_ROOT_UNSAFE

- name: Guard ClickHouse data root ancestry before mutation
  ansible.builtin.include_role:
    name: platform.core.managed_data_path_guard
  vars:
    platform_managed_data_path: "{{ platform_clickhouse_data_root }}"
    platform_managed_data_owner: "{{ platform_clickhouse_user }}"

- name: Inspect managed ClickHouse root and deployment ancestors without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ platform_clickhouse_config_root }}"
    - "{{ platform_clickhouse_data_root }}"
    - "{{ platform_clickhouse_log_root }}"
    - "{{ platform_clickhouse_config_root }}/{{ platform_clickhouse_deployment_id }}"
    - "{{ platform_clickhouse_data_root }}/{{ platform_clickhouse_deployment_id }}"
    - "{{ platform_clickhouse_log_root }}/{{ platform_clickhouse_deployment_id }}"
  register: _platform_clickhouse_ancestor_stats

- name: Refuse substituted or foreign managed ClickHouse ancestors
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.pw_name == 'root'
      - not item.stat.exists or item.stat.gr_name == 'root'
      - not item.stat.exists or item.stat.mode == '0755'
    fail_msg: CLICKHOUSE_FOREIGN_ANCESTOR_PATH
  loop: "{{ _platform_clickhouse_ancestor_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect member, SQL access-control and private PKI paths without following links
  ansible.builtin.stat:
    path: "{{ item.0.config_directory ~ '/pki' if item.1 == 'config_pki' else (item.0.data_directory ~ '/access' if item.1 == 'access_control_directory' else item.0[item.1]) }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ _platform_clickhouse_local_instances | product(['config_directory', 'data_directory', 'log_directory', 'access_control_directory', 'config_pki']) | list }}"
  register: _platform_clickhouse_private_path_stats

- name: Refuse substituted or foreign member and private PKI paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isdir | default(false))
      - not item.stat.exists or not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.pw_name == platform_clickhouse_user
      - not item.stat.exists or item.stat.gr_name == platform_clickhouse_group
      - not item.stat.exists or item.stat.mode == '0700'
    fail_msg: CLICKHOUSE_FOREIGN_PRIVATE_PATH
  loop: "{{ _platform_clickhouse_private_path_stats.results }}"
  loop_control:
    label: "{{ item.item.0.id }}/{{ item.item.1 }}"
