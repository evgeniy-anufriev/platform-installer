---
platform_clickhouse_mode: standalone
platform_clickhouse_deployment_id: "{{ platform_execution_service_deployment | default('clickhouse', true) }}"
platform_clickhouse_instances: []
platform_clickhouse_tls_profile: infrastructure-tls
platform_clickhouse_tls_directory: ''
platform_clickhouse_port: 8443
platform_clickhouse_native_port: 9440
platform_clickhouse_interserver_port: 9010
platform_clickhouse_keeper_client_port: 9281
platform_clickhouse_keeper_raft_port: 9444
platform_clickhouse_default_credential:
  passwordSecretRef: ''
platform_clickhouse_secret_files: {}
platform_clickhouse_rpm_paths: {}
platform_clickhouse_verify_only: false
platform_clickhouse_name: "{{ (platform_name_prefix | default('') ~ '-') if (platform_name_prefix | default('')) else '' }}clickhouse"
platform_clickhouse_config_root: "/etc/{{ platform_clickhouse_name }}"
platform_clickhouse_data_root: "{{ platform_data_root_directory | default('/var/lib') }}/{{ platform_clickhouse_deployment_id }}"
platform_clickhouse_member_data_directory: "{{ platform_clickhouse_data_root }}"
platform_clickhouse_log_root: "/var/log/{{ platform_clickhouse_name }}"
platform_clickhouse_user: "{{ platform_clickhouse_name }}"
platform_clickhouse_group: "{{ platform_clickhouse_name }}"
platform_clickhouse_package_version: 26.8.14.3
platform_clickhouse_expected_rpm_digests:
