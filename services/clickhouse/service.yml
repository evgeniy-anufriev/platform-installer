apiVersion: platform.installer/service-manifest/v1alpha2
kind: ServiceManifest
metadata:
  id: clickhouse
  version: "1.0.0-alpha.2"
  displayName: ClickHouse
  description: TLS-only ClickHouse standalone or one-shard Raft HA with paired Keeper members
  category: database
modes:
  standalone:
    displayName: Standalone
    description: One ClickHouse server without Keeper
    memberRoles: [server]
    placement:
      explicit: true
      minMembers: 1
      maxMembers: 1
      distinctHosts: false
      roleCardinality:
        server: {minimum: 1, maximum: 1}
    x-requiredRuntimeSecretSettings: [defaultCredential]
  raft-ha:
    displayName: Raft HA
    description: One shard with three replicas, each paired with a Keeper voter
    memberRoles: [server, keeper]
    placement:
      explicit: true
      minMembers: 3
      maxMembers: 3
      distinctHosts: false
      roleCardinality:
        server: {minimum: 3, maximum: 3}
        keeper: {minimum: 3, maximum: 3}
    x-requiredRuntimeSecretSettings: [defaultCredential]
listeners:
  client: {protocol: https, defaultPort: 8443, tlsCapable: true, scope: member}
  native: {protocol: tcp, defaultPort: 9440, tlsCapable: true, scope: member}
  interserver: {protocol: https, defaultPort: 9010, tlsCapable: true, scope: member}
  keeper-client: {protocol: tcp, defaultPort: 9281, tlsCapable: true, scope: member}
  keeper-raft: {protocol: tcp, defaultPort: 9444, tlsCapable: true, scope: member}
endpoint: {}
x-haproxyBackendDefaults: {balance: roundrobin, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
x-backendClientListener: {listener: client, allocation: {kind: HOST_LOCAL_ORDINAL, stride: 1}}
capabilities: [service.clickhouse.https, service.clickhouse.keeper, service.clickhouse.database, service.clickhouse.account, service.clickhouse.table]
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    tlsProfile: {kind: MANAGED, roleVariable: platform_clickhouse_tls_profile, type: string, scopes: [deployment], validation: {minLength: 1}, ui: {label: TLS profile, section: TLS, order: 10, x-referenceKind: TLS_PROFILE}}
    port: {kind: MANAGED, roleVariable: platform_clickhouse_port, type: integer, scopes: [deployment, member], validation: {minimum: 1, maximum: 65535}, ui: {label: HTTPS port, section: Network, order: 20}}
    nativePort: {kind: MANAGED, roleVariable: platform_clickhouse_native_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Secure native TCP base port, section: Network, order: 21}}
    interserverPort: {kind: MANAGED, roleVariable: platform_clickhouse_interserver_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Interserver HTTPS base port, section: Network, order: 22}}
    keeperClientPort: {kind: MANAGED, roleVariable: platform_clickhouse_keeper_client_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Keeper secure client base port, section: Network, order: 23}}
    keeperRaftPort: {kind: MANAGED, roleVariable: platform_clickhouse_keeper_raft_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Keeper Raft base port, section: Network, order: 24}}
    dataRoot: {kind: MANAGED, roleVariable: platform_clickhouse_data_root, type: string, scopes: [deployment], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных, section: Хранение, order: 0, description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких участников на одном сервере создаются отдельные подкаталоги. Существующие данные автоматически не переносятся.}}
    dataDirectory: {kind: MANAGED, roleVariable: platform_clickhouse_member_data_directory, type: string, scopes: [member], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных участника, section: Хранение, order: 0, description: Абсолютный путь на сервере; переопределяет каталог данных только этого участника.}}
    defaultCredential:
      kind: MANAGED
      roleVariable: platform_clickhouse_default_credential
      type: object
      scopes: [deployment]
      validation: {required: [passwordSecretRef]}
      schema:
        type: object
        additionalProperties: false
        required: [passwordSecretRef]
        properties:
          passwordSecretRef: {type: string, minLength: 1}
      ui: {label: Default user password, section: Credentials, order: 40, x-runtimeSecretRequirement: {requirementRef: clickhouse-default-password, purpose: SERVICE_PASSWORD}}
x-memberDataDirectorySetting: dataDirectory
x-dataDirectoryProjection: {deploymentSetting: dataRoot, memberSetting: dataDirectory, rootVariable: platform_data_root_directory, appendMemberIdWhenCoLocated: true}
roleEntrypoints:
  apply: {fqcn: platform.clickhouse.clickhouse_tls, variablesPrefix: platform_clickhouse_, x-memberListVariable: platform_clickhouse_instances}
  verify: {fqcn: platform.clickhouse.clickhouse_tls, variablesPrefix: platform_clickhouse_, x-memberListVariable: platform_clickhouse_instances}
artifacts:
  - {artifactRef: clickhouse-common-static, requiredOffline: true}
  - {artifactRef: clickhouse-server, requiredOffline: true}
  - {artifactRef: clickhouse-client, requiredOffline: true}
compatibilityRef: compatibility.yml
