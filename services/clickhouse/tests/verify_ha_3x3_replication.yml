---
- name: Prove three-host ClickHouse and Keeper replication over authenticated TLS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    clickhouse_qa_root: "{{ lookup('ansible.builtin.env', 'PLATFORM_CLICKHOUSE_QA_ROOT') }}"
    clickhouse_qa_hosts: [192.168.56.101, 192.168.56.102, 192.168.56.103]
    clickhouse_qa_password: "{{ lookup('ansible.builtin.file', clickhouse_qa_root ~ '/default-password', lstrip=False, rstrip=False) }}"
    clickhouse_qa_ca: "{{ clickhouse_qa_root }}/pki3x3/ca-chain.pem"
  tasks:
    - name: Require the isolated QA input root
      ansible.builtin.assert:
        that: clickhouse_qa_root is match('^/var/tmp/platform-clickhouse-qa-[A-Za-z0-9]+$')

    - name: Create the same replicated table on all three hosts
      ansible.builtin.uri:
        url: "https://{{ item }}:8460/"
        method: POST
        body: "CREATE TABLE IF NOT EXISTS default.si09_ha3x3 (id UInt64) ENGINE = ReplicatedMergeTree('/clickhouse/tables/si09_ha3x3', '{replica}') ORDER BY id"
        url_username: default
        url_password: "{{ clickhouse_qa_password }}"
        force_basic_auth: true
        ca_path: "{{ clickhouse_qa_ca }}"
        validate_certs: true
        status_code: 200
      loop: "{{ clickhouse_qa_hosts }}"
      no_log: true

    - name: Commit one row through the first host
      ansible.builtin.uri:
        url: https://192.168.56.101:8460/
        method: POST
        body: INSERT INTO default.si09_ha3x3 VALUES (1)
        url_username: default
        url_password: "{{ clickhouse_qa_password }}"
        force_basic_auth: true
        ca_path: "{{ clickhouse_qa_ca }}"
        validate_certs: true
        status_code: 200
      no_log: true

    - name: Read the row through all three hosts with verified TLS identity
      ansible.builtin.uri:
        url: "https://{{ item }}:8460/?query=SELECT%20count()%20FROM%20default.si09_ha3x3"
        method: GET
        url_username: default
        url_password: "{{ clickhouse_qa_password }}"
        force_basic_auth: true
        ca_path: "{{ clickhouse_qa_ca }}"
        validate_certs: true
        return_content: true
        status_code: 200
      loop: "{{ clickhouse_qa_hosts }}"
      register: clickhouse_qa_replica_read
      until: clickhouse_qa_replica_read.content | default('') | trim == '1'
      retries: 20
      delay: 2
      no_log: true

    - name: Require one committed row from every host
      ansible.builtin.assert:
        that:
          - clickhouse_qa_replica_read.results | length == 3
          - clickhouse_qa_replica_read.results | map(attribute='status') | list == [200, 200, 200]
          - clickhouse_qa_replica_read.results | map(attribute='content') | map('trim') | list == ['1', '1', '1']
        fail_msg: CLICKHOUSE_3X3_REPLICATION_NOT_PROVEN
      no_log: true
