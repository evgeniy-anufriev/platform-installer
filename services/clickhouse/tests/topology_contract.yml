---
- name: Проверка топологии ClickHouse и контракта runtime-паролей без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    platform_clickhouse_deployment_id: clickhouse-qa
    platform_clickhouse_default_credential:
      passwordSecretRef: runtime:clickhouse-default-password
    platform_clickhouse_tls_profile: infrastructure-tls
  tasks:
    - name: Создание временного файла входных runtime-секретов
      ansible.builtin.tempfile:
        state: file
        prefix: platform-clickhouse-contract-
      register: clickhouse_password_file
      no_log: true

    - name: Проверка обеих форм размещения с одинаковыми временными учетными данными
      block:
        - name: Запись временного тестового пароля вне репозитория
          ansible.builtin.copy:
            dest: "{{ clickhouse_password_file.path }}"
            content: "{{ lookup('ansible.builtin.password', '/dev/null length=20 chars=ascii_letters,digits') }}"
            mode: '0600'
          no_log: true

        - name: Проверка автономного размещения и ссылки на пароль
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: validate.yml
          vars:
            platform_clickhouse_mode: standalone
            platform_clickhouse_instances:
              - {id: clickhouse-1, host: localhost, address: 127.0.0.1, roles: [server]}
            platform_clickhouse_secret_files:
              runtime:clickhouse-default-password: "{{ clickhouse_password_file.path }}"

        - name: Нормализация отдельного размещения
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: normalize.yml
          vars:
            platform_clickhouse_mode: standalone
            platform_clickhouse_instances:
              - {id: clickhouse-1, host: localhost, address: 127.0.0.1, roles: [server]}

        - name: Проверка того, что у автономного сервера есть один сервер и нет требований к выделению Keeper
          ansible.builtin.assert:
            that:
              - _platform_clickhouse_local_instances | length == 1
              - _platform_clickhouse_local_instances[0].https_port | int == 8443
              - _platform_clickhouse_local_ports | length == 3
              - _platform_clickhouse_local_instances[0].server_unit_name == 'platform-clickhouse-server@clickhouse-qa-1.service'

        - name: Проверка трех парных экземпляров службы на одном хосте
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: validate.yml
          vars:
            platform_clickhouse_mode: raft-ha
            platform_clickhouse_instances:
              - {id: clickhouse-1, host: localhost, address: 127.0.0.1, roles: [server, keeper]}
              - {id: clickhouse-2, host: localhost, address: 127.0.0.1, roles: [server, keeper]}
              - {id: clickhouse-3, host: localhost, address: 127.0.0.1, roles: [server, keeper]}
            platform_clickhouse_secret_files:
              runtime:clickhouse-default-password: "{{ clickhouse_password_file.path }}"

        - name: Нормализация трёх пар экземпляров на одном узле
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: normalize.yml
          vars:
            platform_clickhouse_mode: raft-ha
            platform_clickhouse_instances:
              - {id: clickhouse-1, host: localhost, address: 127.0.0.1, roles: [server, keeper]}
              - {id: clickhouse-2, host: localhost, address: 127.0.0.1, roles: [server, keeper]}
              - {id: clickhouse-3, host: localhost, address: 127.0.0.1, roles: [server, keeper]}

        - name: Проверка уникальности Raft ID и пяти назначений портов каждого экземпляра ClickHouse
          ansible.builtin.assert:
            that:
              - _platform_clickhouse_local_instances | length == 3
              - _platform_clickhouse_local_instances | map(attribute='slot') | unique | list | length == 3
              - _platform_clickhouse_local_ports | unique | list | length == 15
              - _platform_clickhouse_local_instances | map(attribute='https_port') | list == [8443, 8444, 8445]
              - _platform_clickhouse_local_instances | map(attribute='server_unit_name') | list == ['platform-clickhouse-server@clickhouse-qa-1.service', 'platform-clickhouse-server@clickhouse-qa-2.service', 'platform-clickhouse-server@clickhouse-qa-3.service']
              - _platform_clickhouse_local_instances | map(attribute='keeper_unit_name') | list == ['platform-clickhouse-keeper@clickhouse-qa-1.service', 'platform-clickhouse-keeper@clickhouse-qa-2.service', 'platform-clickhouse-keeper@clickhouse-qa-3.service']

        - name: Выполнение предварительной проверки владения хостом QA только для чтения по явному запросу
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: preflight.yml
            apply:
              become: true
          vars:
            platform_clickhouse_mode: raft-ha
          when: platform_clickhouse_test_preflight | default(false) | bool
      always:
        - name: Удаление временного секретного тестового файла времени выполнения
          ansible.builtin.file:
            path: "{{ clickhouse_password_file.path }}"
            state: absent
          no_log: true
