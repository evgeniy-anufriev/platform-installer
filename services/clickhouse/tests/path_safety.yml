---
- name: Доказать доступ к управляемому пути ClickHouse без модификации пакета или службы
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Выделить точный корень конфигурации ClickHouse, принадлежащий QA
      ansible.builtin.tempfile:
        state: directory
        path: /etc
        prefix: platform-clickhouse-qa-
      register: clickhouse_path_qa_root

    - name: Привязать безопасные одноразовые корни и один экземпляр службы для тестов пути
      ansible.builtin.set_fact:
        platform_clickhouse_config_root: "{{ clickhouse_path_qa_root.path }}"
        platform_clickhouse_data_root: "/var/lib/{{ clickhouse_path_qa_root.path | basename }}"
        platform_clickhouse_log_root: "/var/log/{{ clickhouse_path_qa_root.path | basename }}"
        platform_clickhouse_deployment_id: clickhouse-qa-path
        _platform_clickhouse_local_instances:
          - id: qa-member
            config_directory: "{{ clickhouse_path_qa_root.path }}/clickhouse-qa-path/qa-member"
            data_directory: "/var/lib/{{ clickhouse_path_qa_root.path | basename }}/clickhouse-qa-path/qa-member"
            log_directory: "/var/log/{{ clickhouse_path_qa_root.path | basename }}/clickhouse-qa-path/qa-member"

    - name: Потребовать, чтобы одноразовый корень оставался в точном пространстве имен QA
      ansible.builtin.assert:
        that: clickhouse_path_qa_root.path is match('^/etc/platform-clickhouse-qa-[A-Za-z0-9_-]+$')
        fail_msg: CLICKHOUSE_QA_PATH_UNSAFE

    - name: Проверка безопасных и враждебных путей ClickHouse
      block:
        - name: Подготовить правильно принадлежащий одноразовый корень
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Проверить пустой корневой каталог и его владельца без изменений
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: path_safety.yml

        - name: Имитация неуправляемого владельца в управляемом корне
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            owner: platform-clickhouse
            group: platform-clickhouse

        - name: Отклонить принадлежащий другому пользователю root
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: FOREIGN_ROOT_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_ANCESTOR_PATH' in (ansible_failed_result | to_json)"
                  - "'FOREIGN_ROOT_ADMITTED' not in (ansible_failed_result | to_json)"

        - name: Восстановить право собственности root до следующего изолированного случая
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            owner: root
            group: root

        - name: Удалить одноразовый корень перед заменой ссылки
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: absent

        - name: Заменить точную корневую символическую ссылку на несвязанный каталог
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            src: /var/tmp
            state: link

        - name: Отклонить замененный управляемый корень
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: ROOT_SYMLINK_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_ANCESTOR_PATH' in (ansible_failed_result | to_json)"
                  - "'ROOT_SYMLINK_ADMITTED' not in (ansible_failed_result | to_json)"

        - name: Удалить символическую ссылку, принадлежащую QA, не переходя по ней
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: absent

        - name: Воссоздать безопасный корневой каталог и каталог развертывания
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - "{{ platform_clickhouse_config_root }}"
            - "{{ platform_clickhouse_config_root }}/clickhouse-qa-path"

        - name: Создать точный каталог экземпляра частной службы
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}/clickhouse-qa-path/qa-member"
            state: directory
            owner: platform-clickhouse
            group: platform-clickhouse
            mode: '0700'

        - name: Заменить частный путь PKI символической ссылкой
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}/clickhouse-qa-path/qa-member/pki"
            src: /var/tmp
            state: link

        - name: Отклонить замененный частный путь PKI
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: PRIVATE_PKI_SYMLINK_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_PRIVATE_PATH' in (ansible_failed_result | to_json)"
                  - "'PRIVATE_PKI_SYMLINK_ADMITTED' not in (ansible_failed_result | to_json)"

      always:
        - name: Удалить только точный эфемерный корень или ссылку QA
          ansible.builtin.file:
            path: "{{ clickhouse_path_qa_root.path }}"
            state: absent
          when: clickhouse_path_qa_root.path is match('^/etc/platform-clickhouse-qa-[A-Za-z0-9_-]+$')
