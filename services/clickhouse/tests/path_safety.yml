---
- name: Проверка доступа к управляемому пути ClickHouse без изменения пакета или службы
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  tasks:
    - name: Выделение каталога конфигурации ClickHouse для QA
      ansible.builtin.tempfile:
        state: directory
        path: /etc
        prefix: platform-clickhouse-qa-
      register: clickhouse_path_qa_root

    - name: Привязка временных каталогов и экземпляра к тестам путей ClickHouse
      ansible.builtin.set_fact:
        platform_clickhouse_config_root: "{{ clickhouse_path_qa_root.path }}"
        platform_clickhouse_data_root: "/var/lib/{{ clickhouse_path_qa_root.path | basename }}"
        platform_clickhouse_log_root: "/var/log/{{ clickhouse_path_qa_root.path | basename }}"
        platform_clickhouse_deployment_id: clickhouse-qa-path
        _platform_clickhouse_local_instances:
          - id: qa-member
            config_directory: "{{ clickhouse_path_qa_root.path }}/clickhouse-qa-path/qa-member"
            data_directory: "/var/lib/{{ clickhouse_path_qa_root.path | basename }}/clickhouse-qa-path/qa-member"
            log_directory: "/var/log/{{ clickhouse_path_qa_root.path | basename }}/clickhouse-qa-path/qa-member"

    - name: Проверка размещения временного каталога только внутри разрешённой области QA
      ansible.builtin.assert:
        that: clickhouse_path_qa_root.path is match('^/etc/platform-clickhouse-qa-[A-Za-z0-9_-]+$')
        fail_msg: CLICKHOUSE_QA_PATH_UNSAFE

    - name: Проверка безопасных путей ClickHouse и отклонения подменённых путей
      block:
        - name: Создание временного тестового каталога с ожидаемым владельцем
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Проверка пустого корневого каталога и его владельца без изменений
          ansible.builtin.include_role:
            name: platform.clickhouse.clickhouse_tls
            tasks_from: path_safety.yml

        - name: Имитация неуправляемого владельца в управляемом корне
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            owner: platform-clickhouse
            group: platform-clickhouse

        - name: "Проверка отклонения корневого каталога с чужим владельцем"
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: FOREIGN_ROOT_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_ANCESTOR_PATH' in (ansible_failed_result | to_json)"
                  - "'FOREIGN_ROOT_ADMITTED' not in (ansible_failed_result | to_json)"

        - name: Восстановление владельца root перед следующим изолированным тестом
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            owner: root
            group: root

        - name: Удаление одноразового корня перед заменой ссылки
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: absent

        - name: Замена точной корневой символической ссылки на несвязанный каталог
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            src: /var/tmp
            state: link

        - name: Отклонение замененного управляемого корня
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: ROOT_SYMLINK_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_ANCESTOR_PATH' in (ansible_failed_result | to_json)"
                  - "'ROOT_SYMLINK_ADMITTED' not in (ansible_failed_result | to_json)"

        - name: Удаление тестовой символической ссылки без перехода по ней
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}"
            state: absent

        - name: Повторное создание защищённых корневого каталога и каталога развёртывания
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - "{{ platform_clickhouse_config_root }}"
            - "{{ platform_clickhouse_config_root }}/clickhouse-qa-path"

        - name: Создание защищённого каталога экземпляра службы
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}/clickhouse-qa-path/qa-member"
            state: directory
            owner: platform-clickhouse
            group: platform-clickhouse
            mode: '0700'

        - name: Замена защищённого пути PKI символической ссылкой
          ansible.builtin.file:
            path: "{{ platform_clickhouse_config_root }}/clickhouse-qa-path/qa-member/pki"
            src: /var/tmp
            state: link

        - name: Отклонение подменённого защищённого пути PKI
          block:
            - ansible.builtin.include_role:
                name: platform.clickhouse.clickhouse_tls
                tasks_from: path_safety.yml
            - ansible.builtin.fail:
                msg: PRIVATE_PKI_SYMLINK_ADMITTED
          rescue:
            - ansible.builtin.assert:
                that:
                  - "'CLICKHOUSE_FOREIGN_PRIVATE_PATH' in (ansible_failed_result | to_json)"
                  - "'PRIVATE_PKI_SYMLINK_ADMITTED' not in (ansible_failed_result | to_json)"

      always:
        - name: Удаление только временного тестового каталога или символической ссылки
          ansible.builtin.file:
            path: "{{ clickhouse_path_qa_root.path }}"
            state: absent
          when: clickhouse_path_qa_root.path is match('^/etc/platform-clickhouse-qa-[A-Za-z0-9_-]+$')
