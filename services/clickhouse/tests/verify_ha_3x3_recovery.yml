---
- name: "Проверка работы двух голосующих узлов и восстановление третьей реплики"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    clickhouse_qa_root: "{{ lookup('ansible.builtin.env', 'PLATFORM_CLICKHOUSE_QA_ROOT') }}"
    clickhouse_qa_phase: "{{ lookup('ansible.builtin.env', 'PLATFORM_CLICKHOUSE_QA_PHASE') }}"
    clickhouse_qa_hosts: >-
      {{ ['192.168.56.101', '192.168.56.102']
         if clickhouse_qa_phase == 'degraded'
         else ['192.168.56.101', '192.168.56.102', '192.168.56.103'] }}
    clickhouse_qa_password: "{{ lookup('ansible.builtin.file', clickhouse_qa_root ~ '/default-password', lstrip=False, rstrip=False) }}"
  tasks:
    - name: Проверка выбранного этапа восстановления и изолированного каталога QA
      ansible.builtin.assert:
        that:
          - clickhouse_qa_phase in ['degraded', 'restored']
          - clickhouse_qa_root is match('^/var/tmp/platform-clickhouse-qa-[A-Za-z0-9]+$')

    - name: Фиксация еще одной строки, пока сервер node3 и Keeper остановлены
      ansible.builtin.uri:
        url: https://192.168.56.101:8460/
        method: POST
        body: INSERT INTO default.si09_ha3x3 VALUES (2)
        url_username: default
        url_password: "{{ clickhouse_qa_password }}"
        force_basic_auth: true
        ca_path: "{{ clickhouse_qa_root }}/pki3x3/ca-chain.pem"
        validate_certs: true
        status_code: 200
      when: clickhouse_qa_phase == 'degraded'
      no_log: true

    - name: Чтение обеих зафиксированных строк с каждого ожидаемого активного хоста
      ansible.builtin.uri:
        url: "https://{{ item }}:8460/?query=SELECT%20count()%20FROM%20default.si09_ha3x3"
        method: GET
        url_username: default
        url_password: "{{ clickhouse_qa_password }}"
        force_basic_auth: true
        ca_path: "{{ clickhouse_qa_root }}/pki3x3/ca-chain.pem"
        validate_certs: true
        return_content: true
        status_code: 200
      loop: "{{ clickhouse_qa_hosts }}"
      register: clickhouse_qa_recovery_read
      until: clickhouse_qa_recovery_read.content | default('') | trim == '2'
      retries: 20
      delay: 2
      no_log: true

    - name: Проверка наличия записанных строк на всех ожидаемых активных узлах
      ansible.builtin.assert:
        that:
          - clickhouse_qa_recovery_read.results | length == clickhouse_qa_hosts | length
          - clickhouse_qa_recovery_read.results | map(attribute='status') | unique | list == [200]
          - clickhouse_qa_recovery_read.results | map(attribute='content') | map('trim') | unique | list == ['2']
        fail_msg: CLICKHOUSE_3X3_RECOVERY_NOT_PROVEN
      no_log: true
