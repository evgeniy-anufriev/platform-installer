---
- name: Выбор сгенерированных местоположений границ пути
  ansible.builtin.set_fact:
    _vault_test_root: "{{ vault_path_test_dir.path }}/{{ vault_path_scenario.root }}"
    _vault_test_deployment: "{{ vault_path_test_dir.path }}/{{ vault_path_scenario.root }}/deployment"
    _vault_test_member: "{{ vault_path_test_dir.path }}/{{ vault_path_scenario.root }}/deployment/member"
    _vault_test_outside: "{{ vault_path_test_dir.path }}/outside-{{ vault_path_scenario.root }}-{{ vault_path_scenario.component }}"
    _vault_test_rejected: false

- name: Создание безопасных предков и внешнего стража
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: >-
    {{ [_vault_test_root, _vault_test_outside]
    + ([_vault_test_deployment] if vault_path_scenario.component != 'deployment' else [])
    + ([_vault_test_member] if vault_path_scenario.component == 'pki' else []) }}

- name: Создать внешний контрольный индикатор, который не сможет изменить ни один отклоненный путь
  ansible.builtin.copy:
    content: unchanged
    dest: "{{ _vault_test_outside }}/sentinel"
    owner: root
    group: root
    mode: '0600'

- name: Выбрать точное местоположение символической ссылки потомка
  ansible.builtin.set_fact:
    _vault_test_link: >-
      {{ _vault_test_deployment if vault_path_scenario.component == 'deployment'
      else (_vault_test_member if vault_path_scenario.component == 'member'
      else _vault_test_member ~ '/pki') }}

- name: Создать контрольный список родительских каталогов тестового пути Vault
  ansible.builtin.set_fact:
    _vault_test_checks: >-
      {{ [{'path': _vault_test_root, 'owner': 'root'}]
      + ([{'path': _vault_test_deployment, 'owner': 'root'}] if vault_path_scenario.component != 'deployment' else [])
      + ([{'path': _vault_test_member, 'owner': 'service'}] if vault_path_scenario.component == 'pki' else [])
      + [{'path': _vault_test_link, 'owner': 'service'}] }}

- name: Заменить только выбранный сгенерированный компонент пути символической ссылкой
  ansible.builtin.file:
    src: "{{ _vault_test_outside }}"
    dest: "{{ _vault_test_link }}"
    state: link

- name: Потребовать, чтобы общий производственный валидатор отклонял перед последующими операциями записи
  block:
    - name: Применить точный валидатор компонента пути Vault
      ansible.builtin.include_tasks: ../ansible_collections/platform/vault/roles/vault_tls/tasks/validate_owned_paths.yml
      vars:
        _platform_vault_path_checks: "{{ _vault_test_checks }}"

    - name: Проверить недоступность контрольной задачи изменения после отклонения небезопасного пути Vault
      ansible.builtin.file:
        path: "{{ _vault_test_outside }}/must-not-exist"
        state: touch
  rescue:
    - name: Записать, что небезопасный путь отклонен
      ansible.builtin.set_fact:
        _vault_test_rejected: true

- name: Убедиться, что отклонение произошло до внесения каких-либо внешних изменений
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ _vault_test_outside }}/sentinel"
    - "{{ _vault_test_outside }}/must-not-exist"
  register: _vault_test_outside_stats

- name: Прочитать ограниченный внешний страж после отклонения
  ansible.builtin.slurp:
    src: "{{ _vault_test_outside }}/sentinel"
  register: _vault_test_sentinel_content

- name: Подтверждение отклонения небезопасного пути и неизменности внешнего состояния
  ansible.builtin.assert:
    that:
      - _vault_test_rejected
      - _vault_test_outside_stats.results[0].stat.exists
      - not _vault_test_outside_stats.results[1].stat.exists
      - _vault_test_sentinel_content.content | b64decode == 'unchanged'
    fail_msg: VAULT_PATH_BOUNDARY_TEST_FAILED
