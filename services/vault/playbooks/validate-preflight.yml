---
- name: Выполнение предварительной проверки Vault только для чтения в изолированном локальном пространстве имен
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Загрузка значений по умолчанию Vault
      ansible.builtin.include_vars: ../ansible_collections/platform/vault/roles/vault_tls/defaults/main.yml

    - name: Загрузка данных автономного предварительного проверочного теста
      ansible.builtin.include_vars: "{{ platform_vault_fixture }}"

    - name: Проверка входных данных роли Vault
      ansible.builtin.include_role:
        name: platform.vault.vault_tls
        tasks_from: validate.yml

    - name: Нормализация входных данных роли Vault
      ansible.builtin.include_role:
        name: platform.vault.vault_tls
        tasks_from: normalize.yml

    - name: "Привязка тестового экземпляра сервиса к localhost для проверок без изменений"
      ansible.builtin.set_fact:
        _platform_vault_instances: "{{ _platform_vault_instances | map('combine', {'host': inventory_hostname}) | list }}"

    - name: Предварительная проверка узла Vault без внесения изменений
      ansible.builtin.include_role:
        name: platform.vault.vault_tls
        tasks_from: preflight.yml
