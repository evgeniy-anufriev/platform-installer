---
- name: Проверка входных данных роли Vault без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Загрузка значений по умолчанию Vault
      ansible.builtin.include_vars: ../ansible_collections/platform/vault/roles/vault_tls/defaults/main.yml
    - name: Загрузка явных автономных тестовых данных Vault
      ansible.builtin.include_vars: "{{ platform_vault_fixture }}"
    - name: Проверка входных данных роли Vault
      ansible.builtin.include_role:
        name: platform.vault.vault_tls
        tasks_from: validate.yml
    - name: Нормализация входных данных роли Vault
      ansible.builtin.include_role:
        name: platform.vault.vault_tls
        tasks_from: normalize.yml
    - name: Проверка наличия неконфликтных пар Vault по умолчанию
      ansible.builtin.assert:
        that:
          - (_platform_vault_instances | map(attribute='api_port') | list) == ([8200] if platform_vault_mode == 'standalone' else [8200, 8202, 8204])
          - (_platform_vault_instances | map(attribute='cluster_port') | list) == ([8201] if platform_vault_mode == 'standalone' else [8201, 8203, 8205])
          - (_platform_vault_instances | map(attribute='instance_name') | list) == ['platform-vault@vault-standalone-1']
