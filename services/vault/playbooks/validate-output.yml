---
- name: Проверка подготовки каталога результатов Vault без обращения к целевым узлам
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Загрузка значений по умолчанию для роли Vault
      ansible.builtin.include_vars: ../ansible_collections/platform/vault/roles/vault_tls/defaults/main.yml

    - name: Создание изолированного временного корня проекта
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: platform-vault-output-test-
      register: _vault_output_test_root

    - name: Выполнение предварительной проверки вывода Vault с очисткой выделенного тестового каталога
      block:
        - name: Привязка теста к его точному временному корню проекта
          ansible.builtin.set_fact:
            platform_project_root: "{{ _vault_output_test_root.path }}"
            platform_vault_bootstrap_output_dir: ''

        - name: Подготовка пути каталога результатов развёртывания по умолчанию
          ansible.builtin.include_tasks: ../ansible_collections/platform/vault/roles/vault_tls/tasks/prepare_output.yml

        - name: Проверка защищённых прав обоих уровней каталога результатов
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ _vault_output_test_root.path }}/secrets"
            - "{{ _vault_output_test_root.path }}/secrets/{{ platform_vault_deployment_id }}"
          register: _vault_output_test_stats

        - name: Проверка ожидаемых свойств каталога результатов по умолчанию
          ansible.builtin.assert:
            that:
              - _vault_output_test_stats.results | map(attribute='stat.mode') | list == ['0700', '0700']
              - _platform_vault_bootstrap_output_dir == _vault_output_test_root.path ~ '/secrets/' ~ platform_vault_deployment_id
            fail_msg: VAULT_BOOTSTRAP_OUTPUT_PATH_INVALID

        - name: Создание символической ссылки на родительский каталог результатов для отрицательной проверки
          ansible.builtin.file:
            src: "{{ _vault_output_test_root.path }}/secrets"
            dest: "{{ _vault_output_test_root.path }}/secrets-link"
            state: link

        - name: Отклонение пути результатов, доступного через символическую ссылку
          block:
            - name: Выбор намеренно замененного пути вывода
              ansible.builtin.set_fact:
                platform_vault_bootstrap_output_dir: "{{ _vault_output_test_root.path }}/secrets-link/vault-symlink-negative"

            - name: Выполнение тех же проверок выходных границ для замененного пути
              ansible.builtin.include_tasks: ../ansible_collections/platform/vault/roles/vault_tls/tasks/prepare_output.yml
          rescue:
            - name: Проверка того, что путь символической ссылки был отклонен при проверке канонического пути
              ansible.builtin.assert:
                that:
                  - ansible_failed_task.name == 'Проверка канонического пути результатов и отсутствия символических ссылок в родительских каталогах'
                fail_msg: VAULT_TEST_SYMLINK_BOUNDARY_FAILED

        - name: Проверка того, что отклоненные выходные данные не создали каталог развертывания
          ansible.builtin.stat:
            path: "{{ _vault_output_test_root.path }}/secrets/vault-symlink-negative"
            follow: false
          register: _vault_output_symlink_target

        - name: Проверка того, что ни один каталог не опубликован через символическую ссылку
          ansible.builtin.assert:
            that: not _vault_output_symlink_target.stat.exists
            fail_msg: VAULT_TEST_SYMLINK_BOUNDARY_FAILED
      always:
        - name: Удаление выделенного временного проекта проверки вывода Vault
          ansible.builtin.file:
            path: "{{ _vault_output_test_root.path }}"
            state: absent
