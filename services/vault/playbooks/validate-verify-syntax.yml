---
# Static import lets --syntax-check parse the otherwise dynamically included
# verifier without contacting targets or executing service tasks.
- name: "Проверка синтаксиса самостоятельного playbook проверки Vault"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Статическая загрузка контракта задачи проверки Vault
      ansible.builtin.import_role:
        name: platform.vault.vault_tls
        tasks_from: verify
