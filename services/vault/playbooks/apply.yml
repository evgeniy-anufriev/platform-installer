---
- import_playbook: ../../../ansible-core/playbooks/validate.yml

- import_playbook: ../../../ansible-core/playbooks/pki-apply.yml

- name: Применение развёртывания Vault TLS
  hosts: platform_targets
  become: true
  gather_facts: false
  pre_tasks:
    - name: Применение настроек доверенной среды выполнения Vault
      ansible.builtin.include_role:
        name: platform.core.runtime_role_variables
      when: platform_execution_role_variables_by_host is defined
  roles:
    - role: platform.vault.vault_tls
      platform_vault_verify_only: false

- import_playbook: ../../integrations/playbooks/apply-endpoint.yml
