---
- name: "Проверить захват и освобождение блокировки Vault на QA-узле"
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Создание частного изолированного тестового каталога блокировки
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: platform-vault-lock-test-
      register: vault_lock_test_dir

    - name: Проверка созданной границы тестового каталога
      ansible.builtin.assert:
        that:
          - vault_lock_test_dir.path is match('^/var/tmp/platform-vault-lock-test-[A-Za-z0-9_]+$')
        fail_msg: VAULT_LOCK_TEST_PATH_INVALID

    - name: Создать файл тестовой блокировки, принадлежащий пользователю root
      ansible.builtin.file:
        path: "{{ vault_lock_test_dir.path }}/deployment.lock"
        state: touch
        owner: root
        group: root
        mode: '0600'

    - name: Создание имен временных служб systemd для конкретного вызова
      ansible.builtin.set_fact:
        vault_lock_test_suffix: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars='hexdigits') | lower }}"

    - name: Запись точных временных системных служб для ограниченной очистки
      ansible.builtin.set_fact:
        vault_lock_test_units:
          - "platform-vault-lock-test-holder-{{ vault_lock_test_suffix }}"
          - "platform-vault-lock-test-contender-{{ vault_lock_test_suffix }}"
          - "platform-vault-lock-test-normal-release-{{ vault_lock_test_suffix }}"
          - "platform-vault-lock-test-failure-{{ vault_lock_test_suffix }}"
          - "platform-vault-lock-test-recovery-{{ vault_lock_test_suffix }}"

    - name: "Проверить конкуренцию за блокировку, штатное освобождение и освобождение после сбоя"
      block:
        - name: Запустить первую службу и дождаться READY после получения блокировки flock
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - "--unit={{ vault_lock_test_units[0] }}"
              - --property=Type=notify
              - --property=NotifyAccess=all
              - --property=TimeoutStartSec=10s
              - --property=Restart=no
              - /usr/bin/flock
              - --nonblock
              - --exclusive
              - --no-fork
              - "{{ vault_lock_test_dir.path }}/deployment.lock"
              - /bin/sh
              - -c
              - "set -eu; /usr/bin/systemd-notify --ready; /usr/bin/touch {{ vault_lock_test_dir.path }}/holder-reached-ready; exec /usr/bin/sleep infinity"
          changed_when: true

        - name: "Дождаться готовности процесса, удерживающего блокировку"
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, "{{ vault_lock_test_units[0] }}.service"]
          register: vault_lock_holder_state
          changed_when: false
          until: vault_lock_holder_state.stdout == 'active'
          retries: 10
          delay: 1

        - name: Запуск конкурирующей службы systemd против удерживаемой блокировки
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - "--unit={{ vault_lock_test_units[1] }}"
              - --property=Type=notify
              - --property=NotifyAccess=all
              - --property=TimeoutStartSec=10s
              - --property=Restart=no
              - /usr/bin/flock
              - --nonblock
              - --exclusive
              - --no-fork
              - "{{ vault_lock_test_dir.path }}/deployment.lock"
              - /bin/sh
              - -c
              - "set -eu; /usr/bin/systemd-notify --ready; /usr/bin/touch {{ vault_lock_test_dir.path }}/contender-reached-ready; exec /usr/bin/sleep infinity"
          changed_when: true

        - name: "Проверить завершение конкурирующего процесса до сигнала готовности"
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, "{{ vault_lock_test_units[1] }}.service"]
          register: vault_lock_contender_state
          changed_when: false
          until: vault_lock_contender_state.stdout in ['failed', 'inactive']
          retries: 10
          delay: 1

        - name: "Проверить, что защищённый этап выполнил только владелец блокировки"
          ansible.builtin.stat:
            path: "{{ vault_lock_test_dir.path }}/{{ item }}"
          loop:
            - holder-reached-ready
            - contender-reached-ready
          register: vault_lock_markers

        - name: Определить одного победителя и заблокированного претендента
          ansible.builtin.assert:
            that:
              - vault_lock_holder_state.stdout == 'active'
              - vault_lock_contender_state.stdout in ['failed', 'inactive']
              - vault_lock_markers.results[0].stat.exists
              - not vault_lock_markers.results[1].stat.exists
            fail_msg: VAULT_LOCK_CONTENTION_TEST_FAILED

        - name: "Штатно остановить процесс, удерживающий блокировку"
          ansible.builtin.command:
            argv: [systemctl, stop, "{{ vault_lock_test_units[0] }}.service"]
          changed_when: true

        - name: "Запустить конкурирующий процесс после штатного освобождения блокировки"
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - "--unit={{ vault_lock_test_units[2] }}"
              - --property=Type=notify
              - --property=NotifyAccess=all
              - --property=TimeoutStartSec=10s
              - --property=Restart=no
              - /usr/bin/flock
              - --nonblock
              - --exclusive
              - --no-fork
              - "{{ vault_lock_test_dir.path }}/deployment.lock"
              - /bin/sh
              - -c
              - "set -eu; /usr/bin/systemd-notify --ready; exec /usr/bin/sleep infinity"
          changed_when: true

        - name: "Дождаться готовности конкурирующего процесса после освобождения блокировки"
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, "{{ vault_lock_test_units[2] }}.service"]
          register: vault_lock_released_state
          changed_when: false
          until: vault_lock_released_state.stdout == 'active'
          retries: 10
          delay: 1

        - name: "Штатно остановить конкурирующий процесс и освободить блокировку"
          ansible.builtin.command:
            argv: [systemctl, stop, "{{ vault_lock_test_units[2] }}.service"]
          changed_when: true

        - name: "Запустить владельца блокировки с имитацией сбоя после сигнала готовности"
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - "--unit={{ vault_lock_test_units[3] }}"
              - --property=Type=notify
              - --property=NotifyAccess=all
              - --property=TimeoutStartSec=10s
              - --property=Restart=no
              - /usr/bin/flock
              - --nonblock
              - --exclusive
              - --no-fork
              - "{{ vault_lock_test_dir.path }}/deployment.lock"
              - /bin/sh
              - -c
              - "set -eu; /usr/bin/systemd-notify --ready; exit 42"
          changed_when: true

        - name: Дождаться сбоя процесса держателя блокировки
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, "{{ vault_lock_test_units[3] }}.service"]
          register: vault_lock_failed_state
          changed_when: false
          until: vault_lock_failed_state.stdout in ['failed', 'inactive']
          retries: 10
          delay: 1

        - name: Получить блокировку после очистки состояния прежнего владельца
          ansible.builtin.command:
            argv:
              - systemd-run
              - --quiet
              - --no-block
              - "--unit={{ vault_lock_test_units[4] }}"
              - --property=Type=notify
              - --property=NotifyAccess=all
              - --property=TimeoutStartSec=10s
              - --property=Restart=no
              - /usr/bin/flock
              - --nonblock
              - --exclusive
              - --no-fork
              - "{{ vault_lock_test_dir.path }}/deployment.lock"
              - /bin/sh
              - -c
              - "set -eu; /usr/bin/systemd-notify --ready; exec /usr/bin/sleep infinity"
          changed_when: true

        - name: "Дождаться готовности нового владельца после сбоя прежнего владельца блокировки"
          ansible.builtin.command:
            argv: [systemctl, show, --property=ActiveState, --value, "{{ vault_lock_test_units[4] }}.service"]
          register: vault_lock_recovery_state
          changed_when: false
          until: vault_lock_recovery_state.stdout == 'active'
          retries: 10
          delay: 1

      always:
        - name: Остановить временные службы systemd проверки блокировки Vault
          ansible.builtin.command:
            argv: [systemctl, stop, "{{ item }}.service"]
          loop: "{{ vault_lock_test_units }}"
          changed_when: false
          failed_when: false

        - name: Сбросить состояние failed временных служб systemd проверки блокировки Vault
          ansible.builtin.command:
            argv: [systemctl, reset-failed, "{{ item }}.service"]
          loop: "{{ vault_lock_test_units }}"
          changed_when: false
          failed_when: false

        - name: Удалить точный созданный каталог теста блокировки
          ansible.builtin.file:
            path: "{{ vault_lock_test_dir.path }}"
            state: absent
