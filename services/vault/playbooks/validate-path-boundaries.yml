---
- name: Доказать, что предварительная проверка пути Vault отклоняет символические ссылки потомков перед модификацией
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: "Создать временный каталог для проверок безопасности путей"
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: platform-vault-path-test-
      register: vault_path_test_dir

    - name: Проверка каждого случая развертывания /member/PKI с дочерней ссылкой
      block:
        - name: Привязать синтетический сервис UID к тестовым данным, принадлежащим пользователю root
          ansible.builtin.set_fact:
            _platform_vault_service_uid:
              rc: 0
              stdout: '0'

        - name: Отклонить символические ссылки на каждой границе управляемого потомка
          ansible.builtin.include_tasks: validate-path-scenario.yml
          loop:
            - {root: config, component: deployment}
            - {root: config, component: member}
            - {root: config, component: pki}
            - {root: data, component: deployment}
            - {root: data, component: member}
            - {root: log, component: deployment}
            - {root: log, component: member}
          loop_control:
            loop_var: vault_path_scenario
            label: "{{ vault_path_scenario.root }}/{{ vault_path_scenario.component }}"

      always:
        - name: Удалить только сгенерированное дерево тестовых данных границы пути
          ansible.builtin.file:
            path: "{{ vault_path_test_dir.path }}"
            state: absent
