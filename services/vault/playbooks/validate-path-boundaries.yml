---
- name: Проверка отклонения вложенных символических ссылок до изменения путей Vault
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: "Создание временного каталога для проверок безопасности путей"
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: platform-vault-path-test-
      register: vault_path_test_dir

    - name: Проверка каждого случая развертывания /member/PKI с дочерней ссылкой
      block:
        - name: Задание тестового UID сервиса для проверки каталогов с владельцем root
          ansible.builtin.set_fact:
            _platform_vault_service_uid:
              rc: 0
              stdout: '0'

        - name: Отклонение символических ссылок на каждой границе управляемого потомка
          ansible.builtin.include_tasks: validate-path-scenario.yml
          loop:
            - {root: config, component: deployment}
            - {root: config, component: member}
            - {root: config, component: pki}
            - {root: data, component: deployment}
            - {root: data, component: member}
            - {root: log, component: deployment}
            - {root: log, component: member}
          loop_control:
            loop_var: vault_path_scenario
            label: "{{ vault_path_scenario.root }}/{{ vault_path_scenario.component }}"

      always:
        - name: Удаление только сгенерированного дерева тестовых данных проверки путей
          ansible.builtin.file:
            path: "{{ vault_path_test_dir.path }}"
            state: absent
