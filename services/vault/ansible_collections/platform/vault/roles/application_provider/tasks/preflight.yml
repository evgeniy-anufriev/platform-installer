---
- name: Чтение информации о владельце документа и версии CAS до того, как провайдер запишет его
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/{{ item.mount }}/data/{{ item.document }}"
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    ca_path: "{{ platform_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    status_code: [200, 404]
    return_content: true
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  loop: "{{ platform_vault_application_job.documents }}"
  when: not application_vault_identity_only | default(false)
  register: application_vault_document_states
  no_log: true

- name: Отклонение неуправляемых или удалённых документов перед получением сгенерированных паролей
  ansible.builtin.assert:
    that: item | platform.vault.application_kv_delta({}, item.item.owner) is mapping
    fail_msg: APPLICATION_VAULT_DOCUMENT_OWNERSHIP_INVALID
  loop: "{{ application_vault_document_states.results | default([]) }}"
  when: not application_vault_identity_only | default(false)
  no_log: true

- name: Предварительная проверка значений документов и создание недостающих паролей приложений
  platform.vault.application_document:
    document: "{{ item }}"
    current: "{{ application_vault_document_states.results[application_vault_document_index] }}"
    provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
    secret_root: "{{ platform_application_secret_root }}"
    secret_files: "{{ platform_application_secret_files | combine(platform_application_credential_files | default({})) }}"
  loop: "{{ platform_vault_application_job.documents }}"
  loop_control:
    index_var: application_vault_document_index
  changed_when: false
  when: not application_vault_identity_only | default(false)
  register: application_vault_document_sources
  no_log: true

- name: Подтверждение владельца и однократное сохранение исходного содержимого и версий CAS
  ansible.builtin.set_fact:
    platform_application_vault_values: "{{ platform_application_vault_values | default({}) | combine(application_vault_document_sources.results | platform.vault.application_vault_source_cache(platform_vault_application_job.providerId)) }}"
    platform_application_vault_documents: "{{ platform_application_vault_documents | default({}) | combine(application_vault_document_states.results | platform.vault.application_vault_document_cache(application_vault_document_sources.results | platform.vault.application_vault_source_cache(platform_vault_application_job.providerId), platform_vault_application_job.providerId)) }}"
    platform_application_generated_values: "{{ platform_application_generated_values | default({}) | combine(application_vault_document_sources.results | map(attribute='generated') | list | combine) }}"
  when: not application_vault_identity_only | default(false)
  no_log: true

- name: Чтение текущих политики и роли перед изменением Vault
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/{{ item }}"
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    ca_path: "{{ platform_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    status_code: [200, 404]
    return_content: true
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  loop:
    - "sys/policies/acl/{{ platform_vault_application_job.identity }}"
    - "auth/approle/role/{{ platform_vault_application_job.identity }}"
  register: application_vault_identity_before
  when: platform_vault_application_job.identity is defined
  no_log: true

- name: Отклонение неуправляемой политики или неожиданных политик роли
  ansible.builtin.assert:
    that:
      - application_vault_identity_before.results[0].status == 404 or application_vault_identity_before.results[0].json.data.policy.startswith('# ' ~ platform_vault_application_job.owner ~ '\n')
      - application_vault_identity_before.results[1].status == 404 or (application_vault_identity_before.results[0].status == 200 and application_vault_identity_before.results[1].json.data.token_policies == [platform_vault_application_job.identity])
    fail_msg: APPLICATION_VAULT_IDENTITY_OWNERSHIP_INVALID
  when: platform_vault_application_job.identity is defined
  no_log: true
