---
- name: Проверка существующего хранилища KV v2 источника учётных данных Vault
  ansible.builtin.assert:
    that:
      - application_vault_provider.mounts[application_vault_source.mount ~ '/'].type == 'kv'
      - application_vault_provider.mounts[application_vault_source.mount ~ '/'].options.version == '2'
    fail_msg: APPLICATION_VAULT_KV_V2_REQUIRED
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[application_vault_source.providerId] }}"
  no_log: true

- name: Чтение существующего поля учетной записи через соединение с библиотекой Vault
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/{{ application_vault_source.mount }}/data/{{ application_vault_source.document }}"
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    ca_path: "{{ platform_application_secret_root }}/vault-{{ application_vault_source.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    return_content: true
    status_code: [200]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[application_vault_source.providerId] }}"
  register: application_vault_source_value
  no_log: true

- name: Проверка наличия и допустимости объявленного поля учётных данных
  ansible.builtin.assert:
    that:
      - application_vault_source_value.json.data.data[application_vault_source.field] is string
      - application_vault_source_value.json.data.data[application_vault_source.field] | length > 0
      - application_vault_source_value.json.data.data[application_vault_source.field] | length <= 4096
    fail_msg: APPLICATION_VAULT_SOURCE_FIELD_INVALID
  no_log: true

- name: Подготовка входных данных провайдера только в защищенной среде выполнения
  ansible.builtin.copy:
    content: "{{ application_vault_source_value.json.data.data[application_vault_source.field] }}"
    dest: "{{ platform_application_secret_root }}/{{ application_vault_source.passwordRef }}"
    mode: '0600'
  changed_when: false
  when: application_vault_source.passwordRef is defined
  no_log: true

- name: Привязка защищённых производных входных данных без замены желаемого источника
  ansible.builtin.set_fact:
    platform_application_credential_files: "{{ platform_application_credential_files | default({}) | combine({application_vault_source.passwordRef: platform_application_secret_root ~ '/' ~ application_vault_source.passwordRef}) }}"
  when: application_vault_source.passwordRef is defined
  no_log: true
