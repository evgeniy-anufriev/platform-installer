---
- name: Recheck own policy and role immediately before reconciliation
  ansible.builtin.include_tasks: preflight.yml
  vars:
    application_vault_identity_only: true

- name: Reconcile this instance account documents
  ansible.builtin.include_tasks: library.yml

- name: Resolve IPv4 client destination on each Docker placement
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ application_vault_provider.routeAddress }}"]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  delegate_to: "{{ item }}"
  loop: "{{ platform_vault_application_job.hosts }}"
  register: application_vault_addresses
  changed_when: false

- name: Resolve the source IPv4 route on each actual Docker placement
  ansible.builtin.command:
    argv: [ip, -json, route, get, "{{ item.stdout.split()[0] }}"]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  delegate_to: "{{ item.item }}"
  loop: "{{ application_vault_addresses.results }}"
  register: application_vault_routes
  changed_when: false

- name: Bind the accepted subnet policy and own AppRole settings
  ansible.builtin.set_fact:
    application_vault_role:
      bind_secret_id: false
      token_bound_cidrs: "{{ application_vault_routes.results | map(attribute='stdout') | map('from_json') | list | platform.vault.application_vault_cidrs }}"
      token_policies: ["{{ platform_vault_application_job.identity }}"]
      token_no_default_policy: true
      token_type: service
      token_ttl: "{{ platform_vault_application_token_ttl }}"
      token_max_ttl: "{{ platform_vault_application_token_max_ttl }}"
  no_log: true

- name: Update only differing owned policy
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/sys/policies/acl/{{ platform_vault_application_job.identity }}"
    method: PUT
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    body_format: json
    body: {policy: "{{ platform_vault_application_job.policy }}"}
    ca_path: "{{ platform_postgresql_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    status_code: [200, 204]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  when: application_vault_identity_before.results[0].status == 404 or application_vault_identity_before.results[0].json.data.policy != platform_vault_application_job.policy
  changed_when: true
  no_log: true

- name: Reconcile this owned AppRole without creating SecretID
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/auth/approle/role/{{ platform_vault_application_job.identity }}"
    method: POST
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    body_format: json
    body: "{{ application_vault_role }}"
    ca_path: "{{ platform_postgresql_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    status_code: [200, 204]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  when: "{{ application_vault_identity_before.results[1] | platform.vault.application_vault_role_changed(application_vault_role) }}"
  changed_when: true
  no_log: true

- name: Read stable RoleID through the same resolved connection
  ansible.builtin.uri:
    url: "{{ application_vault_provider.url }}/v1/auth/approle/role/{{ platform_vault_application_job.identity }}/role-id"
    headers: {X-Vault-Token: "{{ application_vault_provider.token }}"}
    ca_path: "{{ platform_postgresql_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    return_content: true
    status_code: [200]
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
  register: application_vault_role_id
  no_log: true

- name: Preserve private identity delivery only for this invocation
  ansible.builtin.set_fact:
    platform_application_vault_identities: "{{ platform_application_vault_identities | combine({(platform_vault_application_job.libraryId ~ '/' ~ platform_vault_application_job.instanceId): {'roleId': application_vault_role_id.json.data.role_id, 'providerId': platform_vault_application_job.providerId}}) }}"
  no_log: true
