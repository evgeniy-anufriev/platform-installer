---
- name: Проверка документов, политики и роли непосредственно перед обновлением
  ansible.builtin.include_tasks: preflight.yml
  vars:
    application_vault_identity_only: false
    application_vault_reuse_documents: true

- name: Согласование документов учётных записей экземпляра Vault
  ansible.builtin.include_tasks: library.yml

- name: Подготовка сетевых ограничений AppRole Vault
  vars:
    application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
    application_vault_network_scope: "{{ [platform_vault_application_job.providerId, platform_vault_application_job.hosts] | to_json }}"
    application_vault_network_keys: "{{ platform_application_vault_network_keys | default({}) }}"
    application_vault_network_key: >-
      {{ (application_vault_network_keys[application_vault_network_scope]
          if application_vault_network_scope in application_vault_network_keys
          else ([platform_vault_application_job.providerId, application_vault_provider.routeAddress,
                 platform_vault_application_job.hosts,
                 platform_vault_application_job.hosts | map('extract', hostvars) |
                   map(attribute='platform_docker_lxc_bridge', default='lxcbr0') | list] | to_json)) | string }}
  block:
    - name: Однократное обнаружение сетей для точной группы размещений провайдера
      ansible.builtin.include_tasks: networks.yml
      when: application_vault_network_key not in (platform_application_vault_networks | default({}))

    - name: Привязка выбранной политики подсети и управляемых настроек AppRole
      ansible.builtin.set_fact:
        application_vault_role:
          bind_secret_id: false
          token_bound_cidrs: "{{ platform_application_vault_networks[application_vault_network_key].cidrs }}"
          token_policies: ["{{ platform_vault_application_job.identity }}"]
          token_no_default_policy: true
          token_type: service
          token_ttl: "{{ platform_vault_application_token_ttl }}"
          token_max_ttl: "{{ platform_vault_application_token_max_ttl }}"
      delegate_facts: false
      no_log: true

- name: Сохранение ранее управляемых путей чтения экземпляра во время дополнительных обновлений
  ansible.builtin.set_fact:
    application_vault_retained_policy: >-
      {{ application_vault_identity_before.results[0] |
         platform.vault.application_vault_retained_policy(platform_vault_application_job.policy, platform_vault_application_job.owner)
         if (platform_vault_application_job.retainPolicy | default(false) or
             '# application.connection-retention/v1' in (application_vault_identity_before.results[0].json.data.policy | default('')))
         else platform_vault_application_job.policy }}
  delegate_facts: false
  no_log: true

- name: Согласование политики, AppRole и чтение RoleID через разрешённое соединение
  platform.vault.application_document:
    operation: identity
    provider_id: "{{ platform_vault_application_job.providerId }}"
    provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
    secret_root: "{{ platform_application_secret_root }}"
    identity: "{{ platform_vault_application_job.identity }}"
    owner: "{{ platform_vault_application_job.owner }}"
    policy: "{{ application_vault_retained_policy }}"
    role: "{{ application_vault_role }}"
    current: "{{ application_vault_identity_before.results }}"
  register: application_vault_role_id
  no_log: true

- name: Сохранение результатов доставки учётных данных провайдера Vault в контексте операции
  ansible.builtin.set_fact:
    platform_application_vault_identities: "{{ platform_application_vault_identities | combine({(platform_vault_application_job.libraryId ~ '/' ~ platform_vault_application_job.instanceId): {'roleId': application_vault_role_id.role_id, 'providerId': platform_vault_application_job.providerId}}) }}"
  no_log: true
