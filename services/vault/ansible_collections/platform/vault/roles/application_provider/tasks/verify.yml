---
- name: Проверка владения частным удостоверением и пространства имен без изменений
  platform.core.application_identity_files:
    account: "{{ application_runtime_job.account }}"
    user: "{{ application_runtime_job.settings.user | default('0:0') }}"
    instance_path: "{{ application_vault_instance_path }}"
    preflight: true
  no_log: true

- name: Чтение постоянного RoleID только в память времени выполнения
  ansible.builtin.slurp:
    src: "{{ application_vault_instance_path }}/vault/role-id"
  register: application_vault_verify_identity
  no_log: true

- name: Проверка подлинности только с помощью экземпляра RoleID через его разрешенное соединение
  ansible.builtin.uri:
    url: "{{ application_runtime_job.vault.endpoint_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body: {role_id: "{{ application_vault_verify_identity.content | b64decode }}"}
    ca_path: "{{ application_vault_instance_path }}/vault/ca.pem"
    validate_certs: true
    follow_redirects: none
    timeout: 10
    status_code: [200]
    return_content: true
  register: application_vault_verify_login
  no_log: true

- name: Проверка заявленных возможностей чтения без сохранения пробного токена
  block:
    - name: Чтение только объявленных секретных путей экземпляра
      ansible.builtin.uri:
        url: "{{ application_runtime_job.vault.endpoint_url }}/v1/{{ item }}"
        headers: {X-Vault-Token: "{{ application_vault_verify_login.json.auth.client_token }}"}
        ca_path: "{{ application_vault_instance_path }}/vault/ca.pem"
        validate_certs: true
        follow_redirects: none
        timeout: 10
        status_code: [200]
        return_content: true
      loop: "{{ application_runtime_job.vault.readFields.keys() | list }}"
      register: application_vault_verify_reads
      no_log: true
    - name: Требовать, чтобы каждое объявленное поле существовало и было непустым
      ansible.builtin.assert:
        that: "{{ application_vault_verify_reads.results | platform.vault.application_vault_verify_fields(application_runtime_job.vault.readFields) }}"
        fail_msg: APPLICATION_VAULT_REQUIRED_FIELD_MISSING
      no_log: true
  always:
    - name: Отозвать токен проверки учётных данных Vault
      ansible.builtin.uri:
        url: "{{ application_runtime_job.vault.endpoint_url }}/v1/auth/token/revoke-self"
        method: POST
        headers: {X-Vault-Token: "{{ application_vault_verify_login.json.auth.client_token }}"}
        ca_path: "{{ application_vault_instance_path }}/vault/ca.pem"
        validate_certs: true
        follow_redirects: none
        timeout: 10
        status_code: [200, 204]
      no_log: true
