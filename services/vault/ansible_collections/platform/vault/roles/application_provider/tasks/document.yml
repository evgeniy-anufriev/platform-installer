- name: Вычислить минимальные изменения служебных документов
  ansible.builtin.set_fact:
    application_vault_delta: "{{ platform_application_vault_documents[document_key] | platform.vault.application_kv_delta(platform_application_vault_values[document_key], application_vault_document.owner) }}"
  delegate_facts: false
  vars:
    document_key: "{{ platform_vault_application_job.providerId ~ ':' ~ application_vault_document.mount ~ '/' ~ application_vault_document.document }}"
  no_log: true

- name: Сохранить безопасную диагностику записи документа Vault
  block:
    - name: Записывать только разные поля с помощью CAS
      ansible.builtin.uri:
        url: "{{ application_vault_provider.url }}/v1/{{ application_vault_document.mount }}/data/{{ application_vault_document.document }}"
        method: "{{ application_vault_delta.method }}"
        headers:
          X-Vault-Token: "{{ application_vault_provider.token }}"
          Content-Type: "{{ 'application/merge-patch+json' if application_vault_delta.method == 'PATCH' else 'application/json' }}"
        body_format: json
        body: "{{ application_vault_delta.body }}"
        ca_path: "{{ platform_application_secret_root }}/vault-{{ platform_vault_application_job.providerId }}-ca.pem"
        validate_certs: true
        follow_redirects: none
        timeout: 10
        status_code: [200, 400]
      vars:
        application_vault_provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
      register: application_vault_document_write
      when: application_vault_delta.changed
      changed_when: application_vault_document_write.status == 200
      no_log: true
  rescue:
    - name: "Ошибка записи документа Vault (HTTP {{ ansible_failed_result.status | default(-1) | int }}, {{ application_vault_write_category }})"
      ansible.builtin.fail:
        msg: APPLICATION_VAULT_DOCUMENT_WRITE_FAILED
      vars:
        application_vault_write_message: "{{ ansible_failed_result.msg | default('') | string }}"
        application_vault_write_category: >-
          {{ 'template' if ('undefined' in application_vault_write_message | lower or 'recursive' in application_vault_write_message | lower)
             else 'tls' if ('certificate' in application_vault_write_message | lower or 'ssl' in application_vault_write_message | lower)
             else 'timeout' if ('timed out' in application_vault_write_message | lower or 'timeout' in application_vault_write_message | lower)
             else 'http' if (ansible_failed_result.status | default(-1) | int > 0)
             else 'module' }}

- name: Перечитать один раз о конфликте CAS и сохранить промежуточные поля
  ansible.builtin.include_tasks: document_retry.yml
  when: >-
    application_vault_delta.changed and
    (application_vault_document_write.status | int == 400) and
    ('check-and-set' in (application_vault_document_write.json.errors | default([]) | join(' ') | lower))
  no_log: true

- name: Сбой закрытия при записи или конфликте CAS без слепой перезаписи
  ansible.builtin.assert:
    that: not application_vault_delta.changed or application_vault_document_write.status | int == 200
    fail_msg: APPLICATION_VAULT_DOCUMENT_CAS_CONFLICT
  no_log: true
