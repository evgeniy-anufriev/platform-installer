---
- name: Пакетное согласование документов Vault с проверкой владельца и версии CAS
  block:
    - name: Согласование документов в одном вызове существующего провайдера
      platform.vault.application_document:
        operation: documents
        documents: "{{ platform_vault_application_job.documents }}"
        provider_id: "{{ platform_vault_application_job.providerId }}"
        provider: "{{ platform_application_vault_runtime[platform_vault_application_job.providerId] }}"
        states: "{{ platform_application_vault_documents }}"
        values: "{{ platform_application_vault_values }}"
        secret_root: "{{ platform_application_secret_root }}"
      register: application_vault_document_result
      no_log: true
  rescue:
    - name: "Ошибка записи документа Vault (HTTP {{ application_vault_document_result.http_status | default(-1) | int }}, {{ application_vault_document_result.category | default('module') }})"
      ansible.builtin.fail:
        msg: "{{ application_vault_document_result.msg | regex_search('APPLICATION_VAULT_[A-Z_]+') | default('APPLICATION_VAULT_DOCUMENT_WRITE_FAILED', true) }}"
