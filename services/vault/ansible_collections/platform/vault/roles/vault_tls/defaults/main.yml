---
platform_vault_mode: standalone
platform_vault_deployment_id: vault
platform_vault_project_id: ''
platform_vault_api_port: 8200
platform_vault_cluster_port: 8201
platform_vault_unseal_shares: 3
platform_vault_unseal_threshold: 2
platform_vault_tls_profile: infrastructure-tls
platform_vault_instances: []
platform_vault_verify_only: false
platform_vault_user: platform-vault
platform_vault_group: platform-vault
platform_vault_config_root: /etc/platform-vault
platform_vault_data_root: /var/lib/platform-vault
platform_vault_log_root: /var/log/platform-vault
platform_vault_bootstrap_output_dir: ''
platform_vault_admin_token: ''
platform_vault_unseal_keys: []
platform_vault_bootstrap_lock_root: /run/lock/platform-vault
