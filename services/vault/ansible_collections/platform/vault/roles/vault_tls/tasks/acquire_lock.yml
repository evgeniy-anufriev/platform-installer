---
- name: Проверка канонического хоста блокировки Vault
  ansible.builtin.assert:
    that:
      - platform_vault_bootstrap_lock_root == '/run/lock/' ~ platform_vault_name
      - platform_vault_lock_token is string
      - platform_vault_lock_token is match('^[0-9a-f]{32}$')
    fail_msg: VAULT_LOCK_INPUT_INVALID

- name: Проверить фиксированный каталог блокировки Vault без перехода по символическим ссылкам
  ansible.builtin.stat:
    path: "/run/lock/{{ platform_vault_name }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_vault_lock_root_stat

- name: Отклонить замененный или неправильно принадлежащий каталог блокировки Vault
  ansible.builtin.assert:
    that:
      - not _platform_vault_lock_root_stat.stat.exists or (_platform_vault_lock_root_stat.stat.isdir and not _platform_vault_lock_root_stat.stat.islnk and _platform_vault_lock_root_stat.stat.uid == 0)
    fail_msg: VAULT_LOCK_DIRECTORY_UNSAFE

- name: Создать каталог блокировки, принадлежащий пользователю root Vault, в каноническом первом экземпляре службы
  ansible.builtin.file:
    path: "/run/lock/{{ platform_vault_name }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Получение идентификатора блокировки общего развертывания
  ansible.builtin.set_fact:
    _platform_vault_lock_key: "{{ platform_vault_deployment_id | hash('sha256') }}"
    _platform_vault_lock_unit: "{{ platform_vault_name }}-lock-{{ platform_vault_lock_token }}"

- name: Проверить объект постоянной общей блокировки, не переходя по символическим ссылкам
  ansible.builtin.stat:
    path: "{{ platform_vault_bootstrap_lock_root }}/{{ _platform_vault_lock_key }}.lock"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_vault_lock_stat

- name: Отклонить небезопасный ранее существовавший объект блокировки Vault
  ansible.builtin.assert:
    that:
      - not _platform_vault_lock_stat.stat.exists or (_platform_vault_lock_stat.stat.isreg and not _platform_vault_lock_stat.stat.islnk and _platform_vault_lock_stat.stat.uid == 0 and (_platform_vault_lock_stat.stat.mode | int(base=8)) == 384)
    fail_msg: VAULT_LOCK_OBJECT_UNSAFE

- name: Удержать общую блокировку начальной загрузки Vault для этого вызова Ansible
  ansible.builtin.command:
    argv:
      - systemd-run
      - --quiet
      - --no-block
      - "--unit={{ _platform_vault_lock_unit }}"
      - --property=Type=notify
      - --property=NotifyAccess=all
      - --property=TimeoutStartSec=15s
      - --property=Restart=no
      - --property=UMask=0077
      - /usr/bin/flock
      - --nonblock
      - --exclusive
      - --no-fork
      - "{{ platform_vault_bootstrap_lock_root }}/{{ _platform_vault_lock_key }}.lock"
      - /bin/sh
      - -c
      - "set -eu; /usr/bin/systemd-notify --ready; exec /usr/bin/sleep infinity"
  register: _platform_vault_lock_start
  # Per-invocation coordination is not a desired-state service change.
  changed_when: false

- name: Дождаться сигнала готовности держателя замка или аварийно-закрытого запуска
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --value, "{{ _platform_vault_lock_unit }}.service"]
  register: _platform_vault_lock_state
  changed_when: false
  until: _platform_vault_lock_state.stdout in ['active', 'failed', 'inactive']
  retries: 20
  delay: 1

- name: Требовать успешного владения блокировкой развертывания
  ansible.builtin.assert:
    that: _platform_vault_lock_state.stdout == 'active'
    fail_msg: VAULT_DEPLOYMENT_BUSY

- name: Убедиться, что открытый замок Vault является частным обычным файлом, принадлежащим корневому пользователю
  ansible.builtin.stat:
    path: "{{ platform_vault_bootstrap_lock_root }}/{{ _platform_vault_lock_key }}.lock"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_vault_lock_file_stat

- name: Сбой закрытия, если был заменен файл блокировки Vault
  ansible.builtin.assert:
    that:
      - _platform_vault_lock_file_stat.stat.isreg
      - not _platform_vault_lock_file_stat.stat.islnk
      - _platform_vault_lock_file_stat.stat.uid == 0
      - (_platform_vault_lock_file_stat.stat.mode | int(base=8)) == 384
    fail_msg: VAULT_LOCK_OBJECT_UNSAFE
