---
- name: Создание служебной группы и учётной записи Vault при их отсутствии
  ansible.builtin.group:
    name: "{{ platform_vault_group }}"
    system: true

- name: Создание сервисной учетной записи Vault без входа в систему
  ansible.builtin.user:
    name: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    system: true
    create_home: false
    shell: /sbin/nologin

- name: Доставка артефакта Vault из выбранного источника
  ansible.builtin.include_role:
    name: platform.core.artifact_delivery
  vars:
    platform_artifact_delivery_requirements:
      - {id: vault-runtime, name: vault}
  when: platform_resolved_artifact_sources is defined

- name: Установка Vault из настроенного репозитория, если он выбран
  ansible.builtin.package:
    name: vault
    state: present
  when: platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['vault-runtime'].source == 'REPOSITORY'

- name: Установка стандартной утилиты ротации журналов аудита
  ansible.builtin.package:
    name: logrotate
    state: present

- name: Включение автозапуска и запуск штатного таймера logrotate
  ansible.builtin.systemd:
    name: logrotate.timer
    state: started
    enabled: true

- name: "Сохранение владения root каталогами конфигурации, данных и журналов Vault"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: ["{{ platform_vault_config_root }}", "{{ platform_vault_log_root }}"]

- name: Проверка того, что каталоги Vault уровня развертывания остаются во владении пользователя root
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ platform_vault_group }}"
    mode: '0750'
  loop:
    - "{{ platform_vault_config_root }}/{{ platform_vault_deployment_id }}"
    - "{{ platform_vault_log_root }}/{{ platform_vault_deployment_id }}"

- name: Создание общего родительского каталога данных для совмещённых экземпляров Vault
  ansible.builtin.file:
    path: "{{ platform_vault_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: _platform_vault_local_instances | length > 1

- name: Инициализация списка изменённых экземпляров Vault для перезапуска на узле
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: []

- name: Создание точки монтирования аудита в пространстве имён каждой службы systemd
  ansible.builtin.file:
    path: "/var/log/{{ platform_vault_name }}-audit"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Создание каталогов конфигурации изолированного экземпляра службы
  ansible.builtin.file:
    path: "{{ item.config_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Создание каталогов данных Raft изолированного экземпляра службы
  ansible.builtin.file:
    path: "{{ item.data_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Создание резервных каталогов аудита изолированного экземпляра службы
  ansible.builtin.file:
    path: "{{ item.log_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0750'
  loop: "{{ _platform_vault_local_instances }}"

- name: Создание защищённых каталогов PKI для экземпляров Vault
  ansible.builtin.file:
    path: "{{ item.config_directory }}/pki"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Подготовка сертификата API, закрытого ключа и CA для каждой службы Vault
  ansible.builtin.copy:
    src: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item.1 }}"
    dest: "{{ item.0.config_directory }}/pki/{{ item.1 }}"
    remote_src: true
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: "{{ '0600' if item.1 == 'private-key.pem' else '0644' }}"
  loop: "{{ _platform_vault_local_instances | product(['ca-chain.pem', 'certificate.pem', 'private-key.pem']) | list }}"
  register: _platform_vault_pki_files_rendered
  no_log: true

- name: Запись экземпляров службы, файлы PKI которых изменились
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item[0].id] }}"
  loop: "{{ _platform_vault_pki_files_rendered.results }}"
  when: item.changed and item.item[0].id not in _platform_vault_restart_member_ids
  no_log: true

- name: Формирование отдельной конфигурации каждого экземпляра Vault
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_member.config_directory }}/vault.hcl"
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0600'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"
  no_log: true
  register: _platform_vault_config_rendered

- name: Запись экземпляров службы, конфигурация Vault которых изменилась
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item.id] }}"
  loop: "{{ _platform_vault_config_rendered.results }}"
  when: item.changed and item.item.id not in _platform_vault_restart_member_ids

- name: Установка изолированных системных служб Vault systemd
  ansible.builtin.template:
    src: vault.service.j2
    dest: "/etc/systemd/system/{{ vault_member.instance_name }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"
  register: _platform_vault_units_rendered

- name: Установка ограниченной политики ротации журналов аудита Vault для каждого экземпляра
  ansible.builtin.template:
    src: vault-audit.logrotate.j2
    dest: "/etc/logrotate.d/{{ vault_member.instance_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"

- name: Запись экземпляров службы, чья системная служба systemd изменилась
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item.id] }}"
  loop: "{{ _platform_vault_units_rendered.results }}"
  when: item.changed and item.item.id not in _platform_vault_restart_member_ids

- name: Проверка того, что существует неизменяемый маркер идентификации экземпляра службы, принадлежащей роли
  ansible.builtin.copy:
    content: "{{ {'apiVersion': 'platform.installer/vault-member-marker/v1alpha1', 'deploymentId': platform_vault_deployment_id, 'memberId': item.id, 'instanceName': item.instance_name} | to_nice_json }}\n"
    dest: "{{ item.data_directory }}/.{{ platform_vault_name }}-member.json"
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0600'
    force: false
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
