---
- name: Ensure the private Vault service group and account exist
  ansible.builtin.group:
    name: "{{ platform_vault_group }}"
    system: true

- name: Create the non-login Vault service account
  ansible.builtin.user:
    name: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    system: true
    create_home: false
    shell: /sbin/nologin

- name: Deliver the exact Vault artifact selected by source authority
  ansible.builtin.include_role:
    name: platform.core.artifact_delivery
  vars:
    platform_artifact_delivery_requirements:
      - {id: vault-runtime, name: vault}
  when: platform_resolved_artifact_sources is defined

- name: Install pinned Vault from the configured repository when selected
  ansible.builtin.package:
    name: vault-1.21.2-1.red80
    state: present
  when: platform_resolved_artifact_sources is not defined or platform_resolved_artifact_sources['vault-runtime'].source == 'REPOSITORY'

- name: Install the standard audit log rotation utility
  ansible.builtin.package:
    name: logrotate
    state: present

- name: Enable and start the standard logrotate timer
  ansible.builtin.systemd_service:
    name: logrotate.timer
    state: started
    enabled: true

- name: Ensure fixed Vault config, data and log roots remain root-owned
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: ["{{ platform_vault_config_root }}", "{{ platform_vault_log_root }}"]

- name: Ensure the deployment-level Vault directories remain root-owned
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ platform_vault_group }}"
    mode: '0750'
  loop:
    - "{{ platform_vault_config_root }}/{{ platform_vault_deployment_id }}"
    - "{{ platform_vault_log_root }}/{{ platform_vault_deployment_id }}"

- name: Create shared Vault data parent for co-located members
  ansible.builtin.file:
    path: "{{ platform_vault_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: _platform_vault_local_instances | length > 1

- name: Initialize this host's exact changed-member restart set
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: []

- name: Create the fixed audit mountpoint used inside each unit namespace
  ansible.builtin.file:
    path: "/var/log/{{ platform_vault_name }}-audit"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create isolated member config directories
  ansible.builtin.file:
    path: "{{ item.config_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Create isolated member Raft data directories
  ansible.builtin.file:
    path: "{{ item.data_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Create isolated member audit backing directories
  ansible.builtin.file:
    path: "{{ item.log_directory }}"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0750'
  loop: "{{ _platform_vault_local_instances }}"

- name: Create private per-member PKI directories
  ansible.builtin.file:
    path: "{{ item.config_directory }}/pki"
    state: directory
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0700'
  loop: "{{ _platform_vault_local_instances }}"

- name: Materialize the API certificate, private key and CA for each Vault unit
  ansible.builtin.copy:
    src: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item.1 }}"
    dest: "{{ item.0.config_directory }}/pki/{{ item.1 }}"
    remote_src: true
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: "{{ '0600' if item.1 == 'private-key.pem' else '0644' }}"
  loop: "{{ _platform_vault_local_instances | product(['ca-chain.pem', 'certificate.pem', 'private-key.pem']) | list }}"
  register: _platform_vault_pki_files_rendered
  no_log: true

- name: Record members whose PKI files changed
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item[0].id] }}"
  loop: "{{ _platform_vault_pki_files_rendered.results }}"
  when: item.changed and item.item[0].id not in _platform_vault_restart_member_ids
  no_log: true

- name: Render isolated Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_member.config_directory }}/vault.hcl"
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0600'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"
  no_log: true
  register: _platform_vault_config_rendered

- name: Record members whose Vault configuration changed
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item.id] }}"
  loop: "{{ _platform_vault_config_rendered.results }}"
  when: item.changed and item.item.id not in _platform_vault_restart_member_ids

- name: Install isolated Vault systemd units
  ansible.builtin.template:
    src: vault.service.j2
    dest: "/etc/systemd/system/{{ vault_member.instance_name }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"
  register: _platform_vault_units_rendered

- name: Install bounded per-instance Vault audit log rotation policy
  ansible.builtin.template:
    src: vault-audit.logrotate.j2
    dest: "/etc/logrotate.d/{{ vault_member.instance_name }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  vars:
    vault_member: "{{ item }}"

- name: Record members whose systemd unit changed
  ansible.builtin.set_fact:
    _platform_vault_restart_member_ids: "{{ _platform_vault_restart_member_ids + [item.item.id] }}"
  loop: "{{ _platform_vault_units_rendered.results }}"
  when: item.changed and item.item.id not in _platform_vault_restart_member_ids

- name: Ensure the immutable role-owned member identity marker exists
  ansible.builtin.copy:
    content: "{{ {'apiVersion': 'platform.installer/vault-member-marker/v1alpha1', 'deploymentId': platform_vault_deployment_id, 'memberId': item.id, 'instanceName': item.instance_name} | to_nice_json }}\n"
    dest: "{{ item.data_directory }}/.{{ platform_vault_name }}-member.json"
    owner: "{{ platform_vault_user }}"
    group: "{{ platform_vault_group }}"
    mode: '0600'
    force: false
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
