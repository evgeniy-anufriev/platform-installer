---
- name: Select local Vault members for path validation
  ansible.builtin.set_fact:
    _platform_vault_local_data_instances: "{{ _platform_vault_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"

- name: Keep the shared Vault data root separate from co-located members
  ansible.builtin.assert:
    that: item.data_directory != platform_vault_data_root
    fail_msg: "VAULT_DATA_DIRECTORY_COLLISION: {{ item.id }}: {{ item.data_directory }} is the shared root"
  loop: "{{ _platform_vault_local_data_instances }}"
  loop_control:
    label: "{{ item.id }}"
  when: _platform_vault_local_data_instances | length > 1

- name: Refuse overlapping Vault member directories on the same host
  ansible.builtin.assert:
    that:
      - not item.0.data_directory.startswith(item.1.data_directory ~ '/')
      - not item.1.data_directory.startswith(item.0.data_directory ~ '/')
      - item.0.data_directory != item.1.data_directory
    fail_msg: >-
      VAULT_DATA_DIRECTORY_COLLISION: {{ item.0.id }}={{ item.0.data_directory }},
      {{ item.1.id }}={{ item.1.data_directory }}
  loop: "{{ _platform_vault_local_data_instances | product(_platform_vault_local_data_instances) | list }}"
  loop_control:
    label: "{{ item.0.id }} / {{ item.1.id }}"
  when: item.0.id < item.1.id
