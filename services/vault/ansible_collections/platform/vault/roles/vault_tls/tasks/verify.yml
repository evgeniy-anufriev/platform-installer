---
- name: Определить экземпляры Vault на узле inventory
  ansible.builtin.set_fact:
    _platform_vault_local_instances: "{{ _platform_vault_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"

- name: Запрос состояния Vault по проверенному API TLS
  ansible.builtin.uri:
    url: "https://{{ item.address }}:{{ item.api_port }}/v1/sys/health"
    method: GET
    ca_path: "{{ hostvars[item.host].platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: [200, 429, 472, 473, 501, 503]
    return_content: true
  loop: "{{ _platform_vault_instances }}"
  loop_control:
    label: "{{ item.id }}"
  delegate_to: "{{ item.host }}"
  run_once: true
  register: _platform_vault_health
  changed_when: false
  no_log: true

- name: Потребовать, чтобы каждый Vault API был инициализирован и разблокирован
  ansible.builtin.assert:
    that:
      - item.json.initialized | bool
      - not (item.json.sealed | bool)
    fail_msg: VAULT_HEALTH_NOT_READY
  loop: "{{ _platform_vault_health.results }}"
  loop_control:
    label: Vault API health
  no_log: true

- name: Запрос авторизованного токена для проверки конфигурации Vault
  ansible.builtin.assert:
    that: platform_vault_admin_token is string and platform_vault_admin_token | length > 0
    fail_msg: VAULT_ADMIN_TOKEN_REQUIRED
  no_log: true

- name: Прочитать настройки аудита, хранилищ и методов аутентификации Vault с выбранным административным токеном
  ansible.builtin.uri:
    url: "https://{{ (_platform_vault_instances | first).address }}:{{ (_platform_vault_instances | first).api_port }}/v1/{{ item }}"
    method: GET
    headers:
      X-Vault-Token: "{{ platform_vault_admin_token }}"
    ca_path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: 200
    return_content: true
  loop: [sys/audit, sys/mounts, sys/auth]
  register: _platform_vault_configuration
  changed_when: false
  no_log: true

- name: Проверить утверждённый аудит Vault, хранилище KV v2 и метод аутентификации
  ansible.builtin.assert:
    that:
      - _platform_vault_configuration.results[0].json.data['file/'] is defined
      - _platform_vault_configuration.results[0].json.data['file/'].type == 'file'
      - (_platform_vault_configuration.results[0].json.data['file/'].local | default(false) | bool) == false
      - _platform_vault_configuration.results[0].json.data['file/'].options.file_path == '/var/log/' ~ platform_vault_name ~ '-audit/audit.log'
      - (_platform_vault_configuration.results[0].json.data['file/'].options.log_raw | default(false) | string | lower) in ['false', '0']
      - _platform_vault_configuration.results[1].json.data['secret/'].type == 'kv'
      - _platform_vault_configuration.results[1].json.data['secret/'].options.version | string == '2'
      - _platform_vault_configuration.results[2].json.data['userpass/'].type == 'userpass'
      - _platform_vault_configuration.results[2].json.data['approle/'] is defined
      - _platform_vault_configuration.results[2].json.data['approle/'].type == 'approle'
    fail_msg: VAULT_CONFIGURATION_VERIFY_FAILED
  no_log: true

- name: Прочитать авторитетную конфигурацию членства Raft
  ansible.builtin.uri:
    url: "https://{{ (_platform_vault_instances | first).address }}:{{ (_platform_vault_instances | first).api_port }}/v1/sys/storage/raft/configuration"
    method: GET
    headers:
      X-Vault-Token: "{{ platform_vault_admin_token }}"
    ca_path: "{{ hostvars[(_platform_vault_instances | first).host].platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: 200
    return_content: true
  delegate_to: "{{ (_platform_vault_instances | first).host }}"
  run_once: true
  register: _platform_vault_raft_configuration
  changed_when: false
  when: platform_vault_mode == 'raft-ha'
  no_log: true

- name: "Проверить состав и работоспособность голосующих узлов Raft"
  ansible.builtin.assert:
    that:
      - _platform_vault_raft_configuration.json.data.config.servers | length == _platform_vault_instances | length
      - _platform_vault_raft_configuration.json.data.config.servers | map(attribute='node_id') | unique | length == _platform_vault_instances | length
      - _platform_vault_raft_configuration.json.data.config.servers | map(attribute='node_id') | sort == (_platform_vault_instances | map(attribute='instance_name') | sort)
      - _platform_vault_raft_configuration.json.data.config.servers | selectattr('voter', 'equalto', true) | list | length == _platform_vault_instances | length
    fail_msg: VAULT_RAFT_MEMBERSHIP_VERIFY_FAILED
  when: platform_vault_mode == 'raft-ha'
  no_log: true
