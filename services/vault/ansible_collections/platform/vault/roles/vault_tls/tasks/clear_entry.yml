---
- name: Проверка автономных очищаемых входных данных Vault
  ansible.builtin.include_tasks: validate.yml

- name: Требовать точное подтверждение деструктивного сброса Vault
  ansible.builtin.assert:
    that:
      - platform_vault_confirm_destructive_reset == platform_vault_deployment_id
      - platform_vault_user == platform_vault_name
      - platform_vault_group == platform_vault_name
    fail_msg: VAULT_CLEAR_CONFIRMATION_REQUIRED

- name: Нормализовать выбранные идентификаторы экземпляра службы Vault для очистки
  ansible.builtin.include_tasks: normalize.yml

- name: Собрать только выбранные локальные экземпляры службы Vault
  ansible.builtin.set_fact:
    _platform_vault_local_instances: "{{ _platform_vault_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"

- name: Проверить очистку Vault без изменений в режиме проверки
  platform.vault.clear_member:
    name_prefix: "{{ platform_name_prefix | default('', true) }}"
    deployment_id: "{{ platform_vault_deployment_id }}"
    member_id: "{{ item.id }}"
    data_directory: "{{ item.data_directory }}"
    confirmation: "{{ platform_vault_confirm_destructive_reset }}"
    data_root_directory: "{{ platform_data_root_directory if platform_data_root_directory is defined and platform_data_root_directory != '/var/lib' and item.data_directory.startswith(platform_data_root_directory ~ '/') else omit }}"
    data_root_owner: "{{ (ansible_user | default('root', true)) if platform_data_root_directory is defined and platform_data_root_directory != '/var/lib' and item.data_directory.startswith(platform_data_root_directory ~ '/') else omit }}"
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
  when: ansible_check_mode

- name: Сериализовать явную очистку Vault с существующей блокировкой развертывания
  block:
    - name: Создать один идентификатор вызова для очистки блокировки Vault
      ansible.builtin.set_fact:
        platform_vault_lock_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars='hexdigits') | lower }}"
      run_once: true

    - name: Получить блокировку существующего развёртывания Vault перед очисткой
      ansible.builtin.include_tasks:
        file: acquire_lock.yml
        apply:
          run_once: true
          delegate_to: "{{ _platform_vault_instances[0].host }}"
          become: true

    - name: Очистить только явно выбранные экземпляры службы Vault, принадлежащие владельцу
      ansible.builtin.include_tasks: clear.yml

  always:
    - name: Снять блокировку развертывания только этого ясного вызова
      ansible.builtin.include_tasks:
        file: release_lock.yml
        apply:
          run_once: true
          delegate_to: "{{ _platform_vault_instances[0].host }}"
          become: true
      when: _platform_vault_lock_unit is defined and _platform_vault_lock_start is defined
  when: not ansible_check_mode
