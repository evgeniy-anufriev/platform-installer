---
- name: Выбор плана PKI для TLS-файлов Vault API
  ansible.builtin.include_role:
    name: platform.core.pki_materialize
    tasks_from: select_consumer_plan.yml
  vars:
    platform_pki_consumer_tls_profile_id: "{{ platform_vault_tls_profile }}"

- name: Проверка наличия всех TLS-файлов Vault API на узлах экземпляров
  ansible.builtin.stat:
    path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/{{ item }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: [ca-chain.pem, certificate.pem, private-key.pem]
  register: _platform_vault_tls_files
  no_log: true
  when: not (platform_vault_verify_only | bool)

- name: Отклонение неполного набора TLS-файлов Vault API
  ansible.builtin.assert:
    that: _platform_vault_tls_files.results | map(attribute='stat.exists') | list | min
    fail_msg: VAULT_PKI_MATERIALIZATION_REQUIRED
  no_log: true
  when: not (platform_vault_verify_only | bool)
