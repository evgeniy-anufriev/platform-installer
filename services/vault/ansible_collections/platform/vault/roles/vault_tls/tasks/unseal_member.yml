---
- name: Прочитать текущее состояние печати для одного конкретного экземпляра службы Vault
  ansible.builtin.uri:
    url: "https://{{ vault_member.address }}:{{ vault_member.api_port }}/v1/sys/health"
    method: GET
    ca_path: "{{ hostvars[vault_member.host].platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: [200, 429, 472, 473, 501, 503]
    return_content: true
  delegate_to: "{{ vault_member.host }}"
  register: _platform_vault_member_health_before
  changed_when: false
  retries: 30
  delay: 2
  until: _platform_vault_member_health_before is succeeded
  no_log: true

- name: Требовать материалы для восстановления только в том случае, если этот экземпляр службы запечатан
  ansible.builtin.assert:
    that:
      - _platform_vault_effective_unseal_keys | length >= platform_vault_unseal_threshold
      - _platform_vault_effective_unseal_keys[:platform_vault_unseal_threshold] | select('string') | list | length == platform_vault_unseal_threshold
    fail_msg: VAULT_UNSEAL_MATERIAL_REQUIRED
  when: _platform_vault_member_health_before.json.sealed | bool
  no_log: true

- name: Отправьте только настроенное количество необходимых общих ресурсов Shamir
  ansible.builtin.uri:
    url: "https://{{ vault_member.address }}:{{ vault_member.api_port }}/v1/sys/unseal"
    method: PUT
    ca_path: "{{ hostvars[vault_member.host].platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: 200
    body_format: json
    body:
      key: "{{ item }}"
    return_content: true
  delegate_to: "{{ vault_member.host }}"
  loop: "{{ _platform_vault_effective_unseal_keys[:platform_vault_unseal_threshold] }}"
  when: _platform_vault_member_health_before.json.sealed | bool
  register: _platform_vault_unseal_progress
  no_log: true

- name: Подтвердить инициализацию и разблокировку выбранного экземпляра Vault
  ansible.builtin.uri:
    url: "https://{{ vault_member.address }}:{{ vault_member.api_port }}/v1/sys/health"
    method: GET
    ca_path: "{{ hostvars[vault_member.host].platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: [200, 429, 472, 473, 501, 503]
    return_content: true
  delegate_to: "{{ vault_member.host }}"
  register: _platform_vault_member_health_after
  changed_when: false
  retries: 30
  delay: 2
  until: _platform_vault_member_health_after is succeeded and _platform_vault_member_health_after.json.initialized | bool and not (_platform_vault_member_health_after.json.sealed | bool)
  no_log: true

- name: Потребовать инициализированный разблокированный экземпляр службы для предоставления удостоверения кластера
  ansible.builtin.assert:
    that:
      - _platform_vault_member_health_after.json.cluster_id is defined
      - _platform_vault_member_health_after.json.cluster_id is string
      - _platform_vault_member_health_after.json.cluster_id | length > 0
    fail_msg: VAULT_CLUSTER_IDENTITY_MISMATCH
  no_log: true

- name: Захват исходной идентификации кластера узлов после подтверждения разблокировки
  ansible.builtin.set_fact:
    _platform_vault_seed_cluster_id: "{{ _platform_vault_member_health_after.json.cluster_id }}"
  when: vault_member.slot == 0
  no_log: true

- name: Потребовать от экземпляра службы совместного использования исходного идентификатора кластера узлов
  ansible.builtin.assert:
    that:
      - _platform_vault_member_health_after.json.cluster_id is string
      - _platform_vault_member_health_after.json.cluster_id == _platform_vault_seed_cluster_id
    fail_msg: VAULT_CLUSTER_IDENTITY_MISMATCH
  no_log: true
