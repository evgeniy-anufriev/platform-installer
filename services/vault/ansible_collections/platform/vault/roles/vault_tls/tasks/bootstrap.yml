---
- name: Запустить канонический начальный узел Vault перед любым последователем Raft
  ansible.builtin.systemd:
    name: "{{ (_platform_vault_instances | first).instance_name }}.service"
    state: "{{ 'restarted' if (_platform_vault_instances | first).instance_name in (hostvars[(_platform_vault_instances | first).host]._platform_vault_active_units | default([])) and (_platform_vault_instances | first).id in (hostvars[(_platform_vault_instances | first).host]._platform_vault_restart_member_ids | default([])) else 'started' }}"
    enabled: true
    daemon_reload: true
  delegate_to: "{{ (_platform_vault_instances | first).host }}"
  become: true

- name: Чтение исходного состояния инициализации узла через проверенный API TLS
  ansible.builtin.uri:
    url: "https://{{ (_platform_vault_instances | first).address }}:{{ (_platform_vault_instances | first).api_port }}/v1/sys/init"
    method: GET
    ca_path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: 200
    return_content: true
  delegate_to: "{{ (_platform_vault_instances | first).host }}"
  register: _platform_vault_seed_init
  changed_when: false
  retries: 30
  delay: 2
  until: _platform_vault_seed_init is succeeded
  no_log: true

- name: Отклонить ответ на восстановление инициализации, если исходный узел все еще не инициализирован
  ansible.builtin.assert:
    that: _platform_vault_seed_init.json.initialized | bool
    fail_msg: VAULT_INIT_RECOVERY_STATE_MISMATCH
  when: _platform_vault_output_files.results[2].stat.exists
  no_log: true

- name: Отказаться от новой инициализации, если выходные файлы хранения уже существуют
  ansible.builtin.assert:
    that:
      - not _platform_vault_output_files.results[0].stat.exists
      - not _platform_vault_output_files.results[1].stat.exists
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_ALREADY_EXISTS
  when: not (_platform_vault_seed_init.json.initialized | bool) and not _platform_vault_output_files.results[2].stat.exists
  no_log: true

- name: Требовать синхронизации файловой системы контроллера перед инициализацией
  ansible.builtin.command:
    argv: [/usr/bin/sync, -f, '--', "{{ _platform_vault_bootstrap_output_dir }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true

- name: Инициализировать новый начальный узел ровно один раз
  ansible.builtin.uri:
    url: "https://{{ (_platform_vault_instances | first).address }}:{{ (_platform_vault_instances | first).api_port }}/v1/sys/init"
    method: POST
    ca_path: "{{ platform_pki_selected_consumer_plan.targetDirectory }}/ca-chain.pem"
    validate_certs: true
    status_code: [200, 204]
    body_format: json
    body:
      secret_shares: "{{ platform_vault_unseal_shares }}"
      secret_threshold: "{{ platform_vault_unseal_threshold }}"
    return_content: true
  delegate_to: "{{ (_platform_vault_instances | first).host }}"
  register: _platform_vault_init_response
  when: not (_platform_vault_seed_init.json.initialized | bool) and not _platform_vault_output_files.results[2].stat.exists
  no_log: true

- name: Обеспечить надежную подготовку минимального ответа на инициализацию перед любой операцией разблокировки
  ansible.builtin.copy:
    content: "{{ {'root_token': _platform_vault_init_response['json']['root_token'], 'keys': _platform_vault_init_response['json']['keys']} | to_nice_json }}\n"
    dest: "{{ _platform_vault_bootstrap_output_dir }}/init-response.json"
    mode: '0600'
    force: false
  delegate_to: localhost
  become: false
  when: _platform_vault_init_response is not skipped
  no_log: true

- name: Проверка фиксированной записи восстановления без перехода по символическим ссылкам
  ansible.builtin.stat:
    path: "{{ _platform_vault_bootstrap_output_dir }}/init-response.json"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _platform_vault_recovery_stat
  delegate_to: localhost
  become: false
  when: _platform_vault_init_response is not skipped or _platform_vault_output_files.results[2].stat.exists
  no_log: true

- name: Требовать частную ограниченную запись восстановления, принадлежащую контроллеру
  ansible.builtin.assert:
    that:
      - _platform_vault_recovery_stat.stat.isreg | default(false)
      - not (_platform_vault_recovery_stat.stat.islnk | default(true))
      - _platform_vault_recovery_stat.stat.uid | string == _platform_vault_controller_uid.stdout | trim
      - _platform_vault_recovery_stat.stat.mode == '0600'
      - _platform_vault_recovery_stat.stat.size <= 65536
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_FILE_UNSAFE
  when: _platform_vault_recovery_stat is not skipped
  no_log: true

- name: Прочитать минимальную запись восстановления, не раскрывая ее
  ansible.builtin.slurp:
    src: "{{ _platform_vault_bootstrap_output_dir }}/init-response.json"
  register: _platform_vault_recovery_readback
  delegate_to: localhost
  become: false
  when: _platform_vault_recovery_stat is not skipped
  no_log: true

- name: Требовать считывания восстановления при первой инициализации, чтобы точно соответствовать минимальному ответу
  ansible.builtin.assert:
    that: >-
      (_platform_vault_recovery_readback.content | b64decode | from_json) ==
      {'root_token': _platform_vault_init_response['json']['root_token'], 'keys': _platform_vault_init_response['json']['keys']}
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_CONFLICT
  when: _platform_vault_init_response is not skipped
  no_log: true

- name: Синхронизировать данные восстановления и публикацию каталога перед проверкой
  ansible.builtin.command:
    argv: [/usr/bin/sync, -f, '--', "{{ item }}"]
  loop:
    - "{{ _platform_vault_bootstrap_output_dir }}/init-response.json"
    - "{{ _platform_vault_bootstrap_output_dir }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: _platform_vault_recovery_stat is not skipped
  no_log: true

- name: Загрузка синхронизированной минимальной записи восстановления
  ansible.builtin.set_fact:
    _platform_vault_bootstrap_material: "{{ _platform_vault_recovery_readback.content | b64decode | from_json }}"
  when: _platform_vault_recovery_stat is not skipped
  no_log: true

- name: Проверка сохраненного секретного ответа перед его публикацией или использованием
  ansible.builtin.assert:
    that:
      - _platform_vault_bootstrap_material is mapping
      - _platform_vault_bootstrap_material.keys() | list | sort == ['keys', 'root_token']
      - _platform_vault_bootstrap_material.root_token is string
      - _platform_vault_bootstrap_material.root_token | length > 0
      - _platform_vault_bootstrap_material['keys'] is sequence
      - _platform_vault_bootstrap_material['keys'] is not string
      - _platform_vault_bootstrap_material['keys'] is not mapping
      - _platform_vault_bootstrap_material['keys'] | length == platform_vault_unseal_shares
      - _platform_vault_bootstrap_material['keys'] | select('string') | list | length == platform_vault_unseal_shares
    fail_msg: VAULT_INIT_RESPONSE_INVALID
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Отклонить конфликтующий существующий токен до завершения пары хранения
  ansible.builtin.assert:
    that:
      - _platform_vault_output_files.results[0].stat.size <= 4096
      - (lookup('ansible.builtin.file', _platform_vault_bootstrap_output_dir ~ '/admin-token') | trim) == _platform_vault_bootstrap_material.root_token
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_CONFLICT
  when: _platform_vault_bootstrap_material is defined and _platform_vault_output_files.results[0].stat.exists
  no_log: true

- name: "Отклонить несовпадение сохранённых долей ключа перед завершением записи"
  ansible.builtin.assert:
    that:
      - _platform_vault_output_files.results[1].stat.size <= 32768
      - >-
        (lookup('ansible.builtin.file', _platform_vault_bootstrap_output_dir ~ '/unseal-shares') | from_json) ==
        {'keys': _platform_vault_bootstrap_material['keys']}
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_CONFLICT
  when: _platform_vault_bootstrap_material is defined and _platform_vault_output_files.results[1].stat.exists
  no_log: true

- name: Сохранение автономного исходного корневого токена без перезаписи существующего файла
  ansible.builtin.copy:
    content: "{{ _platform_vault_bootstrap_material.root_token }}"
    dest: "{{ _platform_vault_bootstrap_output_dir }}/admin-token"
    mode: '0600'
    force: false
  delegate_to: localhost
  become: false
  when: _platform_vault_bootstrap_material is defined and not _platform_vault_output_files.results[0].stat.exists
  no_log: true

- name: "Сохранить доли ключа разблокировки без перезаписи существующего файла"
  ansible.builtin.copy:
    content: "{{ {'keys': _platform_vault_bootstrap_material['keys']} | to_nice_json }}\n"
    dest: "{{ _platform_vault_bootstrap_output_dir }}/unseal-shares"
    mode: '0600'
    force: false
  delegate_to: localhost
  become: false
  when: _platform_vault_bootstrap_material is defined and not _platform_vault_output_files.results[1].stat.exists
  no_log: true

- name: Проверка обоих файлов хранения перед подтверждением долговременной публикации
  ansible.builtin.stat:
    path: "{{ _platform_vault_bootstrap_output_dir }}/{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: [admin-token, unseal-shares]
  register: _platform_vault_published_custody_stats
  delegate_to: localhost
  become: false
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Потребовать полную частную пару с ограниченным хранением перед повторным чтением
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(true))
      - item.stat.uid | string == _platform_vault_controller_uid.stdout | trim
      - item.stat.mode == '0600'
      - item.stat.size <= (4096 if item.item == 'admin-token' else 32768)
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_FILE_UNSAFE
  loop: "{{ _platform_vault_published_custody_stats.results | default([]) }}"
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Прочитать существующий корневой токен перед завершением прерванной публикации хранения
  ansible.builtin.slurp:
    src: "{{ _platform_vault_bootstrap_output_dir }}/admin-token"
  register: _platform_vault_existing_root_token
  when: _platform_vault_bootstrap_material is defined
  delegate_to: localhost
  become: false
  no_log: true

- name: Потребовать, чтобы существующий файл токена соответствовал устойчивому ответу инициализации
  ansible.builtin.assert:
    that: (_platform_vault_existing_root_token.content | b64decode | trim) == _platform_vault_bootstrap_material.root_token
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_CONFLICT
  when: _platform_vault_existing_root_token is not skipped
  no_log: true

- name: "Прочитать сохранённые доли ключа для завершения прерванной записи"
  ansible.builtin.slurp:
    src: "{{ _platform_vault_bootstrap_output_dir }}/unseal-shares"
  register: _platform_vault_existing_unseal_keys
  when: _platform_vault_bootstrap_material is defined
  delegate_to: localhost
  become: false
  no_log: true

- name: Потребовать, чтобы существующий файл разблокировки соответствовал устойчивому ответу инициализации
  ansible.builtin.assert:
    that:
      - >-
        (_platform_vault_existing_unseal_keys.content | b64decode | from_json) ==
        {'keys': _platform_vault_bootstrap_material['keys']}
    fail_msg: VAULT_BOOTSTRAP_OUTPUT_CONFLICT
  when: _platform_vault_existing_unseal_keys is not skipped
  no_log: true

- name: Синхронизировать оба совпадающих файла хранения перед очисткой для восстановления
  ansible.builtin.command:
    argv: [/usr/bin/sync, -f, '--', "{{ item }}"]
  loop:
    - "{{ _platform_vault_bootstrap_output_dir }}/admin-token"
    - "{{ _platform_vault_bootstrap_output_dir }}/unseal-shares"
    - "{{ _platform_vault_bootstrap_output_dir }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: "Выбрать созданный или восстановленный токен и доли ключа Vault"
  ansible.builtin.set_fact:
    _platform_vault_admin_token: "{{ _platform_vault_bootstrap_material.root_token }}"
    _platform_vault_effective_unseal_keys: "{{ _platform_vault_bootstrap_material['keys'] }}"
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Удалить защищенную запись восстановления только после существования обоих файлов хранения
  ansible.builtin.file:
    path: "{{ _platform_vault_bootstrap_output_dir }}/init-response.json"
    state: absent
  delegate_to: localhost
  become: false
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Синхронизировать каталог хранения после удаления записи восстановления
  ansible.builtin.command:
    argv: [/usr/bin/sync, -f, '--', "{{ _platform_vault_bootstrap_output_dir }}"]
  delegate_to: localhost
  become: false
  changed_when: false
  when: _platform_vault_bootstrap_material is defined
  no_log: true

- name: Выбрать текущий административный токен из явного ввода или защищенного хранения
  ansible.builtin.set_fact:
    _platform_vault_admin_token: "{{ platform_vault_admin_token }}"
  when: platform_vault_admin_token is defined and platform_vault_admin_token | string | length > 0
  no_log: true

- name: Загрузка административного токена из защищенного автономного хранилища
  ansible.builtin.set_fact:
    _platform_vault_admin_token: "{{ lookup('ansible.builtin.file', _platform_vault_bootstrap_output_dir ~ '/admin-token') | trim }}"
  when: _platform_vault_admin_token is not defined and _platform_vault_output_files.results[0].stat.exists
  no_log: true

- name: "Загрузить доли ключа разблокировки из защищённого локального хранилища"
  ansible.builtin.set_fact:
    _platform_vault_effective_unseal_keys: "{{ (lookup('ansible.builtin.file', _platform_vault_bootstrap_output_dir ~ '/unseal-shares') | from_json)['keys'] }}"
  when: _platform_vault_effective_unseal_keys is not defined and (platform_vault_unseal_keys is not defined or platform_vault_unseal_keys | length == 0) and _platform_vault_output_files.results[1].stat.exists
  no_log: true

- name: "Использовать явно переданные доли ключа разблокировки, если они заданы"
  ansible.builtin.set_fact:
    _platform_vault_effective_unseal_keys: "{{ platform_vault_unseal_keys }}"
  when: _platform_vault_effective_unseal_keys is not defined and platform_vault_unseal_keys is sequence and platform_vault_unseal_keys is not string and platform_vault_unseal_keys | length > 0
  no_log: true

- name: "Использовать пустой список, если доли ключа разблокировки не переданы"
  ansible.builtin.set_fact:
    _platform_vault_effective_unseal_keys: []
  when: _platform_vault_effective_unseal_keys is not defined
  no_log: true

- name: "Проверить административный токен и доли ключа разблокировки Vault"
  ansible.builtin.assert:
    that:
      - _platform_vault_admin_token is defined
      - _platform_vault_admin_token is string
      - _platform_vault_admin_token | length > 0
      - _platform_vault_effective_unseal_keys is defined
      - _platform_vault_effective_unseal_keys is sequence
      - _platform_vault_effective_unseal_keys is not string
    fail_msg: VAULT_BOOTSTRAP_CREDENTIALS_REQUIRED
  no_log: true

- name: Разблокировать начальный узел с настроенным порогом
  ansible.builtin.include_tasks: unseal_member.yml
  vars:
    vault_member: "{{ _platform_vault_instances | first }}"

- name: "Присоединить и разблокировать остальные узлы Raft после готовности начального узла"
  ansible.builtin.include_tasks: bootstrap_follower.yml
  loop: "{{ _platform_vault_instances | sort(attribute='slot') }}"
  loop_control:
    loop_var: vault_member
    label: "{{ vault_member.id }}"
  when: platform_vault_mode == 'raft-ha' and vault_member.slot != 0
  no_log: true

- name: Настройка и проверка полномочий начальной загрузки API для следующих задач
  ansible.builtin.set_fact:
    platform_vault_admin_token: "{{ _platform_vault_admin_token }}"
  no_log: true
