---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Определение необязательных типизированных входных данных runtime-сеанса секретов
  ansible.builtin.include_tasks: resolve_runtime_inputs.yml

- name: Проверка желаемой runtime-проекции Vault
  ansible.builtin.include_tasks: validate.yml

- name: Нормализация портов Vault и идентификаторов ресурсов экземпляров
  ansible.builtin.include_tasks: normalize.yml

- name: Отклонение перекрывающихся локальных путей данных Vault
  ansible.builtin.include_tasks: validate_data_paths.yml
  when: not (platform_vault_verify_only | bool)

- name: Защита локальных путей данных Vault перед изменением
  ansible.builtin.include_role:
    name: platform.core.managed_data_path_guard
  vars:
    platform_managed_data_path: "{{ platform_managed_data_path_instance.data_directory }}"
    platform_managed_data_owner: "{{ platform_vault_user }}"
    platform_managed_data_root_directory: "{{ platform_data_root_directory | default('/var/lib') }}"
    platform_managed_data_root_owner: "{{ ansible_user | default('') }}"
    platform_managed_data_root_verify_only: "{{ platform_vault_verify_only | bool }}"
  loop: "{{ _platform_vault_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"
  loop_control:
    loop_var: platform_managed_data_path_instance
    label: "{{ platform_managed_data_path_instance.id }}"
  when: not (platform_vault_verify_only | bool)

- name: Обеспечение взаимного исключения операций Vault для Installer и standalone-Ansible
  block:
    - name: Создание одного идентификатора вызова для блокировки развертывания
      ansible.builtin.set_fact:
        platform_vault_lock_token: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars='hexdigits') | lower }}"
      run_once: true

    - name: Получение блокировки flock проекта и развёртывания на целевом узле
      ansible.builtin.include_tasks:
        file: acquire_lock.yml
        apply:
          run_once: true
          delegate_to: "{{ _platform_vault_instances[0].host }}"
          become: true

    - name: Отклонение штатной службы Vault из пакета перед внесением изменений
      ansible.builtin.command:
        argv: [systemctl, is-active, vault.service]
      register: _platform_vault_default_unit
      changed_when: false
      failed_when: false

    - name: Остановка при обнаружении постороннего экземпляра Vault под штатной службой из пакета
      ansible.builtin.assert:
        that: _platform_vault_default_unit.stdout | trim != 'active'
        fail_msg: VAULT_DEFAULT_UNIT_CONFLICT

    - name: Определение и защита каталога результатов автономной инициализации
      ansible.builtin.include_tasks:
        file: prepare_output.yml
        apply:
          run_once: true
          delegate_to: localhost
          become: false
      when: not (platform_vault_verify_only | bool)

    - name: Проверка разрешённого источника артефакта Vault перед изменениями
      ansible.builtin.include_role:
        name: platform.core.artifact_source_gate
      vars:
        platform_artifact_requirements:
          - {id: vault-runtime, name: vault}
      when:
        - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
        - not (platform_vault_verify_only | bool)

    - name: Определение выбранного плана подготовки сертификата Vault API
      ansible.builtin.include_tasks: resolve_tls.yml

    - name: Запуск предварительной проверки Vault перед изменением пакета или службы
      ansible.builtin.include_tasks: preflight.yml
      when: not (platform_vault_verify_only | bool)

    - name: Запуск подготовки и настройки Vault
      ansible.builtin.include_tasks: provision.yml
      when: not (platform_vault_verify_only | bool)

    - name: Запуск начального узла, однократная инициализация и последовательное присоединение остальных экземпляров
      ansible.builtin.include_tasks:
        file: bootstrap.yml
        apply:
          run_once: true
      when: not (platform_vault_verify_only | bool)

    - name: "Настройка аудита, KV v2, userpass и AppRole, сохранив существующие ресурсы"
      ansible.builtin.include_tasks: configure.yml
      # These mounts are Raft cluster state, not per-host resources. Only the
      # canonical seed may reconcile them while the deployment lock is held.
      when: not (platform_vault_verify_only | bool) and inventory_hostname == _platform_vault_instances[0].host

    - name: Проверка подготовленного Vault, пока удерживается блокировка развертывания
      ansible.builtin.include_tasks: verify.yml
      when: not (platform_vault_verify_only | bool)

  always:
    - name: Снятие блокировки развёртывания Vault на каноническом экземпляре сервиса
      ansible.builtin.include_tasks:
        file: release_lock.yml
        apply:
          run_once: true
          delegate_to: "{{ _platform_vault_instances[0].host }}"
          become: true
      when: _platform_vault_lock_unit is defined and _platform_vault_lock_start is defined
  when: not (platform_vault_verify_only | bool)

- name: "Выбор текущих TLS-файлов Vault для проверки без изменений"
  ansible.builtin.include_tasks: resolve_tls.yml
  when: platform_vault_verify_only | bool

- name: Определение защищённых данных автономной инициализации для режима Verify
  ansible.builtin.include_tasks:
    file: read_output.yml
    apply:
      run_once: true
      delegate_to: localhost
      become: false
  when: platform_vault_verify_only | bool and (platform_vault_admin_token is not defined or platform_vault_admin_token | string | length == 0)

- name: Проверка учётных данных для Verify без чтения или изменения файлов результатов
  ansible.builtin.assert:
    that:
      - platform_vault_admin_token is defined
      - platform_vault_admin_token is string
      - platform_vault_admin_token | length > 0
    fail_msg: VAULT_ADMIN_TOKEN_REQUIRED
  when: platform_vault_verify_only | bool
  no_log: true

- name: Проверка Vault без изменения состояния службы
  ansible.builtin.include_tasks: verify.yml
  when: platform_vault_verify_only | bool
