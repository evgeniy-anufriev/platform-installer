---
- name: Собрать экземпляры Vault, назначенные узлу inventory
  ansible.builtin.set_fact:
    _platform_vault_local_instances: "{{ _platform_vault_instances | selectattr('host', 'equalto', inventory_hostname) | list }}"

- name: Проверка свободного места на наличие ограниченного хранения аудита Vault
  ansible.builtin.command:
    argv: [df, -PkP, --, /var/log]
  register: _platform_vault_audit_space
  changed_when: false

- name: Требуется место для одного текущего и четырнадцати ротируемых файлов аудита
  ansible.builtin.assert:
    that:
      - _platform_vault_audit_space.stdout_lines | length >= 2
      - _platform_vault_audit_space.stdout_lines[-1].split() | length >= 4
      - _platform_vault_audit_space.stdout_lines[-1].split()[3] is match('^[0-9]+$')
      - _platform_vault_audit_space.stdout_lines[-1].split()[3] | int >= 1600000
    fail_msg: VAULT_AUDIT_SPACE_INSUFFICIENT

- name: Проверка фиксированных корней роли Vault перед изменением
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: ["{{ platform_vault_config_root }}", "{{ platform_vault_log_root }}"]
  register: _platform_vault_roots

- name: Отклонить корневые пути роли Vault при символических ссылках или неправильном типе каталога
  ansible.builtin.assert:
    that: not item.stat.exists or (item.stat.isdir and not item.stat.islnk and item.stat.uid == 0)
    fail_msg: VAULT_PATH_UNSAFE
  loop: "{{ _platform_vault_roots.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Проверка общего корня данных Vault перед добавлением совместно расположенных экземпляров службы
  ansible.builtin.stat:
    path: "{{ platform_vault_data_root }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: _platform_vault_shared_data_root
  when: _platform_vault_local_instances | length > 1

- name: Требовать общий родительский элемент данных Vault, принадлежащий пользователю root
  ansible.builtin.assert:
    that:
      - not _platform_vault_shared_data_root.stat.exists or _platform_vault_shared_data_root.stat.uid == 0
      - not _platform_vault_shared_data_root.stat.exists or _platform_vault_shared_data_root.stat.mode == '0755'
    fail_msg: VAULT_SHARED_DATA_ROOT_UNSAFE
  when: _platform_vault_local_instances | length > 1

- name: Разрешить идентификацию учетной записи службы для проверки принадлежащего ей пути Vault
  ansible.builtin.command:
    argv: [id, -u, "{{ platform_vault_user }}"]
  register: _platform_vault_service_uid
  changed_when: false
  failed_when: false

- name: Построение ограниченного набора проверки предков пути Vault
  ansible.builtin.set_fact:
    _platform_vault_path_checks: "{{ [{'path': platform_vault_config_root, 'owner': 'root'}, {'path': platform_vault_log_root, 'owner': 'root'}] }}"

- name: Добавить каждый фиксированный компонент пути развертывания и экземпляра службы к предварительной проверке
  ansible.builtin.set_fact:
    _platform_vault_path_checks: "{{ _platform_vault_path_checks + [
      {'path': platform_vault_config_root ~ '/' ~ platform_vault_deployment_id, 'owner': 'root'},
      {'path': item.config_directory, 'owner': 'service'},
      {'path': item.config_directory ~ '/pki', 'owner': 'service'},
      {'path': item.data_directory, 'owner': 'service'},
      {'path': platform_vault_log_root ~ '/' ~ platform_vault_deployment_id, 'owner': 'root'},
      {'path': item.log_directory, 'owner': 'service'}
    ] }}"
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Проверить каждый фиксированный компонент root/deployment/member/PKI без перехода по ссылкам
  ansible.builtin.include_tasks: validate_owned_paths.yml

- name: Проверка каталогов данных Raft экземпляра службы, прежде чем прикасаться к существующему состоянию
  ansible.builtin.stat:
    path: "{{ item.data_directory }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_vault_local_instances }}"
  register: _platform_vault_member_data_dirs
  loop_control:
    label: "{{ item.id }}"

- name: Отклонить замененные пути к данным Raft экземпляра службы
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (_platform_vault_service_uid.rc == 0 and item.stat.isdir and not item.stat.islnk and item.stat.uid | string == _platform_vault_service_uid.stdout | trim)
    fail_msg: VAULT_RAFT_DATA_PATH_UNSAFE
  loop: "{{ _platform_vault_member_data_dirs.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: item.stat.exists

- name: Проверка только непосредственно существующих записей данных экземпляра службы
  ansible.builtin.find:
    paths: "{{ item.item.data_directory }}"
    recurse: false
    hidden: true
    file_type: any
  loop: "{{ _platform_vault_member_data_dirs.results }}"
  register: _platform_vault_member_data_entries
  when: item.stat.exists
  loop_control:
    label: "{{ item.item.id }}"

- name: Проверка маркера идентификации экземпляра службы, принадлежащей фиксированной роли
  ansible.builtin.stat:
    path: "{{ item.item.data_directory }}/.{{ platform_vault_name }}-member.json"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_vault_member_data_dirs.results }}"
  register: _platform_vault_member_markers
  when: item.stat.exists
  loop_control:
    label: "{{ item.item.id }}"

- name: Отклонить непустые данные экземпляра службы без маркера идентификации, принадлежащего роли
  ansible.builtin.assert:
    that:
      - item.files | length == 0 or (_platform_vault_member_markers.results[vault_data_index].stat.exists | default(false))
      - item.files | selectattr('islnk', 'equalto', true) | list | length == 0
    fail_msg: VAULT_RAFT_STATE_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_vault_member_data_entries.results }}"
  loop_control:
    label: "{{ item.item.item.id }}"
    index_var: vault_data_index
  when: item.skipped is not defined

- name: Прочитать существующие маркеры идентификации экземпляра службы, не переходя по ссылкам
  ansible.builtin.slurp:
    src: "{{ item.item.item.data_directory }}/.{{ platform_vault_name }}-member.json"
  loop: "{{ _platform_vault_member_markers.results | selectattr('skipped', 'undefined') | selectattr('stat.exists') | list }}"
  register: _platform_vault_member_marker_content
  no_log: true

- name: Проверить принадлежность каталогов данных выбранному экземпляру Vault
  ansible.builtin.assert:
    that:
      - (item.content | b64decode | from_json).apiVersion == 'platform.installer/vault-member-marker/v1alpha1'
      - (item.content | b64decode | from_json).deploymentId == platform_vault_deployment_id
      - (item.content | b64decode | from_json).memberId == item.item.item.item.id
      - (item.content | b64decode | from_json).instanceName == item.item.item.item.instance_name
      - item.item.stat.isreg
      - not item.item.stat.islnk
      - item.item.stat.mode == '0600'
    fail_msg: VAULT_RAFT_STATE_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_vault_member_marker_content.results }}"
  loop_control:
    index_var: marker_index
  no_log: true

- name: Проверить точные служебные файлы systemd Vault без следующих ссылок
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.instance_name }}.service"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_vault_local_instances }}"
  register: _platform_vault_unit_files
  loop_control:
    label: "{{ item.id }}"

- name: Проверка устаревших системных служб с хэш-именами Vault без перехода по ссылкам
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item.legacy_instance_name }}.service"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_vault_local_instances }}"
  register: _platform_vault_legacy_unit_files

- name: Отказаться от автоматического принятия устаревших имен системных служб Vault
  ansible.builtin.assert:
    that: not item.stat.exists
    fail_msg: VAULT_LEGACY_UNIT_REQUIRES_S11_CLEANUP
  loop: "{{ _platform_vault_legacy_unit_files.results }}"
  loop_control:
    label: "{{ item.item.id }}"

- name: Проверка точных файлов ротации аудита Vault без перехода по ссылкам
  ansible.builtin.stat:
    path: "/etc/logrotate.d/{{ item.instance_name }}"
    follow: false
    get_mime: false
    get_attributes: false
    get_checksum: false
  loop: "{{ _platform_vault_local_instances }}"
  register: _platform_vault_rotation_files
  loop_control:
    label: "{{ item.id }}"

- name: Отказаться от замененных или нестандартных файлов службы и ротации systemd
  ansible.builtin.assert:
    that:
      - not item.stat.exists or (item.stat.isreg and not item.stat.islnk and item.stat.uid == 0)
    fail_msg: VAULT_CONFIG_PATH_UNSAFE
  loop: "{{ _platform_vault_unit_files.results + _platform_vault_rotation_files.results }}"
  loop_control:
    label: "{{ item.item.id }}"

- name: Прочитать существующие служебные файлы systemd без перехода по ссылкам
  ansible.builtin.slurp:
    src: "/etc/systemd/system/{{ item.item.instance_name }}.service"
  loop: "{{ _platform_vault_unit_files.results | selectattr('stat.exists') | list }}"
  register: _platform_vault_unit_file_contents
  when: item.stat.exists

- name: Прочитать существующие файлы ротации без перехода по ссылкам
  ansible.builtin.slurp:
    src: "/etc/logrotate.d/{{ item.item.instance_name }}"
  loop: "{{ _platform_vault_rotation_files.results | selectattr('stat.exists') | list }}"
  register: _platform_vault_rotation_file_contents
  when: item.stat.exists

- name: Проверить идентификатор экземпляра Vault в существующих файлах служб systemd
  ansible.builtin.assert:
    that:
      - >-
        (item.content | b64decode | split('\n') | first) ==
        ('# ' ~ platform_vault_name ~ '-managed: ' ~ platform_vault_deployment_id ~ '/' ~ item.item.item.id)
    fail_msg: VAULT_CONFIG_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_vault_unit_file_contents.results | default([]) }}"
  no_log: true

- name: Проверить идентификатор экземпляра Vault в существующих файлах ротации журналов
  ansible.builtin.assert:
    that:
      - >-
        (item.content | b64decode | split('\n') | first) ==
        ('# ' ~ platform_vault_name ~ '-managed: ' ~ platform_vault_deployment_id ~ '/' ~ item.item.item.id)
    fail_msg: VAULT_CONFIG_OWNERSHIP_UNKNOWN
  loop: "{{ _platform_vault_rotation_file_contents.results | default([]) }}"
  no_log: true

- name: Запросить службы systemd, управляемые развёртыванием Vault
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item.instance_name }}.service"]
  loop: "{{ _platform_vault_local_instances }}"
  register: _platform_vault_unit_states
  changed_when: false
  failed_when: false

- name: Запись активного экземпляра службы, которой разрешено владеть зарезервированными портами
  ansible.builtin.set_fact:
    _platform_vault_active_units: "{{ _platform_vault_unit_states.results | selectattr('stdout', 'equalto', 'active') | map(attribute='item.instance_name') | list }}"

- name: Создание точных ожиданий порта прослушивателя для каждого экземпляра службы
  ansible.builtin.set_fact:
    _platform_vault_ports: "{{ (_platform_vault_ports | default([])) + [{'port': item.api_port, 'unit': item.instance_name}, {'port': item.cluster_port, 'unit': item.instance_name}] }}"
  loop: "{{ _platform_vault_local_instances }}"

- name: Проверка занятости локального прослушивателя перед подготовкой
  ansible.builtin.command:
    argv: [ss, -Hln, "sport = :{{ item.port }}"]
  register: _platform_vault_port_owner
  changed_when: false
  failed_when: false
  loop: "{{ _platform_vault_ports | default([]) }}"
  loop_control:
    label: "{{ item.port }}"

- name: Требовать свободных портов или уже активной службы systemd Vault
  ansible.builtin.assert:
    that: item.rc == 0 and (item.stdout | trim == '' or item.item.unit in _platform_vault_active_units)
    fail_msg: VAULT_LISTENER_PORT_IN_USE
  loop: "{{ _platform_vault_port_owner.results | default([]) }}"
  loop_control:
    label: "{{ item.item.port }}"
