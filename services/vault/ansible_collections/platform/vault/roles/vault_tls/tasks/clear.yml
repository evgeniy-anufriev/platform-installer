---
- name: Validate every selected member before stopping any local Vault unit
  platform.vault.clear_member:
    deployment_id: "{{ platform_vault_deployment_id }}"
    member_id: "{{ item.id }}"
    confirmation: "{{ platform_vault_confirm_destructive_reset }}"
    inspect_only: true
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Stop and disable only selected owned Vault units
  ansible.builtin.systemd_service:
    name: "{{ item.instance_name }}.service"
    state: stopped
    enabled: false
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Clear Raft contents through freshly validated held member directories
  platform.vault.clear_member:
    deployment_id: "{{ platform_vault_deployment_id }}"
    member_id: "{{ item.id }}"
    confirmation: "{{ platform_vault_confirm_destructive_reset }}"
  loop: "{{ _platform_vault_local_instances }}"
  loop_control:
    label: "{{ item.id }}"
