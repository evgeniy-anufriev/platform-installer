apiVersion: platform.installer/service-manifest/v1alpha1
kind: ServiceManifest
metadata:
  id: vault
  version: "1.0.0-alpha.2"
  displayName: HashiCorp Vault
  description: TLS API, Integrated Storage Raft, file audit, KV v2 and userpass mount
  category: security
modes:
  standalone:
    displayName: Standalone
    memberRoles: [vault]
    placement: {explicit: true, minMembers: 1, maxMembers: 1, distinctHosts: false, roleCardinality: {vault: {minimum: 1, maximum: 1}}}
  raft-ha:
    displayName: Raft HA
    memberRoles: [vault]
    placement: {explicit: true, minMembers: 3, maxMembers: 3, distinctHosts: false, roleCardinality: {vault: {minimum: 3, maximum: 3}}}
listeners:
  client: {protocol: https, defaultPort: 8200, tlsCapable: true, scope: member}
  cluster: {protocol: tcp, defaultPort: 8201, tlsCapable: true, scope: member}
endpoint: {}
x-haproxyBackendDefaults: {balance: roundrobin, check: true, fall: 3, rise: 2, ssl: true, sslVerify: required}
x-backendClientListener: {listener: client, allocation: {kind: HOST_LOCAL_ORDINAL, stride: 2}}
capabilities: [service.vault.api]
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    dataRoot: {kind: MANAGED, roleVariable: platform_vault_data_root, type: string, scopes: [deployment], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных, section: Хранение, order: 0, description: По умолчанию <корневой каталог данных сервисов>/<ID развёртывания>. Для нескольких участников на одном сервере создаются отдельные подкаталоги. Существующие данные автоматически не переносятся.}}
    dataDirectory: {kind: MANAGED, roleVariable: platform_vault_member_data_directory, type: string, scopes: [member], validation: {minLength: 1, maxLength: 255}, ui: {label: Каталог данных участника, section: Хранение, order: 0, description: Абсолютный путь на сервере; переопределяет каталог данных только этого участника.}}
    tlsProfile: {kind: MANAGED, roleVariable: platform_vault_tls_profile, type: string, scopes: [deployment], validation: {minLength: 1}, ui: {label: TLS profile, section: TLS, order: 10, x-referenceKind: TLS_PROFILE}}
    port: {kind: MANAGED, roleVariable: platform_vault_api_port, type: integer, scopes: [deployment, member], validation: {minimum: 1, maximum: 65535}, ui: {label: API TLS base port, section: Network, order: 20}}
    clusterPort: {kind: MANAGED, roleVariable: platform_vault_cluster_port, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 65535}, ui: {label: Cluster base port, section: Network, order: 21}}
    unsealShares: {kind: MANAGED, roleVariable: platform_vault_unseal_shares, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 255}, ui: {label: Unseal shares, section: Initialization, order: 30}}
    unsealThreshold: {kind: MANAGED, roleVariable: platform_vault_unseal_threshold, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 255}, ui: {label: Unseal threshold, section: Initialization, order: 31}}
x-memberDataDirectorySetting: dataDirectory
roleEntrypoints:
  apply: {fqcn: platform.vault.vault_tls, variablesPrefix: platform_vault_, x-memberListVariable: platform_vault_instances}
  verify: {fqcn: platform.vault.vault_tls, variablesPrefix: platform_vault_, x-memberListVariable: platform_vault_instances}
artifacts: []
runtimeRequirements:
  - id: vault-runtime
    name: vault
    version: "1.21.2"
    os: redos
    architecture: x86_64
    requiredOffline: false
compatibilityRef: compatibility.yml
x-implementationStatus: core-runtime-si08-c
x-secretOutputs:
  protocol: SecretOutputDelivery/v1alpha1
  entries: [admin-token, unseal-shares]
x-secretInputs:
  apiVersion: ServiceSecretInputs/v1alpha1
  inputs:
    - requirementRef: vault-admin-token
      purpose: SERVICE_ADMIN_TOKEN
      displayLabel: Administrative token
      requiredWhen: INITIALIZED
      operations: [SERVICE_APPLY, SERVICE_VERIFY]
    - requirementRef: vault-unseal-shares
      purpose: SERVICE_UNSEAL_SHARES
      displayLabel: Unseal keys
      requiredWhen: SEALED
      operations: [SERVICE_APPLY]
