---
- name: Определение конечной точки источника и её провайдеров без внесения изменений
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: ../tasks/resolve-source.yml

- import_playbook: ../../haproxy/playbooks/integrate.yml
  when:
    - hostvars['localhost'].platform_service_integration_projection.haproxyDeployments | length > 0
    - not (platform_endpoint_verify_only | default(false) | bool)

- name: Проверка выбранной серверной части конечной точки без изменения провайдера
  hosts: "{{ hostvars['localhost'].platform_service_integration_projection.haproxyHosts | default([]) }}"
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Проверка источника через явный вход HAProxy без применения конфигурации
      ansible.builtin.import_role:
        name: platform.haproxy.haproxy
        tasks_from: endpoint_verify
      vars:
        platform_haproxy_partial_deployment_id: "{{ hostvars['localhost']._platform_integration_source_id }}"
      when: platform_endpoint_verify_only | default(false) | bool

- import_playbook: ../../bind/playbooks/integrate.yml
  when:
    - hostvars['localhost'].platform_bind_source_dns_records | length > 0
    - not (platform_endpoint_verify_only | default(false) | bool)
  vars:
    platform_bind_source_dns_records: "{{ hostvars['localhost'].platform_bind_source_dns_records }}"

- name: Проверка конечной точки источника с внешней маршрутизацией после обновлений провайдера
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Проверка наличия провайдеров и явной политики проверки источника"
      ansible.builtin.assert:
        that:
          - platform_service_integration_projection.haproxyDeployments | length > 0
        fail_msg: APPLICATION_ENDPOINT_NOT_PUBLISHED
      when: _platform_integration_probe | default({}) | length > 0
    - name: Проверка доступности конечной точки источника DNS и HTTP
      ansible.builtin.include_tasks: ../tasks/probe-endpoint.yml
      when:
        - platform_service_integration_projection.haproxyDeployments | length > 0
        - _platform_integration_source_fqdns | default([]) | length > 0
