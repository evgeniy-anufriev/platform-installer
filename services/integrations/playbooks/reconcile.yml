---
- name: Определение развёртывания провайдера после завершения жизненного цикла источника интеграции
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Сбор мест размещения инвентаря для выбора провайдера
      ansible.builtin.set_fact:
        _platform_integration_inventory_deployments: >-
          {{ _platform_integration_inventory_deployments | default({}) |
             combine({item: (hostvars[item].platform_deployments | default({}))}) }}
      loop: "{{ groups['platform_targets'] | default([]) | sort }}"
      no_log: true

    - name: Определение интеграций сервисных провайдеров без внесения изменений
      platform.core.resolve_service_integrations:
        desired_state: "{{ platform_desired_state }}"
        source_service_types: "{{ platform_integration_source_service_types | default([]) }}"
        inventory_deployments: "{{ _platform_integration_inventory_deployments | default({}) }}"
      register: _platform_service_integration_resolution

    - name: Публикация проекции интеграции локального провайдера выполнения
      ansible.builtin.set_fact:
        platform_service_integration_projection: "{{ _platform_service_integration_resolution.resolved_service_integrations.integrations }}"

- import_playbook: ../../bind/playbooks/reconcile.yml
  when: hostvars['localhost'].platform_service_integration_projection.dnsDeployments | length > 0
  vars:
    platform_provider_integration_recursion: false
    platform_provider_selected_deployments: "{{ hostvars['localhost'].platform_service_integration_projection.dnsDeployments }}"

- import_playbook: ../../haproxy/playbooks/reconcile.yml
  when: hostvars['localhost'].platform_service_integration_projection.haproxyDeployments | length > 0
  vars:
    platform_provider_integration_recursion: false
    platform_provider_selected_deployments: "{{ hostvars['localhost'].platform_service_integration_projection.haproxyDeployments }}"
