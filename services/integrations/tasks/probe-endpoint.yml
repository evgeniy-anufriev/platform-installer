---
- name: Разрешить каждую исходную конечную точку перед проверкой маршрута провайдера
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ item }}"]
  loop: "{{ _platform_integration_source_fqdns }}"
  loop_control:
    label: "{{ item }}"
  register: _platform_integration_endpoint_dns
  changed_when: false
  failed_when: false
  no_log: true
- name: Потребовать разрешения каждого имени хоста исходной конечной точки
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout | length > 0
      - expected_addresses | length > 0
      - actual_addresses == expected_addresses
    fail_msg: SERVICE_ENDPOINT_DNS_UNRESOLVED
  loop: "{{ _platform_integration_endpoint_dns.results }}"
  loop_control:
    label: "{{ item.item }}"
  vars:
    expected_addresses: "{{ platform_endpoint_probe_expected_addresses | default([]) | unique | sort }}"
    actual_addresses: "{{ item.stdout_lines | map('regex_replace', '^([^ ]+).*$', '\\1') | unique | sort }}"

- name: Проверить каждую конечную точку источника через общедоступный прослушиватель HAProxy HTTPS
  ansible.builtin.uri:
    url: >-
      https://{{ item }}{{ ':' ~ _platform_integration_probe_port_override
        if _platform_integration_probe_port_override is defined else '' }}{{ (_platform_integration_probe | default({})).get('path', '/') }}
    method: GET
    validate_certs: "{{ (_platform_integration_probe | default({})).get('validate_certs', false) }}"
    ca_path: "{{ platform_endpoint_ca_path | default(omit) }}"
    timeout: "{{ (_platform_integration_probe | default({})).get('timeout', 10) }}"
    status_code: "{{ [(_platform_integration_probe | default({})).expected_status] if (_platform_integration_probe | default({})).expected_status is defined else range(100, 600) | list }}"
    follow_redirects: none
    return_content: false
  loop: "{{ _platform_integration_source_fqdns }}"
  loop_control:
    label: "{{ item }}"
  register: _platform_integration_endpoint_http
  changed_when: false
  failed_when: false
  no_log: true

  retries: 3
  delay: 2
  until:
    - _platform_integration_endpoint_http.status | default(-1) | int >= 100
    - _platform_integration_endpoint_http.status | default(-1) | int <= 599
    - _platform_integration_endpoint_http.status | default(-1) | int not in [502, 503]
    - (_platform_integration_probe | default({})).expected_status is not defined or _platform_integration_endpoint_http.status | default(-1) | int == _platform_integration_probe.expected_status | int
  # Preserve the final response for safe diagnostics and the assertion below.
  ignore_errors: true

- name: Сообщить о диагностике безопасной общедоступной конечной точки HTTP
  ansible.builtin.debug:
    msg:
      url: "{{ response.url | default('https://' ~ response.item) | regex_replace('[?#].*$', '') }}"
      expected_status: "{{ (_platform_integration_probe | default({})).expected_status | default('100..599 except 502/503') }}"
      actual_status: "{{ response.status | default(-1) }}"
      timeout: "{{ (_platform_integration_probe | default({})).timeout | default(10) }}"
      attempts: "{{ response.attempts | default(1) }}"
      reason: "{{ (response.msg | default('')) | regex_search('CERTIFICATE_VERIFY_FAILED|timed out|Name or service not known|Temporary failure in name resolution|Connection refused|HTTP Error [0-9]+: [A-Za-z ]+') | default('HTTP_STATUS_RECEIVED' if (response.status | default(-1) | int) >= 100 else 'REQUEST_FAILED', true) }}"
  loop: "{{ range(0, _platform_integration_endpoint_http.results | default([]) | length) | list }}"
  loop_control:
    label: "{{ response.item }}"
  vars:
    response: "{{ _platform_integration_endpoint_http.results[item] }}"

- name: Публикация результатов безопасной конечной точки с помощью существующего диагностического события
  ansible.builtin.include_tasks: report-endpoint-http.yml
  loop: "{{ range(0, _platform_integration_endpoint_http.results | default([]) | length) | list }}"
  loop_control:
    loop_var: _platform_probe_response_index
  when: (_platform_integration_probe | default({})).expected_status is defined
- name: Требовать перенаправленный ответ HTTP, отличный от статусов недоступности HAProxy
  ansible.builtin.assert:
    that:
      - statuses | length == _platform_integration_source_fqdns | length
      - statuses | select('lt', 100) | list | length == 0
      - statuses | select('gt', 599) | list | length == 0
      - statuses | intersect([502, 503]) | length == 0
      - (_platform_integration_probe | default({})).expected_status is not defined or statuses | unique | list == [_platform_integration_probe.expected_status | int]
    fail_msg: SERVICE_ENDPOINT_UNAVAILABLE
  vars:
    statuses: "{{ _platform_integration_endpoint_http.results | selectattr('status', 'defined') | map(attribute='status') | map('int') | list }}"
