---
- name: Проверка непустого списка выбранных источников конечных точек
  ansible.builtin.assert:
    that:
      - platform_endpoint_source_ids is sequence
      - platform_endpoint_source_ids is not string
      - platform_endpoint_source_ids | length > 0
      - platform_endpoint_source_ids | difference(hostvars['localhost'].platform_endpoint_sources | list) | length == 0
      - platform_endpoint_source_id is not defined or platform_endpoint_source_ids | unique | list == [platform_endpoint_source_id]
    fail_msg: APPLICATION_ENDPOINT_SCOPE_INVALID

- name: Однократная загрузка каталога для выбранного набора источников
  ansible.builtin.include_vars:
    file: "{{ platform_service_catalog_path }}"
    name: _platform_integration_catalog_file

- name: Сбор inventory для пакетного расчёта интеграций
  ansible.builtin.set_fact:
    _platform_integration_inventory: >-
      {%- set hosts = {} -%}
      {%- set deployments = {} -%}
      {%- for host in groups['platform_targets'] | default([]) | sort -%}
      {%- set _ = hosts.update({host: {'ansible_host': hostvars[host].ansible_host | default(host)}}) -%}
      {%- set _ = deployments.update({host: hostvars[host].platform_deployments | default({})}) -%}
      {%- endfor -%}
      {{ {'hosts': hosts, 'deployments': deployments} }}
  no_log: true

- name: Пакетный расчёт выбранных источников существующими преобразователями Core
  platform.core.resolve_endpoint_publications:
    source_ids: "{{ platform_endpoint_source_ids }}"
    endpoint_sources: "{{ hostvars['localhost'].platform_endpoint_sources }}"
    desired_state: "{{ platform_desired_state }}"
    service_catalog: "{{ _platform_integration_catalog_file.platform_service_catalog | default(_platform_integration_catalog_file, true) }}"
    inventory_hosts: "{{ _platform_integration_inventory.hosts }}"
    inventory_deployments: "{{ _platform_integration_inventory.deployments }}"
  register: _platform_integration_batch

- name: Привязка проекций источников к общей публикации и проверкам
  ansible.builtin.set_fact:
    _platform_integration_selected_sources: "{{ _platform_integration_batch.sources }}"

- name: Публикация выбранных участников провайдера и записей DNS
  ansible.builtin.set_fact:
    platform_service_integration_projection:
      haproxyHosts: "{{ _platform_integration_selected_sources | map(attribute='projection.haproxyHosts') | flatten | unique | sort }}"
      haproxyDeployments: "{{ _platform_integration_selected_sources | map(attribute='projection.haproxyDeployments') | flatten | unique | sort }}"
      dnsDeployments: "{{ _platform_integration_selected_sources | map(attribute='projection.dnsDeployments') | flatten | unique | sort }}"
    platform_bind_source_dns_records: "{{ _platform_integration_selected_sources | map(attribute='dnsRecords') | flatten | unique | list }}"

- name: Отклонение конфликтующих проекций владельцев DNS перед изменением провайдера
  ansible.builtin.assert:
    that: item.1 | unique | list | length == 1
    fail_msg: APPLICATION_ENDPOINT_DNS_CONFLICT
  loop: "{{ platform_bind_source_dns_records | groupby('bindDeploymentId') | map('last') | map('groupby', 'owner') | list | flatten(levels=1) }}"
