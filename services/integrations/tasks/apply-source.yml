---
- name: Нормализовать явный выбор конечной точки без расширения его области действия
  ansible.builtin.set_fact:
    _platform_integration_requested_sources: "{{ platform_endpoint_source_ids | default([platform_endpoint_source_id | default(platform_execution_service_deployment | default(platform_integration_source_deployment_id | default('')))]) }}"

- name: Согласовать выбранный источник интеграции задачами общего контроллера
  ansible.builtin.include_tasks:
    file: resolve-selected-sources.yml
    apply: {delegate_to: localhost, become: false}
  vars:
    platform_endpoint_source_ids: "{{ _platform_integration_requested_sources }}"
  run_once: true

- name: Опубликовать решенную исходную проекцию один раз для каждого хоста провайдера
  ansible.builtin.set_fact:
    platform_service_integration_projection: "{{ platform_service_integration_projection }}"
    platform_bind_source_dns_records: "{{ platform_bind_source_dns_records }}"
    _platform_integration_selected_sources: "{{ _platform_integration_selected_sources }}"
  delegate_to: localhost
  delegate_facts: true
  run_once: true

- name: Перед публикацией запросить полную информацию о провайдере и области размещения
  ansible.builtin.assert:
    that:
      - hostvars['localhost'].platform_service_integration_projection.haproxyHosts | difference(ansible_play_hosts_all) | length == 0
      - hostvars['localhost'].platform_endpoint_sources[item.sourceId].targets | map(attribute='hostId') | difference(ansible_play_hosts_all) | length == 0
    fail_msg: APPLICATION_ENDPOINT_HOST_SCOPE_INCOMPLETE
  loop: "{{ hostvars['localhost']._platform_integration_selected_sources }}"
  run_once: true

- name: Подготовка исходных кандидатов перед активацией любого провайдера
  ansible.builtin.include_role:
    name: platform.haproxy.haproxy
    apply: {become: true}
  vars:
    platform_haproxy_phase: prepare
    platform_haproxy_partial_deployment_ids: "{{ hostvars['localhost']._platform_integration_selected_sources | map(attribute='sourceId') | list }}"
  when: inventory_hostname in hostvars['localhost'].platform_service_integration_projection.haproxyHosts and not (platform_endpoint_verify_only | default(false) | bool)

- name: Активировать источник после проверки всех подготовленных конфигураций провайдера
  ansible.builtin.include_role:
    name: platform.haproxy.haproxy
    apply: {become: true}
  vars:
    platform_haproxy_phase: activate
    platform_haproxy_partial_deployment_ids: "{{ hostvars['localhost']._platform_integration_selected_sources | map(attribute='sourceId') | list }}"
  when: inventory_hostname in hostvars['localhost'].platform_service_integration_projection.haproxyHosts and not (platform_endpoint_verify_only | default(false) | bool)

- name: Перезагрузить HAProxy источника интеграции после активации всех провайдеров
  ansible.builtin.include_role:
    name: platform.haproxy.haproxy
    apply: {become: true}
  vars:
    platform_haproxy_phase: start
    platform_haproxy_partial_deployment_ids: "{{ hostvars['localhost']._platform_integration_selected_sources | map(attribute='sourceId') | list }}"
  when: inventory_hostname in hostvars['localhost'].platform_service_integration_projection.haproxyHosts and not (platform_endpoint_verify_only | default(false) | bool)

- name: Проверка источника без изменения провайдера
  ansible.builtin.include_role:
    name: platform.haproxy.haproxy
    tasks_from: endpoint_verify
    apply: {become: true}
  vars:
    platform_haproxy_partial_deployment_ids: "{{ hostvars['localhost']._platform_integration_selected_sources | map(attribute='sourceId') | list }}"
  when: inventory_hostname in hostvars['localhost'].platform_service_integration_projection.haproxyHosts and (platform_endpoint_verify_only | default(false) | bool)

- name: Публикация исходных записей с использованием существующего перехватчика BIND
  ansible.builtin.include_role:
    name: platform.bind.bind
    tasks_from: publish_source
    apply: {become: true}
  vars:
    platform_bind_source_dns_records: "{{ hostvars['localhost'].platform_bind_source_dns_records }}"
  when: hostvars['localhost'].platform_bind_source_dns_records | length > 0 and not (platform_endpoint_verify_only | default(false) | bool)

- name: Требовать разрешенного провайдера HAProxy перед внешней проверкой
  ansible.builtin.assert:
    that: hostvars['localhost'].platform_service_integration_projection.haproxyDeployments | length > 0
    fail_msg: APPLICATION_ENDPOINT_NOT_PUBLISHED
  run_once: true

- name: Последовательно проверить каждый источник, используя исходную политику DNS и HTTPS
  ansible.builtin.include_tasks:
    file: probe-selected-source.yml
    apply: {delegate_to: localhost, become: false}
  loop: "{{ hostvars['localhost']._platform_integration_selected_sources }}"
  loop_control:
    loop_var: _platform_selected_probe
  run_once: true
