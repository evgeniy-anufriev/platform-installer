---
- name: Initialize an empty endpoint integration projection
  ansible.builtin.set_fact:
    _platform_integration_source_id: "{{ platform_endpoint_source_id | default(platform_execution_service_deployment | default(platform_integration_source_deployment_id | default(''))) }}"
    platform_service_integration_projection:
      dnsDeployments: []
      haproxyDeployments: []
      haproxyHosts: []
    platform_bind_source_dns_records: []
- name: Reuse normalized sources for the existing endpoint hook
  ansible.builtin.include_role:
    name: platform.core.resolve_endpoint_sources
- name: Select the source probe policy without provider type branching
  ansible.builtin.set_fact:
    _platform_integration_probe: "{{ (hostvars['localhost'].platform_endpoint_sources | default({})).get(_platform_integration_source_id, {}).get('probe', {}) }}"

- name: Require an explicit source identity when the project has endpoints
  ansible.builtin.assert:
    that:
      - _platform_integration_source_id | length > 0
    fail_msg: SERVICE_INTEGRATION_SOURCE_ID_REQUIRED
  when: platform_desired_state.serviceDeployments | default({}) | dict2items | selectattr('value.endpointGroup', 'defined') | list | length > 0 and _platform_integration_source_id | length == 0

- name: Collect project inventory projections for Core endpoint resolution
  ansible.builtin.set_fact:
    _platform_integration_inventory_hosts: >-
      {{ _platform_integration_inventory_hosts | default({}) |
         combine({item: {'ansible_host': (hostvars[item].ansible_host | default(item))}}) }}
    _platform_integration_inventory_deployments: >-
      {{ _platform_integration_inventory_deployments | default({}) |
         combine({item: (hostvars[item].platform_deployments | default({}))}) }}
  loop: "{{ groups['platform_targets'] | default([]) | sort }}"
  no_log: true
  when: _platform_integration_source_id | length > 0 and not (_platform_integration_inventory_collected | default(false))

- name: Reuse the safe inventory projection for subsequent source hooks
  ansible.builtin.set_fact:
    _platform_integration_inventory_collected: true

- name: Resolve providers for the selected source deployment
  platform.core.resolve_service_integrations:
    endpoint_sources: "{{ hostvars['localhost'].platform_endpoint_sources | default({}) }}"
    desired_state: "{{ platform_desired_state }}"
    source_service_types: []
    source_deployment_id: "{{ _platform_integration_source_id }}"
    inventory_deployments: "{{ _platform_integration_inventory_deployments | default({}) }}"
  register: _platform_integration_resolution
  when: _platform_integration_source_id | length > 0

- name: Publish selected source provider projection
  ansible.builtin.set_fact:
    platform_service_integration_projection: "{{ _platform_integration_resolution.resolved_service_integrations.integrations }}"
  when: _platform_integration_resolution is not skipped

- name: Load service catalog for endpoint projection
  ansible.builtin.include_vars:
    file: "{{ platform_service_catalog_path }}"
    name: _platform_integration_catalog_file
  when:
    - _platform_integration_source_id | length > 0
    - platform_service_integration_projection.dnsDeployments | length > 0

- name: Resolve only the selected source endpoint
  platform.core.resolve_service_endpoints:
    endpoint_sources: "{{ hostvars['localhost'].platform_endpoint_sources | default({}) }}"
    desired_state: "{{ platform_desired_state }}"
    service_catalog: "{{ _platform_integration_catalog_file.platform_service_catalog | default(_platform_integration_catalog_file, true) }}"
    inventory_deployments: "{{ _platform_integration_inventory_deployments }}"
    deployment_ids: ["{{ _platform_integration_source_id }}"]
  register: _platform_integration_endpoint_resolution
  when:
    - _platform_integration_source_id | length > 0
    - platform_service_integration_projection.dnsDeployments | length > 0

- name: Resolve source-only DNS records without group wildcard changes
  platform.core.resolve_dns_zones:
    endpoint_sources: "{{ hostvars['localhost'].platform_endpoint_sources | default({}) }}"
    desired_state: "{{ platform_desired_state }}"
    service_catalog: "{{ _platform_integration_catalog_file.platform_service_catalog | default(_platform_integration_catalog_file, true) }}"
    inventory_hosts: "{{ _platform_integration_inventory_hosts }}"
    inventory_deployments: "{{ _platform_integration_inventory_deployments }}"
    source_deployment_ids: ["{{ _platform_integration_source_id }}"]
    include_service_endpoints: true
    include_group_wildcards: false
  register: _platform_integration_dns_resolution
  when:
    - _platform_integration_source_id | length > 0
    - platform_service_integration_projection.dnsDeployments | length > 0

- name: Collect only this source's deployment and opted-in host endpoint names
  ansible.builtin.set_fact:
    _platform_integration_source_fqdns: >-
      {{ ([ _platform_integration_endpoint_resolution.resolved_service_endpoints.endpoints[_platform_integration_source_id].fqdn ]
          if _platform_integration_source_id in _platform_integration_endpoint_resolution.resolved_service_endpoints.endpoints else []) +
         (_platform_integration_endpoint_resolution.resolved_service_endpoints.hostEndpoints.values() |
          selectattr('serviceDeploymentId', 'equalto', _platform_integration_source_id) |
          map(attribute='fqdn') | list) }}
  when:
    - _platform_integration_dns_resolution is not skipped

- name: Build exact source DNS updates for resolved BIND deployments
  ansible.builtin.set_fact:
    platform_bind_source_dns_records: >-
      {{ platform_bind_source_dns_records + [{
         'bindDeploymentId': item.0,
         'zone': _platform_integration_dns_resolution.resolved_dns_zones.zones[item.0].zone,
         'owner': item.1 ~ '.',
         'addresses': (record_matches | first)['values'],
         'ttl': _platform_integration_dns_resolution.resolved_dns_zones.zones[item.0].defaultTtl
      }] }}
  vars:
    record_matches: >-
      {{ _platform_integration_dns_resolution.resolved_dns_zones.zones[item.0].records |
         selectattr('owner', 'equalto', item.1 ~ '.') | list }}
  loop: "{{ platform_service_integration_projection.dnsDeployments | product(_platform_integration_source_fqdns | default([])) | list }}"
  loop_control:
    label: "{{ item.1 }}"
  when:
    - _platform_integration_dns_resolution is not skipped
    - record_matches | length == 1

- name: Retain the exact normalized source hostname when DNS publication is skipped
  ansible.builtin.set_fact:
    _platform_integration_source_fqdns: "{{ [hostvars['localhost'].platform_endpoint_sources[_platform_integration_source_id].endpoint.fqdn] }}"
  when: _platform_integration_source_id in (hostvars['localhost'].platform_endpoint_sources | default({}))

- name: Normalize expected DNS addresses for the selected endpoint source
  ansible.builtin.set_fact:
    platform_endpoint_probe_expected_addresses: "{{ source_expected_addresses if source_expected_addresses | length > 0 else source_dns_record_addresses }}"
  vars:
    source_expected_addresses: "{{ (hostvars['localhost'].platform_endpoint_sources | default({})).get(_platform_integration_source_id, {}).get('expectedAddresses', []) | unique | sort }}"
    source_dns_owners: "{{ _platform_integration_source_fqdns | default([]) | map('regex_replace', '\\.?$', '.') | list }}"
    source_dns_record_addresses: >-
      {{ platform_bind_source_dns_records |
         selectattr('owner', 'in', source_dns_owners) |
         map(attribute='addresses') | flatten | unique | sort }}
