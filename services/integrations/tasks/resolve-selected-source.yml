---
- name: Определение одного источника без изменения политики проверки
  ansible.builtin.include_tasks: resolve-source.yml
  vars:
    platform_endpoint_source_id: "{{ _platform_selected_source_id }}"

- name: Сохранение проекции источника образа для публикации и последующих проверок
  ansible.builtin.set_fact:
    _platform_integration_selected_sources: "{{ _platform_integration_selected_sources + [{'sourceId': _platform_selected_source_id, 'projection': platform_service_integration_projection, 'dnsRecords': platform_bind_source_dns_records, 'fqdns': _platform_integration_source_fqdns, 'probe': _platform_integration_probe, 'expectedAddresses': platform_endpoint_probe_expected_addresses}] }}"
