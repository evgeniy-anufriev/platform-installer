apiVersion: platform.installer/service-manifest/v1alpha1
kind: ServiceManifest
metadata:
  id: keepalived
  version: "1.0.0-alpha.1"
  displayName: Keepalived
  description: IPv4 unicast VRRP ownership for one deployment-owned virtual address set
  category: network
modes:
  vrrp-unicast:
    displayName: Unicast VRRP
    description: Two or more inventory hosts participate in one deployment-owned VRRP election domain
    memberRoles: []
    placement: {explicit: true, hostScoped: true, minMembers: 2, distinctHosts: true}
    x-maturity: implemented-net-02
capabilities: [service.keepalived.vip]
endpointProvider: {}
dependencies: []
configurationSchema: {$ref: configuration.schema.json}
configuration:
  additionalProperties: false
  settings:
    advertInterval: {kind: MANAGED, roleVariable: platform_keepalived_advert_interval, type: integer, scopes: [deployment], validation: {minimum: 1, maximum: 60}, ui: {label: Advert interval, section: VRRP, order: 30}}
    haproxyHealthCheck:
      kind: MANAGED
      roleVariable: platform_keepalived_haproxy_health_check
      type: object
      scopes: [deployment]
      validation: {additionalProperties: false}
      schema:
        type: object
        additionalProperties: false
        properties:
          interval: {type: integer, minimum: 1, maximum: 60}
          timeout: {type: integer, minimum: 1, maximum: 60}
          fall: {type: integer, minimum: 1, maximum: 20}
          rise: {type: integer, minimum: 1, maximum: 20}
      ui: {label: Future HAProxy health check, section: Integration, order: 40}
    haproxyHealthTracking: {kind: MANAGED, roleVariable: platform_keepalived_haproxy_health_tracking, type: object, scopes: [deployment], validation: {additionalProperties: false}, schema: {type: object, additionalProperties: false, required: [serviceDeploymentRef], properties: {serviceDeploymentRef: {type: string, minLength: 1}}}, ui: {label: HAProxy health tracking, section: Integration, order: 50}}
    advancedConfig:
      kind: ADVANCED
      roleVariable: platform_keepalived_advanced_config
      type: object
      scopes: [deployment]
      validation: {additionalProperties: false}
      schema:
        type: object
        additionalProperties: false
        properties:
          instance:
            type: object
            additionalProperties: false
            properties:
              garp_master_delay: {type: integer, minimum: 0, maximum: 60}
              garp_master_repeat: {type: integer, minimum: 1, maximum: 20}
      ui: {label: Advanced Keepalived settings, section: Advanced, order: 90}
x-reservedAdvancedProperties: [state, nopreempt, virtual_router_id, virtual_ipaddress, interface, priority, unicast_src_ip, unicast_peer, vrrp_script, track_script, script, weight]
roleEntrypoints:
  apply: {fqcn: platform.keepalived.keepalived, variablesPrefix: platform_keepalived_}
  verify: {fqcn: platform.keepalived.keepalived, variablesPrefix: platform_keepalived_}
artifacts: []
runtimeRequirements:
  - id: keepalived
    name: keepalived
    version: ""
    os: redos
    architecture: x86_64
    requiredOffline: false
compatibilityRef: compatibility.yml
