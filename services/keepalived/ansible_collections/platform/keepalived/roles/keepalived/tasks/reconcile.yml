---
- name: Включение автозапуска и запуск Keepalived
  ansible.builtin.systemd:
    name: "{{ platform_keepalived_service_name }}"
    enabled: true
    state: started
  register: platform_keepalived_service

- name: Перечитывание конфигурации Keepalived после проверки изменений на всём кластере
  ansible.builtin.systemd:
    name: "{{ platform_keepalived_service_name }}"
    state: reloaded
  when:
    - platform_keepalived_active_install.changed | default(false)
    - not (platform_keepalived_service.changed | default(false))
