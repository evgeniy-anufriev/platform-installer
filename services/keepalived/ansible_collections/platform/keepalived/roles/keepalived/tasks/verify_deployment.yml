---
- name: Определение владения локальным настроенным виртуальным адресом
  ansible.builtin.set_fact:
    _platform_keepalived_expected_addresses: "{{ platform_keepalived_deployment.value.virtualAddresses | map(attribute='address') | list }}"
    _platform_keepalived_owned_addresses: "{{ platform_keepalived_deployment.value.virtualAddresses | map(attribute='address') | select('in', platform_keepalived_ipv4_addresses.stdout) | list }}"

- name: Запись владения локальным виртуальным адресом
  ansible.builtin.set_fact:
    platform_keepalived_local_ownership: "{{ platform_keepalived_local_ownership | combine({platform_keepalived_deployment.key: _platform_keepalived_owned_addresses}) }}"

- name: Отклонить разделение или неполное владение локальным виртуальным адресом
  ansible.builtin.assert:
    that:
      - _platform_keepalived_owned_addresses | length == 0 or _platform_keepalived_owned_addresses | length == _platform_keepalived_expected_addresses | length
    fail_msg: KEEPALIVED_VIRTUAL_ADDRESS_SPLIT_OR_MISSING

- name: Инициализация свидетельства владения VRRP на уровне всего развертывания
  ansible.builtin.set_fact:
    _platform_keepalived_full_owners: []
    _platform_keepalived_empty_owners: []
    _platform_keepalived_participants: []
  run_once: true

- name: Классифицировать каждого участника VRRP по полному владению
  ansible.builtin.set_fact:
    _platform_keepalived_full_owners: >-
      {{ _platform_keepalived_full_owners +
         ([platform_keepalived_participant] if
          (hostvars[platform_keepalived_participant].platform_keepalived_local_ownership[platform_keepalived_deployment.key] | default([]) | length) ==
          (_platform_keepalived_expected_addresses | length) else []) }}
    _platform_keepalived_empty_owners: >-
      {{ _platform_keepalived_empty_owners +
         ([platform_keepalived_participant] if
          (hostvars[platform_keepalived_participant].platform_keepalived_local_ownership[platform_keepalived_deployment.key] | default([]) | length) == 0 else []) }}
    _platform_keepalived_participants: "{{ _platform_keepalived_participants + [platform_keepalived_participant] }}"
  loop: "{{ groups['platform_targets'] | default([]) | sort }}"
  loop_control:
    loop_var: platform_keepalived_participant
  when: platform_keepalived_deployment.key in (hostvars[platform_keepalived_participant].platform_deployments | default({}))
  run_once: true

- name: Подтвердить одного владельца MASTER и не владельца BACKUP для экземпляра VRRP
  ansible.builtin.assert:
    that:
      - _platform_keepalived_participants | length >= 2
      - _platform_keepalived_full_owners | length == 1
      - _platform_keepalived_empty_owners | length == (_platform_keepalived_participants | length - 1)
    fail_msg: KEEPALIVED_VRRP_OWNERSHIP_INVALID
  run_once: true

- name: "Показать результаты проверки владельца VIP без чувствительных данных"
  ansible.builtin.debug:
    msg:
      deployment: "{{ platform_keepalived_deployment.key }}"
      owner: "{{ _platform_keepalived_full_owners }}"
      backupParticipants: "{{ _platform_keepalived_empty_owners }}"
      virtualAddresses: "{{ _platform_keepalived_expected_addresses }}"
  run_once: true
