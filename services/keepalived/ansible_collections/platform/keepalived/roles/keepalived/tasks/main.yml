---
- name: Validate Keepalived role inputs
  ansible.builtin.include_tasks: validate.yml

- name: Prepare and validate a Keepalived candidate
  ansible.builtin.include_tasks: prepare.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'prepare'

- name: Install and validate the prepared Keepalived candidate
  ansible.builtin.include_tasks: activate.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'activate'

- name: Reconcile Keepalived only after cluster activation validation
  ansible.builtin.include_tasks: reconcile.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'reconcile'

- name: Verify Keepalived runtime ownership read-only
  ansible.builtin.include_tasks: verify.yml
  when: platform_keepalived_verify_only | bool
