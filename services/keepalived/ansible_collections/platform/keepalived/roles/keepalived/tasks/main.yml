---
- name: Проверка настроек ресурсов переносимой службы
  ansible.builtin.include_role:
    name: platform.core.project_settings

- name: Проверка разрешенных источников артефактов Keepalived перед изменением
  ansible.builtin.include_role:
    name: platform.core.artifact_source_gate
  vars:
    platform_artifact_requirements:
      - {id: keepalived, name: keepalived}
  when:
    - platform_resolved_artifact_sources is defined or (platform_artifact_source_authority_active | default(false))
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'prepare'

- name: Доставка выбранных автономных артефактов Keepalived
  ansible.builtin.include_role:
    name: platform.core.artifact_delivery
  vars:
    platform_artifact_delivery_requirements:
      - {id: keepalived, name: keepalived}
  when:
    - platform_resolved_artifact_sources is defined
    - platform_resolved_artifact_sources.keepalived.source == 'OFFLINE_BUNDLE'
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'prepare'

- name: Проверка входных данных роли Keepalived
  ansible.builtin.include_tasks: validate.yml

- name: Подготовка и проверка кандидата Keepalived
  ansible.builtin.include_tasks: prepare.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'prepare'

- name: Установка и проверка подготовленного кандидата Keepalived
  ansible.builtin.include_tasks: activate.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'activate'

- name: Согласование Keepalived только после проверки активации кластера
  ansible.builtin.include_tasks: reconcile.yml
  when:
    - not (platform_keepalived_verify_only | bool)
    - platform_keepalived_lifecycle_phase == 'reconcile'

- name: Проверка принадлежности runtime-объектов Keepalived без изменений
  ansible.builtin.include_tasks: verify.yml
  when: platform_keepalived_verify_only | bool
