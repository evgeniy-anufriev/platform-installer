---
- name: Проверка вспомогательных атрибутов готовности HAProxy, доступных только для чтения
  ansible.builtin.stat:
    path: "{{ platform_keepalived_haproxy_check_path }}"
    get_mime: false
    get_attributes: false
    get_checksum: false
  register: platform_keepalived_haproxy_helper_stat

- name: Подтверждение владельца и прав скрипта проверки готовности HAProxy
  ansible.builtin.assert:
    that:
      - platform_keepalived_haproxy_helper_stat.stat.exists
      - platform_keepalived_haproxy_helper_stat.stat.pw_name == 'root'
      - platform_keepalived_haproxy_helper_stat.stat.gr_name == 'root'
      - platform_keepalived_haproxy_helper_stat.stat.mode == '0750'
    fail_msg: KEEPALIVED_HAPROXY_HELPER_ATTRIBUTES_INVALID

- name: Чтение вспомогательного содержимого готовности HAProxy
  ansible.builtin.slurp:
    src: "{{ platform_keepalived_haproxy_check_path }}"
  register: platform_keepalived_haproxy_helper_content

- name: "Проверка локальности и таймаутов скрипта проверки готовности HAProxy"
  ansible.builtin.assert:
    that:
      - platform_keepalived_haproxy_helper_content.content | b64decode is search('systemctl is-active --quiet haproxy')
      - platform_keepalived_haproxy_helper_content.content | b64decode is search('timeout 2')
      - platform_keepalived_haproxy_helper_content.content | b64decode is search('socat -T 1')
      - platform_keepalived_haproxy_helper_content.content | b64decode is search('show info')
    fail_msg: KEEPALIVED_HAPROXY_HELPER_CONTENT_INVALID

- name: Получение состояния службы HAProxy без внесения изменений
  ansible.builtin.command:
    argv: [systemctl, is-active, haproxy]
  register: platform_keepalived_haproxy_service_state
  changed_when: false

- name: Проверка того, что служба HAProxy активна для отслеживания
  ansible.builtin.assert:
    that: platform_keepalived_haproxy_service_state.stdout | trim == 'active'
    fail_msg: KEEPALIVED_HAPROXY_SERVICE_NOT_ACTIVE

- name: Запуск помощника готовности HAProxy только для чтения
  ansible.builtin.command:
    argv: ["{{ platform_keepalived_haproxy_check_path }}"]
  changed_when: false

- name: Чтение активной конфигурации Keepalived
  ansible.builtin.slurp:
    src: "{{ platform_keepalived_config_file }}"
  register: platform_keepalived_active_config_content

- name: Подтверждение активной конфигурации отслеживания HAProxy
  ansible.builtin.assert:
    that:
      - platform_keepalived_active_config_content.content | b64decode is search('vrrp_script platform_haproxy_ready_' ~ (platform_keepalived_tracking_deployment.key | replace('-', '_') | replace('.', '_')))
      - platform_keepalived_active_config_content.content | b64decode is search('track_script')
      - platform_keepalived_active_config_content.content | b64decode is search('state BACKUP')
      - platform_keepalived_active_config_content.content | b64decode is search('nopreempt')
      - platform_keepalived_active_config_content.content | b64decode is not search('(^|\\s)weight(\\s|$)')
    fail_msg: KEEPALIVED_HAPROXY_TRACKING_CONFIGURATION_INVALID
