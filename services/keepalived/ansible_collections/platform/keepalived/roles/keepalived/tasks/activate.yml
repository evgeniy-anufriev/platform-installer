---
- name: Пересчитать подготовленную контрольную сумму кандидата Keepalived
  ansible.builtin.stat:
    path: "{{ platform_keepalived_candidate_file }}"
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: platform_keepalived_activation_candidate_stat

- name: "Проверить, что активируется конфигурация Keepalived, проверенная на этапе A"
  ansible.builtin.assert:
    that:
      - platform_keepalived_activation_candidate_stat.stat.exists
      - platform_keepalived_activation_candidate_stat.stat.checksum == platform_keepalived_candidate_checksum
    fail_msg: KEEPALIVED_CANDIDATE_CHANGED_AFTER_PHASE_A

- name: Атомарно установить точную проверенную конфигурацию Keepalived
  ansible.builtin.copy:
    src: "{{ platform_keepalived_candidate_file }}"
    dest: "{{ platform_keepalived_config_file }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  register: platform_keepalived_active_install

- name: Вычислить контрольную сумму активной конфигурации Keepalived
  ansible.builtin.stat:
    path: "{{ platform_keepalived_config_file }}"
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: platform_keepalived_active_stat

- name: Подтвердить активную конфигурацию, точно соответствующую проверенному кандидату
  ansible.builtin.assert:
    that: platform_keepalived_active_stat.stat.checksum == platform_keepalived_candidate_checksum
    fail_msg: KEEPALIVED_ACTIVE_CONFIG_CHECKSUM_MISMATCH

- name: Проверка активной конфигурации Keepalived с помощью встроенных инструментов
  ansible.builtin.command:
    argv: ["{{ platform_keepalived_binary }}", --config-test, "--use-file={{ platform_keepalived_config_file }}"]
  register: platform_keepalived_active_validation
  changed_when: false
  failed_when: false

- name: Запись активного доказательства проверки Keepalived
  ansible.builtin.set_fact:
    platform_keepalived_active_checksum: "{{ platform_keepalived_active_stat.stat.checksum }}"
    platform_keepalived_active_validation_rc: "{{ platform_keepalived_active_validation.rc }}"
