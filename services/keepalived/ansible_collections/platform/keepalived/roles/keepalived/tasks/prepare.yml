---
- name: Установить одобренный пакет Keepalived из настроенных системных репозиториев
  ansible.builtin.package:
    name: "{{ platform_keepalived_package }}"
    state: present
  when: >-
    platform_resolved_artifact_sources is not defined or
    platform_resolved_artifact_sources.keepalived.source == 'REPOSITORY'

- name: "Создать каталог скрипта проверки готовности HAProxy для Keepalived"
  ansible.builtin.file:
    path: "{{ platform_keepalived_haproxy_check_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Установить скрипт проверки готовности HAProxy из пакета"
  ansible.builtin.template:
    src: check-haproxy-ready.sh.j2
    dest: "{{ platform_keepalived_haproxy_check_path }}"
    owner: root
    group: root
    mode: '0750'

- name: Отрисовка конфигурации-кандидата Keepalived
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ platform_keepalived_candidate_file }}"
    owner: root
    group: root
    mode: '0600'

- name: Проверка кандидата Keepalived с помощью встроенных инструментов
  ansible.builtin.command:
    argv: ["{{ platform_keepalived_binary }}", --config-test, "--use-file={{ platform_keepalived_candidate_file }}"]
  register: platform_keepalived_candidate_validation
  changed_when: false
  failed_when: false

- name: Вычислить проверенную контрольную сумму кандидата Keepalived
  ansible.builtin.stat:
    path: "{{ platform_keepalived_candidate_file }}"
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: platform_keepalived_candidate_stat

- name: Записать свидетельство проверки кандидата Keepalived
  ansible.builtin.set_fact:
    platform_keepalived_candidate_checksum: "{{ platform_keepalived_candidate_stat.stat.checksum }}"
    platform_keepalived_candidate_validation_rc: "{{ platform_keepalived_candidate_validation.rc }}"
